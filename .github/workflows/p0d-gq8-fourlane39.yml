      - name: Native Luau compile actual39 and OFF31
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8four -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8four --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from quality_gameplay.gq8_crosslane_20261118.compose_rehearsal36 import flatten
          for path,count in [('artifacts/fourlane39/FOURLANE39.project.json',39),('artifacts/current31/CURRENT31_REAL_SOURCE.project.json',31)]:
              _,items=flatten(Path(path))
              assert len(items)==count
              for p in items.values():
                  subprocess.run(['/tmp/gq8four/luau-compile','--text',str(p)],check=True,stdout=subprocess.DEVNULL)
              print('GQ8_FOURLANE_NATIVE',count)
          PY
      - name: Rojo7.7.1 Source Class ON39 and OFF31
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq8four-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq8four-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq8four-rojo.zip') as z:
              names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(names)==1
              p=Path('/tmp/gq8four-rojo');p.write_bytes(z.read(names[0]));p.chmod(0o755)
          PY
