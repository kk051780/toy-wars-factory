          gh run list --repo "$GITHUB_REPOSITORY" --workflow p0d-rc-eggrumble-v3-31.yml --branch rc/p0d-s1-kids-rc01 --limit 70 --json databaseId,headSha,status,conclusion > /tmp/runs.json
