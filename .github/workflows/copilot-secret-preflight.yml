name: TOY WARS secure Copilot secret presence check
on:
  push:
    branches:
      - setup/agentic-runtime-probe
    paths:
      - .github/workflows/copilot-secret-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SECRET_PRESENT: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
    steps:
      - name: Verify secret configured without printing it
        run: |
          if [ "$SECRET_PRESENT" = "true" ]; then
            echo "COPILOT_SECRET_PRESENT=YES" >> "$GITHUB_STEP_SUMMARY"
            echo "SECRET_PRESENCE_PASS"
          else
            echo "COPILOT_SECRET_PRESENT=NO" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::COPILOT_GITHUB_TOKEN is not configured for this repository"
            exit 1
          fi
          echo "This does NOT validate the token itself, the user's Copilot entitlements, or initiate AI inference." >> "$GITHUB_STEP_SUMMARY"
