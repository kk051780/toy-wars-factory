name: P0D GQ optional FX on REAL original+ART+SCORE 28-source private Place
on:
  push:
    branches:
      - feature/p0d-gq-combat-fx-clarity-20261116-01
  pull_request:
    paths:
      - 'handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/**'
      - '.github/workflows/p0d-gq-current28-fx-overlay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current28-private:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original #482 game, #484 integration, #485 ART, #487 SCORE exact sources
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _v3_original
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 81088f99b2ea60bbffc0eaa860c46338203f0808
          path: _v3_quality
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _v3_art
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _v3_score
          persist-credentials: false
      - name: Verify each owner head and our isolated source constraints
        run: |
          set -euo pipefail
          test "$(git -C _v3_original rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _v3_quality rev-parse HEAD)" = 81088f99b2ea60bbffc0eaa860c46338203f0808
          test "$(git -C _v3_art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _v3_score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
          python3 -B -m unittest discover -s handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/tests -p 'test_*.py' -v
      - name: Original artist's own exact author 21 plus ART four composer
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py \
            --target v3 \
            --author-project _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json \
            --out artifacts/GQ_V3_LATEST_ART.project.json
      - name: Original quality #484 26-source composer, not a replacement Game
        run: |
          set -euo pipefail
          python3 _v3_quality/quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py \
            --author _v3_original --quality _v3_quality --art _v3_art --score _v3_score \
            --art-project artifacts/GQ_V3_LATEST_ART.project.json \
            --out artifacts/EGGRUMBLE_V3_GQ_26.project.json
      - name: Append only our two optional client source mappings to real 26
        run: |
          set -euo pipefail
          python3 handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/tools/overlay_current26_fx.py \
            --base-project artifacts/EGGRUMBLE_V3_GQ_26.project.json \
            --base-receipt artifacts/SOURCE_RECEIPT.json \
            --fx-budget handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/EGGRUMBLE_CombatFXBudget.luau \
            --fx-client handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/EGGRUMBLE_CombatFXClarity.client.luau \
            --out artifacts/EGGRUMBLE_V3_GQ_FX_28.project.json
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq_luau
          persist-credentials: false
      - name: Native-compile 28 actual game+ART+SCORE+FX sources and execute native FX behavioral spec
        run: |
          set -euo pipefail
          test "$(git -C _gq_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _gq_luau -B /tmp/gq_fx_28_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_fx_28_native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path("artifacts/EGGRUMBLE_V3_GQ_FX_28.project.json")
          def walk(n):
              if isinstance(n,dict):
                  if "$path" in n:yield (p.parent/n["$path"]).resolve(strict=True)
                  else:
                      for key,val in n.items():
                          if not key.startswith("$"):yield from walk(val)
          files=list(walk(json.loads(p.read_text())["tree"]))
          assert len(files)==28
          for f in files:
              subprocess.run(["/tmp/gq_fx_28_native/luau-compile","--text",str(f)],check=True,stdout=subprocess.DEVNULL)
          print("NATIVE_COMPILE_ORIGINAL_26_PLUS_FX_2_PASS",len(files))
          PY
          /tmp/gq_fx_28_native/luau handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/tests/EGGRUMBLE_CombatFXBudget.spec.luau
      - name: Pinned Rojo build of unpublished 28-source Place
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_fx28_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_fx28_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq_fx28_rojo.zip') as z:
              items=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(items)==1
              p=Path('/tmp/gq_fx28_rojo');p.write_bytes(z.read(items[0]));p.chmod(0o755)
          PY
          /tmp/gq_fx28_rojo build artifacts/EGGRUMBLE_V3_GQ_FX_28.project.json -o artifacts/EGGRUMBLE_V3_GQ_FX_28_PRIVATE.rbxlx
      - name: Exact 28-of-28 embedded Lua source classes, original 26 ownership and receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('artifacts/EGGRUMBLE_V3_GQ_FX_28.project.json')
          place=Path('artifacts/EGGRUMBLE_V3_GQ_FX_28_PRIVATE.rbxlx')
          receipt_path=Path('artifacts/GQ_FX_28_RECEIPT.json')
          receipt=json.loads(receipt_path.read_text(encoding='utf-8'))
          original=json.loads(Path('artifacts/SOURCE_RECEIPT.json').read_text(encoding='utf-8'))
          def expected_map(tree):
              result={}
              for name,obj in tree.items():
                  if name.startswith('$') or not isinstance(obj,dict):continue
                  if '$path' in obj:
                      path=(p.parent/obj['$path']).resolve(strict=True)
                      cls='Script' if path.name.endswith('.server.luau') else ('LocalScript' if path.name.endswith('.client.luau') else 'ModuleScript')
                      assert name not in result,name
                      result[name]=(cls,path.read_text(encoding='utf-8').replace('\r\n','\n'))
                      assert receipt['source_sha256'][name]==hashlib.sha256(path.read_bytes()).hexdigest()
                  else:result.update(expected_map(obj))
              return result
          expected=expected_map(json.loads(p.read_text(encoding='utf-8'))['tree'])
          assert len(expected)==28
          actual={}
          for item in ET.fromstring(place.read_bytes()).iter('Item'):
              cls=item.attrib.get('class')
              if cls not in ('Script','LocalScript','ModuleScript'):continue
              props=item.find('Properties')
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              source=props.findtext("ProtectedString[@name='Source']")
              if source is None:source=props.findtext("string[@name='Source']")
              assert name is not None and source is not None and name not in actual
              actual[name]=(cls,source.replace('\r\n','\n'))
          assert actual==expected,{'missing':set(expected)-set(actual),'extra':set(actual)-set(expected)}
          assert receipt['original_26_sources_preserved']
          for name,sha in original['source_sha256'].items():
              assert receipt['source_sha256'][name]==sha,('original drift',name)
          receipt['private_place_bytes']=place.stat().st_size
          receipt['private_place_sha256']=hashlib.sha256(place.read_bytes()).hexdigest()
          receipt_path.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('GQ_FX_REAL_COMPOSITE_SOURCE_EXACT_28_OF_28_PASS',receipt['private_place_bytes'],receipt['private_place_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EGGRUMBLE-GQ-FX-28-REAL-COMPOSITE-PRIVATE-NO-RC
          path: |
            artifacts/EGGRUMBLE_V3_GQ_FX_28.project.json
            artifacts/EGGRUMBLE_V3_GQ_FX_28_PRIVATE.rbxlx
            artifacts/GQ_FX_28_RECEIPT.json
            artifacts/SOURCE_RECEIPT.json
          retention-days: 7
