name: P0D FB011 real sea visual PREP source-only QA
on:
  push:
    branches:
      - feature/p0d-fb011-sea-beauty-v1-20261114
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sea-source-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: FB011 source pins and OFF rollback
        run: python3 -B -m unittest discover -s rc_fastlane -p 'test_fb011_sea_visual.py' -v
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_luau
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: /tmp/p0d_native_luau
          key: p0d-rc-luau-ubuntu-f46d879e28302-v1
      - name: Native Luau syntax (not Roblox Studio)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          if [ ! -x /tmp/p0d_native_luau/luau-compile ]; then
            cmake -S _p0d_luau -B /tmp/p0d_native_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
            cmake --build /tmp/p0d_native_luau --target Luau.Compile.CLI --parallel 4
          fi
          /tmp/p0d_native_luau/luau-compile rc_fastlane/features/owner364_sea/FB011SeaVisual.server.luau >/tmp/fb011_native.txt
          echo "FB011_NATIVE_COMPILE_PASS_NO_STUDIO_NO_RC_NO_FUN"
