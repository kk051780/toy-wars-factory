name: P0D private H1 optional DEV Dojo profile via existing Hatch DataStore
on:
  push:
    branches:
      - experiment/p0d-h1-dojo-save-20261113-01
    paths:
      - 'handoffs/P0D-H1-DOJO-SAVE-20261113-01/**'
      - '.github/workflows/p0d-h1-dojo-save-20261113.yml'
  workflow_dispatch:
jobs:
  one-profile-native-and-rojo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Original exact sources and add-only bounded profile patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -B handoffs/P0D-H1-DOJO-SAVE-20261113-01/tests/test_durable_source.py
          python3 -B handoffs/P0D-H1-AUTO-DOJO-20261113-01/tests/test_dojo_source.py
          python3 -B handoffs/P0D-B42-V7-SKYCASTLE-SOLO-20261113-01/tests/test_solo_integration.py
          python3 -B handoffs/P0D-B42-V7-SKYCASTLE-20261113-01/tests/test_skycastle_original.py
      - name: Rebuild all 44 original source scripts then patch only Store Game HUD
        shell: bash
        run: |
          set -euo pipefail
          python3 -B handoffs/P0D-H1-DOJO-SAVE-20261113-01/tools/assemble.py --assemble
          python3 -B handoffs/P0D-H1-DOJO-SAVE-20261113-01/tests/test_durable_source.py
      - name: Checkout frozen native Luau source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_luau
          fetch-depth: 1
          persist-credentials: false
      - name: Build native Luau compiler and VM
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_luau -B /tmp/p0d_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_luau --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
      - name: Genuine 44 Luau plus atomic duplicate/retry reload mock test
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-H1-DOJO-SAVE-20261113-01
          DIST="$ROOT/dist/EGG_RAID_RUMBLE_H1_DOJO_DURABLE_DEV_PRIVATE"
          n=0
          while IFS= read -r -d '' p; do
            /tmp/p0d_luau/luau-compile "$p" >/tmp/p0d_compile_errors.log 2>&1 || { cat /tmp/p0d_compile_errors.log; exit 1; }
            n=$((n+1))
          done < <(find "$DIST/src" -type f -name '*.luau' -print0)
          test "$n" -eq 44
          python3 -B "$ROOT/tools/generate_native_store_test.py" --write /tmp/p0d_durable_store.luau
          /tmp/p0d_luau/luau-compile /tmp/p0d_durable_store.luau >/dev/null
          /tmp/p0d_luau/luau /tmp/p0d_durable_store.luau | tee /tmp/p0d_durable_store.log
          grep -E '^P0D_H1_DOJO_DURABLE_NATIVE_[0-9]+_ASSERTIONS_PASS$' /tmp/p0d_durable_store.log
          python3 -B handoffs/P0D-H1-AUTO-DOJO-20261113-01/tools/generate_native_dojo.py --write /tmp/p0d_dojo.luau
          /tmp/p0d_luau/luau /tmp/p0d_dojo.luau | grep -F 'P0D_H1_DOJO_NATIVE_47_ASSERTIONS_PASS'
          python3 -B handoffs/P0D-B42-V7-SKYCASTLE-SOLO-20261113-01/tools/generate_native_studio_solo.py --write /tmp/p0d_solo.luau
          /tmp/p0d_luau/luau /tmp/p0d_solo.luau | grep -F 'P0D_S1_STUDIO_SOLO_NATIVE_30_ASSERTIONS_PASS'
          python3 -B handoffs/P0D-FIRST90-MUSOUV7-UPGRADE-20261113-01/tools/generate_native_horde_state_test.py --write /tmp/p0d_horde.luau
          /tmp/p0d_luau/luau /tmp/p0d_horde.luau | grep -F 'MUSOU_HORDE_NATIVE_79_STATE_ASSERTIONS_PASS'
          python3 -B handoffs/P0D-FIRST90-GUIDED-H1-20261113-01/tools/generate_native_first90.py --write /tmp/p0d_first90.luau
          /tmp/p0d_luau/luau /tmp/p0d_first90.luau | grep -F 'P0D_FIRST90_NATIVE_48_ASSERTIONS_PASS'
          python3 -B handoffs/P0D-FIRST90-GUIDED-H1-20261113-01/tools/generate_native_waypoint.py --write /tmp/p0d_waypoint.luau
          /tmp/p0d_luau/luau /tmp/p0d_waypoint.luau | grep -F 'P0D_FIRST90_WAYPOINT_NATIVE_39_ASSERTIONS_PASS'
          echo P0D_H1_DOJO_DURABLE_NATIVE_44_SOURCE_AND_STORE_SUCCESS
      - name: Obtain pinned genuine Rojo with checksum
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/rojo77.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/rojo77.zip' | sha256sum -c
          python3 - <<'PY'
          import pathlib,stat,zipfile
          with zipfile.ZipFile("/tmp/rojo77.zip") as z:
              files=[x for x in z.namelist() if x.split("/")[-1]=="rojo"]
              assert len(files)==1
              p=pathlib.Path("/tmp/rojo77")
              p.write_bytes(z.read(files[0]))
              p.chmod(p.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/rojo77 --version | grep -F '7.7.1'
      - name: True private unpublished Place exact original 44 source XML
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-H1-DOJO-SAVE-20261113-01
          DIST="$ROOT/dist/EGG_RAID_RUMBLE_H1_DOJO_DURABLE_DEV_PRIVATE"
          mkdir -p /tmp/p0d_private
          /tmp/rojo77 build "$DIST/default.project.json" -o /tmp/p0d_private/P0D_H1_DOJO_DURABLE_DEV_PRIVATE.rbxlx
          cp "$DIST/SOURCE_LOCK.json" /tmp/p0d_private/SOURCE_LOCK.json
          cp /tmp/p0d_durable_store.log /tmp/p0d_private/NATIVE_DURABLE_STORE_QA.txt
          python3 - <<'PY'
          import collections,hashlib,json,pathlib,xml.etree.ElementTree as ET
          root=pathlib.Path("handoffs/P0D-H1-DOJO-SAVE-20261113-01/dist/EGG_RAID_RUMBLE_H1_DOJO_DURABLE_DEV_PRIVATE")
          place=pathlib.Path("/tmp/p0d_private/P0D_H1_DOJO_DURABLE_DEV_PRIVATE.rbxlx")
          expected=collections.Counter(p.read_text("utf8") for p in (root/"src").rglob("*.luau"))
          actual=collections.Counter();counts=collections.Counter();game=0;world=0
          for i in ET.fromstring(place.read_bytes()).iter("Item"):
              cls=i.get("class")
              if cls not in ("Script","LocalScript","ModuleScript"):continue
              source=i.find("./Properties/string[@name='Source']")
              if source is None:continue
              actual[source.text or ""]+=1;counts[cls]+=1
              name=i.find("./Properties/string[@name='Name']")
              if cls=="Script" and name is not None and name.text=="Game":game+=1
              if cls=="Script" and name is not None and name.text=="H1FunWorld":world+=1
          assert counts=={"Script":2,"LocalScript":5,"ModuleScript":37},counts
          assert actual==expected and sum(actual.values())==44
          assert game==1 and world==1
          assert sum("remote.OnServerEvent:Connect(" in s for s in actual)==1
          assert any("function Store.persistDojo(" in s for s in actual)
          assert any("Dojo.FRIEND_XP_MULTIPLIER = 1.5" in s for s in actual)
          receipt={"place_sha256":hashlib.sha256(place.read_bytes()).hexdigest(),
             "source_scripts":44,"one_Game":True,"one_World":True,
             "optional_same_DEV_profile":True,"Studio_API_save":"NOT_TESTED",
             "owner_Studio1client":"NOT_TESTED","Studio2client":"NOT_TESTED",
             "Android":"NOT_TESTED","FUN":"NOT_TESTED",
             "official_S1_RC_adopted":False,"published":False}
          pathlib.Path("/tmp/p0d_private/PLACE_RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("P0D_H1_DOJO_DURABLE_REAL_ROJO_44_OF_44_PASS",receipt["place_sha256"])
          PY
      - name: Upload unpublished private Studio trial
        uses: actions/upload-artifact@v4
        with:
          name: P0D-H1-DOJO-DURABLE-DEV-SAME-PROFILE-44-PRIVATE
          path: /tmp/p0d_private/
          retention-days: 7
          if-no-files-found: error
