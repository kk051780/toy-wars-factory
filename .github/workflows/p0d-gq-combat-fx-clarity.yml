name: P0D GQ isolated combat FX clarity SOURCE gate
on:
  push:
    branches:
      - feature/p0d-gq-combat-fx-clarity-20261116-01
  pull_request:
    paths:
      - 'handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/**'
      - '.github/workflows/p0d-gq-combat-fx-clarity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated source negative tests; never claimed as Studio/Android
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/tests -p 'test_*.py' -v
      - name: Pinned native Luau compiler
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq_fx_pinned_luau
          persist-credentials: false
      - name: Native parse every mapped original and optional script
        run: |
          set -euo pipefail
          test "$(git -C _gq_fx_pinned_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _gq_fx_pinned_luau -B /tmp/gq_fx_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_fx_luau --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/EGGRUMBLE_V3_FX_CLARITY.project.json')
          def walk(n):
              if isinstance(n,dict):
                  if '$path' in n:yield (p.parent/n['$path']).resolve(strict=True)
                  else:
                      for k,v in n.items():
                          if k!='$path':yield from walk(v)
          files=list(walk(json.loads(p.read_text())['tree']))
          assert len(files)==23
          for f in files:
              subprocess.run(['/tmp/gq_fx_luau/luau-compile','--text',str(f)],check=True,stdout=subprocess.DEVNULL)
          print('PINNED_NATIVE_COMPILE_23_OF_23_PASS')
          PY
      - name: Execute REAL native Luau FX policy cases
        run: |
          set -euo pipefail
          /tmp/gq_fx_luau/luau handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/tests/EGGRUMBLE_CombatFXBudget.spec.luau
          echo "NATIVE_VM_FX_POLICY_22_ASSERTIONS_PASS"
      - name: Install pinned Rojo binary with checksum verification
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_fx_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_fx_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq_fx_rojo.zip') as z:
              ps=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(ps)==1
              path=Path('/tmp/gq_fx_rojo')
              path.write_bytes(z.read(ps[0]))
              path.chmod(0o755)
          PY
          mkdir -p artifacts
          /tmp/gq_fx_rojo build handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/EGGRUMBLE_V3_FX_CLARITY.project.json -o artifacts/EGGRUMBLE_GQ_FX_23_PRIVATE.rbxlx
      - name: Exact Place source/class/byte audit and pinned HEAD receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          project=Path('handoffs/P0D-GQ-COMBAT-FX-CLARITY-20261116/EGGRUMBLE_V3_FX_CLARITY.project.json')
          place=Path('artifacts/EGGRUMBLE_GQ_FX_23_PRIVATE.rbxlx')
          def paths(node):
              out={}
              for name,val in node.items():
                  if name.startswith('$') or not isinstance(val,dict):continue
                  if '$path' in val:
                      path=(project.parent/val['$path']).resolve(strict=True)
                      cls='Script' if path.name.endswith('.server.luau') else ('LocalScript' if path.name.endswith('.client.luau') else 'ModuleScript')
                      assert name not in out
                      out[name]=(path,cls)
                  else:out.update(paths(val))
              return out
          expected=paths(json.loads(project.read_text())['tree'])
          assert len(expected)==23
          actual={}
          xml=ET.fromstring(place.read_bytes())
          for item in xml.iter('Item'):
              cls=item.attrib.get('class')
              if cls not in ('Script','LocalScript','ModuleScript'):continue
              props=item.find('Properties')
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              source=props.findtext("ProtectedString[@name='Source']")
              if source is None:source=props.findtext("string[@name='Source']")
              assert name is not None and source is not None
              assert name not in actual,('duplicate',name)
              actual[name]=(cls,source.replace('\r\n','\n'))
          assert len(actual)==23,(len(actual),set(expected)-set(actual))
          for name,(path,cls) in expected.items():
              assert name in actual and actual[name][0]==cls,('class',name)
              assert actual[name][1]==path.read_text(encoding='utf-8').replace('\r\n','\n'),('source-drift',name)
          receipt={'candidate_head':os.environ['GITHUB_SHA'],
                   'author_pinned_head':'fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9',
                   'original_author_sources':21,'new_client_only_sources':2,
                   'source_exact_scripts':23,'private_place_bytes':place.stat().st_size,
                   'private_place_sha256':hashlib.sha256(place.read_bytes()).hexdigest(),
                   'script_sha256':{name:hashlib.sha256(path.read_bytes()).hexdigest() for name,(path,_) in expected.items()},
                   'formal_rc_adopted':False,'studio':'NOT_TESTED','android':'NOT_TESTED',
                   'art':'NO_GO','fun':'NO_GO','owner_accepted':False}
          Path('artifacts/EGGRUMBLE_GQ_FX_RECEIPT.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SOURCE_EXACT_23_OF_23_PASS',receipt['private_place_bytes'],receipt['private_place_sha256'])
          PY
      - name: Keep private test build and exact source receipt (no Roblox Publish)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE-GQ-FX-23-SOURCE-PRIVATE-NO-PUBLISH
          path: |
            artifacts/EGGRUMBLE_GQ_FX_23_PRIVATE.rbxlx
            artifacts/EGGRUMBLE_GQ_FX_RECEIPT.json
          retention-days: 7
