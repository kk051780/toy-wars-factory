name: P0D private RC native QA tool binaries only (no game source)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - '.github/workflows/p0d-private-native-qa-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pin-native-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_pinned_luau
          persist-credentials: false
      - name: Build verified pinned native Luau compiler (no game inputs)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_pinned_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_pinned_luau -B /tmp/p0d_native_tools -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_native_tools --target Luau.Compile.CLI --parallel 4
          test -x /tmp/p0d_native_tools/luau-compile
          mkdir -p p0d-qa-bin
          cp /tmp/p0d_native_tools/luau-compile p0d-qa-bin/luau-compile
          p0d-qa-bin/luau-compile --help >/tmp/p0d_luau_help.txt 2>&1 || test $? -eq 1
      - name: Fetch pinned Rojo v7.7.1 by cryptographic checksum
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip' -o /tmp/p0d_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/p0d_rojo.zip') as archive:
              matches=[n for n in archive.namelist() if n == 'rojo' or n.endswith('/rojo')]
              assert len(matches)==1,matches
              p=Path('p0d-qa-bin/rojo')
              p.write_bytes(archive.read(matches[0]))
              p.chmod(0o755)
          PY
          p0d-qa-bin/rojo --version | grep -F '7.7.1'
      - name: Emit proof of bytes and platform, not source/gameplay acceptance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum p0d-qa-bin/luau-compile p0d-qa-bin/rojo > p0d-qa-bin/BINARY_SHA256SUMS.txt
          cat > p0d-qa-bin/README.txt <<'EOF'
          P0D QA-only Linux x86_64 binaries.
          Luau source pinned f46d879e28302a430029304f7f6a162aed66f103.
          Rojo v7.7.1 archive SHA256 00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4.
          This package contains NO game source, NO Place, NO personal data.
          Native compiler and Rojo build on your actual candidate is a separate test.
          EOF
          test "$(find p0d-qa-bin -type f | wc -l)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: P0D-NATIVE-TOOLS-ONLY-LINUX-X86_64-PRIVATE-LOCAL-QA
          path: p0d-qa-bin/*
          retention-days: 7
          if-no-files-found: error
