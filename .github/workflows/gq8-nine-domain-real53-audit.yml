name: GQ8 nine-domain official Real55 and parent Real53 source audit
on:
  push:
    branches: [quality/gq8-9domain-intake-audit-20261119]
    paths:
      - "quality_gameplay/gq8_9domain_source_gate_20261119/**"
      - ".github/workflows/gq8-nine-domain-real53-audit.yml"
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - "quality_gameplay/gq8_9domain_source_gate_20261119/**"
      - ".github/workflows/gq8-nine-domain-real53-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  nine-domain-verified-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent Python negative mutation regressions
        run: python3 -B quality_gameplay/gq8_9domain_source_gate_20261119/test_audit.py
      - name: Verified immutable Real53 parent + current official RC identity
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          echo "CURRENT_OFFICIAL_RC=$CURRENT"
          echo "CURRENT_OFFICIAL_RC=$CURRENT" >> "$GITHUB_ENV"
          PROOF="$(gh run view 44390823718 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')"
          test "$PROOF" = "96ac3b4caa2f649f98c9e093c864c39555f3616a success" || {
            echo RED_REAL53_PARENT_PROOF_CHANGED; exit 1;
          }
          mkdir -p artifacts/parent53 artifacts/report
          gh run download 44390823718 --repo "$GITHUB_REPOSITORY" \
            --name GQ8-REAL53-MUSOU-INVUL-CURSE-SHOP-PRIVATE-NOT-OFFICIAL \
            --dir artifacts/parent53
          test -s artifacts/parent53/EGGRUMBLE_REAL53.project.json
          test -s artifacts/parent53/B_REAL53_INTAKE_RECEIPT.json
          test -s artifacts/parent53/EGGRUMBLE_REAL53.rbxlx
          OFFICIAL_PROOF="$(gh run view 44393525211 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')"
          test "$OFFICIAL_PROOF" = "$CURRENT success" || { echo RED_REAL55_FORMAL_SAMEHEAD_NOT_VERIFIED; exit 1; }
          mkdir -p artifacts/official55
          gh run download 44393525211 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL55-CANONICAL-PRIVATE-STUDIO \
            --dir artifacts/official55
          test -s artifacts/official55/EGGRUMBLE_REAL55.project.json
          test -s artifacts/official55/B_REAL55_RECEIPT.json
          test -s artifacts/official55/EGGRUMBLE_REAL55.rbxlx
      - name: Inspect official 55 and parent 53 exact source across nine domains
        shell: bash
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq8_9domain_source_gate_20261119/audit.py \
            --project artifacts/parent53/EGGRUMBLE_REAL53.project.json \
            --receipt artifacts/parent53/B_REAL53_INTAKE_RECEIPT.json \
            --count 53 --out artifacts/report/GQ8_9DOMAIN_REAL53_AUDIT.json
          python3 -B quality_gameplay/gq8_9domain_source_gate_20261119/audit.py \
            --project artifacts/official55/EGGRUMBLE_REAL55.project.json \
            --receipt artifacts/official55/B_REAL55_RECEIPT.json \
            --count 55 --out artifacts/report/GQ8_9DOMAIN_OFFICIAL_REAL55_AUDIT.json
          LIVE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$LIVE" = "$CURRENT_OFFICIAL_RC" || { echo RED_OFFICIAL_RC_MOVED_DURING_AUDIT; exit 1; }
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/official55/EGGRUMBLE_REAL55.rbxlx')
          r=json.loads(Path('artifacts/report/GQ8_9DOMAIN_OFFICIAL_REAL55_AUDIT.json').read_text())
          assert r['source_count']==55 and r['source_coverage_count']==9
          result={
            'source_review':'PASS_SOURCE_ONLY',
            'verified_real55_selected_on_formal_rc':True,
            'official_rc_same_head_run':44393525211,
            'official_rc_profile':'eggrumble_v3_real55',
            'parent_real53_pr':826,
            'parent_real53_head':'96ac3b4caa2f649f98c9e093c864c39555f3616a',
            'parent_real53_evidence_run':44390823718,
            'formal_rc_head_at_gate':__import__('os').environ['CURRENT_OFFICIAL_RC'],
            'candidate_place_bytes':p.stat().st_size,
            'candidate_place_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'source_gates':r,
            'native_rojo_off':'FORMAL_REAL55_SAME_HEAD_SUCCESS',
            'studio2client':'NOT_TESTED',
            'android15':'NOT_TESTED','fun':'NO_GO',
            'rollback':'Disable optional Real55 private companion, revert to immutable OFF53 or Core36; rich51 unchanged',
            'target':'rc/p0d-s1-kids-rc01',
            'integration_blocker':'SOURCE_SELECTED; Studio/Android/FUN still NOT_TESTED'
          }
          Path('artifacts/report/GQ8_9DOMAIN_OFFICIAL_REAL55_HANDOFF.json').write_text(json.dumps(result,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          print('GQ8_OFFICIAL_REAL55_9DOMAIN_SOURCE_PRESENCE_PASS_STUDIO_NOT_TESTED',p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-9DOMAIN-OFFICIAL-REAL55-SOURCE-AUDIT
          path: artifacts/report/
          retention-days: 5
          if-no-files-found: error
