name: P0D S1 OFFICIAL RC pinned real Rojo Place gate
on:
  push:
    branches:
      - handoff/p0d-s1-official-rc-real-rojo-20261112-02
permissions:
  contents: read
jobs:
  build-pinned-real-rojo-place:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P0D_GAME: handoffs/P0D-S1-OFFICIAL-RC-ROJO-PLACE-20261112-02/official_src
      P0D_GATE: handoffs/P0D-S1-OFFICIAL-RC-ROJO-PLACE-20261112-02
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm prior immutable full-game source is identical and safe
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cb06618d164d80c411fc5487df1fbcc7a43ce231 HEAD
          git diff --exit-code cb06618d164d80c411fc5487df1fbcc7a43ce231 HEAD -- "$P0D_GAME"
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("handoffs/P0D-S1-OFFICIAL-RC-ROJO-PLACE-20261112-02")
          m=json.loads((root/"BUILD_MANIFEST.json").read_bytes())
          assert set(m)=={"files","format","game_id","packet_id","public_source_allowed","work_id"}
          assert m["format"]=="P0D_PUBLIC_SOURCE_V1" and m["public_source_allowed"] is True
          assert len(m["files"])==4
          for item in m["files"]:
              assert set(item)=={"path","sha256","size"}
              p=root/item["path"]
              assert p.is_file() and not p.is_symlink()
              data=p.read_bytes()
              assert hashlib.sha256(data).hexdigest()==item["sha256"]
              assert len(data)==item["size"]
          print("P0D_OFFICIAL_RC_ROJO_QA_PUBLIC_SOURCE_4_OF_4_SHA256_PASS")
          PY
      - name: Download exact official Rojo 7.7.1 with release SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
            "https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip" \
            --output "$RUNNER_TEMP/rojo-linux-x86_64.zip"
          printf '%s\n' "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $RUNNER_TEMP/rojo-linux-x86_64.zip" | sha256sum -c
          python3 - <<'PY'
          import os, pathlib, stat, zipfile
          archive=pathlib.Path(os.environ["RUNNER_TEMP"])/"rojo-linux-x86_64.zip"
          with zipfile.ZipFile(archive) as z:
              valid=[n for n in z.namelist() if n.rsplit("/",1)[-1]=="rojo"]
              assert len(valid)==1, f"Expected unique Rojo binary, got {valid}"
              binary=z.read(valid[0])
              assert len(binary)>1_000_000
              dst=pathlib.Path(os.environ["RUNNER_TEMP"])/"rojo"
              dst.write_bytes(binary)
              dst.chmod(dst.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          print("P0D_ROJO_RELEASE_BINARY_PINNED_ZIP_SHA256_PASS")
          PY
          "$RUNNER_TEMP/rojo" --version | tee "$RUNNER_TEMP/rojo_version.txt"
          grep -F "7.7.1" "$RUNNER_TEMP/rojo_version.txt"
      - name: Actually build full 20-Luau-source Roblox XML Place using official Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _rojo_artifacts
          "$RUNNER_TEMP/rojo" build "$P0D_GAME/default.project.json" -o "_rojo_artifacts/TRAP_RAIDERS_S1_OFFICIAL_RC.rbxlx"
          test -s "_rojo_artifacts/TRAP_RAIDERS_S1_OFFICIAL_RC.rbxlx"
          echo "P0D_OFFICIAL_RC_REAL_ROJO_BUILD_COMMAND_COMPLETED"
          ls -lh "_rojo_artifacts/TRAP_RAIDERS_S1_OFFICIAL_RC.rbxlx"
      - name: Validate actual exported Place by source pin and exact script mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 "$P0D_GATE/tools/verify_rojo_place.py" \
            --place "_rojo_artifacts/TRAP_RAIDERS_S1_OFFICIAL_RC.rbxlx" \
            --receipt "_rojo_artifacts/VERIFIED_BUILD_RECEIPT.json"
          export P0D_REAL_ROJO_PLACE="$PWD/_rojo_artifacts/TRAP_RAIDERS_S1_OFFICIAL_RC.rbxlx"
          python3 -m unittest discover -s "$P0D_GATE/tests" -p 'test*.py' -v
      - name: Publish only private CI build artifact for release writer review
        uses: actions/upload-artifact@v4
        with:
          name: P0D-S1-OFFICIAL-RC-5dc6c958-ROJO-PLACE-REVIEW
          path: |
            _rojo_artifacts/TRAP_RAIDERS_S1_OFFICIAL_RC.rbxlx
            _rojo_artifacts/VERIFIED_BUILD_RECEIPT.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Preserve all tracked game and test source unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "P0D_OFFICIAL_RC_STUDIO_NOT_TESTED_SOURCE_ONLY_REAL_ROJO_BUILD"
