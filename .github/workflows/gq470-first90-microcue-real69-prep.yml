name: GQ470 First90 Microcue REAL69 source QA (A PREP)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_first90_microcue_real69_20261121/**'
      - '.github/workflows/gq470-first90-microcue-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-69-off:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GQ470_REAL69_BASE: /tmp/gq470-first90-real69
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin formal RC and original source artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "A_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01 --jq .object.sha)" = "e80973c354f14a0d0088577f3cc1a875454f0f8f" || { echo RED_STALE_FORMAL_PARENT; exit 1; }
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44695199140 --jq '.head_sha+" "+.conclusion')" = "e80973c354f14a0d0088577f3cc1a875454f0f8f success"
          python3 - <<'PY'
          import json,pathlib
          lock=json.loads(pathlib.Path('quality_gameplay/gq470_first90_microcue_real69_20261121/source_lock.json').read_text())
          assert lock['selected_source_count']==69 and lock['selected_changed_routes']==1
          assert lock['pinned_formal_head']=='e80973c354f14a0d0088577f3cc1a875454f0f8f'
          assert lock['original_sha256']=='cd346ca76f8c215219a7c31e0795b3e113a146eaab9c003cd5559eaf46919d5d'
          PY
      - name: Real69 source, negative tests and exact reversible LocalScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GQ470_REAL69_BASE"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir "$GQ470_REAL69_BASE"
          test -s "$GQ470_REAL69_BASE/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 -B -m unittest discover -s quality_gameplay/gq470_first90_microcue_real69_20261121 -p 'test_*.py' -v
          python3 -B quality_gameplay/gq470_first90_microcue_real69_20261121/patch_first90_microcue69.py --base "$GQ470_REAL69_BASE"
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native Luau compile every ON and OFF source
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-first90-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-first90-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import pathlib,subprocess,os,sys
          sys.path.insert(0,'quality_gameplay/gq470_first90_microcue_real69_20261121')
          import patch_first90_microcue69 as p
          root=pathlib.Path(os.environ['GQ470_REAL69_BASE'])
          on,off=p.selected(root),p.selected(root/p.OFF)
          assert len(on)==len(off)==69 and set(on)==set(off)
          assert [k for k in on if on[k].read_bytes()!=off[k].read_bytes()]==[p.ROUTE]
          for scripts in (on,off):
              for script in scripts.values():
                  subprocess.run(['/tmp/gq470-first90-luau/luau-compile','--text',str(script)],check=True,stdout=subprocess.DEVNULL)
          print('GQ470_MICROCUE_NATIVE_69_ON_OFF_SOURCE_PASS')
          PY
      - name: Pinned Rojo ON/OFF69 and exact original private Place rollback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-rojo77.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-rojo77.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq470-rojo77.zip') as z:
              exe=Path('/tmp/gq470-first90-rojo')
              exe.write_bytes(z.read([x for x in z.namelist() if x.split('/')[-1]=='rojo'][0]))
              exe.chmod(0o755)
          PY
          R="$GQ470_REAL69_BASE"
          /tmp/gq470-first90-rojo build "$R/EGGRUMBLE_REAL69.project.json" -o "$R/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          /tmp/gq470-first90-rojo build "$R/OFF69_FIRST90_MICROCUE/EGGRUMBLE_REAL69.project.json" -o "$R/OFF69_FIRST90_MICROCUE/REBUILT_OFF.rbxlx"
          cmp "$R/OFF69_FIRST90_MICROCUE/REBUILT_OFF.rbxlx" "$R/OFF69_FIRST90_MICROCUE/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$R/EGGRUMBLE_REAL69.project.json" --place "$R/EGGRUMBLE_REAL69_PRIVATE.rbxlx" --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$R/OFF69_FIRST90_MICROCUE/EGGRUMBLE_REAL69.project.json" --place "$R/OFF69_FIRST90_MICROCUE/REBUILT_OFF.rbxlx" --count 69
          echo GQ470_MICROCUE_ROJO_69_ON_OFF_ORIGINAL_BYTEEXACT_PASS_SOURCE_ONLY
      - name: B220 source-select only export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gq470-first90-b220
          python3 - <<'PY'
          import pathlib,os,shutil,json,hashlib,subprocess,sys
          sys.path.insert(0,'quality_gameplay/gq470_first90_microcue_real69_20261121')
          import patch_first90_microcue69 as p
          base=pathlib.Path(os.environ['GQ470_REAL69_BASE'])
          source=p.selected(base)[p.ROUTE]
          pkg=pathlib.Path('/tmp/gq470-first90-b220')
          shutil.copy2(source,pkg/'EGGRUMBLE_LegacyFirst90.client.luau')
          shutil.copy2(base/p.RECEIPT,pkg/p.RECEIPT)
          shutil.copy2(pathlib.Path('quality_gameplay/gq470_first90_microcue_real69_20261121/source_lock.json'),pkg/'source_lock.json')
          current_head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          source_sha=hashlib.sha256(source.read_bytes()).hexdigest()
          report=json.loads(pathlib.Path('quality_gameplay/gq470_first90_microcue_real69_20261121/ART_CHECK_REPORT.json').read_text())
          assert source_sha==report['candidate_source_ci']['source_sha256_after']
          assert len(report['visual_evidence_gate']['shots'])==32
          assert report['visual_evidence_gate']['real_png_captures_received']==0
          original_place=base/p.OFF/p.PLACE
          candidate_place=base/p.PLACE
          source_manifest={'schema':'GQ470_FIRST90_MICROCUE_B220_SOURCE_ONLY_V1',
            'candidate_git_sha':current_head,'formal_parent_sha':p.BASE,
            'selected_route':p.ROUTE,'changed_source_count':1,
            'other_selected_sources_exact':68,'source_sha256':source_sha,
            'source_sha256_before':p.ORIGINAL_SHA256,
            'original_off_place_sha256':hashlib.sha256(original_place.read_bytes()).hexdigest(),
            'original_off_place_bytes':original_place.stat().st_size,
            'candidate_place_sha256':hashlib.sha256(candidate_place.read_bytes()).hexdigest(),
            'candidate_place_bytes':candidate_place.stat().st_size,
            'formal_rc_adopted':False,'studio':'NOT_TESTED','android':'NOT_TESTED',
            'human_art':'NOT_TESTED','owner_accepted':False}
          (pkg/'B220_SOURCE_MANIFEST.json').write_text(json.dumps(source_manifest,sort_keys=True,indent=2)+'\n')
          report['candidate_source_ci']['verified_head']=current_head
          report['candidate_source_ci']['candidate_place_sha256']=source_manifest['candidate_place_sha256']
          report['candidate_source_ci']['candidate_place_bytes']=source_manifest['candidate_place_bytes']
          report['candidate_source_ci']['original_place_sha256']=source_manifest['original_off_place_sha256']
          report['candidate_source_ci']['original_place_bytes']=source_manifest['original_off_place_bytes']
          report['candidate_source_ci']['conclusion']='SUCCESS_SOURCE_ONLY'
          report['decisions']['source_gate']='PASS_SOURCE_ONLY_ON_'+current_head[:7].upper()
          (pkg/'ART_CHECK_REPORT.json').write_text(json.dumps(report,sort_keys=True,indent=2,ensure_ascii=False)+'\n')
          print('GQ470_B220_MICROCUE_SOURCE_EXPORTED',source_sha)
          print('GQ470_ART_EVIDENCE_0_OF_32_UNTESTED',source_manifest['candidate_place_bytes'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-FIRST90-MICROCUE-B220-ONE-SOURCE-PREP
          path: /tmp/gq470-first90-b220
          if-no-files-found: error
          retention-days: 7
