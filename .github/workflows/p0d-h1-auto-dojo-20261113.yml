name: P0D B42 V7 Skycastle Solo + Beast/Weapon AFK Dojo private H1
on:
  push:
    branches:
      - experiment/p0d-h1-beast-weapon-auto-dojo-20261113-01
    paths:
      - 'handoffs/P0D-H1-AUTO-DOJO-20261113-01/**'
      - '.github/workflows/p0d-h1-auto-dojo-20261113.yml'
  workflow_dispatch:
jobs:
  private-full-game-source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Original source and H1 regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B handoffs/P0D-H1-AUTO-DOJO-20261113-01/tests/test_dojo_source.py
          python3 -B handoffs/P0D-B42-V7-SKYCASTLE-SOLO-20261113-01/tests/test_solo_integration.py
          python3 -B handoffs/P0D-B42-V7-SKYCASTLE-20261113-01/tests/test_skycastle_original.py
          python3 -B handoffs/P0D-FIRST90-MUSOUV7-UPGRADE-20261113-01/tests/test_upgrade.py
          python3 -B handoffs/P0D-FIRST90-GUIDED-H1-20261113-01/tests/test_first90_game.py
      - name: Assemble exact original B42 V7 SkyCastle Solo and add one private Dojo module
        shell: bash
        run: |
          set -euo pipefail
          python3 -B handoffs/P0D-H1-AUTO-DOJO-20261113-01/tools/assemble.py --assemble
          python3 -B handoffs/P0D-H1-AUTO-DOJO-20261113-01/tests/test_dojo_source.py
      - name: Checkout pinned native Luau
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_luau
          fetch-depth: 1
          persist-credentials: false
      - name: Build native Luau tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_luau -B /tmp/p0d_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_luau --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
      - name: Genuine native 44 script compile, actual Dojo and source-original combat/guide/solo
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-H1-AUTO-DOJO-20261113-01
          DIST="$ROOT/dist/EGG_RAID_RUMBLE_B42_V7_SKY_SOLO_AUTO_DOJO_PRIVATE"
          count=0
          while IFS= read -r -d '' path; do
            /tmp/p0d_luau/luau-compile "$path" >/tmp/p0d_luau_error.log 2>&1 || { cat /tmp/p0d_luau_error.log; exit 1; }
            count=$((count+1))
          done < <(find "$DIST/src" -type f -name '*.luau' -print0)
          test "$count" -eq 44
          python3 -B "$ROOT/tools/generate_native_dojo.py" --write /tmp/p0d_native_dojo.luau
          /tmp/p0d_luau/luau-compile /tmp/p0d_native_dojo.luau >/dev/null
          /tmp/p0d_luau/luau /tmp/p0d_native_dojo.luau | tee /tmp/p0d_native_dojo.log
          grep -E '^P0D_H1_DOJO_NATIVE_[0-9]+_ASSERTIONS_PASS$' /tmp/p0d_native_dojo.log
          python3 -B handoffs/P0D-B42-V7-SKYCASTLE-SOLO-20261113-01/tools/generate_native_studio_solo.py --write /tmp/p0d_native_solo.luau
          /tmp/p0d_luau/luau /tmp/p0d_native_solo.luau | grep -F 'P0D_S1_STUDIO_SOLO_NATIVE_30_ASSERTIONS_PASS'
          python3 -B handoffs/P0D-FIRST90-MUSOUV7-UPGRADE-20261113-01/tools/generate_native_horde_state_test.py --write /tmp/p0d_native_horde.luau
          /tmp/p0d_luau/luau /tmp/p0d_native_horde.luau | grep -F 'MUSOU_HORDE_NATIVE_79_STATE_ASSERTIONS_PASS'
          python3 -B handoffs/P0D-FIRST90-GUIDED-H1-20261113-01/tools/generate_native_first90.py --write /tmp/p0d_native_first90.luau
          /tmp/p0d_luau/luau /tmp/p0d_native_first90.luau | grep -F 'P0D_FIRST90_NATIVE_48_ASSERTIONS_PASS'
          python3 -B handoffs/P0D-FIRST90-GUIDED-H1-20261113-01/tools/generate_native_waypoint.py --write /tmp/p0d_native_waypoint.luau
          /tmp/p0d_luau/luau /tmp/p0d_native_waypoint.luau | grep -F 'P0D_FIRST90_WAYPOINT_NATIVE_39_ASSERTIONS_PASS'
          echo P0D_H1_DOJO_NATIVE_ALL_44_AND_ORIGINAL_GAME_POLICIES_PASS
      - name: Obtain pinned Rojo with content checksum
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/rojo77.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/rojo77.zip' | sha256sum -c
          python3 - <<'PY'
          import zipfile,stat,pathlib
          with zipfile.ZipFile("/tmp/rojo77.zip") as z:
              a=[v for v in z.namelist() if v.split("/")[-1]=="rojo"]
              assert len(a)==1
              p=pathlib.Path("/tmp/rojo77");p.write_bytes(z.read(a[0]))
              p.chmod(p.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/rojo77 --version | grep -F 7.7.1
      - name: Actual unpublished one Game Place built and 44 exact source bodies proven
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-H1-AUTO-DOJO-20261113-01
          DIST="$ROOT/dist/EGG_RAID_RUMBLE_B42_V7_SKY_SOLO_AUTO_DOJO_PRIVATE"
          mkdir -p /tmp/p0d_private
          /tmp/rojo77 build "$DIST/default.project.json" -o /tmp/p0d_private/TRAP_RAIDERS_B42_V7_SKY_SOLO_AUTO_DOJO_PRIVATE.rbxlx
          cp "$DIST/SOURCE_LOCK.json" /tmp/p0d_private/SOURCE_LOCK.json
          cp /tmp/p0d_native_dojo.log /tmp/p0d_private/NATIVE_DOJO_QA.txt
          python3 - <<'PY'
          import pathlib,collections,xml.etree.ElementTree as ET,hashlib,json
          root=pathlib.Path("handoffs/P0D-H1-AUTO-DOJO-20261113-01/dist/EGG_RAID_RUMBLE_B42_V7_SKY_SOLO_AUTO_DOJO_PRIVATE")
          place=pathlib.Path("/tmp/p0d_private/TRAP_RAIDERS_B42_V7_SKY_SOLO_AUTO_DOJO_PRIVATE.rbxlx")
          expected=collections.Counter(p.read_text("utf8") for p in (root/"src").rglob("*.luau"))
          actual=collections.Counter();counts=collections.Counter();game=0;world=0
          for i in ET.fromstring(place.read_bytes()).iter("Item"):
              t=i.get("class")
              if t not in ("Script","LocalScript","ModuleScript"):continue
              s=i.find("./Properties/string[@name='Source']")
              if s is None:continue
              counts[t]+=1;actual[s.text or ""]+=1
              name=i.find("./Properties/string[@name='Name']")
              if t=="Script" and name is not None and name.text=="Game":game+=1
              if t=="Script" and name is not None and name.text=="H1FunWorld":world+=1
          assert counts=={"Script":2,"LocalScript":5,"ModuleScript":37},counts
          assert actual==expected and sum(actual.values())==44
          assert game==1 and world==1
          assert any('pad.Name="PRIVATE_AUTO_DOJO_"..side.."_"..kind' in s for s in actual)
          assert any('Dojo.FRIEND_XP_MULTIPLIER = 1.5' in s for s in actual)
          assert sum('remote.OnServerEvent:Connect(' in s for s in actual)==1
          report={"sha256":hashlib.sha256(place.read_bytes()).hexdigest(),
              "actual_source_scripts":44,"game":game,"world":world,
              "studio_private":True,"training_saved":False,"training_pve_only":True,
              "studio1client":"NOT_TESTED","studio2client":"NOT_TESTED",
              "android":"NOT_TESTED","owner_FUN":"NOT_TESTED",
              "official_RC_adopted":False,"public_release":False}
          pathlib.Path("/tmp/p0d_private/BUILD_RECEIPT.json").write_text(json.dumps(report,indent=2)+"\n")
          print("P0D_PRIVATE_AUTO_DOJO_ROJO_REAL_44_OF_44_PASS",report["sha256"])
          PY
      - name: Upload private Studio trial only
        uses: actions/upload-artifact@v4
        with:
          name: P0D-H1-B42-V7-SKY-SOLO-AUTO-DOJO-PRIVATE-44
          path: /tmp/p0d_private/
          retention-days: 7
          if-no-files-found: error
