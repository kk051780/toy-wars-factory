name: GQ800 Real43 to live curse Real44 native Rojo OFF
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq800_curse_live_bridge_20261119/**'
      - '.github/workflows/gq800-curse-live-real44.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real44-charm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pin RC and verified Real43 original source and unchanged #801 policy
        shell: bash
        run: |
          set -euo pipefail
          RC="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$RC" = f77b4d4393d9e9b19b65566413432a7a9f13962b || { echo RED_RC_MOVED_REBASE_REQUIRED; exit 1; }
          mkdir -p artifacts/original artifacts/policy
          gh run download 44319832599 --repo "$GITHUB_REPOSITORY" \
            --name GQ800-REAL43-NEUTRAL8-PRIVATE-SOURCE-NOT-OFFICIAL --dir artifacts/original
          test -s artifacts/original/portable43/EGGRUMBLE_SOURCE43.project.json
          test -s artifacts/original/portable43/EGGRUMBLE_SOURCE43.rbxlx
          test -s artifacts/original/portable43/B_PORTABLE43_SOURCE_RECEIPT.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("artifacts/original/portable43")
          r=json.loads((p/"B_PORTABLE43_SOURCE_RECEIPT.json").read_text())
          assert r["source_count"]==43 and r["previous_source_count"]==42
          assert r["no_second_game_remote_store_swarm_hp_ko_owner"] is True
          assert r["original_author_801_git_blob"]=="42f512c4aaa389e0027be774c327e1f5a106aabf"
          print("GQ800_VERIFIED_ORIGINAL_43_SINGLE_SWARM_PASS")
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/0bd81a807ff6a935642a660b9fe9e0fd05ef484c" \
            --jq '.content' | base64 -d > artifacts/policy/EGGRUMBLE_CurseConversionPolicy.luau
          test "$(git hash-object artifacts/policy/EGGRUMBLE_CurseConversionPolicy.luau)" = 0bd81a807ff6a935642a660b9fe9e0fd05ef484c
      - name: Compose exact 43 to 44 real source and test actual original packet
        run: |
          set -euo pipefail
          python3 -m unittest discover -s quality_gameplay/gq800_curse_live_bridge_20261119 -p 'test_*.py' -v
          python3 quality_gameplay/gq800_curse_live_bridge_20261119/compose_real44.py \
            --original43 artifacts/original/portable43/EGGRUMBLE_SOURCE43.project.json \
            --original-policy artifacts/policy/EGGRUMBLE_CurseConversionPolicy.luau \
            --out artifacts/on44/REAL44.project.json
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq800_luau
          persist-credentials: false
      - name: Native compile original 43 and new 44 actual Luau bodies
        run: |
          set -euo pipefail
          cmake -S _gq800_luau -B /tmp/gq800real44 -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq800real44 --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import importlib.util,subprocess
          from pathlib import Path
          f=Path("quality_gameplay/gq800_curse_live_bridge_20261119/compose_real44.py")
          s=importlib.util.spec_from_file_location("gq44",f);m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          for project,count in (
            ("artifacts/original/portable43/EGGRUMBLE_SOURCE43.project.json",43),
            ("artifacts/on44/REAL44.project.json",44),
          ):
            _,src=m.flatten(Path(project))
            assert len(src)==count
            for path in src.values():
              subprocess.run(["/tmp/gq800real44/luau-compile","--text",str(path)],check=True,stdout=subprocess.DEVNULL)
            print("GQ800_ALL_NATIVE_LUAU_COMPILE_PASS",count)
          PY
      - name: Rojo Source Class 44 and byte-exact original OFF43 rollback
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq800rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq800rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq800rojo.zip") as z:
            matches=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
            assert len(matches)==1
            dest=Path("/tmp/gq800rojo")
            dest.write_bytes(z.read(matches[0]));dest.chmod(0o755)
          PY
          /tmp/gq800rojo build artifacts/on44/REAL44.project.json -o artifacts/on44/REAL44.rbxlx
          /tmp/gq800rojo build artifacts/original/portable43/EGGRUMBLE_SOURCE43.project.json -o artifacts/on44/OFF43.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project artifacts/on44/REAL44.project.json --place artifacts/on44/REAL44.rbxlx --count 44
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project artifacts/original/portable43/EGGRUMBLE_SOURCE43.project.json --place artifacts/on44/OFF43.rbxlx --count 43
          cmp artifacts/on44/OFF43.rbxlx artifacts/original/portable43/EGGRUMBLE_SOURCE43.rbxlx
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path("artifacts/on44/REAL44.rbxlx")
          data=p.read_bytes()
          receipt={"candidate_head":os.environ["GITHUB_SHA"],
             "source_count":44,"exact_original43_count":42,
             "single_swarm":True,"off43_bitwise":True,
             "native_source":True,"rojo_source_class":True,
             "place_bytes":len(data),"place_sha256":hashlib.sha256(data).hexdigest(),
             "formal_rc_adopted":False,"studio_2client":"NOT_TESTED",
             "android15":"NOT_TESTED","owner_fun":"NO_GO"}
          Path("artifacts/on44/REAL44.acceptance.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("GQ800_REAL44_CHARM_PRIVATE_NOT_FORMAL",receipt["place_bytes"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ800-REAL44-CURSE-LIVE-SOURCE-NOT-OFFICIAL
          path: |
            artifacts/on44/REAL44.project.json
            artifacts/on44/EGGRUMBLE_SwarmCombat_Real44.luau
            artifacts/on44/REAL44.project.receipt.json
            artifacts/on44/REAL44.rbxlx
            artifacts/on44/OFF43.rbxlx
            artifacts/on44/REAL44.acceptance.json
          if-no-files-found: error
          retention-days: 3
