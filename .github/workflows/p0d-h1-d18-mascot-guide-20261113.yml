name: P0D H1 actual game and D18 mascot local guidance native/Rojo
on:
  push:
    branches:
      - feature/p0d-h1-d18-mascot-guide-20261113-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  h1-original-d18-guide:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      H1: handoffs/P0D-H1-D18-MASCOT-GUIDE-20261113-01
    steps:
      - name: Checkout pinned isolated H1 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable 24 original H1 scripts, 3 add-ons, blocked authority and hostile mutations
        run: |
          set -euo pipefail
          cd "$H1"
          python tools/verify_h1_mascot.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download exact official Rojo 7.7.1 binary
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            -o /tmp/p0d_d18_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_d18_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import pathlib,stat,zipfile
          with zipfile.ZipFile("/tmp/p0d_d18_rojo.zip") as z:
              bin=[x for x in z.namelist() if x.rsplit("/",1)[-1]=="rojo"]
              assert len(bin)==1
              path=pathlib.Path("/tmp/p0d_d18_rojo")
              path.write_bytes(z.read(bin[0]))
              path.chmod(path.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_d18_rojo --version | grep -F 7.7.1
      - name: Build original full H1 game plus D18 mascot as unpublished Studio Place
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_d18_private
          /tmp/p0d_d18_rojo build "$H1/default.project.json" \
             -o /tmp/p0d_d18_private/TRAP_RAIDERS_H1_D18_MASCOT_STUDIO_ONLY.rbxlx
          test -s /tmp/p0d_d18_private/TRAP_RAIDERS_H1_D18_MASCOT_STUDIO_ONLY.rbxlx
      - name: Check actual Rojo XML has all 27 exact Luau source bytes and only one Game.server
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections,xml.etree.ElementTree as ET,pathlib,hashlib,json,os
          src=pathlib.Path(os.environ["H1"])
          code=list((src/"src").rglob("*.luau"))
          assert len(code)==27,len(code)
          place=pathlib.Path("/tmp/p0d_d18_private/TRAP_RAIDERS_H1_D18_MASCOT_STUDIO_ONLY.rbxlx")
          root=ET.fromstring(place.read_bytes())
          scripts=[];classes=collections.Counter()
          for item in root.iter("Item"):
              kind=item.attrib.get("class")
              if kind not in ("Script","LocalScript","ModuleScript"):continue
              t=item.find("./Properties/string[@name='Source']")
              if t is not None:
                  scripts.append(t.text or "")
                  classes[kind]+=1
          expected=collections.Counter(p.read_text(encoding="utf8") for p in code)
          assert collections.Counter(scripts)==expected,(len(scripts),len(expected),classes)
          assert classes=={"Script":2,"LocalScript":4,"ModuleScript":21},classes
          receipt={"adoption_id":"P0D-FUN-H1-001","source_sha":os.environ.get("GITHUB_SHA"),
              "actual_rojo_27_byte_exact":True,"source_count":27,
              "original_24_h1_unchanged":True,
              "mascot":"TRCA-BE-063","studio_2client":"NOT_TESTED",
              "mobile":"NOT_TESTED","owner_fun":"NO_GO_PENDING",
              "publish":False,"rbxlx_bytes":place.stat().st_size,
              "rbxlx_sha256":hashlib.sha256(place.read_bytes()).hexdigest()}
          pathlib.Path("/tmp/p0d_d18_private/BUILD_RECEIPT.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          print("P0D_REAL_H1_PLUS_D18_MASCOT_XML_27_OF_27_BYTE_EXACT",classes)
          PY
      - name: Build pinned real native Luau and compile all 27 original and new scripts
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/p0d_d18_luau
          git -C /tmp/p0d_d18_luau fetch --depth 1 origin f46d879e28302a430029304f7f6a162aed66f103
          git -C /tmp/p0d_d18_luau checkout --detach FETCH_HEAD
          test "$(git -C /tmp/p0d_d18_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S /tmp/p0d_d18_luau -B /tmp/p0d_d18_native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_d18_native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          find "$H1/src" -name '*.luau' -print0 | while IFS= read -r -d '' file; do
              /tmp/p0d_d18_native/luau-compile "$file" >/dev/null
          done
          echo "P0D_D18_H1_NATIVE_27_OF_27_LUAU_COMPILE_PASS"
      - name: Execute pure original D18 guide rules in real Luau VM, no fake Roblox game
        run: |
          set -euo pipefail
          cd "$H1"
          /tmp/p0d_d18_native/luau tests/guide_rules_native.luau
      - name: Upload actual unpublished full-game Place and provenance receipt only
        uses: actions/upload-artifact@v4
        with:
          name: P0D-H1-D18-MASCOT-GUIDE-STUDIO-ONLY
          path: |
            /tmp/p0d_d18_private/TRAP_RAIDERS_H1_D18_MASCOT_STUDIO_ONLY.rbxlx
            /tmp/p0d_d18_private/BUILD_RECEIPT.json
          retention-days: 7
          if-no-files-found: error
