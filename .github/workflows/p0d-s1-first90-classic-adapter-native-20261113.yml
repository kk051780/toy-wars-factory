name: P0D sole integrator - original S1 first90 Classic adapter isolated native Luau
on:
  push:
    branches:
      - integration/p0d-rc-first90-classic-adapter-20261113-01
    paths:
      - 'handoffs/P0D-RC-FIRST90-CLASSIC-ADAPTER-20261113-01/**'
      - '.github/workflows/p0d-s1-first90-classic-adapter-native-20261113.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first90-original-rc-native:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify original RC source lock and reference behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s handoffs/P0D-RC-FIRST90-CLASSIC-ADAPTER-20261113-01/tests -p 'test_*.py' -v
      - name: Checkout pinned upstream Luau
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_first90_luau
          fetch-depth: 1
          persist-credentials: false
      - name: Compile upstream native Luau compiler and CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_first90_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_first90_luau -B /tmp/p0d_first90_cli -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_first90_cli --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
      - name: Compile all actual 21 original RC Luau plus isolated new adapter
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-RC-FIRST90-CLASSIC-ADAPTER-20261113-01
          n=0
          while IFS= read -r -d '' path; do
            /tmp/p0d_first90_cli/luau-compile "$path" >/tmp/p0d_first90_compile.txt 2>&1 || { cat /tmp/p0d_first90_compile.txt; exit 1; }
            n=$((n+1))
          done < <(find releases/P0D_S1_KIDS_RC01/src -name '*.luau' -type f -print0)
          test "$n" -eq 21
          /tmp/p0d_first90_cli/luau-compile "$ROOT/src/S1First90ClassicWaypointRules.luau" >/dev/null
          echo P0D_S1_ORIGINAL_21_PLUS_ISOLATED_1_NATIVE_COMPILER_PASS
      - name: Execute real isolated Luau policy negative-positive native assertions
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-RC-FIRST90-CLASSIC-ADAPTER-20261113-01
          mkdir -p /tmp/p0d-first90-review
          python3 -B "$ROOT/tools/generate_native_first90_classic.py" --write /tmp/p0d-first90-review/first90_native_exec.luau
          /tmp/p0d_first90_cli/luau-compile /tmp/p0d-first90-review/first90_native_exec.luau >/dev/null
          /tmp/p0d_first90_cli/luau /tmp/p0d-first90-review/first90_native_exec.luau | tee /tmp/p0d-first90-review/NATIVE_FIRST90_QA.txt
          grep -E '^P0D_S1_FIRST90_CLASSIC_NATIVE_[0-9]+_ASSERTIONS_PASS$' /tmp/p0d-first90-review/NATIVE_FIRST90_QA.txt
          echo "SOURCE_ONLY_PREVIEW: adapter is NOT mounted in official S1. Roblox Studio and Android NOT_TESTED." > /tmp/p0d-first90-review/REVIEW_ONLY.txt
      - name: Archive source-only review evidence (never publish)
        uses: actions/upload-artifact@v4
        with:
          name: P0D-S1-ORIGINAL-FIRST90-ADAPTER-NATIVE-QA-ONLY
          path: |
            /tmp/p0d-first90-review/NATIVE_FIRST90_QA.txt
            /tmp/p0d-first90-review/REVIEW_ONLY.txt
          retention-days: 7
          if-no-files-found: error
      - name: Assemble isolated Studio 1-client practice plus First90 private preview (19/21 originals byte-identical)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B handoffs/P0D-RC-FIRST90-CLASSIC-ADAPTER-20261113-01/tools/assemble_preview.py --assemble
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path("handoffs/P0D-RC-FIRST90-CLASSIC-ADAPTER-20261113-01/dist/TRAP_RAIDERS_S1_FIRST90_CLASSIC_PRIVATE_UNPUBLISHED")
          lock=json.loads((root/"SOURCE_LOCK.json").read_text(encoding="utf8"))
          assert lock["source_count"]==23 and lock["unchanged_original_count"]==19
          assert lock["single_game_remote"] and lock["first90_server_snapshot"]
          assert lock["first90_visible_existing_coach"]
          assert lock["official_rc_adopted"] is False
          assert len(list((root/"src").rglob("*.luau")))==23
          print("P0D_S1_FIRST90_STUDIO_SOLO_SOURCE_LOCK_19_UNCHANGED_23_TOTAL_PASS")
          PY
      - name: Native compiler ALL actually assembled preview 23 Luau scripts
        shell: bash
        run: |
          set -euo pipefail
          DIST=handoffs/P0D-RC-FIRST90-CLASSIC-ADAPTER-20261113-01/dist/TRAP_RAIDERS_S1_FIRST90_CLASSIC_PRIVATE_UNPUBLISHED
          n=0
          while IFS= read -r -d '' path; do
            /tmp/p0d_first90_cli/luau-compile "$path" >/tmp/p0d_first90_compile.txt 2>&1 || { cat /tmp/p0d_first90_compile.txt; exit 1; }
            n=$((n+1))
          done < <(find "$DIST/src" -type f -name '*.luau' -print0)
          test "$n" -eq 23
          echo P0D_S1_FIRST90_STUDIO_SOLO_ASSEMBLED_23_NATIVE_COMPILER_PASS
      - name: Download pinned Rojo 7.7.1 only for unpublished local Place
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_s1_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_s1_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import pathlib,zipfile,stat
          with zipfile.ZipFile("/tmp/p0d_s1_rojo.zip") as z:
              a=[x for x in z.namelist() if x.rsplit("/",1)[-1]=="rojo"]
              assert len(a)==1
              exe=pathlib.Path("/tmp/p0d_s1_rojo")
              exe.write_bytes(z.read(a[0]))
              exe.chmod(exe.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_s1_rojo --version | grep -F '7.7.1'
      - name: Build genuine unpublished 23 script Roblox Place and check exact XML source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-RC-FIRST90-CLASSIC-ADAPTER-20261113-01
          DIST="$ROOT/dist/TRAP_RAIDERS_S1_FIRST90_CLASSIC_PRIVATE_UNPUBLISHED"
          mkdir -p /tmp/p0d-first90-review
          PLACE=/tmp/p0d-first90-review/P0D_S1_FIRST90_CLASSIC_PRIVATE_UNPUBLISHED.rbxlx
          /tmp/p0d_s1_rojo build "$DIST/default.project.json" -o "$PLACE"
          cp "$DIST/SOURCE_LOCK.json" /tmp/p0d-first90-review/SOURCE_LOCK.json
          python3 - <<'PY'
          from collections import Counter
          import pathlib,json,hashlib,xml.etree.ElementTree as ET
          root=pathlib.Path("handoffs/P0D-RC-FIRST90-CLASSIC-ADAPTER-20261113-01/dist/TRAP_RAIDERS_S1_FIRST90_CLASSIC_PRIVATE_UNPUBLISHED")
          target=pathlib.Path("/tmp/p0d-first90-review/P0D_S1_FIRST90_CLASSIC_PRIVATE_UNPUBLISHED.rbxlx")
          embedded=Counter()
          cls=Counter()
          names=Counter()
          for item in ET.fromstring(target.read_bytes()).iter("Item"):
              kind=item.get("class")
              if kind not in ("Script","LocalScript","ModuleScript"):continue
              s=item.find("./Properties/string[@name='Source']")
              if s is None: continue
              embedded[s.text or ""]+=1
              cls[kind]+=1
              name=item.find("./Properties/string[@name='Name']")
              if name is not None: names[(kind,name.text)]+=1
          actual=Counter(p.read_text(encoding="utf8") for p in (root/"src").rglob("*.luau"))
          assert embedded==actual and sum(embedded.values())==23,(sum(embedded.values()),sum(actual.values()))
          assert names[("Script","Game")]==1,names
          assert names[("LocalScript","TrapRaidersCoach")]==1,names
          assert names[("ModuleScript","S1First90ClassicWaypointRules")]==1,names
          assert names[("ModuleScript","StudioSoloPreviewRules")]==1,names
          receipt={
              "origin":"FROZEN_1263a037_S1_ORIGINAL_SOURCE",
              "source_count":23,"unchanged_original":19,"game":1,
              "studio_only_single_client_practice":True,
              "public_server_min_two_teams_unchanged":True,
              "first90_visible_existing_coach":True,
              "place_sha256":hashlib.sha256(target.read_bytes()).hexdigest(),
              "original_remote_authority":1,
              "source_xml_exact":True,"published":False,
              "official_rc_adopted":False,
              "roblox_studio_engine_test":"NOT_TESTED",
              "two_client":"NOT_TESTED","android":"NOT_TESTED",
              "owner_fun":"NOT_TESTED"
          }
          pathlib.Path("/tmp/p0d-first90-review/PLACE_EXACT_RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("P0D_S1_FIRST90_STUDIO_SOLO_REAL_ROJO_23_EXACT_SOURCE_PASS",receipt["place_sha256"])
          PY
      - name: Execute pinned-native Luau 30 studio-solo vs public-team assertions
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-RC-FIRST90-CLASSIC-ADAPTER-20261113-01
          python3 -B "$ROOT/tools/generate_native_studio_solo.py" --write /tmp/p0d-first90-review/studio_solo_native.luau
          /tmp/p0d_first90_cli/luau-compile /tmp/p0d-first90-review/studio_solo_native.luau >/dev/null
          /tmp/p0d_first90_cli/luau /tmp/p0d-first90-review/studio_solo_native.luau | tee /tmp/p0d-first90-review/STUDIO_SOLO_NATIVE_QA.txt
          grep -E '^P0D_S1_STUDIO_SOLO_NATIVE_30_ASSERTIONS_PASS
        uses: actions/upload-artifact@v4
        with:
          name: P0D-S1-FIRST90-CLASSIC-ONE-GAME-PRIVATE-STUDIO-RBXLX
          path: |
            /tmp/p0d-first90-review/P0D_S1_FIRST90_CLASSIC_PRIVATE_UNPUBLISHED.rbxlx
            /tmp/p0d-first90-review/SOURCE_LOCK.json
            /tmp/p0d-first90-review/PLACE_EXACT_RECEIPT.json
            /tmp/p0d-first90-review/NATIVE_FIRST90_QA.txt
          retention-days: 7
          if-no-files-found: error
 /tmp/p0d-first90-review/STUDIO_SOLO_NATIVE_QA.txt
      - name: Archive isolated unpublished playable-preview file only
        uses: actions/upload-artifact@v4
        with:
          name: P0D-S1-FIRST90-CLASSIC-ONE-GAME-PRIVATE-STUDIO-RBXLX
          path: |
            /tmp/p0d-first90-review/P0D_S1_FIRST90_CLASSIC_PRIVATE_UNPUBLISHED.rbxlx
            /tmp/p0d-first90-review/SOURCE_LOCK.json
            /tmp/p0d-first90-review/PLACE_EXACT_RECEIPT.json
            /tmp/p0d-first90-review/NATIVE_FIRST90_QA.txt
            /tmp/p0d-first90-review/STUDIO_SOLO_NATIVE_QA.txt
          retention-days: 7
          if-no-files-found: error
