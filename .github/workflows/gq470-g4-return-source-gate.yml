name: GQ470 existing G4 Bot return H72 SOURCE-only gate

on:
  pull_request:
    paths:
      - ".github/workflows/gq470-g4-return-source-gate.yml"
      - "quality_gameplay/gq470_g4_return_source_gate_20261124/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  actual-h72:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download the original official H72 run (no mutable source)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gq470-h72"
          gh run download 45132949073 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO \
            --dir "$RUNNER_TEMP/gq470-h72"
      - name: Verify actual source and side-wall negative with no false V2.1 PASS
        env:
          GQ470_H72_ARTIFACT_DIR: ${{ runner.temp }}/gq470-h72
        run: |
          python -m unittest discover \
            -s quality_gameplay/gq470_g4_return_source_gate_20261124 \
            -p "test_source_gate.py" -v
