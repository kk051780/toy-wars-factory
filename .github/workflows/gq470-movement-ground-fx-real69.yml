name: GQ470 matte ground motion REAL70 A source gate (not official RC)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - "quality_gameplay/gq470_movement_ground_fx_20261121/**"
      - ".github/workflows/gq470-movement-ground-fx-real69.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real70-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: quality_gameplay/gq470_movement_ground_fx_20261121
      ROOT: /tmp/gq470-ground-fx
      FORMAL: e80973c354f14a0d0088577f3cc1a875454f0f8f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Static safety and 14 fail-closed mutations
        run: |
          set -euo pipefail
          python3 -m py_compile "$TARGET/compose_official70.py" "$TARGET/test_ground_fx_source.py"
          python3 -m unittest discover -s "$TARGET" -p 'test_*.py' -v
      - name: Verify immutable official REAL69 head and original same-head build
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL" || { echo RED_MOVED_FORMAL_RC; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44695199140" --jq '.head_sha+" "+.conclusion')" = "$FORMAL success"
          mkdir -p "$ROOT/off69"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO \
            --dir "$ROOT/off69"
          python3 "$TARGET/compose_official70.py" --official "$ROOT/off69" --out "$ROOT/on70"
          echo A_REAL70_69_SOURCE_BYTES_UNCHANGED_ONE_NEW_CLIENT_ONLY_PASS
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq470_ground_luau
          persist-credentials: false
      - name: Pinned Native Luau compile original69 and candidate70
        run: |
          set -euo pipefail
          cmake -S _gq470_ground_luau -B "$ROOT/luau" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build "$ROOT/luau" --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          from pathlib import Path
          import os,sys,subprocess
          sys.path.insert(0, "quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120")
          from verify_nonloss import project_scan
          root=Path(os.environ["ROOT"])
          for name,count in (("off69",69),("on70",70)):
              location=root/name
              scanned=project_scan(location,"EGGRUMBLE_REAL69.project.json")
              assert len(scanned)==count
              for script in scanned.values():
                  subprocess.run([str(root/"luau/luau-compile"),"--text",str(location/script["path"])],
                                 check=True,stdout=subprocess.DEVNULL)
          print("GQ470_GROUND_NATIVE_ORIGINAL69_PLUS_CANDIDATE70_PASS")
          PY
      - name: Pinned true Rojo OFF69 exact-byte and ON70 Source/Class
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o "$ROOT/rojo.zip"
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $ROOT/rojo.zip" | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          root=Path(os.environ["ROOT"])
          with ZipFile(root/"rojo.zip") as archive:
              names=[x for x in archive.namelist() if x.rsplit("/",1)[-1]=="rojo"]
              assert len(names)==1
              output=root/"rojo"
              output.write_bytes(archive.read(names[0]))
              output.chmod(0o755)
          PY
          "$ROOT/rojo" build "$ROOT/off69/EGGRUMBLE_REAL69.project.json" -o "$ROOT/OFF69_REBUILT.rbxlx"
          "$ROOT/rojo" build "$ROOT/on70/EGGRUMBLE_REAL69.project.json" -o "$ROOT/GQ470_GROUND_ON70_NOT_FORMAL.rbxlx"
          cmp "$ROOT/OFF69_REBUILT.rbxlx" "$ROOT/off69/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project "$ROOT/off69/EGGRUMBLE_REAL69.project.json" \
            --place "$ROOT/OFF69_REBUILT.rbxlx" --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project "$ROOT/on70/EGGRUMBLE_REAL69.project.json" \
            --place "$ROOT/GQ470_GROUND_ON70_NOT_FORMAL.rbxlx" --count 70
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import os,hashlib,json
          root=Path(os.environ["ROOT"])
          a=ET.parse(root/"OFF69_REBUILT.rbxlx").getroot()
          b=ET.parse(root/"GQ470_GROUND_ON70_NOT_FORMAL.rbxlx").getroot()
          original=list(a.iter("Item"));candidate=list(b.iter("Item"))
          assert len(candidate)==len(original)+1
          hits=[]
          for item in candidate:
              name=item.find('./Properties/string[@name="Name"]')
              if name is not None and name.text=="EGGRUMBLE_GroundMotionFX":
                  hits.append(item)
          assert len(hits)==1 and hits[0].get("class")=="LocalScript"
          src=hits[0].find('./Properties/ProtectedString[@name="Source"]')
          if src is None:
              src=hits[0].find('./Properties/string[@name="Source"]')
          expected=Path(os.environ["TARGET"]+"/EGGRUMBLE_GroundMotionFX.client.luau").read_text()
          assert src is not None and src.text is not None and src.text.strip()==expected.strip()
          receipt=json.loads((root/"on70/GQ470_GROUND_FX_SOURCE_RECEIPT.json").read_text())
          assert receipt["candidate_source_count"]==70 and receipt["original_sources_preserved"]==69
          assert receipt["art_gate"]=="ART_NO_GO" and receipt["formal_integrated"] is False
          print("GQ470_GROUND_ROJO_OFF69_EXACT_ON70_SOURCE_CLASS_PASS")
          print("CANDIDATE_PRIVATE_PLACE_BYTES", (root/"GQ470_GROUND_ON70_NOT_FORMAL.rbxlx").stat().st_size)
          PY
      - name: Confirm formal RC unchanged (B220 only writer)
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL" || { echo RED_MOVED_FORMAL_RC; exit 1; }
          test "$(git rev-parse HEAD)" = "$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")" || { echo RED_HEAD_DRIFT; exit 1; }
          echo A_SOURCE_ONLY_NATIVE_ROJO_GREEN_NOT_ENGINE_NOT_ART_GO
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-GROUND-REAL70-A-CANDIDATE-NOT-FORMAL
          path: |
            /tmp/gq470-ground-fx/GQ470_GROUND_ON70_NOT_FORMAL.rbxlx
            /tmp/gq470-ground-fx/on70/GQ470_GROUND_FX_SOURCE_RECEIPT.json
            /tmp/gq470-ground-fx/on70/sources/StarterPlayer/StarterPlayerScripts/EGGRUMBLE_GroundMotionFX.client.luau
          if-no-files-found: error
          retention-days: 7
