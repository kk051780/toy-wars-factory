name: GQ8 source exact Regen33 plus MageRevive32 integrated Host34 QA
on:
  push:
    branches: [quality/gq8-regen-mage-crosslane34-20261118]
    paths:
      - 'quality_gameplay/gq8_regen_mage_20261118/**'
      - '.github/workflows/p0d-gq8-regen-mage-crosslane34.yml'
  pull_request:
    branches: [feature/gq8-natural-regen-20261118]
    paths:
      - 'quality_gameplay/gq8_regen_mage_20261118/**'
      - '.github/workflows/p0d-gq8-regen-mage-crosslane34.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine31-reg33-mage34:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      GH_TOKEN: \${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 2f4c1e43a7802929de3f633370b32791f7bf8d96
          path: _mage777
          persist-credentials: false
      - name: Exact author trees and unique QA source scope
        run: |
          set -euo pipefail
          test "$(git -C _mage777 rev-parse HEAD)" = "2f4c1e43a7802929de3f633370b32791f7bf8d96"
          git merge-base --is-ancestor 5b82f300e6dee08ea1ac20ccd1449db0cd73dbc3 HEAD
          git diff --name-only 5b82f300e6dee08ea1ac20ccd1449db0cd73dbc3 HEAD | tee /tmp/changed
          if grep -Ev '^(quality_gameplay/gq8_regen_mage_20261118/|\.github/workflows/p0d-gq8-regen-mage-crosslane34\.yml$)' /tmp/changed; then
            echo RED_UNREVIEWED_OWNER_FILE_CHANGE; exit 1
          fi
          python3 -m unittest discover -v -s quality_gameplay/gq8_regen_mage_20261118 -p 'test_*.py'
      - name: Recheck exact official RC head and samehead accepted 31-source build
        id: official
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow p0d-rc-eggrumble-v3-31.yml --branch rc/p0d-s1-kids-rc01 --limit 70 --json databaseId,headSha,status,conclusion >/tmp/official.json
          RUN="$(jq -r --arg h "$CURRENT" '[.[]|select(.headSha==$h and .status=="completed" and .conclusion=="success")][0].databaseId // empty' /tmp/official.json)"
          test -n "$RUN"
          echo "sha=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - name: Download real official source and rehydrate canonical31
        run: |
          set -euo pipefail
          mkdir -p artifacts/official
          gh run download "\${{ steps.official.outputs.run }}" --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-RC31-CANONICAL-COMPANION-STUDIO --dir artifacts/official
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py extract \
            --place artifacts/official/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx \
            --template artifacts/official/gq515_official_select/GQ510_MAGE_SELECTED31.project.json \
            --receipt artifacts/official/gq530_all31/EGGRUMBLE_V3_OFFICIAL_RC31_RECEIPT.json \
            --out artifacts/real31 --head "\${{ steps.official.outputs.sha }}"
      - name: Reuse pinned #775 actual Host regen33, add only pinned original #777 module
        run: |
          set -euo pipefail
          python3 handoffs/EGGRUMBLE-HP-REGEN-20261118/compose_regen32.py \
            --current31 artifacts/real31/CURRENT31_REAL_SOURCE.project.json \
            --out artifacts/regen33/REGEN33.project.json
          python3 quality_gameplay/gq8_regen_mage_20261118/compose_regen_mage34.py \
            --original31 artifacts/real31/CURRENT31_REAL_SOURCE.project.json \
            --regen33 artifacts/regen33/REGEN33.project.json \
            --mage-source _mage777/handoffs/EGGRUMBLE-MAGE-REVIVE-20261118/EGGRUMBLE_MageRevive.luau \
            --out artifacts/combined34/COMBINED34.project.json
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native compile all actual source/class not mocks
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/regenmage -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/regenmage --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from quality_gameplay.gq8_regen_mage_20261118.compose_regen_mage34 import files
          for path,n in [('artifacts/combined34/COMBINED34.project.json',34),('artifacts/real31/CURRENT31_REAL_SOURCE.project.json',31)]:
              _,items=files(Path(path))
              assert len(items)==n
              for src in items.values():
                  subprocess.run(['/tmp/regenmage/luau-compile','--text',str(src)],check=True,stdout=subprocess.DEVNULL)
              print('GQ8_REGEN_MAGE_NATIVE_ALL_SOURCES_PASS',n)
          PY
      - name: Pinned Rojo7.7.1 real34 and rollback original31 exact Script Class Source
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/regenmage-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/regenmage-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/regenmage-rojo.zip') as z:
              names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(names)==1
              p=Path('/tmp/regenmage-rojo');p.write_bytes(z.read(names[0]));p.chmod(0o755)
          PY
          /tmp/regenmage-rojo build artifacts/combined34/COMBINED34.project.json -o artifacts/combined34/COMBINED34.rbxlx
          /tmp/regenmage-rojo build artifacts/real31/CURRENT31_REAL_SOURCE.project.json -o artifacts/combined34/OFF31.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/combined34/COMBINED34.project.json \
            --place artifacts/combined34/COMBINED34.rbxlx --count 34
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/real31/CURRENT31_REAL_SOURCE.project.json \
            --place artifacts/combined34/OFF31.rbxlx --count 31
          NOW="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$NOW" = "\${{ steps.official.outputs.sha }}" || { echo RED_OFFICIAL_HEAD_DRIFT; exit 1; }
          echo GQ8_REGEN_MAGE_REAL34_NATIVE_ROJO_OFF31_SAMEHEAD_SUCCESS
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-REGEN-MAGE-CROSSLANE34-NOT-OFFICIAL-RC
          path: |
            artifacts/combined34/
            artifacts/real31/CURRENT31_REAL_SOURCE_RECEIPT.json
          if-no-files-found: error
          retention-days: 3
