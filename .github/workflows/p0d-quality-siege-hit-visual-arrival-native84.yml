name: P0D true siege 3-hit physical strike feedback and AI arrival fix native84
on:
  push:
    branches: [feature/p0d-product-quality-gate-20261115]
    paths:
      - product_quality/siege_bot_breach/siege_hit_feedback_arrival_v3.py
      - .github/workflows/p0d-quality-siege-hit-visual-arrival-native84.yml
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - product_quality/siege_bot_breach/siege_hit_feedback_arrival_v3.py
      - .github/workflows/p0d-quality-siege-hit-visual-arrival-native84.yml
permissions:
  contents: read
  actions: read
jobs:
  source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download immutable real v2 source 84 script castle egg carrier trial
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_siege_visual_parent
          gh run download 43705934185 -R kk051780/toy-wars-factory \
            -n P0D-QUALITY-SIEGE-CLOCK-CARRIER-EXIT-PRIVATE-RC84-NOGO \
            -D /tmp/p0d_siege_visual_parent
          test -s /tmp/p0d_siege_visual_parent/P0D_SIEGE_CLOCK_CARRIER_V2.zip
      - name: Real physical gate V3 source builder and 84 script lock and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B product_quality/siege_bot_breach/siege_hit_feedback_arrival_v3.py \
            --parent /tmp/p0d_siege_visual_parent/P0D_SIEGE_CLOCK_CARRIER_V2.zip \
            --out /tmp/P0D_SIEGE_HIT_FEEDBACK_V3.zip \
            --extract /tmp/p0d_siege_v3_84_sources
          python3 - <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          from zipfile import ZipFile
          sys.path.insert(0,"product_quality/siege_bot_breach")
          import siege_hit_feedback_arrival_v3 as x
          with ZipFile("/tmp/P0D_SIEGE_HIT_FEEDBACK_V3.zip") as z:
              r=json.loads(z.read("RECEIPT.json"))
              body=z.read(x.OUTPUT)
          assert r["script_count"]==84
          assert r["other_83_script_bodies_byte_exact"]
          assert r["solo_AI_original_source_exact"] and r["game_egg_score_winner_exact"]
          assert r["seven_weapons_and_trapper_exact"] and r["source_dual_lock_exact"]
          assert r["server_ai_4_5_to_5_2_window_fixed"]
          assert r["physical_three_hit_siege_indicators"]
          assert r["impact_sparks_per_hit"]==3
          assert r["particle_or_external_asset_dependency"] is False
          assert r["official_rc_write"] is False and r["product"]=="NO_GO"
          assert hashlib.sha256(body).hexdigest()==r["place_sha256"]
          _,scripts=x.original.source_nodes(body)
          assert len(scripts)==84
          assert len(list(Path("/tmp/p0d_siege_v3_84_sources").glob("*.luau")))==84
          map_src=scripts["MapBuilder"].text
          bots=scripts["SoloTeamBots"].text
          for mark in ("math.abs(botOrigin.X-approachX)>5.2",
                       "setSiegeBars(siegeDamage,false)",
                       "siegeImpactVFX(siegeDamage,siegeDamage>=3)",
                       'gate:SetAttribute("SiegeDamage",siegeDamage)',
                       'gate:SetAttribute("GateRaised",opening)',
                       'local now=workspace:GetServerTimeNow()',
                       "breachLock=now+10","task.delay(9"):
              assert mark in map_src
          for mark in ("callbacks.deposit(bot,bot.team,bot.carry)",
                       "enemyGate.breach(bot.team,bot.root.Position,now,",
                       "isEscapingWithEgg=bot.carry==enemy"):
              assert mark in bots
          assert "summonSevenBeast" in scripts["Game"].text
          assert "SevenJobs.TrapperWarp.place" in scripts["Game"].text
          assert "SevenJobs.ArmamentM1.strike" in scripts["Game"].text
          # Actual AI code stops inside <=4.5; the gate acceptance used <4
          # before the patch, creating a permanent arrived-but-not-attacking
          # region for 4 < abs(dx) <= 4.5. Test both real team signs/sides.
          move_stop=4.5
          acceptance=5.2
          assert move_stop<acceptance and acceptance<7
          for sign in (-1,1):
              gate=sign*85
              for inside in (False,True):
                  target=gate+(sign*7 if inside else -sign*7)
                  stop_at=target+sign*move_stop
                  assert abs(stop_at-target)<=acceptance
                  assert abs(stop_at-target)>4.0
                  wrong_side=gate+(-sign*7 if inside else sign*7)
                  assert abs(wrong_side-target)>acceptance
          for invalid in ("",x.original.MAP_SIEGE_ORIGINAL,
                          x.original.MAP_RETURN_NEW):
              try:x.patch_map(invalid)
              except ValueError:pass
              else:raise AssertionError("BAD_GATE_SOURCE_NOT_BLOCKED")
          print("TRUE_CASTLE_GATE_AI_APPROACH_AND_THREE_HIT_FX_SOURCE84_PASS")
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_siege_v3_84_luau
          persist-credentials: false
      - name: Native compile ALL 84 actual Luau scripts including genuine Game
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_siege_v3_84_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_siege_v3_84_luau -B /tmp/p0d_siege_v3_84_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_siege_v3_84_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' f; do
            /tmp/p0d_siege_v3_84_build/luau-compile "$f" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_siege_v3_84_sources -name '*.luau' -type f -print0 | sort -z)
          test "$n" -eq 84
          echo 'P0D_REAL_SIEGE_HIT_ANIM_AND_BOT_ARRIVAL_NATIVE84_PASS'
      - name: Reconstruct 84 original Roblox paths and types from the actual Place
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          import hashlib,json
          target=Path('/tmp/p0d_siege_v3_84_rojo')
          with ZipFile('/tmp/P0D_SIEGE_HIT_FEEDBACK_V3.zip') as z:
              root=ET.fromstring(z.read('P0D_RC84_SIEGE_STRIKE_VFX_AI_ARRIVAL_PRIVATE.rbxlx'))
          types={'Script':'.server.luau','LocalScript':'.client.luau','ModuleScript':'.luau'}
          manifest=[]
          def walk(item,old=()):
              p=item.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=old+((name,) if name else ())
              if src is not None:
                  assert item.get('class') in types and len(here)>=3
                  assert here[0] in ('ReplicatedStorage','ServerScriptService','StarterPlayer')
                  assert all(t.isidentifier() for t in here)
                  f=target/'src'/Path(*here).with_suffix(types[item.get('class')])
                  f.parent.mkdir(parents=True,exist_ok=True)
                  assert not f.exists()
                  f.write_text(src,encoding='utf-8')
                  raw=src.encode('utf-8')
                  d=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  manifest.append({'path':'/'.join(here),'kind':item.get('class'),'blob':d})
              for child in item.findall('Item'):walk(child,here)
          for item in root.findall('Item'):walk(item)
          assert len(manifest)==84
          assert len({x['path'] for x in manifest})==84
          (target/'manifest.json').write_text(json.dumps(manifest,indent=2))
          project={'name':'P0DActualSiegeBeastSolo7Armament84','tree':{'$className':'DataModel',
            'ReplicatedStorage':{'$className':'ReplicatedStorage',
              'TrapRaidersShared':{'$path':'src/ReplicatedStorage/TrapRaidersShared'}},
            'ServerScriptService':{'$className':'ServerScriptService',
              'TrapRaidersS1':{'$path':'src/ServerScriptService/TrapRaidersS1'}},
            'StarterPlayer':{'$className':'StarterPlayer',
              'StarterPlayerScripts':{'$path':'src/StarterPlayer/StarterPlayerScripts'}}}}
          (target/'default.project.json').write_text(json.dumps(project,indent=2))
          print('84_REAL_LUAU_PATH_CLASS_BLOB_MANIFEST_PREPARED')
          PY
      - name: Pinned Rojo 7.7.1 rebuild exact 84 class path and source GitBlob
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_siege_v3_84_rojo_release.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_siege_v3_84_rojo_release.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/p0d_siege_v3_84_rojo_release.zip') as z:
              entries=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='rojo']
              assert len(entries)==1
              file=Path('/tmp/p0d_siege_v3_84_rojo_binary')
              file.write_bytes(z.read(entries[0]))
              file.chmod(0o755)
          PY
          /tmp/p0d_siege_v3_84_rojo_binary build /tmp/p0d_siege_v3_84_rojo/default.project.json -o /tmp/p0d_siege_v3_84_rojo_rebuilt.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import hashlib,json
          want=json.loads(Path('/tmp/p0d_siege_v3_84_rojo/manifest.json').read_text())
          root=ET.fromstring(Path('/tmp/p0d_siege_v3_84_rojo_rebuilt.rbxlx').read_bytes())
          got=[]
          def walk(n,prior=()):
              p=n.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=prior+((name,) if name else ())
              if src is not None:
                  raw=src.encode('utf-8')
                  d=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  got.append({'path':'/'.join(here),'kind':n.get('class'),'blob':d})
              for c in n.findall('Item'):walk(c,here)
          for item in root.findall('Item'):walk(item)
          assert len(got)==len(want)==84
          assert {x['path']:(x['kind'],x['blob']) for x in got}=={
              x['path']:(x['kind'],x['blob']) for x in want}
          print('P0D_REAL_SIEGE_HIT_ANIM_AND_BOT_ARRIVAL_ROJO84_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-QUALITY-SIEGE-HIT-FX-AND-AI-ARRIVAL-RC84-NOGO
          path: /tmp/P0D_SIEGE_HIT_FEEDBACK_V3.zip
          retention-days: 7
