name: P0D GQ8 Mage Heal and Revive Source Native Gate
on:
  push:
    branches: ['feature/gq8-mage-rescue-20261118-1218']
    paths:
      - 'handoffs/EGGRUMBLE-MAGE-RESCUE-20261118/**'
      - '.github/workflows/p0d-gq8-mage-rescue.yml'
  pull_request:
    branches: ['rc/p0d-s1-kids-rc01']
    paths:
      - 'handoffs/EGGRUMBLE-MAGE-RESCUE-20261118/**'
      - '.github/workflows/p0d-gq8-mage-rescue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mage-heal-revive-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Produce actual source-derived good and deliberate broken channel cases
        run: |
          set -euo pipefail
          python3 -B handoffs/EGGRUMBLE-MAGE-RESCUE-20261118/make_native_tests.py --out /tmp/gq8-mage-rescue
          grep -q 'ctx.now - record.startedAt < 0' /tmp/gq8-mage-rescue/mutant.luau
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Pinned native Luau compile, good lifecycle and intentional mutant rejection
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8-mage-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8-mage-native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          CLI=/tmp/gq8-mage-native/luau
          CC=/tmp/gq8-mage-native/luau-compile
          "$CC" --text handoffs/EGGRUMBLE-MAGE-RESCUE-20261118/EGGRUMBLE_MageRescuePolicy.luau >/dev/null
          "$CC" --text /tmp/gq8-mage-rescue/good.luau >/dev/null
          "$CC" --text /tmp/gq8-mage-rescue/mutant.luau >/dev/null
          "$CLI" /tmp/gq8-mage-rescue/good.luau | tee /tmp/gq8-mage-good.log
          grep -qx GQ8_MAGE_SOURCE_DERIVED_LUAU_HEAL_CHANNEL_REVIVE_PASS /tmp/gq8-mage-good.log
          if "$CLI" /tmp/gq8-mage-rescue/mutant.luau >/tmp/gq8-mage-mutant.log 2>&1; then
            echo RED_MAGE_EARLY_CHANNEL_MUTANT_WAS_ACCEPTED
            exit 1
          fi
          grep -q RED_EARLY_CHANNEL /tmp/gq8-mage-mutant.log
          echo GQ8_MAGE_SOURCE_DERIVED_NATIVE_AND_MUTANT_RED_PASS
