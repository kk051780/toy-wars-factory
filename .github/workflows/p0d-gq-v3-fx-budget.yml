name: EGGRUMBLE GQ V3 seven-role client FX budget SOURCE gate
on:
  push:
    branches:
      - quality/gq-v3-fx-budget-20261116
  pull_request:
    paths:
      - 'handoffs/EGGRUMBLE-GQ-FX-BUDGET-20261116/**'
      - '.github/workflows/p0d-gq-v3-fx-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python structural and provenance tests
        run: python3 -B -m unittest discover -s handoffs/EGGRUMBLE-GQ-FX-BUDGET-20261116/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq_pinned_luau
          persist-credentials: false
      - name: Compile pinned native Luau and exercise policy
        run: |
          set -euo pipefail
          test "$(git -C _gq_pinned_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _gq_pinned_luau -B /tmp/luau-gq-fx -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/luau-gq-fx --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          root=handoffs/EGGRUMBLE-GQ-FX-BUDGET-20261116
          /tmp/luau-gq-fx/luau-compile "$root/client/EGGRUMBLE_FXBudgetRules.luau" >/dev/null
          /tmp/luau-gq-fx/luau-compile "$root/client/EGGRUMBLE_ClientFXBudget.client.luau" >/dev/null
          /tmp/luau-gq-fx/luau-compile "$root/tests/EGGRUMBLE_FXBudgetRules.spec.luau" >/dev/null
          mkdir -p /tmp/gqfx/tests
          cp "$root/client/EGGRUMBLE_FXBudgetRules.luau" /tmp/gqfx/
          cp "$root/tests/EGGRUMBLE_FXBudgetRules.spec.luau" /tmp/gqfx/tests/
          cd /tmp/gqfx/tests
          /tmp/luau-gq-fx/luau EGGRUMBLE_FXBudgetRules.spec.luau | tee /tmp/luau-gq-fx-tests.log
          grep -q EGGRUMBLE_FX_BUDGET_NATIVE_PASS /tmp/luau-gq-fx-tests.log
          echo SOURCE_NATIVE_ONLY_NOT_RC_NOT_STUDIO_NOT_ANDROID

      - name: Compile mapped 23 out of 23 author and GQ Luau sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path("handoffs/EGGRUMBLE-GQ-FX-BUDGET-20261116/EGGRUMBLE_GQ_FX_STUDIO.project.json")
          def paths(node):
              if not isinstance(node,dict): return
              if "$path" in node:
                  yield (p.parent/node["$path"]).resolve(strict=True)
              else:
                  for key,val in node.items():
                      if not key.startswith("$"): yield from paths(val)
          items=list(paths(json.loads(p.read_text())["tree"]))
          assert len(items)==23 and len(set(items))==23
          for file in items:
              subprocess.run(["/tmp/luau-gq-fx/luau-compile","--text",str(file)],stdout=subprocess.DEVNULL,check=True)
          print("EGGRUMBLE_GQ_FX_NATIVE_23_OF_23_PASS")
          PY
      - name: Build unpublished 23-source Rojo 7.7.1 private Place (SHA-pinned)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_fx_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_fx_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq_fx_rojo.zip') as z:
              paths=[x for x in z.namelist() if x.split('/')[-1]=='rojo']
              assert len(paths)==1
              p=Path('/tmp/gq_fx_rojo')
              p.write_bytes(z.read(paths[0]))
              p.chmod(0o755)
          PY
          mkdir -p artifacts
          /tmp/gq_fx_rojo build handoffs/EGGRUMBLE-GQ-FX-BUDGET-20261116/EGGRUMBLE_GQ_FX_STUDIO.project.json -o artifacts/EGGRUMBLE_GQ_FX_PRIVATE_23.rbxlx
      - name: Check 23 embedded Script Source, classes, names and SHA256
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,os,xml.etree.ElementTree as ET
          from pathlib import Path
          project=Path("handoffs/EGGRUMBLE-GQ-FX-BUDGET-20261116/EGGRUMBLE_GQ_FX_STUDIO.project.json")
          place=Path("artifacts/EGGRUMBLE_GQ_FX_PRIVATE_23.rbxlx")
          expected={}
          def walk(d):
              for key,value in d.items():
                  if key.startswith("$") or not isinstance(value,dict): continue
                  if "$path" in value:
                      src=(project.parent/value["$path"]).resolve(strict=True)
                      kind="Script" if src.name.endswith(".server.luau") else ("LocalScript" if src.name.endswith(".client.luau") else "ModuleScript")
                      assert key not in expected,("duplicate name",key)
                      expected[key]=(src,kind)
                  else: walk(value)
          walk(json.loads(project.read_text())["tree"])
          assert len(expected)==23
          actual={}
          for item in ET.fromstring(place.read_bytes()).iter("Item"):
              kind=item.attrib.get("class")
              if kind not in ("Script","LocalScript","ModuleScript"):continue
              props=item.find("Properties")
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              source=props.findtext("ProtectedString[@name='Source']")
              if source is None:source=props.findtext("string[@name='Source']")
              assert name is not None and source is not None
              assert name not in actual,("duplicate XML",name)
              actual[name]=(kind,source.replace("\r\n","\n"))
          assert set(expected)==set(actual),(set(expected)-set(actual),set(actual)-set(expected))
          manifest={}
          for name,(src,kind) in expected.items():
              xmlkind,embedded=actual[name]
              assert xmlkind==kind,("kind mismatch",name,xmlkind,kind)
              assert embedded==src.read_text(encoding="utf-8").replace("\r\n","\n"),("source mismatch",name)
              manifest[name]={"class":kind,"source_sha256":hashlib.sha256(src.read_bytes()).hexdigest()}
          receipt={
            "candidate_commit_sha":os.environ["GITHUB_SHA"],"original_author_commit_sha":"fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9",
            "original_v3_sources":21,"new_client_sources":2,"mapped_sources":23,
            "source_sha256":manifest,"private_place_sha256":hashlib.sha256(place.read_bytes()).hexdigest(),
            "private_place_bytes":place.stat().st_size,"official_rc_adopted":False,
            "roblox_studio":"NOT_TESTED","android":"NOT_TESTED","owner_accepted":False
          }
          Path("artifacts/EGGRUMBLE_GQ_FX_RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("GQ_FX_ROJO_SOURCE_EXACT_23_OF_23_PASS",receipt["private_place_sha256"],receipt["private_place_bytes"])
          PY
      - name: Archive unpublished private candidate and exact source receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE-GQ-FX-23-SOURCE-NO-RC
          path: |
            artifacts/EGGRUMBLE_GQ_FX_PRIVATE_23.rbxlx
            artifacts/EGGRUMBLE_GQ_FX_RECEIPT.json
          retention-days: 3
