name: GQ8 Real49 Musou Invul Curse + original Guild Shop = Real53 Native Rojo OFF49
on:
  push:
    branches: [quality/gq8-real48-curse-lobbyshop-intake-20261119]
    paths:
      - 'quality_gameplay/gq8_successor_real48_shop_20261119/compose_real53.py'
      - 'quality_gameplay/gq8_successor_real48_shop_20261119/test_real53.py'
      - '.github/workflows/gq8-successor-real53-shop.yml'
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_successor_real48_shop_20261119/compose_real53.py'
      - 'quality_gameplay/gq8_successor_real48_shop_20261119/test_real53.py'
      - '.github/workflows/gq8-successor-real53-shop.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real53-source-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 0360b4c377904ccf4d6ee795d7b1d638b1303a09
          path: _author816
          persist-credentials: false
      - name: Pin immutable Original44, verified Real49 and formal Core36 RC
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = f77b4d4393d9e9b19b65566413432a7a9f13962b || { echo RED_OFFICIAL_RC_MOVED; exit 1; }
          VERIFIED="$(gh run view 44389905538 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')"
          test "$VERIFIED" = "b49350c8b8aaba561c9e0839d27fc5fc275c3a32 success" || { echo RED_PARENT_REAL49_NOT_GREEN; exit 1; }
          mkdir -p artifacts/parent49 artifacts/parent44 artifacts/author808
          gh run download 44389905538 --repo "$GITHUB_REPOSITORY" \
            --name GQ8-MUSOU-INVUL-REAL49-COMPOSITE-NOT-OFFICIAL --dir artifacts/parent49
          gh run download 44385257005 --repo "$GITHUB_REPOSITORY" \
            --name GQ800-REAL44-CURSE-PRIVATE-NOT-OFFICIAL --dir artifacts/parent44
          test -s artifacts/parent49/portable49/REAL49.project.json
          test -s artifacts/parent49/portable49/PORTABLE49.receipt.json
          test -s artifacts/parent49/portable49/REAL49.rbxlx
          test -s artifacts/parent44/portable44/EGGRUMBLE_SOURCE44.project.json
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/f71eb575aacd61dd8ccb7719f7dae4caec5fedcd" --jq .content | base64 -d >artifacts/author808/EGGRUMBLE_LobbyShopCatalog.luau
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/f3cf10c8b0256896e9d194844deda91039429ddc" --jq .content | base64 -d >artifacts/author808/EGGRUMBLE_LobbyShopView.luau
          for pair in "f71eb575aacd61dd8ccb7719f7dae4caec5fedcd artifacts/author808/EGGRUMBLE_LobbyShopCatalog.luau" "f3cf10c8b0256896e9d194844deda91039429ddc artifacts/author808/EGGRUMBLE_LobbyShopView.luau" "911ce453a91b0ff7be69e232028611e906e13d3d _author816/quality_gameplay/gq805_shop_kiosk_runtime_20261118/GQ805_LobbyGuildShop.server.luau" "59eeb7c8b78a136d6bcb89062afc4f5b9d539d83 _author816/quality_gameplay/gq805_shop_kiosk_runtime_20261118/GQ805_ShopKioskClient.client.luau"; do
            set -- $pair
            test "$(git hash-object "$2")" = "$1" || { echo RED_ORIGINAL_SHOP_GIT_BLOB_CHANGED "$2"; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          folder=Path("artifacts/parent49/portable49")
          p=folder/"REAL49.rbxlx"
          assert p.stat().st_size==553099,"RED_PARENT_REAL49_PLACE_BYTES"
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="5761ddad3722486ede0f695020ea1924ff4c3fc5acfbc58ab01152434055694b","RED_PARENT_REAL49_PLACE_SHA"
          j=json.loads((folder/"PORTABLE49.receipt.json").read_text())
          assert j["real49"]==49 and j["original44"]==44 and j["original44_unchanged"]==37
          print("GQ8_REAL53_TRUE_AUTHOR49_IMMUTABLE_PARENT_PASS")
          PY
      - name: Source-select all 49 original sources and exactly 4 original shop routes
        shell: bash
        run: |
          set -euo pipefail
          AR=quality_gameplay/gq8_successor_real48_shop_20261119
          COMMON_ARGS="--original49 artifacts/parent49/portable49/REAL49.project.json --receipt49 artifacts/parent49/portable49/PORTABLE49.receipt.json --original44 artifacts/parent44/portable44/EGGRUMBLE_SOURCE44.project.json --server _author816/quality_gameplay/gq805_shop_kiosk_runtime_20261118/GQ805_LobbyGuildShop.server.luau --client _author816/quality_gameplay/gq805_shop_kiosk_runtime_20261118/GQ805_ShopKioskClient.client.luau --catalog artifacts/author808/EGGRUMBLE_LobbyShopCatalog.luau --view artifacts/author808/EGGRUMBLE_LobbyShopView.luau"
          python3 -B "$AR/compose_real53.py" $COMMON_ARGS --out artifacts/selected53
          python3 -B "$AR/test_real53.py" $COMMON_ARGS --real53 artifacts/selected53/EGGRUMBLE_REAL53.project.json
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native compile every actual 49 and every 53 source
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8real53 -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8real53 --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq8_successor_real48_shop_20261119")
          from compose_real48 import flatten
          for path,count in (("artifacts/parent49/portable49/REAL49.project.json",49),
                              ("artifacts/selected53/EGGRUMBLE_REAL53.project.json",53)):
           _,files=flatten(Path(path))
           assert len(files)==count
           for source in files.values():
            subprocess.run(["/tmp/gq8real53/luau-compile","--text",str(source)],check=True,stdout=subprocess.DEVNULL)
           print("GQ8_REAL53_NATIVE_ALL_GAME_SOURCES_PASS",count)
          PY
      - name: Pinned Rojo53 actual Source/Class, OFF49 exact Place, candidate receipt
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq8real53-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq8real53-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq8real53-rojo.zip") as z:
           files=[x for x in z.namelist() if x.split("/")[-1]=="rojo"]
           assert len(files)==1
           x=Path("/tmp/gq8real53-rojo");x.write_bytes(z.read(files[0]));x.chmod(0o755)
          PY
          /tmp/gq8real53-rojo build artifacts/parent49/portable49/REAL49.project.json -o artifacts/selected53/OFF49.rbxlx
          /tmp/gq8real53-rojo build artifacts/selected53/EGGRUMBLE_REAL53.project.json -o artifacts/selected53/EGGRUMBLE_REAL53.rbxlx
          cmp artifacts/selected53/OFF49.rbxlx artifacts/parent49/portable49/REAL49.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/selected53/EGGRUMBLE_REAL53.project.json \
            --place artifacts/selected53/EGGRUMBLE_REAL53.rbxlx --count 53
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/parent49/portable49/REAL49.project.json \
            --place artifacts/selected53/OFF49.rbxlx --count 49
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          p=Path("artifacts/selected53/EGGRUMBLE_REAL53.rbxlx")
          r=Path("artifacts/selected53/B_REAL53_INTAKE_RECEIPT.json")
          data=json.loads(r.read_text())
          data.update({"current_intake_head":os.environ["GITHUB_SHA"],
                       "parent49_immutable_success_run":44389905538,
                       "actual_private_place_bytes":p.stat().st_size,
                       "actual_private_place_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                       "native49_53":"PASS","rojo_source_class53":"PASS","off49":"BYTE_IDENTICAL",
                       "studio":"NOT_TESTED","android15":"NOT_TESTED","fun":"NO_GO",
                       "official_rc_adopted":False})
          r.write_text(json.dumps(data,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print("GQ8_REAL53_FULL_NATIVE_ROJO_OFF49_PRIVATE_PASS",data["actual_private_place_bytes"],data["actual_private_place_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-REAL53-MUSOU-INVUL-CURSE-SHOP-PRIVATE-NOT-OFFICIAL
          path: artifacts/selected53/
          retention-days: 4
          if-no-files-found: error
