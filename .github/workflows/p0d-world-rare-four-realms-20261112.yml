name: P0D original rare 4 worlds native scene + real Rojo binary
on:
  push:
    branches:
      - handoff/p0d-world-rare-4realms-3d-20261112-01
    paths:
      - 'handoffs/P0D-WORLD-RARE-4REALMS-3D-20261112-01/**'
      - '.github/workflows/p0d-world-rare-four-realms-20261112.yml'
permissions:
  contents: read
jobs:
  native-execute-original-four-worlds:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RARE_ROOT: handoffs/P0D-WORLD-RARE-4REALMS-3D-20261112-01
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify strict full SHA256 original source manifest
        run: python3 "$RARE_ROOT/tools/verify_manifest.py"
      - name: Python market, child design, safety, source tamper and nonreal QA
        run: python3 -m unittest discover -s "$RARE_ROOT/tests" -p 'test_*.py' -v
      - name: Build original upstream native Luau CLI at fixed immutable SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d-rare-luau
          git -C /tmp/p0d-rare-luau init -q
          git -C /tmp/p0d-rare-luau remote add origin https://github.com/luau-lang/luau.git
          git -C /tmp/p0d-rare-luau fetch --quiet --depth 1 origin f46d879e28302a430029304f7f6a162aed66f103
          git -C /tmp/p0d-rare-luau checkout --quiet FETCH_HEAD
          test "$(git -C /tmp/p0d-rare-luau rev-parse HEAD)" = "f46d879e28302a430029304f7f6a162aed66f103"
          cmake -S /tmp/p0d-rare-luau -B /tmp/p0d-rare-luau/build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_CLI=ON -DLUAU_BUILD_TESTS=OFF
          cmake --build /tmp/p0d-rare-luau/build --config Release --target Luau.Repl.CLI Luau.Compile.CLI -j 2
      - name: REAL native compile and execute actual four-world scene and six altered original sources
        shell: bash
        run: |
          set -euo pipefail
          for f in "$RARE_ROOT"/src/*.luau; do
            /tmp/p0d-rare-luau/build/luau-compile "$f" > /dev/null
            echo "RARE4_NATIVE_ALL_FOUR_ORIGINAL_SOURCE_COMPILE_PASS $f"
          done
          python3 "$RARE_ROOT/tools/build_native_four_realms_runner.py" --dir /tmp/p0d-rare-actual
          test "$(find /tmp/p0d-rare-actual -name '*.luau' | wc -l)" -eq 7
          for f in /tmp/p0d-rare-actual/*.luau; do
            /tmp/p0d-rare-luau/build/luau-compile "$f" > /dev/null
          done
          /tmp/p0d-rare-luau/build/luau /tmp/p0d-rare-actual/positive.luau | tee /tmp/p0d-rare-positive.txt
          grep -q "RARE4_REAL_ORIGINAL_SCENE_NATIVE_PASS assertions=" /tmp/p0d-rare-positive.txt
          for bad in BAD_PAID_OR_JOB_GATE BAD_NONSOLID_WALKWAY BAD_SKY_ROAD_MISALIGNED BAD_RARE_SCULPTURE_MISSING BAD_FALSE_GRAVITY_CLAIM BAD_ECLIPSE_PHYSICS_RISK; do
            if /tmp/p0d-rare-luau/build/luau "/tmp/p0d-rare-actual/$bad.luau" > "/tmp/p0d-rare-$bad.txt" 2>&1; then
              echo "RARE4_UNSAFE_MUTATION_ACCEPTED $bad"; exit 1
            fi
            grep -q "RARE4_NATIVE_SCENE_FAIL" "/tmp/p0d-rare-$bad.txt"
          done
          echo "RARE4_ORIGINAL_SOURCE_UNSAFE_MUTANTS_6_OF_6_REJECTED"
  real-pinned-rojo-original-3d-place:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RARE_ROOT: handoffs/P0D-WORLD-RARE-4REALMS-3D-20261112-01
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict independent check that no key or unlisted source is present
        run: python3 "$RARE_ROOT/tools/verify_manifest.py"
      - name: SHA256-pin real upstream Rojo 7.7.1 archive, not a fake builder
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
            "https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip" \
            --output "$RUNNER_TEMP/rojo.zip"
          printf '%s\n' "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $RUNNER_TEMP/rojo.zip" | sha256sum -c
          python3 - <<'PY'
          import os,pathlib,stat,zipfile
          t=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(t/"rojo.zip") as z:
              paths=[p for p in z.namelist() if p.rsplit("/",1)[-1]=="rojo"]
              assert len(paths)==1
              data=z.read(paths[0])
              assert len(data)>1_000_000
              f=t/"rojo"
              f.write_bytes(data)
              f.chmod(f.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          PY
          "$RUNNER_TEMP/rojo" --version | grep 7.7.1
      - name: Actually build genuine original Roblox review-only .rbxlx with four exact sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _rare4_real_place
          "$RUNNER_TEMP/rojo" build "$RARE_ROOT/default.project.json" -o "_rare4_real_place/RARE_FOUR_REALMS_REVIEW_ONLY.rbxlx"
          export RARE4_REAL_ROJO_PLACE="$PWD/_rare4_real_place/RARE_FOUR_REALMS_REVIEW_ONLY.rbxlx"
          test -s "$RARE4_REAL_ROJO_PLACE"
          python3 "$RARE_ROOT/tools/verify_real_rojo_xml.py" --place "$RARE4_REAL_ROJO_PLACE" --receipt "_rare4_real_place/EXACT_SOURCE_RECEIPT.json"
          python3 -m unittest discover -s "$RARE_ROOT/tests" -p 'test_real_rojo_xml.py' -v
          echo "RARE4_REAL_RBXLX_CREATED_BUT_ROBLOX_STUDIO_NOT_TESTED"
      - name: Upload owner-review-only real Place + proof, NOT game publish
        uses: actions/upload-artifact@v4
        with:
          name: P0D-RARE-FOUR-WORLDS-REAL-ROJO-REVIEW-ONLY
          path: |
            _rare4_real_place/RARE_FOUR_REALMS_REVIEW_ONLY.rbxlx
            _rare4_real_place/EXACT_SOURCE_RECEIPT.json
          if-no-files-found: error
          retention-days: 14
      - name: Check no tracked code modified
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "RARE4_REAL_ROBLOX_STUDIO_2CLIENT_MOBILE_NOT_TESTED"
