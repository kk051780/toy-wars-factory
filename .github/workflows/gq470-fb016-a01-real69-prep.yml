name: GQ470 FB016 REAL69 A01 precise canopy occlusion (source PREP, not formal RC)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_fb016_foliage_a01_real69_20261120/**'
      - '.github/workflows/gq470-fb016-a01-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  a01-source-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pinned official REAL69 and negative source tests
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=quality_gameplay/gq470_fb016_foliage_a01_real69_20261120/patch_foliage69.py
          python3 -m py_compile "$SCRIPT"
          python3 -B "$SCRIPT" --self-test
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)"
          test "$CURRENT" = "e80973c354f14a0d0088577f3cc1a875454f0f8f" || { echo RED_STALE_FORMAL_HEAD; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44695199140" --jq '.head_sha+" "+.status+" "+.conclusion')" = "e80973c354f14a0d0088577f3cc1a875454f0f8f completed success"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")" = "$CURRENT" || { echo RED_STALE_PR_BASE; exit 1; }
            test "$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")" = "$(git rev-parse HEAD)" || { echo RED_HEAD_SHA_DRIFT; exit 1; }
          fi
          mkdir -p /tmp/gq470-a01
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir /tmp/gq470-a01
          test -s /tmp/gq470-a01/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 -B "$SCRIPT" --base /tmp/gq470-a01 --head "$CURRENT"
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/gq470-a01')
          r=json.loads((root/'REAL69_LEGACY_INTAKE_RECEIPT.json').read_text())
          x=r['gq470_fb016_true_occlusion']
          assert x['other_selected_sources_byte_exact']==68 and x['new_parts']==0
          assert x['max_canopies']==160 and x['max_tracked_parts']==1800
          assert not x['remote_or_damage_changes'] and x['human_art']=='NOT_TESTED'
          assert x['android15']=='NOT_TESTED' and not x['owner_accepted']
          print('FB016_A01_REAL69_CONSERVATION_AND_BUDGET_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Pinned native Luau all 69 selected ON and OFF
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-a01-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-a01-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq470_fb016_foliage_a01_real69_20261120')
          from patch_foliage69 import selected,TARGET,EXPECTED,digest,FEATURE
          base=Path('/tmp/gq470-a01')
          now=selected(base);off=selected(base/'OFF69_A01_FB016')
          assert len(now)==len(off)==69 and set(now)==set(off)
          assert {route for route in now if now[route].read_bytes()!=off[route].read_bytes()}=={TARGET}
          assert digest(off[TARGET].read_bytes())==EXPECTED
          assert FEATURE.encode() in now[TARGET].read_bytes()
          assert all(now[k].read_bytes()==off[k].read_bytes() for k in now if k!=TARGET)
          for name,entries in [('ON',now),('OFF',off)]:
           for route,source in entries.items():
            subprocess.run(['/tmp/gq470-a01-luau/luau-compile','--text',str(source)],
                           stdout=subprocess.DEVNULL,check=True)
           print('GQ470_A01_NATIVE_LUAU_'+name+'_69_PASS')
          PY
      - name: Pinned Rojo all 69 and exact OFF inverse + 17 family + 48 inventory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-a01-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-a01-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq470-a01-rojo.zip') as z:
           names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
           assert len(names)==1
           p=Path('/tmp/gq470-a01-rojo')
           p.write_bytes(z.read(names[0]))
           p.chmod(0o755)
          PY
          /tmp/gq470-a01-rojo build /tmp/gq470-a01/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-a01/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          /tmp/gq470-a01-rojo build /tmp/gq470-a01/OFF69_A01_FB016/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-a01/OFF69_A01_FB016_REBUILT.rbxlx
          cmp /tmp/gq470-a01/OFF69_A01_FB016_REBUILT.rbxlx /tmp/gq470-a01/OFF69_A01_FB016/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-a01/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-a01/EGGRUMBLE_REAL69_PRIVATE.rbxlx --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-a01/OFF69_A01_FB016/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-a01/OFF69_A01_FB016_REBUILT.rbxlx --count 69
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          from quality_gameplay.gq8_rc85_rc86_real69_nonloss_20261120.verify_real69 import marker_check
          base=pathlib.Path('/tmp/gq470-a01')
          receiptfile=base/'REAL69_LEGACY_INTAKE_RECEIPT.json'
          receipt=json.loads(receiptfile.read_text())
          sources=project_scan(base,'EGGRUMBLE_REAL69.project.json')
          original=project_scan(base/'OFF69_A01_FB016','EGGRUMBLE_REAL69.project.json')
          assert len(sources)==len(original)==69
          assert {k for k in sources if sources[k]['sha256']!=original[k]['sha256']}=={'StarterPlayer/StarterPlayerScripts/EGGRUMBLE_ArtDistanceLOD'}
          assert all(sources[k]['class']==original[k]['class'] and sources[k]['path']==original[k]['path'] for k in sources)
          assert set(receipt['source_hashes'])==set(sources)
          assert all(receipt['source_hashes'][k]==sources[k]['sha256'] for k in sources)
          families=marker_check(sources)
          assert len(families)==17
          place=base/'EGGRUMBLE_REAL69_PRIVATE.rbxlx'
          receipt['build_head']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          receipt['private_place_bytes']=place.stat().st_size
          receipt['private_place_sha256']=hashlib.sha256(place.read_bytes()).hexdigest()
          receipt['gq470_fb016_true_occlusion']['native_rojo_off69']='PASS_SOURCE_ONLY'
          receiptfile.write_text(json.dumps(receipt,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          (base/'FB016_LEGACY17.json').write_text(json.dumps({'family_count':len(families),'families':families,'studio':'NOT_TESTED','art':'NO_GO'},indent=2)+'\n')
          (base/'FB016_ART_REPORT.json').write_text(json.dumps({
           'schema':'GQ470_A01_FB016_ART_GATE_PREP_V1','candidate_head':receipt['build_head'],
           'base_official_head':'e80973c354f14a0d0088577f3cc1a875454f0f8f',
           'selected_scripts':69,'changed_source_routes':1,'untouched_source_routes':68,
           'source_gate':'PASS_SOURCE_ONLY','native_luau':'PASS','rojo':'PASS',
           'rollback':'PASS','screenshots_actual':0,'screenshots_required':32,
           'android_15min':'NOT_TESTED','first3min':'NOT_TESTED',
           'human_art':'NOT_TESTED','owner_accepted':False,
           'art_gate':'NO_GO','product_gate':'NO_GO'},indent=2)+'\n')
          print('GQ470_A01_ROJO69_OFF69_LEGACY17_ART_SOURCE_PASS_NOT_STUDIO',place.stat().st_size)
          PY
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base /tmp/gq470-a01 --report /tmp/gq470-a01/FB016_LEGACY48.json
          echo 'GQ470_FB016_ALL_69_LUAU_ROJO_OFF_LEGACY17_48_PASS_ART_NO_GO'
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-FB016-A01-REAL69-PREP-NOT-FORMAL
          path: |
            /tmp/gq470-a01/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-a01/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-a01/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-a01/sources/**
            /tmp/gq470-a01/OFF69_A01_FB016_REBUILT.rbxlx
            /tmp/gq470-a01/FB016_LEGACY17.json
            /tmp/gq470-a01/FB016_LEGACY48.json
            /tmp/gq470-a01/FB016_ART_REPORT.json
          if-no-files-found: error
          retention-days: 7
