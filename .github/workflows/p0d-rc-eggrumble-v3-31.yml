          test "$(git -C _gq492_original rev-parse HEAD)" = eb38aa60b69ed0bdd80fb7ea0dd10cf230345c20
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            current_base=$(python3 -c 'import json,os;print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["base"]["sha"])')
            # GitHub PR event base SHA can lag an official ref advance even after
            # a verified rebase. Accept only the current, attested PR head if it
            # actually contains the live RC commit; reject stale/unrelated code.
            live_base=$(git ls-remote origin refs/heads/rc/p0d-s1-kids-rc01 | awk '{print $1}')
            test -n "$live_base" || { echo "RED: missing live RC branch"; exit 1; }
            if [ "$current_base" != "$live_base" ]; then
              candidate_head=$(python3 -c 'import json,os;print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["head"]["sha"])')
              candidate_branch=$(python3 -c 'import json,os;print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["head"]["ref"])')
              remote_head=$(git ls-remote origin "refs/heads/$candidate_branch" | awk '{print $1}')
              test -n "$remote_head" && test "$remote_head" = "$candidate_head" \
                || { echo "RED: stale or foreign candidate PR head"; exit 1; }
              git fetch --no-tags --depth=64 origin "$live_base" "$candidate_head" >/dev/null
              git merge-base --is-ancestor "$live_base" "$candidate_head" \
                || { echo "RED: official branch changed; rebase GQ470 optional32"; exit 1; }
              echo "GQ470_CURRENT_OFFICIAL_ANCESTOR_AND_CANDIDATE_HEAD_VERIFIED"
            fi
          fi
          python3 -B -m unittest discover -v \
            -s rc_fastlane/quality_spectator32_optional -p 'test_*.py'
          SRC=_gq492_original/handoffs/P0D-PQG-SPECTATE-20261116-01/EGGRUMBLE_Spectate.client.luau
          SELECT=_gq634_intake/rc_fastlane/quality_spectate492_rc32/admit_spectator.py
          DIR=artifacts/gq470_optional32
          mkdir -p "$DIR"
          # Match the CURRENT actual canonical Place; no hardcoded generation path.
          BASE=$(python3 -B rc_fastlane/quality_spectator32_optional/resolve_current31.py \
            --place artifacts/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx \
            --directory artifacts --selector "$SELECT" \
            --receipt "$DIR/GQ470_CANONICAL31_MATCH_RECEIPT.json")
          OUT="$DIR/GQ470_SPECTATE32_OPTIONAL.project.json"
          PLACE="$DIR/EGGRUMBLE_V3_SPECTATE32_OPTIONAL_STUDIO.rbxlx"
          RECEIPT="$DIR/GQ492_ORIGINAL_SELECTOR_RECEIPT.json"
          mkdir -p "$DIR"
          python3 -B "$SELECT" prepare --base "$BASE" --source "$SRC" \
            --out "$OUT" --receipt "$RECEIPT"
          python3 - "$OUT" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);doc=json.loads(p.read_text(encoding="utf-8"))
          assert doc["name"]=="EGGRUMBLE_GQ492_SPECTATE32_PRIVATE_NOT_OFFICIAL_RC"
          doc["name"]="EGGRUMBLE_V3_OPTIONAL32_SPECTATOR_STUDIO_ONLY"
          p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          /tmp/gq530_all31_native/luau-compile --text "$SRC" >/dev/null
          python3 - "$OUT" "$SELECT" <<'PY'
          import importlib.util,json,subprocess,sys
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("intake",sys.argv[2])
          lib=importlib.util.module_from_spec(spec);spec.loader.exec_module(lib)
          path=Path(sys.argv[1]);sources=lib.source_map(json.loads(path.read_text()),path)
          assert len(sources)==32
          for name,(file,clazz) in sources.items():
              subprocess.run(["/tmp/gq530_all31_native/luau-compile","--text",str(file)],
                             check=True,stdout=subprocess.DEVNULL)
          print("GQ470_OPTIONAL32_ALL_REAL_LUAU_NATIVE_COMPILE_PASS")
          PY
          /tmp/gq530-all31-rojo build "$OUT" -o "$PLACE"
          python3 -B "$SELECT" verify --base "$BASE" --source "$SRC" \
            --out "$OUT" --receipt "$RECEIPT" --place "$PLACE"
          python3 -B rc_fastlane/quality_spectator32_optional/prove_hit_inheritance.py \
            --base "$BASE" --optional "$OUT" --place "$PLACE" --selector "$SELECT" \
            --out "$DIR/GQ470_HIT042_INHERITANCE_PROOF.json"
