    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'rc_fastlane/EGGRUMBLE_V3_ACTIVE.json'
      - 'rc_fastlane/ACTIVE.json'
      - '.github/workflows/p0d-rc-eggrumble-v3-31.yml'
      - 'rc_fastlane/quality_egg515_rc31/**'
      - 'rc_fastlane/quality_item525_rc31/**'
      - 'rc_fastlane/quality_rctrace8/**'
      - 'rc_fastlane/quality_prompt611_rc31/**'
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'rc_fastlane/EGGRUMBLE_V3_ACTIVE.json'
      - 'rc_fastlane/ACTIVE.json'
      - '.github/workflows/p0d-rc-eggrumble-v3-31.yml'
      - 'rc_fastlane/quality_egg515_rc31/**'
      - 'rc_fastlane/quality_item525_rc31/**'
      - 'rc_fastlane/quality_rctrace8/**'
      - 'rc_fastlane/quality_prompt611_rc31/**'
