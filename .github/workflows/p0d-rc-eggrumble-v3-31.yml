          mapping=SourceFileLoader("source31","rc_fastlane/select_gq541_original_neutral_fallback.py").load_module()
          original,part=mapping.flatten(base)
          boss=("ServerScriptService","EGGRUMBLE_NeutralStoneGiant")
          if len(part)!=31 or boss not in part:raise ValueError("RED_BOSS_SINGLETON_MISSING")
          before=part[boss].read_bytes()
          if author.git_blob_sha(before)!=author.ORIGINAL_BLOB:raise ValueError("RED_BOSS_AUTHOR_SOURCE_BLOB_DRIFT")
          amended=author.patch_bytes(before)
          old=before.decode("utf-8");new=amended.decode("utf-8")
          if new.replace(author.FUNCTION_ADD,"",1).replace(author.DAMAGE_REPLACEMENT,author.DAMAGE_ANCHOR,1)!=old:
              raise ValueError("RED_GQ518_BOSS_ROLLBACK")
          file=root/"GQ518_CURRENT_STONE_GIANT.luau"
          if file.exists():raise ValueError("RED_GQ518_FILE_COLLISION")
          file.write_bytes(amended)
          selected=copy.deepcopy(original)
          selected["tree"]["ServerScriptService"]["EGGRUMBLE_NeutralStoneGiant"]["$path"]=file.name
          out.write_text(json.dumps(selected,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          _,current=mapping.flatten(out)
          if set(part)!=set(current) or len(current)!=31:raise ValueError("RED_GQ518_SCRIPT_SET_DRIFT")
