              raise ValueError("RED_BOSS_ONLY_CHANGED")
          place=root/"GQ518_BOSS_TRUE_ROJO31.rbxlx"
          embedded={}
          for item in ET.parse(place).getroot().iter("Item"):
              kind=item.get("class")
              if kind not in ("Script","LocalScript","ModuleScript"):continue
              properties=item.find("Properties")
              if properties is None:raise ValueError("RED_BOSS_ROJO_PROPS")
              name=properties.findtext("string[@name='Name']")
              source=properties.findtext("ProtectedString[@name='Source']")
              if source is None:source=properties.findtext("string[@name='Source']")
              if not name or source is None or name in embedded:raise ValueError("RED_BOSS_ROJO_DUPLICATE")
              embedded[name]=(kind,source.replace("\r\n","\n"))
          if len(embedded)!=31 or set(embedded)!={k[-1] for k in selected}:
              raise ValueError("RED_BOSS_NOT_REAL_ROJO31")
          for route,source in selected.items():
