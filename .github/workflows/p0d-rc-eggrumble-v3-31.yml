name: P0D EGGRUMBLE V3 official RC companion 31-source pinned build
on:
  push:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'rc_fastlane/EGGRUMBLE_V3_ACTIVE.json'
      - 'rc_fastlane/ACTIVE.json'
      - '.github/workflows/p0d-rc-eggrumble-v3-31.yml'
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'rc_fastlane/EGGRUMBLE_V3_ACTIVE.json'
      - 'rc_fastlane/ACTIVE.json'
      - '.github/workflows/p0d-rc-eggrumble-v3-31.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-v3-companion31:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read exact successful GQ530 all-domain source-select composer (immutable)
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: f5594979f7ad1852442ea917fbd5f3bdad1698ec
          path: _gq530_official_source
          persist-credentials: false
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9, path: _v3_original, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: 6b52eaf1f2725496277998fe0c5532b7a8fcaab5, path: _v3_quality, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: e86702c906bdf9c71adcdf769ae48a206b26607b, path: _v3_art, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: 438a406ccfda5563053d783d7561797ccd364361, path: _v3_score, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: af8cd79f4217d187429270d29e6d44eb01725ff2, path: _v3_pacing, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: 880e89baa428006699f1e6d6d95468473acaf866, path: _v3_fair, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: d3d231612f0da24616514b37dc465c4883e2f304, path: _v3_melee, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: 6b29c50b6cc0b25192a121b2957497ede8b07f37, path: _v3_budget, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: e78bff41e70564d0b26578e3c3a85f4698e6110e, path: _v3_member, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: 99ae00fbec2b5057c54e938d741ea99b0caad924, path: _gq_pvp, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: 0338bd13f9d3d199972bd4cd30e467443083dffa, path: _gq_mage, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: 8f0275692c54874f823d66748d470fb849607df5, path: _gq_dot, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: f90875e14446ba86b1c668ba43efa37fbc74be20, path: _gq_warp, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: 6846e9d55d07f0204748bbb8f46eef08f46c1b04, path: _gq_member, persist-credentials: false}
      - name: Source lock all original owners and symlink existing trusted author modules read-only
        run: |
          set -euo pipefail
          test "$(git -C _v3_melee rev-parse HEAD)" = d3d231612f0da24616514b37dc465c4883e2f304
          test "$(git -C _v3_member rev-parse HEAD)" = e78bff41e70564d0b26578e3c3a85f4698e6110e
          test "$(git -C _gq_member rev-parse HEAD)" = 6846e9d55d07f0204748bbb8f46eef08f46c1b04
          test "$(git -C _gq530_official_source rev-parse HEAD)" = f5594979f7ad1852442ea917fbd5f3bdad1698ec
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$GITHUB_BASE_REF" = rc/p0d-s1-kids-rc01
            echo "GQ_PREMERGE_TO_RC_VALIDATION"
          else
            test "$GITHUB_REF" = refs/heads/rc/p0d-s1-kids-rc01
            echo "GQ_OFFICIAL_RC_BRANCH_VALIDATION"
          fi
          mkdir -p quality_gameplay handoffs
          test ! -e handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116
          ln -s "$(pwd)/_v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116" handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116
          test ! -e quality_gameplay/v3_dead_caster_fence_20261116
          ln -s "$(pwd)/_gq530_official_source/quality_gameplay/v3_dead_caster_fence_20261116" quality_gameplay/v3_dead_caster_fence_20261116
          ln -s "$(pwd)/_gq_pvp/quality_gameplay/v3_human_stealth_pvp_20261116" quality_gameplay/v3_human_stealth_pvp_20261116
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("rc_fastlane/EGGRUMBLE_V3_ACTIVE.json").read_text())
          assert m["schema"]=="P0D_EGGRUMBLE_V3_CANONICAL_RC_COMPANION_V1"
          assert m["enabled"] and m["source_count"]==31
          assert m["canonical_branch"]=="rc/p0d-s1-kids-rc01"
          assert m["source_heads"]["fused_gameplay_quality530"]=="f5594979f7ad1852442ea917fbd5f3bdad1698ec"
          assert m["source_heads"]["neutral_melee533"]=="d3d231612f0da24616514b37dc465c4883e2f304"
          assert m["source_heads"]["membership_host531"]=="e78bff41e70564d0b26578e3c3a85f4698e6110e"
          assert m["feature_flags"]["DEAD_CASTER_FENCE_530"]
          assert not m["publication_authorized"]
          print("OFFICIAL_V3_RC_PROFILE_MANIFEST_PIN_PASS")
          PY
          ln -s "$(pwd)/_v3_member" _gq_host
          ln -s "$(pwd)/_v3_quality" _gq_ai
          python3 -m unittest discover -s quality_gameplay/v3_dead_caster_fence_20261116/tests -v
      - name: Reuse true original 482+484+485+487 ART AI SCORE 26-source author composer
        run: |
          set -euo pipefail
          mkdir -p artifacts/gq530_all31
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py \
            --target v3 \
            --author-project _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json \
            --out artifacts/GQ_V3_31_ART_BASE.project.json
          python3 _v3_quality/quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py \
            --author _v3_original --quality _v3_quality --art _v3_art --score _v3_score \
            --art-project artifacts/GQ_V3_31_ART_BASE.project.json \
            --out artifacts/GQ_V3_31_BASE26.project.json
      - name: Reuse original #494+#501 one neutral Swarm 28 (no new neutral writer)
        run: |
          set -euo pipefail
          python3 _v3_fair/quality_gameplay/neutral_encounters/tools/compose_dual28.py \
            --base26 artifacts/GQ_V3_31_BASE26.project.json \
            --original-swarm _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_SwarmCombat.luau \
            --pacing-composer _v3_pacing/quality_gameplay/neutral_pacing/tools/compose_private_v3.py \
            --pacing-policy _v3_pacing/quality_gameplay/neutral_pacing/EGGRUMBLE_NeutralSpawnPacing.luau \
            --fair-policy _v3_fair/quality_gameplay/neutral_encounters/EGGRUMBLE_NeutralEncounterFairness.luau \
            --out artifacts/GQ_V3_31_DUAL28.project.json
      - name: Reuse original #533 soldier melee exactly once 29
        run: |
          set -euo pipefail
          python3 _v3_melee/quality_gameplay/neutral_melee_pressure_20261116/compose_triple29.py \
            --base28 artifacts/GQ_V3_31_DUAL28.project.json \
            --original-swarm _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_SwarmCombat.luau \
            --melee-policy _v3_melee/quality_gameplay/neutral_melee_pressure_20261116/EGGRUMBLE_NeutralMeleePolicy.luau \
            --out artifacts/GQ_V3_31_TRIPLE29.project.json
      - name: Reuse original #528 shared neutral budget and #531 current Human/Bot match 30
        run: |
          set -euo pipefail
          python3 _v3_melee/quality_gameplay/neutral_melee_pressure_20261116/compose_author_admission30.py \
            --base29 artifacts/GQ_V3_31_TRIPLE29.project.json \
            --author528 _v3_budget/quality_gameplay/gq_dual_mode_neutral_budget_20261116/tools/compose_private_v3.py \
            --author531 _v3_member/quality_gameplay/v3_bot_human_match_membership_20261116/compose.py \
            --policy528 _v3_budget/quality_gameplay/gq_dual_mode_neutral_budget_20261116/EGGRUMBLE_DualModeNeutralBudget.luau \
            --out artifacts/GQ_V3_31_EXISTING_AUTHOR30.project.json
      - name: Select six-author single Combat+original StatusFence 31; preserve other 29 author sources byte exact
        run: |
          set -euo pipefail
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/compose_all_domain31.py \
            --base30 artifacts/GQ_V3_31_EXISTING_AUTHOR30.project.json \
            --out artifacts/gq530_all31
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/compose_all_domain31.py \
            --base30 artifacts/GQ_V3_31_EXISTING_AUTHOR30.project.json \
            --out artifacts/gq530_all31 --off
          python3 - <<'PY'
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          import sys
          sys.path.insert(0,str(Path("quality_gameplay/v3_dead_caster_fence_20261116/tools").resolve()))
          m=SourceFileLoader("all31","quality_gameplay/v3_dead_caster_fence_20261116/tools/compose_all_domain31.py").load_module()
          root=Path("artifacts/gq530_all31")
          on=(root/"GQ31_SINGLE_COMBAT_ON.luau").read_text()
          off=(root/"GQ31_SINGLE_COMBAT_OFF.luau").read_text()
          assert on.replace(m.REPLACEMENT,m.ENTRY,1)==off
          assert len(on.encode())-len(off.encode())==160
          print("GQ31_EIGHT_DOMAIN_ALL_AUTHOR_SOURCE_ON_OFF_EXACT_160_BYTES_PASS")
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq_luau
          persist-credentials: false
      - name: Native compile all 31 ON+OFF scripts and execute 84 original 7-role negative cases
        run: |
          set -euo pipefail
          cmake -S _gq_luau -B /tmp/gq530_all31_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq530_all31_native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          import sys
          sys.path.insert(0,str(Path("quality_gameplay/v3_dead_caster_fence_20261116/tools").resolve()))
          m=SourceFileLoader("all31","quality_gameplay/v3_dead_caster_fence_20261116/tools/compose_all_domain31.py").load_module()
          root=Path("artifacts/gq530_all31").resolve()
          for mode in ("ON","OFF"):
            _,files=m.flat(root/("GQ31_"+mode+".project.json"))
            assert len(files)==31
            for path in files.values():
              subprocess.run(["/tmp/gq530_all31_native/luau-compile","--text",str(path)],check=True,stdout=subprocess.DEVNULL)
            print("GQ31_EIGHT_DOMAIN_ALL_REAL_LUAU_COMPILE_PASS",mode,31)
          PY
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/six_native.py \
            --combat artifacts/gq530_all31/GQ31_SINGLE_COMBAT_ON.luau \
            --out artifacts/gq530_all31/REAL_84.luau
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/six_native.py \
            --combat artifacts/gq530_all31/GQ31_SINGLE_COMBAT_ON.luau --mutant \
            --out artifacts/gq530_all31/OLD_GUARD_MUTANT.luau
          /tmp/gq530_all31_native/luau artifacts/gq530_all31/REAL_84.luau | tee /tmp/gq530-all31-84.log
          grep -q NATIVE_REAL_AUTHOR_EXECUTE_84_CASES_PASS /tmp/gq530-all31-84.log
          if /tmp/gq530_all31_native/luau artifacts/gq530_all31/OLD_GUARD_MUTANT.luau; then
            echo 'RED dead caster mutant did not fail'; exit 1
          fi
          echo GQ31_EIGHT_DOMAIN_DEAD_CASTER_NEGATIVE_REPRODUCED
          python3 _gq_member/quality_gameplay/v3_human_combat_membership_20261116/make_native_harness.py \
            --combat artifacts/gq530_all31/GQ31_SINGLE_COMBAT_ON.luau \
            --host artifacts/ADMISSION30_EGGRUMBLE_LobbyCastleModesPreview.server.luau \
            --out artifacts/gq530_all31/REAL_MEMBER_14.luau
          /tmp/gq530_all31_native/luau artifacts/gq530_all31/REAL_MEMBER_14.luau | tee /tmp/gq530-all31-member14.log
          grep -q GQ_HUMAN_COMBAT_MEMBERSHIP_REAL_SOURCE_14_CASES_PASS /tmp/gq530-all31-member14.log
      - name: Original neutral melee and budget Luau proof retained in true 31-source world
        run: |
          set -euo pipefail
          python3 _v3_melee/quality_gameplay/neutral_melee_pressure_20261116/make_native_policy_harness.py \
            --out artifacts/gq530_all31/MELEE.luau
          /tmp/gq530_all31_native/luau artifacts/gq530_all31/MELEE.luau | tee /tmp/gq530-all31-melee.log
          grep -q EGGRUMBLE_NEUTRAL_MELEE_PURE_POLICY_NATIVE_PASS /tmp/gq530-all31-melee.log
          python3 - <<'PY'
          from pathlib import Path
          policy=Path("_v3_budget/quality_gameplay/gq_dual_mode_neutral_budget_20261116/EGGRUMBLE_DualModeNeutralBudget.luau").read_text()
          cases=Path("_v3_budget/quality_gameplay/gq_dual_mode_neutral_budget_20261116/tests/budget_native_cases.luau").read_text()
          assert policy.rstrip().endswith("return Budget")
          Path("artifacts/gq530_all31/BUDGET.luau").write_text(policy[:policy.rfind("return Budget")]+cases)
          PY
          /tmp/gq530_all31_native/luau artifacts/gq530_all31/BUDGET.luau | tee /tmp/gq530-all31-budget.log
          grep -q GQ_DUAL_MODE_NEUTRAL_BUDGET_NATIVE_PASS /tmp/gq530-all31-budget.log
      - name: Pinned Rojo 7.7.1 true ON31 and rollback OFF31 with Script Class/Source SHA exact
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq530-all31-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq530-all31-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq530-all31-rojo.zip") as z:
            found=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
            assert len(found)==1
            exe=Path("/tmp/gq530-all31-rojo")
            exe.write_bytes(z.read(found[0]))
            exe.chmod(0o755)
          PY
          /tmp/gq530-all31-rojo build artifacts/gq530_all31/GQ31_ON.project.json \
            -o artifacts/gq530_all31/GQ31_ON_PRIVATE.rbxlx
          /tmp/gq530-all31-rojo build artifacts/gq530_all31/GQ31_OFF.project.json \
            -o artifacts/gq530_all31/GQ31_OFF_PRIVATE.rbxlx
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/compose_all_domain31.py \
            --out artifacts/gq530_all31 --place artifacts/gq530_all31/GQ31_ON_PRIVATE.rbxlx
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/compose_all_domain31.py \
            --out artifacts/gq530_all31 --off --place artifacts/gq530_all31/GQ31_OFF_PRIVATE.rbxlx
          echo GQ31_EIGHT_DOMAIN_ALL_AUTHOR_ON_OFF_PRIVATE_SOURCE_CLASS_EXACT_PASS
      - name: Attest official RC branch HEAD and emit one canonical V3 studio companion Place
        run: |
          set -euo pipefail
          cp artifacts/gq530_all31/GQ31_ON_PRIVATE.rbxlx artifacts/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          base=Path("artifacts/gq530_all31")
          m=json.loads(Path("rc_fastlane/EGGRUMBLE_V3_ACTIVE.json").read_text())
          src=json.loads((base/"GQ31_ON_RECEIPT.json").read_text())
          off=json.loads((base/"GQ31_OFF_RECEIPT.json").read_text())
          place=base/"EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx"
          assert (os.environ["GITHUB_REF"]=="refs/heads/rc/p0d-s1-kids-rc01"
                  or (os.environ.get("GITHUB_EVENT_NAME")=="pull_request"
                      and os.environ.get("GITHUB_BASE_REF")=="rc/p0d-s1-kids-rc01"))
          assert m["source_count"]==src["source_count"]==off["source_count"]==31
          assert src["real_rojo_source_class_exact_31"] and off["real_rojo_source_class_exact_31"]
          assert src["previous_owner30_unchanged_sources"]==29
          assert src["combat_sha256"]!=off["combat_sha256"]
          assert place.read_bytes()==(base/"GQ31_ON_PRIVATE.rbxlx").read_bytes()
          details={
            "status":("RC_PREMERGE_COMPANION_PROFILE_BUILD_PASS_NOT_STUDIO_PLAYTESTED"
                      if os.environ.get("GITHUB_EVENT_NAME")=="pull_request"
                      else "CANONICAL_RC_BRANCH_COMPANION_PROFILE_BUILD_PASS_NOT_STUDIO_PLAYTESTED"),
            "release_profile":"eggrumble_v3_31",
            "canonical_branch":"rc/p0d-s1-kids-rc01",
            "github_commit_sha":os.environ["GITHUB_SHA"],
            "source_author_heads":m["source_heads"],
            "script_count":31,
            "script_source_and_class_exact":"31/31",
            "original_owner30_untouched_except_combat":29,
            "single_game_and_combat":True,
            "rollback_on_off_combat_bytes":160,
            "place_name":place.name,
            "place_size_bytes":place.stat().st_size,
            "place_sha256":hashlib.sha256(place.read_bytes()).hexdigest(),
            "private_qa_receipt_sha256":hashlib.sha256((base/"GQ31_ON_RECEIPT.json").read_bytes()).hexdigest(),
            "s1_active_profile_unchanged":True,
            "official_rc_commit_verified":os.environ.get("GITHUB_EVENT_NAME")=="push",
            "real_studio_2client":"NOT_TESTED",
            "android_15min":"NOT_TESTED",
            "owner_acceptance":"NOT_TESTED",
            "roblox_publish":False,
            "official_rc_zip_size_bytes":"PROVIDER_ARTIFACT_METADATA_CHECK_AFTER_UPLOAD"
          }
          (base/"EGGRUMBLE_V3_OFFICIAL_RC31_RECEIPT.json").write_text(json.dumps(details,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print("EGGRUMBLE_V3_OFFICIAL_RC31_STUDIO_PLACE_SOURCE_EXACT_READY",place.stat().st_size,details["place_sha256"])
          PY
      - name: Upload actual canonical RC branch V3 companion Studio Place and rollback evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P0D-EGGRUMBLE-V3-RC31-CANONICAL-COMPANION-STUDIO
          path: |
            artifacts/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx
            artifacts/gq530_all31/GQ31_OFF_PRIVATE.rbxlx
            artifacts/gq530_all31/EGGRUMBLE_V3_OFFICIAL_RC31_RECEIPT.json
            artifacts/gq530_all31/GQ31_ON_RECEIPT.json
            artifacts/gq530_all31/GQ31_OFF_RECEIPT.json
            artifacts/gq530_all31/GQ31_ON.project.json
            artifacts/gq530_all31/GQ31_OFF.project.json
          retention-days: 3

      - name: SOURCE-ONLY candidate admission of genuine existing #489 Item (PR preview only)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 03c51bf5c8d12484bd8dc4667b0d3d3841cb4ddd
          path: _gq_original_item489
          persist-credentials: false
      - name: Run original author #489 exact source selection, 31 native Luau, and 7 source-lock regressions
        if: github.event_name == 'pull_request'
        env:
          GQ_AUTHOR489_ITEM: _gq_original_item489/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_FieldItemPickups.luau
          GQ_AUTHOR482_ITEM: _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_FieldItemPickups.luau
          GQ_BASE31_PROJECT: artifacts/gq530_all31/GQ31_ON.project.json
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _gq_original_item489 rev-parse HEAD)" = 03c51bf5c8d12484bd8dc4667b0d3d3841cb4ddd
          python3 -B -m unittest discover -s rc_fastlane/quality_item489_rc31 -p 'test_selection.py' -v
          python3 -B rc_fastlane/quality_item489_rc31/select_original_item489.py prepare \
            --base "$GQ_BASE31_PROJECT" \
            --item "$GQ_AUTHOR489_ITEM" \
            --out artifacts/gq530_all31/GQ31_ITEM489_ON.project.json
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys
          sys.path.insert(0,"rc_fastlane/quality_item489_rc31")
