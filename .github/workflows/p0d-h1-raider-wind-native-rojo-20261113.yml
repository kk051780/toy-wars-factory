name: P0D H1 Raider Wind real Luau and Rojo isolated review
on:
  push:
    branches:
      - feature/p0d-h1-raider-wind-guardian-counterplay-20261113-01
permissions:
  contents: read
jobs:
  h1-wind-only:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P0D_PROJECT: releases/P0D_S1_KIDS_RC01
      P0D_QA: handoffs/P0D-H1-ROLE-WIND-20261113-01/verify_h1_wind.py
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout H1 isolated source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact original 8safe ancestor and full 38 file SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e '3120b9d3c0a5ec58c9f2613c5d186f3493b54f83^{commit}'
          python3 -B "$P0D_QA"
          python3 -B -m unittest discover -s "$P0D_PROJECT/tests" -p 'test_*.py' -v
      - name: Fetch genuine immutable Rojo 7.7.1 build tool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_h1_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_h1_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import pathlib,stat,zipfile
          with zipfile.ZipFile("/tmp/p0d_h1_rojo.zip") as z:
              paths=[n for n in z.namelist() if n.rsplit("/",1)[-1]=="rojo"]
              assert len(paths)==1
              p=pathlib.Path("/tmp/p0d_h1_rojo");p.write_bytes(z.read(paths[0]))
              p.chmod(p.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_h1_rojo --version | grep -F 7.7.1
      - name: Build one actual unpublished H1 role tactical S1 Place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_h1_output
          /tmp/p0d_h1_rojo build "$P0D_PROJECT/default.project.json" -o /tmp/p0d_h1_output/TRAP_RAIDERS_S1_H1_RAIDER_WIND_REVIEW.rbxlx
          test -s /tmp/p0d_h1_output/TRAP_RAIDERS_S1_H1_RAIDER_WIND_REVIEW.rbxlx
          python3 -B "$P0D_QA" --place /tmp/p0d_h1_output/TRAP_RAIDERS_S1_H1_RAIDER_WIND_REVIEW.rbxlx
      - name: Checkout pinned official native Luau compiler source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_h1_luau
          fetch-depth: 1
          persist-credentials: false
      - name: Build official Luau native CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_h1_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_h1_luau -B /tmp/p0d_h1_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_h1_native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
      - name: Compile genuine 22 current Luau files + reject bad syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess
          src=sorted(pathlib.Path(os.environ["P0D_PROJECT"]).joinpath("src").rglob("*.luau"))
          assert len(src)==22,len(src)
          for f in src:
              p=subprocess.run(["/tmp/p0d_h1_native/luau-compile",str(f)],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              assert p.returncode==0,(f,p.stderr.decode(errors="replace")[-800:])
          bad=pathlib.Path("/tmp/p0d_h1_broken.luau");bad.write_text("local = 1\n",encoding="utf8")
          assert subprocess.run(["/tmp/p0d_h1_native/luau-compile",str(bad)],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE).returncode!=0
          print("P0D_H1_WIND_NATIVE_22_OF_22_COMPILE_PASS")
          PY
      - name: Execute pure real WindRules module behavior + nine unsafe mutants
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$P0D_QA" --luau /tmp/p0d_h1_native/luau
      - name: Retain unpublished H1 only source-generated Place for review
        uses: actions/upload-artifact@v4
        with:
          name: P0D-H1-RAIDER-WIND-PRIVATE-REVIEW-ONLY
          path: /tmp/p0d_h1_output/TRAP_RAIDERS_S1_H1_RAIDER_WIND_REVIEW.rbxlx
          if-no-files-found: error
          retention-days: 14
