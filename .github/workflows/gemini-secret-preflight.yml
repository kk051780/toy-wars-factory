name: TOY WARS Gemini free-key presence check (NO AI inference)
on:
  push:
    branches: [main]
    paths:
      - 'ops/GEMINI_SECRET_PRESENCE_REQUEST.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GEMINI_SECRET_PRESENT: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - name: Check only if a nonempty Gemini key is available
        run: |
          if [ "$GEMINI_SECRET_PRESENT" = "true" ]; then
            echo "GEMINI_SECRET_PRESENT=YES" >> "$GITHUB_STEP_SUMMARY"
            echo "GEMINI_KEY_PRESENCE_PASS"
          else
            echo "GEMINI_SECRET_PRESENT=NO" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Repository Actions secret GEMINI_API_KEY is missing/empty"
            exit 1
          fi
          echo "This does not read/reveal the key, send source to Google, charge an AI provider, test the key's validity, or authorize AI coding." >> "$GITHUB_STEP_SUMMARY"
