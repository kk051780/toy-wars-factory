name: GQ470 REAL69 FieldArt #916+#934 source composite PREP (NOT RC)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_fieldart_916_934_composite_20261121/**'
      - '.github/workflows/gq470-fieldart-916-934-compose.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fieldart-composite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: /tmp/gq470-fieldart-compose
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate exact immutable input and retrieve two original visual patch authors
        shell: bash
        run: |
          set -euo pipefail
          S=quality_gameplay/gq470_fieldart_916_934_composite_20261121/compose.py
          python3 -m py_compile "$S"
          python3 -B "$S" --self-test
          FORMAL=e80973c354f14a0d0088577f3cc1a875454f0f8f
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)
          test "$CURRENT" = "$FORMAL" || { echo RED_OFFICIAL_HEAD_CHANGED; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44695199140" --jq '.head_sha+" "+.conclusion')" = "$FORMAL success"
          mkdir -p "$BASE/original" "$BASE/patchers"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir "$BASE/original"
          test -s "$BASE/original/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          get_pinned() {
            local path="$1" commit="$2" expected_blob="$3" output="$4"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/contents/$path?ref=$commit" --jq .content \
              | base64 --decode > "$BASE/patchers/$output"
            test "$(git hash-object "$BASE/patchers/$output")" = "$expected_blob" \
              || { echo "RED_SOURCE_AUTHOR_BLOB_DRIFT_$output"; exit 1; }
            python3 -m py_compile "$BASE/patchers/$output"
          }
          get_pinned quality_gameplay/gq470_fortress_fairbudget_real69_20261121/patch_castle_fairbudget.py \
            e121c11728de6784a2cfddf11beea08f677ae1ae \
            9fc1e50ab63d7537f361c52a0572cb740c54e223 patch_castle_fairbudget.py
          get_pinned quality_gameplay/gq470_fb015_ridge_real69_20261120/patch_ridge69.py \
            89bd47dbff105bbcfe1005fdbaaca7cf737cc33c \
            3e5b8a0355bfb255208b480ac7c47879385da268 patch_ridge69.py
          PYTHONPATH=quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120 \
            python3 -B "$BASE/patchers/patch_ridge69.py" --self-test
          python3 -B "$S" --original "$BASE/original" --patchers "$BASE/patchers" --out "$BASE/candidate"
          python3 -B "$S" --verify "$BASE/candidate"
          echo GQ470_PINNED_916_934_BOTH_SOURCE_PATCHES_APPLIED
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile actual 69 source ON and original 69 OFF with native Luau
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-fieldart-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-fieldart-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import pathlib,subprocess,sys,os
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          root=pathlib.Path(os.environ['BASE'])/'candidate'
          changed='ServerScriptService/EGGRUMBLE_FlagshipFieldArt'
          on=project_scan(root,'EGGRUMBLE_REAL69.project.json')
          off=project_scan(root/'OFF69_ORIGINAL','EGGRUMBLE_REAL69.project.json')
          assert len(on)==len(off)==69 and set(on)==set(off)
          assert {k for k in on if on[k]['sha256']!=off[k]['sha256']}=={changed}
          assert all(on[k]['class']==off[k]['class'] for k in on)
          for folder,mp in ((root,on),(root/'OFF69_ORIGINAL',off)):
              for item in mp.values():
                  subprocess.run(['/tmp/gq470-fieldart-luau/luau-compile','--text',str(folder/item['path'])], check=True,stdout=subprocess.DEVNULL)
          print('GQ470_FIELDART_COMPOSITE_NATIVE_69_ON_69_OFF_PASS')
          PY
      - name: Rojo 7.7.1 true ON/OFF place and exact original inverse
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-fieldart-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-fieldart-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq470-fieldart-rojo.zip') as z:
              xs=[x for x in z.namelist() if x.split('/')[-1]=='rojo']
              assert len(xs)==1
              p=Path('/tmp/gq470-fieldart-rojo');p.write_bytes(z.read(xs[0]));p.chmod(0o755)
          PY
          R="$BASE/candidate"
          /tmp/gq470-fieldart-rojo build "$R/EGGRUMBLE_REAL69.project.json" -o "$R/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          /tmp/gq470-fieldart-rojo build "$R/OFF69_ORIGINAL/EGGRUMBLE_REAL69.project.json" -o "$R/OFF69_REBUILT.rbxlx"
          cmp "$R/OFF69_REBUILT.rbxlx" "$R/OFF69_ORIGINAL/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 -B quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$R/EGGRUMBLE_REAL69.project.json" --place "$R/EGGRUMBLE_REAL69_PRIVATE.rbxlx" --count 69
          python3 -B quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$R/OFF69_ORIGINAL/EGGRUMBLE_REAL69.project.json" --place "$R/OFF69_REBUILT.rbxlx" --count 69
          echo GQ470_FIELDART_REAL69_ROJO_SOURCE_CLASS_AND_EXACT_ROLLBACK_PASS
      - name: Current-head identity, 17 families, 48 inventory, art NO GO and B source packet
        shell: bash
        run: |
          set -euo pipefail
          R="$BASE/candidate"
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)
          test "$CURRENT" = e80973c354f14a0d0088577f3cc1a875454f0f8f || { echo STALE_RC_NOT_ADMISSIBLE; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            PR_HEAD=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
            test "$PR_HEAD" = "$(git rev-parse HEAD)" || { echo HEAD_MISMATCH; exit 1; }
            test "$(jq -r .pull_request.base.sha "$GITHUB_EVENT_PATH")" = "$CURRENT" || { echo BASE_STALE; exit 1; }
          fi
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base "$R" --report "$R/REAL69_LEGACY48_AUDIT.json"
          python3 - <<'PY'
          import pathlib,sys,os,json,hashlib,subprocess
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          from quality_gameplay.gq8_rc85_rc86_real69_nonloss_20261120.verify_real69 import marker_check
          root=pathlib.Path(os.environ['BASE'])/'candidate'
          current=project_scan(root,'EGGRUMBLE_REAL69.project.json')
          marker=marker_check(current)
          assert len(marker)==17
          rec=root/'REAL69_LEGACY_INTAKE_RECEIPT.json'
          data=json.loads(rec.read_text())
          place=root/'EGGRUMBLE_REAL69_PRIVATE.rbxlx'
          data['private_place_bytes']=place.stat().st_size
          data['private_place_sha256']=hashlib.sha256(place.read_bytes()).hexdigest()
          feature=data['gq470_fieldart_916_934_composite']
          feature['native69_on_off']='PASS_SOURCE_ONLY'
          feature['rojo69_on_off']='PASS_SOURCE_ONLY'
          feature['legacy17']='PASS_SOURCE_ONLY'
          feature['legacy48']='PASS_SOURCE_ONLY'
          data['build_head']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          data['candidate_head_not_formal']=True
          rec.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          (root/'ART_CHECK_REPORT.json').write_text(json.dumps({
            'feature_id':feature['feature_id'],
            'source_verified':True,'visual_old_new_png':'0/32',
            'studio':'NOT_TESTED','android15min':'NOT_TESTED',
            'owner_accepted':False,'art_gate':'ART_NO_GO',
            'game_product_gate':'PRODUCT_NO_GO',
            'art_reference_video_fullwatch':'NOT_VERIFIED'},ensure_ascii=False,indent=2)+'\n')
          print('REAL69_FIELDART_17_FAMILIES_SOURCE_ONLY_48_INVENTORY_AUDITED')
          print('CANDIDATE_PLACE_BYTES',place.stat().st_size)
          PY
          python3 -B quality_gameplay/gq470_fieldart_916_934_composite_20261121/compose.py --verify "$R"
          python3 -B quality_gameplay/gq470_fieldart_916_934_composite_20261121/compose.py --export-b "$R"
          echo A_PREP_READY_NOT_FORMAL_NOT_ENGINE_NOT_ART_GO
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-FIELDART-916-934-COMPOSITE-REAL69-PREP-NOT-FORMAL
          path: |
            /tmp/gq470-fieldart-compose/candidate/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-fieldart-compose/candidate/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-fieldart-compose/candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-fieldart-compose/candidate/sources/**
            /tmp/gq470-fieldart-compose/candidate/OFF69_REBUILT.rbxlx
            /tmp/gq470-fieldart-compose/candidate/REAL69_LEGACY48_AUDIT.json
            /tmp/gq470-fieldart-compose/candidate/ART_CHECK_REPORT.json
            /tmp/gq470-fieldart-compose/candidate/B220_FIELDART_ONE_SOURCE_NOT_FORMAL/**
          if-no-files-found: error
          retention-days: 7
