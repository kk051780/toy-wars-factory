name: P0D FB015 ART COMBAT Native PREP
on:
  push:
    branches:
      - feature/p0d-prep-art-combat-slash-20261114
      - feature/p0d-prep-fb015-minion-combat-composite-20261114
    paths:
      - 'rc_fastlane/apply_fb015_combat.py'
      - 'rc_fastlane/test_fb015_combat.py'
      - 'rc_fastlane/features/fb015_combat/**'
      - 'rc_fastlane/features/art_minion/**'
      - 'rc_fastlane/compose_fb015_minion_combat.py'
      - 'rc_fastlane/test_fb015_composite.py'
      - '.github/workflows/p0d-rc-fastlane.yml'
      - '.github/workflows/p0d-art-combat-prep.yml'
  pull_request:
    branches:
      - rc/p0d-s1-kids-rc01
    paths:
      - 'rc_fastlane/apply_fb015_combat.py'
      - 'rc_fastlane/test_fb015_combat.py'
      - 'rc_fastlane/features/fb015_combat/**'
      - 'rc_fastlane/features/art_minion/**'
      - 'rc_fastlane/compose_fb015_minion_combat.py'
      - 'rc_fastlane/test_fb015_composite.py'
      - '.github/workflows/p0d-rc-fastlane.yml'
      - '.github/workflows/p0d-art-combat-prep.yml'
permissions:
  contents: read
jobs:
  native-art-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate server-hit-only visual source, OFF rollback and limits
        run: python3 -B -m unittest discover -s rc_fastlane -p 'test_fb015_combat.py' -v
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_rc_luau
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: /tmp/p0d_new_luau
          key: p0d-rc-luau-ubuntu-f46d879e28302-v1
      - name: Compile actual authored client LocalScript with pinned Luau
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_rc_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          if [ ! -x /tmp/p0d_new_luau/luau-compile ]; then
            cmake -S _p0d_rc_luau -B /tmp/p0d_new_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
            cmake --build /tmp/p0d_new_luau --target Luau.Compile.CLI --parallel 4
          fi
          /tmp/p0d_new_luau/luau-compile rc_fastlane/features/fb015_combat/ArtCombatSlash.client.luau >/tmp/p0d_art_combat_native.out
          /tmp/p0d_new_luau/luau-compile rc_fastlane/features/fb015_combat/MusouHordeArtSignal.luau >/tmp/p0d_art_horde_native.out
          cmake --build /tmp/p0d_new_luau --target Luau.Repl.CLI --parallel 4
          python3 -B rc_fastlane/features/fb015_combat/generate_native_cue_policy.py --out /tmp/P0D_FB015_ACTUAL_CUE_POLICY.luau
          /tmp/p0d_new_luau/luau-compile /tmp/P0D_FB015_ACTUAL_CUE_POLICY.luau >/dev/null
          /tmp/p0d_new_luau/luau /tmp/P0D_FB015_ACTUAL_CUE_POLICY.luau | tee /tmp/p0d_actual_cue_native.log
          grep -Fx P0D_FB015_REAL_CLIENT_CUE_NATIVE_34_ORDERED_EPOCH_CASES_PASS /tmp/p0d_actual_cue_native.log
          python3 -B rc_fastlane/features/fb015_combat/generate_native_history_policy.py --out /tmp/P0D_FB015_ACTUAL_HISTORY.luau
          /tmp/p0d_new_luau/luau-compile /tmp/P0D_FB015_ACTUAL_HISTORY.luau >/dev/null
          /tmp/p0d_new_luau/luau /tmp/P0D_FB015_ACTUAL_HISTORY.luau | tee /tmp/p0d_actual_history.log
          grep -Fx P0D_FB015_REAL_SERVER_RECENT_HISTORY_NATIVE_PASS /tmp/p0d_actual_history.log
          echo ART_COMBAT_NATIVE_REAL_DEDUPE_POLICY_PASS_STUDIO_NOT_TESTED
