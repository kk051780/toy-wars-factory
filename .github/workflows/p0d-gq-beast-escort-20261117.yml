name: P0D GQ BEAST real companion exact-source private21
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/v3_beast_escort_20261117/**'
      - '.github/workflows/p0d-gq-beast-escort-20261117.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beast-one-combat-private21:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _gq_original482
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq_luau
          persist-credentials: false
      - name: Native Luau compiler and owner-source negative tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _gq_original482 rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          cmake -S _gq_luau -B /tmp/gq-beast-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq-beast-native --target Luau.Compile.CLI --parallel 4
          /tmp/gq-beast-native/luau-compile --text quality_gameplay/v3_beast_escort_20261117/EGGRUMBLE_BeastEscort.luau >/dev/null
          python3 -m py_compile quality_gameplay/v3_beast_escort_20261117/compose_single_combat.py quality_gameplay/v3_beast_escort_20261117/select_current31.py
          python3 -B quality_gameplay/v3_beast_escort_20261117/test_compose.py
          python3 -B quality_gameplay/v3_beast_escort_20261117/test_select_current31.py
      - name: Compose one real Combat and compile ALL original21 scripts
        shell: bash
        run: |
          set -euo pipefail
          SRC=_gq_original482/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116
          OUT=artifacts/gq_beast21
          mkdir -p "$OUT"
          cp -a "$SRC/." "$OUT/"
          python3 -B quality_gameplay/v3_beast_escort_20261117/compose_single_combat.py \
            --combat "$SRC/EGGRUMBLE_SevenRoleCombat.luau" \
            --runtime quality_gameplay/v3_beast_escort_20261117/EGGRUMBLE_BeastEscort.luau \
            --out "$OUT/GQ_BEAST_SELECTED_SINGLE_COMBAT.luau" \
            --receipt "$OUT/GQ_BEAST_SOURCE_RECEIPT.json"
          cp "$OUT/GQ_BEAST_SELECTED_SINGLE_COMBAT.luau" "$OUT/EGGRUMBLE_SevenRoleCombat.luau"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path("artifacts/gq_beast21")
          p=json.loads((root/"EGGRUMBLE_V3_STUDIO.project.json").read_text())
          refs={}
          def walk(node):
              for name, obj in node.items():
                  if name.startswith("$"): continue
                  if "$path" in obj: refs[name]=root/obj["$path"]
                  else: walk(obj)
          walk(p["tree"])
          assert len(refs)==21 and len(set(refs))==21,(len(refs),len(set(refs)))
          for name, file in refs.items():
              assert file.is_file(),(name,file)
              subprocess.run(["/tmp/gq-beast-native/luau-compile","--text",str(file)],
                  check=True,stdout=subprocess.DEVNULL)
          assert sum(p.name=="EGGRUMBLE_SevenRoleCombat.luau" for p in refs.values())==1
          print("GQ_BEAST_REAL_COMBAT_ALL21_NATIVE_COMPILE_PASS")
          PY
      - name: Build genuine pinned Rojo Place, compare 21 Script Source+Class
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_beast_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_beast_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq_beast_rojo.zip") as z:
              bins=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(bins)==1
              p=Path("/tmp/gq_beast_rojo")
              p.write_bytes(z.read(bins[0]))
              p.chmod(0o755)
          PY
          /tmp/gq_beast_rojo build artifacts/gq_beast21/EGGRUMBLE_V3_STUDIO.project.json -o artifacts/gq_beast21/GQ_BEAST_PRIVATE21.rbxlx
          python3 - <<'PY'
          import json,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path("artifacts/gq_beast21")
          spec=json.loads((root/"EGGRUMBLE_V3_STUDIO.project.json").read_text())
          expected={}
          def walk(node):
              for name,obj in node.items():
                  if name.startswith("$"):continue
                  if "$path" in obj:expected[name]=(root/obj["$path"]).read_text()
                  else:walk(obj)
          walk(spec["tree"])
          actual={}
          for item in ET.parse(root/"GQ_BEAST_PRIVATE21.rbxlx").findall(".//Item"):
              props=item.find("Properties")
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              source=props.findtext("ProtectedString[@name='Source']")
              if source is None:source=props.findtext("string[@name='Source']")
              if name in expected and source is not None:
                  assert name not in actual
                  actual[name]=(source.replace("\r\n","\n"),item.attrib.get("class"))
          assert len(expected)==len(actual)==21,(len(expected),len(actual))
          for name,(text,cls) in actual.items():
              assert text==expected[name].replace("\r\n","\n"),name
              assert cls in {"ModuleScript","Script","LocalScript"},(name,cls)
          p=root/"GQ_BEAST_PRIVATE21.rbxlx"
          receipt=root/"GQ_BEAST_SOURCE_RECEIPT.json"
          j=json.loads(receipt.read_text())
          j.update(private21_native="PASS",private21_rojo_exact="21/21",
                   private_place_bytes=p.stat().st_size,
                   private_place_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),
                   official_rc_adopted=False,android_studio_owner="NOT_TESTED")
          receipt.write_text(json.dumps(j,indent=2)+"\n")
          print("GQ_BEAST_PRIVATE21_REAL_ROJO_21_SOURCE_CLASS_EXACT_PASS")
          PY
      - name: Retain reversible PRIVATE21 candidate (NOT official RC)
        uses: actions/upload-artifact@v4
        with:
          name: GQ-BEAST-PRIVATE21-SOURCE-CANDIDATE-NOT-OFFICIAL
          path: |
            artifacts/gq_beast21/GQ_BEAST_PRIVATE21.rbxlx
            artifacts/gq_beast21/GQ_BEAST_SOURCE_RECEIPT.json
          retention-days: 3
