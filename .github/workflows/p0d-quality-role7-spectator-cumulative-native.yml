name: P0D #470 quality cumulative spectator guard real source native82
on:
  push:
    branches: [feature/p0d-product-quality-gate-20261115]
    paths:
      - product_quality/role7_spectator_cumulative.py
      - .github/workflows/p0d-quality-role7-spectator-cumulative-native.yml
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - product_quality/role7_spectator_cumulative.py
      - .github/workflows/p0d-quality-role7-spectator-cumulative-native.yml
permissions:
  contents: read
  actions: read
jobs:
  cumulative-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned old respawn-safe #471 candidate (not an official RC write)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_475_parent
          gh run download 43690277092 -R kk051780/toy-wars-factory \
            -n P0D-ROLE7-ACK-WIND-BUILDER-COMBO-RESPAWN-SAFE-PRIVATE-NOGO \
            -D /tmp/p0d_475_parent
          test -s /tmp/p0d_475_parent/P0D_RC82_ROLE7_RESPAWN_SAFE_PRIVATE.zip
      - name: Build exact 82-script cumulative Place, negative guards, egg invariance
        shell: bash
        run: |
          set -euo pipefail
          python3 -B product_quality/role7_spectator_cumulative.py \
            --parent /tmp/p0d_475_parent/P0D_RC82_ROLE7_RESPAWN_SAFE_PRIVATE.zip \
            --out /tmp/P0D_ROLE7_CUMULATIVE_SPECTATOR_PRIVATE.zip \
            --extract /tmp/p0d_cumulative_sources
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/P0D_ROLE7_CUMULATIVE_SPECTATOR_PRIVATE.zip') as z:
              r=json.loads(z.read('RECEIPT.json'))
              assert r['scripts']==82 and r['unchanged_parent_scripts']==81
              assert r['new_game_blob']=='f0fbfcc2756f5e3bdcebde08a19f432de670977b'
              assert r['place_sha256']=='00a1fcc4621b52b6d6ecf7d79eab1eb7828fccbe3e4a79e902756c4a988bde79'
              assert r['place_bytes']==779052
              assert r['egg_score_authority_byte_exact'] is True
              assert r['official_rc_write'] is False and r['product']=='NO_GO'
          game=Path('/tmp/p0d_cumulative_sources/Game.luau').read_text()
          assert 'horde:tick(now,eligibleSoloPlayers(),healthy)' in game
          assert 'and victim:GetAttribute("P0D_LateJoinSpectator")~=true' in game
          assert 'or #eligibleSoloPlayers()<#Players:GetPlayers() then' in game
          assert 'player.Character~=castCharacter' in game
          assert 'sevenJobPickAckSeq[player]~=selectedAck' in game
          assert 'mobCombo[player]=if hitNow<(mobComboUntil[player] or 0)' in game
          assert len(list(Path('/tmp/p0d_cumulative_sources').glob('*.luau')))==82
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_pinned_luau
          persist-credentials: false
      - name: Native compile all actual 82 Luau sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_pinned_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_pinned_luau -B /tmp/p0d_quality_luau_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_quality_luau_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' f; do
            /tmp/p0d_quality_luau_build/luau-compile "$f" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_cumulative_sources -name '*.luau' -type f -print0 | sort -z)
          test "$n" -eq 82
          echo "P0D_REAL_CUMULATIVE_82_NATIVE_PASS_NOT_PRODUCT_ACCEPTANCE"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-QUALITY-CUMULATIVE-ROLE7-SPECTATOR-SOURCE-NOGO
          path: /tmp/P0D_ROLE7_CUMULATIVE_SPECTATOR_PRIVATE.zip
          retention-days: 7
