name: P0D GQ V3 delayed status tick safe source-only 22
on:
  push:
    branches: [quality/p0d-gq-v3-status-tick-fence-20261116]
  pull_request:
    paths:
      - 'quality_gameplay/v3_status_tick_fence_20261116/**'
      - '.github/workflows/p0d-gq-v3-status-tick-fence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-native-rojo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact author blob, source delta and 22-source generated composition
        run: python3 -B -m unittest discover -s quality_gameplay/v3_status_tick_fence_20261116/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq_status_native
          persist-credentials: false
      - name: Pinned native Luau 13 regressions and all private 22 scripts compile
        run: |
          set -euo pipefail
          test "$(git -C _gq_status_native rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _gq_status_native -B /tmp/gq_status_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_status_luau --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          root=quality_gameplay/v3_status_tick_fence_20261116
          mkdir -p /tmp/gq_status
          cp "$root/EGGRUMBLE_StatusTickFence.luau" /tmp/gq_status/StatusFence.luau
          cp "$root/tests/StatusFenceNative.spec.luau" /tmp/gq_status/Spec.luau
          cd /tmp/gq_status
          /tmp/gq_status_luau/luau ./Spec.luau | tee /tmp/gq_status_native.log
          grep -q GQ_V3_STATUS_TICK_FENCE_NATIVE_13_CASES_PASS /tmp/gq_status_native.log
          cd "$GITHUB_WORKSPACE"
          python3 "$root/tools/compose_private22.py" --out artifacts/status22
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          root=Path('artifacts/status22')
          tree=json.loads((root/'EGGRUMBLE_STATUS22.project.json').read_text())['tree']
          def walk(n):
              if isinstance(n,dict):
                  if '$path' in n:yield (root/n['$path']).resolve(strict=True)
                  else:
                      for k,v in n.items():
                          if not k.startswith('$'):yield from walk(v)
          files=list(walk(tree))
          assert len(files)==22 and len(set(files))==22
          for f in files:subprocess.run(['/tmp/gq_status_luau/luau-compile','--text',str(f)],stdout=subprocess.DEVNULL,check=True)
          print('GQ_STATUS_22_NATIVE_22_OF_22_PASS')
          PY
      - name: Execute actual amended server delayed status callbacks in Luau VM
        run: |
          set -euo pipefail
          root=quality_gameplay/v3_status_tick_fence_20261116
          python3 "$root/tools/make_actual_status_callback_native.py" --out /tmp/gq_status/ActualServerStatus.spec.luau
          /tmp/gq_status_luau/luau-compile --text /tmp/gq_status/ActualServerStatus.spec.luau >/dev/null
          cd /tmp/gq_status
          /tmp/gq_status_luau/luau ./ActualServerStatus.spec.luau | tee /tmp/gq_status_actual_server.log
          grep -q GQ_V3_ACTUAL_SERVER_STATUS_CALLBACK_NATIVE_16_SCENARIOS_PASS /tmp/gq_status_actual_server.log
          cd "$GITHUB_WORKSPACE"
      - name: Checksum pinned Rojo 7.7.1 and unpublished private 22-source Place
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_status_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_status_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq_status_rojo.zip') as z:
              items=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(items)==1
              dst=Path('/tmp/gq_status_rojo')
              dst.write_bytes(z.read(items[0]));dst.chmod(0o755)
          PY
          /tmp/gq_status_rojo build artifacts/status22/EGGRUMBLE_STATUS22.project.json -o artifacts/EGGRUMBLE_GQ_STATUS22_PRIVATE.rbxlx
      - name: Check embedded scripts/classes/byte-exact sources in Rojo Place
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,xml.etree.ElementTree as ET,os
          root=Path('artifacts/status22')
          place=Path('artifacts/EGGRUMBLE_GQ_STATUS22_PRIVATE.rbxlx')
          tree=json.loads((root/'EGGRUMBLE_STATUS22.project.json').read_text())['tree']
          want={}
          def walk(n):
              for k,v in n.items():
                  if k.startswith('$') or not isinstance(v,dict):continue
                  if '$path' in v:
                      f=(root/v['$path']).resolve(strict=True)
                      cls='Script' if f.name.endswith('.server.luau') else ('LocalScript' if f.name.endswith('.client.luau') else 'ModuleScript')
                      assert k not in want
                      want[k]=(cls,f.read_text().replace('\r\n','\n'))
                  else:walk(v)
          walk(tree)
          assert len(want)==22
          got={}
          for e in ET.fromstring(place.read_bytes()).iter('Item'):
              cls=e.attrib.get('class')
              if cls not in ('Script','LocalScript','ModuleScript'):continue
              p=e.find('Properties')
              if p is None:continue
              name=p.findtext("string[@name='Name']")
              value=p.findtext("ProtectedString[@name='Source']")
              if value is None:value=p.findtext("string[@name='Source']")
              assert name and value is not None and name not in got
              got[name]=(cls,value.replace('\r\n','\n'))
          assert want==got,{"missing":sorted(set(want)-set(got)),"extra":sorted(set(got)-set(want)),
                            "changed":sorted(k for k in set(want)&set(got) if want[k]!=got[k])}
          receipt=json.loads((root/'SOURCE_RECEIPT.json').read_text())
          receipt.update({"candidate_sha":os.environ["GITHUB_SHA"],
              "private_place_bytes":place.stat().st_size,
              "private_place_sha256":hashlib.sha256(place.read_bytes()).hexdigest(),
              "source_exact_rojo":"22/22",
              "official_rc_integrated":False})
          Path('artifacts/GQ_STATUS22_RECEIPT.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print('GQ_STATUS22_ROJO_EXACT_22_OF_22_PASS',place.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EGGRUMBLE-GQ-STATUS-FENCE-22-PRIVATE-NO-RC
          path: |
            artifacts/EGGRUMBLE_GQ_STATUS22_PRIVATE.rbxlx
            artifacts/GQ_STATUS22_RECEIPT.json
          retention-days: 3

      - name: Reuse pinned #482 author, #484 source-composer, #485 art, #487 score
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _v3_author
          persist-credentials: false
      - name: Checkout original #484 current26 composer
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 6b52eaf1f2725496277998fe0c5532b7a8fcaab5
          path: _v3_quality
          persist-credentials: false
      - name: Checkout original #485 ART
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _v3_art
          persist-credentials: false
      - name: Checkout original #487 SCORE
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _v3_score
          persist-credentials: false
      - name: Compose original 26 source, then status single-overlay to private current27
        run: |
          set -euo pipefail
          test "$(git -C _v3_author rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _v3_quality rev-parse HEAD)" = 6b52eaf1f2725496277998fe0c5532b7a8fcaab5
          test "$(git -C _v3_art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _v3_score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py --target v3 --author-project _v3_author/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json --out artifacts/GQ_STATUS_ART.project.json
          python3 _v3_quality/quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py --author _v3_author --quality _v3_quality --art _v3_art --score _v3_score --art-project artifacts/GQ_STATUS_ART.project.json --out artifacts/EGGRUMBLE_GQ_CURRENT26_BASE.project.json
          root=quality_gameplay/v3_status_tick_fence_20261116
          python3 "$root/tools/compose_on_current26.py" --base-project artifacts/EGGRUMBLE_GQ_CURRENT26_BASE.project.json --base-receipt artifacts/SOURCE_RECEIPT.json --original-combat _v3_author/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_SevenRoleCombat.luau --overlay-combat "$root/EGGRUMBLE_SevenRoleCombat.patched.luau" --policy "$root/EGGRUMBLE_StatusTickFence.luau" --out artifacts/EGGRUMBLE_GQ_STATUS_CURRENT27.project.json
      - name: Compile and build source-exact private current27 game ART SCORE STATUS Place
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,xml.etree.ElementTree as ET,os
          proj=Path("artifacts/EGGRUMBLE_GQ_STATUS_CURRENT27.project.json")
          obj=json.loads(proj.read_text())
          expected={}
          def walk(n):
              for name,item in n.items():
                  if name.startswith("$") or not isinstance(item,dict):continue
                  if "$path" in item:
                      f=(proj.parent/item["$path"]).resolve(strict=True)
                      kind="Script" if f.name.endswith(".server.luau") else ("LocalScript" if f.name.endswith(".client.luau") else "ModuleScript")
                      assert name not in expected
                      expected[name]=(kind,f.read_text(encoding="utf8").replace("\r\n","\n"),f)
                  else:walk(item)
          walk(obj["tree"])
          assert len(expected)==27
          receipt=json.loads(Path("artifacts/SOURCE_STATUS27_RECEIPT.json").read_text())
          for name,(kind,text,f) in expected.items():
              assert hashlib.sha256(f.read_bytes()).hexdigest()==receipt["source_27_sha256"][name]
              subprocess.run(["/tmp/gq_status_luau/luau-compile","--text",str(f)],stdout=subprocess.DEVNULL,check=True)
          print("GQ_STATUS_CURRENT27_NATIVE_27_OF_27_PASS")
          PY
          /tmp/gq_status_rojo build artifacts/EGGRUMBLE_GQ_STATUS_CURRENT27.project.json -o artifacts/EGGRUMBLE_GQ_STATUS_CURRENT27_PRIVATE.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,xml.etree.ElementTree as ET,os
          proj=Path("artifacts/EGGRUMBLE_GQ_STATUS_CURRENT27.project.json")
          place=Path("artifacts/EGGRUMBLE_GQ_STATUS_CURRENT27_PRIVATE.rbxlx")
          expected={}
          def walk(n):
              for name,item in n.items():
                  if name.startswith("$") or not isinstance(item,dict):continue
                  if "$path" in item:
                      f=(proj.parent/item["$path"]).resolve(strict=True)
                      kind="Script" if f.name.endswith(".server.luau") else ("LocalScript" if f.name.endswith(".client.luau") else "ModuleScript")
                      assert name not in expected
                      expected[name]=(kind,f.read_text(encoding="utf8").replace("\r\n","\n"))
                  else:walk(item)
          walk(json.loads(proj.read_text())["tree"])
          assert len(expected)==27
          actual={}
          for item in ET.fromstring(place.read_bytes()).iter("Item"):
              kind=item.attrib.get("class")
              if kind not in ("Script","LocalScript","ModuleScript"):continue
              props=item.find("Properties")
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              src=props.findtext("ProtectedString[@name='Source']")
              if src is None:src=props.findtext("string[@name='Source']")
              assert name and src is not None and name not in actual
              actual[name]=(kind,src.replace("\r\n","\n"))
          assert expected==actual,{"missing":sorted(set(expected)-set(actual)),"extra":sorted(set(actual)-set(expected)),
                                   "changed":sorted(k for k in set(expected)&set(actual) if expected[k]!=actual[k])}
          receiptPath=Path("artifacts/SOURCE_STATUS27_RECEIPT.json")
          receipt=json.loads(receiptPath.read_text())
          receipt["candidate_sha"]=os.environ["GITHUB_SHA"]
          receipt["private_place_bytes"]=place.stat().st_size
          receipt["private_place_sha256"]=hashlib.sha256(place.read_bytes()).hexdigest()
          receipt["source_exact_rojo"]="27/27"
          receiptPath.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n")
          print("GQ_STATUS_CURRENT27_ROJO_27_OF_27_PASS",place.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EGGRUMBLE-GQ-STATUS-CURRENT27-PRIVATE-NO-RC
          path: |
            artifacts/EGGRUMBLE_GQ_STATUS_CURRENT27_PRIVATE.rbxlx
            artifacts/EGGRUMBLE_GQ_STATUS_CURRENT27.project.json
            artifacts/SOURCE_STATUS27_RECEIPT.json
          retention-days: 3
