name: P0D private V3 27-source seven-domain shadow runtime
on:
  pull_request:
    paths:
      - 'cross_domain_gate/**'
      - '.github/workflows/p0d-cross-domain-shadow27.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-27-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout original GQ 26 composer (pinned)
        uses: actions/checkout@v4
        with:
          ref: 2e398765578d827c24e173126136c572b297533b
          path: _gq_original
          persist-credentials: false
      - name: Checkout owner original game 7 domains (pinned)
        uses: actions/checkout@v4
        with:
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _v3_original
          persist-credentials: false
      - name: Checkout original artist source (pinned)
        uses: actions/checkout@v4
        with:
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _v3_art
          persist-credentials: false
      - name: Checkout original score source (pinned)
        uses: actions/checkout@v4
        with:
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _v3_score
          persist-credentials: false
      - name: Exact author HEAD and isolated tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _gq_original rev-parse HEAD)" = 2e398765578d827c24e173126136c572b297533b
          test "$(git -C _v3_original rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _v3_art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _v3_score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
          python3 -B -m unittest discover -s cross_domain_gate -p 'test_*.py' -v
      - name: Original 26 source build + ART/SCORE (unchanged original)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py \
            --target v3 \
            --author-project _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json \
            --out artifacts/GQ_V3_LATEST_ART.project.json
          python3 _gq_original/quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py \
            --author _v3_original --quality _gq_original --art _v3_art --score _v3_score \
            --art-project artifacts/GQ_V3_LATEST_ART.project.json \
            --out artifacts/EGGRUMBLE_V3_GQ_27.project.json
      - name: Add 27th read-only Luau runtime observer to PRIVATE composition
        shell: bash
        run: |
          set -euo pipefail
          python3 cross_domain_gate/compose_observed.py \
            --project artifacts/EGGRUMBLE_V3_GQ_27.project.json \
            --receipt artifacts/SOURCE_RECEIPT.json \
            --observer cross_domain_gate/EGGRUMBLE_IntegrityObserver.luau
      - name: Checkout pinned Luau native parser
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau_fixed
          persist-credentials: false
      - name: Compile all 27 mapped real Luau sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _luau_fixed rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _luau_fixed -B /tmp/gq_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_luau --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          project=Path("artifacts/EGGRUMBLE_V3_GQ_27.project.json").resolve()
          tree=json.loads(project.read_text())["tree"]
          def walk(node):
              if isinstance(node,dict):
                  if "$path" in node:yield (project.parent/node["$path"]).resolve(strict=True)
                  else:
                      for k,v in node.items():
                          if not k.startswith("$"):yield from walk(v)
          sources=list(walk(tree))
          assert len(sources)==27,len(sources)
          for path in sources:
              subprocess.run(["/tmp/gq_luau/luau-compile","--text",str(path)],check=True,stdout=subprocess.DEVNULL)
          print("NATIVE_LUAU_27_OF_27_PASS")
          PY
          mkdir -p /tmp/gq_observer_native
          cp cross_domain_gate/EGGRUMBLE_IntegrityObserver.luau /tmp/gq_observer_native/Observer.luau
          cp cross_domain_gate/observer_native.spec.luau /tmp/gq_observer_native/Runner.luau
          (cd /tmp/gq_observer_native && /tmp/gq_luau/luau Runner.luau) | tee artifacts/GQ_OBSERVER_NATIVE.log
          grep -q GQ_7DOMAIN_OBSERVER_REAL_LUAU_NATIVE_BEHAVIOR artifacts/GQ_OBSERVER_NATIVE.log
          grep -q GQ_OBSERVER_WARNING_DEDUP_NATIVE_PASS artifacts/GQ_OBSERVER_NATIVE.log
          grep -q GQ_CROSS_DOMAIN_MATCH_TRANSITION_NATIVE_PASS artifacts/GQ_OBSERVER_NATIVE.log
          # Execute #484 author's new real navigation-target regression, not a copied implementation.
          (cd _gq_original && python3 quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/test_nav_retarget_native.py --luau /tmp/gq_luau/luau) | tee artifacts/GQ_NAV_NATIVE.log
          grep -q GQ_NAV_STALE_GOAL_NEGATIVE_PASS artifacts/GQ_NAV_NATIVE.log
          grep -q GQ_CREATEPATH_EXCEPTION_MUTANT_NEGATIVE_PASS artifacts/GQ_NAV_NATIVE.log
          python3 cross_domain_gate/test_original_ai_target_native.py \
            --luau /tmp/gq_luau/luau --quality _gq_original | tee artifacts/GQ_GHOST_ACTION_NATIVE.log
          grep -q GQ_GHOST_TARGET_GUARD_MUTATION_REJECTED artifacts/GQ_GHOST_ACTION_NATIVE.log
      - name: Acquire pinned Rojo and build unpublished private Place
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq_rojo.zip") as z:
              binaries=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(binaries)==1
              exe=Path("/tmp/gq_rojo")
              exe.write_bytes(z.read(binaries[0]))
              exe.chmod(0o755)
          PY
          /tmp/gq_rojo build artifacts/EGGRUMBLE_V3_GQ_27.project.json -o artifacts/EGGRUMBLE_GQ27_SHADOW_PRIVATE.rbxlx
      - name: Verify exact 27 source bytes in generated Place
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          project=Path("artifacts/EGGRUMBLE_V3_GQ_27.project.json").resolve()
          place=Path("artifacts/EGGRUMBLE_GQ27_SHADOW_PRIVATE.rbxlx")
          receipt=json.loads(Path("artifacts/SOURCE_RECEIPT.json").read_text())
          tree=json.loads(project.read_text())["tree"]
          expected={}
          def walk(node):
              for name,child in node.items():
                  if name.startswith("$") or not isinstance(child,dict):continue
                  if "$path" in child:
                      path=(project.parent/child["$path"]).resolve(strict=True)
                      kind="Script" if path.name.endswith(".server.luau") else ("LocalScript" if path.name.endswith(".client.luau") else "ModuleScript")
                      assert name not in expected
                      text=path.read_text(encoding="utf-8").replace("\r\n","\n")
                      expected[name]=(kind,text)
                      assert receipt["source_sha256"][name]==hashlib.sha256(path.read_bytes()).hexdigest(),name
                  else:walk(child)
          walk(tree)
          assert len(expected)==27
          actual={}
          for entry in ET.fromstring(place.read_bytes()).iter("Item"):
              kind=entry.attrib.get("class")
              if kind not in ("Script","LocalScript","ModuleScript"):continue
              props=entry.find("Properties")
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              assert name not in actual
              src=props.findtext("ProtectedString[@name='Source']")
              if src is None:src=props.findtext("string[@name='Source']")
              assert src is not None,name
              actual[name]=(kind,src.replace("\r\n","\n"))
          assert expected==actual,{"missing":sorted(set(expected)-set(actual)),"extra":sorted(set(actual)-set(expected)),
                                  "modified":[n for n in set(expected)&set(actual) if expected[n]!=actual[n]]}
          receipt["place_sha256"]=hashlib.sha256(place.read_bytes()).hexdigest()
          receipt["place_bytes"]=place.stat().st_size
          Path("artifacts/SOURCE_RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("SOURCE_EXACT_27_OF_27_PASS",receipt["place_sha256"])
          PY
      - name: Archive private source-only Place, never deploy
        uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE_GQ27_SHADOW_PRIVATE_SOURCE_NO_RC
          path: |
            artifacts/EGGRUMBLE_GQ27_SHADOW_PRIVATE.rbxlx
            artifacts/SOURCE_RECEIPT.json
            artifacts/GQ_OBSERVER_NATIVE.log
            artifacts/GQ_NAV_NATIVE.log
            artifacts/GQ_GHOST_ACTION_NATIVE.log
          retention-days: 3
