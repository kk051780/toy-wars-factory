name: GQ470 Swarm Subject distance REAL69 A-only source QA
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_swarm_subject_20261121/**'
      - '.github/workflows/gq470-swarm-subject-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real69-single-source-not-formal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      FORMAL_SHA: e80973c354f14a0d0088577f3cc1a875454f0f8f
      FORMAL_RUN: '44695199140'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact-head and original REAL69 source replay
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FORMAL_RUN" --jq '.head_sha+" "+.conclusion')" = "$FORMAL_SHA success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL_SHA"
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            H="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")"
            test -n "$H" && test "$H" = "$(git rev-parse HEAD)"
            test "$(gh api "repos/$GITHUB_REPOSITORY/compare/$FORMAL_SHA...$H" --jq .status)" = ahead
          fi
          python3 quality_gameplay/gq470_swarm_subject_20261121/patch_swarm_subject69.py --self-test
          python3 -m unittest discover -s quality_gameplay/gq470_swarm_subject_20261121 -p 'test_swarm_subject69.py' -v
          mkdir -p /tmp/swarm-formal69 /tmp/swarm-a69
          gh run download "$FORMAL_RUN" --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir /tmp/swarm-formal69
          test -s /tmp/swarm-formal69/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          EGGRUMBLE_FORMAL69_ROOT=/tmp/swarm-formal69 python3 -m unittest discover -s quality_gameplay/gq470_swarm_subject_20261121 -p 'test_swarm_subject69.py' -v
          cp -a /tmp/swarm-formal69/. /tmp/swarm-a69/
          python3 quality_gameplay/gq470_swarm_subject_20261121/patch_swarm_subject69.py --base /tmp/swarm-a69
      - name: Pinned native Luau original69 and candidate69
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/luau-lang/luau.git /tmp/swarm-luau
          git -C /tmp/swarm-luau checkout --quiet f46d879e28302a430029304f7f6a162aed66f103
          cmake -S /tmp/swarm-luau -B /tmp/swarm-luau-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/swarm-luau-build --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq470_swarm_subject_20261121')
          from patch_swarm_subject69 import selected,TARGET
          root=Path('/tmp/swarm-a69')
          on=selected(root);off=selected(root/'OFF69_SWARM_SUBJECT_EXACT')
          assert len(on)==len(off)==69
          assert {r for r in on if on[r].read_bytes()!=off[r].read_bytes()}=={TARGET}
          for group in (on,off):
              for r,p in sorted(group.items()):
                  subprocess.run(['/tmp/swarm-luau-build/luau-compile','--text',str(p)],stdout=subprocess.DEVNULL,check=True)
          print('TRUE_NATIVE_ON69_OFF69_PASS_SOURCE_ONLY')
          PY
      - name: Pinned Rojo candidate, byte-exact OFF and source readback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/swarm-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/swarm-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/swarm-rojo.zip') as z:
              matches=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(matches)==1
              p=Path('/tmp/swarm-rojo');p.write_bytes(z.read(matches[0]));p.chmod(0o755)
          PY
          /tmp/swarm-rojo build /tmp/swarm-a69/EGGRUMBLE_REAL69.project.json -o /tmp/swarm-a69/GQ470_SWARM_SUBJECT_A_ONLY_PRIVATE69.rbxlx
          /tmp/swarm-rojo build /tmp/swarm-a69/OFF69_SWARM_SUBJECT_EXACT/EGGRUMBLE_REAL69.project.json -o /tmp/swarm-a69/GQ470_SWARM_SUBJECT_OFF69.rbxlx
          cmp /tmp/swarm-a69/GQ470_SWARM_SUBJECT_OFF69.rbxlx /tmp/swarm-a69/OFF69_SWARM_SUBJECT_EXACT/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/swarm-a69/EGGRUMBLE_REAL69.project.json --place /tmp/swarm-a69/GQ470_SWARM_SUBJECT_A_ONLY_PRIVATE69.rbxlx --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/swarm-a69/OFF69_SWARM_SUBJECT_EXACT/EGGRUMBLE_REAL69.project.json --place /tmp/swarm-a69/GQ470_SWARM_SUBJECT_OFF69.rbxlx --count 69
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL_SHA"
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('/tmp/swarm-a69'); r=root/'GQ470_SWARM_SUBJECT_A_ONLY.json'
          data=json.loads(r.read_text());p=root/'GQ470_SWARM_SUBJECT_A_ONLY_PRIVATE69.rbxlx'
          data.update({'candidate_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           'candidate_place_bytes':p.stat().st_size,'candidate_place_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
           'original_place_bytes':798390,'native_rojo':'PASS_SOURCE_ONLY','studio':'NOT_TESTED',
           'actual_art_screenshots':0,'android15':'NOT_TESTED','owner_accepted':False,'formal_adopted':False})
          r.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print('A_ONLY_CANDIDATE_PLACE_BYTES',p.stat().st_size)
          PY
      - name: Upload A-only candidate (never formal RC)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GQ470-SWARM-SUBJECT-REAL69-NOT-FORMAL
          path: |
            /tmp/swarm-a69/GQ470_SWARM_SUBJECT_A_ONLY_PRIVATE69.rbxlx
            /tmp/swarm-a69/GQ470_SWARM_SUBJECT_OFF69.rbxlx
            /tmp/swarm-a69/GQ470_SWARM_SUBJECT_A_ONLY.json
            /tmp/swarm-a69/EGGRUMBLE_REAL69.project.json
            /tmp/swarm-a69/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/swarm-a69/sources/**
          if-no-files-found: error
          retention-days: 7
