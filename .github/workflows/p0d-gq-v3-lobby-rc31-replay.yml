name: P0D GQ615 current official RC31 real Place single-Host queue overlay
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/v3_lobby_queue_visibility_20261117/**'
      - '.github/workflows/p0d-gq-v3-lobby-rc31-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  private31-source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Immutable original #482 Host for 15 negative and OFF cases
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _original482
          persist-credentials: false
      - name: Immutable native Luau compiler and runtime
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _native_luau
          persist-credentials: false
      - name: Run existing source negative tests and verify exact rollback
        run: |
          set -euo pipefail
          python3 -m unittest discover -s quality_gameplay/v3_lobby_queue_visibility_20261117 -p 'test_feedback.py' -v
      - name: Read latest authenticated official RC HEAD and BOTH same HEAD green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RC_SHA="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/rc/p0d-s1-kids-rc01 | awk '{print $1}')"
          test "${#RC_SHA}" -eq 40
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RC_SHA}&per_page=100" > /tmp/gq615_live_runs.json
          V3="$(jq -r '.workflow_runs | map(select(.name=="P0D EGGRUMBLE V3 official RC companion 31-source pinned build" and .event=="push" and .status=="completed" and .conclusion=="success")) | sort_by(.created_at) | reverse | .[0].id // empty' /tmp/gq615_live_runs.json)"
          S1="$(jq -r '.workflow_runs | map(select(.name=="P0D RC78 author-pinned source-exact unified Studio build" and .event=="push" and .status=="completed" and .conclusion=="success")) | sort_by(.created_at) | reverse | .[0].id // empty' /tmp/gq615_live_runs.json)"
          test -n "$V3" && test -n "$S1" || { echo "RED_NO_BOTH_GREEN_AT_CURRENT_OFFICIAL_HEAD=$RC_SHA"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V3}/artifacts" > /tmp/gq615_live_artifacts.json
          ART_NAME="P0D-EGGRUMBLE-V3-RC31-CANONICAL-COMPANION-STUDIO"
          ART_SIZE="$(jq -r --arg n "$ART_NAME" '.artifacts | map(select(.name==$n and .expired==false)) | .[0].size_in_bytes // empty' /tmp/gq615_live_artifacts.json)"
          test -n "$ART_SIZE" && test "$ART_SIZE" -gt 10000 || { echo "RED_NO_REAL_CURRENT_OFFICIAL_RC31_ZIP"; exit 1; }
          {
            echo "RC_SHA=$RC_SHA"
            echo "V3_RUN=$V3"
            echo "S1_RUN=$S1"
            echo "RC_ZIP_BYTES=$ART_SIZE"
          } >> "$GITHUB_ENV"
          echo "GQ615_CURRENT_OFFICIAL_BOTH_SAME_HEAD_GREEN sha=$RC_SHA v3=$V3 s1=$S1 zip=$ART_SIZE"
      - name: Fetch genuine official same-HEAD V3 Place and source identity receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$V3_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "P0D-EGGRUMBLE-V3-RC31-CANONICAL-COMPANION-STUDIO" \
            --dir artifacts/gq615_rc_official
          mapfile -t PLACES < <(find artifacts/gq615_rc_official -type f -name 'EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx')
          mapfile -t RECEIPTS < <(find artifacts/gq615_rc_official -type f -name 'EGGRUMBLE_V3_OFFICIAL_RC31_RECEIPT.json')
          test "${#PLACES[@]}" -eq 1 && test "${#RECEIPTS[@]}" -eq 1
          test -s "${PLACES[0]}" && test -s "${RECEIPTS[0]}"
          {
            echo "PLACE_PATH=${PLACES[0]}"
            echo "RECEIPT_PATH=${RECEIPTS[0]}"
          } >> "$GITHUB_ENV"
          echo "GQ615_OFFICIAL_REAL_PLACE_AND_RECEIPT_PRESENT"
      - name: Source-select single existing latest Host and preserve other 30 + all world instances
        run: |
          set -euo pipefail
          python3 quality_gameplay/v3_lobby_queue_visibility_20261117/private31.py prepare \
            --official-place "$PLACE_PATH" \
            --receipt "$RECEIPT_PATH" \
            --out-dir artifacts/gq615_current31 \
            --rc-head "$RC_SHA" --run-id "$V3_RUN" --zip-bytes "$RC_ZIP_BYTES"
      - name: Compile native current 31 scripts and run real display behavior cases
        run: |
          set -euo pipefail
          cmake -S _native_luau -B /tmp/gq615-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq615-native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          count=0
          for f in artifacts/gq615_current31/source31/*.luau; do
            /tmp/gq615-native/luau-compile --text "$f" >/dev/null
            count=$((count+1))
          done
          test "$count" -eq 31 || { echo "RED_NATIVE_NOT_31"; exit 1; }
          mapfile -t HOSTS < <(find artifacts/gq615_current31/source31 -type f -name '*LobbyCastleModesPreview.server.luau')
          test "${#HOSTS[@]}" -eq 1
          python3 quality_gameplay/v3_lobby_queue_visibility_20261117/private31.py harness \
            --source "${HOSTS[0]}" --out artifacts/gq615_current31/GQ615_QUEUE_ACTUAL_NATIVE.luau
          /tmp/gq615-native/luau-compile --text artifacts/gq615_current31/GQ615_QUEUE_ACTUAL_NATIVE.luau >/dev/null
          /tmp/gq615-native/luau artifacts/gq615_current31/GQ615_QUEUE_ACTUAL_NATIVE.luau \
            | tee artifacts/gq615_current31/GQ615_QUEUE_ACTUAL_NATIVE.log
          grep -q GQ615_REAL_QUEUE_TEXT_NATIVE_10_CASES_PASS \
            artifacts/gq615_current31/GQ615_QUEUE_ACTUAL_NATIVE.log
          echo "GQ615_CURRENT_OFFICIAL_ALL31_NATIVE_COMPILE_PLUS_REAL_QUEUE_FUNCTION_PASS"
      - name: Pinned Rojo 7.7.1 true 31-script source/class/path replay build
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq615-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq615-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq615-rojo.zip") as z:
              found=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(found)==1
              exe=Path("/tmp/gq615-rojo")
              exe.write_bytes(z.read(found[0]))
              exe.chmod(0o755)
          PY
          /tmp/gq615-rojo build artifacts/gq615_current31/GQ615_CURRENT_SOURCE31.project.json \
            -o artifacts/gq615_current31/GQ615_ROJO_SOURCE31_REPLAY.rbxlx
          python3 quality_gameplay/v3_lobby_queue_visibility_20261117/private31.py verify \
            --out-dir artifacts/gq615_current31 \
            --rojo-place artifacts/gq615_current31/GQ615_ROJO_SOURCE31_REPLAY.rbxlx
          echo "GQ615_CURRENT_OFFICIAL_RC31_ROJO_SOURCE_CLASS_PATH_31_31_PASS"
      - name: Recheck official HEAD drift after self-contained private 31 proof
        run: |
          set -euo pipefail
          HEAD_NOW="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/rc/p0d-s1-kids-rc01 | awk '{print $1}')"
          if [ "$HEAD_NOW" = "$RC_SHA" ]; then
            echo "GQ615_OFFICIAL_HEAD_REMAINS_SAME_CANDIDATE_PREP_ONLY"
          else
            echo "GQ615_OFFICIAL_HEAD_MOVED_REBASE_REQUIRED base=$RC_SHA latest=$HEAD_NOW; no formal RC adoption"
          fi
          test "$HEAD_NOW" != "" && test "${#HEAD_NOW}" -eq 40
      - name: Preserve source-exact private candidate and rollback receipt, NOT formal RC
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P0D-GQ615-RC31-CURRENT-OFFICIAL-SOURCE-EXACT-PREP-ONLY
          path: |
            artifacts/gq615_current31/GQ615_FULL_OFFICIAL_PLACE_HOST_ONLY_PRIVATE.rbxlx
            artifacts/gq615_current31/GQ615_ROJO_SOURCE31_REPLAY.rbxlx
            artifacts/gq615_current31/GQ615_CURRENT_SOURCE31.project.json
            artifacts/gq615_current31/GQ615_PRIVATE31_RECEIPT.json
            artifacts/gq615_current31/GQ615_QUEUE_ACTUAL_NATIVE.log
          if-no-files-found: error
          retention-days: 3
