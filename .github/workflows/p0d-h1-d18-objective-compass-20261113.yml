name: P0D H1 D18 objective compass 29-script private native Rojo
on:
  push:
    branches:
      - feature/p0d-h1-d18-objective-compass-private-20261113-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d18-objective-compass:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      H1: handoffs/P0D-H1-D18-OBJECTIVE-COMPASS-20261113-01
    steps:
      - name: Checkout private copy plus all frozen base Git source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify 27 original exact plus modified local guide and pure compass module, run negative QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$H1"
          python3 tools/verify_compass.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download official hash-pinned Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            -o /tmp/p0d_h1_compass_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_h1_compass_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import pathlib,stat,zipfile
          with zipfile.ZipFile("/tmp/p0d_h1_compass_rojo.zip") as z:
              p=[n for n in z.namelist() if n.rsplit("/",1)[-1]=="rojo"]
              assert len(p)==1
              x=pathlib.Path("/tmp/p0d_h1_compass_rojo")
              x.write_bytes(z.read(p[0]))
              x.chmod(x.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_h1_compass_rojo --version | grep -F 7.7.1
      - name: Generate REAL unpublished H1 source-game for Studio private comparison only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_h1_compass_out
          /tmp/p0d_h1_compass_rojo build "$H1/default.project.json" \
            -o /tmp/p0d_h1_compass_out/TRAP_RAIDERS_H1_D18_COMPASS_STUDIO_ONLY.rbxlx
          test -s /tmp/p0d_h1_compass_out/TRAP_RAIDERS_H1_D18_COMPASS_STUDIO_ONLY.rbxlx
      - name: Parse actual Roblox Place XML and verify 29 of 29 entire Lua sources byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,hashlib,json,os,pathlib,xml.etree.ElementTree as ET
          src=pathlib.Path(os.environ["H1"])
          files=sorted((src/"src").rglob("*.luau"))
          assert len(files)==29,len(files)
          place=pathlib.Path("/tmp/p0d_h1_compass_out/TRAP_RAIDERS_H1_D18_COMPASS_STUDIO_ONLY.rbxlx")
          root=ET.fromstring(place.read_bytes())
          seen=[];types=collections.Counter()
          for item in root.iter("Item"):
              k=item.attrib.get("class")
              if k not in ("Script","ModuleScript","LocalScript"):continue
              s=item.find("./Properties/string[@name='Source']")
              if s is not None:
                  seen.append(s.text or "")
                  types[k]+=1
          assert collections.Counter(seen)==collections.Counter(p.read_text(encoding="utf8") for p in files),(len(seen),types)
          assert types=={"Script":2,"LocalScript":4,"ModuleScript":23},types
          receipt={"game":"TRAP_RAIDERS","adoption_id":"P0D-FUN-H1-001",
             "source_sha":os.environ.get("GITHUB_SHA"),"source_count":29,
             "original_28_script_game_byte_preservation":27,
             "only_edited_existing_script":"D18MascotGuide.client.luau",
             "new_client_pure":"D18ObjectiveCompassRules.luau",
             "rojo_all_29_embedded_byte_exact":True,"place_bytes":place.stat().st_size,
             "place_sha256":hashlib.sha256(place.read_bytes()).hexdigest(),
             "source_physics":"NOT_TESTED","real_studio_two_clients":"NOT_TESTED",
             "phone":"NOT_TESTED","human_fun":"NO_GO_PENDING",
             "RC_adopted":False,"published":False}
          pathlib.Path("/tmp/p0d_h1_compass_out/H1_D18_COMPASS_BUILD_RECEIPT.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          print("P0D_H1_D18_COMPASS_REAL_ROJO_29_OF_29_BYTE_EXACT",types)
          PY
      - name: Compile real full 29 Luau scripts with pinned upstream native compiler and runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/p0d_h1_compass_luau
          git -C /tmp/p0d_h1_compass_luau fetch --depth 1 origin f46d879e28302a430029304f7f6a162aed66f103
          git -C /tmp/p0d_h1_compass_luau checkout --detach FETCH_HEAD
          test "$(git -C /tmp/p0d_h1_compass_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S /tmp/p0d_h1_compass_luau -B /tmp/p0d_h1_compass_native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_h1_compass_native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          number=0
          while IFS= read -r -d '' file; do
              /tmp/p0d_h1_compass_native/luau-compile "$file" >/dev/null
              number=$((number+1))
          done < <(find "$H1/src" -name '*.luau' -print0)
          test "$number" -eq 29
          echo "P0D_H1_D18_COMPASS_REAL_NATIVE_29_OF_29_LUAU_COMPILE_PASS"
      - name: Execute actual shipped pure objective bearing policy on native Luau VM
        shell: bash
        run: |
          set -euo pipefail
          cd "$H1"
          /tmp/p0d_h1_compass_native/luau tests/compass_native.luau
      - name: Upload original unpublished full-game private Studio candidate only
        uses: actions/upload-artifact@v4
        with:
          name: P0D-H1-D18-OBJECTIVE-COMPASS-STUDIO-ONLY
          path: |
            /tmp/p0d_h1_compass_out/TRAP_RAIDERS_H1_D18_COMPASS_STUDIO_ONLY.rbxlx
            /tmp/p0d_h1_compass_out/H1_D18_COMPASS_BUILD_RECEIPT.json
          if-no-files-found: error
          retention-days: 7
