name: P0D FB032 RC89 combined widefield warp and wall-safe stage loot native86
on:
  push:
    branches: [feature/p0d-fb029-wind-rules-integration-20261115]
    paths:
      - quality_repair/FB032_RC89_WARP_LOOT_CUMULATIVE/**
      - .github/workflows/p0d-fb032-rc89-native86.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-exact-real86:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download pinned immutable RC88 from native-pass workflow and bundle original 3 files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fb032_rc88
          gh run download 43754971010 -R kk051780/toy-wars-factory \
            -n P0D-FB031-RC88-WIDEFIELD-TRAPPER-NATIVE86-PRIVATE-NOGO \
            -D /tmp/fb032_rc88
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          base=Path('/tmp/fb032_rc88');d={p.name:p for p in base.rglob('*') if p.is_file()}
          needed=['P0D_RC88_FB031_NATIVE86_WARP_PRIVATE.rbxlx','RC88_RECEIPT.json','patch_log.json']
          assert sorted(d)==sorted(needed),list(d)
          target=Path('quality_repair/FB032_RC89_WARP_LOOT_CUMULATIVE/parent_rc88.zip')
          with ZipFile(target,'w',ZIP_DEFLATED) as z:
              for k in sorted(d):z.write(d[k],k)
          PY
      - name: Rebuild actual RC89 Place and execute all 25 source and negative regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd quality_repair/FB032_RC89_WARP_LOOT_CUMULATIVE
          python3 -m unittest -v test_rc89.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('P0D_RC89_WIDEFIELD_WARP_STAGE_LOOT_WALL_SAFE_PRIVATE.rbxlx');b=p.read_bytes()
          assert len(b)==847767,len(b)
          assert hashlib.sha256(b).hexdigest()=='03bba976334b188897f4e771d04473229bd82a81db8f6a6fdc44a99d26a14bc9'
          r=json.loads(Path('RECEIPT.json').read_text())
          assert r['unchanged_scripts']==85 and r['scripts']==86
          assert not r['official_rc_write'] and r['studio']=='NOT_RUN'
          print('FB032_RC89_REAL_PLACE_SOURCE_ONLY_PASS')
          PY
      - name: Extract every actual real Script class path body and its source lock
        shell: bash
        run: |
          set -euo pipefail
          python3 quality_repair/FB032_RC89_WARP_LOOT_CUMULATIVE/extract_rojo.py \
            quality_repair/FB032_RC89_WARP_LOOT_CUMULATIVE/P0D_RC89_WIDEFIELD_WARP_STAGE_LOOT_WALL_SAFE_PRIVATE.rbxlx \
            quality_repair/FB032_RC89_WARP_LOOT_CUMULATIVE/SOURCE_LOCK.json \
            /tmp/fb032_rc89_rojo
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _fb032_luau
          persist-credentials: false
      - name: Real native Luau compile every one of 86 original Game and ModuleScripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _fb032_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _fb032_luau -B /tmp/fb032_luau_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/fb032_luau_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' src; do
            /tmp/fb032_luau_build/luau-compile "$src" >/dev/null
            n=$((n+1))
          done < <(find /tmp/fb032_rc89_rojo/src -type f -name '*.luau' -print0 | sort -z)
          test "$n" -eq 86
          echo NATIVE_LUAU_86_86_REAL_SOURCES_PASS
      - name: Pinned Rojo 7.7.1 actual Place build and exact 86 class path GitBlob equality
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/fb032_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/fb032_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/fb032_rojo.zip') as z:
              names=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='rojo']
              assert len(names)==1
              p=Path('/tmp/fb032_rojo_bin');p.write_bytes(z.read(names[0]));p.chmod(0o755)
          PY
          /tmp/fb032_rojo_bin build /tmp/fb032_rc89_rojo/default.project.json -o /tmp/fb032_rc89_rebuilt.rbxlx
          python3 - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          from collections import Counter
          want=json.loads(Path('/tmp/fb032_rc89_rojo/manifest.json').read_text())
          root=ET.fromstring(Path('/tmp/fb032_rc89_rebuilt.rbxlx').read_bytes())
          got=[]
          def walk(item,base=()):
              prop=item.find('Properties')
              name=prop.findtext("string[@name='Name']") if prop is not None else None
              src=next((x.text or '' for x in prop if x.get('name')=='Source'),None) if prop is not None else None
              here=base+((name,) if name else ())
              if src is not None:
                  by=src.encode('utf8')
                  blob=hashlib.sha1(b'blob '+str(len(by)).encode()+b'\0'+by).hexdigest()
                  got.append({'path':'/'.join(here),'class':item.attrib['class'],'blob':blob})
              for c in item.findall('Item'):walk(c,here)
          for i in root.findall('Item'):walk(i)
          assert len(got)==86
          assert Counter((x['path'],x['class'],x['blob']) for x in got)==Counter((x['path'],x['class'],x['blob']) for x in want)
          print('ROJO_86_86_PATH_CLASS_SOURCE_BLOB_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P0D-FB032-RC89-WARP-LOOT-COMBINED-NATIVE86-NOGO
          path: |
            quality_repair/FB032_RC89_WARP_LOOT_CUMULATIVE/P0D_RC89_WIDEFIELD_WARP_STAGE_LOOT_WALL_SAFE_PRIVATE.rbxlx
            quality_repair/FB032_RC89_WARP_LOOT_CUMULATIVE/SOURCE_LOCK.json
            quality_repair/FB032_RC89_WARP_LOOT_CUMULATIVE/RC_FEATURE_LOCK.json
            quality_repair/FB032_RC89_WARP_LOOT_CUMULATIVE/RECEIPT.json
          if-no-files-found: warn
          retention-days: 7
