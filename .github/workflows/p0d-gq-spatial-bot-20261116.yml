name: P0D GQ V3 Spatial Bot Source QA
on:
  pull_request:
    paths:
      - 'handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/**'
      - '.github/workflows/p0d-gq-spatial-bot-20261116.yml'
  push:
    branches:
      - 'quality/eggrumble-v3-spatial-bot-intake-20261116'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python negative/positive source checks (not Roblox runtime)
        run: python -m unittest discover -s handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests -p test_bot_spatial_quality.py -v
