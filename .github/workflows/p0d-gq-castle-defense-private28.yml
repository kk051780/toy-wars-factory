name: P0D GQ V3 private28 castle-defense single-game source-exact Place

on:
  push:
    branches:
      - quality/p0d-castle-defense-live-20261116
    paths:
      - 'handoffs/P0D-PQG-CASTLE-DEFENSE-20261116/**'
      - '.github/workflows/p0d-gq-castle-defense-private28.yml'
  pull_request:
    paths:
      - 'handoffs/P0D-PQG-CASTLE-DEFENSE-20261116/**'
      - '.github/workflows/p0d-gq-castle-defense-private28.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-28-source-private-place:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original 21-game SOURCE #482
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _v3_original
          persist-credentials: false
      - name: Original ART 4 #485
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _v3_art
          persist-credentials: false
      - name: SCORE one original author #487
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _v3_score
          persist-credentials: false
      - name: Existing true spatial AI/field and 26-source composer #484
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 2aeb4fd856657c9298a2763d9204d0c9d9b031cb
          path: _v3_quality
          persist-credentials: false
      - name: Native Luau fixed author SHA
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau_fixed
          persist-credentials: false
      - name: Confirm exact original source commits and no mixed generations
        run: |
          set -euo pipefail
          test "$(git -C _v3_original rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _v3_art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _v3_score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
          test "$(git -C _v3_quality rev-parse HEAD)" = 2aeb4fd856657c9298a2763d9204d0c9d9b031cb
          test "$(git -C _luau_fixed rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          echo AUTHOR_GAME_ART_SCORE_AI_FIXED_SOURCE_PINS_PASS
      - name: Native source author regressions and private defense overlay negatives
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -v -s handoffs/P0D-PQG-CASTLE-DEFENSE-20261116/tests -p 'test_*.py'
          python3 -B -m unittest discover -v -s _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests -p 'test_*.py'
          python3 -B -m unittest discover -v -s _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tests -p 'test_*.py'
      - name: Artist original source composition (no duplicate art)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py \
            --target v3 \
            --author-project _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json \
            --out artifacts/GQ_V3_LATEST_ART.project.json
      - name: Existing original 26 SOURCE game ART SCORE field AI composite (#484)
        run: |
          set -euo pipefail
          python3 _v3_quality/quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py \
            --author _v3_original --quality _v3_quality --art _v3_art --score _v3_score \
            --art-project artifacts/GQ_V3_LATEST_ART.project.json \
            --out artifacts/EGGRUMBLE_V3_GQ_26.project.json
      - name: Add only current PR's 2 real castle defense Modules and one patched existing host
        run: |
          set -euo pipefail
          python3 handoffs/P0D-PQG-CASTLE-DEFENSE-20261116/compose_private28.py \
            --base-project artifacts/EGGRUMBLE_V3_GQ_26.project.json \
            --out artifacts/EGGRUMBLE_V3_GQ_CASTLE_DEFENSE_28.project.json
      - name: Build source-exact native Luau compiler and runner
        run: |
          set -euo pipefail
          cmake -S _luau_fixed -B /tmp/gq28_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq28_native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          test -x /tmp/gq28_native/luau
          test -x /tmp/gq28_native/luau-compile
      - name: Compile every actual 28 mapped game/ART/SCORE/AI/defense source in Luau
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          proj=Path("artifacts/EGGRUMBLE_V3_GQ_CASTLE_DEFENSE_28.project.json").resolve()
          tree=json.loads(proj.read_text(encoding="utf-8"))["tree"]
          def files(node):
              if isinstance(node,dict):
                  if "$path" in node:yield (proj.parent/node["$path"]).resolve(strict=True)
                  else:
                      for k,v in node.items():
                          if not k.startswith("$"):yield from files(v)
          paths=list(files(tree))
          assert len(paths)==28,len(paths)
          for path in paths:
              subprocess.run(["/tmp/gq28_native/luau-compile","--text",str(path)],check=True,stdout=subprocess.DEVNULL)
          print("EGGRUMBLE_CASTLE_DEFENSE_NATIVE_28_OF_28_PASS")
          PY
      - name: Execute author-owned CastleDefense policy and TEAM BR stealth negative rules
        working-directory: handoffs/P0D-PQG-CASTLE-DEFENSE-20261116
        run: |
          set -euo pipefail
          /tmp/gq28_native/luau tests/EGGRUMBLE_CastleDefensePolicy.spec.luau | tee ../../artifacts/CASTLE_DEFENSE_VM.log
          grep -q 'EGGRUMBLE_CASTLE_DEFENSE_NATIVE_POLICY_PASS 46' ../../artifacts/CASTLE_DEFENSE_VM.log
      - name: Acquire checksum-verified Rojo 7.7.1 binary for private build
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq28_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq28_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq28_rojo.zip') as z:
              binaries=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(binaries)==1
              out=Path('/tmp/gq28_rojo')
              out.write_bytes(z.read(binaries[0]))
              out.chmod(0o755)
          PY
          /tmp/gq28_rojo build artifacts/EGGRUMBLE_V3_GQ_CASTLE_DEFENSE_28.project.json -o artifacts/EGGRUMBLE_V3_GQ_CASTLE_DEFENSE_28_PRIVATE.rbxlx
      - name: Validate Rojo actual Place against all 28 script sources and source-lock receipt
        run: |
          set -euo pipefail
          python3 handoffs/P0D-PQG-CASTLE-DEFENSE-20261116/verify_private28.py \
            --project artifacts/EGGRUMBLE_V3_GQ_CASTLE_DEFENSE_28.project.json \
            --place artifacts/EGGRUMBLE_V3_GQ_CASTLE_DEFENSE_28_PRIVATE.rbxlx \
            --receipt artifacts/CASTLE_DEFENSE_28_SOURCE_RECEIPT.json
      - name: Archive real PRIVATE 28-script Place and evidence, NEVER publish
        uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE_GQ_CASTLE_DEFENSE_28_PRIVATE_PLACE_NOT_RC
          retention-days: 3
          path: |
            artifacts/EGGRUMBLE_V3_GQ_CASTLE_DEFENSE_28_PRIVATE.rbxlx
            artifacts/EGGRUMBLE_V3_GQ_CASTLE_DEFENSE_28.project.json
            artifacts/CASTLE_DEFENSE_28_SOURCE_RECEIPT.json
            artifacts/CASTLE_DEFENSE_VM.log
