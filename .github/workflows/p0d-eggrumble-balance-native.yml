name: P0D EGGRUMBLE isolated balance native Luau gate
on:
  push:
    branches: [feature/p0d-pqg-seven-hero-playable-20261116-01]
    paths:
      - 'handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_BalanceMetrics.luau'
      - 'handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests/EGGRUMBLE_BalanceMetrics.spec.luau'
      - 'handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests/test_balance_lane_contract.py'
      - '.github/workflows/p0d-eggrumble-balance-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  balance-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python source contract
        run: python3 -B -m unittest discover -s handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests -p test_balance_lane_contract.py -v
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_pinned_luau
          persist-credentials: false
      - name: Pinned native Luau build and balance behavior
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_pinned_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_pinned_luau -B /tmp/p0d_balance_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_balance_luau --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          root=handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116
          /tmp/p0d_balance_luau/luau-compile "$root/EGGRUMBLE_BalanceMetrics.luau" >/dev/null
          /tmp/p0d_balance_luau/luau-compile "$root/tests/EGGRUMBLE_BalanceMetrics.spec.luau" >/dev/null
          mkdir -p /tmp/p0d_balance_case/tests
          cp "$root/EGGRUMBLE_BalanceMetrics.luau" /tmp/p0d_balance_case/
          cp "$root/tests/EGGRUMBLE_BalanceMetrics.spec.luau" /tmp/p0d_balance_case/tests/
          cd /tmp/p0d_balance_case/tests
          /tmp/p0d_balance_luau/luau EGGRUMBLE_BalanceMetrics.spec.luau | tee /tmp/p0d_balance_native.log
          grep -q EGGRUMBLE_BALANCE_NATIVE_SOURCE_PASS /tmp/p0d_balance_native.log
          echo "BALANCE_NATIVE_PASS SOURCE_ONLY STUDIO_NOT_RUN ANDROID_NOT_RUN RC_NOT_INTEGRATED"
