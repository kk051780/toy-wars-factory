name: P0D G9 private 3-level egg tag 2-team actual source CI
on:
  push:
    branches:
      - feature/p0d-world-g9-threelevel-egg-tag-20261113-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g9-egg-private-studio:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      G9: handoffs/P0D-WORLD-G9-THREELEVEL-EGG-CHALLENGE-20261113-01
    steps:
      - name: Checkout original G8 full exact history for byte provenance
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove G8 original2 Git bytes and 2 G9 real game source, hostile safety QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$G9"
          python3 tools/verify_g9.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download trusted hash-pinned Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/g9_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/g9_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          import stat,zipfile
          with zipfile.ZipFile("/tmp/g9_rojo.zip") as z:
              q=[x for x in z.namelist() if x.rsplit("/",1)[-1]=="rojo"]
              assert len(q)==1
              p=Path("/tmp/g9_rojo")
              p.write_bytes(z.read(q[0]))
              p.chmod(p.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/g9_rojo --version | grep -F 7.7.1
      - name: Create genuine PRIVATE never-published 3-tier G9 egg-heist studio .rbxlx
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g9_out
          /tmp/g9_rojo build "$G9/default.project.json" -o /tmp/g9_out/TRAP_RAIDERS_G9_THREE_LEVEL_EGG_TAG_STUDIO_ONLY.rbxlx
          test -s /tmp/g9_out/TRAP_RAIDERS_G9_THREE_LEVEL_EGG_TAG_STUDIO_ONLY.rbxlx
      - name: Verify all FOUR exact real script sources in actual generated .rbxlx XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,hashlib,json,os,pathlib,xml.etree.ElementTree as ET
          source=pathlib.Path(os.environ["G9"])
          place=pathlib.Path("/tmp/g9_out/TRAP_RAIDERS_G9_THREE_LEVEL_EGG_TAG_STUDIO_ONLY.rbxlx")
          root=ET.fromstring(place.read_bytes())
          found=[];types=collections.Counter()
          for item in root.iter("Item"):
              k=item.attrib.get("class")
              if k not in ("Script","ModuleScript","LocalScript"):continue
              node=item.find("./Properties/string[@name='Source']")
              if node is not None:
                  found.append(node.text or "")
                  types[k]+=1
          original=[p.read_text(encoding="utf8") for p in sorted((source/"src").rglob("*.luau"))]
          assert len(original)==4 and collections.Counter(found)==collections.Counter(original),(len(found),types)
          assert types=={"Script":2,"ModuleScript":2},types
          receipt={"type":"G9_STANDALONE_S2_PLUS_PRIVATE_STUDIO_PROTOTYPE",
            "authored_source_sha":os.environ["GITHUB_SHA"],
            "prior_G8_source_2_of_2_byte_preserved":True,
            "g9_full_source_luau_count":4,"actual_real_Rojo_4_of_4_byte_exact":True,
            "five_original_server_validated_portal_routes":True,
            "G9_server_egg_tag_policy":"SOURCE_ONLY_NOT_PHYSICAL_PLAY",
            "actual_studio_2player_egg_capture":"NOT_TESTED",
            "physical_android":"NOT_TESTED","human_first90_fun":"NOT_TESTED",
            "H1_legacy_egg_game_modified":False,"official_RC_adopted":False,
            "published":False,"paid":False,
            "place_bytes":place.stat().st_size,
            "place_sha256":hashlib.sha256(place.read_bytes()).hexdigest()}
          pathlib.Path("/tmp/g9_out/G9_REAL_BUILD_RECEIPT.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          print("P0D_G9_REAL_ROJO_FULL_FOUR_LUAU_SOURCES_IN_PRIVATE_PLACE_EXACT_PASS",dict(types))
          PY
      - name: Build pinned native Luau runtime, compile full 4 scripts and run ORIGINAL two-team egg rule lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/g9_luau
          git -C /tmp/g9_luau fetch --depth 1 origin f46d879e28302a430029304f7f6a162aed66f103
          git -C /tmp/g9_luau checkout --detach FETCH_HEAD
          test "$(git -C /tmp/g9_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S /tmp/g9_luau -B /tmp/g9_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/g9_native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          count=0
          while IFS= read -r -d '' file; do
            /tmp/g9_native/luau-compile "$file" >/dev/null
            count=$((count+1))
          done < <(find "$G9/src" -name '*.luau' -print0)
          test "$count" -eq 4
          cd "$G9"
          /tmp/g9_native/luau tests/egg_native.luau
          echo "P0D_G9_FULL_FOUR_LUAU_NATIVE_COMPILE_AND_REAL_EGG_RULE_VM_PASS"
      - name: Upload original unpublished complete G9 private Play-only place and exact receipt
        uses: actions/upload-artifact@v4
        with:
          name: P0D-WORLD-G9-THREE-LEVEL-EGG-TAG-PRIVATE-STUDIO
          path: |
            /tmp/g9_out/TRAP_RAIDERS_G9_THREE_LEVEL_EGG_TAG_STUDIO_ONLY.rbxlx
            /tmp/g9_out/G9_REAL_BUILD_RECEIPT.json
          retention-days: 7
          if-no-files-found: error
