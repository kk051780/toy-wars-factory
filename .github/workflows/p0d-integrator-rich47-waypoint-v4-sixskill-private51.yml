name: P0D Integrator Rich47 Real Dojo Waypoint + V4 Six-Skill Session 51 Private
on:
  push:
    branches:
      - integration/p0d-h1-result47-waypoint-v4-session-51-20261114-01
    paths:
      - 'handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/**'
      - '.github/workflows/p0d-integrator-rich47-waypoint-v4-sixskill-private51.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-real-private-place:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reassemble original 47 source exactly and independently test four new sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/tests -p 'test_v4_bridge.py' -v
      - name: Checkout exact upstream Luau
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_bridge_luau
          fetch-depth: 1
          persist-credentials: false
      - name: Build pinned real native Luau runtime and compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_bridge_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_bridge_luau -B /tmp/p0d_bridge_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_bridge_native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
      - name: Compile every actual private Luau source 51 out of 51
        shell: bash
        run: |
          set -euo pipefail
          DIST=handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
          n=0
          while IFS= read -r -d '' file; do
            /tmp/p0d_bridge_native/luau-compile "$file" >/tmp/p0d_bridge_compile.out 2>&1 || { cat /tmp/p0d_bridge_compile.out; exit 1; }
            n=$((n+1))
          done < <(find "$DIST/src" -name '*.luau' -type f -print0)
          test "$n" -eq 51
          echo P0D_PRIVATE_V4_BRIDGE_LUAU_51_OF_51_PASS
      - name: Native execute original authors V4 scheduler plus session XP real transition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_bridge_output
          python3 - <<'PY'
          from pathlib import Path
          s=Path('handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/src/FocusTrainingScheduler.luau').read_text()
          m=Path('handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/src/SessionSixSkillXPPreview.luau').read_text()
          qa='''local Scheduler=(function()
          '''+s+'''
          end)()
          local Model=(function()
          '''+m+'''
          end)()
          local now=1763030000
          local state=Scheduler.newState(12345,now,nil)
          state=Scheduler.selectSkill(state,"MAGIC")
          local nextState,segments=Scheduler.settle(state,now+1,true,0,false)
          assert(#segments==1 and segments[1].skill=="MAGIC" and segments[1].seconds==1)
          local totals,err=Model.apply(Model.new(),segments)
          assert(err==nil and totals.MAGIC==10000000 and totals.BEAST==0)
          state=nextState
          nextState,segments=Scheduler.settle(state,now+2,true,4,false)
          totals,err=Model.apply(totals,segments)
          assert(err==nil and totals.MAGIC==30000000)
          assert(Scheduler.getStatus(nextState,false).mode=="FOCUS")
          assert(Model.snapshot(totals).MAGIC.level==1)
          assert(Model.snapshot(totals).BEAST.level==1)
          assert(Scheduler.getStatus(nextState,false).freeRemaining==1798)
          state=nextState
          for i=1,15 do
            local later=now+2+i*120
            state,segments=Scheduler.settle(state,later,true,0,false)
            totals,err=Model.apply(totals,segments)
            assert(err==nil)
          end
          assert(state.focusedSeconds==1800)
          assert(Scheduler.getStatus(state,false).mode=="RANDOM")
          local bad,why=Model.apply(totals,{{skill="MAGIC",seconds=121,bonusBps=10000,mode="FOCUS"}})
          assert(bad==nil and why=="INVALID_SEGMENT")
          print("P0D_V4_ORIGINAL_AUTHORS_NATIVE_SCHEDULER_XP_SESSION_TRANSITIONS_PASS")
          '''
          Path('/tmp/p0d_bridge_output/ORIGINAL_V4_NATIVE_QA.luau').write_text(qa)
          PY
          /tmp/p0d_bridge_native/luau-compile /tmp/p0d_bridge_output/ORIGINAL_V4_NATIVE_QA.luau >/dev/null
          /tmp/p0d_bridge_native/luau /tmp/p0d_bridge_output/ORIGINAL_V4_NATIVE_QA.luau | tee /tmp/p0d_bridge_output/NATIVE_V4_SIXSKILL_QA.txt
          grep -F P0D_V4_ORIGINAL_AUTHORS_NATIVE_SCHEDULER_XP_SESSION_TRANSITIONS_PASS /tmp/p0d_bridge_output/NATIVE_V4_SIXSKILL_QA.txt
      - name: Download checksum-pinned official Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_bridge_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_bridge_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,stat
          with zipfile.ZipFile('/tmp/p0d_bridge_rojo.zip') as z:
              opts=[s for s in z.namelist() if s.rsplit('/',1)[-1]=='rojo']
              assert len(opts)==1
              p=Path('/tmp/p0d_bridge_rojo')
              p.write_bytes(z.read(opts[0]))
              p.chmod(p.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_bridge_rojo --version | grep -F '7.7.1'
      - name: Generate private genuine 51 script Studio Place and inspect embedded exact bodies
        shell: bash
        run: |
          set -euo pipefail
          DIST=handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
          /tmp/p0d_bridge_rojo build "$DIST/default.project.json" -o /tmp/p0d_bridge_output/P0D_H1_SKYV5_WAYPOINT_6SKILL_SESSION_PRIVATE.rbxlx
          cp "$DIST/SOURCE_LOCK.json" /tmp/p0d_bridge_output/SOURCE_LOCK.json
          python3 - <<'PY'
          import hashlib,json,pathlib,collections,xml.etree.ElementTree as E
          base=pathlib.Path('handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE')
          place=pathlib.Path('/tmp/p0d_bridge_output/P0D_H1_SKYV5_WAYPOINT_6SKILL_SESSION_PRIVATE.rbxlx')
          desired=collections.Counter(f.read_text('utf8') for f in (base/'src').rglob('*.luau'))
          observed=collections.Counter()
          names=collections.Counter()
          kinds=collections.Counter()
          for item in E.fromstring(place.read_bytes()).iter('Item'):
              kind=item.get('class')
              if kind not in ('Script','LocalScript','ModuleScript'):continue
              code=item.find("./Properties/string[@name='Source']")
              if code is None:continue
              kinds[kind]+=1
              observed[code.text or '']+=1
              name=item.find("./Properties/string[@name='Name']")
              if name is not None:names[(kind,name.text)]+=1
          assert observed==desired and sum(observed.values())==51,(len(desired),len(observed))
          assert kinds=={'Script':3,'LocalScript':8,'ModuleScript':40},kinds
          for t in [('Script','Game'),('Script','H1FunWorld'),
                    ('Script','V4TrainingBridge'),('LocalScript','V4TrialOverlay'),
                    ('LocalScript','ResultNextStep'),('ModuleScript','FocusTrainingScheduler'),
                    ('ModuleScript','SessionSixSkillXPPreview')]:
              assert names[t]==1,(t,names[t])
          lock=json.loads((base/'SOURCE_LOCK.json').read_text('utf8'))
          assert lock['original_47_byte_identical']==47
          assert lock['previous_h1_waypoint_preserved'] is True
          assert lock['v4_six_skills_physically_mirrored_total']==12
          assert sum('pointToInstalledPad(' in src for src in observed)==1
          assert sum('PRIVATE_V4_SKILL_BRIDGE' in src for src in observed)==1
          assert lock['v4_persistent_xp'] is False and lock['official_rc_adopted'] is False
          h=hashlib.sha256(place.read_bytes()).hexdigest()
          receipt={'status':'P0D_UNSELECTED_H1_RICH47_V4_SESSION_51_REAL_ROJO_BUILD',
            'place_sha256':h,'all_embedded_source_exact':51,'prior_source_unchanged':47,
            'v4_six_skill_session_xp_only':True,'v4_persistence':False,
            'daily_focus_quota_persistence':False,'studio_1client':'NOT_TESTED',
            'studio_2client':'NOT_TESTED','android':'NOT_TESTED',
            'owner_fun':'NOT_TESTED','official_rc_adopted':False,
            'published':False,'paid':False}
          pathlib.Path('/tmp/p0d_bridge_output/PRIVATE_PLACE_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('P0D_H1_RICH47_PLUS_V4_GENUINE_PRIVATE_ROJO_EXACT_51_PASS',h)
          PY
      - name: Upload unselected private owner Studio trial only
        uses: actions/upload-artifact@v4
        with:
          name: P0D-H1-RICH47-WAYPOINT-V4-6SKILL-SESSION-PRIVATE51-STUDIO-PLACE
          path: |
            /tmp/p0d_bridge_output/P0D_H1_SKYV5_WAYPOINT_6SKILL_SESSION_PRIVATE.rbxlx
            /tmp/p0d_bridge_output/SOURCE_LOCK.json
            /tmp/p0d_bridge_output/PRIVATE_PLACE_RECEIPT.json
            /tmp/p0d_bridge_output/NATIVE_V4_SIXSKILL_QA.txt
          retention-days: 7
          if-no-files-found: error
