name: P0D H2 five-egg server scoring lab true native Rojo source
on:
  push:
    branches:
      - feature/p0d-multi-egg-score-standalone-20261113-01
permissions:
  contents: read
jobs:
  pure-native-and-private-studio-place:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      LAB: handoffs/P0D-MULTI-EGG-SCORE-LAB-20261113-01
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build direct-source original five egg native Luau scenario tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$LAB/tests/generate_native_test.py" --write /tmp/p0d_h2_5eggs_policy.luau
          test -s /tmp/p0d_h2_5eggs_policy.luau
      - name: Fetch SHA-pinned Rojo 7.7.1 Studio builder
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_h2_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_h2_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import pathlib,stat,zipfile
          with zipfile.ZipFile("/tmp/p0d_h2_rojo.zip") as z:
              files=[i for i in z.namelist() if i.rsplit("/",1)[-1]=="rojo"]
              assert len(files)==1
              p=pathlib.Path("/tmp/p0d_h2_rojo")
              p.write_bytes(z.read(files[0]))
              p.chmod(p.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_h2_rojo --version | grep -F 7.7.1
      - name: Build physical original standalone H2 five-egg Studio Place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_h2_multi_egg
          /tmp/p0d_h2_rojo build "$LAB/default.project.json" -o /tmp/p0d_h2_multi_egg/P0D_H2_MULTI_EGG_SCORE_LAB_STUDIO_ONLY.rbxlx
          test -s /tmp/p0d_h2_multi_egg/P0D_H2_MULTI_EGG_SCORE_LAB_STUDIO_ONLY.rbxlx
          python3 -B "$LAB/tests/check_studio_place.py" --place /tmp/p0d_h2_multi_egg/P0D_H2_MULTI_EGG_SCORE_LAB_STUDIO_ONLY.rbxlx
      - name: Fetch pinned official Luau native source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/p0d_h2_luau
          git -C /tmp/p0d_h2_luau fetch --depth 1 origin f46d879e28302a430029304f7f6a162aed66f103
          git -C /tmp/p0d_h2_luau checkout --detach FETCH_HEAD
          test "$(git -C /tmp/p0d_h2_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S /tmp/p0d_h2_luau -B /tmp/p0d_h2_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_h2_native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
      - name: Native compile all source and genuinely execute original 5-egg rules
        shell: bash
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r -d '' file; do
            /tmp/p0d_h2_native/luau-compile "$file" >/dev/null
            n=$((n+1))
          done < <(find "$LAB/src" -name '*.luau' -print0)
          test "$n" -eq 3
          echo "P0D_H2_FIVE_EGG_LAB_NATIVE_COMPILE_3_OF_3_PASS"
          /tmp/p0d_h2_native/luau-compile /tmp/p0d_h2_5eggs_policy.luau >/dev/null
          /tmp/p0d_h2_native/luau /tmp/p0d_h2_5eggs_policy.luau | tee /tmp/p0d_h2_multi_egg/POLICY_NATIVE_TEST.txt
          grep -E '^P0D_H2_MULTI_EGG_NATIVE_POLICY_PASS_[0-9]+$' /tmp/p0d_h2_multi_egg/POLICY_NATIVE_TEST.txt
      - name: Save unpublished source-built H2 LAB only
        uses: actions/upload-artifact@v4
        with:
          name: P0D-H2-5-EGGS-SCORE-STUDIO-LAB-ONLY-NOT-H1-NOT-PUBLISH
          path: |
            /tmp/p0d_h2_multi_egg/P0D_H2_MULTI_EGG_SCORE_LAB_STUDIO_ONLY.rbxlx
            /tmp/p0d_h2_multi_egg/POLICY_NATIVE_TEST.txt
          if-no-files-found: error
          retention-days: 7
