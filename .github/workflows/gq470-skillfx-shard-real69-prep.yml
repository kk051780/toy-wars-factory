name: GQ470 REAL69 SkillFX low-occlusion slash A-PREP (not ART GO)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_skillfx_shard_real69_20261121/**'
      - '.github/workflows/gq470-skillfx-shard-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  skillfx-real69-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Visual-scope source mutation negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile quality_gameplay/gq470_skillfx_shard_real69_20261121/patch_skillfx69.py
          python3 -B quality_gameplay/gq470_skillfx_shard_real69_20261121/patch_skillfx69.py --self-test
      - name: Immutable official 69-Luau original and one-source candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01 --jq .object.sha)" = "e80973c354f14a0d0088577f3cc1a875454f0f8f" || { echo RED_STALE_OFFICIAL_HEAD; exit 1; }
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44695199140 --jq '.head_sha+" "+.conclusion')" = "e80973c354f14a0d0088577f3cc1a875454f0f8f success"
          mkdir -p /tmp/gq470-skillfx
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir /tmp/gq470-skillfx
          test -s /tmp/gq470-skillfx/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 -B quality_gameplay/gq470_skillfx_shard_real69_20261121/patch_skillfx69.py --base /tmp/gq470-skillfx
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile all 69 selected Luau scripts, ON and OFF
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-skillfx-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-skillfx-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import sys,subprocess
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq470_skillfx_shard_real69_20261121")
          from patch_skillfx69 import selected,ROUTE,OFF
          root=Path("/tmp/gq470-skillfx")
          a=selected(root);b=selected(root/OFF)
          assert len(a)==len(b)==69 and set(a)==set(b)
          assert {k for k in a if a[k].read_bytes()!=b[k].read_bytes()}=={ROUTE}
          for files in (a,b):
              for src in files.values():
                  subprocess.run(["/tmp/gq470-skillfx-luau/luau-compile","--text",str(src)],
                                 stdout=subprocess.DEVNULL,check=True)
          print("GQ470_SKILLFX_NATIVE_LUAU69_ON_OFF_PASS")
          PY
      - name: Rojo real original/candidate Place and rollback source nonloss
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-skillfx-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-skillfx-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq470-skillfx-rojo.zip") as z:
              files=[x for x in z.namelist() if x.split("/")[-1]=="rojo"]
              assert len(files)==1
              p=Path("/tmp/gq470-skillfx-rojo")
              p.write_bytes(z.read(files[0]));p.chmod(0o755)
          PY
          /tmp/gq470-skillfx-rojo build /tmp/gq470-skillfx/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-skillfx/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          /tmp/gq470-skillfx-rojo build /tmp/gq470-skillfx/OFF69_SKILLFX_SHARD_FLASH/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-skillfx/OFF69_SKILLFX_SHARD_FLASH_REBUILT.rbxlx
          cmp /tmp/gq470-skillfx/OFF69_SKILLFX_SHARD_FLASH_REBUILT.rbxlx /tmp/gq470-skillfx/OFF69_SKILLFX_SHARD_FLASH/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-skillfx/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-skillfx/EGGRUMBLE_REAL69_PRIVATE.rbxlx --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-skillfx/OFF69_SKILLFX_SHARD_FLASH/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-skillfx/OFF69_SKILLFX_SHARD_FLASH_REBUILT.rbxlx --count 69
          python3 quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base /tmp/gq470-skillfx --report /tmp/gq470-skillfx/SKILLFX_LEGACY48_SOURCE_AUDIT.json
      - name: Pin candidate Place bytes in receipt before independent art audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("/tmp/gq470-skillfx")
          f=root/"REAL69_LEGACY_INTAKE_RECEIPT.json"
          receipt=json.loads(f.read_text())
          p=root/"EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          receipt["private_place_bytes"]=p.stat().st_size
          receipt["private_place_sha256"]=hashlib.sha256(p.read_bytes()).hexdigest()
          f.write_text(json.dumps(receipt,sort_keys=True,ensure_ascii=False,indent=2)+"\n")
          print("GQ470_SKILLFX_RECEIPT_PLACE_SOURCE_MATCH",p.stat().st_size)
          PY
      - name: Independent REAL69 source art gate, no fake screenshots or human verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 art_quality/gq470_real69_source_gate.py --self-test
          python3 art_quality/gq470_real69_source_gate.py --root /tmp/gq470-skillfx --head e80973c354f14a0d0088577f3cc1a875454f0f8f --out /tmp/gq470-skillfx/ART_CHECK_REPORT.json
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("/tmp/gq470-skillfx")
          a=json.loads((root/"ART_CHECK_REPORT.json").read_text())
          assert a["source_gate"]["status"]=="PASS_SOURCE_ONLY"
          assert a["source_gate"]["actual_place_scripts"]==69
          assert a["visual_evidence_gate"]["screenshots_received"]==0
          assert a["human_art"]["status"]=="NOT_TESTED"
          assert a["mobile_runtime"]["status"]=="NOT_TESTED"
          assert a["art_gate"]=="ART_NO_GO" and a["owner_accepted"] is False
          r=root/"SKILLFX_SHARD_SOURCE_REPORT.json"
          v=json.loads(r.read_text())
          p=root/"EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          v["candidate_place_bytes"]=p.stat().st_size
          v["candidate_place_sha256"]=hashlib.sha256(p.read_bytes()).hexdigest()
          v["native_rojo_off69"]="PASS_SOURCE_ONLY"
          r.write_text(json.dumps(v,sort_keys=True,indent=2)+"\n")
          print("GQ470_SKILLFX_PRIVATE_CANDIDATE_PLACE_BYTES",p.stat().st_size)
          PY
      - name: B220 exact two-file selected source and manifest, 3 forged-packet negatives
        shell: bash
        run: |
          set -euo pipefail
          EXP=quality_gameplay/gq470_skillfx_shard_real69_20261121/export_b220.py
          python3 -m py_compile "$EXP"
          python3 -B "$EXP" --self-test
          python3 -B "$EXP" --candidate /tmp/gq470-skillfx \
            --out /tmp/gq470-skillfx/B220_SKILLFX_ONE_SELECTED_SOURCE_NOT_FORMAL \
            --head "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -B "$EXP" --candidate /tmp/gq470-skillfx \
            --out /tmp/gq470-skillfx/B220_SKILLFX_ONE_SELECTED_SOURCE_NOT_FORMAL \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" --check
          echo GQ470_SKILLFX_B220_ONE_SOURCE_ONLY_PREP_READY_NOT_OFFICIAL
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-SKILLFX-SCULPTED-FLASH-A-PREP-NOT-FORMAL
          path: |
            /tmp/gq470-skillfx/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-skillfx/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-skillfx/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-skillfx/SKILLFX_SHARD_SOURCE_REPORT.json
            /tmp/gq470-skillfx/ART_CHECK_REPORT.json
            /tmp/gq470-skillfx/SKILLFX_LEGACY48_SOURCE_AUDIT.json
            /tmp/gq470-skillfx/B220_SKILLFX_ONE_SELECTED_SOURCE_NOT_FORMAL/**
            /tmp/gq470-skillfx/sources/**
            /tmp/gq470-skillfx/OFF69_SKILLFX_SHARD_FLASH_REBUILT.rbxlx
          if-no-files-found: error
          retention-days: 7
