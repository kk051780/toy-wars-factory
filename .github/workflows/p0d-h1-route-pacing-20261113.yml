name: P0D world field route pacing source QA only
on:
  push:
    branches:
      - feature/p0d-h1-route-pacing-sea-sky-20261113-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-route-pacing-source-qa:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Ensure prior frozen review and original H1 source are byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e '2494fa855d77e1ef6dd2c5f8b8d21fbef90fc44a^{commit}'
          test -z "$(git diff --name-only 2494fa855d77e1ef6dd2c5f8b8d21fbef90fc44a HEAD -- handoffs/P0D-H1-ROUTE-OVERLAP-QA-20261113-01 handoffs/P0D-H1-WORLD-CREATURES-20261113-01 releases/P0D_S1_KIDS_RC01)"
      - name: Run the real fixed-source 22 Python contract/unsafe-mutation tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s 'handoffs/P0D-H1-ROUTE-PACING-20261113-01/tests' -p 'test_*.py' -v
          test -z "$(git status --porcelain --untracked-files=no)"
