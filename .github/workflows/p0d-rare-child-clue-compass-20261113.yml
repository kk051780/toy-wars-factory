name: P0D rare child clue hint native full game source + real Rojo 10
on:
  push:
    branches:
      - handoff/p0d-rare-child-clue-compass-20261113-01
    paths:
      - 'handoffs/P0D-RARE-CHILD-CLUE-COMPASS-20261113-01/**'
      - '.github/workflows/p0d-rare-child-clue-compass-20261113.yml'
permissions:
  contents: read
jobs:
  original-server-clue-native-two-players:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CLUE_ROOT: handoffs/P0D-RARE-CHILD-CLUE-COMPASS-20261113-01
      ORIGINAL_WORLD: handoffs/P0D-WORLD-RARE-4REALMS-3D-20261112-01
      ORIGINAL_NEUTRAL: handoffs/P0D-WORLD-RARE-NEUTRAL-ENCOUNTERS-20261112-01
      ORIGINAL_BOOK: handoffs/P0D-RARE-DISCOVERY-BOOK-20261112-01
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify original 3 packets unchanged and all four strict manifests
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 17e16ae8b323bc5a35aba62981b2b593029939df HEAD
          git diff --exit-code 17e16ae8b323bc5a35aba62981b2b593029939df HEAD -- "$ORIGINAL_WORLD" "$ORIGINAL_NEUTRAL" "$ORIGINAL_BOOK"
          python3 "$ORIGINAL_WORLD/tools/verify_manifest.py"
          python3 "$ORIGINAL_NEUTRAL/tools/verify_manifest.py"
          python3 "$ORIGINAL_BOOK/tools/verify_manifest.py"
          python3 "$CLUE_ROOT/tools/verify_manifest.py"
          python3 "$CLUE_ROOT/tools/verify_candidate_delta.py"
          echo "P0D_CHILD_CLUE_PRIOR_THREE_IMMUTABLE_ALL_PASS"
      - name: Run kid safety, exact four-hook server delta and tool QA
        shell: bash
        run: python3 -m unittest discover -s "$CLUE_ROOT/tests" -p 'test_*.py' -v
      - name: Build upstream genuine pinned Luau native runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/clue-luau
          git -C /tmp/clue-luau init -q
          git -C /tmp/clue-luau remote add origin https://github.com/luau-lang/luau.git
          git -C /tmp/clue-luau fetch --quiet --depth 1 origin f46d879e28302a430029304f7f6a162aed66f103
          git -C /tmp/clue-luau checkout --quiet FETCH_HEAD
          test "$(git -C /tmp/clue-luau rev-parse HEAD)" = "f46d879e28302a430029304f7f6a162aed66f103"
          cmake -S /tmp/clue-luau -B /tmp/clue-luau/build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_CLI=ON -DLUAU_BUILD_TESTS=OFF
          cmake --build /tmp/clue-luau/build --config Release --target Luau.Repl.CLI Luau.Compile.CLI -j 2
      - name: Compile 3 NEW authentic source scripts and run original server+two fake clients with 9 bad mutations
        shell: bash
        run: |
          set -euo pipefail
          for source in "$CLUE_ROOT"/src/*.luau; do
            /tmp/clue-luau/build/luau-compile "$source" >/dev/null
            echo "P0D_CLUE_NEW_ORIGINAL_SOURCE_NATIVE_COMPILE_PASS $source"
          done
          python3 "$CLUE_ROOT/tools/build_native_clue_runner.py" --output /tmp/p0d-rare-child-clue-cases
          test "$(find /tmp/p0d-rare-child-clue-cases -name '*.luau' | wc -l)" -eq 10
          for source in /tmp/p0d-rare-child-clue-cases/*.luau; do
            /tmp/clue-luau/build/luau-compile "$source" >/dev/null
          done
          /tmp/clue-luau/build/luau /tmp/p0d-rare-child-clue-cases/positive.luau | tee /tmp/p0d-rare-child-clue-positive.txt
          grep -q "P0D_RARE_CHILD_CLUE_FULL_NATIVE_PASS assertions=" /tmp/p0d-rare-child-clue-positive.txt
          for bad in BAD_SERVER_HINT_WRONG_PLAYER BAD_SERVER_HINT_SHOWS_EMPTY_BOOK BAD_WRONG_HUB_CLUE BAD_PROMISE_COINS BAD_DAILY_PRESSURE BAD_HINT_HIDDEN BAD_CLUE_GUI_TOO_SMALL BAD_DUPLICATE_CLUE_ROW BAD_TEST_MODE_WORLD; do
            if /tmp/clue-luau/build/luau "/tmp/p0d-rare-child-clue-cases/$bad.luau" > "/tmp/$bad.log" 2>&1; then
              echo "P0D_CLUE_UNSAFE_MUTANT_ACCEPTED $bad"; exit 1
            fi
            grep -q "RARE_BOOK_FULL_SERVER_NATIVE_FAIL" "/tmp/$bad.log"
          done
          echo "P0D_CLUE_NINE_ACTUAL_ORIGINAL_SOURCE_MUTANTS_REJECTED_PASS"
  true-rojo-original-ten-script-review-place:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CLUE_ROOT: handoffs/P0D-RARE-CHILD-CLUE-COMPASS-20261113-01
      ORIGINAL_WORLD: handoffs/P0D-WORLD-RARE-4REALMS-3D-20261112-01
      ORIGINAL_NEUTRAL: handoffs/P0D-WORLD-RARE-NEUTRAL-ENCOUNTERS-20261112-01
      ORIGINAL_BOOK: handoffs/P0D-RARE-DISCOVERY-BOOK-20261112-01
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require four source manifests and only-four server candidate changes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$ORIGINAL_WORLD/tools/verify_manifest.py"
          python3 "$ORIGINAL_NEUTRAL/tools/verify_manifest.py"
          python3 "$ORIGINAL_BOOK/tools/verify_manifest.py"
          python3 "$CLUE_ROOT/tools/verify_manifest.py"
          python3 "$CLUE_ROOT/tools/verify_candidate_delta.py"
      - name: Download official Rojo 7.7.1 SHA256 pinned exact binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip" \
            -o "$RUNNER_TEMP/rojo.zip"
          printf '%s\n' "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $RUNNER_TEMP/rojo.zip" | sha256sum -c
          python3 - <<'PY'
          import os,pathlib,stat,zipfile
          target=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(target/"rojo.zip") as z:
              names=[n for n in z.namelist() if n.rsplit("/",1)[-1]=="rojo"]
              assert len(names)==1
              data=z.read(names[0])
              assert len(data)>1_000_000
              binary=target/"rojo"
              binary.write_bytes(data)
              binary.chmod(binary.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          PY
          "$RUNNER_TEMP/rojo" --version | grep -F "7.7.1"
      - name: Build real unpublished 10-script .rbxlx and reject 8 corruptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _rare_clue_real_rojo
          "$RUNNER_TEMP/rojo" build "$CLUE_ROOT/default.project.json" -o "_rare_clue_real_rojo/RARE_CHILD_CLUE_REVIEW_ONLY.rbxlx"
          export P0D_CLUE_REAL_ROJO_PLACE="$PWD/_rare_clue_real_rojo/RARE_CHILD_CLUE_REVIEW_ONLY.rbxlx"
          test -s "$P0D_CLUE_REAL_ROJO_PLACE"
          python3 "$CLUE_ROOT/tools/verify_real_rojo.py" --place "$P0D_CLUE_REAL_ROJO_PLACE" --receipt "_rare_clue_real_rojo/EXACT_TEN_SCRIPT_SOURCE_RECEIPT.json"
          python3 -m unittest discover -s "$CLUE_ROOT/tests" -p 'test_real_rojo.py' -v
          echo "P0D_CLUE_REAL_ROJO_SUCCESS_BUT_ROBLOX_STUDIO_NOT_TESTED"
      - name: Upload review-only binary and trusted exact source receipt
        uses: actions/upload-artifact@v4
        with:
          name: P0D-RARE-CHILD-CLUE-TEN-REAL-SCRIPTS-REVIEW-ONLY
          path: |
            _rare_clue_real_rojo/RARE_CHILD_CLUE_REVIEW_ONLY.rbxlx
            _rare_clue_real_rojo/EXACT_TEN_SCRIPT_SOURCE_RECEIPT.json
          retention-days: 14
          if-no-files-found: error
      - name: Do not modify tracked original assets or invoke Studio
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "P0D_CLUE_ACTUAL_STUDIO_MOBILE_2CLIENT_NOT_TESTED"
