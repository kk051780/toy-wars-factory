name: P0D S1 native original Luau compiler for FTUE and D07D08 lobby 20
on:
  push:
    branches:
      - handoff/p0d-s1-ftue-on-d07d08-spatial-lobby-20261112-01
    paths:
      - .github/workflows/p0d-s1-ftue-d07d08-native-luau-20261112.yml
permissions:
  contents: read
jobs:
  compile-original-game-luau:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact S1 source (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout PINNED official Luau compiler source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _third_party_luau
          fetch-depth: 1
          persist-credentials: false
      - name: Verify official compiler source SHA and construct CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _third_party_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _third_party_luau -B /tmp/p0d-ftue-luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d-ftue-luau-build --target Luau.Compile.CLI --config Release --parallel 2
          test -x /tmp/p0d-ftue-luau-build/luau-compile
      - name: Compile every REAL 20 Luau scripts and verify negative invalid control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess
          root=pathlib.Path('handoffs/P0D-S1-FTUE-ON-D07D08-SPATIAL-LOBBY-20261112-01/candidate')
          compiler='/tmp/p0d-ftue-luau-build/luau-compile'
          files=sorted(root.rglob('*.luau'))
          assert len(files)==20, f'Expected 20 actual Luau sources, got {len(files)}: {files}'
          for path in files:
              cp=subprocess.run([compiler,str(path)],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              assert cp.returncode==0, f'{path}: {cp.stderr.decode(errors="replace")}'
              print('COMPILED',path.relative_to(root))
          test=pathlib.Path('/tmp/p0d_ftue_invalid_source.luau')
          test.write_text('local = 17\n',encoding='utf8')
          bad=subprocess.run([compiler,str(test)],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
          assert bad.returncode!=0,'Negative syntax control was wrongly accepted'
          print('P0D_S1_FTUE_FULL_GAME_NATIVE_LUAU_COMPILE_PASS_20_20')
          print('P0D_S1_FTUE_NATIVE_NEGATIVE_CONTROL_REJECTED')
          print('P0D_S1_NATIVE_STUDIO_NOT_TESTED_NO_PUBLISH')
          PY
      - name: No source checkout was changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- handoffs/P0D-S1-FTUE-ON-D07D08-SPATIAL-LOBBY-20261112-01/candidate
          git diff --exit-code -- releases/P0D_S1_KIDS_RC01
