name: GQ8 RC85 RC86 legacy exploration REAL66 ON OFF65 private build
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_rc85_rc86_exploration_20261119/**'
      - '.github/workflows/gq8-rc86-exploration-real66.yml'
  push:
    branches: [quality/gq8-rc86-v3-exploration-bridge-20261119]
    paths:
      - 'quality_gameplay/gq8_rc85_rc86_exploration_20261119/**'
      - '.github/workflows/gq8-rc86-exploration-real66.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-rojo-on66-off65:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lock one live official RC head and source artifact
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            PR_BASE="$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")"
            test -n "$PR_BASE" || { echo RED_PR_WITHOUT_BASE; exit 1; }
            if [ "$CURRENT" != "$PR_BASE" ]; then
              echo GQ8_PR_EVENT_BASE_STALE_REBIND_TO_CURRENT_LIVE_RC_SOURCE_ONLY
            fi
            # Build exclusively from CURRENT official source artifact, never PR_BASE,
            # and reject any concurrent RC movement at the final same-head gate.
          fi
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CURRENT&per_page=100" --jq '.workflow_runs[] | select(.name=="GQ8 Real65 official63 preserve basic dodge plus viral counter ON65 OFF63" and .conclusion=="success" and .event=="push") | .id' | head -n 1)"
          test -n "$RUN" || { echo RED_NO_SAMEHEAD_OFFICIAL_REAL65_NATIVE_ROJO; exit 1; }
          echo "GQ8_OFFICIAL_BASE_SHA=$CURRENT" >> "$GITHUB_ENV"
          echo "GQ8_OFFICIAL_BASE_RUN=$RUN" >> "$GITHUB_ENV"
          mkdir -p /tmp/gq8-official-real65
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL65-CANONICAL-PRIVATE-STUDIO --dir /tmp/gq8-official-real65
          test -s /tmp/gq8-official-real65/EGGRUMBLE_REAL65.project.json
          test -s /tmp/gq8-official-real65/REAL65_INTAKE_RECEIPT.json
          test -s /tmp/gq8-official-real65/EGGRUMBLE_REAL65_PRIVATE.rbxlx
          echo GQ8_OFFICIAL_REAL65_ARTIFACT_SAMEHEAD_VERIFIED
      - name: Compose exactly one new Script without changing any 65 existing sources
        shell: bash
        run: |
          set -euo pipefail
          python3 quality_gameplay/gq8_rc85_rc86_exploration_20261119/test_bridge.py
          python3 -m py_compile quality_gameplay/gq8_rc85_rc86_exploration_20261119/compose_real66.py
          python3 quality_gameplay/gq8_rc85_rc86_exploration_20261119/compose_real66.py \
            --base /tmp/gq8-official-real65 \
            --source quality_gameplay/gq8_rc85_rc86_exploration_20261119/EGGRUMBLE_LegacyExplorationBridge.server.luau \
            --out artifacts/real66 --official-sha "$GQ8_OFFICIAL_BASE_SHA"
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native Luau compile every REAL66 source
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8-real66-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8-real66-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('artifacts/real66')
          spec=json.loads((p/'EGGRUMBLE_REAL66.project.json').read_text())
          def flatten(node):
              for k,v in node.items():
                  if not isinstance(v,dict) or k.startswith('$'):continue
                  if '$path' in v:yield k,v['$path']
                  else:yield from flatten(v)
          selected=list(flatten(spec['tree']))
          assert len(selected)==66,len(selected)
          for _,f in selected:
              subprocess.run(['/tmp/gq8-real66-luau/luau-compile','--text',str(p/f)],check=True,stdout=subprocess.DEVNULL)
          print('GQ8_REAL66_ACTUAL_NATIVE_66_OF_66_PASS')
          PY
      - name: Build REAL66 via pinned Rojo and compare OFF65 and source/class
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq8-real66-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq8-real66-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq8-real66-rojo.zip') as z:
              names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(names)==1
              out=Path('/tmp/gq8-real66-rojo');out.write_bytes(z.read(names[0]));out.chmod(0o755)
          PY
          /tmp/gq8-real66-rojo build artifacts/real66/EGGRUMBLE_REAL66.project.json -o artifacts/real66/EGGRUMBLE_REAL66_PRIVATE.rbxlx
          /tmp/gq8-real66-rojo build artifacts/real66/EGGRUMBLE_REAL65.project.json -o artifacts/real66/OFF65_REBUILT.rbxlx
          cmp artifacts/real66/OFF65_REBUILT.rbxlx artifacts/real66/EGGRUMBLE_REAL65_PRIVATE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project artifacts/real66/EGGRUMBLE_REAL66.project.json --place artifacts/real66/EGGRUMBLE_REAL66_PRIVATE.rbxlx --count 66
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project artifacts/real66/EGGRUMBLE_REAL65.project.json --place artifacts/real66/OFF65_REBUILT.rbxlx --count 65
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)"
          test "$CURRENT" = "$GQ8_OFFICIAL_BASE_SHA" || { echo RED_STALE_OFFICIAL_HEAD_AFTER_BUILD; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('artifacts/real66')
          x=json.loads((p/'REAL66_LEGACY_INTAKE_RECEIPT.json').read_text())
          b=(p/'EGGRUMBLE_REAL66_PRIVATE.rbxlx').read_bytes()
          assert x['candidate_selected_count']==66 and x['parent_original_exact']==65
          assert x['formal_adopted'] is False
          x['private_place_sha256']=hashlib.sha256(b).hexdigest()
          x['private_place_bytes']=len(b)
          x['native']='PASS';x['rojo']='PASS';x['off65']='BYTE_EXACT'
          (p/'REAL66_LEGACY_INTAKE_RECEIPT.json').write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print('GQ8_REAL66_CANDIDATE_FULL_ON66_OFF65_PASS',len(b))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-REAL66-RC85-RC86-PLUS-CURRENT65-PRIVATE-NOT-OFFICIAL
          path: artifacts/real66/
          if-no-files-found: error
          retention-days: 30
