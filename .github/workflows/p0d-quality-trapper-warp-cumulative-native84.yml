name: P0D #470 real Trapper portals plus siege Beast Solo seven weapons native84
on:
  push:
    branches: [feature/p0d-product-quality-gate-20261115]
    paths:
      - product_quality/role7_trapper_warp/**
      - .github/workflows/p0d-quality-trapper-warp-cumulative-native84.yml
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - product_quality/role7_trapper_warp/**
      - .github/workflows/p0d-quality-trapper-warp-cumulative-native84.yml
permissions:
  contents: read
  actions: read
jobs:
  real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve verified same-source RC83 original seven weapons plus castle and bots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_trapper_84_parent
          gh run download 43702346310 -R kk051780/toy-wars-factory \
            -n P0D-QUALITY-REAL-CASTLE-BEAST-SOLO-7WEAPONS-PRIVATE83-NOGO \
            -D /tmp/p0d_trapper_84_parent
          test -s /tmp/p0d_trapper_84_parent/P0D_CASTLE_BEAST_SOLO_SEVEN_WEAPONS_PRIVATE83.zip
      - name: Build actual private RC84 Place and audit exactly retained 82 scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B product_quality/role7_trapper_warp/build_trapper_cumulative.py \
            --parent /tmp/p0d_trapper_84_parent/P0D_CASTLE_BEAST_SOLO_SEVEN_WEAPONS_PRIVATE83.zip \
            --out /tmp/P0D_TRAPPER_WARP_PRIVATE84.zip \
            --extract /tmp/p0d_trapper_84_sources
          python3 - <<'PY'
          import sys,zipfile,json,hashlib
          from pathlib import Path
          sys.path.insert(0,'product_quality/role7_trapper_warp')
          import build_trapper_cumulative as x
          with zipfile.ZipFile('/tmp/P0D_TRAPPER_WARP_PRIVATE84.zip') as z:
              r=json.loads(z.read('RECEIPT.json'))
              place=z.read(x.OUTPUT)
          assert r['source_count']==84
          assert r['existing_82_scripts_byte_exact']
          assert r['egg_steal_deposit_score_winner_source_exact']
          assert r['castle_beast_solo_ai_seven_weapons_preserved']
          assert r['warp_pair_actual_server_pad'] and r['shared_three_transfer_limit']
          assert r['anti_bounce_all_active_portals'] and r['safe_landing_resets_velocity']
          assert not r['official_rc_write'] and r['product']=='NO_GO'
          assert hashlib.sha256(place).hexdigest()==r['place_sha256']
          _,scripts=x.source_nodes(place)
          assert len(scripts)==84
          assert len(list(Path('/tmp/p0d_trapper_84_sources').glob('*.luau')))==84
          game=scripts['Game'].text
          service=scripts['TrapperWarpService'].text
          assert 'SevenJobs.TrapperWarp.place(player,team,root.Position,facing,map.model,' in game
          assert game.count('remote.OnServerEvent:Connect(')==1
          assert 'P0D_PRIVATE_TRAPPER_WARP' in service
          assert 'GetAttributeChangedSignal' in service
          assert 'character:PivotTo(target)' in service
          assert 'root.AssemblyAngularVelocity=Vector3.zero' in service
          assert 'rec.remaining-=1' in service
          assert 'not nearPortal(passenger,root,team,EXIT_RADIUS)' in service
          assert 'Instance.new("RemoteEvent")' not in service
          assert 'DataStore' not in service and 'Marketplace' not in service
          try:x.add_module(x.source_nodes(place)[0],service)
          except ValueError:pass
          else:raise AssertionError('SECOND_TRAPPER_MODULE_ACCEPTED')
          for damaged in ('',x.IMPORT_OLD,x.IMPORT_NEW,x.SKILL_OLD,x.SKILL_OLD*2):
              try:x.patch_game(damaged)
              except ValueError:pass
              else:raise AssertionError('UNLOCKED_OR_DUPLICATED_GAME_ACCEPTED')
          print('REAL_TRAPPER_WARP_84_EXACT_SOURCE_LOCK_AND_NEGATIVE_TESTS_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_trapper_84_luau
          persist-credentials: false
      - name: Native compile ALL 84 actual Luau scripts including genuine Game
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_trapper_84_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_trapper_84_luau -B /tmp/p0d_trapper_84_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_trapper_84_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' f; do
            /tmp/p0d_trapper_84_build/luau-compile "$f" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_trapper_84_sources -name '*.luau' -type f -print0 | sort -z)
          test "$n" -eq 84
          echo 'P0D_REAL_TRAPPER_SIEGE_BEAST_SOLO_WEAPONS_NATIVE_84_OF_84_PASS'
      - name: Reconstruct 84 original Roblox paths and types from the actual Place
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          import hashlib,json
          target=Path('/tmp/p0d_trapper_84_rojo')
          with ZipFile('/tmp/P0D_CASTLE_BEAST_SOLO_SEVEN_WEAPONS_PRIVATE84.zip') as z:
              root=ET.fromstring(z.read('P0D_RC84_CASTLE_BEAST_SOLO_SEVEN_WEAPONS_TRAPPER_PRIVATE.rbxlx'))
          types={'Script':'.server.luau','LocalScript':'.client.luau','ModuleScript':'.luau'}
          manifest=[]
          def walk(item,old=()):
              p=item.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=old+((name,) if name else ())
              if src is not None:
                  assert item.get('class') in types and len(here)>=3
                  assert here[0] in ('ReplicatedStorage','ServerScriptService','StarterPlayer')
                  assert all(t.isidentifier() for t in here)
                  f=target/'src'/Path(*here).with_suffix(types[item.get('class')])
                  f.parent.mkdir(parents=True,exist_ok=True)
                  assert not f.exists()
                  f.write_text(src,encoding='utf-8')
                  raw=src.encode('utf-8')
                  d=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  manifest.append({'path':'/'.join(here),'kind':item.get('class'),'blob':d})
              for child in item.findall('Item'):walk(child,here)
          for item in root.findall('Item'):walk(item)
          assert len(manifest)==84
          assert len({x['path'] for x in manifest})==84
          (target/'manifest.json').write_text(json.dumps(manifest,indent=2))
          project={'name':'P0DActualSiegeBeastSolo7Armament84','tree':{'$className':'DataModel',
            'ReplicatedStorage':{'$className':'ReplicatedStorage',
              'TrapRaidersShared':{'$path':'src/ReplicatedStorage/TrapRaidersShared'}},
            'ServerScriptService':{'$className':'ServerScriptService',
              'TrapRaidersS1':{'$path':'src/ServerScriptService/TrapRaidersS1'}},
            'StarterPlayer':{'$className':'StarterPlayer',
              'StarterPlayerScripts':{'$path':'src/StarterPlayer/StarterPlayerScripts'}}}}
          (target/'default.project.json').write_text(json.dumps(project,indent=2))
          print('84_REAL_LUAU_PATH_CLASS_BLOB_MANIFEST_PREPARED')
          PY
      - name: Pinned Rojo 7.7.1 rebuild exact 84 class path and source GitBlob
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_trapper_84_rojo_release.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd84969e2ba2bb5693c4  /tmp/p0d_trapper_84_rojo_release.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/p0d_trapper_84_rojo_release.zip') as z:
              entries=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='rojo']
              assert len(entries)==1
              file=Path('/tmp/p0d_trapper_84_rojo_binary')
              file.write_bytes(z.read(entries[0]))
              file.chmod(0o755)
          PY
          /tmp/p0d_trapper_84_rojo_binary build /tmp/p0d_trapper_84_rojo/default.project.json -o /tmp/p0d_trapper_84_rojo_rebuilt.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import hashlib,json
          want=json.loads(Path('/tmp/p0d_trapper_84_rojo/manifest.json').read_text())
          root=ET.fromstring(Path('/tmp/p0d_trapper_84_rojo_rebuilt.rbxlx').read_bytes())
          got=[]
          def walk(n,prior=()):
              p=n.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=prior+((name,) if name else ())
              if src is not None:
                  raw=src.encode('utf-8')
                  d=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  got.append({'path':'/'.join(here),'kind':n.get('class'),'blob':d})
              for c in n.findall('Item'):walk(c,here)
          for item in root.findall('Item'):walk(item)
          assert len(got)==len(want)==84
          assert {x['path']:(x['kind'],x['blob']) for x in got}=={
              x['path']:(x['kind'],x['blob']) for x in want}
          print('REAL_TRAPPER_WARP_SEVEN_WEAPON_SIEGE_BEAST_SOLO_ROJO84_84_SOURCE_EXACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-QUALITY-TRAPPER-WARP-SIEGE-BEAST-SOLO-7WEAPONS-RC84-NOGO
          path: /tmp/P0D_TRAPPER_WARP_PRIVATE84.zip
          retention-days: 7
