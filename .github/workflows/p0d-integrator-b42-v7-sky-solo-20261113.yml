name: P0D RC integrator isolated B42 V7 SkyCastle Studio Solo actual Place
on:
  push:
    branches:
      - integration/p0d-b42-v7-skycastle-solo-preview-20261113-01
    paths:
      - 'handoffs/P0D-RC-B42V7-SKY-SOLO-20261113-01/**'
      - '.github/workflows/p0d-integrator-b42-v7-sky-solo-20261113.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-authority-private-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original rich H1 and Studio-audit source-lock 44 count
        shell: bash
        run: |
          set -euo pipefail
          python3 -B handoffs/P0D-B42-V7-SKYCASTLE-20261113-01/tests/test_skycastle_original.py
          python3 -B handoffs/P0D-FIRST90-MUSOUV7-UPGRADE-20261113-01/tests/test_upgrade.py
          python3 -B -m unittest discover -s handoffs/P0D-RC-B42V7-SKY-SOLO-20261113-01/tests -p 'test_*.py' -v
      - name: Checkout pinned upstream Luau source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_solo_upstream
          persist-credentials: false
          fetch-depth: 1
      - name: Build pinned native Luau compiler/runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_solo_upstream rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_solo_upstream -B /tmp/p0d_solo_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_solo_luau --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
      - name: Compile actual B42 42 plus solo and diagnostic = 44 Luau
        shell: bash
        run: |
          set -euo pipefail
          DIST=handoffs/P0D-RC-B42V7-SKY-SOLO-20261113-01/dist/EGG_RAID_RUMBLE_B42_V7_SKYCASTLE_SOLO_UNPUBLISHED
          n=0
          while IFS= read -r -d '' file; do
            /tmp/p0d_solo_luau/luau-compile "$file" > /tmp/luau_compile_out 2>&1 || { cat /tmp/luau_compile_out; exit 1; }
            n=$((n+1))
          done < <(find "$DIST/src" -name '*.luau' -type f -print0)
          test "$n" -eq 44
          echo P0D_B42_V7_SKYCASTLE_SOLO_AUDIT_NATIVE_44_OF_44_PASS
      - name: Execute original Studio solo policy in real pinned Luau CLI
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-RC-B42V7-SKY-SOLO-20261113-01
          mkdir -p /tmp/p0d-solo-artifacts
          python3 -B "$ROOT/tools/generate_native_studio_solo.py" --write /tmp/p0d-solo-artifacts/solo_native_qa.luau
          /tmp/p0d_solo_luau/luau-compile /tmp/p0d-solo-artifacts/solo_native_qa.luau >/dev/null
          /tmp/p0d_solo_luau/luau /tmp/p0d-solo-artifacts/solo_native_qa.luau | tee /tmp/p0d-solo-artifacts/NATIVE_SOLO_QA.txt
          grep -F 'P0D_S1_STUDIO_SOLO_LATCH_NATIVE_40_ASSERTIONS_PASS' /tmp/p0d-solo-artifacts/NATIVE_SOLO_QA.txt
      - name: Get official pinned Rojo v7.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_solo_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_solo_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import pathlib,zipfile,stat
          with zipfile.ZipFile('/tmp/p0d_solo_rojo.zip') as z:
              options=[x for x in z.namelist() if x.rsplit('/',1)[-1]=='rojo']
              assert len(options)==1
              p=pathlib.Path('/tmp/p0d_solo_rojo')
              p.write_bytes(z.read(options[0]))
              p.chmod(p.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_solo_rojo --version | grep -F '7.7.1'
      - name: Build genuine Studio private 44 script Place and audit presence
        shell: bash
        run: |
          set -euo pipefail
          DIST=handoffs/P0D-RC-B42V7-SKY-SOLO-20261113-01/dist/EGG_RAID_RUMBLE_B42_V7_SKYCASTLE_SOLO_UNPUBLISHED
          PLACE=/tmp/p0d-solo-artifacts/EGG_RAID_RUMBLE_B42_V7_SKYCASTLE_STUDIO_SOLO_PRIVATE.rbxlx
          /tmp/p0d_solo_rojo build "$DIST/default.project.json" -o "$PLACE"
          cp "$DIST/SOURCE_LOCK.json" /tmp/p0d-solo-artifacts/SOURCE_LOCK.json
          python3 - <<'PY'
          from collections import Counter
          import hashlib,json,pathlib,xml.etree.ElementTree as ET
          p=pathlib.Path('/tmp/p0d-solo-artifacts/EGG_RAID_RUMBLE_B42_V7_SKYCASTLE_STUDIO_SOLO_PRIVATE.rbxlx')
          d=pathlib.Path('handoffs/P0D-RC-B42V7-SKY-SOLO-20261113-01/dist/EGG_RAID_RUMBLE_B42_V7_SKYCASTLE_SOLO_UNPUBLISHED')
          originals=Counter(s.read_text('utf8') for s in (d/'src').rglob('*.luau'))
          embedded=Counter()
          kinds=Counter()
          names=Counter()
          for item in ET.fromstring(p.read_bytes()).iter('Item'):
              kind=item.get('class')
              if kind not in ('Script','LocalScript','ModuleScript'):continue
              code=item.find("./Properties/string[@name='Source']")
              if code is None:continue
              kinds[kind]+=1
              embedded[code.text or '']+=1
              name=item.find("./Properties/string[@name='Name']")
              if name is not None:names[(kind,name.text)]+=1
          assert embedded==originals and sum(embedded.values())==44,(len(embedded),len(originals))
          assert kinds=={'Script':2,'LocalScript':6,'ModuleScript':36},kinds
          assert names[('Script','Game')]==1
          assert names[('Script','H1FunWorld')]==1
          assert names[('ModuleScript','StudioSoloPreviewRules')]==1
          assert names[('LocalScript','P0DStudioTrialAudit')]==1
          assert any('[P0D_STUDIO_FUN_CHECK]' in src and
                     'EGG_CARRIED' in src and 'SCORE_CONFIRMED' in src
                     for src in embedded)
          lock=json.loads((d/'SOURCE_LOCK.json').read_text('utf8'))
          assert lock['unchanged_original_h1_scripts']==41 and lock['script_total']==44
          assert lock['official_rc_adopted'] is False and lock['published'] is False
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={'status':'RICH_B42_V7_SKYCASTLE_STUDIO_SOLO_ONLY',
            'source_44_of_44':True,'original_42_unchanged':41,
            'mapped_studio_readonly_diagnostic':True,
            'server_Game':1,'H1FunWorld':1,'first90_retained':True,
            'earned_evolution_retained':True,'actual_Studio_2client':'NOT_TESTED',
            'actual_Studio_1client':'NOT_TESTED','android':'NOT_TESTED',
            'owner_fun':'NOT_TESTED','official_rc_adopted':False,
            'published':False,'place_sha256':h}
          pathlib.Path('/tmp/p0d-solo-artifacts/PRIVATE_PLACE_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+"\n")
          print('P0D_B42_V7_SKYCASTLE_SOLO_AUDIT_ROJO_44_OF_44_PASS',h)
          PY
      - name: Upload only nonpublished review file and source proof
        uses: actions/upload-artifact@v4
        with:
          name: P0D-B42-V7-SKYCASTLE-LATCHED-SOLO-AUDIT-44-PRIVATE-PLACE
          path: |
            /tmp/p0d-solo-artifacts/EGG_RAID_RUMBLE_B42_V7_SKYCASTLE_STUDIO_SOLO_PRIVATE.rbxlx
            /tmp/p0d-solo-artifacts/SOURCE_LOCK.json
            /tmp/p0d-solo-artifacts/PRIVATE_PLACE_RECEIPT.json
            /tmp/p0d-solo-artifacts/NATIVE_SOLO_QA.txt
          retention-days: 7
          if-no-files-found: error
