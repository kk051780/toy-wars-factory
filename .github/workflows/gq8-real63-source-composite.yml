          gh run download 44397387116 --repo "$GITHUB_REPOSITORY" --name GQ822-REAL56-CURRENT-FORMAL55-COUNTER-PRIVATE-NOT-OFFICIAL --dir /tmp/gq863/counter56
          for file in \
            /tmp/gq863/base55/EGGRUMBLE_REAL55.project.json \
            /tmp/gq863/base55/B_REAL55_RECEIPT.json \
            /tmp/gq863/hud59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            /tmp/gq863/hud59/GQ828_REAL59_RECEIPT.json \
            /tmp/gq863/trade62/on62/GQ8_REAL62_OFFICIAL59_HUD_PLUS_TRADE_NO_GRANT.project.json \
            /tmp/gq863/trade62/B_REAL62_RECEIPT.json \
            /tmp/gq863/formal62/EGGRUMBLE_REAL62.rbxlx \
            /tmp/gq863/formal62/B_REAL62_RECEIPT.json \
            /tmp/gq863/formal63/EGGRUMBLE_REAL63_BASIC_DODGE_PRIVATE.rbxlx \
            /tmp/gq863/formal63/REAL63_RECEIPT.json \
            /tmp/gq863/viral56/EGGRUMBLE_REAL56.project.json \
            /tmp/gq863/viral56/GQ8_VIRAL56_RECEIPT.json \
            /tmp/gq863/counter56/GQ822_REAL56.project.json \
            /tmp/gq863/counter56/GQ822_REAL56_RECEIPT.json
          do test -s "$file" || { echo "RED_SOURCE_ARTIFACT_MISSING $file"; exit 1; }; done
      - name: Compose author64 intermediate then reconcile REAL65 with exact official63 Combat and HUD
        shell: bash
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq8_real63_intake_20261119/compose_real63.py \
            --base55 /tmp/gq863/base55/EGGRUMBLE_REAL55.project.json \
            --receipt55 /tmp/gq863/base55/B_REAL55_RECEIPT.json \
            --hud59 /tmp/gq863/hud59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            --hud-receipt /tmp/gq863/hud59/GQ828_REAL59_RECEIPT.json \
            --trade62 /tmp/gq863/trade62/on62/GQ8_REAL62_OFFICIAL59_HUD_PLUS_TRADE_NO_GRANT.project.json \
            --trade-receipt /tmp/gq863/trade62/B_REAL62_RECEIPT.json \
            --formal62 /tmp/gq863/formal62/EGGRUMBLE_REAL62.rbxlx \
            --formal62-receipt /tmp/gq863/formal62/B_REAL62_RECEIPT.json \
            --viral56 /tmp/gq863/viral56/EGGRUMBLE_REAL56.project.json \
            --viral-receipt /tmp/gq863/viral56/GQ8_VIRAL56_RECEIPT.json \
            --counter56 /tmp/gq863/counter56/GQ822_REAL56.project.json \
            --counter-receipt /tmp/gq863/counter56/GQ822_REAL56_RECEIPT.json \
            --out artifacts/real64
          python3 -B quality_gameplay/gq8_real63_intake_20261119/compose_real65.py \
            --real64 artifacts/real64/EGGRUMBLE_REAL64.project.json \
            --real64-receipt artifacts/real64/REAL64_INTAKE_RECEIPT.json \
            --real62-place /tmp/gq863/formal62/EGGRUMBLE_REAL62.rbxlx \
            --real63-place /tmp/gq863/formal63/EGGRUMBLE_REAL63_BASIC_DODGE_PRIVATE.rbxlx \
            --real63-receipt /tmp/gq863/formal63/REAL63_RECEIPT.json \
            --out artifacts/real65
          python3 - <<'PY'
          import json
          x=json.load(open('artifacts/real64/REAL64_INTAKE_RECEIPT.json'))
          assert x['selected_real_sources']==64 and x['preserved_current_real62_unchanged']==59
          assert x['new_sources']==9 and len(x['sources'])==64
          assert x['paid_trade'] is False and x['publish'] is False
          y=json.load(open('artifacts/real65/REAL65_INTAKE_RECEIPT.json'))
          assert y['new_selected_source_count']==65 and y['original_real63_byte_unchanged']==58
          assert y['preserves_real63_basic_attack'] and y['preserves_real63_dodge'] and y['preserves_real63_hud']
          assert y['preserves_real63_presentation'] and y['preserves_real63_round_epoch']
          assert y['official63_parent_original62_unchanged']==59
          assert len(y['sources'])==65 and not y['real_paid_trade'] and not y['roblox_publish']
          assert y['lobby_spawn_order_race_fenced'] and len(y['patched_existing_routes'])==5
          print('GQ8_REAL65_FORMAL63_PRESERVED_BASIC_DODGE_AND_COUNTER_VIRAL_SOURCE_STATIC_PASS')
          PY
      - name: Reuse immutable PR797 thunder-clear phase fence in actual REAL65
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gq8-author797
          gh api 'repos/kk051780/toy-wars-factory/contents/quality_gameplay/gq8_realm_storm_phase_fence_20261118/apply.py?ref=458d726fd0e335827e5c64d2c02c0f51fd37e512' --jq .content | base64 -d > /tmp/gq8-author797/apply.py
          test "$(git hash-object /tmp/gq8-author797/apply.py)" = e8665138825488256aaa0875c55b1c623d9887b8
          python3 -B quality_gameplay/gq8_real65_storm_port_20261119/compose_storm65.py \
            --project artifacts/real65/EGGRUMBLE_REAL65.project.json \
            --receipt artifacts/real65/REAL65_INTAKE_RECEIPT.json \
            --author-helper /tmp/gq8-author797/apply.py
          python3 - <<'PY'
