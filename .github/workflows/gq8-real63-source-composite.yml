        shell: bash
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq8_rc85_rc86_reconcile_20261119/port_rc86_wind65.py \
            --project artifacts/real65/EGGRUMBLE_REAL65.project.json \
            --receipt artifacts/real65/REAL65_INTAKE_RECEIPT.json
