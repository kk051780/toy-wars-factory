          doc=json.loads(Path('artifacts/real65/REAL65_INTAKE_RECEIPT.json').read_text())
          proof=doc['legacy_rc86_wind']
          assert doc['new_selected_source_count']==65 and proof['unchanged_other_sources']==64
          assert proof['new_remote_count']==0 and proof['new_damage_owner_count']==0
          assert proof['original_rc86_run']==43754858996 and proof['new_script_count']==0
