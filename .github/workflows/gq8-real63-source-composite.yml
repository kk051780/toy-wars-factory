          p=Path('artifacts/real65/EGGRUMBLE_REAL65.project.json')
          doc=json.loads(p.read_text())
          receipt=json.loads(Path('artifacts/real65/REAL65_INTAKE_RECEIPT.json').read_text())
          assert len(receipt['sources'])==65 and receipt['original_real63_byte_unchanged']==55
          assert len(receipt['patched_existing_routes'])==8
