          python3 quality_gameplay/gq8_rc85_rc86_reconcile_20261119/port_rc86_stage_reach_balance65.py --self-test
          python3 -m py_compile quality_gameplay/gq8_rc85_rc86_reconcile_20261119/port_starry_path66.py
          python3 quality_gameplay/gq8_rc85_rc86_reconcile_20261119/port_starry_path66.py --self-test
          python3 -m py_compile quality_gameplay/gq8_rc85_rc86_reconcile_20261119/port_meteor_shortcut66.py
          python3 quality_gameplay/gq8_rc85_rc86_reconcile_20261119/port_meteor_shortcut66.py --self-test
          python3 -m py_compile quality_gameplay/gq8_rc85_rc86_reconcile_20261119/port_rc86_egg_relay67.py
          python3 quality_gameplay/gq8_rc85_rc86_reconcile_20261119/port_rc86_egg_relay67.py --self-test
      - name: Verify the unique official head and original GREEN build runs and P0 Host fix class evidence
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)"
          if [ "$GITHUB_REF" = "refs/heads/rc/p0d-s1-kids-rc01" ]; then
            test "$CURRENT" = "$GITHUB_SHA" || { echo RED_OFFICIAL_HEAD_NOT_SAME_CI; exit 1; }
            test "$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_OFFICIAL...$GITHUB_SHA" --jq .status)" = ahead || { echo RED_OFFICIAL_NOT_VERIFIED_BASE_DESCENDANT; exit 1; }
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # The PR must be based on the actual current canonical RC, never a stale author SHA.
            PR_BASE="$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")"
            PR_HEAD="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")"
            test -n "$PR_BASE" && test -n "$PR_HEAD" && test "$CURRENT" = "$PR_BASE" || { echo RED_PR_BASE_NOT_LIVE_CANONICAL_RC; exit 1; }
            BASE_LINEAGE="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_OFFICIAL...$PR_BASE" --jq .status)"
            test "$BASE_LINEAGE" = ahead || test "$BASE_LINEAGE" = identical || { echo RED_PR_BASE_OLDER_OR_DIVERGENT; exit 1; }
            HEAD_LINEAGE="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PR_BASE...$PR_HEAD" --jq .status)"
            test "$HEAD_LINEAGE" = ahead || { echo RED_PR_HEAD_NOT_DESCENDANT_OF_LIVE_RC; exit 1; }
          else
            # Legacy branch CI is pinned to its immutable author base; do not silently rebase it.
            test "$CURRENT" = "$EXPECTED_OFFICIAL" || { echo RED_RC_HEAD_MOVED_RECONCILE_ALL_LANES; exit 1; }
          fi
          python3 - <<'PY'
          import json
          x=json.load(open('rc_fastlane/EGGRUMBLE_V3_REAL65.json'))
          assert x['source_profile']=='eggrumble_v3_real65' and x['source_count']==65
          assert x['pre_adoption_official_head']=='d52f2060dda81f0af6d1b143eee25fb416141602'
          assert x['parent_sources']==63 and x['existing_unchanged_real63']==58
          assert x['real63_parent_original62_unchanged']==59
          assert 'ReplicatedStorage/EGGRUMBLE_HudPresentationPolicy' in x['preserved_routes']
          assert x['host_class']=='Script'
          assert x['paid_trade_enabled'] is False and x['roblox_published'] is False
          print('GQ8_REAL65_OFFICIAL63_SOURCE_MANIFEST_PROVENANCE_PASS')
          PY
          for pair in \
            44393525211:a6020867fac80fa3b2ca47478625873fc6f3678e \
            44401178585:38d11f0bf311491ba76fe03f818948e5d4b06889 \
            44402402944:42ed8c45b4013c07ee171a6e7d772f074eed2be7 \
            44403496549:5a47e96f6b4766a9c59dd06b111bea53b73bd5ca \
            44404334603:b15db4b9ad1f1f4c1f02fb0976eb3c2f6db8a6ff \
            44413796990:d52f2060dda81f0af6d1b143eee25fb416141602 \
            44398710101:bdb0bac0cf8aab08c8984ce195b4ff99d3900e70 \
            44397387116:082d28901a680b546d9a7c253f7a01b68181f8a1
          do
            RUN="${pair%%:*}"; SHA="${pair#*:}"
            FOUND="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha+" "+.conclusion')"
            test "$FOUND" = "$SHA success" || { echo "RED_AUTHOR_RUN $RUN $FOUND"; exit 1; }
          done
          echo GQ8_PINNED_AUTHOR_RUNS_AND_NEW_CURRENT_OFFICIAL_REAL63_GREEN
      - name: Download only already-proven immutable original author source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gq863/{base55,hud59,trade62,formal62,formal63,viral56,counter56}
          gh run download 44393525211 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL55-CANONICAL-PRIVATE-STUDIO --dir /tmp/gq863/base55
          gh run download 44401178585 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL59-HUD-MAP-CANONICAL-PRIVATE-STUDIO --dir /tmp/gq863/hud59
