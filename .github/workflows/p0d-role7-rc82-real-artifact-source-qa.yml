name: P0D RC82 role7 original-author real artifact QA

on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - "handoffs/P0D-RC-SEVEN-JOBS-PVE-V1-20261114-01/tools/rc82_role7_ready_patch.py"
      - ".github/workflows/p0d-role7-rc82-real-artifact-source-qa.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  patch-real-rc82:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download the pinned genuine official RC82 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_rc82_base
          gh run download 43677046865 -R kk051780/toy-wars-factory \
            -n P0D-RC82-ROLE7-ASSASSIN-PRIVATE-MOBILE-STUDIO-SOURCE-NOGO \
            -D /tmp/p0d_rc82_base
          test -s /tmp/p0d_rc82_base/P0D_RC82_ASSASSIN_7JOB_PRIVATE_MOBILE_STUDIO.rbxlx
          test -s /tmp/p0d_rc82_base/SOURCE_LOCK.json
          test -s /tmp/p0d_rc82_base/RC_FEATURE_LOCK.json
          (cd /tmp/p0d_rc82_base && zip -q /tmp/p0d_rc82_parent.zip ./*)
      - name: Build ONLY modified Game and HUD sources from official RC82
        shell: bash
        run: |
          set -euo pipefail
          python3 handoffs/P0D-RC-SEVEN-JOBS-PVE-V1-20261114-01/tools/rc82_role7_ready_patch.py \
            /tmp/p0d_rc82_parent.zip /tmp/P0D_RC82_ROLE7_READY_PRIVATE_SOURCE_PATCH.zip \
            | tee /tmp/role7_rc82_receipt.log
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('/tmp/P0D_RC82_ROLE7_READY_PRIVATE_SOURCE_PATCH.zip') as z:
              receipt=json.loads(z.read('RECEIPT.json'))
              assert receipt['source_rc']=='d2f3ed1a47558fdaf07be0181c83c698bdb2ce34'
              assert receipt['scripts']==82 and receipt['unchanged_scripts']==80
              assert receipt['official_rc_write'] is False
              assert receipt['product']=='NO_GO'
              assert receipt['native_luau']=='NOT_RUN'
              assert receipt['studio']=='NOT_RUN'
          print('REAL_82_SOURCE_PRIVATE_QA_PASS_NOT_PRODUCT_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_role7_luau
          persist-credentials: false
      - name: Native Luau compile actual modified Game/HUD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_role7_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_role7_luau -B /tmp/p0d_role7_luau_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_role7_luau_build --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import zipfile,xml.etree.ElementTree as E
          from pathlib import Path
          with zipfile.ZipFile('/tmp/P0D_RC82_ROLE7_READY_PRIVATE_SOURCE_PATCH.zip') as z:
              root=E.fromstring(z.read('PRIVATE_ROLE7_READY_RC82.rbxlx'))
          scripts={}
          for item in root.iter('Item'):
              p=item.find('Properties')
              if p is None:continue
              n=p.find("./string[@name='Name']")
              s=p.find("./string[@name='Source']")
              if n is not None and s is not None and s.text is not None:
                  scripts[n.text]=s.text
          assert len(scripts)==82
          for name in ('Game','TrapRaidersHUD'):
              Path('/tmp/p0d_role7_'+name+'.luau').write_text(scripts[name],encoding='utf-8')
          PY
          /tmp/p0d_role7_luau_build/luau-compile /tmp/p0d_role7_Game.luau >/dev/null
          /tmp/p0d_role7_luau_build/luau-compile /tmp/p0d_role7_TrapRaidersHUD.luau >/dev/null
          echo 'P0D_RC82_ROLE7_NATIVE_GAME_HUD_2_OF_2_PASS'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-ROLE7-RC82-READY-ORIGINAL-AUTHOR-PATCH-NO-GO
          path: |
            /tmp/P0D_RC82_ROLE7_READY_PRIVATE_SOURCE_PATCH.zip
            /tmp/role7_rc82_receipt.log
          retention-days: 7
