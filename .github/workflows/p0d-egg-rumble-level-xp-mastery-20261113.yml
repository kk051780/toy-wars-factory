name: P0D EGG RAID RUMBLE original fair player/focus/collectible XP real native tests
on:
  push:
    branches:
      - feature/p0d-progression-xp-mastery-policy-20261113-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-progression-rules-only:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      ROOT: handoffs/P0D-PROGRESSION-XP-MASTERY-20261113-01
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout immutable original existing H1 and new standalone policy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Protect original Game H1 #275 hatch #279 vote #280 scout and official RC
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 'ff434ef814049ed06e32050ec2a896adb79df752^{commit}'
          test -z "$(git diff --name-only ff434ef814049ed06e32050ec2a896adb79df752 HEAD -- releases/P0D_S1_KIDS_RC01 handoffs/P0D-H1-COMPOSITE-20261113-01 handoffs/P0D-H1-MULTI-EGG-SCORE-INTEGRATED-20261113-01 handoffs/P0D-EGG-RUMBLE-REAL-SCOUT-20261113-01 handoffs/P0D-EGG-RUMBLE-DUAL-MODE-LOBBY-20261113)"
          test -f "$ROOT/src/ProgressionRules.luau"
          if grep -r -E 'RemoteEvent|FireServer|DataStoreService|MarketplaceService|TeleportService|TakeDamage' "$ROOT/src"; then
              echo 'PROGRESSION_MUST_HAVE_NO_GAME_REMOTE_OR_PAYMENT_AUTHORITY' >&2
              exit 1
          fi
      - name: Fetch exact pinned native Luau interpreter and compiler source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_level_native
          persist-credentials: false
          fetch-depth: 1
      - name: Compile pinned native Luau interpreter and compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_level_native rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_level_native -B /tmp/p0d_level_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_level_native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
      - name: Compile original server-compatible Luau progression rules
        shell: bash
        run: |
          set -euo pipefail
          /tmp/p0d_level_native/luau-compile "$ROOT/src/ProgressionRules.luau" >/dev/null
          echo 'P0D_LEVEL_ACTUAL_NATIVE_LUAU_SOURCE_COMPILE_PASS'
      - name: Execute real source native policy and reject ten intentional unsafe code mutants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_level_artifact
          python3 -B "$ROOT/tests/test_native_progression.py" --luau /tmp/p0d_level_native/luau | tee /tmp/p0d_level_artifact/ACTUAL_LEVEL_NATIVE_TEST_LOG.txt
          grep -E '^P0D_LEVEL_PROGRESSION_NATIVE_PASS_[0-9]+$' /tmp/p0d_level_artifact/ACTUAL_LEVEL_NATIVE_TEST_LOG.txt
          grep -F 'P0D_LEVEL_POLICY_UNSAFE_MUTANTS_PASS_10' /tmp/p0d_level_artifact/ACTUAL_LEVEL_NATIVE_TEST_LOG.txt
      - name: Preserve ACTUAL native rule logs only not a playable Roblox Place
        uses: actions/upload-artifact@v4
        with:
          name: P0D-LEVEL-XP-FOCUS-MASTERY-ORIGINAL-NATIVE-ONLY-NO-STUDIO
          path: /tmp/p0d_level_artifact/ACTUAL_LEVEL_NATIVE_TEST_LOG.txt
          retention-days: 7
          if-no-files-found: error
