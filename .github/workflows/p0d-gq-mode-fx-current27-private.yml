name: P0D GQ source-exact 26 author art score plus 1 FAIR helper private27
on:
  push:
    branches: [quality/p0d-gq-mode-fx-fairness-20261116]
    paths:
      - 'quality_gameplay/fx_mode_fairness/**'
      - '.github/workflows/p0d-gq-mode-fx-current27-private.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-26-plus-one:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original #482 pinned source checkout
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _v3_author
          persist-credentials: false
      - name: Original #484 quality AND composer checkout (do not recreate)
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 2aeb4fd856657c9298a2763d9204d0c9d9b031cb
          path: _v3_quality
          persist-credentials: false
      - name: Original #485 ART only checkout
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _v3_art
          persist-credentials: false
      - name: Original #487 SCORE only checkout
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _v3_score
          persist-credentials: false
      - name: Verify pinned source provenance, GQ owns no other original files
        run: |
          set -euo pipefail
          test "$(git -C _v3_author rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _v3_quality rev-parse HEAD)" = 2aeb4fd856657c9298a2763d9204d0c9d9b031cb
          test "$(git -C _v3_art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _v3_score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
          python3 -B -m unittest discover -s quality_gameplay/fx_mode_fairness/tests -p 'test_*.py' -v
      - name: Reuse the REAL ART author composer
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py             --target v3             --author-project _v3_author/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json             --out artifacts/GQ_LATEST_ART.project.json
      - name: Reuse the REAL #484 current26 composer, including AI walls, role and result
        run: |
          set -euo pipefail
          python3 _v3_quality/quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py             --author _v3_author --quality _v3_quality --art _v3_art --score _v3_score             --art-project artifacts/GQ_LATEST_ART.project.json             --out artifacts/EGGRUMBLE_GQ_CURRENT26_BASE.project.json
      - name: Strict overlay one SkillFX + one new FAIR module, preserve 25 original exact sources
        run: |
          set -euo pipefail
          python3 quality_gameplay/fx_mode_fairness/compose_mode_fair_on_current26.py             --base-project artifacts/EGGRUMBLE_GQ_CURRENT26_BASE.project.json             --base-receipt artifacts/SOURCE_RECEIPT.json             --original-skillfx _v3_author/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_SkillFX.luau             --overlay-skillfx quality_gameplay/fx_mode_fairness/EGGRUMBLE_SkillFX_ModeFair_Overlay.luau             --policy quality_gameplay/fx_mode_fairness/EGGRUMBLE_FXModeFairQuota.luau             --out artifacts/EGGRUMBLE_GQ_MODE_FAIR_CURRENT27.project.json
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau_fixed
          persist-credentials: false
      - name: Native Luau execute original fairness policy and compile all mapped 27
        run: |
          set -euo pipefail
          test "$(git -C _luau_fixed rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _luau_fixed -B /tmp/gq_fair27_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_fair27_luau --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          mkdir -p /tmp/gq_fair27_vm/tests
          cp quality_gameplay/fx_mode_fairness/EGGRUMBLE_FXModeFairQuota.luau /tmp/gq_fair27_vm/
          cp quality_gameplay/fx_mode_fairness/tests/EGGRUMBLE_FXModeFairQuota.spec.luau /tmp/gq_fair27_vm/tests/
          (cd /tmp/gq_fair27_vm/tests && /tmp/gq_fair27_luau/luau EGGRUMBLE_FXModeFairQuota.spec.luau) | tee artifacts/FAIR_NATIVE.log
          grep -q EGGRUMBLE_FX_MODE_FAIRNESS_NATIVE_PASS artifacts/FAIR_NATIVE.log
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          project=Path("artifacts/EGGRUMBLE_GQ_MODE_FAIR_CURRENT27.project.json")
          def walk(n):
              if isinstance(n,dict):
                  if "$path" in n:yield (project.parent/n["$path"]).resolve(strict=True)
                  else:
                      for name,v in n.items():
                          if not name.startswith("$"):yield from walk(v)
          mapped=list(walk(json.loads(project.read_text())["tree"]))
          assert len(mapped)==27 and len(set(mapped))==27
          for f in mapped:
              subprocess.run(["/tmp/gq_fair27_luau/luau-compile","--text",str(f)],check=True,stdout=subprocess.DEVNULL)
          print("EGGRUMBLE_MODE_FAIR_LATEST27_NATIVE_PASS")
          PY
      - name: Pinned checksum-locked Rojo private 27 Source Place
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_fair27_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_fair27_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq_fair27_rojo.zip') as z:
              names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(names)==1
              f=Path('/tmp/gq_fair27_rojo')
              f.write_bytes(z.read(names[0]))
              f.chmod(0o755)
          PY
          /tmp/gq_fair27_rojo build artifacts/EGGRUMBLE_GQ_MODE_FAIR_CURRENT27.project.json -o artifacts/EGGRUMBLE_GQ_MODE_FAIR_CURRENT27_PRIVATE.rbxlx
      - name: Verify real 27 Script classes, names, embedded exact source and hashes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,os,xml.etree.ElementTree as ET
          p=Path("artifacts/EGGRUMBLE_GQ_MODE_FAIR_CURRENT27.project.json")
          place=Path("artifacts/EGGRUMBLE_GQ_MODE_FAIR_CURRENT27_PRIVATE.rbxlx")
          receiptPath=Path("artifacts/SOURCE_FAIR_27_RECEIPT.json")
          receipt=json.loads(receiptPath.read_text(encoding="utf8"))
          exp={}
          def walk(n):
              for name,v in n.items():
                  if name.startswith("$") or not isinstance(v,dict):continue
                  if "$path" in v:
                      f=(p.parent/v["$path"]).resolve(strict=True)
                      kind="Script" if f.name.endswith(".server.luau") else ("LocalScript" if f.name.endswith(".client.luau") else "ModuleScript")
                      assert name not in exp
                      exp[name]=(kind,f.read_text(encoding="utf8").replace("\r\n","\n"))
                      assert receipt["source_27_sha256"][name]==hashlib.sha256(f.read_bytes()).hexdigest(),name
                  else:walk(v)
          walk(json.loads(p.read_text())["tree"])
          assert len(exp)==27
          actual={}
          for obj in ET.fromstring(place.read_bytes()).iter("Item"):
              kind=obj.attrib.get("class")
              if kind not in ("Script","LocalScript","ModuleScript"):continue
              props=obj.find("Properties")
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              source=props.findtext("ProtectedString[@name='Source']")
              if source is None:source=props.findtext("string[@name='Source']")
              assert name is not None and source is not None and name not in actual
              actual[name]=(kind,source.replace("\r\n","\n"))
          assert exp==actual,{"missing":sorted(set(exp)-set(actual)),"extra":sorted(set(actual)-set(exp)),
                         "mismatch":sorted(n for n in set(exp)&set(actual) if exp[n]!=actual[n])}
          receipt["immutable_candidate_head"]=os.environ["GITHUB_SHA"]
          receipt["private_place_sha256"]=hashlib.sha256(place.read_bytes()).hexdigest()
          receipt["private_place_bytes"]=place.stat().st_size
          receiptPath.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          print("EGGRUMBLE_MODE_FAIR_LATEST27_SOURCE_EXACT_PASS",receipt["private_place_bytes"],receipt["private_place_sha256"])
          PY
      - name: Archive only unpublished source exact candidate (no official RC)
        uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE-GQ-MODE-FAIR-LATEST27-PRIVATE-NO-RC
          path: |
            artifacts/EGGRUMBLE_GQ_MODE_FAIR_CURRENT27_PRIVATE.rbxlx
            artifacts/EGGRUMBLE_GQ_MODE_FAIR_CURRENT27.project.json
            artifacts/SOURCE_FAIR_27_RECEIPT.json
            artifacts/FAIR_NATIVE.log
          retention-days: 3
