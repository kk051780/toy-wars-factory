name: P0D Hatch Equip Scout Pure Policy
on:
  push:
    branches:
      - feature/p0d-hatch-equip-scout-pure-20261113-01
  workflow_dispatch:
jobs:
  source-policy-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua runtime binding
        run: python -m pip install --disable-pip-version-check lupa==2.6
      - name: Run real Lua-compatible policy tests
        run: python -m unittest discover -s handoffs/P0D-HATCH-EQUIP-SCOUT-20261113-01/tests -v
      - name: Confirm isolation and no paid/luck purchase API
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('handoffs/P0D-HATCH-EQUIP-SCOUT-20261113-01')
          src=(root/'src/RewardEquipRules.luau').read_text()
          assert 'return Rules' in src
          assert 'Random:Next' not in src
          assert all(x not in src for x in ('MarketplaceService','ProcessReceipt','RemoteEvent','DataStoreService','game:GetService','TeleportService'))
          print('POLICY_PURE_ISOLATED_NO_SHOP_NO_GAME_AUTHORITY')
          PY
