name: GQ470 REAL69 role motion and BASIC source-only PREP
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_role_motion_real69_20261121/**'
      - '.github/workflows/gq470-role-motion-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-exact-art-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download exact successful formal parent with raw API provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kk051780/toy-wars-factory
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          META="$RUNNER_TEMP/role-parent-api"
          mkdir -p "$META"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" > "$META/ref.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45106580546" > "$META/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45106580546/artifacts?per_page=100" > "$META/artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45106580546/jobs?per_page=100" > "$META/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14787568439/zip" > "$RUNNER_TEMP/role-parent.zip"
          python3 -B - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          lock=json.loads(Path("quality_gameplay/gq470_role_motion_real69_20261121/source_lock.json").read_text())
          archive=Path(os.environ["RUNNER_TEMP"])/"role-parent.zip"
          raw=archive.read_bytes()
          assert {"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}==lock["official_parent"]["artifact"]["zip"]
          target=Path(os.environ["RUNNER_TEMP"])/"real69-original"
          target.mkdir()
          with ZipFile(archive) as z:
              assert len(z.namelist())==len(set(z.namelist()))
              for item in z.infolist():
                  p=PurePosixPath(item.filename)
                  assert not p.is_absolute() and ".." not in p.parts
                  assert not stat.S_ISLNK(item.external_attr>>16)
              z.extractall(target)
          PY
          python3 -B quality_gameplay/gq470_role_motion_real69_20261121/gate.py --self-test
          python3 -B quality_gameplay/gq470_role_motion_real69_20261121/gate.py \
            --base "$RUNNER_TEMP/real69-original" --out "$RUNNER_TEMP/real69-motion" \
            --archive "$RUNNER_TEMP/role-parent.zip" --api-dir "$META"
          cp -R "$META" "$RUNNER_TEMP/real69-motion/PARENT_API_EVIDENCE"
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Build pinned Native Luau and verify pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B "$RUNNER_TEMP/role-native-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build "$RUNNER_TEMP/role-native-build" --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o "$RUNNER_TEMP/role-rojo.zip"
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $RUNNER_TEMP/role-rojo.zip" | sha256sum -c
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          root=Path(os.environ["RUNNER_TEMP"])
          with ZipFile(root/"role-rojo.zip") as z:
              names=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(names)==1
              dst=root/"role-rojo";dst.write_bytes(z.read(names[0]));dst.chmod(0o755)
          PY
      - name: Execute original21 and full-client20, baseline RED, compile138 and Rojo rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq470_role_motion_real69_20261121/gate.py \
            --verify "$RUNNER_TEMP/real69-motion" \
            --luau "$RUNNER_TEMP/role-native-build/luau" \
            --compiler "$RUNNER_TEMP/role-native-build/luau-compile" \
            --luau-source _pinned_luau --rojo "$RUNNER_TEMP/role-rojo"
      - name: Recheck current formal head and record actual candidate CI identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')" = 93a1147561a531610ac1609ebc68cc0ecf546623
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"real69-motion"
          report=json.loads((root/"ART_CHECK_REPORT_ROLE_MOTION.json").read_text())
          assert report["source_gate"]=="SOURCE_QA_PASS_NOT_ENGINE"
          assert report["formal_rc_adopted"] is False and report["art_gate"]=="NO_GO"
          report["candidate_ci"]={"repository":os.environ["GITHUB_REPOSITORY"],
              "head_sha":os.environ["CANDIDATE_HEAD"],"trigger_sha":os.environ["GITHUB_SHA"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "job_key":os.environ["GITHUB_JOB"],"status_at_report":"RUNNING_EXTERNAL_CONCLUSION_REQUIRED"}
          for path in (root/"ART_CHECK_REPORT_ROLE_MOTION.json",root/"B220_ONE_SOURCE_NOT_FORMAL/SOURCE_SELECT_MANIFEST.json"):
              path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-ROLE-MOTION-SOURCE-ONLY-NOT-FORMAL
          path: ${{ runner.temp }}/real69-motion/
          if-no-files-found: error
          retention-days: 14
