name: P0D #470 real solo AI neutral spectator target safety native82
on:
  push:
    branches: [feature/p0d-product-quality-gate-20261115]
    paths:
      - product_quality/private_solo_bot_target_safety.py
      - .github/workflows/p0d-quality-solo-bot-target-safety-native.yml
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - product_quality/private_solo_bot_target_safety.py
      - .github/workflows/p0d-quality-solo-bot-target-safety-native.yml
permissions:
  contents: read
  actions: read
jobs:
  actual-source-target-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin original-author source and already-tested solo bots + observer island
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_target_parent
          gh run download 43693926711 -R kk051780/toy-wars-factory \
            -n P0D-QUALITY-SOLO-BOTS-SAFE-SPECTATOR-CUMULATIVE-SOURCE-NOGO \
            -D /tmp/p0d_target_parent
          test -s /tmp/p0d_target_parent/P0D_SOLO_BOTS_SAFE_SPECTATOR_PRIVATE.zip
      - name: Apply genuine Game and SoloTeamBots neutral/spectator defensive guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -B product_quality/private_solo_bot_target_safety.py \
            --parent /tmp/p0d_target_parent/P0D_SOLO_BOTS_SAFE_SPECTATOR_PRIVATE.zip \
            --out /tmp/P0D_FB005_TARGET_SAFE.zip \
            --extract /tmp/p0d_target_safe_actual_luau
          python3 - <<'PY'
          import zipfile,json,sys
          from pathlib import Path
          sys.path.insert(0,'product_quality')
          from private_solo_bot_target_safety import patch,DAMAGE_BEFORE,DAMAGE_AFTER,FIND_BEFORE,FIND_AFTER
          for game,bot in (("", ""), (DAMAGE_BEFORE,FIND_BEFORE),
                           (DAMAGE_AFTER,FIND_AFTER),
                           (DAMAGE_BEFORE*2,FIND_BEFORE)):
              try: patch(game,bot)
              except (ValueError,AssertionError): pass
              else: raise AssertionError('SOURCE_OR_DUPLICATE_ANCHOR_ACCEPTED')
          with zipfile.ZipFile('/tmp/P0D_FB005_TARGET_SAFE.zip') as z:
              r=json.loads(z.read('RECEIPT.json'))
          assert r['scripts']==82 and r['unchanged_parent_scripts']==80
          assert r['egg_score_winner_source_exact'] and r['source_lock_exact']
          assert r['private_only'] and r['default_off'] and not r['official_rc_write']
          assert r['studio']=='NOT_RUN' and r['product']=='NO_GO'
          g=Path('/tmp/p0d_target_safe_actual_luau/Game.luau').read_text()
          b=Path('/tmp/p0d_target_safe_actual_luau/SoloTeamBots.luau').read_text()
          assert 'target:GetAttribute("P0D_LateJoinSpectator")==true' in g
          assert 'p:GetAttribute("P0D_LateJoinSpectator")~=true' in b
          assert 'team=="RED" or team=="BLUE"' in b
          assert 'callbacks.deposit(bot,bot.team,bot.carry)' in b
          assert len(list(Path('/tmp/p0d_target_safe_actual_luau').glob('*.luau')))==82
          print('REAL_SOLO_AI_NEUTRAL_TARGET_SOURCE_NEGATIVE_TEST_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_luau_pinned
          persist-credentials: false
      - name: Native compiler exact Game plus SoloTeamBots plus 80 other source bodies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_luau_pinned rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_luau_pinned -B /tmp/p0d_target_safe_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_target_safe_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' f; do
            /tmp/p0d_target_safe_build/luau-compile "$f" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_target_safe_actual_luau -name '*.luau' -type f -print0 | sort -z)
          test "$n" -eq 82
          echo "NATIVE_82_82_TARGET_SAFE_PASS_STUDIO_ANDROID_NOT_TESTED"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-QUALITY-REAL-SOLO-AI-TARGET-SAFE-82-NOGO
          path: /tmp/P0D_FB005_TARGET_SAFE.zip
          retention-days: 7
