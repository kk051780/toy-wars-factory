name: P0D GQ 494 501 533 one Swarm 29-source private
on:
  pull_request:
    paths:
      - 'quality_gameplay/neutral_melee_pressure_20261116/**'
      - '.github/workflows/p0d-gq-neutral-triple29-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  triple29-original-author-composite:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _v3_original
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 6b52eaf1f2725496277998fe0c5532b7a8fcaab5
          path: _v3_quality
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _v3_art
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _v3_score
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: af8cd79f4217d187429270d29e6d44eb01725ff2
          path: _v3_pacing
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 880e89baa428006699f1e6d6d95468473acaf866
          path: _v3_fair
          persist-credentials: false
      - name: Verify owner pins before private composition
        run: |
          set -euo pipefail
          test "$(git -C _v3_original rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _v3_quality rev-parse HEAD)" = 6b52eaf1f2725496277998fe0c5532b7a8fcaab5
          test "$(git -C _v3_art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _v3_score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
          test "$(git -C _v3_pacing rev-parse HEAD)" = af8cd79f4217d187429270d29e6d44eb01725ff2
          test "$(git -C _v3_fair rev-parse HEAD)" = 880e89baa428006699f1e6d6d95468473acaf866
      - name: All-eight-domain original author regressions (no duplicate tests)
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s _v3_quality/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests -p 'test_bot_*quality.py' -v
      - name: Compose original author 21 + ART/AI/SCORE26 (no duplicate)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py \
            --target v3 \
            --author-project _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json \
            --out artifacts/GQ_V3_29_ART_BASE.project.json
          python3 _v3_quality/quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py \
            --author _v3_original --quality _v3_quality --art _v3_art --score _v3_score \
            --art-project artifacts/GQ_V3_29_ART_BASE.project.json \
            --out artifacts/GQ_V3_29_BASE26.project.json
      - name: Reuse original 494+501 dual28 single-Swarm composer
        run: |
          set -euo pipefail
          python3 _v3_fair/quality_gameplay/neutral_encounters/tools/compose_dual28.py \
            --base26 artifacts/GQ_V3_29_BASE26.project.json \
            --original-swarm _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_SwarmCombat.luau \
            --pacing-composer _v3_pacing/quality_gameplay/neutral_pacing/tools/compose_private_v3.py \
            --pacing-policy _v3_pacing/quality_gameplay/neutral_pacing/EGGRUMBLE_NeutralSpawnPacing.luau \
            --fair-policy _v3_fair/quality_gameplay/neutral_encounters/EGGRUMBLE_NeutralEncounterFairness.luau \
            --out artifacts/GQ_V3_494_501_DUAL28.project.json
      - name: Reuse original 28 and append ONLY 533 melee with negative QA
        env:
          GQ_TRIPLE28_BASE: artifacts/GQ_V3_494_501_DUAL28.project.json
          GQ_TRIPLE_ORIGINAL_SWARM: _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_SwarmCombat.luau
        run: |
          set -euo pipefail
          python3 -B -m unittest discover \
            -s quality_gameplay/neutral_melee_pressure_20261116 -p 'test_*.py' -v
          python3 quality_gameplay/neutral_melee_pressure_20261116/compose_triple29.py \
            --base28 artifacts/GQ_V3_494_501_DUAL28.project.json \
            --original-swarm "$GQ_TRIPLE_ORIGINAL_SWARM" \
            --melee-policy quality_gameplay/neutral_melee_pressure_20261116/EGGRUMBLE_NeutralMeleePolicy.luau \
            --out artifacts/GQ_V3_TRIPLE29_PRIVATE.project.json
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau_fixed
          persist-credentials: false
      - name: Fixed native Luau compiler all 29 source + real policy VM
        run: |
          set -euo pipefail
          test "$(git -C _luau_fixed rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _luau_fixed -B /tmp/luau29 -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/luau29 --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          project=Path("artifacts/GQ_V3_TRIPLE29_PRIVATE.project.json").resolve()
          def walk(node):
              for name, child in node.items():
                  if name.startswith("$"): continue
                  if "$path" in child:
                      yield (project.parent/child["$path"]).resolve(strict=True)
                  else: yield from walk(child)
          scripts=list(walk(json.loads(project.read_text())["tree"]))
          assert len(scripts)==29
          for path in scripts:
              subprocess.run(["/tmp/luau29/luau-compile","--text",str(path)],
                             check=True,stdout=subprocess.DEVNULL)
          print("GQ_ALL_29_REAL_NATIVE_LUAU_SYNTAX_PASS")
          PY
          python3 quality_gameplay/neutral_melee_pressure_20261116/make_native_policy_harness.py \
            --out artifacts/melee_native29.luau
          /tmp/luau29/luau artifacts/melee_native29.luau | tee artifacts/MELEE_NATIVE29.log
          grep -q EGGRUMBLE_NEUTRAL_MELEE_PURE_POLICY_NATIVE_PASS artifacts/MELEE_NATIVE29.log
          python3 _v3_pacing/quality_gameplay/neutral_pacing/tools/build_native_harness.py --out artifacts/pacing_native29.luau
          python3 _v3_fair/quality_gameplay/neutral_encounters/tools/build_native_harness.py --out artifacts/fair_native29.luau
          /tmp/luau29/luau artifacts/pacing_native29.luau | tee artifacts/PACING_NATIVE29.log
          /tmp/luau29/luau artifacts/fair_native29.luau | tee artifacts/FAIR_NATIVE29.log
          grep -q NEUTRAL_PACING_NATIVE_PASS artifacts/PACING_NATIVE29.log
          grep -q NEUTRAL_ENCOUNTER_NATIVE artifacts/FAIR_NATIVE29.log
      - name: Rojo SHA-pinned 7.7.1 private Place 29 exact
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/rojo29.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/rojo29.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/rojo29.zip") as z:
              matches=[f for f in z.namelist() if f.split("/")[-1]=="rojo"]
              assert len(matches)==1
              p=Path("/tmp/rojo29");p.write_bytes(z.read(matches[0]));p.chmod(0o755)
          PY
          /tmp/rojo29 build artifacts/GQ_V3_TRIPLE29_PRIVATE.project.json -o artifacts/GQ_V3_TRIPLE29_PRIVATE.rbxlx
          python3 - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          project=Path("artifacts/GQ_V3_TRIPLE29_PRIVATE.project.json").resolve()
          receipt=json.loads(Path("artifacts/TRIPLE29_SOURCE_RECEIPT.json").read_text())
          def walk(node,out):
              for name,child in node.items():
                  if name.startswith("$"):continue
                  if "$path" in child:
                      path=(project.parent/child["$path"]).resolve(strict=True)
                      assert name not in out
                      cl=("Script" if path.name.endswith(".server.luau") else
                          "LocalScript" if path.name.endswith(".client.luau") else "ModuleScript")
                      out[name]=(cl,path.read_text(encoding="utf-8").replace("\r\n","\n"))
                      assert receipt["mapped_sha256"][("ServerScriptService/" if cl!="LocalScript" else "StarterPlayer/StarterPlayerScripts/")+name]==hashlib.sha256(path.read_bytes()).hexdigest()
                  else:walk(child,out)
          expected={}
          walk(json.loads(project.read_text())["tree"],expected)
          assert len(expected)==29
          actual={}
          place=Path("artifacts/GQ_V3_TRIPLE29_PRIVATE.rbxlx")
          for item in ET.fromstring(place.read_bytes()).iter("Item"):
              cl=item.attrib.get("class")
              if cl not in ("Script","LocalScript","ModuleScript"):continue
              props=item.find("Properties")
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              if name in actual:raise AssertionError("RED duplicate script "+name)
              body=props.findtext("ProtectedString[@name='Source']")
              if body is None:body=props.findtext("string[@name='Source']")
              assert body is not None,name
              actual[name]=(cl,body.replace("\r\n","\n"))
          assert expected==actual,("RED Place source/class mismatch",set(expected)^set(actual))
          assert receipt["preserved28_sources_exact"]==27
          assert receipt["total_count"]==29 and not receipt["official_rc_adopted"]
          print("PRIVATE_TRIPLE29_SOURCE_EXACT_29_29_PASS",place.stat().st_size,hashlib.sha256(place.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE-GQ-494-501-533-29-SOURCE-NO-RC
          retention-days: 3
          if-no-files-found: error
          path: |
            artifacts/GQ_V3_TRIPLE29_PRIVATE.rbxlx
            artifacts/GQ_V3_TRIPLE29_PRIVATE.project.json
            artifacts/TRIPLE29_SOURCE_RECEIPT.json
            artifacts/PACING_NATIVE29.log
            artifacts/FAIR_NATIVE29.log
            artifacts/MELEE_NATIVE29.log
      # GQ30_SOURCE_ADMISSION: reuse two other existing authors, no competing game code.
      - name: Read unchanged original #528 dual-mode shared neutral budget
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 6b29c50b6cc0b25192a121b2957497ede8b07f37
          path: _v3_budget
          persist-credentials: false
      - name: Read unchanged original #531 authoritative bot-human membership
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: e78bff41e70564d0b26578e3c3a85f4698e6110e
          path: _v3_member
          persist-credentials: false
      - name: Source-exact original 29 plus #528/#531 as 30, no cloned authors
        env:
          GQ_BASE29_PROJECT: artifacts/GQ_V3_TRIPLE29_PRIVATE.project.json
          GQ_AUTHOR528_COMPOSER: _v3_budget/quality_gameplay/gq_dual_mode_neutral_budget_20261116/tools/compose_private_v3.py
          GQ_AUTHOR531_COMPOSER: _v3_member/quality_gameplay/v3_bot_human_match_membership_20261116/compose.py
          GQ_AUTHOR528_POLICY: _v3_budget/quality_gameplay/gq_dual_mode_neutral_budget_20261116/EGGRUMBLE_DualModeNeutralBudget.luau
        run: |
          set -euo pipefail
          test "$(git -C _v3_budget rev-parse HEAD)" = 6b29c50b6cc0b25192a121b2957497ede8b07f37
          test "$(git -C _v3_member rev-parse HEAD)" = e78bff41e70564d0b26578e3c3a85f4698e6110e
          python3 -B -m unittest discover \
            -s quality_gameplay/neutral_melee_pressure_20261116 -p test_author_admission30.py -v
          python3 quality_gameplay/neutral_melee_pressure_20261116/compose_author_admission30.py \
            --base29 "$GQ_BASE29_PROJECT" \
            --author528 "$GQ_AUTHOR528_COMPOSER" --author531 "$GQ_AUTHOR531_COMPOSER" \
            --policy528 "$GQ_AUTHOR528_POLICY" \
            --out artifacts/GQ_V3_ORIGINAL_AUTHOR30_PRIVATE.project.json
      - name: Real native Luau 30 source + original #528 budget and #531 host/bot mutation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          project=Path("artifacts/GQ_V3_ORIGINAL_AUTHOR30_PRIVATE.project.json").resolve()
          receipt=json.loads((project.parent/"GQ_ADMISSION30_SOURCE_RECEIPT.json").read_text())
          def walk(node,prefix=()):
              for name,child in node.items():
                  if name.startswith("$"):continue
                  key=prefix+(name,)
                  if "$path" in child:
                      yield key,(project.parent/child["$path"]).resolve(strict=True)
                  else:yield from walk(child,key)
          scripts=list(walk(json.loads(project.read_text())["tree"]))
          assert len(scripts)==30
          for key,path in scripts:
              assert receipt["mapped_sha256"]["/".join(key)]==__import__('hashlib').sha256(path.read_bytes()).hexdigest(),key
              subprocess.run(["/tmp/luau29/luau-compile","--text",str(path)],check=True,stdout=subprocess.DEVNULL)
          print("GQ30_NATIVE_ALL_30_OF_30_PASS")
          budget=Path("_v3_budget/quality_gameplay/gq_dual_mode_neutral_budget_20261116/EGGRUMBLE_DualModeNeutralBudget.luau").read_text()
          cases=Path("_v3_budget/quality_gameplay/gq_dual_mode_neutral_budget_20261116/tests/budget_native_cases.luau").read_text()
          assert budget.rstrip().endswith("return Budget")
          Path("artifacts/GQ30_BUDGET_NATIVE.luau").write_text(budget[:budget.rfind("return Budget")]+cases)
          PY
          /tmp/luau29/luau artifacts/GQ30_BUDGET_NATIVE.luau | tee artifacts/GQ30_BUDGET_NATIVE.log
          grep -q GQ_DUAL_MODE_NEUTRAL_BUDGET_NATIVE_PASS artifacts/GQ30_BUDGET_NATIVE.log
          python3 _v3_member/quality_gameplay/v3_bot_human_match_membership_20261116/make_native_membership_harness.py \
            --patched-host artifacts/ADMISSION30_EGGRUMBLE_LobbyCastleModesPreview.server.luau --out artifacts/GQ30_HOST_NATIVE.luau
          /tmp/luau29/luau artifacts/GQ30_HOST_NATIVE.luau | tee artifacts/GQ30_HOST_NATIVE.log
          python3 _v3_member/quality_gameplay/v3_bot_human_match_membership_20261116/make_native_bot_hit_harness.py \
            --patched-host artifacts/ADMISSION30_EGGRUMBLE_LobbyCastleModesPreview.server.luau \
            --patched-bot artifacts/ADMISSION30_EGGRUMBLE_BotActors.luau --out artifacts/GQ30_BOT_NATIVE.luau
          /tmp/luau29/luau artifacts/GQ30_BOT_NATIVE.luau | tee artifacts/GQ30_BOT_NATIVE.log
          python3 _v3_member/quality_gameplay/v3_bot_human_match_membership_20261116/make_native_bot_hit_harness.py \
            --patched-host artifacts/ADMISSION30_EGGRUMBLE_LobbyCastleModesPreview.server.luau \
            --patched-bot artifacts/ADMISSION30_EGGRUMBLE_BotActors.luau --mutant \
            --out artifacts/GQ30_BOT_BROKEN_MUTANT.luau
          if /tmp/luau29/luau artifacts/GQ30_BOT_BROKEN_MUTANT.luau >/tmp/gq30_mutant.log 2>&1; then
            echo "RED MUTANT incorrectly passed"; exit 1
          fi
          echo "GQ30_STALE_HUMAN_HIT_MUTANT_REJECTED"
      - name: Original 30-source private Rojo class and source SHA exact
        run: |
          set -euo pipefail
          /tmp/rojo29 build artifacts/GQ_V3_ORIGINAL_AUTHOR30_PRIVATE.project.json \
            -o artifacts/GQ_V3_ORIGINAL_AUTHOR30_PRIVATE.rbxlx
          python3 - <<'PY'
          import json,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path("artifacts/GQ_V3_ORIGINAL_AUTHOR30_PRIVATE.project.json").resolve()
          receipt=json.loads((p.parent/"GQ_ADMISSION30_SOURCE_RECEIPT.json").read_text())
          expected={}
          def visit(node,prefix=()):
              for name,entry in node.items():
                  if name.startswith("$"):continue
                  key=prefix+(name,)
                  if "$path" in entry:
                      path=(p.parent/entry["$path"]).resolve(strict=True)
                      cl="Script" if path.name.endswith(".server.luau") else "LocalScript" if path.name.endswith(".client.luau") else "ModuleScript"
                      assert key not in expected
                      expected[key]=(cl,path.read_text(encoding="utf-8").replace("\r\n","\n"))
                      assert receipt["mapped_sha256"]["/".join(key)]==hashlib.sha256(path.read_bytes()).hexdigest()
                  else:visit(entry,key)
          visit(json.loads(p.read_text())["tree"])
          actual={}
          place=Path("artifacts/GQ_V3_ORIGINAL_AUTHOR30_PRIVATE.rbxlx")
          for it in ET.fromstring(place.read_bytes()).iter("Item"):
              cl=it.attrib.get("class")
              if cl not in ("Script","ModuleScript","LocalScript"):continue
              props=it.find("Properties")
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              assert name and name not in actual
              source=props.findtext("ProtectedString[@name='Source']")
              if source is None:source=props.findtext("string[@name='Source']")
              assert source is not None
              actual[name]=(cl,source.replace("\r\n","\n"))
          assert len(expected)==len(actual)==30
          assert {k[-1] for k in expected}==set(actual)
          for k,v in expected.items():assert actual[k[-1]]==v,k
          assert not receipt["rc_adopted"] and not receipt["studio_tested"]
          print("GQ30_PRIVATE_SOURCE_AND_CLASS_EXACT_PASS 30/30",place.stat().st_size,hashlib.sha256(place.read_bytes()).hexdigest())
          PY
      - name: Store only nonRC 30-source evidence (official branch unchanged)
        uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE-GQ-30-AUTHOR-SOURCE-INTAKE-NO-RC
          retention-days: 3
          if-no-files-found: error
          path: |
            artifacts/GQ_V3_ORIGINAL_AUTHOR30_PRIVATE.project.json
            artifacts/GQ_V3_ORIGINAL_AUTHOR30_PRIVATE.rbxlx
            artifacts/GQ_ADMISSION30_SOURCE_RECEIPT.json
            artifacts/GQ30_BUDGET_NATIVE.log
            artifacts/GQ30_HOST_NATIVE.log
            artifacts/GQ30_BOT_NATIVE.log
      - name: Release gates NOT asserted
        run: |
          echo 'Only source/native private Place. Original authors #482 #494 #501/#484, #218 CLAIM_GRANTED and authenticated #220 RC writer + actual Studio/Android/OWNER gates remain NOT_DONE.'
