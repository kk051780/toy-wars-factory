name: P0D GQ neutral second-target fallback private only
on:
  push:
    branches:
      - 'quality/gq-v3-neutral-target-fallback-20261116-01'
  pull_request:
    paths:
      - 'quality_gameplay/v3_neutral_target_fallback_20261116/**'
      - '.github/workflows/p0d-gq-neutral-target-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-fallback-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Real original #533 source negative and fallback regression
        run: |
          set -euo pipefail
          PYTHONPATH=quality_gameplay/v3_neutral_target_fallback_20261116 python3 -B -m unittest discover -s quality_gameplay/v3_neutral_target_fallback_20261116 -p 'test_*.py' -v
          python3 quality_gameplay/neutral_melee_pressure_20261116/compose_melee_candidate.py --out /tmp/gq-melee
          SRC=/tmp/gq-melee/EGGRUMBLE_SwarmCombat.luau
          SHA=$(sha256sum "$SRC" | cut -d ' ' -f1)
          python3 quality_gameplay/v3_neutral_target_fallback_20261116/compose_fallback.py --source "$SRC" --expected-sha256 "$SHA" --out /tmp/gq-melee/SwarmFallback.luau
          test -s /tmp/gq-melee/SwarmFallback.luau
      - name: Compile genuine patched owner Swarm with native Luau
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/gq-luau
          cmake -S /tmp/gq-luau -B /tmp/gq-luau/build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build /tmp/gq-luau/build --target Luau.Compile.CLI -j 4
          /tmp/gq-luau/build/luau-compile /tmp/gq-melee/SwarmFallback.luau >/dev/null
          /tmp/gq-luau/build/luau-compile /tmp/gq-melee/EGGRUMBLE_NeutralMeleePolicy.luau >/dev/null
      - name: Build exact unpublished Rojo 22-source Place with ONE patched Swarm
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/gq-melee')
          original=json.loads((root/'EGGRUMBLE_GQ_NEUTRAL_MELEE.project.json').read_text())
          original['name']='GQ_V3_NEUTRAL_FALLBACK_PRIVATE_NOT_RC'
          original['tree']['ServerScriptService']['EGGRUMBLE_SwarmCombat']['$path']='SwarmFallback.luau'
          (root/'fallback.project.json').write_text(json.dumps(original,indent=2)+'\n')
          PY
          curl -fLsS https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq-rojo.zip
          mkdir -p /tmp/gq-rojo
          unzip -q /tmp/gq-rojo.zip -d /tmp/gq-rojo
          chmod +x /tmp/gq-rojo/rojo
          /tmp/gq-rojo/rojo build /tmp/gq-melee/fallback.project.json -o /tmp/gq-melee/NEUTRAL_FALLBACK_PRIVATE_NOT_RC.rbxlx
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          folder=pathlib.Path('/tmp/gq-melee')
          project=json.loads((folder/'fallback.project.json').read_text())['tree']
          expected={}
          def walk(node):
              for k,v in node.items():
                  if isinstance(v,dict):
                      if '$path' in v:
                          expected[k]=(folder/v['$path']).read_text(encoding='utf-8')
                      else:walk(v)
          walk(project)
          actual={}
          root=ET.parse(folder/'NEUTRAL_FALLBACK_PRIVATE_NOT_RC.rbxlx').getroot()
          for item in root.iter('Item'):
              if item.get('class') not in {'Script','ModuleScript','LocalScript'}:continue
              props=item.find('Properties')
              if props is None:continue
              obj={p.get('name'):p.text or '' for p in props}
              if obj.get('Name'):actual[obj['Name']]=obj.get('Source','')
          assert len(expected)==22 and len(actual)==22,(len(expected),len(actual))
          assert expected==actual,'RED Rojo class/source parity failed'
          assert 'local inRange={}' in actual['EGGRUMBLE_SwarmCombat']
          print('PRIVATE_NATIVE_ROJO_EXACT_22_OF_22_PASS')
          PY
      - name: Never claim an official RC or engine pass
        run: echo "PRIVATE SOURCE/native/Rojo only; formal RC/Studio/Android/OWNER are NOT verified"
