name: P0D private RC 26-source empty-match repair
on:
  pull_request:
    paths:
      - "cross_domain_gate/repair_empty_match.py"
      - "cross_domain_gate/test_repair_empty_match.py"
      - ".github/workflows/p0d-cross-domain-private26.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-private-26:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned GQ composer PR484 (read-only)
        uses: actions/checkout@v4
        with:
          ref: bc7fdd9e392530d5264b595783ebd3da0d909305
          path: _gq_original
          persist-credentials: false
      - name: Read pinned original author PR482
        uses: actions/checkout@v4
        with:
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _v3_original
          persist-credentials: false
      - name: Read pinned ART owner PR485
        uses: actions/checkout@v4
        with:
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _v3_art
          persist-credentials: false
      - name: Read pinned SCORE owner PR487
        uses: actions/checkout@v4
        with:
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _v3_score
          persist-credentials: false
      - name: Verify all four input HEADs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _gq_original rev-parse HEAD)" = bc7fdd9e392530d5264b595783ebd3da0d909305
          test "$(git -C _v3_original rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _v3_art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _v3_score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
      - name: Source patch unit regressions (not Studio)
        run: python3 -B -m unittest discover -s cross_domain_gate -p 'test_*.py' -v
      - name: Compose owners' actual 26-source current V3 candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py \
            --target v3 \
            --author-project _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json \
            --out artifacts/GQ_V3_LATEST_ART.project.json
          python3 _gq_original/quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py \
            --author _v3_original --quality _gq_original --art _v3_art --score _v3_score \
            --art-project artifacts/GQ_V3_LATEST_ART.project.json \
            --out artifacts/EGGRUMBLE_V3_GQ_26.project.json
      - name: Patch ONLY generated host: last-human abandoned match recovery
        run: |
          python3 cross_domain_gate/repair_empty_match.py \
            --host artifacts/EGGRUMBLE_LobbyCastleModesPreview.server.luau \
            --receipt artifacts/SOURCE_RECEIPT.json
      - name: Build pinned native Luau parser
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau_fixed
          persist-credentials: false
      - name: Parse every embedded game/ART/SCORE/client script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _luau_fixed rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _luau_fixed -B /tmp/gq_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          project=Path("artifacts/EGGRUMBLE_V3_GQ_26.project.json").resolve()
          tree=json.loads(project.read_text())["tree"]
          receipt=json.loads(Path("artifacts/SOURCE_RECEIPT.json").read_text())
          def walk(node):
              if isinstance(node,dict):
                  if "$path" in node:yield (project.parent/node["$path"]).resolve(strict=True)
                  else:
                      for key,v in node.items():
                          if not key.startswith("$"):yield from walk(v)
          sources=list(walk(tree))
          assert len(sources)==26,len(sources)
          for p in sources:
              subprocess.run(["/tmp/gq_luau/luau-compile","--text",str(p)],check=True,stdout=subprocess.DEVNULL)
          print("NATIVE_26_OF_26_PASS")
          assert receipt["abandon_fix"]["issue"]=="LAST_HUMAN_ACTIVE_MATCH_NOT_CLOSED"
          PY
      - name: Build private Rojo Place, never publish
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq_rojo.zip") as z:
              matches=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(matches)==1
              Path("/tmp/gq_rojo").write_bytes(z.read(matches[0]))
              Path("/tmp/gq_rojo").chmod(0o755)
          PY
          /tmp/gq_rojo build artifacts/EGGRUMBLE_V3_GQ_26.project.json -o artifacts/EGGRUMBLE_PRIVATE_GQ26_EMPTYMATCH_REPAIRED.rbxlx
      - name: Source exactness (all 26 original scripts present, only host patched)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          project=Path("artifacts/EGGRUMBLE_V3_GQ_26.project.json").resolve()
          place=Path("artifacts/EGGRUMBLE_PRIVATE_GQ26_EMPTYMATCH_REPAIRED.rbxlx")
          rec=json.loads(Path("artifacts/SOURCE_RECEIPT.json").read_text())
          tree=json.loads(project.read_text())["tree"]
          expected={}
          def walk(node):
              for name,child in node.items():
                  if name.startswith("$") or not isinstance(child,dict):continue
                  if "$path" in child:
                      path=(project.parent/child["$path"]).resolve(strict=True)
                      kind="Script" if path.name.endswith(".server.luau") else ("LocalScript" if path.name.endswith(".client.luau") else "ModuleScript")
                      assert name not in expected
                      data=path.read_text().replace("\r\n","\n")
                      expected[name]=(kind,data)
                      assert rec["source_sha256"][name]==hashlib.sha256(path.read_bytes()).hexdigest(),name
                  else:walk(child)
          walk(tree)
          assert len(expected)==26
          actual={}
          for item in ET.fromstring(place.read_bytes()).iter("Item"):
              kind=item.attrib.get("class")
              if kind not in ("Script","LocalScript","ModuleScript"):continue
              props=item.find("Properties")
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              assert name not in actual
              data=props.findtext("ProtectedString[@name='Source']")
              if data is None:data=props.findtext("string[@name='Source']")
              assert data is not None,name
              actual[name]=(kind,data.replace("\r\n","\n"))
          assert actual==expected,{"missing":sorted(set(expected)-set(actual)),"extra":sorted(set(actual)-set(expected)),
                                    "modified":[name for name in set(expected)&set(actual) if expected[name]!=actual[name]]}
          h=hashlib.sha256(place.read_bytes()).hexdigest()
          rec["place_sha256"]=h
          rec["place_bytes"]=place.stat().st_size
          Path("artifacts/SOURCE_RECEIPT.json").write_text(json.dumps(rec,indent=2)+"\n")
          print("GQ_PRIVATE_26_SOURCE_EXACT_PASS",h)
          PY
      - name: Upload unpublished repaired RC candidate (no Studio proof)
        uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE_GQ26_EMPTYMATCH_RECOVERY_PRIVATE_NO_RC
          path: |
            artifacts/EGGRUMBLE_PRIVATE_GQ26_EMPTYMATCH_REPAIRED.rbxlx
            artifacts/SOURCE_RECEIPT.json
          retention-days: 3
