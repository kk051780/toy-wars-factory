name: P0D GQ ITEM current26 original composer source-exact private Place
on:
  pull_request:
    paths:
      - 'handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_FieldItemPickups.luau'
      - 'handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tools/compose_item26_overlay.py'
      - 'handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tools/make_native_field_item_harness.py'
      - '.github/workflows/p0d-eggrumble-gq-item-current26-source-exact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current26-original-item:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact proposed item HEAD, without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout fixed #482 original game
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _v3_original
          persist-credentials: false
      - name: Checkout fixed already-green #484 source composer
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 81088f99b2ea60bbffc0eaa860c46338203f0808
          path: _v3_quality
          persist-credentials: false
      - name: Checkout original #485 ART
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _v3_art
          persist-credentials: false
      - name: Checkout original #487 SCORE
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _v3_score
          persist-credentials: false
      - name: Verify exact immutable source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C _v3_original rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _v3_quality rev-parse HEAD)" = 81088f99b2ea60bbffc0eaa860c46338203f0808
          test "$(git -C _v3_art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _v3_score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
      - name: Reuse original artist + #484 current26 composer, no duplicate game source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py \
            --target v3 \
            --author-project _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json \
            --out artifacts/GQ_V3_LATEST_ART.project.json
          python3 _v3_quality/quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py \
            --author _v3_original --quality _v3_quality --art _v3_art --score _v3_score \
            --art-project artifacts/GQ_V3_LATEST_ART.project.json \
            --out artifacts/EGGRUMBLE_BASE26.project.json
      - name: One-item source-selective overlay and 25/25 unchanged provenance
        shell: bash
        run: |
          set -euo pipefail
          root=handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116
          python3 "$root/tools/compose_item26_overlay.py" prepare \
            --project artifacts/EGGRUMBLE_BASE26.project.json \
            --out artifacts/EGGRUMBLE_ITEM26.project.json \
            --item "$root/EGGRUMBLE_FieldItemPickups.luau" \
            --receipt artifacts/SOURCE_RECEIPT.json \
            --item-head "$(git rev-parse HEAD)" \
            --quality-head 81088f99b2ea60bbffc0eaa860c46338203f0808 \
            --author-head fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
      - name: Acquire pinned native Luau VM and compiler
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau_fixed
          persist-credentials: false
      - name: Compile all 26 embedded sources and execute actual original ITEM VM
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _luau_fixed rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _luau_fixed -B /tmp/item26_luau -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/item26_luau --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          root=handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116
          python3 "$root/tools/compose_item26_overlay.py" compile \
            --project artifacts/EGGRUMBLE_ITEM26.project.json \
            --compiler /tmp/item26_luau/luau-compile
          python3 "$root/tools/make_native_field_item_harness.py" \
            --out /tmp/item26_original_item_vm.luau
          /tmp/item26_luau/luau /tmp/item26_original_item_vm.luau | tee artifacts/ITEM_NATIVE.log
          grep -q 'EGGRUMBLE ORIGINAL ITEM + ORIGINAL GUARD VM' artifacts/ITEM_NATIVE.log
      - name: Pin Rojo v7.7.1 checksum and produce single private 26-script Place
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            -o /tmp/item26_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/item26_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/item26_rojo.zip') as z:
              names=[p for p in z.namelist() if p.split('/')[-1]=='rojo']
              assert len(names)==1
              f=Path('/tmp/item26_rojo')
              f.write_bytes(z.read(names[0]))
              f.chmod(0o755)
          PY
          /tmp/item26_rojo build artifacts/EGGRUMBLE_ITEM26.project.json \
            -o artifacts/EGGRUMBLE_ITEM26_PRIVATE_NO_RC.rbxlx
      - name: Validate all 26 embedded script bytes and final Place hash
        shell: bash
        run: |
          set -euo pipefail
          python3 handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tools/compose_item26_overlay.py verify \
            --project artifacts/EGGRUMBLE_ITEM26.project.json \
            --place artifacts/EGGRUMBLE_ITEM26_PRIVATE_NO_RC.rbxlx \
            --receipt artifacts/SOURCE_RECEIPT.json
          echo "SOURCE_ONLY_PRIVATE_NO_RC; STUDIO_ANDROID_FUN_OWNER_NOT_TESTED"
      - name: Upload nonpublic 26-source candidate only (no RC write or publish)
        uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE_ITEM26_GQ_PRIVATE_SOURCE_EXACT_NOT_RC
          path: |
            artifacts/EGGRUMBLE_ITEM26_PRIVATE_NO_RC.rbxlx
            artifacts/EGGRUMBLE_ITEM26.project.json
            artifacts/SOURCE_RECEIPT.json
            artifacts/ITEM_NATIVE.log
          retention-days: 3
