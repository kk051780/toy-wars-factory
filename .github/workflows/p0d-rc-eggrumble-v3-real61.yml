name: P0D V3 Real61 composite ON61 OFF55
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths: ['rc_fastlane/EGGRUMBLE_V3_REAL61.json', '.github/workflows/p0d-rc-eggrumble-v3-real61.yml']
  push:
    branches: [rc/p0d-s1-kids-rc01]
    paths: ['rc_fastlane/EGGRUMBLE_V3_REAL61.json', '.github/workflows/p0d-rc-eggrumble-v3-real61.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-rojo-real61:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin 6 original source locks and parent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path("rc_fastlane/EGGRUMBLE_V3_REAL61.json").read_text())
          assert m["source_count"]==61 and len(m["source_locks"])==6
          for path,sha in m["source_locks"].items():
            assert subprocess.check_output(["git","hash-object",path],text=True).strip()==sha
          print("REAL61_SIX_SOURCE_LOCKS_PASS")
          PY
          RC="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$RC" = a6020867fac80fa3b2ca47478625873fc6f3678e || { echo RED_STALE_PARENT;exit 1; }
          else
            test "$RC" = "$GITHUB_SHA" || { echo RED_HEAD_MOVED;exit 1; }
          fi
          E="$(gh run view 44393525211 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')"
          test "$E" = "a6020867fac80fa3b2ca47478625873fc6f3678e success"
          mkdir -p artifacts/original
          gh run download 44393525211 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL55-CANONICAL-PRIVATE-STUDIO --dir artifacts/original
          python3 -B quality_gameplay/gq8_real61_composite_20261119/compose_real61.py --place artifacts/original/EGGRUMBLE_REAL55.rbxlx --receipt artifacts/original/B_REAL55_RECEIPT.json --out artifacts/composite
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau
          persist-credentials: false
      - name: Compile 61 selected sources and 55 rollback sources with native Luau
        run: |
          set -euo pipefail
          cmake -S _luau -B /tmp/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          for d in artifacts/composite/on61/sources artifacts/composite/off55/sources; do
            for f in "$d"/*.luau; do /tmp/native/luau-compile --text "$f" >/dev/null; done
          done
          /tmp/native/luau quality_gameplay/gq8_trade_ux_journal_20261119/test_journal_native.luau | tee /tmp/trade.log
          grep -q GQ8_TRADE_JOURNAL_NATIVE_ORDER_REPLAY_RECOVERY_SESSION_LOCK_CONTRACT_PASS /tmp/trade.log
          python3 -B handoffs/EGGRUMBLE-HUD-INTEL-20261119/make_native_hud_intel.py --out /tmp/probes
          /tmp/native/luau /tmp/probes/good.luau | tee /tmp/hud.log
          grep -q GQ8_HUD_INTEL_NATIVE_LAYOUT_STATUS_FOG_7ROLE_PRIVACY_PASS /tmp/hud.log
      - name: Rojo source/class61 and rollback OFF55
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile("/tmp/rojo.zip") as z:
            hits=[p for p in z.namelist() if p.split("/")[-1]=="rojo"]
            assert len(hits)==1
            p=Path("/tmp/rojo");p.write_bytes(z.read(hits[0]));p.chmod(0o755)
          PY
          /tmp/rojo build artifacts/composite/on61/REAL61_HUD_TRADE.project.json -o artifacts/composite/EGGRUMBLE_REAL61.rbxlx
          /tmp/rojo build artifacts/composite/off55/REAL61_OFF55.project.json -o artifacts/composite/OFF55.rbxlx
          cmp artifacts/composite/OFF55.rbxlx artifacts/original/EGGRUMBLE_REAL55.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project artifacts/composite/on61/REAL61_HUD_TRADE.project.json --place artifacts/composite/EGGRUMBLE_REAL61.rbxlx --count 61
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project artifacts/composite/off55/REAL61_OFF55.project.json --place artifacts/composite/OFF55.rbxlx --count 55
          RC="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$RC" = a6020867fac80fa3b2ca47478625873fc6f3678e
          else
            test "$RC" = "$GITHUB_SHA"
          fi
          echo REAL61_TRUE_SOURCE_NATIVE_ROJO_OFF55_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: P0D-EGGRUMBLE-V3-REAL61-HUD-TRADE-PRIVATE-STUDIO
          path: |
            artifacts/composite/EGGRUMBLE_REAL61.rbxlx
            artifacts/composite/OFF55.rbxlx
            artifacts/composite/B_REAL61_RECEIPT.json
          retention-days: 5
          if-no-files-found: error
