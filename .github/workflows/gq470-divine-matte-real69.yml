name: GQ470 REAL69 divine mantle matte 6-Part A PREP
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_divine_matte_real69_20261121/**'
      - '.github/workflows/gq470-divine-matte-real69.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-locked-guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: e80973c354f14a0d0088577f3cc1a875454f0f8f
      SCRIPT: quality_gameplay/gq470_divine_matte_real69_20261121/patch.py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin official RC and download original actual REAL69
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$BASE" || { echo RED_STALE_RC; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44695199140" --jq '.head_sha+" "+.conclusion')" = "$BASE success" || { echo RED_ORIGINAL_RUN; exit 1; }
          mkdir -p "$RUNNER_TEMP/off69"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO \
            --dir "$RUNNER_TEMP/off69"
          test -f "$RUNNER_TEMP/off69/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
      - name: Exact source-lock 69 and six negative mutants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$SCRIPT"
          python3 -B "$SCRIPT" --base "$RUNNER_TEMP/off69" --self-test
          python3 -B "$SCRIPT" --base "$RUNNER_TEMP/off69" --output "$RUNNER_TEMP/on69"
          mkdir -p "$RUNNER_TEMP/packet/selected_sources/ServerScriptService"
          cp "$RUNNER_TEMP/on69/sources/ServerScriptService/EGGRUMBLE_DivineMantle.luau" \
            "$RUNNER_TEMP/packet/selected_sources/ServerScriptService/"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          rel='sources/ServerScriptService/EGGRUMBLE_DivineMantle.luau'
          old=(p/'off69'/rel).read_bytes()
          new=(p/'on69'/rel).read_bytes()
          d=lambda b: hashlib.sha256(b).hexdigest()
          meta={'feature':'GQ470_DIVINE_MANTLE_LOW_GLARE_MATTE_REAL69_20261121',
                'base_rc':'e80973c354f14a0d0088577f3cc1a875454f0f8f',
                'selected_route':'ServerScriptService/EGGRUMBLE_DivineMantle',
                'class':'ModuleScript','selected_changes':1,'unchanged_selected':68,
                'source_sha256_old':d(old),'source_sha256_new':d(new),
                'new_parts':0,'formal_rc_changed':False,
                'studio':'NOT_TESTED','android':'NOT_TESTED','human_art':'NOT_TESTED'}
          (p/'packet/SOURCE_SELECT_MANIFEST.json').write_text(json.dumps(meta,indent=2))
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau_divine
          persist-credentials: false
      - name: Native Luau compile exact original ON and OFF 69 sources
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _luau_divine -B /tmp/gq470-divine-luau -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-divine-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import os,subprocess,json
          from pathlib import Path
          for stage in ('off69','on69'):
            root=Path(os.environ['RUNNER_TEMP'])/stage
            project=json.loads((root/'EGGRUMBLE_REAL69.project.json').read_text())
            paths=[]
            def walk(node):
              if not isinstance(node,dict):return
              if '$path' in node: paths.append(root/node['$path'])
              for k,v in node.items():
                if not k.startswith('$'):walk(v)
            walk(project['tree'])
            assert len(paths)==69
            for p in paths:
              r=subprocess.run(['/tmp/gq470-divine-luau/luau-compile','--text',str(p)],capture_output=True)
              assert r.returncode==0,(stage,str(p),r.stderr[-300:].decode('utf-8',errors='replace'))
          print('NATIVE_ORIGINAL69_PLUS_CANDIDATE69_PASS_SOURCE_ONLY')
          PY
      - name: Pinned Rojo candidate Place and OFF original byte exact
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-divine-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-divine-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/gq470-divine-rojo.zip') as z:
            selected=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='rojo']
            assert len(selected)==1
            p=Path('/tmp/gq470-divine-rojo')
            p.write_bytes(z.read(selected[0]));p.chmod(0o755)
          PY
          /tmp/gq470-divine-rojo build "$RUNNER_TEMP/on69/EGGRUMBLE_REAL69.project.json" -o "$RUNNER_TEMP/packet/DIVINE_MATTE_CANDIDATE_NOT_FORMAL.rbxlx"
          /tmp/gq470-divine-rojo build "$RUNNER_TEMP/off69/EGGRUMBLE_REAL69.project.json" -o "$RUNNER_TEMP/packet/ORIGINAL_OFF69.rbxlx"
          cmp "$RUNNER_TEMP/off69/EGGRUMBLE_REAL69_PRIVATE.rbxlx" "$RUNNER_TEMP/packet/ORIGINAL_OFF69.rbxlx"
          echo ROJO_ON69_OFF69_ORIGINAL_BYTE_EXACT_PASS_SOURCE_ONLY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-DIVINE-MATTE-B220-NOT-FORMAL
          path: ${{ runner.temp }}/packet/
          retention-days: 7
