name: P0D GQ current V3 author plus ART SCORE 26-source private build
on:
  push:
    branches:
      - 'quality/eggrumble-v3-spatial-bot-intake-20261116'
    paths:
      - '.github/workflows/p0d-eggrumble-gq-current26-private.yml'
      - 'quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/**'
      - 'handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/**'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  current26-private-place:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout original quality fixes and composer, no RC writes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read fixed latest game SOURCE from original author PR482
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _v3_original
          persist-credentials: false
      - name: Read fixed original ART source from PR485
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _v3_art
          persist-credentials: false
      - name: Read fixed original SCORE source from PR487
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _v3_score
          persist-credentials: false
      - name: Confirm immutable author heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _v3_original rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _v3_art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _v3_score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
          echo "SOURCE_HEADS_PINNED"
      - name: Original author game, ART, and GQ source regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -v -s _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests -p 'test_*.py'
          python3 -B -m unittest discover -v -s _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tests -p 'test_*.py'
          python3 -B -m unittest discover -v -s handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests -p 'test_bot_*quality.py'
      - name: Compose original ART through artist's OWN tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py \
            --target v3 \
            --author-project _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json \
            --out artifacts/GQ_V3_LATEST_ART.project.json
      - name: Combine 7 domains with original SCORE and existing spatial quality repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py \
            --author _v3_original --quality . --art _v3_art --score _v3_score \
            --art-project artifacts/GQ_V3_LATEST_ART.project.json \
            --out artifacts/EGGRUMBLE_V3_GQ_26.project.json
      - name: Build fixed Luau native compiler and test runner
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau_fixed
          persist-credentials: false
      - name: Compile exact 26 mapped sources using native Luau parser
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _luau_fixed rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _luau_fixed -B /tmp/gq_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest=Path("artifacts/EGGRUMBLE_V3_GQ_26.project.json").resolve()
          tree=json.loads(manifest.read_text(encoding="utf-8"))["tree"]
          def walk(node):
              if isinstance(node,dict):
                  if "$path" in node:yield (manifest.parent/node["$path"]).resolve(strict=True)
                  else:
                      for key,value in node.items():
                          if not key.startswith("$"):yield from walk(value)
          sources=list(walk(tree))
          assert len(sources)==26,len(sources)
          for file in sources:
              subprocess.run(["/tmp/gq_native/luau-compile","--text",str(file)],check=True,stdout=subprocess.DEVNULL)
          print("ALL_26_NATIVE_LUAU_PARSE_PASS")
          PY
          mkdir -p /tmp/gq_score_vm
          score=_v3_score/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116
          cp "$score/EGGRUMBLE_ScoreBalance.luau" /tmp/gq_score_vm/Results.luau
          cp "$score/tests/EGGRUMBLE_ScoreBalance.spec.luau" /tmp/gq_score_vm/Cases.luau
          cp "$score/tests/run_score_balance_native.luau" /tmp/gq_score_vm/Runner.luau
          (cd /tmp/gq_score_vm && /tmp/gq_native/luau Runner.luau) | tee artifacts/SCORE_NATIVE.log
          grep -q MATCH_RESULT_POSTGAME_SCORE_NATIVE_ONLY artifacts/SCORE_NATIVE.log
      - name: Native Luau execute actual AI close-wall LOS and two mutant negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/test_action_los_native.py --luau /tmp/gq_native/luau
      - name: Acquire checksum-pinned Rojo and build unpublished candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq_rojo.zip") as z:
              files=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(files)==1
              out=Path("/tmp/gq_rojo")
              out.write_bytes(z.read(files[0]))
              out.chmod(0o755)
          PY
          /tmp/gq_rojo build artifacts/EGGRUMBLE_V3_GQ_26.project.json -o artifacts/EGGRUMBLE_V3_GQ_26_PRIVATE.rbxlx
      - name: Independent source-exact Place and receipts check (game, art, score, client)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          project=Path("artifacts/EGGRUMBLE_V3_GQ_26.project.json").resolve()
          place=Path("artifacts/EGGRUMBLE_V3_GQ_26_PRIVATE.rbxlx")
          tree=json.loads(project.read_text(encoding="utf-8"))["tree"]
          receipt=json.loads(Path("artifacts/SOURCE_RECEIPT.json").read_text(encoding="utf-8"))
          def flatten(node,out):
              for name,child in node.items():
                  if name.startswith("$") or not isinstance(child,dict):continue
                  if "$path" in child:
                      assert name not in out,name
                      path=(project.parent/child["$path"]).resolve(strict=True)
                      cl="Script" if path.name.endswith(".server.luau") else ("LocalScript" if path.name.endswith(".client.luau") else "ModuleScript")
                      out[name]=(cl,path.read_text(encoding="utf-8").replace("\r\n","\n"))
                      assert receipt["source_sha256"][name]==hashlib.sha256(path.read_bytes()).hexdigest(),name
                  else:flatten(child,out)
          expected={}
          flatten(tree,expected)
          assert len(expected)==26
          actual={}
          for node in ET.fromstring(place.read_bytes()).iter("Item"):
              cl=node.attrib.get("class")
              if cl not in ("Script","LocalScript","ModuleScript"):continue
              props=node.find("Properties")
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              assert name not in actual,name
              source=props.findtext("ProtectedString[@name='Source']")
              if source is None:source=props.findtext("string[@name='Source']")
              assert source is not None,("missing script source",name)
              actual[name]=(cl,source.replace("\r\n","\n"))
          assert expected==actual,{"missing":sorted(set(expected)-set(actual)),"extra":sorted(set(actual)-set(expected)),
                                   "different":[n for n in set(expected)&set(actual) if expected[n]!=actual[n]]}
          place_hash=hashlib.sha256(place.read_bytes()).hexdigest()
          receipt["place_sha256"]=place_hash
          receipt["place_bytes"]=place.stat().st_size
          Path("artifacts/SOURCE_RECEIPT.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n")
          print("SOURCE_EXACT_26_OF_26_PASS",place.stat().st_size,place_hash)
          PY
      - name: Archive only private unpublished source candidate
        uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE_GQ_V3_CURRENT26_PRIVATE_SOURCE_NO_RC
          path: |
            artifacts/EGGRUMBLE_V3_GQ_26_PRIVATE.rbxlx
            artifacts/EGGRUMBLE_V3_GQ_26.project.json
            artifacts/SOURCE_RECEIPT.json
            artifacts/SCORE_NATIVE.log
          retention-days: 3
