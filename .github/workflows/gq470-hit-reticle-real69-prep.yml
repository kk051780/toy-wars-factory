name: GQ470 REAL69 Hit Reticle Centering A PREP
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_hit_reticle_real69_20261121/**'
      - '.github/workflows/gq470-hit-reticle-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-exact-hit-reticle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source lock, genuine current REAL69 artifact, exact 1-of-69 patch + 12 negative mutations
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01 --jq .object.sha)" = "e80973c354f14a0d0088577f3cc1a875454f0f8f" || { echo RED_FORMAL_HEAD_DRIFT; exit 1; }
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44695199140 --jq '.head_sha+" "+.conclusion')" = "e80973c354f14a0d0088577f3cc1a875454f0f8f success" || { echo RED_BASE_RUN; exit 1; }
          mkdir -p /tmp/hit-original
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir /tmp/hit-original
          python3 -m py_compile quality_gameplay/gq470_hit_reticle_real69_20261121/patch_hit_reticle.py
          python3 -B quality_gameplay/gq470_hit_reticle_real69_20261121/patch_hit_reticle.py --self-test --base /tmp/hit-original
          python3 -B quality_gameplay/gq470_hit_reticle_real69_20261121/patch_hit_reticle.py --base /tmp/hit-original --out /tmp/hit-candidate
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native real Luau all selected 69 ON and full original OFF
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/hit-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/hit-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq470_hit_reticle_real69_20261121')
          import patch_hit_reticle as m
          a,b=Path('/tmp/hit-candidate'),Path('/tmp/hit-candidate')/m.OFF_NAME
          on,off=m.source_routes(a),m.source_routes(b)
          assert len(on)==len(off)==69 and set(on)==set(off)
          assert {r for r in on if on[r].read_bytes()!=off[r].read_bytes()}=={m.ROUTE}
          for picked in (on,off):
              for src in picked.values():
                  subprocess.run(['/tmp/hit-luau/luau-compile','--text',str(src)],stdout=subprocess.DEVNULL,check=True)
          print('GQ470_HIT_NATIVE_LUAU_69_ON_69_OFF_PASS')
          PY
      - name: Pinned Rojo actual 69-place ON/OFF, byte-exact rollback, official source integrity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/rojo-hit.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/rojo-hit.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/rojo-hit.zip') as z:
              files=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(files)==1
              f=Path('/tmp/rojo-hit');f.write_bytes(z.read(files[0]));f.chmod(0o755)
          PY
          /tmp/rojo-hit build /tmp/hit-candidate/EGGRUMBLE_REAL69.project.json -o /tmp/hit-candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          /tmp/rojo-hit build /tmp/hit-candidate/OFF69_HIT_RETICLE_EXACT/EGGRUMBLE_REAL69.project.json -o /tmp/hit-candidate/ORIGINAL_REBUILT.rbxlx
          cmp /tmp/hit-candidate/ORIGINAL_REBUILT.rbxlx /tmp/hit-candidate/OFF69_HIT_RETICLE_EXACT/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/hit-candidate/EGGRUMBLE_REAL69.project.json --place /tmp/hit-candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx --count 69
          python3 quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base /tmp/hit-candidate --report /tmp/hit-candidate/HIT_LEGACY48_AUDIT.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/hit-candidate')
          place=root/'EGGRUMBLE_REAL69_PRIVATE.rbxlx'
          receipt=root/'REAL69_LEGACY_INTAKE_RECEIPT.json'
          data=json.loads(receipt.read_text())
          data['private_place_bytes']=place.stat().st_size
          data['private_place_sha256']=hashlib.sha256(place.read_bytes()).hexdigest()
          receipt.write_text(json.dumps(data,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('GQ470_HIT_RETICLE_REAL_PRIVATE_CANDIDATE_PLACE_BYTES',place.stat().st_size)
          PY
      - name: Art 420 source-only gate, no fabricated device or human result
        shell: bash
        run: |
          set -euo pipefail
          python3 art_quality/gq470_real69_source_gate.py --root /tmp/hit-candidate --head e80973c354f14a0d0088577f3cc1a875454f0f8f --out /tmp/hit-candidate/ART_CHECK_REPORT.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/hit-candidate/ART_CHECK_REPORT.json').read_text())
          assert report['source_gate']['status']=='PASS_SOURCE_ONLY'
          assert report['source_gate']['actual_place_scripts']==69
          assert report['visual_evidence_gate']['screenshots_received']==0
          assert report['visual_evidence_gate']['screenshots_required']==32
          assert report['art_gate']=='ART_NO_GO' and report['owner_accepted'] is False
          print('GQ470_HIT_RETICLE_ART_SOURCE_ONLY_NOT_ENGINE_OR_ART_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-HIT-RETICLE-SOURCE-ONLY-NOT-FORMAL
          path: |
            /tmp/hit-candidate/EGGRUMBLE_REAL69.project.json
            /tmp/hit-candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/hit-candidate/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/hit-candidate/sources/**
            /tmp/hit-candidate/ORIGINAL_REBUILT.rbxlx
            /tmp/hit-candidate/HIT_LEGACY48_AUDIT.json
            /tmp/hit-candidate/ART_CHECK_REPORT.json
            /tmp/hit-candidate/B220_RETICLE_ONE_SOURCE_NOT_FORMAL/**
          if-no-files-found: error
          retention-days: 7
