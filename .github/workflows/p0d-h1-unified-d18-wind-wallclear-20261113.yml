name: P0D H1 unified wall-clear wind world D18 full-game private native Rojo
on:
  push:
    branches:
      - integration/p0d-h1-d18-wind-world-wallclear-private-20261113-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-native-rojo:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      H1: handoffs/P0D-H1-D18-WIND-WORLD-WALLCLEAR-20261113-01
    steps:
      - name: Checkout isolated full H1 source and immutable source base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Strict exact original 25 + 3 D18 and 6 physical route source negative QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$H1"
          python tools/verify_unified.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download hash-pinned official Rojo 7.7.1 native builder
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            -o /tmp/p0d_h1_unified_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_h1_unified_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import pathlib,stat,zipfile
          with zipfile.ZipFile("/tmp/p0d_h1_unified_rojo.zip") as z:
              bins=[n for n in z.namelist() if n.rsplit("/",1)[-1]=="rojo"]
              assert len(bins)==1
              p=pathlib.Path("/tmp/p0d_h1_unified_rojo")
              p.write_bytes(z.read(bins[0]))
              p.chmod(p.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_h1_unified_rojo --version | grep -F 7.7.1
      - name: Generate REAL unpublished full game H1 Place with wind world and D18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_h1_unified_out
          /tmp/p0d_h1_unified_rojo build "$H1/default.project.json" \
            -o /tmp/p0d_h1_unified_out/TRAP_RAIDERS_H1_WIND_WORLD_D18_WALLCLEAR_STUDIO_ONLY.rbxlx
          test -s /tmp/p0d_h1_unified_out/TRAP_RAIDERS_H1_WIND_WORLD_D18_WALLCLEAR_STUDIO_ONLY.rbxlx
      - name: Actual source XML 28 of 28 byte exact, two server scripts, original authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,os,pathlib,xml.etree.ElementTree as ET,json,hashlib
          root=pathlib.Path(os.environ["H1"])
          scripts=sorted((root/"src").rglob("*.luau"))
          assert len(scripts)==28,len(scripts)
          place=pathlib.Path("/tmp/p0d_h1_unified_out/TRAP_RAIDERS_H1_WIND_WORLD_D18_WALLCLEAR_STUDIO_ONLY.rbxlx")
          xml=ET.fromstring(place.read_bytes())
          actual=[];classes=collections.Counter()
          for item in xml.iter("Item"):
              kind=item.attrib.get("class")
              if kind not in ("Script","LocalScript","ModuleScript"):continue
              source=item.find("./Properties/string[@name='Source']")
              if source is not None:
                  actual.append(source.text or "")
                  classes[kind]+=1
          assert collections.Counter(actual)==collections.Counter(p.read_text(encoding="utf8") for p in scripts),(len(actual),classes)
          assert classes=={"Script":2,"LocalScript":4,"ModuleScript":22},classes
          receipt={"adoption_id":"P0D-FUN-H1-001","source_sha":os.environ.get("GITHUB_SHA"),
              "source_count":28,"embedded_script_count":len(actual),"actual_rojo_28_byte_exact":True,
              "gameplay":"S1 ONE original authority + Raider wind + Guardian trap",
              "visuals":"Sky/sea six wall-clear source routes + whale+pegasus + original D18 dragon guide",
              "source_wall_AABB_contacts":0,"source_wall_check":True,
              "studio_2client":"NOT_TESTED","phone":"NOT_TESTED","owner_human_fun":"NO_GO_PENDING",
              "official_rc_adopted":False,"production_published":False,
              "place_bytes":place.stat().st_size,"place_sha256":hashlib.sha256(place.read_bytes()).hexdigest()}
          pathlib.Path("/tmp/p0d_h1_unified_out/H1_UNIFIED_BUILD_RECEIPT.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          print("P0D_H1_UNIFIED_REAL_ROJO_28_OF_28_SCRIPT_BYTES_PASS",classes)
          PY
      - name: Build pinned native Luau and COMPILE actual all 28 Roblox sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/p0d_h1_unified_luau
          git -C /tmp/p0d_h1_unified_luau fetch --depth 1 origin f46d879e28302a430029304f7f6a162aed66f103
          git -C /tmp/p0d_h1_unified_luau checkout --detach FETCH_HEAD
          test "$(git -C /tmp/p0d_h1_unified_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S /tmp/p0d_h1_unified_luau -B /tmp/p0d_h1_unified_native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_h1_unified_native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          find "$H1/src" -name '*.luau' -print0 | while IFS= read -r -d '' file; do
              /tmp/p0d_h1_unified_native/luau-compile "$file" >/dev/null
          done
          echo "P0D_H1_UNIFIED_28_OF_28_NATIVE_LUAU_PASS"
      - name: Execute original D18 egg vs score guide rules on real native Luau
        shell: bash
        run: |
          set -euo pipefail
          cd "$H1"
          /tmp/p0d_h1_unified_native/luau tests/guide_rules_native.luau
      - name: Upload REAL unpublished Studio-only full H1 game and receipt
        uses: actions/upload-artifact@v4
        with:
          name: P0D-H1-WIND-WORLD-D18-WALLCLEAR-STUDIO-ONLY
          path: |
            /tmp/p0d_h1_unified_out/TRAP_RAIDERS_H1_WIND_WORLD_D18_WALLCLEAR_STUDIO_ONLY.rbxlx
            /tmp/p0d_h1_unified_out/H1_UNIFIED_BUILD_RECEIPT.json
          retention-days: 7
          if-no-files-found: error
