name: GQ470 ART13 REAL69 combined B220 source-only bridge (not official RC)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_art13_bridge_real69_20261121/**'
      - '.github/workflows/gq470-art13-bridge-real69.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  art13-source-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      ROOT: /tmp/gq470-art13
      SCRIPT: quality_gameplay/gq470_art13_bridge_real69_20261121/compose_art13.py
      FORMAL: e80973c354f14a0d0088577f3cc1a875454f0f8f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Source-lock original RC and exact green A parents ART7+ART6B
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$SCRIPT"
          python3 -B "$SCRIPT" --self-test
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL" || { echo RED_MOVED_FORMAL_RC; exit 1; }
          mkdir -p "$ROOT/formal" "$ROOT/parents"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir "$ROOT/formal"
          python3 - <<'PY' > "$ROOT/parents.list"
          import sys
          sys.path.insert(0,'quality_gameplay/gq470_art13_bridge_real69_20261121')
          from compose_art13 import PARENTS
          for p in PARENTS: print(p['pr'],p['head'],p['run'],p['artifact'])
          PY
          test "$(wc -l < "$ROOT/parents.list")" -eq 2
          while read -r PR HEAD RUN ARTIFACT; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)" = "$HEAD" || { echo "RED_PARENT_PR_HEAD_MOVED_$PR"; exit 1; }
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha+" "+.conclusion')" = "$HEAD success" || { echo "RED_PARENT_CI_NOT_EXACT_GREEN_$PR"; exit 1; }
            mkdir -p "$ROOT/parents/$PR"
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" \
              --name "$ARTIFACT" --dir "$ROOT/parents/$PR"
            echo "ART13_AUTHENTIC_A_PARENT_$PR $HEAD"
          done < "$ROOT/parents.list"
          python3 -B "$SCRIPT" --base "$ROOT/formal" --parents "$ROOT/parents" \
            --out "$ROOT/candidate"
          echo ART13_SOURCE_SELECTED_13_CHANGED_56_EXACT_NOT_FORMAL
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native compile all 69 ON and exact 69 original OFF
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B "$ROOT/luau" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build "$ROOT/luau" --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          from pathlib import Path
          import sys,os,subprocess
          sys.path.insert(0,'quality_gameplay/gq470_art13_bridge_real69_20261121')
          from compose_art13 import selected,bytes_map,changed_routes
          root=Path(os.environ['ROOT'])/'candidate'
          off=root/'OFF69_ART13_ORIGINAL'
          a=bytes_map(root);b=bytes_map(off)
          changed_routes(b,a,{r for r in a if a[r]!=b[r]},13)
          for directory in (root,off):
              paths=selected(directory)
              assert len(paths)==69
              for f in paths.values():
                  subprocess.run([str(Path(os.environ['ROOT'])/'luau/luau-compile'),
                                  '--text',str(f)],check=True,stdout=subprocess.DEVNULL)
          print('ART13_LUAU_69_ON_69_OFF_AND_13_SOURCE_DELTA_PASS')
          PY
      - name: Pinned Rojo true Place 69 and original exact OFF69 inverse
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o "$ROOT/rojo.zip"
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $ROOT/rojo.zip" | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          root=Path(os.environ['ROOT'])
          with ZipFile(root/'rojo.zip') as z:
              names=[x for x in z.namelist() if x.split('/')[-1]=='rojo']
              assert len(names)==1
              f=root/'rojo';f.write_bytes(z.read(names[0]));f.chmod(0o755)
          PY
          A="$ROOT/candidate"
          "$ROOT/rojo" build "$A/EGGRUMBLE_REAL69.project.json" -o "$A/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          "$ROOT/rojo" build "$A/OFF69_ART13_ORIGINAL/EGGRUMBLE_REAL69.project.json" -o "$ROOT/OFF69_REBUILT.rbxlx"
          cmp "$ROOT/OFF69_REBUILT.rbxlx" "$A/OFF69_ART13_ORIGINAL/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project "$A/EGGRUMBLE_REAL69.project.json" \
            --place "$A/EGGRUMBLE_REAL69_PRIVATE.rbxlx" --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project "$A/OFF69_ART13_ORIGINAL/EGGRUMBLE_REAL69.project.json" \
            --place "$ROOT/OFF69_REBUILT.rbxlx" --count 69
          python3 -B "$SCRIPT" --seal "$A"
          python3 -B "$SCRIPT" --verify "$A"
          echo ART13_REAL69_ON_OFF_ROJO_ORIGINAL_ROLLBACK_PASS
      - name: 17 real source families and 48 historical legacy inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py \
            --base "$ROOT/candidate" --report "$ROOT/candidate/ART13_LEGACY48_AUDIT.json"
          python3 - <<'PY'
          from pathlib import Path
          import sys,os
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          from quality_gameplay.gq8_rc85_rc86_real69_nonloss_20261120.verify_real69 import marker_check
          root=Path(os.environ['ROOT'])/'candidate'
          assert len(marker_check(project_scan(root,'EGGRUMBLE_REAL69.project.json')))==17
          print('ART13_17_REAL_SOURCE_GROUPS_AND_48_INVENTORY_ONLY_PASS')
          PY
      - name: B220 true 13 selected source bytes and latest official head fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL" || { echo RED_STALE_FORMAL_RC; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$(git rev-parse HEAD)" = "$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")" || { echo RED_WRONG_PR_HEAD; exit 1; }
          fi
          python3 -B "$SCRIPT" --export-b "$ROOT/candidate"
          python3 -B "$SCRIPT" --verify-b "$ROOT/candidate"
          echo ART13_SELECTED_SOURCE_PACKET_READY_ONLY_NOT_RC_NOT_OWNER_ART_GO
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-ART13-REAL69-ONE-B220-PACKET-NOT-FORMAL
          path: |
            /tmp/gq470-art13/candidate/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-art13/candidate/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-art13/candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-art13/candidate/sources/**
            /tmp/gq470-art13/candidate/ART13_LEGACY48_AUDIT.json
            /tmp/gq470-art13/candidate/B220_ART13_SELECTED_BYTES_ONLY_NOT_FORMAL/**
            /tmp/gq470-art13/OFF69_REBUILT.rbxlx
          if-no-files-found: error
          retention-days: 7
