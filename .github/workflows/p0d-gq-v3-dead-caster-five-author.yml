name: P0D GQ530 five-author ONE Combat private22 integration
on:
  push:
    branches: [quality/gq-v3-dead-caster-fence-20261116-01]
    paths:
      - 'quality_gameplay/v3_dead_caster_fence_20261116/**'
      - '.github/workflows/p0d-gq-v3-dead-caster-five-author.yml'
  pull_request:
    paths:
      - 'quality_gameplay/v3_dead_caster_fence_20261116/**'
      - '.github/workflows/p0d-gq-v3-dead-caster-five-author.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-five-source-selective-private22:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned original #529 human PvP/COMBAT author read-only
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 99ae00fbec2b5057c54e938d741ea99b0caad924
          path: _gq_pvp
          persist-credentials: false
      - name: Pinned original #510 mage team heal LOS author read-only
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 0338bd13f9d3d199972bd4cd30e467443083dffa
          path: _gq_mage
          persist-credentials: false
      - name: Pinned original #516 delayed DOT guard author read-only
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 8f0275692c54874f823d66748d470fb849607df5
          path: _gq_dot
          persist-credentials: false
      - name: Pinned original #524 warp geometry author read-only
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: f90875e14446ba86b1c668ba43efa37fbc74be20
          path: _gq_warp
          persist-credentials: false
      - name: Verify all 4 upstream pins and zero original author Game modifications
        run: |
          set -euo pipefail
          test "$(git -C _gq_pvp rev-parse HEAD)" = 99ae00fbec2b5057c54e938d741ea99b0caad924
          test "$(git -C _gq_mage rev-parse HEAD)" = 0338bd13f9d3d199972bd4cd30e467443083dffa
          test "$(git -C _gq_dot rev-parse HEAD)" = 8f0275692c54874f823d66748d470fb849607df5
          test "$(git -C _gq_warp rev-parse HEAD)" = f90875e14446ba86b1c668ba43efa37fbc74be20
          git fetch --depth 1 origin fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          git diff --exit-code fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9 HEAD -- handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116
          test ! -e quality_gameplay/v3_human_stealth_pvp_20261116
          ln -s "$(pwd)/_gq_pvp/quality_gameplay/v3_human_stealth_pvp_20261116" quality_gameplay/v3_human_stealth_pvp_20261116
          python3 -m unittest discover -s quality_gameplay/v3_dead_caster_fence_20261116/tests -v
      - name: Original four-author composer plus ONLY one new dead-caster entry guard
        run: |
          set -euo pipefail
          mkdir -p artifacts/gq530_five
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/compose_five_author.py \
            --combat artifacts/gq530_five/ONE_COMBAT_FIVE_AUTHOR.luau \
            --project artifacts/gq530_five/PRIVATE22.project.json \
            --receipt artifacts/gq530_five/FIVE_AUTHOR_RECEIPT.json
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/five_author_native.py \
            --combined artifacts/gq530_five/ONE_COMBAT_FIVE_AUTHOR.luau \
            --out artifacts/gq530_five/REAL_EXECUTE_84.luau
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/five_author_native.py \
            --combined artifacts/gq530_five/ONE_COMBAT_FIVE_AUTHOR.luau --mutant \
            --out artifacts/gq530_five/DEAD_CASTER_OLD_MUTANT.luau
      - name: Reuse exact pinned Luau compiler and VM
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq_luau
          persist-credentials: false
      - name: Native Luau 22/22 source compile and five-author actual execute 84-case proof
        run: |
          set -euo pipefail
          cmake -S _gq_luau -B /tmp/gq530_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq530_native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          m=SourceFileLoader("five","quality_gameplay/v3_human_stealth_pvp_20261116/compose_four_author.py").load_module()
          path=Path("artifacts/gq530_five/PRIVATE22.project.json").resolve()
          files=m.scripts(json.loads(path.read_text(encoding="utf-8")),path.parent)
          assert len(files)==22,("RED_DUPLICATE_OR_MISSING_SCRIPTS",len(files))
          for name,(kind,source) in files.items():
              subprocess.run(["/tmp/gq530_native/luau-compile","--text",str(source)],check=True,stdout=subprocess.DEVNULL)
          print("GQ530_FIVE_AUTHOR_ORIGINAL22_LUAU_COMPILE_PASS",len(files))
          PY
          /tmp/gq530_native/luau-compile --text artifacts/gq530_five/REAL_EXECUTE_84.luau >/dev/null
          /tmp/gq530_native/luau artifacts/gq530_five/REAL_EXECUTE_84.luau | tee /tmp/gq53084.log
          grep -q NATIVE_REAL_AUTHOR_EXECUTE_84_CASES_PASS /tmp/gq53084.log
          if /tmp/gq530_native/luau artifacts/gq530_five/DEAD_CASTER_OLD_MUTANT.luau; then
            echo 'RED: the unguarded four-author mutant wrongly passed'
            exit 1
          fi
          echo 'GQ530_FIVE_AUTHOR_84_STATE_MUTANT_REJECTED'
      - name: Retest existing #529 human PvP and #510 Mage real Combat paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          m=SourceFileLoader("pvp","quality_gameplay/v3_human_stealth_pvp_20261116/build_candidate.py").load_module()
          mage=SourceFileLoader("mage","_gq_mage/quality_gameplay/v3_mage_heal_los_20261116/build_candidate.py").load_module()
          combat=Path("artifacts/gq530_five/ONE_COMBAT_FIVE_AUTHOR.luau").read_text(encoding="utf-8")
          rules=Path("handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_CastleMatchRules.luau").read_text(encoding="utf-8")
          Path("artifacts/gq530_five/REAL_PVP.luau").write_text(m.harness(combat,True),encoding="utf-8")
          Path("artifacts/gq530_five/REAL_MAGE.luau").write_text(mage.harness(combat,fixed=True,rules=rules),encoding="utf-8")
          PY
          /tmp/gq530_native/luau artifacts/gq530_five/REAL_PVP.luau | tee /tmp/gq530pvp.log
          grep -q GQ_HUMAN_STEALTH_PVP_REAL_SOURCE_12_CASES_PASS /tmp/gq530pvp.log
          /tmp/gq530_native/luau artifacts/gq530_five/REAL_MAGE.luau | tee /tmp/gq530mage.log
          grep -q MAGE_ORIGINAL_1H15AI_TEAM_BR_GAMEPLAY_NATIVE_CASES_PASS /tmp/gq530mage.log
      - name: Retest pinned #516 original delayed DOT actual callback in five-author Combat
        run: |
          set -euo pipefail
          python3 _gq_dot/quality_gameplay/v3_status_tick_fence_20261116/tools/make_actual_status_callback_native.py \
            --source artifacts/gq530_five/ONE_COMBAT_FIVE_AUTHOR.luau \
            --out artifacts/gq530_five/REAL_DOT.luau
          python3 - <<'PY'
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          p=Path("artifacts/gq530_five/REAL_DOT.luau")
          src=p.read_text(encoding="utf-8")
          own=SourceFileLoader("pvp","quality_gameplay/v3_human_stealth_pvp_20261116/build_candidate.py").load_module()
          anchor="local function secondaryEffect("
          assert src.count(anchor)==1
          src=src.replace(anchor,own.HELPER+anchor,1)
          target='local target={UserId=2,Character=newChar(enemyH)}'
          assert src.count(target)==1
          src=src.replace(target,target+'\n function target:GetAttribute(k) return nil end',1)
          rule='["2"]={alive=true,team=targetTeam or "BLUE"}'
          assert src.count(rule)==1
          src=src.replace(rule,'["2"]={alive=true,team=targetTeam or "BLUE",heldEggs=0}',1)
          assert src.count("humanCombatTargetable(")==2
          p.write_text(src,encoding="utf-8")
          PY
          cp _gq_dot/quality_gameplay/v3_status_tick_fence_20261116/EGGRUMBLE_StatusTickFence.luau artifacts/gq530_five/StatusFence.luau
          /tmp/gq530_native/luau-compile --text artifacts/gq530_five/REAL_DOT.luau >/dev/null
          /tmp/gq530_native/luau-compile --text artifacts/gq530_five/StatusFence.luau >/dev/null
          (cd artifacts/gq530_five && /tmp/gq530_native/luau REAL_DOT.luau) | tee /tmp/gq530dot.log
          grep -q GQ_V3_ACTUAL_SERVER_STATUS_CALLBACK_NATIVE_18_SCENARIOS_PASS /tmp/gq530dot.log
      - name: Source-pinned Rojo 7.7.1 builds ON22 and rollback OFF22 private Places
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq530_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq530_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq530_rojo.zip") as z:
              found=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(found)==1
              p=Path("/tmp/gq530_rojo")
              p.write_bytes(z.read(found[0]))
              p.chmod(0o755)
          PY
          /tmp/gq530_rojo build artifacts/gq530_five/PRIVATE22.project.json \
            -o artifacts/gq530_five/FIVE_AUTHOR_PRIVATE22_NOT_RC.rbxlx
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/compose_five_author.py \
            --combat artifacts/gq530_five/ONE_COMBAT_FIVE_AUTHOR.luau \
            --project artifacts/gq530_five/PRIVATE22.project.json \
            --receipt artifacts/gq530_five/FIVE_AUTHOR_RECEIPT.json \
            --verify-place artifacts/gq530_five/FIVE_AUTHOR_PRIVATE22_NOT_RC.rbxlx
          echo 'GQ530_5_AUTHOR_FUSED_22_SOURCE_EXACT_PRIVATE_ONLY'
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/compose_five_author.py --off \
            --combat artifacts/gq530_five/OFF_COMBAT_FOUR_AUTHOR.luau \
            --project artifacts/gq530_five/OFF22.project.json \
            --receipt artifacts/gq530_five/OFF22_RECEIPT.json
          /tmp/gq530_native/luau-compile --text artifacts/gq530_five/OFF_COMBAT_FOUR_AUTHOR.luau >/dev/null
          /tmp/gq530_rojo build artifacts/gq530_five/OFF22.project.json \
            -o artifacts/gq530_five/OFF22_PRIVATE_NOT_RC.rbxlx
          python3 quality_gameplay/v3_dead_caster_fence_20261116/tools/compose_five_author.py --off \
            --combat artifacts/gq530_five/OFF_COMBAT_FOUR_AUTHOR.luau \
            --project artifacts/gq530_five/OFF22.project.json \
            --receipt artifacts/gq530_five/OFF22_RECEIPT.json \
            --verify-place artifacts/gq530_five/OFF22_PRIVATE_NOT_RC.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          p=SourceFileLoader("five","quality_gameplay/v3_dead_caster_fence_20261116/tools/compose_five_author.py").load_module()
          on=Path("artifacts/gq530_five/ONE_COMBAT_FIVE_AUTHOR.luau").read_text()
          off=Path("artifacts/gq530_five/OFF_COMBAT_FOUR_AUTHOR.luau").read_text()
          assert p.sha256(off)==p.ORIGINAL_529_FOUR_SHA256
          assert on.replace(p.REPLACEMENT,p.ENTRY,1)==off
          assert on.count(p.REPLACEMENT)==1
          print("GQ530_ROLLBACK_PRESERVES_ALL_529_AUTHORS_EXACT")
          PY
      - name: Upload no-publish, no-authority private proof; not official RC
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GQ530-FIVE-AUTHOR-PRIVATE22-NOT-OFFICIAL-RC
          path: |
            artifacts/gq530_five/FIVE_AUTHOR_RECEIPT.json
            artifacts/gq530_five/PRIVATE22.project.json
            artifacts/gq530_five/FIVE_AUTHOR_PRIVATE22_NOT_RC.rbxlx
            artifacts/gq530_five/OFF22_RECEIPT.json
            artifacts/gq530_five/OFF22.project.json
            artifacts/gq530_five/OFF22_PRIVATE_NOT_RC.rbxlx
          retention-days: 3
