name: P0D GQ carrier world tell 23-source actual Rojo Place
on:
  push:
    branches:
      - quality/gq-egg-carrier-world-tell-20261116
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact author source, 23-source private candidate and negative checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s quality_gameplay/carrier_world_tell_20261116 -p 'test_*.py' -v
          python3 quality_gameplay/carrier_world_tell_20261116/compose.py --out artifacts/carrier-world-private
      - name: Build Luau native CLI
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/gq-luau
          cmake -S /tmp/gq-luau -B /tmp/gq-luau/build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build /tmp/gq-luau/build --target Luau.Repl.CLI Luau.Compile.CLI -j 4
      - name: Real authored Luau syntax plus 18 policy VM cases
        run: |
          set -euo pipefail
          for source in quality_gameplay/carrier_world_tell_20261116/*.luau; do
            /tmp/gq-luau/build/luau-compile "$source" >/dev/null
          done
          python3 quality_gameplay/carrier_world_tell_20261116/make_native_harness.py --out /tmp/carrier-policy-native.luau
          /tmp/gq-luau/build/luau-compile /tmp/carrier-policy-native.luau >/dev/null
          /tmp/gq-luau/build/luau /tmp/carrier-policy-native.luau
      - name: Execute original WorldTell module with native Roblox mock across TEAM/BR
        run: |
          set -euo pipefail
          python3 quality_gameplay/carrier_world_tell_20261116/make_native_world_harness.py --out /tmp/carrier-world-actual-native.luau
          /tmp/gq-luau/build/luau-compile /tmp/carrier-world-actual-native.luau >/dev/null
          /tmp/gq-luau/build/luau /tmp/carrier-world-actual-native.luau
      - name: Checksum-locked Rojo 7.7.1 private 23-script Place build
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_carrier_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_carrier_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq_carrier_rojo.zip') as z:
            names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
            assert len(names)==1
            binary=Path('/tmp/gq_carrier_rojo')
            binary.write_bytes(z.read(names[0]));binary.chmod(0o755)
          PY
          /tmp/gq_carrier_rojo build artifacts/carrier-world-private/EGGRUMBLE_CARRIER_TELL_PRIVATE.project.json -o artifacts/carrier-world-private/EGGRUMBLE_CARRIER_TELL_PRIVATE.rbxlx
      - name: Independently read back all actual Place source/class bytes 23/23
        run: |
          set -euo pipefail
          python3 quality_gameplay/carrier_world_tell_20261116/verify_place.py \
            --project artifacts/carrier-world-private/EGGRUMBLE_CARRIER_TELL_PRIVATE.project.json \
            --place artifacts/carrier-world-private/EGGRUMBLE_CARRIER_TELL_PRIVATE.rbxlx \
            --receipt artifacts/carrier-world-private/receipt.json
      - name: Export actual unpublished Rojo Place and source receipt; official RC untouched
        uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE_CARRIER_TELL_PRIVATE_23_PLACE_NO_RC
          path: artifacts/carrier-world-private/
          retention-days: 3
