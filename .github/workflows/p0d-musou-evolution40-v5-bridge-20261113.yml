name: P0D Musou v5 plus owned evolution40 source-only private integration test
on:
  push:
    branches:
      - experiment/p0d-musou-chaos-h1-20261113-01
    paths:
      - 'handoffs/P0D-MUSOU-CHAOS-H1-20261113-01/**'
      - '.github/workflows/p0d-musou-evolution40-v5-bridge-20261113.yml'
  workflow_dispatch:
jobs:
  frozen-40-narrow-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen 39-Luau parent independent of moving #288 author branch
        uses: actions/checkout@v4
        with:
          ref: cb2540dc4a3e5b819c0e3598d4af5e2b6dca76d3
          path: _p0d_frozen_39
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout frozen exact original 40-Luau saved evolution source
        uses: actions/checkout@v4
        with:
          ref: 1b21bf8e5fc6afa5c74813d7f1037f877e1273ed
          path: _p0d_frozen_40
          persist-credentials: false
          fetch-depth: 1
      - name: Prove negative patch drift failures then assemble full original 40 plus v5
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-MUSOU-CHAOS-H1-20261113-01
          test "$(git -C _p0d_frozen_39 rev-parse HEAD)" = cb2540dc4a3e5b819c0e3598d4af5e2b6dca76d3
          test "$(git -C _p0d_frozen_40 rev-parse HEAD)" = 1b21bf8e5fc6afa5c74813d7f1037f877e1273ed
          python3 -B "$ROOT/tests/test_40_v5_bridge.py"
          python3 -B "$ROOT/tools/build_40_evolution_v5.py" --assemble
          python3 - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('handoffs/P0D-MUSOU-CHAOS-H1-20261113-01/dist/EGG_RAID_RUMBLE_H1_EVOLUTION_MUSOU_V5_PRIVATE_BRIDGE')
          j=json.loads((p/'SOURCE_LOCK.json').read_text('utf8'))
          assert j['source_count']==40 and j['original_40_unchanged']==37
          assert j['only_three_modified']==['client/HUD.client.luau','server/Game.server.luau','server/MusouHorde.luau']
          assert len(list((p/'src').rglob('*.luau')))==40
          for name,sha in j['source_sha256'].items():
              assert hashlib.sha256((p/'src'/name).read_bytes()).hexdigest()==sha
          print('P0D_EVOLUTION40_MUSOUV5_REPRODUCIBLE_SOURCE_LOCK_PASS 40/40')
          PY
      - name: Checkout pinned actual native Luau compiler and runtime
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_native_40_v5
          persist-credentials: false
          fetch-depth: 1
      - name: Compile immutable actual 40 original Luau scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_native_40_v5 rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_native_40_v5 -B /tmp/p0d40_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d40_native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          DIST=handoffs/P0D-MUSOU-CHAOS-H1-20261113-01/dist/EGG_RAID_RUMBLE_H1_EVOLUTION_MUSOU_V5_PRIVATE_BRIDGE
          n=0
          while IFS= read -r -d '' f; do
            /tmp/p0d40_native/luau-compile "$f" >/dev/null
            n=$((n+1))
          done < <(find "$DIST/src" -type f -name '*.luau' -print0)
          test "$n" -eq 40
          echo P0D_EVOLUTION40_MUSOUV5_NATIVE_40_LUAU_COMPILER_PASS
          ROOT=handoffs/P0D-MUSOU-CHAOS-H1-20261113-01
          python3 -B "$ROOT/tools/generate_native_horde_state_test.py" --write /tmp/p0d40_v5_horde_test.luau
          /tmp/p0d40_native/luau-compile /tmp/p0d40_v5_horde_test.luau >/dev/null
          /tmp/p0d40_native/luau /tmp/p0d40_v5_horde_test.luau | tee /tmp/p0d40_horde_state.log
          grep -F MUSOU_HORDE_NATIVE_50_STATE_ASSERTIONS_PASS /tmp/p0d40_horde_state.log
          python3 -B "$ROOT/tools/generate_native_evolved_grounded_attack_test.py" --write /tmp/p0d40_grounded_scout_test.luau
          /tmp/p0d40_native/luau-compile /tmp/p0d40_grounded_scout_test.luau >/dev/null
          /tmp/p0d40_native/luau /tmp/p0d40_grounded_scout_test.luau | tee /tmp/p0d40_grounded_scout.log
          grep -F P0D_EVOLVED_ASSAULT_GROUND_ORIGIN_REAL_HORDE_NATIVE_8_ASSERTIONS_PASS /tmp/p0d40_grounded_scout.log
          python3 -B "$ROOT/tools/generate_native_bind_test.py" --write /tmp/p0d40_bind.luau
          /tmp/p0d40_native/luau /tmp/p0d40_bind.luau | tee /tmp/p0d40_bind.log
          grep -F MUSOU_BIND_NATIVE_20_ASSERTIONS_PASS /tmp/p0d40_bind.log
          python3 -B "$ROOT/tools/generate_native_combat_test.py" --write /tmp/p0d40_combat.luau
          /tmp/p0d40_native/luau /tmp/p0d40_combat.luau | tee /tmp/p0d40_combat.log
          grep -F MUSOU_COMBAT_NATIVE_26_ASSERTIONS_PASS /tmp/p0d40_combat.log
      - name: Get Rojo7.7.1 with exact immutable zip SHA256
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d40_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d40_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import zipfile,pathlib,stat
          with zipfile.ZipFile('/tmp/p0d40_rojo.zip') as z:
              options=[p for p in z.namelist() if p.split('/')[-1]=='rojo']
              assert len(options)==1
              path=pathlib.Path('/tmp/p0d40_rojo')
              path.write_bytes(z.read(options[0]))
              path.chmod(path.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d40_rojo --version | grep -F 7.7.1
      - name: Build unpublished 40-script Roblox Place and verify each exact actual Luau body
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-MUSOU-CHAOS-H1-20261113-01
          DIST="$ROOT/dist/EGG_RAID_RUMBLE_H1_EVOLUTION_MUSOU_V5_PRIVATE_BRIDGE"
          mkdir -p /tmp/p0d40_bridge_place
          /tmp/p0d40_rojo build "$DIST/default.project.json" -o /tmp/p0d40_bridge_place/EGG_RAID_RUMBLE_EVOLUTION_MUSOUV5_PRIVATE_UNPUBLISHED.rbxlx
          cp "$DIST/SOURCE_LOCK.json" /tmp/p0d40_bridge_place/SOURCE_LOCK.json
          cp /tmp/p0d40_horde_state.log /tmp/p0d40_bridge_place/NATIVE_ACTUAL_HORDE_MOCK.txt
          cp /tmp/p0d40_grounded_scout.log /tmp/p0d40_bridge_place/NATIVE_EVOLVED_SCOUT_TRUE_GROUNDED_HIT.txt
          cp /tmp/p0d40_bind.log /tmp/p0d40_bridge_place/NATIVE_BIND_POLICY.txt
          cp /tmp/p0d40_combat.log /tmp/p0d40_bridge_place/NATIVE_COMBAT_POLICY.txt
          python3 - <<'PY'
          import pathlib,collections,xml.etree.ElementTree as ET,hashlib,json
          dist=pathlib.Path('handoffs/P0D-MUSOU-CHAOS-H1-20261113-01/dist/EGG_RAID_RUMBLE_H1_EVOLUTION_MUSOU_V5_PRIVATE_BRIDGE')
          place=pathlib.Path('/tmp/p0d40_bridge_place/EGG_RAID_RUMBLE_EVOLUTION_MUSOUV5_PRIVATE_UNPUBLISHED.rbxlx')
          expected=collections.Counter(f.read_text('utf8') for f in (dist/'src').rglob('*.luau'))
          bodies=[];classes=collections.Counter();gamenames=0
          for item in ET.fromstring(place.read_bytes()).iter('Item'):
              kind=item.get('class')
              if kind not in ('Script','LocalScript','ModuleScript'):continue
              src=item.find("./Properties/string[@name='Source']")
              if src is None:continue
              nm=item.find("./Properties/string[@name='Name']")
              if kind=='Script' and nm is not None and nm.text=='Game': gamenames+=1
              classes[kind]+=1
              bodies.append(src.text or '')
          assert len(bodies)==40 and collections.Counter(bodies)==expected
          assert classes=={'Script':2,'LocalScript':5,'ModuleScript':33},classes
          assert gamenames==1
          game=[v for v in bodies if 'remote.Name = "TrapRaidersS1Remote"' in v]
          assert len(game)==1 and game[0].count('remote.OnServerEvent:Connect(')==1
          assert 'Evolution.nextEvolution(' in game[0] and 'Power.beginAwaken(' in game[0]
          assert 'horde:eliteWarningSeconds(now)' in game[0]
          hud=[v for v in bodies if "⚠ 赤い円の外へ！" in v and "EVOLVE_SCOUT" in v]
          assert len(hud)==1
          result={'actual_place_sha256':hashlib.sha256(place.read_bytes()).hexdigest(),
                  'real_luau_exact_count':40,'classes':classes,
                  'studio_tested':False,'android_tested':False,'owner_fun_passed':False,
                  'official_rc_adopted':False,'roblox_published':False}
          pathlib.Path('/tmp/p0d40_bridge_place/PLACE_EXACT_SOURCE_RESULT.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print('P0D_EVOLUTION40_MUSOUV5_REAL_ROJO_EXACT_40_OF_40_PRIVATE_PASS',result['actual_place_sha256'])
          PY
      - name: Preserve separate unpublished 40-source verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: P0D-EVOLUTION40-MUSOUV5-PRIVATE-STUDIO-RBXLX
          path: /tmp/p0d40_bridge_place/
          retention-days: 7
          if-no-files-found: error
