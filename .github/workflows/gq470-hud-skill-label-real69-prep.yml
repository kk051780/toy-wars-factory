name: GQ470 V5 custom HUD skill-label source-exact PREP (not official RC)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_v5_hud_skill_label_real69_20261120/**'
      - '.github/workflows/gq470-hud-skill-label-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-hud-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-level negative tests and immutable official receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile quality_gameplay/gq470_v5_hud_skill_label_real69_20261120/patch_hud69.py
          python3 -B quality_gameplay/gq470_v5_hud_skill_label_real69_20261120/patch_hud69.py --self-test
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44673605213 --jq '.head_sha+" "+.conclusion')" = "6c2338b44db1c772bab0d688b2aece2e3aa8aae2 success"
          mkdir -p /tmp/gq470-hud
          gh run download 44673605213 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir /tmp/gq470-hud
          test -s /tmp/gq470-hud/EGGRUMBLE_REAL69.project.json
          test -s /tmp/gq470-hud/REAL69_LEGACY_INTAKE_RECEIPT.json
          test -s /tmp/gq470-hud/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 -B quality_gameplay/gq470_v5_hud_skill_label_real69_20261120/patch_hud69.py --base /tmp/gq470-hud
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/gq470-hud/REAL69_LEGACY_INTAKE_RECEIPT.json').read_text())
          a=r['gq470_v5_skill_label']
          assert a['other_selected_routes_byte_exact']==68
          assert a['new_selected_scripts']==0 and a['internal_tool_name_unchanged'] is True
          assert a['server_gameplay_authority_changed'] is False
          assert not a['human_art_accepted']
          print("GQ470_HUD_SOURCE_QA_PASS_NOT_STUDIO_ACCEPTED")
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Verify full selected REAL69 Native and exact source rollback
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-hud-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-hud-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import json,pathlib,subprocess,sys
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          root=pathlib.Path('/tmp/gq470-hud')
          before=project_scan(root/'off69_hud','EGGRUMBLE_REAL69.project.json')
          after=project_scan(root,'EGGRUMBLE_REAL69.project.json')
          target='StarterPlayer/StarterPlayerScripts/EGGRUMBLE_HudIntelRuntime'
          assert set(before)==set(after) and len(after)==69
          assert {k for k in after if before[k]['sha256']!=after[k]['sha256']}=={target}
          assert all(before[k]['class']==after[k]['class'] and before[k]['path']==after[k]['path'] for k in after)
          receipt=json.loads((root/'REAL69_LEGACY_INTAKE_RECEIPT.json').read_text())
          assert set(receipt['source_hashes'])==set(after)
          for r,listing in ((root,after),(root/'off69_hud',before)):
            for k,x in listing.items():
              assert x['sha256']==(receipt['source_hashes'][k] if r==root else before[k]['sha256'])
              subprocess.run(['/tmp/gq470-hud-luau/luau-compile','--text',str(r/x['path'])],
                check=True,stdout=subprocess.DEVNULL)
          print('GQ470_HUD_NATIVE69_PLUS_OFF69_PASS_OTHER_68_EXACT')
          PY
      - name: Rojo69 place, byte-exact OFF69, embedded sources, legacy17 and all48 gate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-hud-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-hud-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq470-hud-rojo.zip') as z:
            matches=[x for x in z.namelist() if x.split('/')[-1]=='rojo']
            assert len(matches)==1
            p=Path('/tmp/gq470-hud-rojo');p.write_bytes(z.read(matches[0]));p.chmod(0o755)
          PY
          ROOT=/tmp/gq470-hud
          /tmp/gq470-hud-rojo build "$ROOT/EGGRUMBLE_REAL69.project.json" -o "$ROOT/EGGRUMBLE_REAL69_HUD_CANDIDATE.rbxlx"
          /tmp/gq470-hud-rojo build "$ROOT/off69_hud/EGGRUMBLE_REAL69.project.json" -o "$ROOT/OFF69_HUD_REBUILT.rbxlx"
          cmp "$ROOT/OFF69_HUD_REBUILT.rbxlx" "$ROOT/off69_hud/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$ROOT/EGGRUMBLE_REAL69.project.json" --place "$ROOT/EGGRUMBLE_REAL69_HUD_CANDIDATE.rbxlx" --count 69
          mkdir -p "$ROOT/delivery"
          cp "$ROOT/EGGRUMBLE_REAL69_HUD_CANDIDATE.rbxlx" "$ROOT/delivery/EGGRUMBLE_REAL69_HUD_CANDIDATE.rbxlx"
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          root=pathlib.Path('/tmp/gq470-hud')
          p=root/'EGGRUMBLE_REAL69_HUD_CANDIDATE.rbxlx'
          r=root/'REAL69_LEGACY_INTAKE_RECEIPT.json'
          x=json.loads(r.read_text())
          x['build_head']=os.environ['GITHUB_SHA']
          x['gq470_v5_skill_label']['native_rojo_off69']='PASS_69_OF_69'
          x['private_place_bytes']=p.stat().st_size
          x['private_place_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          r.write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          (root/'delivery'/'REAL69_HUD_CANDIDATE_RECEIPT.json').write_text(r.read_text())
          print('HUD_ACTUAL_PRIVATE_PLACE_BYTES',p.stat().st_size)
          PY
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 - <<'PY'
          import json,os,pathlib,sys
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120')
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          from verify_real69 import marker_check
          root=pathlib.Path('/tmp/gq470-hud')
          after=project_scan(root,'EGGRUMBLE_REAL69.project.json')
          before=project_scan(root/'off69_hud','EGGRUMBLE_REAL69.project.json')
          target='StarterPlayer/StarterPlayerScripts/EGGRUMBLE_HudIntelRuntime'
          assert len(after)==len(before)==69 and set(after)==set(before)
          assert len(marker_check(after))==len(marker_check(before))==17
          assert {k for k in after if after[k]['sha256'] != before[k]['sha256']}=={target}
          report={'selected_scripts':69,'legacy_families':17,'only_modified_source':target,
                  'other_sources_byte_exact':68,'studio':'NOT_TESTED',
                  'candidate_head':os.environ['GITHUB_SHA']}
          (root/'delivery'/'REAL69_LEGACY17_NONLOSS_AUDIT.json').write_text(
             json.dumps(report,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print('GQ470_HUD_SOURCE_MARKER_17_FAMILY_68_EXACT_PASS')
          PY
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base "$ROOT" --report "$ROOT/delivery/REAL69_HUD_LEGACY48_AUDIT.json"
          test "$(find "$ROOT/delivery" -maxdepth 1 -name '*.rbxlx' | wc -l)" -eq 1
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)"
          test "$CURRENT" = "6c2338b44db1c772bab0d688b2aece2e3aa8aae2" || { echo RED_OFFICIAL_HEAD_MOVED_REBASE_REQUIRED; exit 1; }
          echo GQ470_HUD_FULL_NATIVE_ROJO_OFF69_LEGACY17_48_CANDIDATE_PASS_NOT_STUDIO
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-HUD-PRIVATE-PREP-NOT-OFFICIAL
          path: /tmp/gq470-hud/delivery/
          retention-days: 14
          if-no-files-found: error
