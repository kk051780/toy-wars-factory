name: GQ8 Social/Trade Real48 to private Real50 native Rojo OFF48
on:
  push:
    branches: [quality/gq8-lobby-social-real49-20261119]
    paths:
      - 'quality_gameplay/gq8_social_lobby_20261119/**'
      - '.github/workflows/gq8-lobby-social-trade-real50.yml'
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_social_lobby_20261119/**'
      - '.github/workflows/gq8-lobby-social-trade-real50.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  nonoverlap-real50:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Immutable parent Real48 plus true official-branch fence
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$CURRENT" = f77b4d4393d9e9b19b65566413432a7a9f13962b || { echo RED_CANONICAL_RC_MOVED_REBASE_REQUIRED; exit 1; }
          EVIDENCE="$(gh run view 44385755396 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')"
          test "$EVIDENCE" = "271f6125ebe9031aa0ca1ed807c10ca417c695c1 success" || { echo RED_PARENT48_UNVERIFIED; exit 1; }
          mkdir -p artifacts/parent48
          gh run download 44385755396 --repo "$GITHUB_REPOSITORY" --name GQ8-REAL48-CURSE-LOBBYSHOP-PRIVATE-NOT-OFFICIAL --dir artifacts/parent48
          test -s artifacts/parent48/EGGRUMBLE_REAL48.project.json
          test -s artifacts/parent48/B_REAL48_INTAKE_RECEIPT.json
          test -s artifacts/parent48/EGGRUMBLE_REAL48.rbxlx
          echo GQ8_IMMUTABLE_ORIGINAL48_SOURCE_CI_PROVEN
      - name: Social/trade policy negative gate, preserve 48 and select unique 2 modules
        shell: bash
        run: |
          set -euo pipefail
          R=quality_gameplay/gq8_social_lobby_20261119
          python3 "$R/test_social50.py"
          python3 "$R/compose_social50.py" \
            --parent48 artifacts/parent48/EGGRUMBLE_REAL48.project.json \
            --receipt48 artifacts/parent48/B_REAL48_INTAKE_RECEIPT.json \
            --out artifacts/social50
          python3 - <<'PY'
          import sys,json,hashlib
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq8_successor_real48_shop_20261119")
          from compose_real48 import flatten
          original=Path("artifacts/parent48/EGGRUMBLE_REAL48.project.json")
          candidate=Path("artifacts/social50/EGGRUMBLE_REAL50.project.json")
          _,before=flatten(original);_,after=flatten(candidate)
          assert len(before)==48 and len(after)==50
          assert len(set(after)-set(before))==2
          for key,file in before.items():
            assert after[key].read_bytes()==file.read_bytes(),("parent source altered",key)
          assert all("GQ8" in "/".join(k) for k in set(after)-set(before))
          assert json.loads(Path("artifacts/social50/B_REAL50_RECEIPT.json").read_text())["trade_settlement_enabled"] is False
          print("GQ8_REAL48_PARENT_48_EXACT_BYTE_PRESERVATION_PASS")
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile all 50 actual Roblox Luau source modules
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8_social_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8_social_luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import sys,subprocess
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq8_successor_real48_shop_20261119")
          from compose_real48 import flatten
          for name,n in (("artifacts/parent48/EGGRUMBLE_REAL48.project.json",48),("artifacts/social50/EGGRUMBLE_REAL50.project.json",50)):
            _,source=flatten(Path(name))
            assert len(source)==n
            for script in source.values():
              subprocess.run(['/tmp/gq8_social_luau/luau-compile','--text',str(script)],check=True,stdout=subprocess.DEVNULL)
            print("GQ8_REAL50_NATIVE_SELECTED_COMPILATION_PASS",n)
          PY
      - name: Pinned Rojo7.7.1 Source/Class and byte-exact OFF48 Place
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq8social-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq8social-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq8social-rojo.zip') as z:
            a=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
            assert len(a)==1
            f=Path('/tmp/gq8social-rojo')
            f.write_bytes(z.read(a[0]));f.chmod(0o755)
          PY
          /tmp/gq8social-rojo build artifacts/social50/EGGRUMBLE_REAL50.project.json -o artifacts/social50/EGGRUMBLE_REAL50.rbxlx
          /tmp/gq8social-rojo build artifacts/parent48/EGGRUMBLE_REAL48.project.json -o artifacts/social50/OFF48.rbxlx
          cmp artifacts/social50/OFF48.rbxlx artifacts/parent48/EGGRUMBLE_REAL48.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/social50/EGGRUMBLE_REAL50.project.json \
            --place artifacts/social50/EGGRUMBLE_REAL50.rbxlx --count 50
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/parent48/EGGRUMBLE_REAL48.project.json \
            --place artifacts/social50/OFF48.rbxlx --count 48
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$CURRENT" = f77b4d4393d9e9b19b65566413432a7a9f13962b || { echo RED_CANONICAL_RC_MOVED_DURING_QA; exit 1; }
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path("artifacts/social50/EGGRUMBLE_REAL50.rbxlx")
          f=Path("artifacts/social50/B_REAL50_RECEIPT.json")
          x=json.loads(f.read_text())
          x.update({"private_head":os.environ["GITHUB_SHA"],
            "native_rojo_source_class":"PASS","off48_place_bytes_identical":"PASS",
            "private_place_bytes":p.stat().st_size,
            "private_place_sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
          f.write_text(json.dumps(x,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print("GQ8_LOBBY_SOCIAL50_TRUE_BUILD_PASS",p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-SOCIAL-TRADE-REAL50-PRIVATE-NOT-OFFICIAL
          path: artifacts/social50/
          retention-days: 5
          if-no-files-found: error
