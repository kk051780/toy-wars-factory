name: GQ470 low-cost realm color art REAL69 source PREP QA
on:
  pull_request:
    branches:
      - rc/p0d-s1-kids-rc01
    paths:
      - "quality_gameplay/gq470_lightgrade_real69_20261121/**"
      - ".github/workflows/gq470-lowcost-lightgrade-real69-prep.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pinned-real69-source-safety:
    name: Official 69 source-exact + rollback + mutations (NOT Studio)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download genuine formal same-head official artifact #14610422120
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/kk051780/toy-wars-factory/actions/artifacts/14610422120/zip" \
            -o /tmp/gq470-real69-official.zip
          unzip -t /tmp/gq470-real69-official.zip >/dev/null
          echo "BASE_ARTIFACT_BYTES=$(stat -c %s /tmp/gq470-real69-official.zip)"
      - name: Build one-client source candidate from authentic 69 sources
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq470_lightgrade_real69_20261121/patch_realm_color69.py \
            --artifact /tmp/gq470-real69-official.zip \
            --out /tmp/gq470-realm-grade-on69
      - name: Strict 69-route + OFF rollback + adversarial negative QA
        env:
          REAL69_ARTIFACT: /tmp/gq470-real69-official.zip
        run: |
          python3 -B -m unittest discover \
            -s quality_gameplay/gq470_lightgrade_real69_20261121 \
            -p "test_*.py" -v
      - name: Checkout pinned native Luau compiler sources
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile all 69 selected ON and OFF Luau sources
        run: |
          set -euo pipefail
          ON=/tmp/gq470-realm-grade-on69
          OFF=/tmp/gq470-realm-grade-off69
          cp -a "$ON" "$OFF"
          cp "$ON/OFF69_REALM_GRADE_ORIGINAL.client.luau" \
            "$OFF/sources/StarterPlayer/StarterPlayerScripts/EGGRUMBLE_RealmBattleControls.client.luau"
          cmake -S _pinned_luau -B /tmp/gq470-realm-luau -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-realm-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import pathlib,subprocess
          on=pathlib.Path("/tmp/gq470-realm-grade-on69/sources")
          off=pathlib.Path("/tmp/gq470-realm-grade-off69/sources")
          left={str(p.relative_to(on)):p for p in on.rglob("*.luau")}
          right={str(p.relative_to(off)):p for p in off.rglob("*.luau")}
          target="StarterPlayer/StarterPlayerScripts/EGGRUMBLE_RealmBattleControls.client.luau"
          assert len(left)==len(right)==69 and set(left)==set(right)
          assert {k for k in left if left[k].read_bytes()!=right[k].read_bytes()}=={target}
          for group in (left,right):
              for p in group.values():
                  subprocess.run(["/tmp/gq470-realm-luau/luau-compile","--text",str(p)],
                                 check=True,stdout=subprocess.DEVNULL)
          print("GQ470_REALM_NATIVE_LUAU_ON69_OFF69_PASS_SOURCE_ONLY")
          PY
      - name: Pinned Rojo ON/OFF real Place rebuild and byte-exact original
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            -o /tmp/gq470-realm-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-realm-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq470-realm-rojo.zip") as z:
              matches=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(matches)==1
              p=Path("/tmp/gq470-realm-rojo")
              p.write_bytes(z.read(matches[0]))
              p.chmod(0o755)
          with ZipFile("/tmp/gq470-real69-official.zip") as z:
              Path("/tmp/gq470-real69-original-place.rbxlx").write_bytes(
                  z.read("EGGRUMBLE_REAL69_PRIVATE.rbxlx"))
          PY
          /tmp/gq470-realm-rojo build /tmp/gq470-realm-grade-on69/EGGRUMBLE_REAL69.project.json \
            -o /tmp/gq470-realm-grade-on69/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          /tmp/gq470-realm-rojo build /tmp/gq470-realm-grade-off69/EGGRUMBLE_REAL69.project.json \
            -o /tmp/gq470-realm-grade-off69/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          cmp /tmp/gq470-realm-grade-off69/EGGRUMBLE_REAL69_PRIVATE.rbxlx \
            /tmp/gq470-real69-original-place.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project /tmp/gq470-realm-grade-on69/EGGRUMBLE_REAL69.project.json \
            --place /tmp/gq470-realm-grade-on69/EGGRUMBLE_REAL69_PRIVATE.rbxlx --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project /tmp/gq470-realm-grade-off69/EGGRUMBLE_REAL69.project.json \
            --place /tmp/gq470-realm-grade-off69/EGGRUMBLE_REAL69_PRIVATE.rbxlx --count 69
          echo "GQ470_REALM_ROJO_ON69_OFF69_REAL_PLACE_PASS_SOURCE_ONLY"
      - name: Cross-check 17 existing feature families and 48 historical flag inventory
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120")
          from verify_nonloss import project_scan
          sys.path.insert(0,"quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120")
          from verify_real69 import marker_check
          target="StarterPlayer/StarterPlayerScripts/EGGRUMBLE_RealmBattleControls"
          on=Path("/tmp/gq470-realm-grade-on69")
          off=Path("/tmp/gq470-realm-grade-off69")
          report=json.loads((on/"REALM_GRADE_PREP_REPORT.json").read_text())
          original=json.loads((on/"ORIGINAL_REAL69_RECEIPT.json").read_text())
          candidate=json.loads(json.dumps(original))
          candidate["source_hashes"][target]=report["candidate_source_sha256"]
          candidate["candidate_type"]="GQ470_REALM_GRADE_A_SOURCE_NOT_FORMAL"
          candidate["canonical_formal_head_unchanged"]=report["formal_base_sha"]
          (on/"REAL69_LEGACY_INTAKE_RECEIPT.json").write_text(
              json.dumps(candidate,sort_keys=True,indent=2)+"\n")
          (off/"REAL69_LEGACY_INTAKE_RECEIPT.json").write_text(
              json.dumps(original,sort_keys=True,indent=2)+"\n")
          a=project_scan(on,"EGGRUMBLE_REAL69.project.json")
          b=project_scan(off,"EGGRUMBLE_REAL69.project.json")
          assert len(a)==len(b)==69
          assert {k for k in a if a[k]["sha256"]!=b[k]["sha256"]}=={target}
          am,bm=marker_check(a),marker_check(b)
          assert len(am)==len(bm)==17 and am==bm
          print("GQ470_REALM_SOURCE_FAMILIES_17_ON_OFF_UNCHANGED_PASS")
          PY
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py \
            --base /tmp/gq470-realm-grade-on69 \
            --report /tmp/gq470-realm-grade-on69/REALM_GRADE_LEGACY48_ON.json
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py \
            --base /tmp/gq470-realm-grade-off69 \
            --report /tmp/gq470-realm-grade-on69/REALM_GRADE_LEGACY48_OFF.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/gq470-realm-grade-on69")
          a=json.loads((p/"REALM_GRADE_LEGACY48_ON.json").read_text())
          b=json.loads((p/"REALM_GRADE_LEGACY48_OFF.json").read_text())
          assert a["summary"]==b["summary"]=={
              "MARKER_SOURCE_PRESENT":15,
              "SOURCE_ANALOGUE_ONLY":27,
              "EVIDENCE_GAP":4,
              "NON_RUNTIME_LEGACY_FLAG":2,
          }
          assert a["all_48_semantic_parity"]==b["all_48_semantic_parity"]=="NOT_PROVEN"
          print("GQ470_REALM_LEGACY48_SOURCE_ON_OFF_ACCOUNTING_PASS_SEMANTICS_NOT_PROVEN")
          PY
      - name: Upload exact candidate sources for authenticated B review
        uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-REALM-GRADE-SOURCE-ONLY
          path: /tmp/gq470-realm-grade-on69/
          retention-days: 3
          if-no-files-found: error
      - name: Print evidence truth boundary
        run: |
          echo "A_REAL69_SOURCE_AND_ROLLBACK_CANDIDATE=YES_IF_GREEN"
          echo "NATIVE_LUAU_ON69_OFF69=PASS_SOURCE_ONLY_IF_GREEN"
          echo "ROJO_ON_OFF_PLACE_ROLLBACK=PASS_SOURCE_ONLY_IF_GREEN"
          echo "STUDIO_SOLO_2CLIENT=NOT_TESTED"
          echo "ANDROID_15MIN_HUMAN_ART=NOT_TESTED"
          echo "LEGACY17_48_SOURCE=PASS_SOURCE_ONLY_IF_GREEN; SEMANTICS=NOT_PROVEN"
          echo "OFFICIAL_RC_ADOPTED=NO"
