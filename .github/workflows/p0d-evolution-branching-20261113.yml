name: P0D EGG RUMBLE owned evolution policy native and studio source QA
on:
  push:
    branches:
      - feature/p0d-evolution-branching-pure-20261113-01
  pull_request:
    branches:
      - feature/p0d-power-fantasy-policy-20261113-01
      - feature/p0d-evolution-formdex-qa-base-20261113-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-evolution-source-qa:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ROOT: handoffs/P0D-EVOLUTION-BRANCHING-20261113-01
      BASE: 5e18a52e1e74f10cc1b85ac3b60f695e064bb088
    steps:
      - name: Checkout source without write token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject unauthorized H1/RC/other feature changes
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE^{commit}"
          while IFS= read -r path; do
            case "$path" in
              handoffs/P0D-EVOLUTION-BRANCHING-20261113-01/*|.github/workflows/p0d-evolution-branching-20261113.yml)
                echo "OWN_FILE $path";;
              *) echo "PROTECTED_OR_COLLIDING_PATH $path" >&2; exit 1;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          test -f "$ROOT/src/EvolutionRules.luau"
          if grep -r -E 'MarketplaceService|ProcessReceipt|DataStoreService|RemoteEvent|game:GetService|TakeDamage' "$ROOT/src"; then
            echo "PURE_POLICY_MUTATED_WITH_LIVE_GAME_OR_PAYMENT" >&2
            exit 1
          fi
      - name: Execute original pure-source Studio gate static tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s "$ROOT/tests" -p test_project_static.py -v
          python3 -B -m unittest discover -s "$ROOT/tests" -p test_evolution_battle_static.py -v
          python3 -B -m unittest discover -s "$ROOT/tests" -p test_formdex_static.py -v
      - name: Checkout pinned native Luau source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_evolution_native
          fetch-depth: 1
          persist-credentials: false
      - name: Build pinned native Luau VM and compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_evolution_native rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_evolution_native -B /tmp/p0d_evolution_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_evolution_native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
      - name: Native compile full gallery and execute true original module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_evolution_logs
          /tmp/p0d_evolution_native/luau-compile "$ROOT/demo/EvolutionGallery.server.luau" >/dev/null
          /tmp/p0d_evolution_native/luau-compile "$ROOT/demo/EvolutionGalleryCamera.client.luau" >/dev/null
          /tmp/p0d_evolution_native/luau-compile "$ROOT/battle/EvolutionCombat.server.luau" >/dev/null
          /tmp/p0d_evolution_native/luau-compile "$ROOT/battle/EvolutionCombat.client.luau" >/dev/null
          python3 -B "$ROOT/tests/run_native_evolution.py" --luau /tmp/p0d_evolution_native/luau --compiler /tmp/p0d_evolution_native/luau-compile | tee /tmp/p0d_evolution_logs/EVOLUTION_NATIVE_TEST_LOG.txt
          grep -E '^P0D_EVOLUTION_ORIGINAL_NATIVE_PASS_[0-9]+
      - name: Obtain PINNED Rojo 7.7.1 binary for two unpublished Studio Places
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_evolution_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_evolution_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import zipfile,stat
          from pathlib import Path
          with zipfile.ZipFile('/tmp/p0d_evolution_rojo.zip') as z:
              names=[p for p in z.namelist() if p.split('/')[-1]=='rojo']
              assert len(names)==1,names
              p=Path('/tmp/p0d_evolution_rojo')
              p.write_bytes(z.read(names[0]))
              p.chmod(p.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_evolution_rojo --version | grep -F 7.7.1
      - name: Build BOTH isolated Studio-only evolution galleries from real Luau source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_evolution_logs
          /tmp/p0d_evolution_rojo build "$ROOT/default.project.json" -o /tmp/p0d_evolution_logs/EVOLUTION_GALLERY_PRIVATE_UNPUBLISHED.rbxlx
          /tmp/p0d_evolution_rojo build "$ROOT/battle.project.json" -o /tmp/p0d_evolution_logs/EVOLUTION_PVE_BATTLE_PRIVATE_UNPUBLISHED.rbxlx
          test -s /tmp/p0d_evolution_logs/EVOLUTION_GALLERY_PRIVATE_UNPUBLISHED.rbxlx
          test -s /tmp/p0d_evolution_logs/EVOLUTION_PVE_BATTLE_PRIVATE_UNPUBLISHED.rbxlx
      - name: Verify real Rojo XML contains every original exact Luau source and one isolated server
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,json,collections,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          out=Path('/tmp/p0d_evolution_logs')
          cases=[
            ('EVOLUTION_GALLERY_PRIVATE_UNPUBLISHED.rbxlx',
             ['demo/EvolutionGallery.server.luau','demo/EvolutionGalleryCamera.client.luau'],
             {'Script':1,'LocalScript':1}),
            ('EVOLUTION_PVE_BATTLE_PRIVATE_UNPUBLISHED.rbxlx',
             ['src/EvolutionRules.luau','src/EvolutionFormDex.luau','battle/EvolutionCombat.server.luau','battle/EvolutionCombat.client.luau'],
             {'Script':1,'LocalScript':1,'ModuleScript':2})
          ]
          summary=[]
          for filename,sourcePaths,expectedClasses in cases:
              place=out/filename
              originals=collections.Counter((root/p).read_text(encoding='utf-8') for p in sourcePaths)
              compiled=[];classes=collections.Counter()
              for item in ET.fromstring(place.read_bytes()).iter('Item'):
                  cl=item.get('class')
                  if cl not in ('Script','LocalScript','ModuleScript'):continue
                  element=item.find("./Properties/string[@name='Source']")
                  if element is None: continue
                  classes[cl]+=1
                  compiled.append(element.text or '')
              assert classes==expectedClasses,(filename,classes,expectedClasses)
              assert len(compiled)==len(sourcePaths),(filename,len(compiled),sourcePaths)
              assert collections.Counter(compiled)==originals,filename+' SOURCE_BYTES_DIFFER'
              digest=hashlib.sha256(place.read_bytes()).hexdigest()
              summary.append(dict(file=filename,sha256=digest,
                bytes=place.stat().st_size,scriptCount=len(compiled),
                sourceExact=True,unpublished=True,engineTested=False,
                phoneTested=False,humanFunAccepted=False))
              print('REAL_ROJO_SOURCE_EXACT_PASS',filename,len(compiled),'SHA256',digest)
          (out/'EVOLUTION_SOURCE_TRUTH.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY
      - name: Publish test truth log (not a Roblox gameplay PASS)
        uses: actions/upload-artifact@v4
        with:
          name: P0D_ORIGINAL_EVOLUTION_NATIVE_POLICY_ONLY_NO_STUDIO
          path: |
            /tmp/p0d_evolution_logs/EVOLUTION_NATIVE_TEST_LOG.txt
            /tmp/p0d_evolution_logs/FORM_DEX_NATIVE_TEST_LOG.txt
            /tmp/p0d_evolution_logs/EVOLUTION_SOURCE_TRUTH.json
            /tmp/p0d_evolution_logs/EVOLUTION_GALLERY_PRIVATE_UNPUBLISHED.rbxlx
            /tmp/p0d_evolution_logs/EVOLUTION_PVE_BATTLE_PRIVATE_UNPUBLISHED.rbxlx
          retention-days: 7
          if-no-files-found: error
 /tmp/p0d_evolution_logs/EVOLUTION_NATIVE_TEST_LOG.txt
          python3 -B "$ROOT/tests/run_native_formdex.py" --luau /tmp/p0d_evolution_native/luau --compiler /tmp/p0d_evolution_native/luau-compile | tee /tmp/p0d_evolution_logs/FORM_DEX_NATIVE_TEST_LOG.txt
          grep -E '^P0D_FORM_DEX_NATIVE_PASS_[0-9]+
      - name: Obtain PINNED Rojo 7.7.1 binary for two unpublished Studio Places
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_evolution_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_evolution_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import zipfile,stat
          from pathlib import Path
          with zipfile.ZipFile('/tmp/p0d_evolution_rojo.zip') as z:
              names=[p for p in z.namelist() if p.split('/')[-1]=='rojo']
