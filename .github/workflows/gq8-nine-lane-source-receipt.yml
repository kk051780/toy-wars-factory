name: GQ8 independent nine-lane source receipt no false game acceptance
on:
  push:
    branches: [quality/gq8-nine-lane-source-readiness-20261119-0530]
    paths:
      - 'quality_gameplay/gq8_nine_lane_intake_20261119/**'
      - '.github/workflows/gq8-nine-lane-source-receipt.yml'
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_nine_lane_intake_20261119/**'
      - '.github/workflows/gq8-nine-lane-source-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-verify-real53-nine-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact existing parent and canonical RC remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = f77b4d4393d9e9b19b65566413432a7a9f13962b || { echo "RED_FORMAL_RC_REBASE"; exit 1; }
          test "$(gh run view 44390823718 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')" = "96ac3b4caa2f649f98c9e093c864c39555f3616a success" || { echo "RED_PARENT_CI_DRIFT"; exit 1; }
          mkdir -p artifacts/parent53 artifacts/nine_lanes
          gh run download 44390823718 --repo "$GITHUB_REPOSITORY" --name GQ8-REAL53-MUSOU-INVUL-CURSE-SHOP-PRIVATE-NOT-OFFICIAL --dir artifacts/parent53
          test -s artifacts/parent53/EGGRUMBLE_REAL53.project.json
          test -s artifacts/parent53/B_REAL53_INTAKE_RECEIPT.json
      - name: Python hostile negative checks and evidence-only nine-pillar audit
        shell: bash
        run: |
          set -euo pipefail
          P=quality_gameplay/gq8_nine_lane_intake_20261119
          python3 -B "$P/test_verify_integrated_sources.py"
          python3 -B "$P/verify_integrated_sources.py" \
            --project artifacts/parent53/EGGRUMBLE_REAL53.project.json \
            --receipt artifacts/parent53/B_REAL53_INTAKE_RECEIPT.json \
            --output artifacts/nine_lanes/REAL53_NINE_LANE_SOURCE_ONLY_RECEIPT.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/nine_lanes/REAL53_NINE_LANE_SOURCE_ONLY_RECEIPT.json").read_text())
          assert r["source_count"]==53 and r["evidenced_lanes_source_only"]==9
          assert r["evidenced_lanes_actual_studio"]==0
          assert r["official_rc_adopted"] is False
          print("GQ8_NINE_LANE_RECEIPT_NOT_STUDIO_OR_RC_ACCEPTANCE_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-NINE-LANE-REAL53-EVIDENCE-ONLY-NOT-OFFICIAL
          path: artifacts/nine_lanes/
          retention-days: 5
          if-no-files-found: error
