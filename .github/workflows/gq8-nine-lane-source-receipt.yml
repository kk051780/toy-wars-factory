name: GQ8 independent nine-domain Real59 actual Place source audit
on:
  push:
    branches:
      - quality/gq8-nine-lane-source-readiness-20261119-0530
      - rc/p0d-s1-kids-rc01
    paths:
      - 'quality_gameplay/gq8_nine_lane_intake_20261119/**'
      - '.github/workflows/gq8-nine-lane-source-receipt.yml'
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_nine_lane_intake_20261119/**'
      - '.github/workflows/gq8-nine-lane-source-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-real59-nine-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REAL59_HEAD: 38d11f0bf311491ba76fe03f818948e5d4b06889
      REAL59_RUN: '44401178585'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate exact latest source-selected Real59 and OFF55 build
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$CURRENT" = "$REAL59_HEAD" || { echo RED_STALE_RC_PR_RECONCILE; exit 1; }
          elif [ "$GITHUB_REF" = refs/heads/rc/p0d-s1-kids-rc01 ]; then
            test "$CURRENT" = "$GITHUB_SHA" || { echo RED_NOT_SAME_HEAD; exit 1; }
          else
            test "$CURRENT" = "$REAL59_HEAD" || { echo RED_AUTHOR_BRANCH_STALE; exit 1; }
          fi
          VERIFIED="$(gh run view "$REAL59_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')"
          test "$VERIFIED" = "$REAL59_HEAD success" || { echo RED_UNVERIFIED_FORMAL_59; exit 1; }
          mkdir -p artifacts/official59 artifacts/nine_lanes
          gh run download "$REAL59_RUN" --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL59-HUD-MAP-CANONICAL-PRIVATE-STUDIO \
            --dir artifacts/official59
          test -s artifacts/official59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx
          test -s artifacts/official59/EGGRUMBLE_OFF55_PRIVATE.rbxlx
          test -s artifacts/official59/GQ828_REAL59_RECEIPT.json
      - name: Assert exact 59 source scripts, actual 55-script OFF Place and nine domains
        shell: bash
        run: |
          set -euo pipefail
          P=quality_gameplay/gq8_nine_lane_intake_20261119
          python3 -B "$P/verify_real59.py" \
            --place59 artifacts/official59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            --off55 artifacts/official59/EGGRUMBLE_OFF55_PRIVATE.rbxlx \
            --receipt artifacts/official59/GQ828_REAL59_RECEIPT.json \
            --expected-head "$REAL59_HEAD" \
            --output artifacts/nine_lanes/REAL59_NINE_DOMAIN_SOURCE_EVIDENCE.json
          python3 -B "$P/test_real59_negative.py" \
            --place59 artifacts/official59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            --off55 artifacts/official59/EGGRUMBLE_OFF55_PRIVATE.rbxlx \
            --receipt artifacts/official59/GQ828_REAL59_RECEIPT.json \
            --expected-head "$REAL59_HEAD"
          python3 - <<'PY'
          import json
          from pathlib import Path
          f=Path("artifacts/nine_lanes/REAL59_NINE_DOMAIN_SOURCE_EVIDENCE.json")
          a=json.loads(f.read_text())
          assert a["source_count"] == 59
          assert a["parent_exact_source_count"] == 55
          assert a["nine_source_domains_selected"] == 9
          assert a["nine_studio_domains_verified"] == 0
          assert a["product_go"] is False
          print("GQ8_REAL59_INDEPENDENT_9_LANES_SOURCE_ONLY_PASS_NO_PRODUCT_CLAIM")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-NINE-DOMAIN-FORMAL-REAL59-SOURCE-EVIDENCE-ONLY
          path: artifacts/nine_lanes/
          retention-days: 5
          if-no-files-found: error
