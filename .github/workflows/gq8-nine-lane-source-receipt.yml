name: GQ8 independent official Real59 nine-domain source and Host audit
on:
  push:
    branches:
      - quality/gq8-nine-lane-source-readiness-20261119-0530
      - rc/p0d-s1-kids-rc01
    paths:
      - 'quality_gameplay/gq8_nine_lane_intake_20261119/**'
      - '.github/workflows/gq8-nine-lane-source-receipt.yml'
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_nine_lane_intake_20261119/**'
      - '.github/workflows/gq8-nine-lane-source-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-real59-nine-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REAL59_PARENT: 38d11f0bf311491ba76fe03f818948e5d4b06889
      REAL59_PARENT_RUN: '44401178585'
      ACTIVE_HEAD: 5a47e96f6b4766a9c59dd06b111bea53b73bd5ca
      ACTIVE_RUN: '44403496549'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact official parent and Host-fix active head
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)"
          if [ "$GITHUB_REF" = refs/heads/rc/p0d-s1-kids-rc01 ]; then
            test "$CURRENT" = "$GITHUB_SHA" || { echo RED_NOT_SAME_HEAD; exit 1; }
          else
            test "$CURRENT" = "$ACTIVE_HEAD" || { echo RED_RC_MOVED_REBASE_REQUIRED; exit 1; }
          fi
          test "$(gh run view "$REAL59_PARENT_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')" = "$REAL59_PARENT success"
          test "$(gh run view "$ACTIVE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')" = "$ACTIVE_HEAD success"
          mkdir -p artifacts/official59 artifacts/host59 artifacts/nine_lanes
          gh run download "$REAL59_PARENT_RUN" --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL59-HUD-MAP-CANONICAL-PRIVATE-STUDIO \
            --dir artifacts/official59
          gh run download "$ACTIVE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name GQ8-REAL59-HOST-ACTIVE-NOT-OFFICIAL \
            --dir artifacts/host59
          test -s artifacts/official59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx
          test -s artifacts/official59/EGGRUMBLE_OFF55_PRIVATE.rbxlx
          test -s artifacts/official59/GQ828_REAL59_RECEIPT.json
          test -s artifacts/host59/EGGRUMBLE_REAL59_HOST_ACTIVE.rbxlx
          test -s artifacts/host59/OFF59.rbxlx
          test -s artifacts/host59/HOST_ACTIVE_RECEIPT.json
      - name: Verify 9 domains, true 59 Luau, Host startup class and 7 negative mutations
        shell: bash
        run: |
          set -euo pipefail
          P=quality_gameplay/gq8_nine_lane_intake_20261119
          python3 -B "$P/verify_real59.py" \
            --place59 artifacts/official59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            --off55 artifacts/official59/EGGRUMBLE_OFF55_PRIVATE.rbxlx \
            --receipt artifacts/official59/GQ828_REAL59_RECEIPT.json \
            --expected-head "$REAL59_PARENT" \
            --output artifacts/nine_lanes/REAL59_NINE_DOMAIN_SOURCE_EVIDENCE.json
          python3 -B "$P/test_real59_negative.py" \
            --place59 artifacts/official59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            --off55 artifacts/official59/EGGRUMBLE_OFF55_PRIVATE.rbxlx \
            --receipt artifacts/official59/GQ828_REAL59_RECEIPT.json \
            --expected-head "$REAL59_PARENT"
          python3 -B "$P/verify_real59_host.py" \
            --original artifacts/official59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            --active artifacts/host59/EGGRUMBLE_REAL59_HOST_ACTIVE.rbxlx \
            --rollback artifacts/host59/OFF59.rbxlx \
            --receipt artifacts/host59/HOST_ACTIVE_RECEIPT.json \
            --expected-head "$ACTIVE_HEAD" \
            --output artifacts/nine_lanes/REAL59_HOST_CLASS_SOURCE_EVIDENCE.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          a=json.loads(Path("artifacts/nine_lanes/REAL59_NINE_DOMAIN_SOURCE_EVIDENCE.json").read_text())
          b=json.loads(Path("artifacts/nine_lanes/REAL59_HOST_CLASS_SOURCE_EVIDENCE.json").read_text())
          assert a["source_count"]==59 and a["nine_source_domains_selected"]==9
          assert b["source_bytes_unchanged"]==59 and b["host_script_class"]=="Script"
          assert a["nine_studio_domains_verified"]==0 and b["product_go"] is False
          print("GQ8_REAL59_SOURCES_AND_HOST_CLASS_NINE_DOMAIN_NO_FAKE_PRODUCT_GO_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-NINE-DOMAIN-REAL59-HOST-SOURCE-EVIDENCE-ONLY
          path: artifacts/nine_lanes/
          retention-days: 5
          if-no-files-found: error
