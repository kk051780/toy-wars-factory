name: GQ8 independent official Real62 nine-domain source and Host audit
on:
  push:
    branches:
      - quality/gq8-nine-lane-source-readiness-20261119-0530
      - rc/p0d-s1-kids-rc01
    paths:
      - 'quality_gameplay/gq8_nine_lane_intake_20261119/**'
      - '.github/workflows/gq8-nine-lane-source-receipt.yml'
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_nine_lane_intake_20261119/**'
      - '.github/workflows/gq8-nine-lane-source-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-nine-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL59_HEAD: 38d11f0bf311491ba76fe03f818948e5d4b06889
      ORIGINAL59_RUN: '44401178585'
      ACTIVE59_HEAD: 5a47e96f6b4766a9c59dd06b111bea53b73bd5ca
      ACTIVE59_RUN: '44403496549'
      REAL62_HEAD: b15db4b9ad1f1f4c1f02fb0976eb3c2f6db8a6ff
      REAL62_RUN: '44404334603'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin newest sole official RC and three verified independent parent artifacts
        shell: bash
        run: |
          set -euo pipefail
          LIVE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)"
          if [ "$GITHUB_REF" = refs/heads/rc/p0d-s1-kids-rc01 ]; then
            test "$LIVE" = "$GITHUB_SHA" || { echo RED_OFFICIAL_SHA_MOVED; exit 1; }
          else
            test "$LIVE" = "$REAL62_HEAD" || { echo RED_NEWER_OFFICIAL_RC_RECONCILE; exit 1; }
          fi
          for item in "$ORIGINAL59_RUN:$ORIGINAL59_HEAD" "$ACTIVE59_RUN:$ACTIVE59_HEAD" "$REAL62_RUN:$REAL62_HEAD"; do
            ID="${item%%:*}"; EXPECTED="${item#*:}"
            test "$(gh run view "$ID" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')" = "$EXPECTED success" || { echo RED_UNVERIFIED_FORMAL_SOURCE_PARENT_"$ID"; exit 1; }
          done
          mkdir -p artifacts/source59 artifacts/host59 artifacts/real62 artifacts/evidence
          gh run download "$ORIGINAL59_RUN" --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL59-HUD-MAP-CANONICAL-PRIVATE-STUDIO --dir artifacts/source59
          gh run download "$ACTIVE59_RUN" --repo "$GITHUB_REPOSITORY" \
            --name GQ8-REAL59-HOST-ACTIVE-NOT-OFFICIAL --dir artifacts/host59
          gh run download "$REAL62_RUN" --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL62-HUD-TRADE-PRIVATE-STUDIO --dir artifacts/real62
          for file in \
            artifacts/source59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            artifacts/source59/EGGRUMBLE_OFF55_PRIVATE.rbxlx \
            artifacts/source59/GQ828_REAL59_RECEIPT.json \
            artifacts/host59/EGGRUMBLE_REAL59_HOST_ACTIVE.rbxlx \
            artifacts/host59/OFF59.rbxlx \
            artifacts/host59/HOST_ACTIVE_RECEIPT.json \
            artifacts/real62/EGGRUMBLE_REAL62.rbxlx \
            artifacts/real62/OFF59.rbxlx \
            artifacts/real62/B_REAL62_RECEIPT.json; do test -s "$file"; done
      - name: Verify exact source evolution 55 to 59 to Host-active 59 to 62, 14 adversarial mutations
        shell: bash
        run: |
          set -euo pipefail
          P=quality_gameplay/gq8_nine_lane_intake_20261119
          python3 -B "$P/verify_real59.py" \
            --place59 artifacts/source59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            --off55 artifacts/source59/EGGRUMBLE_OFF55_PRIVATE.rbxlx \
            --receipt artifacts/source59/GQ828_REAL59_RECEIPT.json \
            --expected-head "$ORIGINAL59_HEAD" --output artifacts/evidence/REAL59.json
          python3 -B "$P/test_real59_negative.py" \
            --place59 artifacts/source59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            --off55 artifacts/source59/EGGRUMBLE_OFF55_PRIVATE.rbxlx \
            --receipt artifacts/source59/GQ828_REAL59_RECEIPT.json \
            --expected-head "$ORIGINAL59_HEAD"
          python3 -B "$P/verify_real59_host.py" \
            --original artifacts/source59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            --active artifacts/host59/EGGRUMBLE_REAL59_HOST_ACTIVE.rbxlx \
            --rollback artifacts/host59/OFF59.rbxlx \
            --receipt artifacts/host59/HOST_ACTIVE_RECEIPT.json \
            --expected-head "$ACTIVE59_HEAD" \
            --output artifacts/evidence/HOST59.json
          python3 -B "$P/verify_real62.py" \
            --active59 artifacts/host59/EGGRUMBLE_REAL59_HOST_ACTIVE.rbxlx \
            --real62 artifacts/real62/EGGRUMBLE_REAL62.rbxlx \
            --off59 artifacts/real62/OFF59.rbxlx \
            --receipt artifacts/real62/B_REAL62_RECEIPT.json \
            --expected-head "$REAL62_HEAD" --output artifacts/evidence/REAL62.json
          python3 -B "$P/test_real62_negative.py" \
            --active59 artifacts/host59/EGGRUMBLE_REAL59_HOST_ACTIVE.rbxlx \
            --real62 artifacts/real62/EGGRUMBLE_REAL62.rbxlx \
            --off59 artifacts/real62/OFF59.rbxlx \
            --receipt artifacts/real62/B_REAL62_RECEIPT.json \
            --expected-head "$REAL62_HEAD"
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("artifacts/evidence/REAL62.json").read_text())
          assert a["source_count"]==62 and a["original_exact_count"]==59
          assert a["nine_source_domains"]==9 and a["nine_studio_domains"]==0
          assert a["host_class"]=="Script" and a["product_go"] is False
          assert a["paid_inventory_transfer"] is False
          print("GQ8_INDEPENDENT_REAL62_9_DOMAIN_14_MUTATIONS_NO_FAKE_PRODUCT_GO_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-NINE-DOMAIN-FORMAL-REAL62-SOURCE-EVIDENCE-ONLY
          path: artifacts/evidence/
          retention-days: 5
          if-no-files-found: error
