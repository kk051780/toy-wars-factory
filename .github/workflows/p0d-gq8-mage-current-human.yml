name: P0D GQ8 Original Mage Revive Current-Human Stale Match Fence QA
on:
  push:
    branches: ['quality/gq8-mage-current-human-fence-20261118']
    paths:
      - 'quality_gameplay/gq8_mage_current_human_fence_20261118/**'
      - '.github/workflows/p0d-gq8-mage-current-human.yml'
  pull_request:
    branches: ['rc/p0d-s1-kids-rc01']
    paths:
      - 'quality_gameplay/gq8_mage_current_human_fence_20261118/**'
      - '.github/workflows/p0d-gq8-mage-current-human.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real32-mage-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 2f4c1e43a7802929de3f633370b32791f7bf8d96
          path: _mage777
          persist-credentials: false
      - name: Original Mage source pin + harmful mutation probes
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -v -s quality_gameplay/gq8_mage_current_human_fence_20261118 -p 'test_*.py'
      - name: Pin genuine original31 completed official RC source and commit
        id: official
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow p0d-rc-eggrumble-v3-31.yml \
            --branch rc/p0d-s1-kids-rc01 --limit 70 \
            --json databaseId,headSha,status,conclusion > /tmp/official31.json
          RUN="$(jq -r '[.[]|select(.status=="completed" and .conclusion=="success")][0].databaseId // empty' /tmp/official31.json)"
          H="$(jq -r '[.[]|select(.status=="completed" and .conclusion=="success")][0].headSha // empty' /tmp/official31.json)"
          test -n "$RUN"
          [[ "$H" =~ ^[0-9a-f]{40}$ ]]
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$H" = "$CURRENT" || { echo RED_STALE_OFFICIAL_MAGE_RC_HEAD; exit 1; }
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$H" >> "$GITHUB_OUTPUT"
      - name: Download the immutable canonical V3 31-source Place and receipt
        run: |
          set -euo pipefail
          mkdir -p artifacts/official
          gh run download "${{ steps.official.outputs.run }}" --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-RC31-CANONICAL-COMPANION-STUDIO \
            --dir artifacts/official
          test -s artifacts/official/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx
          test -s artifacts/official/gq515_official_select/GQ510_MAGE_SELECTED31.project.json
          test -s artifacts/official/gq530_all31/EGGRUMBLE_V3_OFFICIAL_RC31_RECEIPT.json
      - name: Extract genuine31, compose original-Host-lane Mage32 and inverse OFF31
        run: |
          set -euo pipefail
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py extract \
            --place artifacts/official/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx \
            --template artifacts/official/gq515_official_select/GQ510_MAGE_SELECTED31.project.json \
            --receipt artifacts/official/gq530_all31/EGGRUMBLE_V3_OFFICIAL_RC31_RECEIPT.json \
            --out artifacts/current31 --head "${{ steps.official.outputs.sha }}"
          python3 _mage777/handoffs/EGGRUMBLE-MAGE-REVIVE-20261118/compose_mage32.py \
            --current31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json \
            --out artifacts/mage32/MAGE32.project.json
          python3 quality_gameplay/gq8_mage_current_human_fence_20261118/compose_fence.py \
            --original31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json \
            --mage32 artifacts/mage32/MAGE32.project.json \
            --original_mage _mage777/handoffs/EGGRUMBLE-MAGE-REVIVE-20261118/EGGRUMBLE_MageRevive.luau \
            --out artifacts/mage_fenced32/FENCED32.project.json
          python3 quality_gameplay/gq8_mage_current_human_fence_20261118/make_member_vm.py \
            --source artifacts/mage_fenced32/EGGRUMBLE_MageRevive_CurrentHuman.luau \
            --harness _mage777/handoffs/EGGRUMBLE-MAGE-REVIVE-20261118/make_mage_vm.py \
            --out /tmp/member-vm
          python3 _mage777/handoffs/EGGRUMBLE-MAGE-REVIVE-20261118/compose_mage32.py \
            --current31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json \
            --out artifacts/mage32/OFF31.project.json --off
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile real32 and OFF31; run source-derived native Luau and mutant-RED
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8-mage-luau -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8-mage-luau --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          CLI=/tmp/gq8-mage-luau/luau
          CC=/tmp/gq8-mage-luau/luau-compile
          "$CC" --text /tmp/member-vm/good.luau >/dev/null
          "$CC" --text /tmp/member-vm/target_mutant.luau >/dev/null
          "$CC" --text /tmp/member-vm/healer_mutant.luau >/dev/null
          "$CLI" /tmp/member-vm/good.luau | tee /tmp/member-good.log
          grep -qx GQ8_MAGE_REVIVE_REAL_VM_TEAM_CROSS_TEAM_LOS_COOLDOWN_60S_PASS /tmp/member-good.log
          if "$CLI" /tmp/member-vm/target_mutant.luau >/tmp/member-target.log 2>&1; then
            echo RED_STALE_TARGET_MUTANT_ACCEPTED
            exit 1
          fi
          grep -q RED_STALE_TARGET_DOWNED /tmp/member-target.log
          if "$CLI" /tmp/member-vm/healer_mutant.luau >/tmp/member-healer.log 2>&1; then
            echo RED_STALE_HEALER_MUTANT_ACCEPTED
            exit 1
          fi
          grep -q RED_STALE_HEALER_REVIVE /tmp/member-healer.log
          echo GQ8_MAGE_CURRENT_HUMAN_TARGET_HEALER_NATIVE_MUTANTS_RED_PASS
          python3 - <<'PY'
          from pathlib import Path
          import sys,subprocess
          sys.path.insert(0,"_mage777/handoffs/EGGRUMBLE-MAGE-REVIVE-20261118")
          from compose_mage32 import files
          for path,count in (("artifacts/mage_fenced32/FENCED32.project.json",32),
                             ("artifacts/mage32/OFF31.project.json",31)):
              _,source=files(Path(path))
              assert len(source)==count,(path,len(source))
              for s in source.values():
                  subprocess.run(["/tmp/gq8-mage-luau/luau-compile","--text",str(s)],
                                 check=True,stdout=subprocess.DEVNULL)
              print("GQ8_MAGE_NATIVE_ACTUAL",count)
          PY
      - name: Install SHA-256 pinned Rojo 7.7.1
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/mage-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/mage-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/mage-rojo.zip') as z:
              found=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(found)==1
              dest=Path('/tmp/mage-rojo')
              dest.write_bytes(z.read(found[0]))
              dest.chmod(0o755)
          PY
      - name: Real Rojo32 and inverse31 Class + Source exact, pin drift status
        run: |
          set -euo pipefail
          /tmp/mage-rojo build artifacts/mage_fenced32/FENCED32.project.json -o artifacts/mage_fenced32/FENCED32.rbxlx
          /tmp/mage-rojo build artifacts/mage32/OFF31.project.json -o artifacts/mage32/OFF31.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/mage_fenced32/FENCED32.project.json \
            --place artifacts/mage_fenced32/FENCED32.rbxlx --count 32
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/mage32/OFF31.project.json \
            --place artifacts/mage32/OFF31.rbxlx --count 31
          NOW="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$NOW" = "${{ steps.official.outputs.sha }}" || { echo RED_RC_MOVED_DURING_MEMBER_QA; exit 1; }
          echo GQ8_MAGE_CURRENT_HUMAN_NATIVE32_ROJO32_OFF31_AND_MUTANTS_SUCCESS
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-MAGE-SESSION-FENCE32-PREP-NOT-OFFICIAL
          path: |
            artifacts/mage32/
            artifacts/mage_fenced32/
            artifacts/current31/CURRENT31_REAL_SOURCE_RECEIPT.json
          retention-days: 3
          if-no-files-found: error
