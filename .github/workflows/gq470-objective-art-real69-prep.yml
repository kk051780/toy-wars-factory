name: GQ470 REAL69 objective landmark art source PREP (not formal RC)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_objective_art_real69_20261120/**'
      - '.github/workflows/gq470-objective-art-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  objective-art-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact official 69-source input and patch negative cases
        run: |
          set -euo pipefail
          python3 -m py_compile quality_gameplay/gq470_objective_art_real69_20261120/patch_objective69.py
          python3 -B quality_gameplay/gq470_objective_art_real69_20261120/patch_objective69.py --self-test
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44691719095 --jq '.head_sha+" "+.conclusion')" = "da5ca812b4852f78ffd54a49617e7d4cede75d15 success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = 'da5ca812b4852f78ffd54a49617e7d4cede75d15' || { echo RED_STALE_RC; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test "$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")" = 'da5ca812b4852f78ffd54a49617e7d4cede75d15' || { echo RED_STALE_PR; exit 1; }
          fi
          mkdir -p /tmp/gq470-objective
          gh run download 44691719095 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir /tmp/gq470-objective
          python3 -B quality_gameplay/gq470_objective_art_real69_20261120/patch_objective69.py --base /tmp/gq470-objective
          test -s /tmp/gq470-objective/EGGRUMBLE_REAL69_PRIVATE.rbxlx
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native compile ON69 OFF69 and preserve other 68 routes
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-obj-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-obj-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq470_objective_art_real69_20261120')
          from patch_objective69 import selected,TARGET
          root=Path('/tmp/gq470-objective')
          on=selected(root);off=selected(root/'off69_objective')
          assert len(on)==len(off)==69 and set(on)==set(off)
          assert {p for p in on if on[p].read_bytes()!=off[p].read_bytes()}=={TARGET}
          for files in [on,off]:
              for p in files.values():
                  subprocess.run(['/tmp/gq470-obj-luau/luau-compile','--text',str(p)],check=True,stdout=subprocess.DEVNULL)
          print('REAL69_OBJECTIVE_ON69_OFF69_NATIVE_PASS')
          PY
      - name: Rojo ON/OFF69 original Place rollback and legacy17/48
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-obj-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-obj-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq470-obj-rojo.zip') as z:
              names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(names)==1
              p=Path('/tmp/gq470-obj-rojo');p.write_bytes(z.read(names[0]));p.chmod(0o755)
          PY
          /tmp/gq470-obj-rojo build /tmp/gq470-objective/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-objective/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          /tmp/gq470-obj-rojo build /tmp/gq470-objective/off69_objective/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-objective/OFF69_OBJECTIVE_REBUILT.rbxlx
          cmp /tmp/gq470-objective/OFF69_OBJECTIVE_REBUILT.rbxlx /tmp/gq470-objective/off69_objective/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-objective/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-objective/EGGRUMBLE_REAL69_PRIVATE.rbxlx --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-objective/off69_objective/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-objective/OFF69_OBJECTIVE_REBUILT.rbxlx --count 69
          python3 - <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          from quality_gameplay.gq8_rc85_rc86_real69_nonloss_20261120.verify_real69 import marker_check
          root=Path('/tmp/gq470-objective')
          on=project_scan(root,'EGGRUMBLE_REAL69.project.json')
          off=project_scan(root/'off69_objective','EGGRUMBLE_REAL69.project.json')
          assert len(on)==len(off)==69 and len(marker_check(on))==len(marker_check(off))==17
          info=json.loads((root/'REAL69_LEGACY_INTAKE_RECEIPT.json').read_text())
          assert info['gq470_objective_visual']['other_selected_routes_byte_exact']==68
          assert info['gq470_objective_visual']['visual_evidence']=='NOT_TESTED'
          place=root/'EGGRUMBLE_REAL69_PRIVATE.rbxlx'
          info['gq470_objective_visual']['native_rojo_off69']='PASS'
          info['private_place_bytes']=place.stat().st_size
          info['private_place_sha256']=hashlib.sha256(place.read_bytes()).hexdigest()
          (root/'REAL69_LEGACY_INTAKE_RECEIPT.json').write_text(json.dumps(info,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('REAL69_OBJECTIVE_PRIVATE_PLACE_BYTES',place.stat().st_size)
          PY
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base /tmp/gq470-objective --report /tmp/gq470-objective/OBJECTIVE_LEGACY48_SOURCE.json
          echo SOURCE_GATE_ONLY_STUDIO_ANDROID_ART_NO_GO
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-OBJECTIVE-ART-PREP-NOT-FORMAL
          path: |
            /tmp/gq470-objective/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-objective/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-objective/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-objective/sources/**
            /tmp/gq470-objective/OFF69_OBJECTIVE_REBUILT.rbxlx
            /tmp/gq470-objective/OBJECTIVE_LEGACY48_SOURCE.json
          if-no-files-found: error
          retention-days: 7
