name: P0D FB castle solo raider siege breach with original Beast weapons portal native84
on:
  push:
    branches: [feature/p0d-product-quality-gate-20261115]
    paths:
      - product_quality/siege_bot_breach/**
      - .github/workflows/p0d-quality-siege-bot-breach-native84.yml
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - product_quality/siege_bot_breach/**
      - .github/workflows/p0d-quality-siege-bot-breach-native84.yml
permissions:
  contents: read
  actions: read
jobs:
  actual-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download original verified 84-script siege door Beast Solo armament portal source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_siege_breach_parent
          gh run download 43703745184 -R kk051780/toy-wars-factory \
            -n P0D-QUALITY-TRAPPER-WARP-SIEGE-BEAST-SOLO-7WEAPONS-RC84-NOGO \
            -D /tmp/p0d_siege_breach_parent
          test -s /tmp/p0d_siege_breach_parent/P0D_TRAPPER_WARP_PRIVATE84.zip
      - name: Source select REAL MapBuilder and SoloTeamBots only for active castle siege
        shell: bash
        run: |
          set -euo pipefail
          python3 -B product_quality/siege_bot_breach/build_siege_bot_breach_private84.py \
            --parent /tmp/p0d_siege_breach_parent/P0D_TRAPPER_WARP_PRIVATE84.zip \
            --out /tmp/P0D_RC84_SIEGE_BOTS_PRIVATE.zip \
            --extract /tmp/p0d_siege_bot84_sources
          python3 - <<'PY'
          import sys,zipfile,json,hashlib
          from pathlib import Path
          sys.path.insert(0,"product_quality/siege_bot_breach")
          import build_siege_bot_breach_private84 as x
          with zipfile.ZipFile("/tmp/P0D_RC84_SIEGE_BOTS_PRIVATE.zip") as z:
              r=json.loads(z.read("RECEIPT.json"))
              place=z.read(x.OUTPUT_PLACE)
          assert r["script_count"]==84 and r["unchanged_game_and_81_other_scripts"]
          assert r["source_dual_lock_exact"] and r["egg_steal_deposit_score_winner_exact"]
          assert r["enemy_raider_breach_three_hits"] and r["bot_paths_to_gate_before_egg_when_closed"]
          assert not r["official_rc_write"] and r["product"]=="NO_GO"
          assert hashlib.sha256(place).hexdigest()==r["place_sha256"]
          _,scripts=x.source_nodes(place)
          assert len(scripts)==84 and len(list(Path("/tmp/p0d_siege_bot84_sources").glob("*.luau")))==84
          map_source=scripts["MapBuilder"].text
          bots=scripts["SoloTeamBots"].text
          game=scripts["Game"].text
          for token in ('local function npcBreach(attackerTeam,botOrigin,now)',
              'gate:SetAttribute("SiegeDamage",siegeDamage)',
              'lastSiegeAt<1.5','breachLock=now+10','task.delay(9'):
              assert token in map_source
          for token in ("enemyGate.breach(bot.team,bot.root.Position,now)",
              'enemyGate.door:GetAttribute("GateRaised")==false',
              'waypoint=Vector3.new(door.X-sign*7,',
              'callbacks.deposit(bot,bot.team,bot.carry)'):
              assert token in bots
          assert "summonSevenBeast" in game and "SevenJobs.TrapperWarp.place" in game
          assert "SevenJobs.ArmamentM1.strike" in game
          for bad in ("",x.MAP_SIEGE_ORIGINAL,x.MAP_RETURN_NEW):
              try:x.patch_map(bad)
              except ValueError:pass
              else:raise AssertionError("STALE_MAP_SOURCE_ACCEPTED")
          for bad in ("",x.BOT_HIT_ANCHOR,x.BOT_HIT_NEW):
              try:x.patch_bot(bad)
              except ValueError:pass
              else:raise AssertionError("STALE_BOT_SOURCE_ACCEPTED")
          print("P0D_REAL_SOLO_GATE_SIEGE_DAMAGE_AND_EGG_SOURCE_LOCK_PASS")
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_siege_bot84_luau
          persist-credentials: false
      - name: Native compile ALL 84 actual Luau scripts including genuine Game
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_siege_bot84_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_siege_bot84_luau -B /tmp/p0d_siege_bot84_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_siege_bot84_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' f; do
            /tmp/p0d_siege_bot84_build/luau-compile "$f" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_siege_bot84_sources -name '*.luau' -type f -print0 | sort -z)
          test "$n" -eq 84
          echo 'P0D_REAL_SOLO_AI_GATE_BREACH_NATIVE_84_OF_84_PASS'
      - name: Reconstruct 84 original Roblox paths and types from the actual Place
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          import hashlib,json
          target=Path('/tmp/p0d_siege_bot84_rojo')
          with ZipFile('/tmp/P0D_RC84_SIEGE_BOTS_PRIVATE.zip') as z:
              root=ET.fromstring(z.read('P0D_RC84_CASTLE_SIEGE_AI_BREACH_7WEAPONS_BEAST_SOLO_TRAPPER_PRIVATE.rbxlx'))
          types={'Script':'.server.luau','LocalScript':'.client.luau','ModuleScript':'.luau'}
          manifest=[]
          def walk(item,old=()):
              p=item.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=old+((name,) if name else ())
              if src is not None:
                  assert item.get('class') in types and len(here)>=3
                  assert here[0] in ('ReplicatedStorage','ServerScriptService','StarterPlayer')
                  assert all(t.isidentifier() for t in here)
                  f=target/'src'/Path(*here).with_suffix(types[item.get('class')])
                  f.parent.mkdir(parents=True,exist_ok=True)
                  assert not f.exists()
                  f.write_text(src,encoding='utf-8')
                  raw=src.encode('utf-8')
                  d=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  manifest.append({'path':'/'.join(here),'kind':item.get('class'),'blob':d})
              for child in item.findall('Item'):walk(child,here)
          for item in root.findall('Item'):walk(item)
          assert len(manifest)==84
          assert len({x['path'] for x in manifest})==84
          (target/'manifest.json').write_text(json.dumps(manifest,indent=2))
          project={'name':'P0DActualSiegeBeastSolo7Armament84','tree':{'$className':'DataModel',
            'ReplicatedStorage':{'$className':'ReplicatedStorage',
              'TrapRaidersShared':{'$path':'src/ReplicatedStorage/TrapRaidersShared'}},
            'ServerScriptService':{'$className':'ServerScriptService',
              'TrapRaidersS1':{'$path':'src/ServerScriptService/TrapRaidersS1'}},
            'StarterPlayer':{'$className':'StarterPlayer',
              'StarterPlayerScripts':{'$path':'src/StarterPlayer/StarterPlayerScripts'}}}}
          (target/'default.project.json').write_text(json.dumps(project,indent=2))
          print('84_REAL_LUAU_PATH_CLASS_BLOB_MANIFEST_PREPARED')
          PY
      - name: Pinned Rojo 7.7.1 rebuild exact 84 class path and source GitBlob
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_siege_bot84_rojo_release.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_siege_bot84_rojo_release.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/p0d_siege_bot84_rojo_release.zip') as z:
              entries=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='rojo']
              assert len(entries)==1
              file=Path('/tmp/p0d_siege_bot84_rojo_binary')
              file.write_bytes(z.read(entries[0]))
              file.chmod(0o755)
          PY
          /tmp/p0d_siege_bot84_rojo_binary build /tmp/p0d_siege_bot84_rojo/default.project.json -o /tmp/p0d_siege_bot84_rojo_rebuilt.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import hashlib,json
          want=json.loads(Path('/tmp/p0d_siege_bot84_rojo/manifest.json').read_text())
          root=ET.fromstring(Path('/tmp/p0d_siege_bot84_rojo_rebuilt.rbxlx').read_bytes())
          got=[]
          def walk(n,prior=()):
              p=n.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=prior+((name,) if name else ())
              if src is not None:
                  raw=src.encode('utf-8')
                  d=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  got.append({'path':'/'.join(here),'kind':n.get('class'),'blob':d})
              for c in n.findall('Item'):walk(c,here)
          for item in root.findall('Item'):walk(item)
          assert len(got)==len(want)==84
          assert {x['path']:(x['kind'],x['blob']) for x in got}=={
              x['path']:(x['kind'],x['blob']) for x in want}
          print('REAL_AI_GATE_BREACH_BEAST_SOLO_ROJO84_84_SOURCE_EXACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-QUALITY-REAL-SOLO-AI-CASTLE-SIEGE-BREACH-RC84-NOGO
          path: /tmp/P0D_RC84_SIEGE_BOTS_PRIVATE.zip
          retention-days: 7
