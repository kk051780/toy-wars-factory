name: P0D GQ isolated dual-mode neutral live cap Native VM
on:
  push:
    branches:
      - quality/gq-dual-mode-neutral-server-budget-20261116
    paths:
      - 'quality_gameplay/gq_dual_mode_neutral_budget_20261116/**'
      - '.github/workflows/p0d-gq-dual-neutral-budget-private.yml'
  pull_request:
    paths:
      - 'quality_gameplay/gq_dual_mode_neutral_budget_20261116/**'
      - '.github/workflows/p0d-gq-dual-neutral-budget-private.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  budget-native-rojo-private22:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm original V3 author source unchanged and source contract
        shell: bash
        run: |
          set -euo pipefail
          root=handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116
          test "$(git hash-object "$root/EGGRUMBLE_SwarmCombat.luau")" = fea147ac51411e626b410d172aad5cd72615bd45
          test "$(git hash-object "$root/EGGRUMBLE_LobbyCastleModesPreview.server.luau")" = 7162b209bf67b74a71553217f3f744e072a0365d
          test "$(git hash-object "$root/EGGRUMBLE_SevenRoleCombat.luau")" = 66e666418b7c23d41f87faa5d61eb6e2770a463e
          python3 -B -m unittest discover -v -s quality_gameplay/gq_dual_mode_neutral_budget_20261116/tests -p 'test_*.py'
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq_native_luau
          persist-credentials: false
      - name: Source-true native Luau budget VM regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _gq_native_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _gq_native_luau -B /tmp/gq_dual_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_dual_luau --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          mkdir -p /tmp/gq_dual_budget
          python3 - <<'PY'
          from pathlib import Path
          p=Path("quality_gameplay/gq_dual_mode_neutral_budget_20261116")
          source=(p/"EGGRUMBLE_DualModeNeutralBudget.luau").read_text()
          cases=(p/"tests/budget_native_cases.luau").read_text()
          assert source.rstrip().endswith("return Budget")
          Path("/tmp/gq_dual_budget/native_cases.luau").write_text(source.rsplit("return Budget",1)[0]+"\n"+cases)
          PY
          /tmp/gq_dual_luau/luau-compile --text quality_gameplay/gq_dual_mode_neutral_budget_20261116/EGGRUMBLE_DualModeNeutralBudget.luau >/dev/null
          /tmp/gq_dual_luau/luau-compile --text /tmp/gq_dual_budget/native_cases.luau >/dev/null
          /tmp/gq_dual_luau/luau /tmp/gq_dual_budget/native_cases.luau | tee /tmp/gq_dual_budget/native.log
          grep -q GQ_DUAL_MODE_NEUTRAL_BUDGET_NATIVE_PASS /tmp/gq_dual_budget/native.log
          git rev-parse HEAD > /tmp/gq_dual_budget/pinned_head.txt
          sha256sum quality_gameplay/gq_dual_mode_neutral_budget_20261116/EGGRUMBLE_DualModeNeutralBudget.luau > /tmp/gq_dual_budget/policy_sha256.txt
      - name: Stage pinned original V3 21 OFF and unique optional 22 ON
        shell: bash
        run: |
          set -euo pipefail
          root=quality_gameplay/gq_dual_mode_neutral_budget_20261116
          python3 "$root/tools/compose_private_v3.py" --mode OFF --out /tmp/GQ528_V3_OFF21_NOT_RC
          python3 "$root/tools/compose_private_v3.py" --mode ON --out /tmp/GQ528_V3_ON22_NOT_RC
          for pair in "OFF21 21" "ON22 22"; do
            read -r tag want <<< "$pair"
            folder=/tmp/GQ528_V3_"$tag"_NOT_RC
            count=0
            for file in "$folder"/src/*.luau; do
              /tmp/gq_dual_luau/luau-compile --text "$file" >/dev/null
              count=$((count+1))
            done
            test "$count" -eq "$want"
          done
          cp /tmp/GQ528_V3_ON22_NOT_RC/source_lock_receipt.json /tmp/gq_dual_budget/ON22_source_receipt.json
          cp /tmp/GQ528_V3_OFF21_NOT_RC/source_lock_receipt.json /tmp/gq_dual_budget/OFF21_source_receipt.json
      - name: Pinned Rojo 7.7.1 real unpublished OFF21 and ON22 private Source exact Place
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq528_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq528_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq528_rojo.zip") as z:
              names=[x for x in z.namelist() if x.split("/")[-1]=="rojo"]
              assert len(names)==1
              p=Path("/tmp/gq528_rojo")
              p.write_bytes(z.read(names[0]))
              p.chmod(0o755)
          PY
          for mode in OFF21 ON22; do
            folder=/tmp/GQ528_V3_"$mode"_NOT_RC
            place="$folder"/GQ528_V3_"$mode"_NOT_RC.rbxlx
            /tmp/gq528_rojo build "$folder/private_v3.project.json" -o "$place"
            python3 quality_gameplay/gq_dual_mode_neutral_budget_20261116/tools/verify_private_place.py --folder "$folder" --place "$place"
            stat -c "$mode PRIVATE_PLACE_BYTES=%s" "$place"
            sha256sum "$place"
            cp "$place" "/tmp/gq_dual_budget/GQ528_V3_"$mode"_NOT_RC.rbxlx"
          done
          cd /tmp/gq_dual_budget
          zip -q -r /tmp/GQ528_DUAL_NEUTRAL_PRIVATE_ON22_OFF21_NOT_RC.zip .
          stat -c 'PRIVATE_ZIP_BYTES=%s' /tmp/GQ528_DUAL_NEUTRAL_PRIVATE_ON22_OFF21_NOT_RC.zip
          sha256sum /tmp/GQ528_DUAL_NEUTRAL_PRIVATE_ON22_OFF21_NOT_RC.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GQ_DUAL_MODE_NEUTRAL_BUDGET_PRIVATE22_ROJO_NOT_RC
          path: |
            /tmp/gq_dual_budget/
            /tmp/GQ528_DUAL_NEUTRAL_PRIVATE_ON22_OFF21_NOT_RC.zip
          if-no-files-found: error
          retention-days: 7
