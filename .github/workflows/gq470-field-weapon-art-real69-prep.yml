name: GQ470 REAL69 field weapon pickup 3D ART source-only PREP (not official RC)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_field_weapon_pickup_art_real69_20261121/**'
      - '.github/workflows/gq470-field-weapon-art-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-exact-art-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHOR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch pinned formal REAL69 and patch exactly one actual selected Luau source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHOR_HEAD_SHA" || { echo WRONG_HEAD_CHECKOUT; exit 1; }
          OFFICIAL="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$OFFICIAL" = "e80973c354f14a0d0088577f3cc1a875454f0f8f" || { echo STALE_FORMAL_RC_NO_ADMISSION; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44695199140" --jq '.head_sha+" "+.conclusion')" = "e80973c354f14a0d0088577f3cc1a875454f0f8f success"
          mkdir -p "$RUNNER_TEMP/real69-original"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir "$RUNNER_TEMP/real69-original"
          python3 -B quality_gameplay/gq470_field_weapon_pickup_art_real69_20261121/gate.py --base "$RUNNER_TEMP/real69-original" --out "$RUNNER_TEMP/real69-weapons"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'real69-weapons'
          r=json.loads((root/'ART_CHECK_REPORT_FIELD_WEAPON.json').read_text())
          assert r['selected_sources']==69 and r['other_sources_exact']==68
          assert r['only_changed_route']=='ServerScriptService/EGGRUMBLE_FieldItemPickups'
          assert r['negative_tests_rejected']==8 and r['extra_decorative_parts_max']==6
          assert r['new_HUD_or_Remotes']==0 and r['render_connection_delta']==0
          assert r['art_gate']=='NO_GO' and r['owner_accepted'] is False
          print('GQ470_FIELD_WEAPON_REAL69_EXACT_SOURCE_ONLY_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile full candidate and rollback with pinned native Luau
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-weapon-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-weapon-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq470_field_weapon_pickup_art_real69_20261121')
          from gate import selected
          root=Path(os.environ['RUNNER_TEMP'])/'real69-weapons'
          for stage in (root,root/'OFF69_SOURCE_EXACT'):
            for file in selected(stage).values():
              subprocess.run(['/tmp/gq470-weapon-luau/luau-compile','--text',str(file)],
                             check=True,stdout=subprocess.DEVNULL)
          print('GQ470_FIELD_WEAPON_NATIVE_69_ON_OFF_PASS')
          PY
      - name: Pinned Rojo real ON/OFF69 Studio Place and exact original rollback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-weapon-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-weapon-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq470-weapon-rojo.zip') as z:
            names=[x for x in z.namelist() if x.split('/')[-1]=='rojo']
            assert len(names)==1
            p=Path('/tmp/gq470-weapon-rojo');p.write_bytes(z.read(names[0]));p.chmod(0o755)
          PY
          ROOT="$RUNNER_TEMP/real69-weapons"
          /tmp/gq470-weapon-rojo build "$ROOT/EGGRUMBLE_REAL69.project.json" -o /tmp/GQ470_FIELD_WEAPON_ON69_PRIVATE.rbxlx
          /tmp/gq470-weapon-rojo build "$ROOT/OFF69_SOURCE_EXACT/EGGRUMBLE_REAL69.project.json" -o /tmp/GQ470_FIELD_WEAPON_OFF69_PRIVATE.rbxlx
          cmp /tmp/GQ470_FIELD_WEAPON_OFF69_PRIVATE.rbxlx "$ROOT/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 -B quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$ROOT/EGGRUMBLE_REAL69.project.json" --place /tmp/GQ470_FIELD_WEAPON_ON69_PRIVATE.rbxlx --count 69
          python3 -B quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$ROOT/OFF69_SOURCE_EXACT/EGGRUMBLE_REAL69.project.json" --place /tmp/GQ470_FIELD_WEAPON_OFF69_PRIVATE.rbxlx --count 69
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base "$ROOT" --report "$ROOT/LEGACY48_FIELD_WEAPON_FEATURE_AUDIT.json"
          echo GQ470_FIELD_WEAPON_NATIVE_ROJO_OFF69_BYTE_EXACT_SOURCE_PASS
      - name: Pin source-only candidate Place SHA and B220 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'real69-weapons'
          path=root/'ART_CHECK_REPORT_FIELD_WEAPON.json'
          d=json.loads(path.read_text())
          place=Path('/tmp/GQ470_FIELD_WEAPON_ON69_PRIVATE.rbxlx')
          d.update(native_luau='SOURCE_PASS_69_ON_OFF',rojo_on_off='SOURCE_PASS',
            private_candidate_place_bytes=place.stat().st_size,
            private_candidate_place_sha256=hashlib.sha256(place.read_bytes()).hexdigest(),
            candidate_head=os.environ['AUTHOR_HEAD_SHA'])
          path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          (root/'B220_ONE_SOURCE_NOT_FORMAL/SOURCE_SELECT_MANIFEST.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('GQ470_FIELD_WEAPON_B220_HANDOFF_PREP_ONLY_ART_NO_GO')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-FIELD-WEAPON-FACETS-SOURCE-ONLY-NOT-FORMAL
          path: |
            ${{ runner.temp }}/real69-weapons/B220_ONE_SOURCE_NOT_FORMAL/
            ${{ runner.temp }}/real69-weapons/ART_CHECK_REPORT_FIELD_WEAPON.json
            ${{ runner.temp }}/real69-weapons/LEGACY48_FIELD_WEAPON_FEATURE_AUDIT.json
            /tmp/GQ470_FIELD_WEAPON_ON69_PRIVATE.rbxlx
            /tmp/GQ470_FIELD_WEAPON_OFF69_PRIVATE.rbxlx
          if-no-files-found: error
          retention-days: 7
