name: GQ470 Castle Banner Wind Source-Only Gate
on:
  pull_request:
    branches: ['rc/p0d-s1-kids-rc01']
    paths:
      - 'quality_gameplay/gq470_castle_banner_wind_20261121/**'
      - '.github/workflows/gq470-castle-banner-wind-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Source-only guards and negative mutants
        run: python3 -m unittest discover -s quality_gameplay/gq470_castle_banner_wind_20261121 -p 'test_*.py' -v
      - name: Verify immutable 69-source original castle banner geometry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44695199140" --jq '.head_sha+" "+.conclusion')" = "e80973c354f14a0d0088577f3cc1a875454f0f8f success"
          mkdir -p /tmp/gq470-banner-original
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir /tmp/gq470-banner-original
          python3 -B quality_gameplay/gq470_castle_banner_wind_20261121/verify_original_banner_compat.py --official-dir /tmp/gq470-banner-original
          python3 -B quality_gameplay/gq470_castle_banner_wind_20261121/compose_official70.py --official /tmp/gq470-banner-original --out /tmp/gq470-banner-on70
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile optional actual LocalScript using pinned native Luau
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-banner-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-banner-luau --target Luau.Compile.CLI --parallel 4
          /tmp/gq470-banner-luau/luau-compile --text quality_gameplay/gq470_castle_banner_wind_20261121/EGGRUMBLE_CastleBannerWind.client.luau >/dev/null
          echo GQ470_BANNER_SOURCE_NATIVE_GREEN_ENGINE_NOT_TESTED_ART_NO_GO
          python3 - <<'PY'
          import sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          for path,count in ((Path('/tmp/gq470-banner-original'),69),(Path('/tmp/gq470-banner-on70'),70)):
              sources=project_scan(path,'EGGRUMBLE_REAL69.project.json')
              assert len(sources)==count
              for d in sources.values():
                  subprocess.run(['/tmp/gq470-banner-luau/luau-compile','--text',str(path/d['path'])],stdout=subprocess.DEVNULL,check=True)
          print('GQ470_BANNER_NATIVE_OFF69_ON70_139_SELECTED_LUAU_PASS')
          PY
      - name: Build pinned Rojo original OFF69 and banner ON70, preserve original bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gq470-banner-tools
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-banner-tools/rojo.zip
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-banner-tools/rojo.zip" | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq470-banner-tools/rojo.zip') as archive:
              names=[x for x in archive.namelist() if x.split('/')[-1]=='rojo']
              assert len(names)==1
              exe=Path('/tmp/gq470-banner-tools/rojo')
              exe.write_bytes(archive.read(names[0]))
              exe.chmod(0o755)
          PY
          /tmp/gq470-banner-tools/rojo build /tmp/gq470-banner-original/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-banner-tools/OFF69.rbxlx
          /tmp/gq470-banner-tools/rojo build /tmp/gq470-banner-on70/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-banner-tools/BANNER_ON70_A_ONLY.rbxlx
          cmp /tmp/gq470-banner-tools/OFF69.rbxlx /tmp/gq470-banner-original/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-banner-original/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-banner-tools/OFF69.rbxlx --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-banner-on70/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-banner-tools/BANNER_ON70_A_ONLY.rbxlx --count 70
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          original=ET.parse('/tmp/gq470-banner-tools/OFF69.rbxlx').getroot()
          candidate=ET.parse('/tmp/gq470-banner-tools/BANNER_ON70_A_ONLY.rbxlx').getroot()
          a=list(original.iter('Item'))
          b=list(candidate.iter('Item'))
          assert len(b)==len(a)+1,(len(a),len(b))
          hits=[]
          for item in b:
              n=item.find('./Properties/string[@name="Name"]')
              if n is not None and n.text=='EGGRUMBLE_CastleBannerWind':hits.append(item)
          assert len(hits)==1 and hits[0].get('class')=='LocalScript'
          src=hits[0].find('./Properties/ProtectedString[@name="Source"]')
          if src is None:src=hits[0].find('./Properties/string[@name="Source"]')
          required=Path('quality_gameplay/gq470_castle_banner_wind_20261121/EGGRUMBLE_CastleBannerWind.client.luau').read_text()
          assert src is not None and src.text is not None and src.text.strip()==required.strip()
          print('GQ470_BANNER_ROJO_OFF69_BYTE_EXACT_ON70_NEW_LOCAL_SOURCE_CLASS_PASS')
          PY
      - name: Export isolated one-source B220 packet with negative mutation checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq470_castle_banner_wind_20261121/compose_official70.py --export-b /tmp/gq470-banner-on70 --place /tmp/gq470-banner-tools/BANNER_ON70_A_ONLY.rbxlx
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "e80973c354f14a0d0088577f3cc1a875454f0f8f" || { echo RED_OFFICIAL_MOVED_DO_NOT_CLAIM_READY; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$(git rev-parse HEAD)" = "$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")" || { echo RED_A_HEAD_MOVED; exit 1; }
          fi
          echo GQ470_BANNER_A_ONLY_SOURCE_AND_ROJO_PASS_NOT_STUDIO_NOT_FORMAL
      - name: Write honest art mobile and P0 32-image gap report
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq470_castle_banner_wind_20261121/emit_art_gate_report.py --candidate /tmp/gq470-banner-on70 --place /tmp/gq470-banner-tools/BANNER_ON70_A_ONLY.rbxlx --out /tmp/gq470-banner-tools/ART_CHECK_REPORT.json
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-BANNER-REAL70-A-NOT-FORMAL
          path: |
            /tmp/gq470-banner-tools/BANNER_ON70_A_ONLY.rbxlx
            /tmp/gq470-banner-tools/ART_CHECK_REPORT.json
            /tmp/gq470-banner-on70/GQ470_BANNER_REAL70_CANDIDATE_RECEIPT.json
            /tmp/gq470-banner-on70/B220_BANNER_ONE_NEW_CLIENT_NOT_FORMAL/**
          if-no-files-found: error
          retention-days: 7
