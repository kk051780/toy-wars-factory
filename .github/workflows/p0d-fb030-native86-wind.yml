name: P0D FB030 RC86 to RC87 real native Luau Rojo wind integration
on:
  push:
    branches: [feature/p0d-fb029-wind-rules-integration-20261115]
    paths:
      - quality_repair/FB030_RC86_WIND/**
      - .github/workflows/p0d-fb030-native86-wind.yml
permissions:
  contents: read
  actions: read
jobs:
  real87:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download source-exact native-pass RC86 parent from PR479
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fb030_parent
          gh run download 43714858562 -R kk051780/toy-wars-factory -n P0D-FB026-UNDEAD-STAGE-LOOT-PRIVATE86-SOURCE-NOGO -D /tmp/fb030_parent
          find /tmp/fb030_parent -type f -maxdepth 3 -print
          test "$(find /tmp/fb030_parent -name '*.rbxlx' | wc -l)" -eq 1
      - name: Exact-game patch and fail-closed source checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet lxml==6.1.1
          parent="$(find /tmp/fb030_parent -name '*.rbxlx' -type f | head -1)"
          python3 quality_repair/FB030_RC86_WIND/build_rc87.py "$parent" /tmp/P0D_RC87_FB030_NATIVE86_WIND_PRIVATE.rbxlx --receipt /tmp/RC87_RECEIPT.json > /tmp/patch_log.json
          echo '994d08c141cbd53f7b163c13f61f13ad9266a10c59dc7439a904172d032f07e2  /tmp/P0D_RC87_FB030_NATIVE86_WIND_PRIVATE.rbxlx' | sha256sum -c
          test "$(stat -c %s /tmp/P0D_RC87_FB030_NATIVE86_WIND_PRIVATE.rbxlx)" -eq 845174
          python3 - <<'PY'
          from pathlib import Path
          from lxml import etree
          import hashlib,json
          parent=list(Path('/tmp/fb030_parent').rglob('*.rbxlx'))[0]
          after=Path('/tmp/P0D_RC87_FB030_NATIVE86_WIND_PRIVATE.rbxlx')
          def blobs(p):
              rt=etree.parse(str(p));d={}
              for item in rt.xpath('//Item'):
                  props=item.find('Properties')
                  if props is None:continue
                  n=props.find('string[@name="Name"]')
                  s=next((x for x in props if x.get('name')=='Source'),None)
                  if n is not None and s is not None:
                      raw=(s.text or '').encode('utf8')
                      d[n.text]=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              return d
          a,b=blobs(parent),blobs(after)
          assert len(a)==len(b)==86
          assert [n for n in a if a[n]!=b[n]]==['Game','TrapRaidersHUD']
          print('P0D_FB030_EXACT_84_OF_86_ORIGINAL_SOURCES')
          PY
      - name: Extract the actual RC87 Lua class/path/source into a Rojo tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,xml.etree.ElementTree as ET
          root=ET.fromstring(Path('/tmp/P0D_RC87_FB030_NATIVE86_WIND_PRIVATE.rbxlx').read_bytes())
          dst=Path('/tmp/p0d_fb030_rojo87')
          exts={'Script':'.server.luau','LocalScript':'.client.luau','ModuleScript':'.luau'}
          found=[]
          def walk(item,base=()):
              p=item.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=base+((name,) if name else ())
              if src is not None:
                  assert item.attrib['class'] in exts and len(here)>=3
                  assert here[0] in ('ServerScriptService','StarterPlayer','ReplicatedStorage')
                  assert all(x.isidentifier() for x in here)
                  path=dst/'src'/Path(*here).with_suffix(exts[item.attrib['class']])
                  path.parent.mkdir(parents=True,exist_ok=True)
                  assert not path.exists(),path
                  path.write_text(src,encoding='utf8')
                  b=src.encode('utf8')
                  blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                  found.append({'path':'/'.join(here),'class':item.attrib['class'],'blob':blob})
              for c in item.findall('Item'):walk(c,here)
          for n in root.findall('Item'):walk(n)
          assert len(found)==86,len(found)
          (dst/'manifest.json').write_text(json.dumps(found,indent=2))
          project={'name':'P0DFB030ActualNative86Wind','tree':{'$className':'DataModel',
            'ReplicatedStorage':{'$className':'ReplicatedStorage','TrapRaidersShared':{'$path':'src/ReplicatedStorage/TrapRaidersShared'}},
            'ServerScriptService':{'$className':'ServerScriptService','TrapRaidersS1':{'$path':'src/ServerScriptService/TrapRaidersS1'}},
            'StarterPlayer':{'$className':'StarterPlayer','StarterPlayerScripts':{'$className':'StarterPlayerScripts','$path':'src/StarterPlayer/StarterPlayerScripts'}}}}
          (dst/'default.project.json').write_text(json.dumps(project,indent=2))
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _fb030_pinned_luau
          persist-credentials: false
      - name: Compile every actual source using pinned native Luau
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _fb030_pinned_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _fb030_pinned_luau -B /tmp/fb030_luau_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/fb030_luau_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' src; do
            /tmp/fb030_luau_build/luau-compile "$src" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_fb030_rojo87/src -name '*.luau' -type f -print0 | sort -z)
          test "$n" -eq 86
          echo P0D_FB030_REAL_NATIVE_86_OF_86_PASS
      - name: Pin Rojo and verify actual 86 path class GitBlob source identities
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/fb030_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/fb030_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/fb030_rojo.zip') as z:
              xs=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='rojo']
              assert len(xs)==1
              p=Path('/tmp/fb030_rojo_bin');p.write_bytes(z.read(xs[0]));p.chmod(0o755)
          PY
          /tmp/fb030_rojo_bin build /tmp/p0d_fb030_rojo87/default.project.json -o /tmp/p0d_fb030_rojo87_built.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib,json,xml.etree.ElementTree as ET
          want=json.loads(Path('/tmp/p0d_fb030_rojo87/manifest.json').read_text())
          root=ET.fromstring(Path('/tmp/p0d_fb030_rojo87_built.rbxlx').read_bytes())
          got=[]
          def walk(item,base=()):
              prop=item.find('Properties')
              name=prop.findtext("string[@name='Name']") if prop is not None else None
              source=prop.findtext("string[@name='Source']") if prop is not None else None
              here=base+((name,) if name else ())
              if source is not None:
                  b=source.encode('utf8')
                  blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                  got.append({'path':'/'.join(here),'class':item.attrib['class'],'blob':blob})
              for child in item.findall('Item'):walk(child,here)
          for item in root.findall('Item'):walk(item)
          assert len(got)==86,len(got)
          assert Counter((x['path'],x['class'],x['blob']) for x in got)==Counter((x['path'],x['class'],x['blob']) for x in want)
          print('P0D_FB030_REAL_ROJO_86_OF_86_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P0D-FB030-RC87-ASSASSIN-WIND-NATIVE86-PRIVATE-NOGO
          path: |
            /tmp/P0D_RC87_FB030_NATIVE86_WIND_PRIVATE.rbxlx
            /tmp/RC87_RECEIPT.json
            /tmp/patch_log.json
          if-no-files-found: warn
          retention-days: 7
