name: GQ8 combined station and Subsea melee LOS REAL36 native Rojo OFF31
on:
  push:
    branches: ['quality/gq8-subsea-melee-los-20261118']
    paths:
      - 'quality_gameplay/gq8_subsea_melee_los_20261118/**'
      - '.github/workflows/p0d-gq8-subsea-combined36.yml'
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_subsea_melee_los_20261118/**'
      - '.github/workflows/p0d-gq8-subsea-combined36.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine36-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 4f741a5901506337cb43a58ff8450210ec9507e3
          path: _station792
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: c51de1ed4feb7a7500ada95d21282402053ef988
          path: _realm764
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 8f7984c1a9db2c016321d16d47a3ea8d1b5081df
          path: _qa780
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 5b82f300e6dee08ea1ac20ccd1449db0cd73dbc3
          path: _regen775
          persist-credentials: false
      - name: Immutable original source mutation and exact inverse
        shell: bash
        env:
          GQ8_SUBSEA_REALM_ORIGINAL: _realm764/handoffs/EGGRUMBLE-REALM-CORE-20261118/EGGRUMBLE_RealmBattleCore.server.luau
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -v -s quality_gameplay/gq8_subsea_melee_los_20261118 -p 'test_*.py'
          git -C _station792 rev-parse HEAD | grep -Fx 4f741a5901506337cb43a58ff8450210ec9507e3
          git -C _realm764 rev-parse HEAD | grep -Fx c51de1ed4feb7a7500ada95d21282402053ef988
      - name: Source lock to genuine official RC31 artifact and frozen original head
        shell: bash
        run: |
          set -euo pipefail
          PIN=f77b4d4393d9e9b19b65566413432a7a9f13962b
          RUN=44232589258
          ACTUAL="$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')"
          test "$ACTUAL" = "$PIN success" || { echo RED_ORIGINAL31_PIN_MISSING; exit 1; }
          NOW="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          if [ "$NOW" != "$PIN" ]; then
            echo "YELLOW_NEWER_RC_HEAD_REBASE_REQUIRED:$NOW"
          fi
          mkdir -p artifacts/official
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-RC31-CANONICAL-COMPANION-STUDIO --dir artifacts/official
          test -s artifacts/official/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx
          test -s artifacts/official/gq515_official_select/GQ510_MAGE_SELECTED31.project.json
          test -s artifacts/official/gq530_all31/EGGRUMBLE_V3_OFFICIAL_RC31_RECEIPT.json
      - name: Genuine original31 + pinned original Realm34 Regen33 Core36
        shell: bash
        run: |
          set -euo pipefail
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py extract             --place artifacts/official/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx             --template artifacts/official/gq515_official_select/GQ510_MAGE_SELECTED31.project.json             --receipt artifacts/official/gq530_all31/EGGRUMBLE_V3_OFFICIAL_RC31_RECEIPT.json             --out artifacts/current31 --head f77b4d4393d9e9b19b65566413432a7a9f13962b
          python3 _realm764/handoffs/EGGRUMBLE-REALM-CORE-20261118/compose_core34.py             --current31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json             --lss-source handoffs/EGGRUMBLE-LAND-SEA-SKY-20261117/EGGRUMBLE_LandSeaSkyTraversal.server.luau             --out artifacts/realm34/REALM34.project.json
          python3 _regen775/handoffs/EGGRUMBLE-HP-REGEN-20261118/compose_regen32.py             --current31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json             --out artifacts/regen33/REGEN33.project.json
          python3 _qa780/quality_gameplay/gq8_crosslane_20261118/compose_rehearsal36.py             --original31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json             --regen33 artifacts/regen33/REGEN33.project.json             --realm34 artifacts/realm34/REALM34.project.json             --out artifacts/combined36/COMBINED36.project.json
          python3 _station792/quality_gameplay/gq8_realm_station_los_20261118/compose_real36.py             --project artifacts/combined36/COMBINED36.project.json             --off31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json             --out artifacts/combined36/REALM_STATION_LOS36.project.json
          python3 quality_gameplay/gq8_subsea_melee_los_20261118/compose_station_and_melee36.py             --original _realm764/handoffs/EGGRUMBLE-REALM-CORE-20261118/EGGRUMBLE_RealmBattleCore.server.luau             --station-library _station792/quality_gameplay/gq8_realm_station_los_20261118             --station-project artifacts/combined36/REALM_STATION_LOS36.project.json             --off31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json             --out artifacts/combined36/STATION_SUBSEA_MELEE_LOS36.project.json
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: All real 36 ON and original31 OFF Native syntax
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8-subsea-combined-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8-subsea-combined-native --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys
          sys.path.insert(0,'_station792/quality_gameplay/gq8_realm_station_los_20261118')
          from compose_real36 import flatten
          for project,n in [('artifacts/combined36/STATION_SUBSEA_MELEE_LOS36.project.json',36),
                            ('artifacts/current31/CURRENT31_REAL_SOURCE.project.json',31)]:
              files=flatten(Path(project))
              assert len(files)==n
              for path in files.values():
                  subprocess.run(['/tmp/gq8-subsea-combined-native/luau-compile','--text',str(path)],check=True,stdout=subprocess.DEVNULL)
              print('GQ8_STATION_SUBSEA_TRUE_NATIVE',n)
          PY
      - name: Pinned Rojo real36 source/class exact with off31 byte rollback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq8-subsea36-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq8-subsea36-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq8-subsea36-rojo.zip') as z:
              found=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(found)==1
              p=Path('/tmp/gq8-subsea36-rojo')
              p.write_bytes(z.read(found[0]));p.chmod(0o755)
          PY
          /tmp/gq8-subsea36-rojo build artifacts/combined36/STATION_SUBSEA_MELEE_LOS36.project.json -o artifacts/combined36/STATION_SUBSEA_MELEE_LOS36.rbxlx
          /tmp/gq8-subsea36-rojo build artifacts/current31/CURRENT31_REAL_SOURCE.project.json -o artifacts/combined36/OFF31.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify             --project artifacts/combined36/STATION_SUBSEA_MELEE_LOS36.project.json             --place artifacts/combined36/STATION_SUBSEA_MELEE_LOS36.rbxlx --count 36
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify             --project artifacts/current31/CURRENT31_REAL_SOURCE.project.json             --place artifacts/combined36/OFF31.rbxlx --count 31
          echo GQ8_SUBSEA_AND_STATION_REAL36_NATIVE_ROJO_OFF31_PASS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GQ8-SUBSEA-STATION-COMBINED36-PREP-NOT-OFFICIAL
          path: |
            artifacts/combined36/STATION_SUBSEA_MELEE_LOS36.rbxlx
            artifacts/combined36/STATION_SUBSEA_MELEE_LOS36.receipt.json
            artifacts/combined36/OFF31.rbxlx
          if-no-files-found: error
          retention-days: 5
