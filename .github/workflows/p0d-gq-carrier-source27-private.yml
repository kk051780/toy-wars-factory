name: P0D GQ cross-domain 27 source exact carrier composite PRIVATE
on:
  push:
    branches:
      - quality/eggrumble-carrier-art-score27-sourceglue-20261116
    paths:
      - '.github/workflows/p0d-gq-carrier-source27-private.yml'
      - 'quality_repair/EGGRUMBLE_GQ_CARRIER_27_20261116/**'
  pull_request:
    branches:
      - quality/eggrumble-v3-spatial-bot-intake-20261116
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source27:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Current isolated GQ glue and original 484 composer
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original seven-role game, 2 modes and host
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _author
          persist-credentials: false
      - name: Original ART source
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _art
          persist-credentials: false
      - name: Original SCORE source
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _score
          persist-credentials: false
      - name: Unique GQ #502 original carrier targeting policy
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: f15f8d040edd27c2f500d72c83f86fdb52dee3dc
          path: _carrier
          persist-credentials: false
      - name: Verify all four external author commits cannot drift
        run: |
          set -euo pipefail
          test "$(git -C _author rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
          test "$(git -C _carrier rev-parse HEAD)" = f15f8d040edd27c2f500d72c83f86fdb52dee3dc
      - name: Original author source contract and carrier source contract
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s _author/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests -p test_v3_studio_project_wiring.py -v
          python3 -B -m unittest discover -s _carrier/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests -p test_carrier_stealth_targeting_contract.py -v
      - name: Original artist source-only private V3 composition
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 _art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py \
            --target v3 \
            --author-project _author/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json \
            --out artifacts/EGGRUMBLE_27_ART_SOURCE.project.json
      - name: Existing original 484 composer plus one scoped 502 policy adapter
        run: |
          set -euo pipefail
          python3 quality_repair/EGGRUMBLE_GQ_CARRIER_27_20261116/compose_private27.py \
            --author _author --quality . --art _art --score _score --carrier _carrier \
            --art-project artifacts/EGGRUMBLE_27_ART_SOURCE.project.json \
            --out artifacts/EGGRUMBLE_27_GQ_PRIVATE.project.json
      - name: Pinned native Luau
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _native_luau
          persist-credentials: false
      - name: Compile all 27 EXACT Luau scripts; execute original carrier policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _native_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _native_luau -B /tmp/gq_27_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_27_native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          project=Path("artifacts/EGGRUMBLE_27_GQ_PRIVATE.project.json").resolve()
          def walk(node):
              if isinstance(node,dict):
                  if "$path" in node:
                      yield (project.parent/node["$path"]).resolve(strict=True)
                  else:
                      for k,v in node.items():
                          if not k.startswith("$"):yield from walk(v)
          paths=list(walk(json.loads(project.read_text(encoding="utf-8"))["tree"]))
          assert len(paths)==27,("not 27 exact sources",len(paths))
          for path in paths:
              subprocess.run(["/tmp/gq_27_native/luau-compile",str(path)],check=True,stdout=subprocess.DEVNULL)
          print("ALL_27_NATIVE_LUAU_COMPILE_PASS")
          PY
          root=_carrier/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116
          mkdir -p /tmp/gq_502_policy/tests
          cp "$root/EGGRUMBLE_CarrierBotTargeting.luau" /tmp/gq_502_policy/
          cp "$root/tests/EGGRUMBLE_CarrierBotTargeting.spec.luau" /tmp/gq_502_policy/tests/
          (cd /tmp/gq_502_policy/tests && /tmp/gq_27_native/luau EGGRUMBLE_CarrierBotTargeting.spec.luau) | tee artifacts/CARRIER_NATIVE.log
          grep -q 'CARRIER_BOT_TARGET_NATIVE_PASS 24 checks' artifacts/CARRIER_NATIVE.log
      - name: Checksum pinned Rojo and unpublished Place
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_27_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_27_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile("/tmp/gq_27_rojo.zip") as archive:
              names=[n for n in archive.namelist() if n.split("/")[-1]=="rojo"]
              assert len(names)==1
              p=Path("/tmp/gq_27_rojo")
              p.write_bytes(archive.read(names[0]))
              p.chmod(0o755)
          PY
          /tmp/gq_27_rojo build artifacts/EGGRUMBLE_27_GQ_PRIVATE.project.json -o artifacts/EGGRUMBLE_GQ_CARRIER_27_PRIVATE.rbxlx
          python3 quality_repair/EGGRUMBLE_GQ_CARRIER_27_20261116/verify_private27.py \
            --project artifacts/EGGRUMBLE_27_GQ_PRIVATE.project.json \
            --place artifacts/EGGRUMBLE_GQ_CARRIER_27_PRIVATE.rbxlx \
            --receipt artifacts/SOURCE_RECEIPT.json
      - name: PRIVATE-only source evidence; not an RC or Studio/Android validation
        uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE-GQ-CARRIER27-ART-SCORE-PRIVATE-NOT-RC
          retention-days: 3
          path: |
            artifacts/EGGRUMBLE_GQ_CARRIER_27_PRIVATE.rbxlx
            artifacts/EGGRUMBLE_27_GQ_PRIVATE.project.json
            artifacts/SOURCE_RECEIPT.json
            artifacts/CARRIER_NATIVE.log
