name: P0D GQ8 Independent Realm34 Regen33 Mage32 Real37 Interop QA
on:
  push:
    branches: [quality/gq8-realm-regen-mage37-20261118]
    paths:
      - 'quality_gameplay/gq8_crosslane_realm_regen_mage37_20261118/**'
      - '.github/workflows/p0d-gq8-realm-regen-mage37.yml'
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_crosslane_realm_regen_mage37_20261118/**'
      - '.github/workflows/p0d-gq8-realm-regen-mage37.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-37-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 39
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: c51de1ed4feb7a7500ada95d21282402053ef988
          path: _realm764
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 5b82f300e6dee08ea1ac20ccd1449db0cd73dbc3
          path: _regen775
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 8f7984c1a9db2c016321d16d47a3ea8d1b5081df
          path: _gq780
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 2f4c1e43a7802929de3f633370b32791f7bf8d96
          path: _mage777
          persist-credentials: false
      - name: Structural good and malicious source mutation probes
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -v -s quality_gameplay/gq8_crosslane_realm_regen_mage37_20261118 -p 'test_*.py'
      - name: Select exact official RC HEAD and its own successful 31 build
        id: official
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow p0d-rc-eggrumble-v3-31.yml \
            --branch rc/p0d-s1-kids-rc01 --limit 70 \
            --json databaseId,headSha,status,conclusion > /tmp/official31.json
          RUN="$(jq -r '[.[]|select(.status=="completed" and .conclusion=="success")][0].databaseId // empty' /tmp/official31.json)"
          HEAD="$(jq -r '[.[]|select(.status=="completed" and .conclusion=="success")][0].headSha // empty' /tmp/official31.json)"
          test -n "$RUN"
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]]
          if [ "$HEAD" != "$CURRENT" ]; then
            echo "RED_STALE_OFFICIAL31_HEAD: success HEAD=$HEAD latest HEAD=$CURRENT"
            exit 1
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD" >> "$GITHUB_OUTPUT"
      - name: Fetch genuine official 31-source artifact, no synthetic substitution
        run: |
          set -euo pipefail
          mkdir -p artifacts/official
          gh run download "${{ steps.official.outputs.run }}" --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-RC31-CANONICAL-COMPANION-STUDIO \
            --dir artifacts/official
          test -s artifacts/official/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx
          test -s artifacts/official/gq515_official_select/GQ510_MAGE_SELECTED31.project.json
          test -s artifacts/official/gq530_all31/EGGRUMBLE_V3_OFFICIAL_RC31_RECEIPT.json
      - name: Compose from independent authors, with immutable exact31 source
        run: |
          set -euo pipefail
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py extract \
            --place artifacts/official/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx \
            --template artifacts/official/gq515_official_select/GQ510_MAGE_SELECTED31.project.json \
            --receipt artifacts/official/gq530_all31/EGGRUMBLE_V3_OFFICIAL_RC31_RECEIPT.json \
            --out artifacts/current31 --head "${{ steps.official.outputs.sha }}"
          python3 _realm764/handoffs/EGGRUMBLE-REALM-CORE-20261118/compose_core34.py \
            --current31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json \
            --lss-source handoffs/EGGRUMBLE-LAND-SEA-SKY-20261117/EGGRUMBLE_LandSeaSkyTraversal.server.luau \
            --out artifacts/realm34/REALM34.project.json
          python3 _regen775/handoffs/EGGRUMBLE-HP-REGEN-20261118/compose_regen32.py \
            --current31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json \
            --out artifacts/regen33/REGEN33.project.json
          python3 _gq780/quality_gameplay/gq8_crosslane_20261118/compose_rehearsal36.py \
            --original31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json \
            --regen33 artifacts/regen33/REGEN33.project.json \
            --realm34 artifacts/realm34/REALM34.project.json \
            --out artifacts/combined36/COMBINED36.project.json
          python3 _mage777/handoffs/EGGRUMBLE-MAGE-REVIVE-20261118/compose_mage32.py \
            --current31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json \
            --out artifacts/mage32/MAGE32.project.json
          python3 quality_gameplay/gq8_crosslane_realm_regen_mage37_20261118/compose_rehearsal37.py \
            --original31 artifacts/current31/CURRENT31_REAL_SOURCE.project.json \
            --combined36 artifacts/combined36/COMBINED36.project.json \
            --mage32 artifacts/mage32/MAGE32.project.json \
            --out artifacts/combined37/COMBINED37.project.json
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native compile all 37 exact author scripts and inverse31, no second HP writer
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8-combined -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8-combined --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from quality_gameplay.gq8_crosslane_realm_regen_mage37_20261118.compose_rehearsal37 import flatten
          for project,count in (("artifacts/combined37/COMBINED37.project.json",37),
                                ("artifacts/current31/CURRENT31_REAL_SOURCE.project.json",31)):
              _,files=flatten(Path(project))
              assert len(files)==count
              for file in files.values():
                  subprocess.run(["/tmp/gq8-combined/luau-compile","--text",str(file)],
                      check=True,stdout=subprocess.DEVNULL)
              print("GQ8_CROSSLANE_NATIVE_SOURCE_PASS",count)
          PY
      - name: Execute original Mage author real VM good and cooldown mutant RED
        run: |
          set -euo pipefail
          python3 _mage777/handoffs/EGGRUMBLE-MAGE-REVIVE-20261118/make_mage_vm.py --out /tmp/gq8-mage37
          /tmp/gq8-combined/luau-compile --text /tmp/gq8-mage37/good.luau >/dev/null
          /tmp/gq8-combined/luau /tmp/gq8-mage37/good.luau | tee /tmp/gq8-mage37-good.log
          grep -qx GQ8_MAGE_REVIVE_REAL_VM_TEAM_CROSS_TEAM_LOS_COOLDOWN_60S_PASS /tmp/gq8-mage37-good.log
          if /tmp/gq8-combined/luau /tmp/gq8-mage37/mutant.luau > /tmp/gq8-mage37-mutant.log 2>&1; then
            echo RED_MAGE_COOLDOWN_MUTANT_ACCEPTED
            exit 1
          fi
          grep -q RED_ /tmp/gq8-mage37-mutant.log
          echo GQ8_MAGE37_AUTHOR_REAL_VM_AND_MUTANT_RED_PASS
      - name: Install pinned Rojo and compare actual Source plus Roblox Script Class
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq8-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq8-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq8-rojo.zip") as z:
              names=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(names)==1
              p=Path("/tmp/gq8-rojo")
              p.write_bytes(z.read(names[0]));p.chmod(0o755)
          PY
          /tmp/gq8-rojo build artifacts/combined37/COMBINED37.project.json -o artifacts/combined37/COMBINED37.rbxlx
          /tmp/gq8-rojo build artifacts/current31/CURRENT31_REAL_SOURCE.project.json -o artifacts/combined37/OFF31.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/combined37/COMBINED37.project.json \
            --place artifacts/combined37/COMBINED37.rbxlx --count 37
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/current31/CURRENT31_REAL_SOURCE.project.json \
            --place artifacts/combined37/OFF31.rbxlx --count 31
          NOW="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$NOW" = "${{ steps.official.outputs.sha }}" || { echo RED_RC_MOVED_DURING_REHEARSAL; exit 1; }
          echo GQ8_CROSSLANE_REALM34_REGEN33_MAGE32_NATIVE_ROJO37_OFF31_SUCCESS
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-CROSSLANE-37-REHEARSAL-NOT-OFFICIAL
          path: |
            artifacts/combined37/
            artifacts/current31/CURRENT31_REAL_SOURCE_RECEIPT.json
          retention-days: 3
          if-no-files-found: error
