name: GQ8 Real55 P0 Host Runtime Activation and Rollback
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - '.github/workflows/gq8-host-autostart-real55.yml'
      - 'quality_gameplay/gq8_host_activation_20261119/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  runtime-class-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact official artifact; fail closed if RC changed
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=a6020867fac80fa3b2ca47478625873fc6f3678e
          LIVE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$LIVE" = "$EXPECTED" || { echo RED_RC_MOVED; exit 1; }
          EVIDENCE="$(gh run view 44393525211 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')"
          test "$EVIDENCE" = "$EXPECTED success" || { echo RED_OFFICIAL_RUN_MISMATCH; exit 1; }
          mkdir -p artifacts/official55
          gh run download 44393525211 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL55-CANONICAL-PRIVATE-STUDIO --dir artifacts/official55
      - name: Original P0 negative regression and byte preserving source correction
        shell: bash
        run: |
          set -euo pipefail
          D=quality_gameplay/gq8_host_activation_20261119
          python3 "$D/test_host_entrypoint.py"
          python3 "$D/repair_host_entrypoint.py" --base artifacts/official55 --out artifacts/active55
      - name: Pinned Rojo 7.7.1 real ON55 and byte-identical OFF55
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq8-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq8-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq8-rojo.zip') as z:
            n=[x for x in z.namelist() if x.split('/')[-1]=='rojo']
            assert len(n)==1
            p=Path('/tmp/rojo-gq8');p.write_bytes(z.read(n[0]));p.chmod(0o755)
          PY
          /tmp/rojo-gq8 build artifacts/active55/EGGRUMBLE_REAL55_HOST_ACTIVE.project.json -o artifacts/active55/EGGRUMBLE_REAL55_HOST_ACTIVE.rbxlx
          python3 quality_gameplay/gq8_host_activation_20261119/repair_host_entrypoint.py --verify artifacts/active55/EGGRUMBLE_REAL55_HOST_ACTIVE.rbxlx
          /tmp/rojo-gq8 build artifacts/official55/EGGRUMBLE_REAL55.project.json -o artifacts/active55/OFF55.rbxlx
          cmp artifacts/active55/OFF55.rbxlx artifacts/official55/EGGRUMBLE_REAL55.rbxlx
          python3 quality_gameplay/gq8_host_activation_20261119/repair_host_entrypoint.py --verify artifacts/active55/OFF55.rbxlx --original
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')" = a6020867fac80fa3b2ca47478625873fc6f3678e
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-REAL55-HOST-ACTIVE-PREVIEW-NOT-OFFICIAL
          path: artifacts/active55/
          retention-days: 5
          if-no-files-found: error
