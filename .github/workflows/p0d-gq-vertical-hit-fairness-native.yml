name: P0D GQ unique vertical skill hit fairness original Luau
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/v3_vertical_hit_fairness_20261116/**'
      - '.github/workflows/p0d-gq-vertical-hit-fairness-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vertical-reach-author-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: kk051780/toy-wars-factory, ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9, path: _original482, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: luau-lang/luau, ref: f46d879e28302a430029304f7f6a162aed66f103, path: _native_luau, persist-credentials: false}
      - name: Assert eight Python source-lock / rollback / mutation cases
        run: python3 -B -m unittest discover -s quality_gameplay/v3_vertical_hit_fairness_20261116 -p 'test_*.py' -v
      - name: Select original AttackGeometry only and prove immutable Git blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _original482 rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          python3 -B quality_gameplay/v3_vertical_hit_fairness_20261116/select_vertical.py \
            --original _original482/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_AttackGeometry.luau \
            --out-dir artifacts/gq_vertical
      - name: Compile original AND guarded source; execute 14 real Luau differential cases each
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _native_luau -B /tmp/gq_vertical_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_vertical_build --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          for f in artifacts/gq_vertical/*native.spec.luau; do
            /tmp/gq_vertical_build/luau-compile --text "$f" >/dev/null
            /tmp/gq_vertical_build/luau "$f"
          done
          /tmp/gq_vertical_build/luau-compile --text artifacts/gq_vertical/EGGRUMBLE_AttackGeometry_VERTICAL_SAFE.luau >/dev/null
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-GQ-VERTICAL-HIT-ORIGINAL-SOURCE-NATIVE-ONLY
          path: |
            artifacts/gq_vertical/EGGRUMBLE_AttackGeometry_VERTICAL_SAFE.luau
            artifacts/gq_vertical/SOURCE_RECEIPT.json
          if-no-files-found: error
