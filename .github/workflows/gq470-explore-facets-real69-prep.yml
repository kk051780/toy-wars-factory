name: GQ470 REAL69 exploration facet art A-source PREP (not ART GO)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_rc85_rc86_exploration_20261119/EGGRUMBLE_LegacyExplorationBridge.server.luau'
      - 'quality_gameplay/gq470_explore_facets_real69_20261121/**'
      - '.github/workflows/gq470-explore-facets-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-locked-on-off-69:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check new actual Luau source and ten negative mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile quality_gameplay/gq470_explore_facets_real69_20261121/verify_explore_facets69.py
          python3 -B quality_gameplay/gq470_explore_facets_real69_20261121/verify_explore_facets69.py --self-test
      - name: Fetch immutable official REAL69 artifact and patch one selected real source
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01 --jq .object.sha)" = "e80973c354f14a0d0088577f3cc1a875454f0f8f" || { echo RED_STALE_FORMAL_RC; exit 1; }
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44695199140 --jq '.head_sha+" "+.conclusion')" = "e80973c354f14a0d0088577f3cc1a875454f0f8f success"
          mkdir -p /tmp/gq470-explore
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir /tmp/gq470-explore
          test -s /tmp/gq470-explore/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 -B quality_gameplay/gq470_explore_facets_real69_20261121/verify_explore_facets69.py --base /tmp/gq470-explore
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native compile full 69 selected Lua on and off
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-explore-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-explore-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import sys,subprocess
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq470_explore_facets_real69_20261121")
          from verify_explore_facets69 import selected, ROUTE, OFF
          root=Path("/tmp/gq470-explore")
          on=selected(root);off=selected(root/OFF)
          assert len(on)==len(off)==69 and set(on)==set(off)
          assert {k for k in on if on[k].read_bytes()!=off[k].read_bytes()}=={ROUTE}
          for tree in (on,off):
              for path in tree.values():
                  subprocess.run(["/tmp/gq470-explore-luau/luau-compile","--text",str(path)],
                                 check=True,stdout=subprocess.DEVNULL)
          print("GQ470_EXPLORE_NATIVE_ON69_OFF69_PASS_SOURCE_ONLY")
          PY
      - name: Rojo on69 off69 exact original Place rollback and legacy source audits
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-explore-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-explore-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq470-explore-rojo.zip") as z:
              names=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(names)==1
              path=Path("/tmp/gq470-explore-rojo")
              path.write_bytes(z.read(names[0]));path.chmod(0o755)
          PY
          /tmp/gq470-explore-rojo build /tmp/gq470-explore/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-explore/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          /tmp/gq470-explore-rojo build /tmp/gq470-explore/OFF69_EXPLORATION_FACETS/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-explore/OFF69_EXPLORATION_FACETS_REBUILT.rbxlx
          cmp /tmp/gq470-explore/OFF69_EXPLORATION_FACETS_REBUILT.rbxlx /tmp/gq470-explore/OFF69_EXPLORATION_FACETS/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-explore/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-explore/EGGRUMBLE_REAL69_PRIVATE.rbxlx --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-explore/OFF69_EXPLORATION_FACETS/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-explore/OFF69_EXPLORATION_FACETS_REBUILT.rbxlx --count 69
          python3 quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base /tmp/gq470-explore --report /tmp/gq470-explore/LEGACY48_AUDIT_SOURCE_ONLY.json
      - name: Independent art source gate remains ART NO GO without photos
        shell: bash
        run: |
          set -euo pipefail
          python3 art_quality/gq470_real69_source_gate.py --self-test
          python3 art_quality/gq470_real69_source_gate.py --root /tmp/gq470-explore --head e80973c354f14a0d0088577f3cc1a875454f0f8f --out /tmp/gq470-explore/ART_CHECK_REPORT.json
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("/tmp/gq470-explore")
          a=json.loads((root/"ART_CHECK_REPORT.json").read_text())
          assert a["source_gate"]["status"]=="PASS_SOURCE_ONLY"
          assert a["source_gate"]["actual_place_scripts"]==69
          assert a["visual_evidence_gate"]["screenshots_received"]==0
          assert a["art_gate"]=="ART_NO_GO" and a["owner_accepted"] is False
          report=root/"EXPLORATION_FACETS_SOURCE_REPORT.json"
          x=json.loads(report.read_text())
          p=root/"EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          x["candidate_place_bytes"]=p.stat().st_size
          x["candidate_place_sha256"]=hashlib.sha256(p.read_bytes()).hexdigest()
          x["native_rojo_on_off69"]="PASS_SOURCE_ONLY"
          report.write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          print("GQ470_EXPLORE_CANDIDATE_PLACE_BYTES",p.stat().st_size)
          PY
      - name: B220 pickup single source, never official RC
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys,json,hashlib
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq470_explore_facets_real69_20261121")
          from verify_explore_facets69 import ROUTE,FEATURE,BASE,selected
          root=Path("/tmp/gq470-explore")
          p=selected(root)[ROUTE]
          pickup={"feature_id":FEATURE,"formal_base":BASE,
                  "candidate_head":"${{ github.event.pull_request.head.sha || github.sha }}",
                  "route":ROUTE,"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                  "formal_rc_adopted":False,"owner_accepted":False,
                  "decision":"B220_AUTH_WRITER_FRESH_CAS_REQUIRED"}
          (root/"B220_ONE_SOURCE_PICKUP_NOT_FORMAL.json").write_text(json.dumps(pickup,sort_keys=True,indent=2)+"\n")
          print("GQ470_EXPLORE_B220_PICKUP_ONE_SOURCE_ONLY")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-EXPLORATION-FACETS-SOURCE-PREP-NOT-FORMAL
          path: |
            /tmp/gq470-explore/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-explore/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-explore/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-explore/EXPLORATION_FACETS_SOURCE_REPORT.json
            /tmp/gq470-explore/LEGACY48_AUDIT_SOURCE_ONLY.json
            /tmp/gq470-explore/ART_CHECK_REPORT.json
            /tmp/gq470-explore/B220_ONE_SOURCE_PICKUP_NOT_FORMAL.json
            /tmp/gq470-explore/sources/**
            /tmp/gq470-explore/OFF69_EXPLORATION_FACETS_REBUILT.rbxlx
          if-no-files-found: error
          retention-days: 7
