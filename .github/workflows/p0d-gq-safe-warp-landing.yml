name: P0D GQ V3 safe warp destination actual private21 QA
on:
  push:
    branches:
      - quality/gq-v3-safe-warp-landing-20261116-q01
    paths:
      - 'quality_gameplay/v3_safe_warp_landing_20261116/**'
      - '.github/workflows/p0d-gq-safe-warp-landing.yml'
  pull_request:
    paths:
      - 'quality_gameplay/v3_safe_warp_landing_20261116/**'
      - '.github/workflows/p0d-gq-safe-warp-landing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native-real-rojo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin original author Combat and execute 16 negative/source contracts
        shell: bash
        run: |
          set -euo pipefail
          file=handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_SevenRoleCombat.luau
          test "$(git hash-object "$file")" = 66e666418b7c23d41f87faa5d61eb6e2770a463e
          python3 -B -m unittest discover -v -s quality_gameplay/v3_safe_warp_landing_20261116/tests
          mkdir -p artifacts
          python3 quality_gameplay/v3_safe_warp_landing_20261116/compose_private21.py prepare --out artifacts/PRIVATE21
          python3 quality_gameplay/v3_safe_warp_landing_20261116/make_native_warp_harness.py \
            --patched artifacts/PRIVATE21/EGGRUMBLE_SevenRoleCombat.luau \
            --out artifacts/GQ_SAFE_WARP_NATIVE.spec.luau
      - name: Check original author 8-domain behavior source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -q \
            -s handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests -p 'test_*.py'
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _native_luau
          persist-credentials: false
      - name: Native Luau compiler 21 original-author gameplay source/class including one generated Combat
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _native_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _native_luau -B /tmp/gq_warp_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_warp_luau --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          n=0
          for file in artifacts/PRIVATE21/*.luau; do
            /tmp/gq_warp_luau/luau-compile --text "$file" > /dev/null
            n=$((n+1))
          done
          test "$n" -eq 21
          echo "GQ_SAFE_WARP_NATIVE_LUAU_COMPILE_PASS_21"
          /tmp/gq_warp_luau/luau-compile --text artifacts/GQ_SAFE_WARP_NATIVE.spec.luau > /dev/null
          /tmp/gq_warp_luau/luau artifacts/GQ_SAFE_WARP_NATIVE.spec.luau | tee artifacts/GQ_SAFE_WARP_NATIVE.log
          grep -q GQ_SAFE_WARP_ORIGINAL_PATCHED_LUAU_11_SCENARIOS_PASS artifacts/GQ_SAFE_WARP_NATIVE.log
      - name: Pinned original Rojo builds actual private21 Place
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_safe_warp_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_safe_warp_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq_safe_warp_rojo.zip') as z:
              matched=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(matched)==1
              output=Path('/tmp/gq_safe_warp_rojo')
              output.write_bytes(z.read(matched[0]))
              output.chmod(0o755)
          PY
          /tmp/gq_safe_warp_rojo build artifacts/PRIVATE21/EGGRUMBLE_V3_STUDIO.project.json -o artifacts/GQ_SAFE_WARP_PRIVATE21_NOT_RC.rbxlx
          python3 quality_gameplay/v3_safe_warp_landing_20261116/compose_private21.py verify \
            --out artifacts/PRIVATE21 --place artifacts/GQ_SAFE_WARP_PRIVATE21_NOT_RC.rbxlx
      - name: Preserve private evidence only (not official RC)
        uses: actions/upload-artifact@v4
        with:
          name: GQ_SAFE_WARP_PRIVATE21_NOT_OFFICIAL_RC
          path: |
            artifacts/GQ_SAFE_WARP_PRIVATE21_NOT_RC.rbxlx
            artifacts/PRIVATE21/SOURCE_LOCK.json
            artifacts/GQ_SAFE_WARP_NATIVE.log
          if-no-files-found: error
          retention-days: 7
