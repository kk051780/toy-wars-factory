name: P0D GQ V3 abandoned queue timer source/native/private Place
on:
  push:
    branches: ['quality/gq-v3-empty-queue-timer-20261116-01']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 6b52eaf1f2725496277998fe0c5532b7a8fcaab5
          path: _owner
          persist-credentials: false
      - name: Verify pinned original and source-only callback / rollback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _owner rev-parse HEAD)" = "6b52eaf1f2725496277998fe0c5532b7a8fcaab5"
          python3 -B -m unittest discover -v -s quality_gameplay/v3_queue_countdown_lifecycle_20261116/tests
          mkdir -p artifacts
          SRC=_owner/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_LobbyCastleModesPreview.server.luau
          cp "$SRC" artifacts/HOST_ORIGINAL_OFF.luau
          python3 quality_gameplay/v3_queue_countdown_lifecycle_20261116/compose.py --input "$SRC" --output artifacts/HOST_ON.luau
          python3 quality_gameplay/v3_queue_countdown_lifecycle_20261116/compose.py --input "$SRC" --output artifacts/HOST_OFF.luau --off
          cmp artifacts/HOST_ORIGINAL_OFF.luau artifacts/HOST_OFF.luau
          cp artifacts/HOST_ON.luau "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          from quality_gameplay.v3_queue_countdown_lifecycle_20261116.compose import BEFORE,AFTER
          old=Path('artifacts/HOST_OFF.luau').read_text()
          new=Path('artifacts/HOST_ON.luau').read_text()
          assert new.replace(AFTER,BEFORE,1)==old
          print('SOURCE_ONE_HOST_CALLBACK_ONLY_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau
          persist-credentials: false
      - name: Native real Host timer and mapped gameplay Luau checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _luau rev-parse HEAD)" = "f46d879e28302a430029304f7f6a162aed66f103"
          cmake -S _luau -B /tmp/gq_queue_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_queue_native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          SRC=_owner/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_LobbyCastleModesPreview.server.luau
          python3 quality_gameplay/v3_queue_countdown_lifecycle_20261116/native_queue.py --source "$SRC" --luau /tmp/gq_queue_native/luau --output artifacts/QUEUE_REAL_NATIVE.luau | tee artifacts/NATIVE.log
          grep -q GQ_QUEUE_ACTUAL_HOST_NATIVE_4_SCENARIOS_PASS artifacts/NATIVE.log
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('_owner/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116')
          project=json.loads((root/'EGGRUMBLE_V3_STUDIO.project.json').read_text())['tree']
          files=[]
          def walk(node):
              if not isinstance(node,dict):return
              if '$path' in node:
                  files.append(root/node['$path']);return
              for name,child in node.items():
                  if not name.startswith('$'):walk(child)
          walk(project)
          assert len(files)>=16,len(files)
          for f in files:
              assert f.is_file(),str(f)
              subprocess.run(['/tmp/gq_queue_native/luau-compile','--text',str(f)],check=True,stdout=subprocess.DEVNULL)
          print('GQ_QUEUE_MAPPED_NATIVE_ALL_PASS',len(files))
          PY
      - name: Build private unpublished exact source Place
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_queue_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_queue_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq_queue_rojo.zip') as archive:
              names=[n for n in archive.namelist() if n.split('/')[-1]=='rojo']
              assert len(names)==1
              f=Path('/tmp/gq_queue_rojo')
              f.write_bytes(archive.read(names[0]));f.chmod(0o755)
          PY
          /tmp/gq_queue_rojo build _owner/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json -o artifacts/EGGRUMBLE_QUEUE_TIMER_PRIVATE_NOT_RC.rbxlx
          python3 - <<'PY'
          import json,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('_owner/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116')
          place=Path('artifacts/EGGRUMBLE_QUEUE_TIMER_PRIVATE_NOT_RC.rbxlx')
          expected={}
          def walk(node):
              if not isinstance(node,dict):return
              for name,child in node.items():
                  if name.startswith('$') or not isinstance(child,dict):continue
                  if '$path' in child:
                      file=root/child['$path']
                      kind=('Script' if file.name.endswith('.server.luau') else 'LocalScript' if file.name.endswith('.client.luau') else 'ModuleScript')
                      expected[name]=(kind,file.read_text().replace('\r\n','\n'))
                  else:walk(child)
          walk(json.loads((root/'EGGRUMBLE_V3_STUDIO.project.json').read_text())['tree'])
          actual={}
          for item in ET.parse(place).getroot().iter('Item'):
              kind=item.get('class')
              if kind not in ('Script','ModuleScript','LocalScript'):continue
              props=item.find('Properties')
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              source=props.findtext("ProtectedString[@name='Source']")
              if source is None:source=props.findtext("string[@name='Source']")
              if name:
                  assert name not in actual,name
                  actual[name]=(kind,(source or '').replace('\r\n','\n'))
          assert expected==actual,{'missing':list(expected.keys()-actual.keys()),'extra':list(actual.keys()-expected.keys()),'different':[k for k in expected.keys()&actual.keys() if expected[k]!=actual[k]]}
          report={'kind':'PRIVATE_NOT_RC','original_author_head':'6b52eaf1f2725496277998fe0c5532b7a8fcaab5','source_exact':len(expected),'place_bytes':place.stat().st_size,'place_sha256':hashlib.sha256(place.read_bytes()).hexdigest(),'official_adopted':False,'studio_engine_tested':False}
          Path('artifacts/RECEIPT.json').write_text(json.dumps(report,indent=2)+'\n')
          print('PRIVATE_PLACE_SOURCE_CLASS_EXACT_PASS',report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EGGRUMBLE_V3_QUEUE_TIMER_PRIVATE_NOT_RC
          path: |
            artifacts/RECEIPT.json
            artifacts/NATIVE.log
            artifacts/HOST_ON.luau
            artifacts/HOST_OFF.luau
            artifacts/EGGRUMBLE_QUEUE_TIMER_PRIVATE_NOT_RC.rbxlx
          retention-days: 3
