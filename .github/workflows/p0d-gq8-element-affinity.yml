name: P0D GQ8 Element Affinity Pure Policy Native QA
on:
  push:
    branches: ['feature/gq8-element-affinity-20261118']
    paths:
      - 'handoffs/EGGRUMBLE-ELEMENTAL-20261118/**'
      - '.github/workflows/p0d-gq8-element-affinity.yml'
  pull_request:
    branches: ['rc/p0d-s1-kids-rc01']
    paths:
      - 'handoffs/EGGRUMBLE-ELEMENTAL-20261118/**'
      - '.github/workflows/p0d-gq8-element-affinity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-elemental-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Generate source-derived true native cases
        run: |
          set -euo pipefail
          python3 -B handoffs/EGGRUMBLE-ELEMENTAL-20261118/make_native_tests.py --out /tmp/gq8-element
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile pinned real Luau source and native good/mutant tests
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8-element-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8-element-native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          CLI=/tmp/gq8-element-native/luau
          CC=/tmp/gq8-element-native/luau-compile
          "$CC" --text handoffs/EGGRUMBLE-ELEMENTAL-20261118/ElementalAffinityPolicy.luau >/dev/null
          "$CC" --text /tmp/gq8-element/good.luau >/dev/null
          "$CC" --text /tmp/gq8-element/mutant.luau >/dev/null
          "$CLI" /tmp/gq8-element/good.luau | tee /tmp/gq8-element-good.log
          grep -qx 'GQ8_ELEMENT_AFFINITY_NATIVE_64_MATRIX_AND_ENVIRONMENT_PASS' /tmp/gq8-element-good.log
          if "$CLI" /tmp/gq8-element/mutant.luau >/tmp/gq8-element-mutant.log 2>&1; then
            echo RED_ELEMENT_COUNTER_MUTANT_WAS_ACCEPTED
            exit 1
          fi
          grep -q RED_COUNTER_RING /tmp/gq8-element-mutant.log
          echo GQ8_ELEMENT_AFFINITY_REAL_LUAU_AND_MUTANT_RED_PASS
