name: GQ8 Viral Moments Optional Capture Actual Luau QA
on:
  push:
    branches: ['feature/gq8-viral-moments-20261119']
    paths:
      - 'handoffs/EGGRUMBLE-VIRAL-20261119/**'
      - 'releases/P0D_S1_KIDS_RC01/src/shared/ViralMomentPolicy.luau'
      - 'releases/P0D_S1_KIDS_RC01/src/client/ViralMomentCapture.client.luau'
      - 'releases/P0D_S1_KIDS_RC01/default.project.json'
      - '.github/workflows/p0d-gq8-viral-capture.yml'
  pull_request:
    branches: ['rc/p0d-s1-kids-rc01']
    paths:
      - 'handoffs/EGGRUMBLE-VIRAL-20261119/**'
      - 'releases/P0D_S1_KIDS_RC01/src/shared/ViralMomentPolicy.luau'
      - 'releases/P0D_S1_KIDS_RC01/src/client/ViralMomentCapture.client.luau'
      - 'releases/P0D_S1_KIDS_RC01/default.project.json'
      - '.github/workflows/p0d-gq8-viral-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-verbatim-native:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate optional mapping/no authority and generate exact-source tests
        run: |
          set -euo pipefail
          python3 -B handoffs/EGGRUMBLE-VIRAL-20261119/qa_native_viral.py --out /tmp/gq8-viral-good.luau
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile actual Luau source and run source-derived behavior tests
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8-viral-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8-viral-build --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          CLI=/tmp/gq8-viral-build/luau
          CC=/tmp/gq8-viral-build/luau-compile
          "$CC" --text releases/P0D_S1_KIDS_RC01/src/shared/ViralMomentPolicy.luau >/dev/null
          "$CC" --text releases/P0D_S1_KIDS_RC01/src/client/ViralMomentCapture.client.luau >/dev/null
          "$CC" --text /tmp/gq8-viral-good.luau >/dev/null
          "$CLI" /tmp/gq8-viral-good.luau | tee /tmp/gq8-viral-good.log
          grep -qx GQ8_VIRAL_POLICY_REAL_SOURCE_NATIVE_PASS /tmp/gq8-viral-good.log
          echo GQ8_VIRAL_NATIVE_READY_NOT_STUDIO_ACCEPTED

      - name: Same-HEAD Rojo real project build (no Studio publish)
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/rojo-7.6.1.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.6.1/rojo-7.6.1-linux-x86_64.zip
          echo 'a9542a713036897fdbd0173e7a105ea409658333133c949025fcb6f1a7ca909d  /tmp/rojo-7.6.1.zip' | sha256sum -c -
          mkdir -p /tmp/gq8-rojo
          unzip -q /tmp/rojo-7.6.1.zip -d /tmp/gq8-rojo
          chmod +x /tmp/gq8-rojo/rojo
          /tmp/gq8-rojo/rojo build releases/P0D_S1_KIDS_RC01/default.project.json -o /tmp/gq8-viral-actual.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/gq8-viral-actual.rbxlx')
          xml=p.read_text()
          for exact in ('ViralMomentCapture','ViralMomentPolicy','TrapRaidersHUD','TrapRaidersCoach'):
              assert exact in xml, 'RED_ROJO_SCRIPT_NOT_BUILT_'+exact
          assert len(xml) > 10000, 'RED_EMPTY_ROJO_PLACE'
          print('GQ8_VIRAL_SAME_HEAD_ROJO_PLACE_BUILD_PASS_BYTES',p.stat().st_size)
          PY
