name: P0D GQ Four Author Single Combat 22 Private RC Intake
on:
  push:
    branches: [quality/gq-v3-human-stealth-pvp-20261116-01]
    paths:
      - 'quality_gameplay/v3_human_stealth_pvp_20261116/**'
      - '.github/workflows/p0d-gq-human-stealth-four-author.yml'
  pull_request:
    paths:
      - 'quality_gameplay/v3_human_stealth_pvp_20261116/**'
      - '.github/workflows/p0d-gq-human-stealth-four-author.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-author-source-union:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse pinned MAGE #510 original author read-only
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 0338bd13f9d3d199972bd4cd30e467443083dffa
          path: _gq_mage
          persist-credentials: false
      - name: Reuse pinned DOT #516 original author read-only
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 8f0275692c54874f823d66748d470fb849607df5
          path: _gq_dot
          persist-credentials: false
      - name: Reuse pinned WARP #524 original author read-only
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: f90875e14446ba86b1c668ba43efa37fbc74be20
          path: _gq_warp
          persist-credentials: false
      - name: Verify all author HEADs, 4 patches and original 21 source unchanged
        run: |
          set -euo pipefail
          test "$(git -C _gq_mage rev-parse HEAD)" = 0338bd13f9d3d199972bd4cd30e467443083dffa
          test "$(git -C _gq_dot rev-parse HEAD)" = 8f0275692c54874f823d66748d470fb849607df5
          test "$(git -C _gq_warp rev-parse HEAD)" = f90875e14446ba86b1c668ba43efa37fbc74be20
          mkdir -p artifacts
          python3 quality_gameplay/v3_human_stealth_pvp_20261116/compose_four_author.py \
            --combat artifacts/GQ_FOUR_AUTHOR_ONE_COMBAT.luau \
            --project artifacts/GQ_FOUR_AUTHOR_PRIVATE22.project.json \
            --receipt artifacts/GQ_FOUR_AUTHOR_RECEIPT.json
          git diff --exit-code -- handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116
          python3 - <<'PY'
          import json
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          own=SourceFileLoader("own","quality_gameplay/v3_human_stealth_pvp_20261116/build_candidate.py").load_module()
          mage=SourceFileLoader("mage","_gq_mage/quality_gameplay/v3_mage_heal_los_20261116/build_candidate.py").load_module()
          four=Path("artifacts/GQ_FOUR_AUTHOR_ONE_COMBAT.luau").read_text()
          rules=Path("handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_CastleMatchRules.luau").read_text()
          Path("artifacts/GQ_FOUR_HUMAN_NATIVE.luau").write_text(own.harness(four,True))
          Path("artifacts/GQ_FOUR_MAGE_NATIVE.luau").write_text(mage.harness(four,fixed=True,rules=rules))
          PY
          python3 _gq_dot/quality_gameplay/v3_status_tick_fence_20261116/tools/make_actual_status_callback_native.py \
            --source artifacts/GQ_FOUR_AUTHOR_ONE_COMBAT.luau \
            --out artifacts/GQ_FOUR_DOT_NATIVE.luau
          cp _gq_dot/quality_gameplay/v3_status_tick_fence_20261116/EGGRUMBLE_StatusTickFence.luau artifacts/StatusFence.luau
      - name: Pinned native Luau compiler for EXACT 22 combined scripts
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq_luau
          persist-credentials: false
      - name: Native original 22/22 + real extracted PvP/MAGE/DOT regression
        run: |
          set -euo pipefail
          cmake -S _gq_luau -B /tmp/gq_four_luau -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_four_luau --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          m=SourceFileLoader("composer","quality_gameplay/v3_human_stealth_pvp_20261116/compose_four_author.py").load_module()
          project=Path("artifacts/GQ_FOUR_AUTHOR_PRIVATE22.project.json").resolve()
          allsrc=m.scripts(json.loads(project.read_text()),project.parent)
          assert len(allsrc)==22
          for name,(_,path) in allsrc.items():
              subprocess.run(["/tmp/gq_four_luau/luau-compile","--text",str(path)],check=True,stdout=subprocess.DEVNULL)
          for p in ("artifacts/GQ_FOUR_HUMAN_NATIVE.luau","artifacts/GQ_FOUR_MAGE_NATIVE.luau","artifacts/GQ_FOUR_DOT_NATIVE.luau"):
              subprocess.run(["/tmp/gq_four_luau/luau-compile","--text",p],check=True,stdout=subprocess.DEVNULL)
          print("GQ_FOUR_AUTHOR_NATIVE_ORIGINAL22_OF22_COMPILE_PASS")
          PY
          /tmp/gq_four_luau/luau artifacts/GQ_FOUR_HUMAN_NATIVE.luau | tee /tmp/human.log
          grep -q GQ_HUMAN_STEALTH_PVP_REAL_SOURCE_12_CASES_PASS /tmp/human.log
          /tmp/gq_four_luau/luau artifacts/GQ_FOUR_MAGE_NATIVE.luau | tee /tmp/mage.log
          grep -q MAGE_ORIGINAL_1H15AI_TEAM_BR_GAMEPLAY_NATIVE_CASES_PASS /tmp/mage.log
          (cd artifacts && /tmp/gq_four_luau/luau GQ_FOUR_DOT_NATIVE.luau) | tee /tmp/dot.log
          grep -q GQ_V3_ACTUAL_SERVER_STATUS_CALLBACK_NATIVE_18_SCENARIOS_PASS /tmp/dot.log
          echo "GQ_FOUR_AUTHOR_CROSS_PATCH_NATIVE_HUMAN12_MAGE12_DOT18_PASS"
      - name: Reuse pinned checksum-verified Rojo and exact private Place
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_four_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_four_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile("/tmp/gq_four_rojo.zip") as z:
              xs=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(xs)==1
              out=Path("/tmp/gq_four_rojo")
              out.write_bytes(z.read(xs[0]))
              out.chmod(0o755)
          PY
          /tmp/gq_four_rojo build artifacts/GQ_FOUR_AUTHOR_PRIVATE22.project.json \
            -o artifacts/GQ_FOUR_AUTHOR_PRIVATE22_NOT_RC.rbxlx
          python3 quality_gameplay/v3_human_stealth_pvp_20261116/compose_four_author.py \
            --project artifacts/GQ_FOUR_AUTHOR_PRIVATE22.project.json \
            --receipt artifacts/GQ_FOUR_AUTHOR_RECEIPT.json \
            --verify-place artifacts/GQ_FOUR_AUTHOR_PRIVATE22_NOT_RC.rbxlx
      - name: Upload only private author-integrated intake evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GQ-FOUR-AUTHOR-PRIVATE22-ONE-COMBAT-NOT-RC
          path: |
            artifacts/GQ_FOUR_AUTHOR_PRIVATE22_NOT_RC.rbxlx
            artifacts/GQ_FOUR_AUTHOR_PRIVATE22.project.json
            artifacts/GQ_FOUR_AUTHOR_RECEIPT.json
          retention-days: 3
