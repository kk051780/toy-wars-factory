name: P0D S1 eight change complete original source Native Luau and Rojo REVIEW
on:
  push:
    branches:
      - review/p0d-s1-eight-safe-hud-order-20261113-11
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eight-s1-review-only:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P0D_PROJECT: releases/P0D_S1_KIDS_RC01
      P0D_CHECK: handoffs/P0D-S1-EIGHT-SAFE-HUD-FULL-REVIEW-20261113-11
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout isolated review branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check source manifest 37 files and fixed seven-source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$P0D_CHECK/verify_eight_review.py"
          python3 -B -m unittest discover -s "$P0D_PROJECT/tests" -p 'test_*.py' -v
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Fetch fixed actual Rojo release 7.7.1 and verify ZIP hash
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            -o /tmp/p0d_eight_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_eight_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import pathlib, stat, zipfile
          with zipfile.ZipFile("/tmp/p0d_eight_rojo.zip") as z:
              paths=[n for n in z.namelist() if n.rsplit("/",1)[-1]=="rojo"]
              assert len(paths)==1
              data=z.read(paths[0])
              assert len(data)>1000000
              p=pathlib.Path("/tmp/p0d_eight_rojo")
              p.write_bytes(data)
              p.chmod(p.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_eight_rojo --version | grep -F 7.7.1
      - name: Actually build unpublished complete eight-source Roblox Place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_eight_output
          /tmp/p0d_eight_rojo build "$P0D_PROJECT/default.project.json" \
            -o /tmp/p0d_eight_output/TRAP_RAIDERS_S1_EIGHT_SAFE_HUD_REVIEW.rbxlx
          test -s /tmp/p0d_eight_output/TRAP_RAIDERS_S1_EIGHT_SAFE_HUD_REVIEW.rbxlx
      - name: Verify real place 21 original script bodies and 11 unsafe mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$P0D_CHECK/verify_real_rojo.py" \
            --place /tmp/p0d_eight_output/TRAP_RAIDERS_S1_EIGHT_SAFE_HUD_REVIEW.rbxlx \
            --receipt /tmp/p0d_eight_output/EIGHT_SAFE_HUD_REVIEW_ONLY_RECEIPT.json
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Fetch pinned upstream Luau source for real compiler
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_six_luau
          persist-credentials: false
          fetch-depth: 1
      - name: Build real Luau syntax compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_six_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_six_luau -B /tmp/p0d_eight_native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_eight_native --target Luau.Compile.CLI --parallel 4
      - name: Native compile all exact current 21 Luau sources including preserved safe gameplay source and new ordered snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, subprocess
          scripts=sorted(pathlib.Path(os.environ["P0D_PROJECT"]).joinpath("src").rglob("*.luau"))
          assert len(scripts)==21, len(scripts)
          compiler="/tmp/p0d_eight_native/luau-compile"
          for f in scripts:
              p=subprocess.run([compiler,str(f)],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              assert p.returncode==0,(f,p.stderr.decode(errors="replace")[-700:])
          broken=pathlib.Path("/tmp/p0d_eight_invalid.luau")
          broken.write_text("local = 1\n",encoding="utf8")
          assert subprocess.run([compiler,str(broken)],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE).returncode != 0
          print("P0D_EIGHT_NATIVE_21_OF_21_LUAU_COMPILE_PASS")
          print("P0D_EIGHT_NATIVE_BAD_SYNTAX_REJECTED")
          PY
      - name: Save immutable review-only .rbxlx and verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: P0D-S1-EIGHT-SAFE-HUD-REVIEW-ONLY
          path: |
            /tmp/p0d_eight_output/TRAP_RAIDERS_S1_EIGHT_SAFE_HUD_REVIEW.rbxlx
            /tmp/p0d_eight_output/EIGHT_SAFE_HUD_REVIEW_ONLY_RECEIPT.json
          if-no-files-found: error
          retention-days: 14
