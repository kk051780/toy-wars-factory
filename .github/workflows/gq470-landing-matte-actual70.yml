name: GQ470 Landing Matte ART17 actual REAL69 to 70 PREP (NOT FORMAL)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01, prep/gq470-fb015-landing-matte-3d-20261121-1540]
    paths:
      - 'quality_gameplay/gq470_landing_shadow_20261121/**'
      - '.github/workflows/gq470-landing-matte-actual70.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  landing-actual-art17-source-on70-off69:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin actual ART17 author packet identity, not its PR body
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44864701798 --jq '.head_sha+" "+.conclusion')" = "f60bfb9488edef389aa6f3f5411ad39d045d7a08 success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44864701798/artifacts --jq '.artifacts[] | select(.name=="GQ470-ART16-P0-17-REAL69-B220-PACKET-NOT-FORMAL") | .id')" = "14691232367"
          mkdir -p "$RUNNER_TEMP/gq470-art17"
          gh run download 44864701798 --repo "$GITHUB_REPOSITORY" --name GQ470-ART16-P0-17-REAL69-B220-PACKET-NOT-FORMAL --dir "$RUNNER_TEMP/gq470-art17"
          test -s "$RUNNER_TEMP/gq470-art17/on/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          echo GQ470_ART17_PINNED_PACKET_DOWNLOADED_NOT_OFFICIAL
      - name: Recover 69 actual Luau from Rojo Place and prove 17 author selections
        shell: bash
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq470_landing_shadow_20261121/recover_real69_from_place.py --root "$RUNNER_TEMP/gq470-art17/on"
      - name: Compose 70 with one unique source and source-exact OFF69
        shell: bash
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq470_landing_shadow_20261121/compose_landing70.py --self-test
          python3 -B quality_gameplay/gq470_landing_shadow_20261121/compose_landing70.py --base "$RUNNER_TEMP/gq470-art17/on" --out "$RUNNER_TEMP/gq470-landing-real70"
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native Luau compile all 70 current game source and 69 rollback
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-real70-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-real70-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq470_landing_shadow_20261121')
          from compose_landing70 import selected_map,OUTPUT_PROJECT
          root=Path(os.environ['RUNNER_TEMP'])/'gq470-landing-real70'
          for profile,count in (('on70',70),('off69',69)):
              found=selected_map(root/profile,OUTPUT_PROJECT)
              assert len(found)==count
              for file in found.values():
                  subprocess.run(['/tmp/gq470-real70-luau/luau-compile','--text',str(file)],check=True,stdout=subprocess.DEVNULL)
              print('GQ470_LANDING_'+profile.upper()+'_TRUE_NATIVE_COMPILE',count)
          PY
      - name: Pinned Rojo 7.7.1 generate true ON70 and OFF69 Studio source places
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-landing-real70-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-landing-real70-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq470-landing-real70-rojo.zip') as z:
              names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(names)==1
              p=Path('/tmp/gq470-landing-real70-rojo')
              p.write_bytes(z.read(names[0]));p.chmod(0o755)
          PY
          ROOT="$RUNNER_TEMP/gq470-landing-real70"
          /tmp/gq470-landing-real70-rojo build "$ROOT/on70/EGGRUMBLE_LANDING70.project.json" -o "$ROOT/on70/GQ470_LANDING_REAL70_SOURCE_ONLY.rbxlx"
          /tmp/gq470-landing-real70-rojo build "$ROOT/off69/EGGRUMBLE_LANDING70.project.json" -o "$ROOT/off69/GQ470_LANDING_OFF69_EXACT_SOURCE.rbxlx"
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq470_landing_shadow_20261121')
          from compose_landing70 import selected_map,OUTPUT_PROJECT,SOURCE_ROUTE
          from recover_real69_from_place import source_from_place
          root=Path(os.environ['RUNNER_TEMP'])/'gq470-landing-real70'
          report={}
          for profile,number in (('on70',70),('off69',69)):
              folder=root/profile
              place=folder/('GQ470_LANDING_REAL70_SOURCE_ONLY.rbxlx' if profile=='on70' else 'GQ470_LANDING_OFF69_EXACT_SOURCE.rbxlx')
              actual=source_from_place(place.read_bytes(),number)
              selected=selected_map(folder,OUTPUT_PROJECT)
              assert len(actual)==len(selected)==number
              assert set(actual)==set(selected)
              for route,path in selected.items():
                  assert actual[route][1]==path.read_bytes(), ('Rojo source differs',profile,route)
              assert (SOURCE_ROUTE in actual)==(profile=='on70')
              if profile=='on70':
                  assert actual[SOURCE_ROUTE][0]=='LocalScript'
              report[profile]={'source_count':number,'place_bytes':place.stat().st_size,'place_sha256':hashlib.sha256(place.read_bytes()).hexdigest(),'source_and_class_exact':number}
          on=selected_map(root/'on70',OUTPUT_PROJECT)
          off=selected_map(root/'off69',OUTPUT_PROJECT)
          assert all(on[k].read_bytes()==v.read_bytes() for k,v in off.items())
          (root/'GQ470_LANDING_REAL70_ART17_QA.json').write_text(json.dumps({
              'formal':False,'art_go':False,'studio':'NOT_TESTED','android':'NOT_TESTED',
              'parent_candidate':'PR983 artifact14691232367','original69_exact':True,
              'new_game_authorities':0,'profile':report},indent=2)+'\n')
          print('GQ470_LANDING_ART17_ACTUAL_REAL69_TO_REAL70_SOURCE_ROJO_GREEN_NOT_FORMAL',report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-LANDING-REAL70-ART17-A-PACKET-NOT-FORMAL
          retention-days: 14
          path: |
            ${{ runner.temp }}/gq470-landing-real70/on70/GQ470_LANDING_REAL70_SOURCE_ONLY.rbxlx
            ${{ runner.temp }}/gq470-landing-real70/off69/GQ470_LANDING_OFF69_EXACT_SOURCE.rbxlx
            ${{ runner.temp }}/gq470-landing-real70/receipt.json
            ${{ runner.temp }}/gq470-landing-real70/GQ470_LANDING_REAL70_ART17_QA.json
            ${{ runner.temp }}/gq470-art17/on/GQ470_REHYDRATED_ART17_SOURCE_PROOF.json
  landing-postupload-independent-qa:
    needs: [landing-actual-art17-source-on70-off69]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Redownload actual just-published artifact (not job workspace)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gq470-art17-downloaded"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name GQ470-LANDING-REAL70-ART17-A-PACKET-NOT-FORMAL \
            --dir "$RUNNER_TEMP/gq470-art17-downloaded"
          test -s "$RUNNER_TEMP/gq470-art17-downloaded/gq470-landing-real70/on70/GQ470_LANDING_REAL70_SOURCE_ONLY.rbxlx"
          test -s "$RUNNER_TEMP/gq470-art17-downloaded/gq470-landing-real70/off69/GQ470_LANDING_OFF69_EXACT_SOURCE.rbxlx"
      - name: Full class/source/hash/17-author preservation and 12 mutated artifact rejections
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq470_landing_shadow_20261121/verify_real70_postupload.py \
            --downloaded "$RUNNER_TEMP/gq470-art17-downloaded"
          echo GQ470_POSTUPLOAD_FINAL_PASS_A_SOURCE_ONLY_NOT_FORMAL_NOT_ART_GO
