name: P0D canonical RC fast-lane Studio build
on:
  push:
    branches:
      - rc/p0d-s1-kids-rc01
      - feature/p0d-private61-native105-size-qa-20261114
      - feature/p0d-private62-starry-meteor-20261114-01
      - feature/p0d-private63-meteor-shards-mobile-20261114-01
      - feature/p0d-flat63-official57-direct-intake-20261114
      - feature/p0d-rc64-twin-flat-official-intake-20261114
      - feature/p0d-flat65-twin-training-rc-adoption-20261114
      - feature/p0d-bond66-latest-rc346-prep-20261114
    paths:
      - 'rc_fastlane/**'
      - '.github/workflows/p0d-rc-fastlane.yml'
  pull_request:
    branches:
      - rc/p0d-s1-kids-rc01
      - feature/p0d-wcs-rc58-fastlane-candidate-20261114-02
      - feature/p0d-wcs-sevenjobs-rc59-candidate-20261114
      - feature/p0d-wcs-jobs-egg-classic-rc60-candidate-20261114
    paths:
      - 'rc_fastlane/**'
      - '.github/workflows/p0d-rc-fastlane.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: RC source profile (fallback selectable; official active remains ACTIVE.json)
        type: choice
        required: true
        default: rich51
        options:
          - rich51
          - rich47
          - legacy21
permissions:
  contents: read
jobs:
  rc-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROFILE: ${{ github.event.inputs.profile || 'rich51' }}
      EXPECTED_SOURCE: ${{ (github.event.inputs.profile == 'rich47' && 'f74686cbfc601436962df8aeb8da7a1b3ff92152') || '79123d35cd7afdd5f4f9941675bc2d2cf382ac4e' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: ${{ env.EXPECTED_SOURCE }}
          path: _p0d_pinned_source
          persist-credentials: false
      - name: Validate selected official RC profile and freeze source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          x=json.load(open('rc_fastlane/ACTIVE.json',encoding='utf8'))
          p=os.environ['PROFILE']
          assert p in x['source_profiles'],p
          assert p == 'rich51' or os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch',"FALLBACK_ONLY_MANUAL"
          source=x['source_profiles'][p]['source_commit']
          if p=='legacy21':source=x['source_profiles']['rich51']['source_commit']
          actual=subprocess.check_output(['git','-C','_p0d_pinned_source','rev-parse','HEAD'],text=True).strip()
          assert actual==source==os.environ['EXPECTED_SOURCE'],(actual,source)
          assert x['active_profile']=='rich51'
          assert x['previous_official_rc_commit']=='1263a03701211a652b99b91d2339575dc8104eff'
          print('PINNED_RC_PROFILE_SOURCE_PASS',p,source)
          PY
      - name: Assemble original authored real game once (no reauthoring)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            python3 -B _p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/tools/assemble.py --assemble
          elif [ "$PROFILE" = rich47 ]; then
            python3 -B _p0d_pinned_source/handoffs/P0D-RC-H1-SKYV5-DOJO-RESULT-20261113-01/tools/assemble.py --assemble
          else
            test -f releases/P0D_S1_KIDS_RC01/default.project.json
          fi
      - name: Apply exact source-locked per-feature Studio V4 idle/friend overlay (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            python3 -B rc_fastlane/apply_overlays.py \
              --dist "_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE" \
              --profile "$PROFILE"
          fi
      - name: Add P0D optional gameplay directly to current RC, never modifying author 51
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s rc_fastlane -p test_realm_hunt.py -v
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/integrate.py --profile rich51 --dist "$DIST"
          fi
      - name: Integrate author-pinned six-skill DEV persistence on the same Game Store
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_sixskill_durable.py --profile rich51 --dist "$DIST"
          fi
      - name: Apply source-exact saved WEAPON level -> neutral PvE tier in existing Game
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_saved_pve.py --profile rich51 --dist "$DIST"
          fi
      - name: Integrate saved BEAST mastery into original real evolved scout
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_saved_beast.py --profile rich51 --dist "$DIST"
          fi
      - name: Add forest swift and star burst species within ORIGINAL evolved scout
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_scout_species.py --profile rich51 --dist "$DIST"
          fi
      - name: Add source-locked Crystal Canyon/Moguron stage with independent rollback (Studio only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s rc_fastlane -p test_wcs_f01_c01.py -v
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_wcs_f01_c01.py --profile rich51 --dist "$DIST"
          fi
      - name: Integrate original Seven Jobs PvE narrow Game/HUD patch after WCS
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_seven_jobs_pve.py --dist "$DIST"
          fi
      - name: Add classic 1-egg teammate relay inside one Game after SevenJobs
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_egg_relay_classic.py --dist "$DIST" --policy rc_fastlane/features/egg_relay_classic/policy/EggRelayPolicy.luau
          fi
      - name: Build original WCS third-route Starfall bridge with exact source pin and rollback tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s rc_fastlane -p test_star_path.py -v
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_star_path.py --profile rich51 --dist "$DIST"
          fi
      - name: Add automatic fourth-lane Meteor source after real Starfall61
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s rc_fastlane -p test_meteor_fourth.py -v
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            BEFORE=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            python3 -B rc_fastlane/apply_meteor_fourth.py --profile rich51 --dist "$DIST" --enabled false
            AFTER=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            test "$BEFORE" = "$AFTER"
            echo P0D_PRIVATE62_METEOR_OFF_PRESERVES_ALL_61_BYTES_PASS
            python3 -B rc_fastlane/apply_meteor_fourth.py --profile rich51 --dist "$DIST" --enabled true
          fi
      - name: Add six collectible shards on the EXISTING meteor62 game, and preserve switch-OFF source
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s rc_fastlane -p test_star_shards.py -v
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            BEFORE=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            python3 -B rc_fastlane/apply_star_shards.py --profile rich51 --dist "$DIST" --help >/dev/null
            python3 -B rc_fastlane/apply_star_shards.py --profile rich47 --dist "$DIST"
            AFTER=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            test "$BEFORE" = "$AFTER"
            python3 -B rc_fastlane/apply_star_shards.py --profile rich51 --dist "$DIST"
            echo P0D_PRIVATE63_METEOR62_PLUS_SHARDS63_SOURCE_ADOPTED_PRIVATE_ONLY
          fi
      - name: Make classic egg relay reachable on mobile portrait (HUD only, independent rollback)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            BEFORE=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            python3 -B rc_fastlane/apply_relay_touch_layout.py --dist "$DIST" --enabled off
            AFTER=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            test "$BEFORE" = "$AFTER"
            python3 -B rc_fastlane/apply_relay_touch_layout.py --dist "$DIST" --enabled on
            python3 -B rc_fastlane/rc61_touch_geometry_audit.py --hud "$DIST/src/client/HUD.client.luau"
          fi
      - name: Add two mirrored worlds and four animated discoverable creatures after official63
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s rc_fastlane -p test_twin_biomes.py -v
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            BEFORE=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            python3 -B rc_fastlane/apply_twin_biomes.py --profile rich51 --dist "$DIST" --enabled false
            AFTER=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            test "$BEFORE" = "$AFTER"
            echo P0D_PRIVATE64_TWIN_BIOMES_OFF_PRESERVES_OFFICIAL63_ALL_BYTES_PASS
            python3 -B rc_fastlane/apply_twin_biomes.py --profile rich51 --dist "$DIST" --enabled true
          fi
      - name: Adopt original four-species Lv1-Lv3 training onto exact existing official64 TwinBiomes
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s rc_fastlane -p test_twin_training.py -v
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            BEFORE=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            python3 -B rc_fastlane/apply_twin_training.py --dist "$DIST" --enabled false
            AFTER=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            test "$BEFORE" = "$AFTER"
            echo P0D_TWIN_TRAINING_PREP65_OFF_REAL_OFFICIAL64_BYTE_EXACT_PASS
            python3 -B rc_fastlane/apply_twin_training.py --dist "$DIST" --enabled true
          fi
      - name: OWNER first-play HUD + solo-start clarity (no Game authority change)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            BEFORE=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            python3 -B rc_fastlane/apply_owner_firstplay_ux.py --dist "$DIST" --enabled false
            AFTER=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            test "$BEFORE" = "$AFTER"
            echo P0D_OWNER_UX_OFF_ALL65_AND_CONFIG_EXACT_PASS
            python3 -B rc_fastlane/apply_owner_firstplay_ux.py --dist "$DIST" --enabled true
            python3 - <<'PY'
          from pathlib import Path
          import json
          dist=Path("_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE")
          src=dist/"src"
          hud=(src/"client/HUD.client.luau").read_text("utf8")
          v4=(src/"client/V4TrialOverlay.client.luau").read_text("utf8")
          audit=(src/"client/P0DStudioTrialAudit.client.luau").read_text("utf8")
          game=(src/"server/Game.server.luau").read_text("utf8")
          assert "StudioSolo.canStart(RunService:IsStudio()" in game
          assert "1人練習 自動開始" in hud
          import re
          for exp in (
              r'^    instructions\.Visible=s\.phase=="ACTIVE" and not first90Cue\.Visible',
              r'^    progressBadge\.Visible=s\.phase=="ACTIVE" -- tiny XP only',
              r'^    dojoBadge\.Visible=valid and s\.hatchEnabled==true and s\.phase=="LOBBY"',
          ):
              assert re.search(exp,hud,re.M), ("HUD_ACTIVE_ASSIGNMENT_REQUIRED",exp)
          assert '🥚卵を運ぶ／🏰城をこわす' in hud
          assert 'if s.team=="RED" then "赤"' in hud
          assert 'RealH1ServerLevel",UDim2.new(.20,0,0,26)' in hud
          assert 'Instructions", UDim2.new(.58, 0, 0, 25)' in hud
          assert .015+.20 < .24, "ROLE_AND_OBJECTIVE_SAFE_HORIZ_SEPARATION"
          assert 'instructions.Visible=s.phase=="ACTIVE" and not first90Cue.Visible' in hud
          assert 'progressBadge.Visible=s.phase=="ACTIVE"' in hud
          assert 'dojoBadge.Visible=valid and s.hatchEnabled==true and s.phase=="LOBBY"' in hud
          assert 'local folded=true' in v4 and 'box.Visible=false' in v4
          assert 'screen.Enabled=false' in audit and 'log("START",' in audit
          lock=json.loads((dist/"SOURCE_LOCK.json").read_text("utf8"))
          assert lock["total_scripts"]==65 and len(lock["blobs"])==65
          import hashlib
          pins={p.relative_to(src).as_posix(): hashlib.sha1(b"blob "+str(len(p.read_bytes())).encode()+b"\0"+p.read_bytes()).hexdigest() for p in src.rglob("*.luau")}
          assert lock["blobs"]==pins
          feature=json.loads((dist/"RC_FEATURE_LOCK.json").read_text("utf8"))
          assert feature["total_sources"]==65 and feature["source_gitblobs"]==pins
          assert feature["feature_flags"]["OWNER_FIRSTPLAY_UX_V1"] is True
          print("P0D_OWNER_UX_INITIAL_TEXT_COLLAPSED_SOLO_GUIDE_ACTUAL_GAME_UNCHANGED_PASS")
          PY
          fi
      - name: Add exact canonical65 one familiar + 20pct PvE minion-only assist, all OFF rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s rc_fastlane -p test_twin_bond.py -v
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            BEFORE=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            python3 -B rc_fastlane/apply_twin_bond.py --dist "$DIST" --enabled false
            AFTER=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            test "$BEFORE" = "$AFTER"
            echo P0D_PRIVATE66_BOND_OFF_EXACT_REAL_OFFICIAL65_PASS
            python3 -B rc_fastlane/apply_twin_bond.py --dist "$DIST" --enabled true
          fi
      - name: Check actual built RC66 source lock, approved feature and ledger agree
        if: ${{ env.PROFILE == 'rich51' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE")
          lock=json.loads((root/"SOURCE_LOCK.json").read_text("utf8"))
          flags=json.loads(Path("rc_fastlane/FEATURE_SWITCHES.json").read_text("utf8"))["features"]
          catalog=json.loads(Path("rc_fastlane/FEATURE_CATALOG.json").read_text("utf8"))
          reg=json.loads(Path("rc_fastlane/FEATURE_REGISTRY.json").read_text("utf8"))
          assert lock["total_scripts"]==66
          assert lock["rc_twin_bond_overlay"]["id"]=="TWIN_BOND_PVE_COMPANION_V1"
          assert lock["rc_twin_bond_overlay"]["official_rc_adopted"] is True
          assert flags["TWIN_BOND_PVE_COMPANION_V1"]["official_rc_adopted"] is True
          assert reg["canonical_rc_source_count"]==66
          assert catalog["verified_rc_head"]==reg["canonical_rc_source_head"]=="2c74382bf24f9fdfd67f3bfcecb9a8a6d7ddd264"
          assert reg["canonical_rc_acceptance_run"]==43549547549
          assert len(catalog["rows"])==67
          assert sum(z["stage"]=="RC" for z in catalog["rows"])==31
          print("P0D_RC66_REAL_OUTPUT_LOCK_AND_CATALOG_REGISTRY_ADOPTION_RECEIPT_MATCH_PASS")
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_rc_luau
          fetch-depth: 1
          persist-credentials: false
      - name: Cache same pinned Luau compiler between RC builds
        uses: actions/cache@v4
        with:
          path: /tmp/p0d_new_luau
          key: p0d-rc-luau-ubuntu-f46d879e28302-v1
      - name: Compile every actual canonical RC Luau source using same pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_rc_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          if [ ! -x /tmp/p0d_new_luau/luau-compile ]; then
            cmake -S _p0d_rc_luau -B /tmp/p0d_new_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
            cmake --build /tmp/p0d_new_luau --target Luau.Compile.CLI --parallel 4
          else
            echo P0D_RC_PINNED_LUAU_CACHE_REUSED
          fi
          /tmp/p0d_new_luau/luau-compile rc_fastlane/features/realm_hunt/RealmHunt.server.luau > /tmp/p0d_new_server.luau.out
          /tmp/p0d_new_luau/luau-compile rc_fastlane/features/realm_hunt/RealmHuntHUD.client.luau > /tmp/p0d_new_client.luau.out
          echo P0D_RC_NEW_REALM_LUAU_COMPILE_2_OF_2_PASS
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            WANT=$(python3 -c "import json; f=json.load(open('rc_fastlane/FEATURE_SWITCHES.json'))['features']; print(53 + int(f['SIX_SKILL_DURABLE']['enabled']) + int(f['SAVED_PVE_MASTERY']['enabled']) + int(f['SAVED_BEAST_EVOLUTION']['enabled']) + int(f['SCOUT_SPECIES_V1']['enabled']) + int(f['WCS_F01_C01']['enabled']) + int(f['SEVEN_JOBS_PVE_V1']['enabled']) + int(f['EGG_RELAY_CLASSIC_V1']['enabled']) + int(f['STARRY_PATH_V1']['enabled']) + int(f['METEOR_FOURTH_V1']['enabled']) + int(f['STAR_SHARDS_V1']['enabled']) + int(f['TWIN_BIOMES_4NPC_V1']['enabled']) + int(f['TWIN_CREATURE_TRAINING_V1']['enabled']) + int(f['TWIN_BOND_PVE_COMPANION_V1']['enabled']))")

          elif [ "$PROFILE" = rich47 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-SKYV5-DOJO-RESULT-20261113-01/dist/P0D_H1_SKYV5_DOJO_RESULT7_STUDIO_PRIVATE
            WANT=47
          else
            DIST=releases/P0D_S1_KIDS_RC01
            WANT=21
          fi
          n=0
          while IFS= read -r -d '' file; do
            /tmp/p0d_new_luau/luau-compile "$file" > /tmp/p0d_rc_native_source.out 2>&1 || {
              cat /tmp/p0d_rc_native_source.out
              echo "P0D_CANONICAL_RC_LUAU_COMPILE_FAILED $file"
              exit 1
            }
            n=$((n+1))
