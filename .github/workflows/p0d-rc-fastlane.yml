name: P0D canonical RC fast-lane Studio build
on:
  push:
    branches:
      - rc/p0d-s1-kids-rc01
    paths:
      - 'rc_fastlane/**'
      - '.github/workflows/p0d-rc-fastlane.yml'
  pull_request:
    branches:
      - rc/p0d-s1-kids-rc01
    paths:
      - 'rc_fastlane/**'
      - '.github/workflows/p0d-rc-fastlane.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: RC source profile (fallback selectable; official active remains ACTIVE.json)
        type: choice
        required: true
        default: rich51
        options:
          - rich51
          - rich47
          - legacy21
permissions:
  contents: read
jobs:
  rc-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROFILE: ${{ github.event.inputs.profile || 'rich51' }}
      EXPECTED_SOURCE: ${{ (github.event.inputs.profile == 'rich47' && 'f74686cbfc601436962df8aeb8da7a1b3ff92152') || '79123d35cd7afdd5f4f9941675bc2d2cf382ac4e' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: ${{ env.EXPECTED_SOURCE }}
          path: _p0d_pinned_source
          persist-credentials: false
      - name: Validate selected official RC profile and freeze source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          x=json.load(open('rc_fastlane/ACTIVE.json',encoding='utf8'))
          p=os.environ['PROFILE']
          assert p in x['source_profiles'],p
          assert p == 'rich51' or os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch',"FALLBACK_ONLY_MANUAL"
          source=x['source_profiles'][p]['source_commit']
          if p=='legacy21':source=x['source_profiles']['rich51']['source_commit']
          actual=subprocess.check_output(['git','-C','_p0d_pinned_source','rev-parse','HEAD'],text=True).strip()
          assert actual==source==os.environ['EXPECTED_SOURCE'],(actual,source)
          assert x['active_profile']=='rich51'
          assert x['previous_official_rc_commit']=='1263a03701211a652b99b91d2339575dc8104eff'
          print('PINNED_RC_PROFILE_SOURCE_PASS',p,source)
          PY
      - name: Assemble original authored real game once (no reauthoring)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            python3 -B _p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/tools/assemble.py --assemble
          elif [ "$PROFILE" = rich47 ]; then
            python3 -B _p0d_pinned_source/handoffs/P0D-RC-H1-SKYV5-DOJO-RESULT-20261113-01/tools/assemble.py --assemble
          else
            test -f releases/P0D_S1_KIDS_RC01/default.project.json
          fi
      - name: Apply exact source-locked per-feature Studio V4 idle/friend overlay (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            python3 -B rc_fastlane/apply_overlays.py \
              --dist "_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE" \
              --profile "$PROFILE"
          fi
      - name: Add P0D optional gameplay directly to current RC, never modifying author 51
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s rc_fastlane -p test_realm_hunt.py -v
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/integrate.py --profile rich51 --dist "$DIST"
          fi
      - name: Integrate author-pinned six-skill DEV persistence on the same Game Store
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_sixskill_durable.py --profile rich51 --dist "$DIST"
          fi
      - name: Apply source-exact saved WEAPON level -> neutral PvE tier in existing Game
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_saved_pve.py --profile rich51 --dist "$DIST"
          fi
      - name: Integrate saved BEAST mastery into original real evolved scout
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_saved_beast.py --profile rich51 --dist "$DIST"
          fi
      - name: Add forest swift and star burst species within ORIGINAL evolved scout
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_scout_species.py --profile rich51 --dist "$DIST"
          fi
      - name: Add source-locked Crystal Canyon/Moguron stage with independent rollback (Studio only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s rc_fastlane -p test_wcs_f01_c01.py -v
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            python3 -B rc_fastlane/apply_wcs_f01_c01.py --profile rich51 --dist "$DIST"
          fi
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 98edf843fb8a8f6123c13a67745b216712bfe63d
          path: _p0d_sevenjobs_author
          fetch-depth: 1
          persist-credentials: false
      - name: Combine exact author sevenjobs PvE after WCS using only one Game and HUD (PRIVATE CANDIDATE)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            test "$(git -C _p0d_sevenjobs_author rev-parse HEAD)" = 98edf843fb8a8f6123c13a67745b216712bfe63d
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            AUTHOR=_p0d_sevenjobs_author/handoffs/P0D-RC-SEVEN-JOBS-PVE-V1-20261114-01
            python3 -B handoffs/P0D-WCS-SEVENJOBS-COMBINED59-20261114-01/apply_combined.py --dist "$DIST" --author "$AUTHOR" --off-test
            python3 -B handoffs/P0D-WCS-SEVENJOBS-COMBINED59-20261114-01/apply_combined.py --dist "$DIST" --author "$AUTHOR"
          fi
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: f1c0866423c2c1d36a5cd8eafe8cee7558b1a1dd
          path: _p0d_relay_author
          persist-credentials: false
      - name: Compose classic egg relay against latest WCS+Jobs Game/HUD (PRIVATE CANDIDATE)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            test "$(git -C _p0d_relay_author rev-parse HEAD)" = f1c0866423c2c1d36a5cd8eafe8cee7558b1a1dd
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            AUTHOR=_p0d_relay_author/handoffs/P0D-EGG-RELAY-CLASSIC-LIVE-20261114-01
            python3 -B handoffs/P0D-WCS-JOBS-RELAY-PRIVATE60-20261114-01/apply_relay_after_jobs.py --dist "$DIST" --author "$AUTHOR" --off-test
            python3 -B handoffs/P0D-WCS-JOBS-RELAY-PRIVATE60-20261114-01/apply_relay_after_jobs.py --dist "$DIST" --author "$AUTHOR"
          fi
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_rc_luau
          fetch-depth: 1
          persist-credentials: false
      - name: Cache same pinned Luau compiler between RC builds
        uses: actions/cache@v4
        with:
          path: /tmp/p0d_new_luau
          key: p0d-rc-luau-ubuntu-f46d879e28302-v1
      - name: Compile every actual canonical RC Luau source using same pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_rc_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          if [ ! -x /tmp/p0d_new_luau/luau-compile ]; then
            cmake -S _p0d_rc_luau -B /tmp/p0d_new_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
            cmake --build /tmp/p0d_new_luau --target Luau.Compile.CLI --parallel 4
          else
            echo P0D_RC_PINNED_LUAU_CACHE_REUSED
          fi
          /tmp/p0d_new_luau/luau-compile rc_fastlane/features/realm_hunt/RealmHunt.server.luau > /tmp/p0d_new_server.luau.out
          /tmp/p0d_new_luau/luau-compile rc_fastlane/features/realm_hunt/RealmHuntHUD.client.luau > /tmp/p0d_new_client.luau.out
          echo P0D_RC_NEW_REALM_LUAU_COMPILE_2_OF_2_PASS
          if [ "$PROFILE" = rich51 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            WANT=$(python3 -c "import json; f=json.load(open('rc_fastlane/FEATURE_SWITCHES.json'))['features']; print(53 + int(f['SIX_SKILL_DURABLE']['enabled']) + int(f['SAVED_PVE_MASTERY']['enabled']) + int(f['SAVED_BEAST_EVOLUTION']['enabled']) + int(f['SCOUT_SPECIES_V1']['enabled']) + int(f['WCS_F01_C01']['enabled']) + int(f['SEVEN_JOBS_PVE_V1']['enabled']) + int(f['EGG_RELAY_CLASSIC_V1']['enabled']))")

          elif [ "$PROFILE" = rich47 ]; then
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-SKYV5-DOJO-RESULT-20261113-01/dist/P0D_H1_SKYV5_DOJO_RESULT7_STUDIO_PRIVATE
            WANT=47
          else
            DIST=releases/P0D_S1_KIDS_RC01
            WANT=21
          fi
          n=0
          while IFS= read -r -d '' file; do
            /tmp/p0d_new_luau/luau-compile "$file" > /tmp/p0d_rc_native_source.out 2>&1 || {
              cat /tmp/p0d_rc_native_source.out
              echo "P0D_CANONICAL_RC_LUAU_COMPILE_FAILED $file"
              exit 1
            }
            n=$((n+1))
          done < <(find "$DIST/src" -type f -name '*.luau' -print0)
          test "$n" -eq "$WANT"
          echo "P0D_CANONICAL_RC_FULL_SOURCE_LUAU_COMPILE_PASS $n/$WANT"
      - name: Run native policy 41 and ACTUAL triple-Game relay transaction 31 (engine-free)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = rich51 ]; then
            test "$(git -C _p0d_relay_author rev-parse HEAD)" = f1c0866423c2c1d36a5cd8eafe8cee7558b1a1dd
            DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
            cmake --build /tmp/p0d_new_luau --target Luau.Repl.CLI --parallel 4
            test -x /tmp/p0d_new_luau/luau
            POLICY=_p0d_relay_author/handoffs/P0D-EGG-RELAY-PASS-POLICY-20261113-01
            CLASSIC=_p0d_relay_author/handoffs/P0D-EGG-RELAY-CLASSIC-LIVE-20261114-01
            python3 -B "$POLICY/tools/generate_native_runner.py" --out /tmp/p0d_relay_policy41.luau
            /tmp/p0d_new_luau/luau-compile /tmp/p0d_relay_policy41.luau >/dev/null
            /tmp/p0d_new_luau/luau /tmp/p0d_relay_policy41.luau | tee /tmp/p0d_relay_policy41.log
            grep -Fx 'P0D_EGG_RELAY_NATIVE_POLICY_41_CASES_PASS' /tmp/p0d_relay_policy41.log
            python3 -B "$CLASSIC/tools/generate_native_game_harness.py" --game "$DIST/src/server/Game.server.luau" --policy "$POLICY/src/EggRelayPolicy.luau" --out /tmp/p0d_relay_game30_original.luau
            python3 -B handoffs/P0D-WCS-JOBS-RELAY-PRIVATE60-20261114-01/prepare_native_relay_harness.py --input /tmp/p0d_relay_game30_original.luau --output /tmp/p0d_relay_game31_explicit.luau
            /tmp/p0d_new_luau/luau-compile /tmp/p0d_relay_game31_explicit.luau >/dev/null
            /tmp/p0d_new_luau/luau /tmp/p0d_relay_game31_explicit.luau | tee /tmp/p0d_relay_game31.log
            grep -Fx 'P0D_WCS_JOBS_RELAY_REAL_GAME_NATIVE_31_CASES_PASS' /tmp/p0d_relay_game31.log
          fi
      - name: Install checksum-pinned official Rojo v7.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_rc_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_rc_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,stat
          with zipfile.ZipFile('/tmp/p0d_rc_rojo.zip') as z:
              items=[k for k in z.namelist() if k.rsplit('/',1)[-1]=='rojo']
              assert len(items)==1
              x=Path('/tmp/p0d_rc_rojo');x.write_bytes(z.read(items[0]))
              x.chmod(x.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_rc_rojo --version | grep -F '7.7.1'
      - name: Produce playable RC Place and verify binary exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_rc_out
          if [ "$PROFILE" = rich51 ]; then
            export DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
          elif [ "$PROFILE" = rich47 ]; then
            export DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-SKYV5-DOJO-RESULT-20261113-01/dist/P0D_H1_SKYV5_DOJO_RESULT7_STUDIO_PRIVATE
          else
            export DIST=releases/P0D_S1_KIDS_RC01
          fi
          /tmp/p0d_rc_rojo build "$DIST/default.project.json" -o /tmp/p0d_rc_out/P0D_CANONICAL_RC_${PROFILE}.rbxlx
          if [ "$PROFILE" = rich51 ] && [ -f "$DIST/RC_FEATURE_LOCK.json" ]; then
            cp "$DIST/RC_FEATURE_LOCK.json" /tmp/p0d_rc_out/RC_FEATURE_LOCK.json
          fi
          python3 - <<'PY'
          import os,json,hashlib,collections,pathlib,xml.etree.ElementTree as ET
          p=os.environ['PROFILE'];base=pathlib.Path(os.environ['DIST'])
          target=pathlib.Path('/tmp/p0d_rc_out')/('P0D_CANONICAL_RC_'+p+'.rbxlx')
          actual=collections.Counter(f.read_text('utf8') for f in (base/'src').rglob('*.luau'))
          flags=json.load(open('rc_fastlane/FEATURE_SWITCHES.json',encoding='utf8'))
          realm_enabled=flags['features']['REALM_HUNT_V1']['enabled'] and p=='rich51'
          durable_enabled=(p=='rich51' and flags['features']['SIX_SKILL_DURABLE']['enabled'])
          saved_pve_enabled=(p=='rich51' and flags['features']['SAVED_PVE_MASTERY']['enabled'])
          saved_beast_enabled=(p=='rich51' and flags['features']['SAVED_BEAST_EVOLUTION']['enabled'])
          species_enabled=(p=='rich51' and flags['features']['SCOUT_SPECIES_V1']['enabled'])
          wcs_enabled=(p=='rich51' and flags['features']['WCS_F01_C01']['enabled'])
          jobs_enabled=(p=='rich51' and flags['features']['SEVEN_JOBS_PVE_V1']['enabled'])
          relay_enabled=(p=='rich51' and flags['features']['EGG_RELAY_CLASSIC_V1']['enabled'])
          expected={'rich51':51+int(realm_enabled)*2+int(durable_enabled)+int(saved_pve_enabled)+int(saved_beast_enabled)+int(species_enabled)+int(wcs_enabled)+int(jobs_enabled)+int(relay_enabled),'rich47':47,'legacy21':21}[p]
          assert sum(actual.values())==expected, ('RC_SCRIPT_COUNT',sum(actual.values()),expected)
          included=collections.Counter();titles=collections.Counter()
          for e in ET.fromstring(target.read_bytes()).iter('Item'):
              if e.get('class') not in ('Script','LocalScript','ModuleScript'):continue
              c=e.find("./Properties/string[@name='Source']")
              if c is None:continue
              included[c.text or '']+=1
              n=e.find("./Properties/string[@name='Name']")
              if n is not None:titles[(e.get('class'),n.text)]+=1
          assert included==actual,('SOURCE_MISMATCH',len(included),len(actual))
          if p=='rich51':
              f=json.load(open('rc_fastlane/ACTIVE.json',encoding='utf8'))['feature_switches']['V4_IDLE_FRIEND_SAFE_FIX']
              assert f['rollback']=='DISABLE_OVERLAY_RETAIN_RICH51'
              live=f['enabled']
              srcs=list(included.elements())
              has_server=any('player:IsFriendsWithAsync(other.UserId)' in x and 'NoCombatBuff' in x for x in srcs)
              has_client=any('player.Idled:Connect(' in x and 'UserInputService.InputBegan:Connect(' in x for x in srcs)
              assert has_server==live and has_client==live,('OVERLAY_SWITCH_MISMATCH',live,has_server,has_client)
              lock=json.load(open(base/'SOURCE_LOCK.json',encoding='utf8'))
              assert (lock.get('rc_overlay',{}).get('id')=='V4_IDLE_FRIEND_SAFE_FIX')==live
              assert lock['blobs']=={f.relative_to(base/'src').as_posix():
                            hashlib.sha1(b'blob '+str(len(f.read_bytes())).encode()+bytes([0])+f.read_bytes()).hexdigest()
                            for f in (base/'src').rglob('*.luau')},'RC_PROFILE_SOURCE_LOCK'
              if live:
                  assert lock['rc_overlay']['untouched_original_game_scripts']==49
                  assert sorted(lock['rc_overlay']['only_changed_scripts'])==[
                    'client/V4TrialOverlay.client.luau','server/V4TrainingBridge.server.luau']
                  print('P0D_RC_FASTLANE_V4_2FILE_SWITCH_49_ORIGINAL_BYTES_PASS')
              else:
                  print('P0D_RC_FASTLANE_V4_SWITCH_OFF_ORIGINAL51_PASS')
          assert titles[('Script','Game')]==1,('DUPLICATE_GAME',titles)
          if species_enabled:
              assert saved_beast_enabled and durable_enabled
              assert titles[('ModuleScript','ScoutSpeciesPolicy')]==1
              assert sum('ScoutSpecies.attack(' in src for src in included)==1
              assert sum('ScoutSpecies.guard(' in src for src in included)==1
              assert sum('P0D_ActualScoutSpecies' in src for src in included)==1
              assert sum('local assaultCount=0' in src for src in included)==1
          else:
              assert titles[('ModuleScript','ScoutSpeciesPolicy')]==0
          if saved_beast_enabled:
              assert durable_enabled and saved_pve_enabled
              assert titles[('ModuleScript','SavedBeastEvolutionPolicy')]==1
              assert sum('SavedBeastEvolution.choose(' in src for src in included)==1
              assert sum('SavedBeastEvolution.saved(' in src for src in included)==1
              assert sum('SavedBeastEvolutionTier' in src for src in included)==1
          else:
              assert titles[('ModuleScript','SavedBeastEvolutionPolicy')]==0
          if saved_pve_enabled:
              assert durable_enabled, 'SAVED_MASTERY_REQUIRES_DURABLE'
              assert titles[('ModuleScript','SavedPveMasteryPolicy')]==1
              assert sum('SavedPvePolicy.mergeWithEarned(' in src for src in included)==1
              assert sum('savedPveMinionMultiplier(player)' in src for src in included)==1
              assert sum('PersistentHatch.settleSixSkill(' in src for src in included)==1
          else:
              assert titles[('ModuleScript','SavedPveMasteryPolicy')]==0
          if durable_enabled:
              assert titles[('ModuleScript','SixSkillAtomicProfile')]==1
              assert any('PersistentHatch.settleSixSkill(' in s for s in included)
              assert any('function Store.settleSixSkill(' in s for s in included)
              assert any('P0D_V4_SavedRemaining' in s for s in included)
          else:
              assert titles[('ModuleScript','SixSkillAtomicProfile')]==0
          if realm_enabled:
              assert titles[('Script','RealmHunt')]==1
              assert titles[('LocalScript','RealmHuntHUD')]==1
          else:
              assert titles[('Script','RealmHunt')]==0
              assert titles[('LocalScript','RealmHuntHUD')]==0
          if wcs_enabled:
              assert titles[('Script','WCS_CrystalCanyon')]==1
              assert sum('GetAttribute("P0D_RC_ENABLE_WCS_F01_C01")~=true' in src for src in included)==1
          if p=='rich51':
              boot_attr=json.loads((base/'default.project.json').read_text('utf8'))['tree'].get('ServerStorage',{}).get('$attributes',{}).get('P0D_RC_ENABLE_WCS_F01_C01')
              assert boot_attr is (True if wcs_enabled else None),('WCS_BOOT_ATTR_MISMATCH',boot_attr,wcs_enabled)
          if wcs_enabled:
              assert titles[('Script','WCS_CrystalCanyon')]==1
              assert sum('playerIsInGateClosureZone()' in src for src in included)==1
          else:
              assert titles[('Script','WCS_CrystalCanyon')]==0
          if jobs_enabled:
              assert titles[('ModuleScript','SevenJobsRules')]==1
              assert sum('GetAttribute("P0D_RC_ENABLE_SEVEN_JOBS_PVE")' in src for src in included)==1
          else:
              assert titles[('ModuleScript','SevenJobsRules')]==0
          boot_values=[]
          for inst in ET.fromstring(target.read_bytes()).iter('Item'):
              if inst.get('class')!='BoolValue': continue
              name=inst.find("./Properties/string[@name='Name']")
              if name is None or name.text!='P0D_RC_ENABLE_EGG_RELAY_CLASSIC': continue
              prop=inst.find("./Properties/bool[@name='Value']")
              boot_values.append(None if prop is None else prop.text)
          assert boot_values==(['true'] if relay_enabled else []),('RELAY_BOOLVALUE_MISSING_OR_DUPLICATE',boot_values)
          proj=json.loads((base/'default.project.json').read_text('utf8'))
          child=proj['tree'].get('ServerStorage',{}).get('P0D_RC_ENABLE_EGG_RELAY_CLASSIC')
          assert child==({"$className":"BoolValue","$properties":{"Value":True}} if relay_enabled else None),('RELAY_PROJECT_BOOT_MISMATCH',child)
          print('P0D_RELAY_REAL_ROJO_BOOT_BOOLVALUE_SOURCE_CONTRACT_PASS',relay_enabled)
          if relay_enabled:
              assert jobs_enabled and wcs_enabled
              assert titles[('ModuleScript','EggRelayPolicy')]==1
              assert sum('local function applyClassicEggRelay' in src for src in included)==1
              assert sum('return flag ~= nil and (flag:IsA("BoolValue") and flag.Value == true)' in src for src in included)==1
              assert sum('relayButton.MouseButton1Click:Connect(fireClassicEggRelay)' in src for src in included)==1
              assert sum('match.eggOwners[egg]=target' in src for src in included)==1
          else:
              assert titles[('ModuleScript','EggRelayPolicy')]==0
          if p=='rich51':
              assert titles[('Script','V4TrainingBridge')]==1
              assert titles[('LocalScript','V4TrialOverlay')]==1
          if p=='rich47':
              assert titles[('Script','V4TrainingBridge')]==0
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          source=os.environ['EXPECTED_SOURCE']
          overlay_ids=(
            ['V4_IDLE_FRIEND_SAFE_FIX'] if p=='rich51' and json.load(
                open('rc_fastlane/ACTIVE.json',encoding='utf8')
              )['feature_switches']['V4_IDLE_FRIEND_SAFE_FIX']['enabled'] else [])
          receipt={'release_id':'P0D-S1-KIDS-RC01','profile':p,'source_commit':source,
            'source_overlays':overlay_ids,'composite_rc_source_commit':os.environ['GITHUB_SHA'],
            'rc_branch_commit':os.environ['GITHUB_SHA'],'place_sha256':digest,
            'source_count':sum(actual.values()),'exact_rojo_binary':True,
            'sixskill_durable_dev_code_included':bool(durable_enabled),
            'saved_pve_mastery_included':bool(saved_pve_enabled),
            'saved_beast_evolution_included':bool(saved_beast_enabled),
            'existing_three_scout_species_included':bool(species_enabled),
            'wcs_crystal_canyon_moguron_included':bool(wcs_enabled),
            'wcs_engine_physics':'NOT_TESTED',
            'sevenjobs_private_candidate_included':bool(jobs_enabled),
            'sevenjobs_engine_qa':'NOT_TESTED',
            'sevenjobs_full_pvp_roles':'NOT_IMPLEMENTED',
            'classic_egg_relay_candidate_included':bool(relay_enabled),
            'relay_five_egg_mode':'NOT_SUPPORTED',
            'relay_studio_2client':'NOT_TESTED',
            'species_engine_qa':'NOT_TESTED',
            'saved_beast_engine_qa':'NOT_TESTED',
            'saved_pve_minion_only':True if saved_pve_enabled else None,
            'saved_pve_engine_qa':'NOT_TESTED',
            'sixskill_real_Studio_DEV_UpdateAsync':'NOT_TESTED',
            'single_game':True,'owner_studio_2client':'NOT_TESTED',
            'android':'NOT_TESTED','owner_fun':'NOT_TESTED',
            'production_publish':False,'sixskill_persistent':False,
            's1_score_prior_only':75,
            'feature_flags':{'REALM_HUNT_V1':realm_enabled,'WCS_F01_C01':wcs_enabled,'SEVEN_JOBS_PVE_V1':jobs_enabled,'EGG_RELAY_CLASSIC_V1':relay_enabled},
            'base_author_51_preserved':True if realm_enabled else None,
            'new_realms_studio_2client':'NOT_TESTED'}
          (pathlib.Path('/tmp/p0d_rc_out')/'RC_BUILD_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('OFFICIAL_RC_FASTLANE_BINARY_SOURCE_EXACT_PASS',p,digest)
          PY
      - name: Generate OWNER feature progress in the SAME RC build (no second QA run)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B rc_fastlane/progress.py --out /tmp/p0d_rc_out/FEATURE_PROGRESS.md --json /tmp/p0d_rc_out/FEATURE_PROGRESS.json
          grep -F P0D /tmp/p0d_rc_out/FEATURE_PROGRESS.md | head -2
      - uses: actions/upload-artifact@v4
        with:
          name: P0D-CANONICAL-RC-STUDIO-${{ env.PROFILE }}
          path: /tmp/p0d_rc_out/*
          retention-days: 7
          if-no-files-found: error
