          assert len(scripts)==67, ('PRIVATE67_SOURCE_COUNT',len(scripts))
          actual=collections.Counter(p.read_text('utf8') for p in scripts)
          embedded=collections.Counter()
          named=collections.Counter()
          for item in ET.fromstring(place.read_bytes()).iter('Item'):
              if item.get('class') not in ('Script','LocalScript','ModuleScript'):continue
              src=item.find("./Properties/string[@name='Source']")
              if src is None:continue
              embedded[src.text or '']+=1
              node=item.find("./Properties/string[@name='Name']")
              if node is not None:named[(item.get('class'),node.text)]+=1
          assert actual==embedded, ('PRIVATE67_SOURCE_EXACT_MISMATCH',len(actual),len(embedded))
          assert named[('Script','Game')]==1
          assert named[('LocalScript','ArtCombatSlash')]==1
          assert named[('ModuleScript','MusouHorde')]==1
          assert (dist/'src/server/MusouHorde.luau').read_bytes().count(b'P0D_ART_COMBAT_SIGNAL_V1')==1
          sp=json.loads((dist/'SOURCE_LOCK.json').read_text('utf8'))
          fp=json.loads((dist/'RC_FEATURE_LOCK.json').read_text('utf8'))
          assert sp['total_scripts']==fp['total_sources']==67
          assert sp['blobs']==fp['source_gitblobs']
          assert sp['art_combat']['unchanged_original_sources']==65
          assert sp['art_combat']['owner_fun']=='ART_NO_GO'
          assert fp['feature_flags']['ART_COMBAT_SLASH_READONLY_V1'] is True
          candidate=(dist/'src/client/ArtCombatSlash.client.luau').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(candidate)).encode()+bytes([0])+candidate).hexdigest()=='17c6a9a3404e913b279b348e3b981ac61bfd1b24'
          horde=(dist/'src/server/MusouHorde.luau').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(horde)).encode()+bytes([0])+horde).hexdigest()=='a2d07936bd9fe5bdf3630498c39d61d5a8560d99'
          assert b'if RunService:IsStudio() then' in horde and b'P0D_ART_HIT_BUS_V1' in horde
          old=pathlib.Path('/tmp/p0d_rc_out/P0D_CANONICAL_RC_rich51.rbxlx')
          digest=hashlib.sha256(place.read_bytes()).hexdigest()
          receipt={
              'result':'P0D_ART_COMBAT_PRIVATE67_NATIVE_ROJO_SOURCE_EXACT_PASS',
              'private_candidate_sha256':digest,
              'private_candidate_rbxlx_bytes':place.stat().st_size,
              'source_count':len(scripts),
              'source_gitblob':'17c6a9a3404e913b279b348e3b981ac61bfd1b24',
              'horde_signal_blob':'a2d07936bd9fe5bdf3630498c39d61d5a8560d99',
              'original_rc66_unchanged_scripts':65,
              'single_original_horde_cosmetic_cue_patch_only':True,
              'baseline_rc66_place_bytes':old.stat().st_size,
              'baseline_rc66_place_sha256':hashlib.sha256(old.read_bytes()).hexdigest(),
              'source_stage':'PRIVATE_PREP_NOT_OFFICIAL_RC',
              'studio':'NOT_TESTED','android':'NOT_TESTED','owner_fun':'ART_NO_GO',
          }
          (output/'ART_COMBAT_PRIVATE67_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          (output/'SOURCE_LOCK.json').write_text(json.dumps(sp,indent=2)+'\n')
          (output/'RC_FEATURE_LOCK.json').write_text(json.dumps(fp,indent=2)+'\n')
          print(receipt)
          PY
          python3 -B rc_fastlane/apply_fb015_combat.py --dist "$DIST" --enabled false
          RESTORED=$(find "$DIST" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          test "$BEFORE" = "$RESTORED"
          echo ART_COMBAT_PRIVATE67_ROLLBACK_ORIGINAL66_ALL_DIST_BYTES_PASS
      - uses: actions/upload-artifact@v4
        if: ${{ env.PROFILE == 'rich51' }}
        with:
          name: P0D-FB015-ART-COMBAT-PRIVATE67
          path: /tmp/p0d_art_combat_private67/*
          retention-days: 7
          if-no-files-found: error
