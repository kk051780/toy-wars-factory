name: P0D FB015 motion69 latest epoch history native source QA
on:
  push:
    branches:
      - feature/p0d-fb015-motion69-epoch-v2-20261114
    paths:
      - 'rc_fastlane/features/art_motion/**'
      - 'rc_fastlane/compose_fb015_art_motion.py'
      - 'rc_fastlane/test_art_motion_*.py'
      - '.github/workflows/p0d-fb015-motion69-epoch-source.yml'
  pull_request:
    branches:
      - feature/p0d-prep-fb015-minion-combat-composite-20261114
      - feature/p0d-fb015-art68-frozen-d3ce-20261114
    paths:
      - 'rc_fastlane/features/art_motion/**'
      - 'rc_fastlane/compose_fb015_art_motion.py'
      - 'rc_fastlane/test_art_motion_*.py'
      - '.github/workflows/p0d-fb015-motion69-epoch-source.yml'
permissions:
  contents: read
jobs:
  motion-source-only-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify author exact blob and pinned parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path("rc_fastlane/features/art_motion/NeutralMotion.client.luau").read_bytes()
          got=hashlib.sha1(b"blob "+str(len(a)).encode()+bytes([0])+a).hexdigest()
          assert got=="9637b45e09f75759c3901528e4fa3a47cfe39f95",got
          print("P0D_MOTION_AUTHOR_GITBLOB_PIN_PASS",got)
          PY
      - name: All 3 motion source policy tests
        run: python3 -B -m unittest discover -s rc_fastlane -p 'test_art_motion_source.py' -v
      - name: All 17 66-to-69 fixture composition and protected OFF tests
        run: python3 -B -m unittest discover -s rc_fastlane -p 'test_art_motion_composite.py' -v
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_motion_luau
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: /tmp/p0d_motion_repin_ind_luau
          key: p0d-motion-repin-ind-luau-ubuntu-f46d879e28302-v1
      - name: Pinned native Luau compile authored client script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_motion_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          if [ ! -x /tmp/p0d_motion_repin_ind_luau/luau-compile ]; then
            cmake -S _p0d_motion_luau -B /tmp/p0d_motion_repin_ind_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
            cmake --build /tmp/p0d_motion_repin_ind_luau --target Luau.Compile.CLI --parallel 4
          fi
          /tmp/p0d_motion_repin_ind_luau/luau-compile rc_fastlane/features/art_motion/NeutralMotion.client.luau >/dev/null
          echo P0D_FB015_MOTION_NATIVE_LUAU_COMPILE_PASS_SOURCE_ONLY_STUDIO_PENDING
      - name: Execute the actual authored confirmed-hit/replay policy in pinned native Luau
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /tmp/p0d_motion_repin_ind_luau/luau ]; then
            cmake --build /tmp/p0d_motion_repin_ind_luau --target Luau.Repl.CLI --parallel 4
          fi
          python3 -B rc_fastlane/features/art_motion/generate_native_motion_policy.py --out /tmp/P0D_FB015_NATIVE_MOTION_EXACT_POLICY.luau
          /tmp/p0d_motion_repin_ind_luau/luau-compile /tmp/P0D_FB015_NATIVE_MOTION_EXACT_POLICY.luau >/dev/null
          /tmp/p0d_motion_repin_ind_luau/luau /tmp/P0D_FB015_NATIVE_MOTION_EXACT_POLICY.luau | tee /tmp/P0D_FB015_NATIVE_MOTION_POLICY.log
          grep -Fx P0D_FB015_ACTUAL_MOTION_EPOCH_HISTORY_NATIVE_POLICY_PASS /tmp/P0D_FB015_NATIVE_MOTION_POLICY.log
          python3 -B rc_fastlane/features/art_motion/generate_native_body41_policy.py --out /tmp/P0D_FB015_NATIVE_FULL41_MOTION.luau
          /tmp/p0d_motion_repin_ind_luau/luau-compile /tmp/P0D_FB015_NATIVE_FULL41_MOTION.luau >/dev/null
          /tmp/p0d_motion_repin_ind_luau/luau /tmp/P0D_FB015_NATIVE_FULL41_MOTION.luau | tee /tmp/P0D_FB015_NATIVE_FULL41_MOTION.log
          grep -F P0D_FB015_41_PART_REAL_NATIVE_MOTION_PASS /tmp/P0D_FB015_NATIVE_FULL41_MOTION.log
