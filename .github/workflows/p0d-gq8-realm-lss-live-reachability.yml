name: P0D GQ8 Realm/LSS live reachability (independent)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_realm_lss_runtime_20261118/**'
      - '.github/workflows/p0d-gq8-realm-lss-live-reachability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-live-path-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual audit negative mutations
        run: python3 quality_gameplay/gq8_realm_lss_runtime_20261118/audit_runtime_reachability.py --self-test
      - name: Fetch exact immutable Realm/LSS author sources and produce truthful live gate
        run: |
          python3 quality_gameplay/gq8_realm_lss_runtime_20261118/audit_runtime_reachability.py \
            --online --out quality_gameplay/gq8_realm_lss_runtime_20261118/REPORT.json
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-REALM-LSS-LIVE-REACHABILITY
          path: quality_gameplay/gq8_realm_lss_runtime_20261118/REPORT.json
          if-no-files-found: error
