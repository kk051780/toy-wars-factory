name: P0D GQ8 Realm/LSS live reachability (independent)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq8_realm_lss_runtime_20261118/**'
      - '.github/workflows/p0d-gq8-realm-lss-live-reachability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-live-path-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual audit negative mutations
        run: python3 quality_gameplay/gq8_realm_lss_runtime_20261118/audit_runtime_reachability.py --self-test
      - name: Fetch exact immutable Realm/LSS author sources and produce truthful live gate
        run: |
          python3 quality_gameplay/gq8_realm_lss_runtime_20261118/audit_runtime_reachability.py \
            --online --out quality_gameplay/gq8_realm_lss_runtime_20261118/REPORT.json
      - name: Checkout immutable original Realm Core34 composer
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: c51de1ed4feb7a7500ada95d21282402053ef988
          path: _realm764
          persist-credentials: false
      - name: Checkout formal Core36 LSS input at immutable RC SHA
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: f77b4d4393d9e9b19b65566413432a7a9f13962b
          path: _core36_input
          persist-credentials: false
      - name: Execute REAL Core34 composer and inspect emitted LSS and OFF31
        run: |
          python3 quality_gameplay/gq8_realm_lss_runtime_20261118/verify_composed_core.py \
            --composer _realm764/handoffs/EGGRUMBLE-REALM-CORE-20261118/compose_core34.py \
            --lss _core36_input/handoffs/EGGRUMBLE-LAND-SEA-SKY-20261117/EGGRUMBLE_LandSeaSkyTraversal.server.luau \
            --out quality_gameplay/gq8_realm_lss_runtime_20261118/COMPOSED_REPORT.json
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-REALM-LSS-LIVE-REACHABILITY
          path: |
            quality_gameplay/gq8_realm_lss_runtime_20261118/REPORT.json
            quality_gameplay/gq8_realm_lss_runtime_20261118/COMPOSED_REPORT.json
          if-no-files-found: error
