name: P0D FB005 AI egg-win and enemy melee original Game native82 Rojo
on:
  push:
    branches: [feature/p0d-product-quality-gate-20261115]
    paths:
      - product_quality/private_ai_egg_hit_result_cumulative.py
      - .github/workflows/p0d-quality-private-ai-egg-result-native.yml
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - product_quality/private_ai_egg_hit_result_cumulative.py
      - .github/workflows/p0d-quality-private-ai-egg-result-native.yml
permissions:
  contents: read
  actions: read
jobs:
  cumulative-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned AI and safe-lobby parent (not official RC)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_475_parent
          gh run download 43694011136 -R kk051780/toy-wars-factory \
            -n P0D-QUALITY-FB005-PRIVATE-AI-SAFE-LOBBY-NOGO \
            -D /tmp/p0d_475_parent
          test -s /tmp/p0d_475_parent/P0D_FB005_SAFE_LOBBY_CUMULATIVE_PRIVATE.zip
      - name: Build exact 82-script cumulative Place, negative guards, egg invariance
        shell: bash
        run: |
          set -euo pipefail
          python3 -B product_quality/private_ai_egg_hit_result_cumulative.py \
            --parent /tmp/p0d_475_parent/P0D_FB005_SAFE_LOBBY_CUMULATIVE_PRIVATE.zip \
            --out /tmp/P0D_FB005_AI_RAID_RESULT_CUMULATIVE_PRIVATE.zip \
            --extract /tmp/p0d_cumulative_sources
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/P0D_FB005_AI_RAID_RESULT_CUMULATIVE_PRIVATE.zip') as z:
              r=json.loads(z.read('RECEIPT.json'))
              assert r['sources']==82 and r['unchanged_parent_sources']==81
              assert r['game_blob']=='e1ac40d08ae163a442d848ae4c165b1c5253bdd7'
              assert r['place_sha256']=='130170d565a9b11851f4742a2a8dd7f6e3e926464aeb12d192cec4715bfb266a'
              assert r['place_bytes']==781134
              assert r['human_egg_score_exact'] is True
              assert r['bot_hit_and_egg_reason_fixed'] is True
              assert r['official_rc_write'] is False and r['product']=='NO_GO'
          game=Path('/tmp/p0d_cumulative_sources/Game.luau').read_text()
          assert 'horde:tick(now,eligibleSoloPlayers(),healthy)' in game
          assert 'P0D_SAFE_LOBBY' in game
          assert 'P0D_PRIVATE_SOLO_TEAM_BOTS' in game
          assert 'privateSoloBotsTrialAllowed()' in game
          assert 'pcall(SoloTeamBots.start,map,getTeamName(player),botAuthority)' in game
          assert 'SoloTeamBots.tryHumanHit(team,root.Position,look' in game
          assert 'if winner then' in game and 'else "EGG_CAPTURE")' in game
          start=game.index('local function applyAttack(')
          end=game.index('-- H1 RAIDER wind:',start)
          attack=game[start:end]
          assert attack.index('SoloTeamBots.tryHumanHit')<attack.index('if mobHits>0 then return end')<attack.index('local enemy = Rules.opponent(team)')
          assert 'player.Character~=castCharacter' in game
          assert 'sevenJobPickAckSeq[player]~=selectedAck' in game
          bot=Path('/tmp/p0d_cumulative_sources/SoloTeamBots.luau').read_text()
          assert 'game.PrivateServerId ~= ""' in bot
          assert 'callbacks.deposit(bot,bot.team,bot.carry)' in bot
          import sys
          sys.path.insert(0,'product_quality')
          import private_ai_egg_hit_result_cumulative as x
          try:x.swap_once(x.PRIORITY_NEW,x.PRIORITY_OLD,x.PRIORITY_NEW,'MUTANT')
          except ValueError:pass
          else:raise AssertionError('ACCEPTED_APPLIED_PATCH')
          assert len(list(Path('/tmp/p0d_cumulative_sources').glob('*.luau')))==82
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_pinned_luau
          persist-credentials: false
      - name: Native compile all actual 82 Luau sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_pinned_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_pinned_luau -B /tmp/p0d_quality_luau_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_quality_luau_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' f; do
            /tmp/p0d_quality_luau_build/luau-compile "$f" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_cumulative_sources -name '*.luau' -type f -print0 | sort -z)
          test "$n" -eq 82
          echo "P0D_REAL_AI_RAID_SCORE_NATIVE82_PASS_NOT_PRODUCT_ACCEPTANCE"
      - name: Prepare exact patched 82 source Rojo tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          import hashlib,json
          target=Path('/tmp/p0d_cumulative_rojo')
          target.mkdir(parents=True,exist_ok=True)
          with ZipFile('/tmp/P0D_FB005_AI_RAID_RESULT_CUMULATIVE_PRIVATE.zip') as z:
              rb=[n for n in z.namelist() if n.endswith('.rbxlx')]
              assert len(rb)==1
              root=ET.fromstring(z.read(rb[0]))
          kinds={'Script':'.server.luau','LocalScript':'.client.luau','ModuleScript':'.luau'}
          manifest=[]
          def walk(node,parent=()):
              p=node.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=parent+((name,) if name else ())
              if src is not None:
                  assert node.attrib['class'] in kinds and len(here)>=3
                  assert here[0] in ('ReplicatedStorage','ServerScriptService','StarterPlayer')
                  assert all(x.isidentifier() for x in here)
                  rel=Path(*here).with_suffix(kinds[node.attrib['class']])
                  f=target/'src'/rel
                  f.parent.mkdir(parents=True,exist_ok=True)
                  assert not f.exists()
                  f.write_text(src,encoding='utf-8')
                  x=src.encode('utf-8')
                  digest=hashlib.sha1(b'blob '+str(len(x)).encode()+b'\0'+x).hexdigest()
                  manifest.append({'path':'/'.join(here),'kind':node.attrib['class'],'blob':digest})
              for item in node.findall('Item'):walk(item,here)
          for node in root.findall('Item'):walk(node)
          assert len(manifest)==82
          (target/'manifest.json').write_text(json.dumps(manifest,indent=2))
          project={'name':'P0DNativePrivateAIRaidScore82','tree':{'$className':'DataModel',
            'ReplicatedStorage':{'$className':'ReplicatedStorage',
              'TrapRaidersShared':{'$path':'src/ReplicatedStorage/TrapRaidersShared'}},
            'ServerScriptService':{'$className':'ServerScriptService',
              'TrapRaidersS1':{'$path':'src/ServerScriptService/TrapRaidersS1'}},
            'StarterPlayer':{'$className':'StarterPlayer',
              'StarterPlayerScripts':{'$path':'src/StarterPlayer/StarterPlayerScripts'}}}}
          (target/'default.project.json').write_text(json.dumps(project,indent=2))
          print('EXACT_PATCHED_PLACE_ROJO_82_SOURCE_LAYOUT_READY')
          PY
      - name: Pinned Rojo 7.7.1 source-only class path GitBlob parity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_spectator_safe_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_spectator_safe_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/p0d_spectator_safe_rojo.zip') as z:
              matches=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='rojo']
              assert len(matches)==1
              p=Path('/tmp/p0d_safe_rojo_bin')
              p.write_bytes(z.read(matches[0]));p.chmod(0o755)
          PY
          /tmp/p0d_safe_rojo_bin build /tmp/p0d_cumulative_rojo/default.project.json -o /tmp/P0D_FB005_AI_RAID_RESULT_REBUILT_ROJO.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import xml.etree.ElementTree as ET
          import hashlib,json
          manifest=json.loads(Path('/tmp/p0d_cumulative_rojo/manifest.json').read_text())
          root=ET.fromstring(Path('/tmp/P0D_FB005_AI_RAID_RESULT_REBUILT_ROJO.rbxlx').read_bytes())
          got=[]
          def visit(n,base=()):
              p=n.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=base+((name,) if name else ())
              if src is not None:
                  x=src.encode('utf-8')
                  digest=hashlib.sha1(b'blob '+str(len(x)).encode()+b'\0'+x).hexdigest()
                  got.append({'path':'/'.join(here),'kind':n.attrib['class'],'blob':digest})
              for kid in n.findall('Item'):visit(kid,here)
          for i in root.findall('Item'):visit(i)
          assert len(got)==82 and len(manifest)==82
          assert Counter(x['path'] for x in got)==Counter(x['path'] for x in manifest)
          expect={x['path']:(x['kind'],x['blob']) for x in manifest}
          actual={x['path']:(x['kind'],x['blob']) for x in got}
          if expect!=actual:raise ValueError('SAFE_SPECTATOR_ROJO_PATH_CLASS_SOURCE_MISMATCH')
          print('P0D_FB005_PRIVATE_AI_RAID_RESULT_NATIVE_ROJO_EXACT_82_OF_82_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-QUALITY-FB005-PRIVATE-AI-RAID-RESULT-NOGO
          path: /tmp/P0D_FB005_AI_RAID_RESULT_CUMULATIVE_PRIVATE.zip
          retention-days: 7
