name: P0D GQ520 original34 neutral and Ridge only no RC
on:
  pull_request:
    paths:
      - 'quality_gameplay/v3_central_ridge_clearance_20261116/**'
      - '.github/workflows/p0d-gq-v3-ridge-author34.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-author-26-plus-8:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Read GQ objective client only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse original #504 composer and audio ONLY, exactly pinned
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 385d3242cbc8d0a3008ee818d8dc30040170fce6
          path: _v3_audio
          persist-credentials: false
      - name: Reuse pinned original objective compass from #496
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 7005fe0916ff157d770b638ac70efaef9396e0f5
          path: _v3_objective
          persist-credentials: false
      - name: Pin existing #503 original cosmetic FX scripts (no source rewrites)
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 9f9202988fdb3e983d6ae42ea4cf7de0a501c699
          path: _v3_fx
          persist-credentials: false
      - name: Pin unchanged original #500 active castle defense modules and source patch
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: abc4bd0edad4a07b159ee08d867dbdd6977f37ee
          path: _v3_castle
          persist-credentials: false
      - name: Pin original #494 single Swarm pacing source and patch engine
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: af8cd79f4217d187429270d29e6d44eb01725ff2
          path: _v3_pacing
          persist-credentials: false
      - name: Pin original #501 neutral encounter fairness and dual patch engine
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 880e89baa428006699f1e6d6d95468473acaf866
          path: _v3_neutral
          persist-credentials: false
      - name: Read immutable original V3 game author #482
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _v3_original
          persist-credentials: false
      - name: Read existing GQ AI and ramp author #484
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 6b52eaf1f2725496277998fe0c5532b7a8fcaab5
          path: _v3_quality
          persist-credentials: false
      - name: Read original ART author #485
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _v3_art
          persist-credentials: false
      - name: Read original SCORE author #487
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _v3_score
          persist-credentials: false
