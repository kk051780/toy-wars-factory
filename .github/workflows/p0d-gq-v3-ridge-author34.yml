          test "$(git -C _v3_pacing rev-parse HEAD)" = af8cd79f4217d187429270d29e6d44eb01725ff2
          test "$(git -C _v3_neutral rev-parse HEAD)" = 880e89baa428006699f1e6d6d95468473acaf866
          test "$(git -C _v3_fx rev-parse HEAD)" = 9f9202988fdb3e983d6ae42ea4cf7de0a501c699
          test "$(git -C _v3_objective rev-parse HEAD)" = 7005fe0916ff157d770b638ac70efaef9396e0f5
          test "$(git -C _v3_original rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _v3_quality rev-parse HEAD)" = 6b52eaf1f2725496277998fe0c5532b7a8fcaab5
          test "$(git -C _v3_art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _v3_score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
      - name: Run 26-source preservation and local client safety negatives
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -v -s _v3_objective/handoffs/EGGRUMBLE-GQ-OBJECTIVE-COMPASS-20261116/tests -p 'test_*.py'
          python3 -B -m unittest discover -v -s _v3_audio/quality/eggrumble_hit_audio_20261116/tests -p 'test_*.py'
      - name: Execute GQ520 geometry, 34-original provenance and native original 7-role source QA
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s quality_gameplay/v3_central_ridge_clearance_20261116 -p 'test_*.py' -v
          python3 -B -m unittest discover -s _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/tests -p 'test_*.py' -q
          python3 -B -m unittest discover -s _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tests -p 'test_*.py' -q
      - name: Reuse original ART artist tool (no duplicate visuals)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py \
            --target v3 \
            --author-project _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json \
            --out artifacts/ART_ORIGINAL.project.json
      - name: Reuse exactly one existing #484 author and ART and SCORE 26-source composer
        run: |
          set -euo pipefail
          python3 _v3_quality/quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py \
            --author _v3_original --quality _v3_quality --art _v3_art --score _v3_score \
            --art-project artifacts/ART_ORIGINAL.project.json --out artifacts/GAME_ART_SCORE_26.project.json
      - name: Add only one original GQ LocalScript without touching any original source
        run: |
          set -euo pipefail
          python3 _v3_objective/handoffs/EGGRUMBLE-GQ-OBJECTIVE-COMPASS-20261116/tools/overlay_current26.py \
