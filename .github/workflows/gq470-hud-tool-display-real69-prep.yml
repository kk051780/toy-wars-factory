name: GQ470 P0 HUD readable Tool names REAL69 source PREP (not formal RC)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_hud_labels_real69_20261120/**'
      - '.github/workflows/gq470-hud-tool-display-real69-prep.yml'
      - 'tests/test_gq470_hud_candidate_lineage_20261122.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-display-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify only official post-915 source is patched
        run: |
          set -euo pipefail
          SCRIPT=quality_gameplay/gq470_hud_labels_real69_20261120/patch_hud_labels.py
          python3 -m py_compile "$SCRIPT"
          python3 -B "$SCRIPT" --self-test
          python3 -B tests/test_gq470_hud_candidate_lineage_20261122.py
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44673605213 --jq '.head_sha+" "+.conclusion')" = "6c2338b44db1c772bab0d688b2aece2e3aa8aae2 success"
          mkdir -p "$RUNNER_TEMP/gq470-hud-labels"
          gh run download 44673605213 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir "$RUNNER_TEMP/gq470-hud-labels"
          python3 -B "$SCRIPT" --base "$RUNNER_TEMP/gq470-hud-labels"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'gq470-hud-labels'
          receipt=json.loads((root/'REAL69_LEGACY_INTAKE_RECEIPT.json').read_text())
          state=receipt['gq470_fb015_hud_tool_labels']
          assert state['unchanged_selected_sources']==67
          assert state['source_count']==69 and len(state['only_modified'])==2
          assert state['studio_android_fun']=='NOT_TESTED'
          combat=(root/'sources/ServerScriptService/EGGRUMBLE_SevenRoleCombat.luau').read_text()
          hud=(root/'sources/StarterPlayer/StarterPlayerScripts/EGGRUMBLE_HudIntelRuntime.client.luau').read_text()
          assert 'tool.Name="技"..slot.."・"..data.skills[index]' in combat
          assert 'toolIdentity(tool)' in hud
          assert 'player.UserId' in combat
          assert 'GQ8_RC85_RC86_FB019_LOCAL_ATTACK_SWING_REAL69_20261120' in hud
          assert (root/'off69_hud_labels/sources/ServerScriptService/EGGRUMBLE_SevenRoleCombat.luau').is_file()
          print('GQ470_REAL69_TWO_SOURCE_67_EXACT_QA_PASS_NOT_STUDIO')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native compile all 69 REAL69 selected LuaU sources
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-hud-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-hud-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq470_hud_labels_real69_20261120')
          from patch_hud_labels import selected_map
          root=Path(os.environ['RUNNER_TEMP'])/'gq470-hud-labels'
          paths=selected_map(root)
          assert len(paths)==69
          for path in paths.values():
            subprocess.run(['/tmp/gq470-hud-luau/luau-compile','--text',str(path)],stdout=subprocess.DEVNULL,check=True)
          print('GQ470_REAL69_HUD_69_SELECTED_NATIVE_LUAU_COMPILE_PASS')
          PY
      - name: Build REAL69 ON and source-exact OFF69 with pinned Rojo 7.7.1
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-hud-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-hud-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/gq470-hud-rojo.zip') as z:
            names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
            assert len(names)==1
            p=Path('/tmp/gq470-hud-rojo')
            p.write_bytes(z.read(names[0]))
            p.chmod(0o755)
          PY
          ROOT="$RUNNER_TEMP/gq470-hud-labels"
          /tmp/gq470-hud-rojo build "$ROOT/EGGRUMBLE_REAL69.project.json" -o /tmp/GQ470_HUD_REAL69_CANDIDATE_PRIVATE.rbxlx
          python3 - <<'PY'
          import hashlib,json,os,shutil,sys
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq470_hud_labels_real69_20261120')
          from patch_hud_labels import selected_map,COMBAT,HUD,PROJECT
          root=Path(os.environ['RUNNER_TEMP'])/'gq470-hud-labels'
          off=root/'off69_hud_rollback_69'
          shutil.copytree(root/'sources',off/'sources')
          shutil.copy2(root/PROJECT,off/PROJECT)
          modified=selected_map(off)
          for key in (COMBAT,HUD):
            src=(root/'off69_hud_labels'/modified[key].relative_to(off))
            assert src.is_file()
            shutil.copy2(src,modified[key])
          assert len(modified)==69
          on=selected_map(root)
          assert all(on[k].read_bytes()==modified[k].read_bytes() for k in on if k not in (COMBAT,HUD))
          assert all(on[k].read_bytes()!=modified[k].read_bytes() for k in (COMBAT,HUD))
          for k in (COMBAT,HUD):
            assert (root/'off69_hud_labels'/modified[k].relative_to(off)).read_bytes()==modified[k].read_bytes()
          print('GQ470_HUD_REAL69_OFF_TWO_ORIGINAL_SOURCE_EXACT_67_UNCHANGED_PASS')
          PY
          /tmp/gq470-hud-rojo build "$ROOT/off69_hud_rollback_69/EGGRUMBLE_REAL69.project.json" -o /tmp/GQ470_HUD_OFF69_ROLLBACK_PRIVATE.rbxlx
          test -s /tmp/GQ470_HUD_REAL69_CANDIDATE_PRIVATE.rbxlx
          test -s /tmp/GQ470_HUD_OFF69_ROLLBACK_PRIVATE.rbxlx
          echo GQ470_HUD_REAL69_NATIVE_ROJO_ON69_OFF69_PASS_NOT_STUDIO_ACCEPTED
      - name: Legacy 17-family, 48-flag and inverse Rojo exact recovery gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gq470-hud-labels"
          python3 - <<'PY'
          import json,os,pathlib,subprocess,sys,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gq470-hud-labels'
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          from quality_gameplay.gq8_rc85_rc86_real69_nonloss_20261120.verify_real69 import marker_check
          on=project_scan(root,'EGGRUMBLE_REAL69.project.json')
          off=project_scan(root/'off69_hud_rollback_69','EGGRUMBLE_REAL69.project.json')
          expected={'ServerScriptService/EGGRUMBLE_SevenRoleCombat',
                    'StarterPlayer/StarterPlayerScripts/EGGRUMBLE_HudIntelRuntime'}
          assert len(on)==len(off)==69 and set(on)==set(off)
          assert {k for k in on if on[k]['sha256']!=off[k]['sha256']}==expected
          assert all(on[k]['class']==off[k]['class'] for k in on)
          for info in off.values():
              subprocess.run(['/tmp/gq470-hud-luau/luau-compile','--text',
                str(root/'off69_hud_rollback_69'/info['path'])],
                check=True,stdout=subprocess.DEVNULL)
          families=marker_check(on)
          assert len(families)==17
          receipt=root/'REAL69_LEGACY_INTAKE_RECEIPT.json'
          r=json.loads(receipt.read_text())
          assert r['gq470_fb015_hud_tool_labels']['base_official_head']=='6c2338b44db1c772bab0d688b2aece2e3aa8aae2'
          assert all(r['source_hashes'][k]==on[k]['sha256'] for k in on)
          r['gq470_fb015_hud_tool_labels']['native_rojo_off69']='PASS_SOURCE_ONLY'
          r['gq470_fb015_hud_tool_labels']['studio_android_fun']='NOT_TESTED'
          r['gq470_fb015_hud_tool_labels']['owner_accepted']=False
          r['candidate_private_place_bytes']=pathlib.Path('/tmp/GQ470_HUD_REAL69_CANDIDATE_PRIVATE.rbxlx').stat().st_size
          r['candidate_private_place_sha256']=hashlib.sha256(pathlib.Path('/tmp/GQ470_HUD_REAL69_CANDIDATE_PRIVATE.rbxlx').read_bytes()).hexdigest()
          r['candidate_ci_head']=os.environ['GITHUB_SHA']
          receipt.write_text(json.dumps(r,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          (root/'HUD_REAL69_LEGACY17_NONLOSS_AUDIT.json').write_text(
              json.dumps({'family_count':17,'families':families,'changed_routes':sorted(expected),
                          'preserved_original_routes':67,'studio':'NOT_TESTED'},ensure_ascii=False,indent=2)+'\n')
          print('GQ470_HUD_69_ON_OFF_COMPILE_17_FAMILY_PRESERVED_PASS')
          PY
          python3 -B quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$ROOT/EGGRUMBLE_REAL69.project.json" --place /tmp/GQ470_HUD_REAL69_CANDIDATE_PRIVATE.rbxlx --count 69
          python3 -B quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$ROOT/off69_hud_rollback_69/EGGRUMBLE_REAL69.project.json" --place /tmp/GQ470_HUD_OFF69_ROLLBACK_PRIVATE.rbxlx --count 69
          cmp /tmp/GQ470_HUD_OFF69_ROLLBACK_PRIVATE.rbxlx "$ROOT/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base "$ROOT" --report "$ROOT/HUD_REAL69_LEGACY48_FEATURE_AUDIT.json"
          # Keep the immutable author input, but bind preparation to the live PR/RC lineage.
          python3 -B quality_gameplay/gq470_hud_labels_real69_20261120/verify_candidate_lineage.py \
            --out "$ROOT/HUD_CANDIDATE_LINEAGE_RECEIPT.json"
          echo GQ470_HUD_COMPLETE_SOURCE_ONLY_GATE_PASS_NOT_STUDIO
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-HUD-HOTBAR-PREP-NOT-FORMAL
          path: |
            ${{ runner.temp }}/gq470-hud-labels/EGGRUMBLE_REAL69.project.json
            ${{ runner.temp }}/gq470-hud-labels/REAL69_LEGACY_INTAKE_RECEIPT.json
            ${{ runner.temp }}/gq470-hud-labels/HUD_REAL69_LEGACY17_NONLOSS_AUDIT.json
            ${{ runner.temp }}/gq470-hud-labels/HUD_REAL69_LEGACY48_FEATURE_AUDIT.json
            ${{ runner.temp }}/gq470-hud-labels/HUD_CANDIDATE_LINEAGE_RECEIPT.json
            /tmp/GQ470_HUD_REAL69_CANDIDATE_PRIVATE.rbxlx
            /tmp/GQ470_HUD_OFF69_ROLLBACK_PRIVATE.rbxlx
          if-no-files-found: error
          retention-days: 7
