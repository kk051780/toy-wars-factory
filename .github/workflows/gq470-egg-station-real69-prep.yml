name: GQ470 REAL69 egg stations source PREP (NOT formal ART_GO)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_egg_station_art_real69_20261120/**'
      - '.github/workflows/gq470-egg-station-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-and-real-place-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      ROOT: /tmp/gq470-egg69
      PARENT_SHA: c226c63eeb235503f9292503b61f2173550337ec
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Immutable official same-head + five source negatives + 69 locked routes
        shell: bash
        run: |
          set -euo pipefail
          PY=quality_gameplay/gq470_egg_station_art_real69_20261120/patch_egg_station69.py
          python3 -m py_compile "$PY"
          python3 -B "$PY" --self-test
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44686473297 --jq '.head_sha+" "+.conclusion')" = "$PARENT_SHA success"
          mkdir -p "$ROOT"
          gh run download 44686473297 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir "$ROOT"
          test -s "$ROOT/EGGRUMBLE_REAL69.project.json"
          test -s "$ROOT/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          test -s "$ROOT/REAL69_LEGACY_INTAKE_RECEIPT.json"
          python3 -B "$PY" --base "$ROOT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/gq470-egg69/REAL69_LEGACY_INTAKE_RECEIPT.json').read_text())
          x=r['gq470_egg_station_art']
          assert x['other_selected_sources_byte_exact']==68 and x['total_selected_sources']==69
          assert x['new_scripts']==0 and x['max_ornament_parts_per_station']==6
          assert x['new_collisions'] is False and x['new_gameplay_or_scoring_authority'] is False
          assert x['owner_accepted'] is False
          print('EGG_ART_SOURCE_QA_PASS_NOT_HUMAN_ART_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native compile on69 and off69 original Lua source routes
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-egg-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-egg-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          from pathlib import Path
          import sys,subprocess
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          root=Path('/tmp/gq470-egg69')
          a=project_scan(root,'EGGRUMBLE_REAL69.project.json')
          b=project_scan(root/'off69_egg_station','EGGRUMBLE_REAL69.project.json')
          assert len(a)==len(b)==69 and set(a)==set(b)
          assert {k for k in a if a[k]['sha256']!=b[k]['sha256']}=={'ServerScriptService/EGGRUMBLE_EncounterReadabilityArt'}
          assert all(a[k]['class']==b[k]['class'] for k in a)
          for folder,scripts in ((root,a),(root/'off69_egg_station',b)):
            for x in scripts.values():
              subprocess.run(['/tmp/gq470-egg-luau/luau-compile','--text',str(folder/x['path'])],stdout=subprocess.DEVNULL,check=True)
          print('EGG_ART_ON69_OFF69_NATIVE_PASS')
          PY
      - name: Build two pinned Rojo 7.7.1 places and byte-exact rollback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-egg-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-egg-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq470-egg-rojo.zip') as z:
            a=[s for s in z.namelist() if s.split('/')[-1]=='rojo']
            assert len(a)==1
            p=Path('/tmp/gq470-egg-rojo')
            p.write_bytes(z.read(a[0]));p.chmod(0o755)
          PY
          /tmp/gq470-egg-rojo build "$ROOT/EGGRUMBLE_REAL69.project.json" -o "$ROOT/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          /tmp/gq470-egg-rojo build "$ROOT/off69_egg_station/EGGRUMBLE_REAL69.project.json" -o "$ROOT/OFF69_EGG_STATION_REBUILT.rbxlx"
          cmp "$ROOT/OFF69_EGG_STATION_REBUILT.rbxlx" "$ROOT/off69_egg_station/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$ROOT/EGGRUMBLE_REAL69.project.json" --place "$ROOT/EGGRUMBLE_REAL69_PRIVATE.rbxlx" --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$ROOT/off69_egg_station/EGGRUMBLE_REAL69.project.json" --place "$ROOT/OFF69_EGG_STATION_REBUILT.rbxlx" --count 69
          CURRENT="$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01 --jq .object.sha)"
          test "$CURRENT" = "$PARENT_SHA" || { echo RED_STALE_OFFICIAL_PARENT; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            PR_BASE="$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")"
            test "$PR_BASE" = "$CURRENT" || { echo RED_STALE_PR_BASE; exit 1; }
          fi
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/gq470-egg69');p=root/'EGGRUMBLE_REAL69_PRIVATE.rbxlx'
          f=root/'REAL69_LEGACY_INTAKE_RECEIPT.json';r=json.loads(f.read_text())
          x=r['gq470_egg_station_art'];x['source_native']='PASS';x['rojo']='PASS'
          x['studio']='NOT_TESTED';x['android']='NOT_TESTED';x['owner_accepted']=False
          r['private_place_bytes']=p.stat().st_size
          r['private_place_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          r['candidate_ci_ref']=os.environ['GITHUB_SHA']
          f.write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('EGG_ART_PRIVATE_PLACE_SOURCE_PASS_NOT_ART_GO',p.stat().st_size)
          PY
      - name: Preserve all 17 source families and original 48 legacy flag inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/gq470-egg69/REAL69_LEGACY_INTAKE_RECEIPT.json')
          r=json.loads(p.read_text())
          assert r['gq470_egg_station_art']['formal_parent']==os.environ['PARENT_SHA']
          r['build_head']=os.environ['GITHUB_SHA']
          p.write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          from quality_gameplay.gq8_rc85_rc86_real69_nonloss_20261120.verify_real69 import marker_check
          root=Path('/tmp/gq470-egg69')
          sources=project_scan(root,'EGGRUMBLE_REAL69.project.json')
          families=marker_check(sources)
          assert len(sources)==69 and len(families)==17
          (root/'EGG_STATION_LEGACY17_AUDIT.json').write_text(json.dumps({'source_family_count':17,'family_evidence':families,'human_art':'NOT_TESTED'},ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 -B quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base "$ROOT" --report "$ROOT/EGG_STATION_LEGACY48_AUDIT.json"
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-EGG-STATION-PREP-NOT-FORMAL
          path: |
            /tmp/gq470-egg69/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-egg69/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-egg69/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-egg69/sources/**
            /tmp/gq470-egg69/OFF69_EGG_STATION_REBUILT.rbxlx
            /tmp/gq470-egg69/EGG_STATION_LEGACY17_AUDIT.json
            /tmp/gq470-egg69/EGG_STATION_LEGACY48_AUDIT.json
          if-no-files-found: error
          retention-days: 7
