name: GQ470 REAL69 seven-role weapon silhouette source PREP (not official RC)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_fb015_weapon_sculpt_real69_20261120/**'
      - '.github/workflows/gq470-weapon-sculpt-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-exact-weapon-sculpt:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      FORMAL_HEAD: 273e763c42ee0f405ef854b75c3cf071b078e896
      FORMAL_RUN: '45516606797'
      FORMAL_ARTIFACT: '14977773039'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check fixed weapon source, twelve mutation negatives, and fresh canonical parent
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")" = "$(git rev-parse HEAD)" || { echo RED_CANDIDATE_CHECKOUT_HEAD_DRIFT; exit 1; }
            test "$(jq -r .pull_request.base.ref "$GITHUB_EVENT_PATH")" = "rc/p0d-s1-kids-rc01" || { echo RED_CANDIDATE_PR_BASE_DRIFT; exit 1; }
          else
            test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          fi
          python3 -m py_compile quality_gameplay/gq470_fb015_weapon_sculpt_real69_20261120/verify_weapons69.py
          python3 -B quality_gameplay/gq470_fb015_weapon_sculpt_real69_20261120/verify_weapons69.py --self-test
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01 --jq .object.sha)" = "$FORMAL_HEAD" || { echo RED_STALE_FORMAL_HEAD_REBASE_REQUIRED; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FORMAL_RUN" --jq '.head_sha+" "+.conclusion+" "+.event')" = "$FORMAL_HEAD success push"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FORMAL_ARTIFACT" --jq '.workflow_run.id|tostring')" = "$FORMAL_RUN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FORMAL_ARTIFACT" --jq .digest)" = 'sha256:f4e8cfb036cfb83e33d95c20e0d9cf9522e5737881e26e61f317fccb230567b0'
          mkdir -p /tmp/gq470-weapons
          gh run download "$FORMAL_RUN" --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir /tmp/gq470-weapons
          test -s /tmp/gq470-weapons/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          test -s /tmp/gq470-weapons/REAL69_LEGACY_INTAKE_RECEIPT.json
          python3 -B quality_gameplay/gq470_fb015_weapon_sculpt_real69_20261120/verify_weapons69.py --base /tmp/gq470-weapons
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path("/tmp/gq470-weapons/REAL69_LEGACY_INTAKE_RECEIPT.json").read_text())
          x=receipt["gq470_fb015_weapon_sculpt"]
          assert x["other_selected_sources_byte_exact"]==68
          assert x["total_existing_visual_parts"]==32 and x["additional_visual_parts"]==0
          assert x["studio_solo_2client"]=="NOT_TESTED" and x["android15"]=="NOT_TESTED"
          assert x["art_images_received"]==0 and x["art_images_required"]==32
          assert x["owner_accepted"] is False
          print("GQ470_WEAPON_SOURCE_ONLY_NOT_STUDIO_OR_ART_PASS")
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native Luau compile all 69 selected scripts ON and OFF
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-weapon-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-weapon-luau --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          python3 - <<'PY'
          import subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq470_fb015_weapon_sculpt_real69_20261120")
          from verify_weapons69 import chosen,TARGET
          root=Path("/tmp/gq470-weapons")
          on=chosen(root);off=chosen(root/"OFF69_WEAPON")
          assert len(on)==len(off)==69 and set(on)==set(off)
          assert {k for k in on if on[k][0].read_bytes()!=off[k][0].read_bytes()}=={TARGET}
          for selection in (on,off):
              for file,_kind in selection.values():
                  subprocess.run(["/tmp/gq470-weapon-luau/luau-compile","--text",str(file)],check=True,stdout=subprocess.DEVNULL)
          print("GQ470_WEAPON_NATIVE_ON69_OFF69_PASS")
          PY
          sourcepath=quality_gameplay/gq470_fb015_weapon_sculpt_real69_20261120
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/$sourcepath/EGGRUMBLE_WeaponSilhouettes.luau?ref=b6417df54b2c1805a21e257489e54a4a1454e923" > /tmp/gq470-weapon-v2.luau
          python3 -B "$sourcepath/verify_weapons69.py" --base /tmp/gq470-weapons \
            --native /tmp/gq470-weapon-luau/luau --previous-v2 /tmp/gq470-weapon-v2.luau \
            --evidence /tmp/gq470-weapons/WEAPON_FACET_NATIVE
      - name: Rojo ON/OFF inverse, source family, old48 inventory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-weapon-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-weapon-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq470-weapon-rojo.zip") as z:
              matches=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(matches)==1
              p=Path("/tmp/gq470-weapon-rojo")
              p.write_bytes(z.read(matches[0]));p.chmod(0o755)
          PY
          /tmp/gq470-weapon-rojo build /tmp/gq470-weapons/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-weapons/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          /tmp/gq470-weapon-rojo build /tmp/gq470-weapons/OFF69_WEAPON/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-weapons/OFF69_WEAPON_REBUILT.rbxlx
          cmp /tmp/gq470-weapons/OFF69_WEAPON_REBUILT.rbxlx /tmp/gq470-weapons/OFF69_WEAPON/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-weapons/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-weapons/EGGRUMBLE_REAL69_PRIVATE.rbxlx --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-weapons/OFF69_WEAPON/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-weapons/OFF69_WEAPON_REBUILT.rbxlx --count 69
          python3 quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base /tmp/gq470-weapons --report /tmp/gq470-weapons/WEAPON_LEGACY48_AUDIT.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("/tmp/gq470-weapons")
          path=root/"REAL69_LEGACY_INTAKE_RECEIPT.json"
          receipt=json.loads(path.read_text())
          receipt["gq470_fb015_weapon_sculpt"]["native_rojo_off69"]="PASS_SOURCE_ONLY"
          place=root/"EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          receipt["private_place_bytes"]=place.stat().st_size
          receipt["private_place_sha256"]=hashlib.sha256(place.read_bytes()).hexdigest()
          path.write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print("GQ470_WEAPON_CANDIDATE_PLACE_BYTES",place.stat().st_size)
          PY
          echo GQ470_WEAPONS_NATIVE_ROJO_OFF69_LEGACY48_PASS_NOT_ART_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-WEAPON-SCULPT-PREP-NOT-FORMAL
          path: |
            /tmp/gq470-weapons/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-weapons/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-weapons/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-weapons/sources/**
            /tmp/gq470-weapons/WEAPON_ART_SOURCE_REPORT.json
            /tmp/gq470-weapons/WEAPON_LEGACY48_AUDIT.json
            /tmp/gq470-weapons/WEAPON_FACET_NATIVE/**
            /tmp/gq470-weapons/OFF69_WEAPON_REBUILT.rbxlx
          if-no-files-found: error
          retention-days: 7
