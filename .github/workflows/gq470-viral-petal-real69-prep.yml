name: GQ470 FB015 REAL69 matte viral moment facets PREP
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_viral_petal_real69_20261121/**'
      - '.github/workflows/gq470-viral-matte-streak-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin original true REAL69 Place and source from official artifact
        shell: bash
        run: |
          set -euo pipefail
          PIN=e80973c354f14a0d0088577f3cc1a875454f0f8f
          NOW=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)
          test "$NOW" = "$PIN" || { echo RED_FORMAL_HEAD_MOVED; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44695199140" --jq '.head_sha+" "+.conclusion')" = "$PIN success"
          mkdir -p /tmp/gq470-viral/input
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO \
            --dir /tmp/gq470-viral/input
          test -s /tmp/gq470-viral/input/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 -B quality_gameplay/gq470_viral_petal_real69_20261121/patch.py --self-test
          python3 -B quality_gameplay/gq470_viral_petal_real69_20261121/patch.py \
            --source /tmp/gq470-viral/input --dest /tmp/gq470-viral/candidate
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/gq470-viral/candidate/GQ470_VIRAL_PETAL_SOURCE_QA.json').read_text())
          assert a['changed']==1 and a['unchanged']==68
          assert a['new_parts_per_cue']==4 and a['old_parts_per_cue']==8 and a['new_remotes']==0
          assert a['new_sha256']=='3f788b67aa1df39fbf6ea28212cfc36b2121ecc1c51e071ede4fe5afcc1959bd'
          assert a['studio']=='NOT_TESTED' and a['owner_accepted'] is False
          print('GQ470_VIRAL_REAL69_A_SOURCE_1_CHANGED_68_EXACT_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: True native Luau compile on original69 and candidate69
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-viral-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-viral-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import json,pathlib,subprocess
          for branch in ('input','candidate'):
              root=pathlib.Path('/tmp/gq470-viral')/branch
              project=json.loads((root/'EGGRUMBLE_REAL69.project.json').read_text())
              paths=[]
              def walk(node):
                  if not isinstance(node,dict):return
                  if '$path' in node:paths.append(root/node['$path'])
                  for k,v in node.items():
                      if not k.startswith('$'):walk(v)
              walk(project['tree'])
              assert len(paths)==69
              for file in paths:
                  subprocess.run(['/tmp/gq470-viral-luau/luau-compile','--text',str(file)],check=True,stdout=subprocess.DEVNULL)
              print('GQ470_VIRAL_NATIVE_LUAU_'+branch+'_69_PASS')
          PY
      - name: True pinned Rojo ON and byte-exact OFF original Place
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-viral-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-viral-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq470-viral-rojo.zip') as a:
              files=[x for x in a.namelist() if x.split('/')[-1]=='rojo']
              assert len(files)==1
              p=Path('/tmp/gq470-viral-rojo')
              p.write_bytes(a.read(files[0]));p.chmod(0o755)
          PY
          /tmp/gq470-viral-rojo build /tmp/gq470-viral/candidate/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-viral/candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          /tmp/gq470-viral-rojo build /tmp/gq470-viral/input/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-viral/off69_rebuilt.rbxlx
          cmp /tmp/gq470-viral/off69_rebuilt.rbxlx /tmp/gq470-viral/input/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET,hashlib,json
          root=Path('/tmp/gq470-viral')
          def scripts(path):
              data={}
              for item in ET.fromstring(path.read_bytes()).iter('Item'):
                  kind=item.get('class')
                  if kind not in ('Script','LocalScript','ModuleScript'):continue
                  p=item.find('Properties');n=p.find("string[@name='Name']");s=p.find("string[@name='Source']")
                  assert n is not None and s is not None and n.text not in data
                  data[n.text]=(kind,s.text or '')
              return data
          original=scripts(root/'input/EGGRUMBLE_REAL69_PRIVATE.rbxlx')
          candidate=scripts(root/'candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx')
          assert len(original)==len(candidate)==69 and set(original)==set(candidate)
          changed=[key for key in original if original[key]!=candidate[key]]
          assert changed==['GQ8_ViralCapture']
          assert original[changed[0]][0]==candidate[changed[0]][0]=='LocalScript'
          qa=json.loads((root/'candidate/GQ470_VIRAL_PETAL_SOURCE_QA.json').read_text())
          assert hashlib.sha256(candidate[changed[0]][1].encode()).hexdigest()==qa['new_sha256']
          a=(root/'input/EGGRUMBLE_REAL69_PRIVATE.rbxlx').stat().st_size
          b=(root/'candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx').stat().st_size
          print('GQ470_VIRAL_TRUE_ROJO_ON69_OFF69_PASS ORIGINAL',a,'CANDIDATE',b,'DELTA',b-a)
          PY
      - name: Upload A-only candidate for B220 source-select
        uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-VIRAL-MATTE-PETALS-A-NOT-FORMAL
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/gq470-viral/candidate/GQ470_VIRAL_PETAL_SOURCE_QA.json
            /tmp/gq470-viral/candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-viral/candidate/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-viral/candidate/sources/StarterPlayer/StarterPlayerScripts/GQ8_ViralCapture.client.luau
