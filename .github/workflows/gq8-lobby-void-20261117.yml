name: GQ8 private RC31 first-join lobby void repair
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - "quality_gameplay/gq8_lobby_void_spawn_20261117/**"
      - ".github/workflows/gq8-lobby-void-20261117.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-official-place:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download SAME-HEAD exact official EGGRUMBLE V3 artifact (not an author preview)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gq8_official
          gh run download 43953617782 --repo kk051780/toy-wars-factory \
            --name P0D-EGGRUMBLE-V3-RC31-CANONICAL-COMPANION-STUDIO \
            --dir /tmp/gq8_official
          test -s /tmp/gq8_official/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx
      - name: Apply single original Host lobby floor / SpawnLocation real Luau patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/gq8_private
          python3 quality_gameplay/gq8_lobby_void_spawn_20261117/patch_official_place.py \
            --input /tmp/gq8_official/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx \
            --output /tmp/gq8_private/GQ8_LOBBY_VOID_PRIVATE31.rbxlx \
            --receipt /tmp/gq8_private/GQ8_LOBBY_VOID_SOURCE_LOCK.json
          python3 quality_gameplay/gq8_lobby_void_spawn_20261117/test_repair.py \
            --original /tmp/gq8_official/gq530_all31/EGGRUMBLE_V3_RC31_CANONICAL_STUDIO.rbxlx \
            --candidate /tmp/gq8_private/GQ8_LOBBY_VOID_PRIVATE31.rbxlx \
            --receipt /tmp/gq8_private/GQ8_LOBBY_VOID_SOURCE_LOCK.json
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq8_native_luau
          persist-credentials: false
      - name: Compile ACTUAL private candidate 31 scripts with original-pinned native Luau
        run: |
          set -euo pipefail
          cmake -S _gq8_native_luau -B /tmp/gq8_native -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8_native --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,xml.etree.ElementTree as ET
          p=Path("/tmp/gq8_private/GQ8_LOBBY_VOID_PRIVATE31.rbxlx")
          root=ET.fromstring(p.read_bytes())
          sources=[]
          for item in root.iter("Item"):
              if item.get("class") not in ("Script","ModuleScript","LocalScript"):continue
              props=item.find("Properties")
              source=props.findtext("string[@name='Source']")
              assert source is not None
              sources.append(source)
          assert len(sources)==31
          for i,source in enumerate(sources):
              f=Path("/tmp/gq8_private")/("source_%02d.luau"%i)
              f.write_text(source,"utf-8")
              subprocess.run(["/tmp/gq8_native/luau-compile","--text",str(f)],check=True,stdout=subprocess.DEVNULL)
          print("GQ8_LOBBY_VOID_SAME_HEAD_NATIVE_31_OF_31_COMPILED_PASS")
          PY
      - name: Upload PRIVATE artifact, never official RC or published Roblox
        uses: actions/upload-artifact@v4
        with:
          name: GQ8-LOBBY-VOID-PRIVATE31-SOURCE-ONLY-NO-FUN-GO
          path: |
            /tmp/gq8_private/GQ8_LOBBY_VOID_PRIVATE31.rbxlx
            /tmp/gq8_private/GQ8_LOBBY_VOID_SOURCE_LOCK.json
          retention-days: 7
