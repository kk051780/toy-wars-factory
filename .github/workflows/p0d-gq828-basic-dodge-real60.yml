name: Historical GQ828 Real60 Parent59 (superseded by Official Real62 to Real63)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real60-single-combat-anti-cheat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify parent official Real59 identity and exact same-head run
        run: |
          set -euo pipefail
          RC_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$RC_HEAD" = 5a47e96f6b4766a9c59dd06b111bea53b73bd5ca || { echo RED_OFFICIAL_HEAD_MOVED_REBASE_REQUIRED; exit 1; }
          PARENT="$(gh run view 44403496549 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')"
          test "$PARENT" = "5a47e96f6b4766a9c59dd06b111bea53b73bd5ca success" || { echo RED_OFFICIAL_PARENT_CI_NOT_SUCCESS; exit 1; }
          echo "BASE_RC=$RC_HEAD" >> "$GITHUB_ENV"
          mkdir -p artifacts/parent-real59
          gh run download 44403496549 --repo "$GITHUB_REPOSITORY" \
            --name GQ8-REAL59-HOST-ACTIVE-NOT-OFFICIAL \
            --dir artifacts/parent-real59
          python3 - <<'PY'
          import os
          from pathlib import Path
          files=[
            ("EGGRUMBLE_REAL59_HOST_ACTIVE.rbxlx","PLACE"),
            ("HOST_ACTIVE_RECEIPT.json","RECEIPT"),
          ]
          for name,key in files:
              found=list(Path("artifacts/parent-real59").rglob(name))
              assert len(found)==1,("RED_MISSING_FORMAL_PARENT",name,len(found))
              with open(os.environ["GITHUB_ENV"],"a") as f:
                  f.write(f"{key}={found[0]}\n")
          PY
      - name: Select original exact 59 + one policy and patch ONLY original Combat/HUD
        run: |
          set -euo pipefail
          python3 -B handoffs/EGGRUMBLE-BASIC-DODGE-20261119/compose_real60.py \
            --place "$PLACE" --receipt "$RECEIPT" --out artifacts/gq828real60
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("artifacts/gq828real60")
          data=json.loads((root/"REAL60_RECEIPT.json").read_text())
          assert data["original_unchanged"]==57
          assert data["original_parent_place_sha256"] and data["parent_original_sources"]==59
          assert len(data["off_sources"])==59 and len(data["on_sources"])==60
          old={x["route"]:x for x in data["off_sources"]}
          new={x["route"]:x for x in data["on_sources"]}
          added=set(new)-set(old)
          changed={x for x in old if old[x]["sha256"]!=new[x]["sha256"]}
          assert added=={"ServerScriptService/EGGRUMBLE_BasicMobilityPolicy"},("RED_NEW_SOURCE_AUTHORITY",added)
          assert changed=={"ServerScriptService/EGGRUMBLE_SevenRoleCombat",
                           "StarterPlayer/StarterPlayerScripts/EGGRUMBLE_HudIntelRuntime"},("RED_UNREVIEWED_OWNER_CHANGE",changed)
          def source_file(directory,name):
              files=list((root/directory/"sources").glob(name+".*luau"))
              assert len(files)==1,("RED_CLASS_MISMATCH",name,files)
              return files[0].read_text()
          combat=source_file("on60","EGGRUMBLE_SevenRoleCombat")
          original=source_file("off59","EGGRUMBLE_SevenRoleCombat")
          direct=lambda s:sum(l.split("--",1)[0].count(":TakeDamage(") for l in s.splitlines())
          assert direct(combat)==direct(original),("RED_SECOND_DAMAGE_SITE",direct(combat),direct(original))
          assert 'local CoreAction=require(script.Parent:WaitForChild("EGGRUMBLE_BasicMobilityPolicy"))' in combat
          assert combat.count('core.Activated:Connect(')==1
          assert combat.count('executeCoreAction(session,p,role,action,core)')==1
          policy=(root/"on60/sources/EGGRUMBLE_BasicMobilityPolicy.luau").read_text()
          executable="\\n".join(line.split("--",1)[0] for line in policy.splitlines())
          for forbidden in ("RemoteEvent","MarketplaceService","DataStoreService","ProcessReceipt"):
              assert forbidden not in executable,("RED_POLICY_AUTHORITY",forbidden)
          print("GQ828_REAL60_ONLY_ONE_ORIGINAL_COMBAT_SERVER_DAMAGE_SITE_UNCHANGED_PASS")
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native Luau compile all actual 60 source + OFF59 + 7-role policy adversarial suite
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq828-real60-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq828-real60-native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          VM=/tmp/gq828-real60-native/luau
          CC=/tmp/gq828-real60-native/luau-compile
          for dir in artifacts/gq828real60/on60/sources artifacts/gq828real60/off59/sources; do
            for file in "$dir"/*.luau; do "$CC" --text "$file" >/dev/null; done
          done
          python3 -B handoffs/EGGRUMBLE-BASIC-DODGE-20261119/make_native_basic.py --out /tmp/gq828-real60-probes
          "$VM" /tmp/gq828-real60-probes/positive.luau | tee /tmp/gq828-real60.log
          grep -qx GQ828_REAL60_BASIC_DODGE_NATIVE_SEVEN_ROLE_COOLDOWN_ANTICHEAT_PASS /tmp/gq828-real60.log
          for mutant in unowned egg cooldown; do
            if "$VM" "/tmp/gq828-real60-probes/${mutant}_mutant.luau" >"/tmp/gq828-${mutant}.log" 2>&1; then
              echo "RED_UNDETECTED_${mutant}_MUTANT"; exit 1
            fi
            grep -q RED_ "/tmp/gq828-${mutant}.log"
          done
          echo GQ828_REAL60_NATIVE_ACTUAL_ORIGINAL_COMBAT_HUD_AND_SEVEN_ROLE_POLICY_PASS
      - name: Pinned Rojo exact Real60 ON and OFF59 rollback with Source/Class gate
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq828-real60-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq828-real60-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq828-real60-rojo.zip") as zip:
              paths=[n for n in zip.namelist() if n.split("/")[-1]=="rojo"]
              assert len(paths)==1
              out=Path("/tmp/gq828-real60-rojo")
              out.write_bytes(zip.read(paths[0]));out.chmod(0o755)
          PY
          ROJO=/tmp/gq828-real60-rojo
          ROOT=artifacts/gq828real60
          "$ROJO" build "$ROOT/on60/GQ828_REAL60_BASIC_DODGE.project.json" -o "$ROOT/EGGRUMBLE_REAL60_BASIC_DODGE_PRIVATE.rbxlx"
          "$ROJO" build "$ROOT/off59/GQ828_OFF59_EXACT.project.json" -o "$ROOT/EGGRUMBLE_OFF59_ROLLBACK_PRIVATE.rbxlx"
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project "$ROOT/on60/GQ828_REAL60_BASIC_DODGE.project.json" \
            --place "$ROOT/EGGRUMBLE_REAL60_BASIC_DODGE_PRIVATE.rbxlx" --count 60
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project "$ROOT/off59/GQ828_OFF59_EXACT.project.json" \
            --place "$ROOT/EGGRUMBLE_OFF59_ROLLBACK_PRIVATE.rbxlx" --count 59
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$CURRENT" = "$BASE_RC" || { echo RED_OFFICIAL_MOVED_DURING_SOURCE_SELECTION; exit 1; }
          python3 - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          root=Path("artifacts/gq828real60")
          receipt=root/"REAL60_RECEIPT.json"
          data=json.loads(receipt.read_text())
          on=root/"EGGRUMBLE_REAL60_BASIC_DODGE_PRIVATE.rbxlx"
          off=root/"EGGRUMBLE_OFF59_ROLLBACK_PRIVATE.rbxlx"
          data.update(
            native="PASS",rojo="PASS",off59="PASS",
            candidate_git_head=os.environ["GITHUB_SHA"],official_parent_head=os.environ["BASE_RC"],
            place_sha256=hashlib.sha256(on.read_bytes()).hexdigest(),
            place_bytes=on.stat().st_size,
            off59_sha256=hashlib.sha256(off.read_bytes()).hexdigest(),
            off59_bytes=off.stat().st_size)
          receipt.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          print("GQ828_REAL60_ACTUAL_NATIVE_ROJO_SOURCE_CLASS_OFF59_PASS",on.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ828-REAL60-BASIC-DODGE-PRIVATE-NOT-OFFICIAL-RC
          path: |
            artifacts/gq828real60/EGGRUMBLE_REAL60_BASIC_DODGE_PRIVATE.rbxlx
            artifacts/gq828real60/EGGRUMBLE_OFF59_ROLLBACK_PRIVATE.rbxlx
            artifacts/gq828real60/REAL60_RECEIPT.json
            artifacts/gq828real60/on60/GQ828_REAL60_BASIC_DODGE.project.json
          retention-days: 4
          if-no-files-found: error
