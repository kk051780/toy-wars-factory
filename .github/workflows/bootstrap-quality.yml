name: Toy Wars bootstrap offline QA
on:
  push:
    branches: ["bootstrap/**", "feature/**", "main"]
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "tools/**"
      - "runtime/**"
      - ".dockerignore"
      - ".github/workflows/bootstrap-quality.yml"
      - "PROJECT_STATE.json"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "twf-offline-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  compile_hold:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the same pinned official compiler as the reviewed lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.93.2
      - name: Recompile the literal incident hold without invoking an agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile .github/workflows/twf-gemini-free-trial.md
          python3 tools/verify_gemini_hold.py
          git diff --exit-code -- .github/workflows/twf-gemini-free-trial.lock.yml
      - name: Preserve compiler output for exact review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twf-literal-hold-compiled-workflow
          path: .github/workflows/twf-gemini-free-trial.lock.yml
          include-hidden-files: true
          retention-days: 30
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout immutable public AWF source for offline regression
        uses: actions/checkout@v4
        with:
          repository: github/gh-aw-firewall
          ref: 32c12e0099763dad77acef6c655cb12e58fe36e1
          path: .qa/awf
          sparse-checkout: containers/api-proxy
          persist-credentials: false
      - name: Native Gemini admission and bounded mock-transport regression (no provider calls)
        env:
          TWF_AWF_ROOT: ${{ github.workspace }}/.qa/awf
        run: node --test tests/gemini_budget_guard.test.cjs tests/gemini_admission_overlay.test.cjs
      - name: Checkout exact official SDK model lookup for input-bound inspection
        uses: actions/checkout@v4
        with:
          repository: googleapis/python-genai
          ref: c0e9c54915970948258226e565bde6ef6d5c0b94
          path: .qa/python-genai
          sparse-checkout: |
            google/genai/_local_tokenizer_loader.py
            google/genai/version.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify input-bound blocker without importing the SDK or downloading tokenizers
        run: python3 tools/verify_gemini_input_bound.py --sdk-root .qa/python-genai > .qa/input-bound-proof.json
      - name: Build reviewable native-admission overlay without installing it
        run: python3 tools/build_gemini_admission_overlay.py --upstream .qa/awf --output .qa/gemini-overlay
      - name: Build connected offline runtime from digest-pinned AWF image
        run: docker build --file runtime/Dockerfile.offline --tag twf-budget-offline .
      - name: Test connected budget runtime with networking disabled
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec --cap-drop ALL --security-opt no-new-privileges twf-budget-offline
          docker image inspect twf-budget-offline > .qa/connected-runtime-image.json
      - name: Record conservative offline preflight without model calls
        run: |
          node - <<'JS' > .qa/connected-preflight.json
          const snapshot = require('./runtime/gemini_price_snapshot.json');
          const {loadOfflineProfile} = require('./runtime/gemini_offline_gateway.cjs');
          const {inspectRequestBudget} = require('./runtime/gemini_request_budget.cjs');
          const inputProof = require('./.qa/input-bound-proof.json');
          const simulationTime = snapshot.reviewed_on + 'T12:00:00Z';
          const p = loadOfflineProfile(snapshot, new Date(simulationTime));
          console.log(JSON.stringify({mode:'OFFLINE_ONLY', simulationTime, model:snapshot.model,
            maximumModelReservationNanocredits:String(p.maximumReservationNanos), capNanocredits:'10000000000',
            requests:[1,512,2048].map(n => inspectRequestBudget(snapshot,n,10000000000n,new Date(simulationTime))),
            inputProofStatus:inputProof.status, sdkVersion:inputProof.sdk_version,
            admissionGranted:false, providerCalls:0, liveAuthorized:false}, null, 2));
          JS
      - name: Install native Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Lua parse of game modules (not Luau engine verification)
        run: |
          for file in src/*.lua; do
            lua5.4 -e "assert(loadfile([[$file]]))"
          done
      - name: Original gameplay regression and 4,000 stress cases
        run: lua5.4 -e 'BALANCE_FILE="src/ToyWarsBalance.lua"; dofile("tests/balance_spec.lua"); print(RESULT_SUMMARY)'
      - name: Assemble Studio one-click installer from four canonical files
        run: python3 tools/build_installer.py
      - name: Verify installer embeds exact source and hashes
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('.')
          manifest=json.loads((root/'evidence/SOURCE_MANIFEST.json').read_text())
          ins=(root/'studio/TOY_WARS_v1_2_ONE_CLICK_INSTALLER.lua').read_text()
          assert manifest['installer_sha256']==hashlib.sha256(ins.encode()).hexdigest()
          for key,path in {'balance':'ToyWarsBalance.lua','server':'ToyWarsServer.server.lua','hud':'ToyWarsHUD.client.lua','smoke':'ToyWarsSmokeTest.server.lua'}.items():
              code=(root/'src'/path).read_text()
              assert code in ins, f'Missing embedded {key}'
              assert manifest[key]==hashlib.sha256(code.encode()).hexdigest(), f'Changed source {key}'
          print('PASS: all four source modules exactly embedded in reproducible installer')
          PY
      - name: Independent state and character quality gate
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v
          python3 tools/repository_gate.py
      - name: Generate deterministic chat handoff twice and compare results
        run: |
          python3 tools/build_handoff.py
          sha256sum status/CHAT_HANDOFF.md status/LATEST_STATE.json > /tmp/handoff.hash
          python3 tools/build_handoff.py
          sha256sum -c /tmp/handoff.hash
      - name: Report genuine scope
        if: always()
        run: |
          echo "### Toy Wars QA scope" >> "$GITHUB_STEP_SUMMARY"
          echo "Lua 5.4 parser, 37 native regression assertions + 4000 stress cases, exact Studio installer build, character/policy validation. No actual Roblox engine, visuals, multiplayer or mobile test." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve release candidate (not Roblox-verified)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toy-wars-v1-2-offline-installer
          path: |
            studio/TOY_WARS_v1_2_ONE_CLICK_INSTALLER.lua
            evidence/SOURCE_MANIFEST.json
          retention-days: 30
      - name: Preserve reviewed runtime overlay candidate (not deployed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twf-gemini-admission-overlay-not-deployed
          path: .qa/gemini-overlay/
          retention-days: 30
      - name: Preserve connected offline runtime evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twf-connected-offline-runtime-evidence
          path: |
            .qa/connected-runtime-image.json
            .qa/connected-preflight.json
            .qa/input-bound-proof.json
          retention-days: 30
