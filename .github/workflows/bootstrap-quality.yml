name: Toy Wars bootstrap offline QA
on:
  push:
    branches: ["bootstrap/**", "main"]
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "tools/**"
      - ".github/workflows/bootstrap-quality.yml"
      - "PROJECT_STATE.json"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "twf-offline-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Run original gameplay rules regression and fuzz
        run: lua5.4 -e 'BALANCE_FILE="src/ToyWarsBalance.lua"; dofile("tests/balance_spec.lua"); print(RESULT_SUMMARY)'
      - name: Run independent state and character policy checks
        run: python3 tools/repository_gate.py
      - name: Report genuine scope of testing
        if: always()
        run: |
          echo "### Toy Wars QA scope" >> "$GITHUB_STEP_SUMMARY"
          echo "Lua 5.4 balance calculations + policy metadata only; **NO Roblox engine, mobile, multiplayer, animations or visual validation.**" >> "$GITHUB_STEP_SUMMARY"
