name: Toy Wars trusted coordinator claim
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: "twf-coordinator-${{ github.event.pull_request.number }}"
  cancel-in-progress: true
jobs:
  trusted_claim:
    if: startsWith(github.event.pull_request.head.ref, 'auto/twf-game-repair') || startsWith(github.event.pull_request.head.ref, 'auto/twf-system-review-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout ONLY trusted target-main source, never PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate PR data using BASE Python, with scoped read-token fetch
        env:
          GH_TOKEN: ${{ github.token }}
          TWF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TWF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TWF_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TWF_PR_NUMBER: ${{ github.event.pull_request.number }}
          TWF_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TWF_BASE_REPO: ${{ github.repository }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          test "$TWF_HEAD_REPO" = "$TWF_BASE_REPO"
          [[ "$TWF_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TWF_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TWF_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          if [[ "$TWF_HEAD_REF" != auto/twf-game-repair* && "$TWF_HEAD_REF" != auto/twf-system-review-* ]]; then exit 1; fi
          basic="$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" fetch --no-tags origin "refs/pull/${TWF_PR_NUMBER}/head:refs/remotes/origin/trusted-pr-head" refs/heads/twf-repair-coordinator:refs/remotes/origin/twf-repair-coordinator
          unset basic
          test "$(git rev-parse refs/remotes/origin/trusted-pr-head)" = "$TWF_HEAD_SHA"
          test "$(git rev-parse "$TWF_BASE_SHA")" = "$TWF_BASE_SHA"
          # The only executed Python below was checked out from target main.
          python3 tools/repair_control.py verify-pr --policy config/autonomous_repair.json --base "$TWF_BASE_SHA" --head "$TWF_HEAD_SHA" --branch "$TWF_HEAD_REF" --control-ref refs/remotes/origin/twf-repair-coordinator
