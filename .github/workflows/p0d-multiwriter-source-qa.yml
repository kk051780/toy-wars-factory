name: P0D multiwriter candidate source QA (read-only)
on:
  pull_request:
    paths:
      - 'multiwriter/**'
      - '.github/workflows/p0d-multiwriter-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 29 multiwriter safety and real local Git CAS race scenarios
        run: python -m unittest discover -s multiwriter -p 'test_*.py' -v
      - name: Verify no authorized writers configured by this candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('multiwriter/TRUSTED_REGISTRY_TEMPLATE.json').read_text())
          assert r['grants'] == [], 'unsafe: prototype cannot issue grants'
          print('Prototype only; official writer count unchanged')
          PY
