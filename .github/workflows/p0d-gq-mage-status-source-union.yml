name: P0D GQ Mage real solo-roster x latest 29-source union Native
on:
  push:
    branches: [quality/gq-mage-heal-wall-fence-20261116]
    paths:
      - 'quality_gameplay/v3_mage_heal_los_20261116/**'
      - '.github/workflows/p0d-gq-mage-status-source-union.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-solo-roster-x-existing-combat-union:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout this unique #510 quality lane
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only checkout original #482 author
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _gq_original
          persist-credentials: false
      - name: Read-only checkout original #516 status and existing cross-author composer
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 8f0275692c54874f823d66748d470fb849607df5
          path: _gq_status_owner
          persist-credentials: false
      - name: Compose EXACT one existing Combat with #510 MAGE plus #516 status
        run: |
          set -euo pipefail
          test "$(git -C _gq_original rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _gq_status_owner rev-parse HEAD)" = 8f0275692c54874f823d66748d470fb849607df5
          mkdir -p artifacts
          python3 _gq_status_owner/quality_gameplay/v3_status_tick_fence_20261116/tools/compose_with_mage_author.py \
            --mage-builder quality_gameplay/v3_mage_heal_los_20261116/build_candidate.py \
            --out artifacts/GQ_510_516_EXACT_COMBAT_UNION.luau
          python3 quality_gameplay/v3_mage_heal_los_20261116/verify_combined_author_game.py \
            --combat artifacts/GQ_510_516_EXACT_COMBAT_UNION.luau \
            --author _gq_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116 \
            --status _gq_status_owner/quality_gameplay/v3_status_tick_fence_20261116 \
            --out artifacts/gq_union_vm
      - name: Checkout pinned upstream Luau native CLI
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq_native_luau
          persist-credentials: false
      - name: Compile real source and execute original TEAM/BR MAGE x delayed DOT
        run: |
          set -euo pipefail
          test "$(git -C _gq_native_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _gq_native_luau -B /tmp/gq_mage_union_luau -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_mage_union_luau --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          /tmp/gq_mage_union_luau/luau-compile --text artifacts/GQ_510_516_EXACT_COMBAT_UNION.luau >/dev/null
          /tmp/gq_mage_union_luau/luau-compile --text artifacts/gq_union_vm/original.luau >/dev/null
          /tmp/gq_mage_union_luau/luau-compile --text artifacts/gq_union_vm/combined.luau >/dev/null
          (cd artifacts/gq_union_vm && /tmp/gq_mage_union_luau/luau ./original.luau) | tee /tmp/gq_union_orig.log
          (cd artifacts/gq_union_vm && /tmp/gq_mage_union_luau/luau ./combined.luau) | tee /tmp/gq_union_combined.log
          grep -q MAGE_ORIGINAL_1H15AI_TEAM_BR_GAMEPLAY_NATIVE_CASES_PASS /tmp/gq_union_combined.log
          grep -q MAGE_HEAL_LOS_NATIVE_VM_CASES_PASS /tmp/gq_union_combined.log
          grep -q ORIGINAL_BUG_REPRODUCED /tmp/gq_union_orig.log
          for bad in artifacts/gq_union_vm/mutant_enemy.luau artifacts/gq_union_vm/mutant_wall.luau; do
            /tmp/gq_mage_union_luau/luau-compile --text "$bad" >/dev/null
            if (cd artifacts/gq_union_vm && /tmp/gq_mage_union_luau/luau "./$(basename "$bad")") >/tmp/gq_union_mutant.log 2>&1; then
              echo "RED: dangerous hostile-bot/wall-heal mutation was not detected: $bad"
              exit 1
            fi
          done
          /tmp/gq_mage_union_luau/luau-compile --text artifacts/gq_union_vm/status.luau >/dev/null
          (cd artifacts/gq_union_vm && /tmp/gq_mage_union_luau/luau ./status.luau) | tee /tmp/gq_union_status.log
          grep -q GQ_V3_ACTUAL_SERVER_STATUS_CALLBACK_NATIVE_18_SCENARIOS_PASS /tmp/gq_union_status.log
          echo GQ_510_516_ACTUAL_ORIGINAL_ROSTER_AND_STATUS_MUTANTS_PASS
      - name: Publish source QA receipts only (NO official RC or Place)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GQ-510-516-SOURCE-FIDELITY-NOT-RC
          path: |
            artifacts/gq_union_vm/RECEIPT.json
          retention-days: 3
