name: P0D H1 private 28+2 read-only observer Studio Place QA
on:
  push:
    branches:
      - qa/p0d-h1-fourway-readonly-studio-place-20261113-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-private-h1-observation:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      TEST_ROOT: handoffs/P0D-H1-STUDIO-READONLY-PROBE-20261113-01
    steps:
      - name: Checkout read-only observer integration source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Rebuild original complete 28-source H1 and add exact 2 Studio-only observers
        shell: bash
        run: |
          set -euo pipefail
          python3 "$TEST_ROOT/tools/build_qa_only.py" --assemble
      - name: Download pinned Rojo 7.7.1 with exact zip checksum
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_probe_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_probe_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,stat
          with zipfile.ZipFile('/tmp/p0d_probe_rojo.zip') as z:
              b=[p for p in z.namelist() if p.rsplit('/',1)[-1]=='rojo']
              assert len(b)==1
              f=Path('/tmp/p0d_probe_rojo'); f.write_bytes(z.read(b[0]))
              f.chmod(f.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_probe_rojo --version | grep -F 7.7.1
      - name: Build one actual unpublished H1 30-Luau Roblox Studio-only Place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_h1_probe_out
          /tmp/p0d_probe_rojo build "$TEST_ROOT/dist/H1_QA_ONLY_UNPUBLISHED/default.project.json" -o /tmp/p0d_h1_probe_out/TRAP_RAIDERS_H1_QA_ONLY_DO_NOT_PUBLISH.rbxlx
          test -s /tmp/p0d_h1_probe_out/TRAP_RAIDERS_H1_QA_ONLY_DO_NOT_PUBLISH.rbxlx
      - name: Verify genuine Rojo XML full exact original 28 plus 2 exact observers
        shell: bash
        run: |
          set -euo pipefail
          python3 "$TEST_ROOT/tools/build_qa_only.py" --verify-xml /tmp/p0d_h1_probe_out/TRAP_RAIDERS_H1_QA_ONLY_DO_NOT_PUBLISH.rbxlx --receipt /tmp/p0d_h1_probe_out/H1_QA_ONLY_SOURCES_AND_FILE_RECEIPT.json
      - name: Native compile all 30 real Luau scripts from the full H1 QA clone
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/p0d_h1_luau
          git -C /tmp/p0d_h1_luau fetch --depth 1 origin f46d879e28302a430029304f7f6a162aed66f103
          git -C /tmp/p0d_h1_luau checkout --detach FETCH_HEAD
          test "$(git -C /tmp/p0d_h1_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S /tmp/p0d_h1_luau -B /tmp/p0d_h1_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_h1_native --target Luau.Compile.CLI --parallel 4
          number=0
          while IFS= read -r -d '' file; do
            /tmp/p0d_h1_native/luau-compile "$file" >/dev/null
            number=$((number+1))
          done < <(find "$TEST_ROOT/dist/H1_QA_ONLY_UNPUBLISHED/src" -name '*.luau' -print0)
          test "$number" -eq 30
          echo 'H1_QA_ONLY_30_OF_30_NATIVE_COMPILE_PASS_STUDIO_NOT_TESTED'
      - name: Archive ONLY owner private QA-only 30-Luau Place (NEVER publish)
        uses: actions/upload-artifact@v4
        with:
          name: P0D-H1-QA-ONLY-30-LUAU-READONLY-STUDIO-OBSERVERS
          path: |
            /tmp/p0d_h1_probe_out/TRAP_RAIDERS_H1_QA_ONLY_DO_NOT_PUBLISH.rbxlx
            /tmp/p0d_h1_probe_out/H1_QA_ONLY_SOURCES_AND_FILE_RECEIPT.json
          if-no-files-found: error
          retention-days: 7
