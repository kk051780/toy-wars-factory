name: P0D S1 native game authority rules gate
on:
  push:
    branches:
      - handoff/p0d-s1-authority-abuse-gate-20261112-01
    paths:
      - 'handoffs/P0D-S1-AUTHORITY-ABUSE-SOURCE-GATE-20261112-01/**'
      - '.github/workflows/p0d-s1-native-authority-rules-20261112.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-rules-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch immutable actual S1 source
        shell: bash
        run: |
          set -euo pipefail
          SHA=b103389e2089f9ff5a08984fe2f8f6f02aa8b1bc
          git cat-file -e "$SHA^{commit}" || git fetch --no-tags --depth=1 origin "$SHA"
      - name: Verify Python source syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile handoffs/P0D-S1-AUTHORITY-ABUSE-SOURCE-GATE-20261112-01/native_rules_gate.py
      - name: Build official commit-pinned Luau
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/luau-lang/luau.git /tmp/p0d-official-luau
          git -C /tmp/p0d-official-luau checkout --quiet --detach f46d879e28302a430029304f7f6a162aed66f103
          test "$(git -C /tmp/p0d-official-luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S /tmp/p0d-official-luau -B /tmp/p0d-official-luau/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_CLI=ON -DLUAU_BUILD_TESTS=OFF
          cmake --build /tmp/p0d-official-luau/build --target Luau.Repl.CLI --parallel 4
          test -x /tmp/p0d-official-luau/build/luau
      - name: Execute real S1Rules and reject five weakened mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 handoffs/P0D-S1-AUTHORITY-ABUSE-SOURCE-GATE-20261112-01/native_rules_gate.py --repo . --luau /tmp/p0d-official-luau/build/luau
