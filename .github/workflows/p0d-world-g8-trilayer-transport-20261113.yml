name: P0D G8 three-level harbor sea sky real Studio source CI
on:
  push:
    branches:
      - feature/p0d-world-g8-trilayer-transport-20261113-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-private:
    if: github.repository == 'kk051780/toy-wars-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      G8: handoffs/P0D-WORLD-G8-TRILAYER-TRANSPORT-20261113-01
    steps:
      - name: Checkout full immutable source for provenance
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: G8 SHA-locked 3-level, five secure link source QA and negative mutations
        shell: bash
        run: |
          set -euo pipefail
          cd "$G8"
          python3 tools/verify_g8.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download pinned Rojo 7.7.1 official standalone source builder
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/g8_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/g8_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          import stat,zipfile
          with zipfile.ZipFile("/tmp/g8_rojo.zip") as z:
              q=[x for x in z.namelist() if x.rsplit("/",1)[-1]=="rojo"]
              assert len(q)==1
              path=Path("/tmp/g8_rojo")
              path.write_bytes(z.read(q[0]))
              path.chmod(path.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/g8_rojo --version | grep -F 7.7.1
      - name: Build genuine unpublished Roblox G8 three-floor studio trial Place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g8_out
          /tmp/g8_rojo build "$G8/default.project.json" -o /tmp/g8_out/WORLD_G8_3LEVEL_PORT_SEA_SKY_TRAVEL_STUDIO_ONLY.rbxlx
          test -s /tmp/g8_out/WORLD_G8_3LEVEL_PORT_SEA_SKY_TRAVEL_STUDIO_ONLY.rbxlx
      - name: Verify exact two source scripts embedded in genuine Roblox Place XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,hashlib,json,os,pathlib,xml.etree.ElementTree as ET
          source=pathlib.Path(os.environ["G8"])
          place=pathlib.Path("/tmp/g8_out/WORLD_G8_3LEVEL_PORT_SEA_SKY_TRAVEL_STUDIO_ONLY.rbxlx")
          root=ET.fromstring(place.read_bytes())
          scripts=[];types=collections.Counter()
          for item in root.iter("Item"):
              k=item.attrib.get("class")
              if k not in ("Script","ModuleScript","LocalScript"):continue
              src=item.find("./Properties/string[@name='Source']")
              if src is not None:
                  scripts.append(src.text or "")
                  types[k]+=1
          expected=[p.read_text(encoding="utf8") for p in sorted((source/"src").rglob("*.luau"))]
          assert len(expected)==2 and collections.Counter(expected)==collections.Counter(scripts),(len(expected),len(scripts))
          assert types=={"Script":1,"ModuleScript":1},types
          receipt={"stage":"STUDIO_SOURCE_PRIVATE_NOT_H1_RC","world_ids":["WF-16","WF-17","WF-18"],
             "source_sha":os.environ.get("GITHUB_SHA"),"actual_2_2_script_bytes":True,
             "source_real_server_trips":5,"trip_graph":"PORT-SEA-SKY-PORT plus reverse",
             "studio_play":"NOT_TESTED","physical_2client":"NOT_TESTED","phone":"NOT_TESTED",
             "h1_egg_game_integrated":False,"official_rc_adopted":False,"published":False,
             "place_bytes":place.stat().st_size,"place_sha256":hashlib.sha256(place.read_bytes()).hexdigest()}
          pathlib.Path("/tmp/g8_out/G8_PRIVATE_BUILD_RECEIPT.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          print("P0D_G8_GENUINE_REAL_ROJO_2_OF_2_BYTE_EXACT",dict(types))
          PY
      - name: Build pinned actual native Luau and execute shipped safe trip policy
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/g8_luau
          git -C /tmp/g8_luau fetch --depth 1 origin f46d879e28302a430029304f7f6a162aed66f103
          git -C /tmp/g8_luau checkout --detach FETCH_HEAD
          test "$(git -C /tmp/g8_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S /tmp/g8_luau -B /tmp/g8_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/g8_native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          count=0
          while IFS= read -r -d '' file; do
            /tmp/g8_native/luau-compile "$file" >/dev/null
            count=$((count+1))
          done < <(find "$G8/src" -name '*.luau' -print0)
          test "$count" -eq 2
          cd "$G8"
          /tmp/g8_native/luau tests/travel_native.luau
          echo "P0D_G8_ACTUAL_NATIVE_SOURCE_TWO_COMPILES_TRAVEL_POLICY_PASS"
      - name: Upload genuine private Studio demo and immutable build receipt
        uses: actions/upload-artifact@v4
        with:
          name: P0D-WORLD-G8-3LEVEL-PORT-SEA-SKY-PRIVATE-STUDIO
          path: |
            /tmp/g8_out/WORLD_G8_3LEVEL_PORT_SEA_SKY_TRAVEL_STUDIO_ONLY.rbxlx
            /tmp/g8_out/G8_PRIVATE_BUILD_RECEIPT.json
          if-no-files-found: error
          retention-days: 7
