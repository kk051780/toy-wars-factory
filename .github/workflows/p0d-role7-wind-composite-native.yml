name: P0D quality original-author role7 + adaptive wind actual source/native CI
on:
  push:
    branches: [feature/p0d-product-quality-gate-20261115]
    paths:
      - product_quality/role7_wind_composite.py
      - .github/workflows/p0d-role7-wind-composite-native.yml
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - product_quality/role7_wind_composite.py
      - .github/workflows/p0d-role7-wind-composite-native.yml
permissions:
  contents: read
  actions: read
jobs:
  actual-source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download PINNED existing original #297 author build (no source reauthoring)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_wind_author
          gh run download 43686957256 -R kk051780/toy-wars-factory \
            -n P0D-ROLE7-RC82-READY-ORIGINAL-AUTHOR-PATCH-NO-GO \
            -D /tmp/p0d_wind_author
          test -s /tmp/p0d_wind_author/P0D_RC82_ROLE7_READY_PRIVATE_SOURCE_PATCH.zip
          (cd /tmp/p0d_wind_author && zip -q /tmp/p0d_role7_original_author_stage.zip ./*)
      - name: Reproduce 82 real original-author sources plus only adaptive wind
        shell: bash
        run: |
          set -euo pipefail
          python3 -B product_quality/role7_wind_composite.py \
            --author-outer /tmp/p0d_role7_original_author_stage.zip \
            --out /tmp/P0D_RC82_ROLE7_WIND_COMPOSITE_UNPUBLISHED.zip \
            --extract /tmp/p0d_real_role7_wind_luau
          python3 - <<'PY'
          import sys,zipfile,json
          sys.path.insert(0,"product_quality")
          import role7_wind_composite as c
          with zipfile.ZipFile("/tmp/p0d_role7_original_author_stage.zip") as z:
              b=z.read("P0D_RC82_ROLE7_READY_PRIVATE_SOURCE_PATCH.zip")
          with zipfile.ZipFile("/tmp/P0D_RC82_ROLE7_WIND_COMPOSITE_UNPUBLISHED.zip") as z:
              r=json.loads(z.read("RECEIPT.json"))
              assert r["scripts"]==82 and r["unchanged_author"]==80
              assert r["official_rc_write"] is False and r["decision"]=="PRODUCT_NO_GO"
              assert len(z.read("COMPOSED_ROLE7_WIND_RC82.rbxlx"))==777023
          # Mutants must never be mistaken for the pinned original author stage.
          try:c.compose(b"not a zip")
          except (ValueError,zipfile.BadZipFile):pass
          else:raise AssertionError("BROKEN_SOURCE_ACCEPTED")
          print("REAL_SOURCE_LOCK_COMPOSITE_AND_CORRUPT_INPUT_REJECT_PASS")
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_role7_wind_luau
          persist-credentials: false
      - name: Native pinned Luau compiler for all 82 ACTUAL composed source scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_role7_wind_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_role7_wind_luau -B /tmp/p0d_role7_wind_luau_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_role7_wind_luau_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' f; do
            /tmp/p0d_role7_wind_luau_build/luau-compile "$f" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_real_role7_wind_luau -name '*.luau' -type f -print0 | sort -z)
          test "$n" -eq 82
          echo "NATIVE_LUAU_82_OF_82_COMPOSITE_COMPILE_PASS"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-QUALITY-REAL-RC82-ROLE7-READY-WIND-COMPOSITE-NO-GO
          path: /tmp/P0D_RC82_ROLE7_WIND_COMPOSITE_UNPUBLISHED.zip
          retention-days: 7
