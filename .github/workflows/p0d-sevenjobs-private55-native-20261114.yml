name: P0D SevenJobs private58 native/Rojo after official SCOUT SPECIES (NOT official RC)
on:
  push:
    branches:
      - feature/p0d-rc-seven-jobs-pve-v1-20261114-01
    paths:
      - 'handoffs/P0D-RC-SEVEN-JOBS-PVE-V1-20261114-01/**'
      - '.github/workflows/p0d-sevenjobs-private55-native-20261114.yml'
permissions:
  contents: read
jobs:
  native-private-place:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 79123d35cd7afdd5f4f9941675bc2d2cf382ac4e
          path: _p0d_pinned_source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 34d6d384d04ba1d4a394331a3e5c74f798e57a22
          path: _p0d_current55
          persist-credentials: false
      - name: Rebuild exact author H1 rich51, then current official RC57 overlays
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-RC-SEVEN-JOBS-PVE-V1-20261114-01
          DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
          python3 -B _p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/tools/assemble.py --assemble
          python3 -B _p0d_current55/rc_fastlane/apply_overlays.py --dist "$DIST" --profile rich51
          python3 -B _p0d_current55/rc_fastlane/integrate.py --profile rich51 --dist "$DIST"
          python3 -B _p0d_current55/rc_fastlane/apply_sixskill_durable.py --profile rich51 --dist "$DIST"
          python3 -B _p0d_current55/rc_fastlane/apply_saved_pve.py --profile rich51 --dist "$DIST"
          python3 -B _p0d_current55/rc_fastlane/apply_saved_beast.py --profile rich51 --dist "$DIST"
          python3 -B _p0d_current55/rc_fastlane/apply_scout_species.py --profile rich51 --dist "$DIST"
          python3 -B "$ROOT/tools/apply_seven_jobs.py" --dist "$DIST"
          test "$(find "$DIST/src" -name '*.luau' -type f | wc -l)" -eq 58
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_job_luau
          persist-credentials: false
      - name: Build actual pinned native Luau compiler and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_job_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_job_luau -B /tmp/p0d_job_luau_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_job_luau_build --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
      - name: Actual native compile all 55 and pure server policy 33 cases
        shell: bash
        run: |
          set -euo pipefail
          ROOT=handoffs/P0D-RC-SEVEN-JOBS-PVE-V1-20261114-01
          DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
          n=0
          while IFS= read -r -d '' file; do
            /tmp/p0d_job_luau_build/luau-compile "$file" >/tmp/p0d_job_compile.out 2>&1 || { cat /tmp/p0d_job_compile.out; exit 1; }
            n=$((n+1))
          done < <(find "$DIST/src" -name '*.luau' -type f -print0)
          test "$n" -eq 58
          echo P0D_SEVEN_JOBS_REAL_NATIVE_LUAU_58_OF_58_PASS
          python3 - <<'PY'
          from pathlib import Path
          root=Path('handoffs/P0D-RC-SEVEN-JOBS-PVE-V1-20261114-01')
          src=(root/'src/SevenJobsRules.luau').read_text('utf8')
          qa=(root/'tests/SevenJobsNative.luau').read_text('utf8')
          Path('/tmp/P0D_SEVEN_JOBS_NATIVE_QA.luau').write_text(
            'local R=(function()\n'+src+'\nend)()\n'+qa,'utf8')
          PY
          /tmp/p0d_job_luau_build/luau-compile /tmp/P0D_SEVEN_JOBS_NATIVE_QA.luau > /dev/null
          /tmp/p0d_job_luau_build/luau /tmp/P0D_SEVEN_JOBS_NATIVE_QA.luau | tee /tmp/p0d_job_native.out
          grep -F P0D_SEVEN_JOBS_NATIVE_33_OF_33_POLICY_ASSERTIONS_PASS /tmp/p0d_job_native.out
      - name: Download source-pinned Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_jobs_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_jobs_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,stat
          with zipfile.ZipFile('/tmp/p0d_jobs_rojo.zip') as z:
            keys=[k for k in z.namelist() if k.rsplit('/',1)[-1]=='rojo']
            assert len(keys)==1
            x=Path('/tmp/p0d_jobs_rojo');x.write_bytes(z.read(keys[0]))
            x.chmod(x.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
      - name: Genuine 55-source private .rbxlx and authority-proof receipt
        shell: bash
        run: |
          set -euo pipefail
          DIST=_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE
          mkdir -p /tmp/p0d_jobs_out
          /tmp/p0d_jobs_rojo build "$DIST/default.project.json" -o /tmp/p0d_jobs_out/P0D_SEVEN_JOBS_PVE_PRIVATE58.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          from collections import Counter
          import hashlib,json
          base=Path('_p0d_pinned_source/handoffs/P0D-RC-H1-RESULT47-WAYPOINT-V4-SESSION-20261114-01/dist/P0D_RICH47_WAYPOINT_V4_6SKILL_SESSION_PRIVATE')
          place=Path('/tmp/p0d_jobs_out/P0D_SEVEN_JOBS_PVE_PRIVATE55.rbxlx')
          expected=Counter(p.read_text('utf8') for p in (base/'src').rglob('*.luau'))
          actual=Counter()
          names=Counter()
          for el in E.fromstring(place.read_bytes()).iter('Item'):
            kind=el.get('class')
            if kind not in ('Script','LocalScript','ModuleScript'):continue
            source=el.find("./Properties/string[@name='Source']")
            if source is None:continue
            actual[source.text or '']+=1
            name=el.find("./Properties/string[@name='Name']")
            if name is not None:names[(kind,name.text)]+=1
          assert actual==expected and sum(actual.values())==58,(len(actual),len(expected))
          assert names[('Script','Game')]==1
          assert names[('ModuleScript','PersistentHatchStore')]==1
          assert names[('ModuleScript','SevenJobsRules')]==1\n          assert names[('ModuleScript','SavedPveMasteryPolicy')]==1
          assert names[('ModuleScript','SavedBeastEvolutionPolicy')]==1
          assert names[('ModuleScript','ScoutSpeciesPolicy')]==1
          assert names[('Script','RealmHunt')]==1
          assert names[('LocalScript','V4TrialOverlay')]==1
          receipt=json.loads((base/'P0D_SEVEN_JOBS_RECEIPT.json').read_text('utf8'))
          receipt['place_sha256']=hashlib.sha256(place.read_bytes()).hexdigest()
          receipt['real_native_luau']='58_OF_58_PASS'
          receipt['native_policy']='33_OF_33_PASS'
          receipt['real_rojo_exact']='58_OF_58_PASS'
          receipt['official_rc_adopted']=False
          receipt['actual_studio_engine']='NOT_TESTED'
          Path('/tmp/p0d_jobs_out/PRIVATE55_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('P0D_SEVEN_JOBS_REAL_ROJO_EXACT_58_OF_58_PASS',receipt['place_sha256'])
          PY
          cp /tmp/p0d_job_native.out /tmp/p0d_jobs_out/NATIVE_POLICY_RESULT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: P0D-SEVEN-JOBS-PVE-PRIVATE58-UNSELECTED
          path: /tmp/p0d_jobs_out/*
          retention-days: 7
          if-no-files-found: error
