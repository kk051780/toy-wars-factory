name: P0D exclusive claim / duplicate-work preflight (read-only)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Target PR number"
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  unique-work-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout trusted official RC, never untrusted PR code
        uses: actions/checkout@v4
        with:
          ref: rc/p0d-s1-kids-rc01
          persist-credentials: false
      - name: Verify claim gate negative and positive tests
        run: python3 -m unittest discover -s tests -p test_p0d_work_claim_guard.py -v
      - name: Read trusted registry / live PR / current official ref and block collisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P0D_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, re, sys, urllib.parse, urllib.request
          from datetime import datetime, timezone
          sys.path.insert(0, "tools")
          from p0d_work_claim_guard import check
          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "kk051780/toy-wars-factory":
              raise SystemExit("WRONG_REPOSITORY")
          raw_pr = os.environ.get("P0D_PR", "")
          if not re.fullmatch(r"[1-9][0-9]{0,7}", raw_pr):
              raise SystemExit("INVALID_PR_NUMBER")
          pr_number = int(raw_pr)
          token = os.environ.get("GITHUB_TOKEN", "")
          if not token:
              raise SystemExit("NO_READ_TOKEN")
          def get(path):
              req = urllib.request.Request("https://api.github.com" + path, headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "p0d-claim-gate-readonly",
                  "Authorization": "Bearer " + token,
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          official = get(f"/repos/{repo}/git/ref/heads/rc/p0d-s1-kids-rc01")["object"]["sha"]
          pr = get(f"/repos/{repo}/pulls/{pr_number}")
          if pr["base"]["ref"] != "rc/p0d-s1-kids-rc01":
              raise SystemExit("WRONG_BASE_BRANCH")
          if pr["state"] != "open":
              raise SystemExit("PR_NOT_OPEN")
          if pr["head"]["repo"]["full_name"] != repo:
              raise SystemExit("EXTERNAL_HEAD_UNTRUSTED")
          body = pr.get("body") or ""
          if len([x for x in body.splitlines() if x.strip() == "P0D_CLAIM_V1"]) != 1:
              raise SystemExit("CLAIM_MANIFEST_MISSING_OR_DUPLICATE")
          keys = ["CLAIM_ID", "CLAIM_OWNER", "CLAIM_FEATURE_ID", "CLAIM_RESOURCES", "CLAIM_BASE_RC"]
          fields = {}
          for key in keys:
              found = re.findall(r"^" + key + r":\s*(\S.*)$", body, re.M)
              if len(found) != 1:
                  raise SystemExit("CLAIM_FIELD_MISSING_OR_DUPLICATE_" + key)
              fields[key] = found[0].strip()
          files = []
          for page in range(1, 21):
              data = get(f"/repos/{repo}/pulls/{pr_number}/files?per_page=100&page={page}")
              files.extend(x["filename"] for x in data)
              if len(data) < 100:
                  break
          if len(files) >= 2000:
              raise SystemExit("TOO_MANY_FILES_TO_VERIFY")
          loc = urllib.parse.quote("coord/p0d-work-claims", safe="")
          blob = get(f"/repos/{repo}/contents/rc_fastlane/P0D_WORK_CLAIMS.json?ref={loc}")
          if blob.get("encoding") != "base64" or not blob.get("sha"):
              raise SystemExit("UNVERIFIED_REGISTRY_BLOB")
          registry = json.loads(base64.b64decode(blob["content"]))
          candidate = {
              "claim_id": fields["CLAIM_ID"],
              "owner": fields["CLAIM_OWNER"],
              "feature_id": fields["CLAIM_FEATURE_ID"],
              "resources": [x.strip() for x in fields["CLAIM_RESOURCES"].split(",")],
              "base_rc": fields["CLAIM_BASE_RC"],
              "source_head": pr["head"]["sha"],
          }
          result = check(registry, candidate, files, official, datetime.now(timezone.utc))
          print("P0D_CLAIM_PASS_SNAPSHOT", "registry_blob=" + blob["sha"],
                "source_head=" + result["source_head"], "official=" + result["official_head"],
                "claim=" + result["claim_id"], "changed_files=" + str(result["changed_files"]))
          print("NOTE: claim scope != source QA, official RC adoption or human Studio/ART/MOBILE/FUN")
          PY
