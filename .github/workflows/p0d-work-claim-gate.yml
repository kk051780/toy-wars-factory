name: P0D claim collision observation (read-only, non-gating)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR to inspect'
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted official RC source only
        uses: actions/checkout@v4
        with:
          ref: rc/p0d-s1-kids-rc01
          persist-credentials: false
      - name: Run canonical claim guard regression tests (not a writer grant)
        run: python3 -m unittest discover -s tests -p test_p0d_work_claim_guard.py -v
  claim-audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, 'P0D_CLAIM_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted official RC source only
        uses: actions/checkout@v4
        with:
          ref: rc/p0d-s1-kids-rc01
          persist-credentials: false
      - name: Read-only scope observation, never grant or block legacy PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P0D_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, sys, urllib.parse, urllib.request
          from datetime import datetime, timezone
          sys.path.insert(0, 'tools')
          from p0d_work_claim_guard import check
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          number = os.environ.get('P0D_PR', '')
          out = {'schema':'P0D_CLAIM_OBSERVATION_V2', 'enforced':False,
                 'grant_issued':False, 'writer_authorized':False, 'status':'HOLD_UNVERIFIED'}
          def get(path):
              request = urllib.request.Request('https://api.github.com'+path,headers={
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'p0d-claim-observer-readonly',
                  'Authorization':'Bearer '+os.environ['GITHUB_TOKEN']})
              with urllib.request.urlopen(request, timeout=12) as response:
                  return json.load(response)
          try:
              if repo != 'kk051780/toy-wars-factory' or not re.fullmatch(r'[1-9][0-9]{0,7}',number):
                  raise ValueError('INVALID_REPOSITORY_OR_PR')
              pr = get(f'/repos/{repo}/pulls/{int(number)}')
              official = get(f'/repos/{repo}/git/ref/heads/rc/p0d-s1-kids-rc01')['object']['sha']
              body = pr.get('body') or ''
              if pr['state'] != 'open' or pr['base']['ref'] != 'rc/p0d-s1-kids-rc01':
                  raise ValueError('NOT_OPEN_RC_CANDIDATE')
              if pr['head']['repo']['full_name'] != repo:
                  raise ValueError('UNTRUSTED_HEAD_REPOSITORY')
              if len(re.findall(r'^P0D_CLAIM_V1\s*$', body, re.M)) != 1:
                  raise ValueError('NO_UNIQUE_CLAIM_MANIFEST')
              fields = {}
              for key in ('CLAIM_ID','CLAIM_OWNER','CLAIM_FEATURE_ID','CLAIM_RESOURCES','CLAIM_BASE_RC'):
                  matches = re.findall(r'^'+key+r':\s*(\S.*)$', body, re.M)
                  if len(matches) != 1: raise ValueError('INVALID_FIELD_'+key)
                  fields[key] = matches[0].strip()
              files = []
              for page in range(1,21):
                  rows = get(f'/repos/{repo}/pulls/{int(number)}/files?per_page=100&page={page}')
                  files.extend(row['filename'] for row in rows)
                  if len(rows) < 100: break
              if len(files) >= 2000: raise ValueError('FILE_LIST_TOO_LARGE')
              coordinator = get(f'/repos/{repo}/branches/coord%2Fp0d-work-claims')
              if coordinator.get('protected') is not True:
                  raise ValueError('COORDINATION_BRANCH_NOT_PROTECTED')
              ref = urllib.parse.quote('coord/p0d-work-claims',safe='')
              blob = get(f'/repos/{repo}/contents/rc_fastlane/P0D_WORK_CLAIMS.json?ref={ref}')
              if blob.get('encoding') != 'base64' or not re.fullmatch(r'[a-f0-9]{40}',blob.get('sha','')):
                  raise ValueError('UNVERIFIABLE_CLAIM_REGISTRY')
              registry = json.loads(base64.b64decode(blob['content'],validate=False))
              cand = {'claim_id':fields['CLAIM_ID'],'owner':fields['CLAIM_OWNER'],
                      'feature_id':fields['CLAIM_FEATURE_ID'],
                      'resources':[v.strip() for v in fields['CLAIM_RESOURCES'].split(',')],
                      'base_rc':fields['CLAIM_BASE_RC'],'source_head':pr['head']['sha']}
              proof = check(registry,cand,files,official,datetime.now(timezone.utc))
              out.update({'status':'SCOPE_CONSISTENT_NOT_AUTHORIZED',
                          'claim_id':proof['claim_id'], 'source_head':proof['source_head'],
                          'official_head':official,'registry_blob':blob['sha']})
          except Exception as exc:
              out.update({'status':'HOLD_READ_ONLY','reason':str(exc)[:180]})
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          if out['status'].startswith('HOLD'):
              print('::warning::P0D claim scope not established; observer only, no blocked PR / no writer authorization')
          PY
