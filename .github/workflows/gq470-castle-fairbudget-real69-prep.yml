name: GQ470 Castle FairBudget REAL69 source QA (A PREP)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_fortress_fairbudget_real69_20261121/**'
      - '.github/workflows/gq470-castle-fairbudget-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-69-off:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GQ470_REAL69_BASE: /tmp/gq470-castle-base
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin and retrieve 69 selected original sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01 --jq .object.sha)" = "e80973c354f14a0d0088577f3cc1a875454f0f8f" || { echo STALE_OFFICIAL_RC; exit 1; }
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44695199140 --jq '.head_sha+" "+.conclusion')" = "e80973c354f14a0d0088577f3cc1a875454f0f8f success"
          mkdir -p "$GQ470_REAL69_BASE"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir "$GQ470_REAL69_BASE"
          python3 -B -m unittest discover -s quality_gameplay/gq470_fortress_fairbudget_real69_20261121 -p 'test_*.py' -v
          python3 -B quality_gameplay/gq470_fortress_fairbudget_real69_20261121/patch_castle_fairbudget.py --base "$GQ470_REAL69_BASE"
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native compile selected 69 and original OFF 69
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-castle-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-castle-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import pathlib,subprocess,os,sys
          sys.path.insert(0,'quality_gameplay/gq470_fortress_fairbudget_real69_20261121')
          import patch_castle_fairbudget as p
          root=pathlib.Path(os.environ['GQ470_REAL69_BASE'])
          on,off=p.selected(root),p.selected(root/'OFF69_CASTLE_BUDGET')
          assert len(on)==len(off)==69 and set(on)==set(off)
          assert [k for k in on if on[k].read_bytes()!=off[k].read_bytes()]==[p.ROUTE]
          for scripts in (on,off):
              for src in scripts.values():
                  subprocess.run(['/tmp/gq470-castle-luau/luau-compile','--text',str(src)],stdout=subprocess.DEVNULL,check=True)
          print('GQ470_CASTLE_NATIVE_69_ON_OFF_PASS')
          PY
      - name: Pinned Rojo ON OFF and source identity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/rojo77.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/rojo77.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/rojo77.zip') as z:
              p=Path('/tmp/rojo77')
              p.write_bytes(z.read([s for s in z.namelist() if s.split('/')[-1]=='rojo'][0]))
              p.chmod(0o755)
          PY
          R="$GQ470_REAL69_BASE"
          /tmp/rojo77 build "$R/EGGRUMBLE_REAL69.project.json" -o "$R/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          /tmp/rojo77 build "$R/OFF69_CASTLE_BUDGET/EGGRUMBLE_REAL69.project.json" -o "$R/OFF69_CASTLE_BUDGET/REBUILT_OFF.rbxlx"
          cmp "$R/OFF69_CASTLE_BUDGET/REBUILT_OFF.rbxlx" "$R/OFF69_CASTLE_BUDGET/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$R/EGGRUMBLE_REAL69.project.json" --place "$R/EGGRUMBLE_REAL69_PRIVATE.rbxlx" --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$R/OFF69_CASTLE_BUDGET/EGGRUMBLE_REAL69.project.json" --place "$R/OFF69_CASTLE_BUDGET/REBUILT_OFF.rbxlx" --count 69
          echo GQ470_CASTLE_ROJO_69_ON_OFF_PASS_ART_NO_GO
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-CASTLE-FAIRBUDGET-REAL69-PREP-NOT-FORMAL
          path: |
            /tmp/gq470-castle-base/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-castle-base/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-castle-base/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-castle-base/sources/**
          if-no-files-found: error
          retention-days: 7
