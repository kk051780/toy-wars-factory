name: GQ470 REAL69 neutral horde silhouettes 3-Part ART A-only gate
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_neutral_horde_shapes_real69_20261121/**'
      - '.github/workflows/gq470-neutral-horde-art-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  a-real-source-native-rojo-off69:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHOR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FORMAL_HEAD: e80973c354f14a0d0088577f3cc1a875454f0f8f
      P: quality_gameplay/gq470_neutral_horde_shapes_real69_20261121/patch_neutral_art69.py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fail closed on branch drift; source writer self-test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHOR_HEAD_SHA" || { echo WRONG_AUTHOR_HEAD; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL_HEAD" || { echo STALE_FORMAL_HEAD_NO_ADMISSION; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44695199140" --jq '.head_sha+" "+.conclusion')" = "$FORMAL_HEAD success" || { echo PINNED_REAL69_PROVENANCE_FAILED; exit 1; }
          python3 -m py_compile "$P"
          python3 -B "$P" --self-test
      - name: Download genuine formal REAL69 artifact and transform one of 69
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neutral-real69"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir "$RUNNER_TEMP/neutral-real69"
          python3 -B "$P" --base "$RUNNER_TEMP/neutral-real69" --author-head "$AUTHOR_HEAD_SHA"
          python3 - <<'PY'
          import json,os,pathlib,sys
          from hashlib import sha256
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'neutral-real69'
          off=root/'OFF69_SOURCE_EXACT'
          before=project_scan(off,'EGGRUMBLE_REAL69.project.json')
          after=project_scan(root,'EGGRUMBLE_REAL69.project.json')
          target='ServerScriptService/EGGRUMBLE_SwarmCombat'
          assert len(before)==len(after)==69 and set(before)==set(after)
          assert {k for k in before if before[k]['sha256']!=after[k]['sha256']}=={target}
          assert all(before[k]['class']==after[k]['class'] and before[k]['path']==after[k]['path'] for k in before)
          assert all(before[k]['sha256']==after[k]['sha256'] for k in before if k!=target)
          r=json.loads((root/'B220_ONE_SOURCE_NOT_FORMAL/SOURCE_SELECT_MANIFEST.json').read_text())
          assert r['author_head_sha']==os.environ['AUTHOR_HEAD_SHA']
          assert r['formal_parent_sha']==os.environ['FORMAL_HEAD']
          assert r['other_source_bytes_exact']==68 and r['added_world_parts']==0
          assert sha256((root/after[target]['path']).read_bytes()).hexdigest()==r['new_sha256']
          assert sha256((off/before[target]['path']).read_bytes()).hexdigest()==r['old_sha256']
          print('GQ470_NEUTRAL_MATTE_ONE_REAL_SCRIPT_68_UNCHANGED_3_PARTS_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native Luau strict 69 ON and 69 OFF compile
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-neutral-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-neutral-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import os,pathlib,subprocess,sys
          sys.path.insert(0,'quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120')
          from verify_nonloss import project_scan
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'neutral-real69'
          for parent in (root,root/'OFF69_SOURCE_EXACT'):
            for info in project_scan(parent,'EGGRUMBLE_REAL69.project.json').values():
              subprocess.run(['/tmp/gq470-neutral-luau/luau-compile','--text',str(parent/info['path'])],
                             check=True,stdout=subprocess.DEVNULL)
          print('GQ470_NEUTRAL_REAL69_NATIVE_ON_OFF_138_SCRIPTS_PASS')
          PY
      - name: Pinned Rojo ON and OFF Studio Place, byte-exact OFF
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-neutral-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-neutral-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq470-neutral-rojo.zip') as z:
            names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
            assert len(names)==1
            dest=Path('/tmp/gq470-neutral-rojo');dest.write_bytes(z.read(names[0]));dest.chmod(0o755)
          PY
          ROOT="$RUNNER_TEMP/neutral-real69"
          /tmp/gq470-neutral-rojo build "$ROOT/EGGRUMBLE_REAL69.project.json" -o "$ROOT/EGGRUMBLE_NEUTRAL_HORDE_CANDIDATE_PRIVATE.rbxlx"
          /tmp/gq470-neutral-rojo build "$ROOT/OFF69_SOURCE_EXACT/EGGRUMBLE_REAL69.project.json" -o "$ROOT/EGGRUMBLE_NEUTRAL_HORDE_OFF69_PRIVATE.rbxlx"
          cmp "$ROOT/EGGRUMBLE_NEUTRAL_HORDE_OFF69_PRIVATE.rbxlx" "$ROOT/OFF69_SOURCE_EXACT/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 -B quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$ROOT/EGGRUMBLE_REAL69.project.json" --place "$ROOT/EGGRUMBLE_NEUTRAL_HORDE_CANDIDATE_PRIVATE.rbxlx" --count 69
          python3 -B quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$ROOT/OFF69_SOURCE_EXACT/EGGRUMBLE_REAL69.project.json" --place "$ROOT/EGGRUMBLE_NEUTRAL_HORDE_OFF69_PRIVATE.rbxlx" --count 69
          echo GQ470_NEUTRAL_ON69_OFF69_ORIGINAL_PLACE_BYTE_EXACT_PASS
      - name: Source truth report and immutable B220 candidate packet (not formal)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'neutral-real69'
          art=root/'ART_CHECK_REPORT_NEUTRAL_HORDE.json'
          r=json.loads(art.read_text())
          place=root/'EGGRUMBLE_NEUTRAL_HORDE_CANDIDATE_PRIVATE.rbxlx'
          original=root/'OFF69_SOURCE_EXACT/EGGRUMBLE_REAL69_PRIVATE.rbxlx'
          r.update(candidate_place_bytes=place.stat().st_size,
                   candidate_place_sha256=hashlib.sha256(place.read_bytes()).hexdigest(),
                   official_original_place_bytes=original.stat().st_size,
                   source_test="NATIVE_ON_OFF69_AND_ROJO_ROLLBACK_PASS",
                   studio_solo="NOT_TESTED", android_15min="NOT_TESTED",
                   matched_camera_png="0/32",art_gate="ART_NO_GO",
                   product_gate="PRODUCT_NO_GO",formal_rc_adopted=False,
                   owner_accepted=False)
          art.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          packet=root/'B220_ONE_SOURCE_NOT_FORMAL/SOURCE_SELECT_MANIFEST.json'
          packet.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          assert not r['formal_rc_adopted'] and not r['owner_accepted']
          print('GQ470_NEUTRAL_HORDE_B220_CANDIDATE_PACKET_SOURCE_ONLY')
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL_HEAD" || { echo FORMAL_RC_MOVED_REVIEW_NEW_HEAD_REQUIRED; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-NEUTRAL-HORDE-3-SHAPES-NOT-FORMAL
          path: |
            ${{ runner.temp }}/neutral-real69/B220_ONE_SOURCE_NOT_FORMAL/
            ${{ runner.temp }}/neutral-real69/ART_CHECK_REPORT_NEUTRAL_HORDE.json
            ${{ runner.temp }}/neutral-real69/EGGRUMBLE_NEUTRAL_HORDE_CANDIDATE_PRIVATE.rbxlx
            ${{ runner.temp }}/neutral-real69/EGGRUMBLE_NEUTRAL_HORDE_OFF69_PRIVATE.rbxlx
          if-no-files-found: error
          retention-days: 7
