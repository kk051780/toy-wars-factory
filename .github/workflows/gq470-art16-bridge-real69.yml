name: GQ470 ART16 exact A-source bridge (not formal RC)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_art16_bridge_real69_20261121/**'
      - '.github/workflows/gq470-art16-bridge-real69.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ROOT: /tmp/gq470-art16
      SCRIPT: quality_gameplay/gq470_art16_bridge_real69_20261121/compose_art16.py
      FORMAL: e80973c354f14a0d0088577f3cc1a875454f0f8f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin source, self-test negative cases, formal RC and exact green parents
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || { echo RED_WRONG_A_HEAD; exit 1; }
          python3 -m py_compile "$SCRIPT"
          python3 -B "$SCRIPT" --self-test
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL" || { echo RED_FORMAL_MOVED; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44695199140" --jq '.head_sha+" "+.conclusion')" = "$FORMAL success"
          mkdir -p "$ROOT/formal" "$ROOT/parents/966" "$ROOT/parents/967"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir "$ROOT/formal"
          python3 - <<'PY' > "$ROOT/parents.tsv"
          import sys
          sys.path.insert(0,"quality_gameplay/gq470_art16_bridge_real69_20261121")
          from compose_art16 import PARENTS
          for p in PARENTS:
              print(p["pr"],p["head"],p["run"],p["artifact"])
          PY
          test "$(wc -l < "$ROOT/parents.tsv")" -eq 2
          while read -r PR SHA RUN ART; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)" = "$SHA" || { echo RED_MOVED_PARENT_$PR; exit 1; }
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha+" "+.conclusion')" = "$SHA success" || { echo RED_PARENT_NOT_SUCCESS_$PR; exit 1; }
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name "$ART" --dir "$ROOT/parents/$PR"
          done < "$ROOT/parents.tsv"
          python3 -B "$SCRIPT" --base "$ROOT/formal" --parents "$ROOT/parents" --out "$ROOT/candidate"
          # Pre-build verification is performed inside compose(sealed=False); seal only after actual Rojo build.
          echo ART16_16_ORIGINAL_SELECTED_PATCHES_53_SOURCE_EXACT_A_PREP
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native Luau69 ON plus original69 OFF
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B "$ROOT/luau" -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build "$ROOT/luau" --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq470_art16_bridge_real69_20261121")
          from compose_art16 import select
          root=Path(os.environ["ROOT"])/"candidate"
          for d in (root, root/"OFF69_ART16_ORIGINAL"):
              routes=select(d)
              assert len(routes)==69
              for p,_ in routes.values():
                  subprocess.run([str(Path(os.environ["ROOT"])/"luau/luau-compile"),"--text",str(p)],check=True,stdout=subprocess.DEVNULL)
          print("ART16_NATIVE_LUAU_69_ON_69_OFF_PASS")
          PY
      - name: Pinned true Rojo Place, original exact rollback and 17-source/48-legacy audit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o "$ROOT/rojo.zip"
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $ROOT/rojo.zip" | sha256sum -c
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          root=Path(os.environ["ROOT"])
          with ZipFile(root/"rojo.zip") as z:
              p=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(p)==1
              out=root/"rojo"
              out.write_bytes(z.read(p[0]));out.chmod(0o755)
          PY
          "$ROOT/rojo" build "$ROOT/candidate/EGGRUMBLE_REAL69.project.json" -o "$ROOT/candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          "$ROOT/rojo" build "$ROOT/candidate/OFF69_ART16_ORIGINAL/EGGRUMBLE_REAL69.project.json" -o "$ROOT/OFF69_REBUILT.rbxlx"
          cmp "$ROOT/OFF69_REBUILT.rbxlx" "$ROOT/formal/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project "$ROOT/candidate/EGGRUMBLE_REAL69.project.json" \
            --place "$ROOT/candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx" --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project "$ROOT/candidate/OFF69_ART16_ORIGINAL/EGGRUMBLE_REAL69.project.json" \
            --place "$ROOT/OFF69_REBUILT.rbxlx" --count 69
          python3 -B "$SCRIPT" --seal "$ROOT/candidate"
          python3 quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py \
            --base "$ROOT/candidate" --report "$ROOT/candidate/ART16_LEGACY48_AUDIT.json"
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq8_rc85_rc86_real68_nonloss_20261120")
          from verify_nonloss import project_scan
          from quality_gameplay.gq8_rc85_rc86_real69_nonloss_20261120.verify_real69 import marker_check
          root=Path(os.environ["ROOT"])/"candidate"
          assert len(marker_check(project_scan(root,"EGGRUMBLE_REAL69.project.json")))==17
          print("ART16_17_SOURCE_FAMILIES_AND_LEGACY48_PASS")
          PY
      - name: "Strict art 420 remains NO_GO, B220 packet and fresh formal head"
        shell: bash
        run: |
          set -euo pipefail
          # The stock GQ470 source gate deliberately accepts *only* the pristine
          # formal canonical_build receipt. Never pretend this A candidate is formal.
          python3 art_quality/gq470_real69_source_gate.py --self-test
          python3 art_quality/gq470_real69_source_gate.py --root "$ROOT/formal" --head "$FORMAL" --out "$ROOT/candidate/ART16_FORMAL_BASE_ART_SOURCE_REPORT.json"
          python3 -B "$SCRIPT" --verify "$ROOT/candidate"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          c=root/"candidate"
          j=json.loads((c/"ART16_FORMAL_BASE_ART_SOURCE_REPORT.json").read_text())
          assert j["source_gate"]["selected_routes_source_class_hash_exact"] == 69
          assert j["visual_evidence_gate"]["screenshots_received"] == 0
          assert j["art_gate"]=="ART_NO_GO" and j["owner_accepted"] is False
          r=json.loads((c/"REAL69_LEGACY_INTAKE_RECEIPT.json").read_text())
          note=r["gq470_art16_source_bridge"]
          assert r["canonical_build"] is False and r["build_head"]=="ART16_A_SOURCE_BRIDGE_NOT_FORMAL"
          assert note["selected_changed"]==16 and note["untouched_original"]==53
          assert note["native_69_on_off"]=="PASS_SOURCE_ONLY" and note["rojo_69_on_off"]=="PASS_SOURCE_ONLY"
          assert note["officially_integrated"] is False and note["owner_accepted"] is False
          assert note["real_old_new_screenshots"]=="0/32" and note["art_gate"]=="ART_NO_GO"
          p=(c/"EGGRUMBLE_REAL69_PRIVATE.rbxlx").read_bytes()
          digest=hashlib.sha256(p).hexdigest()
          assert digest==r["private_place_sha256"] and len(p)==r["private_place_bytes"]
          report={
            "schema":"GQ470_ART16_REAL69_A_SOURCE_ONLY_NOT_FORMAL",
            "baseline_source_art_gate":"PASS_SOURCE_ONLY_69",
            "candidate_source_attestation":"16_CHANGED_53_SOURCE_EXACT_69_NATIVE_ROJO",
            "candidate_private_place_sha256":digest,"candidate_private_place_bytes":len(p),
            "formal_rc_adopted":False,"studio_solo":"NOT_TESTED","studio_two_client":"NOT_TESTED",
            "android_15min":"NOT_TESTED","human_art":"NOT_TESTED","old_new_images":"0/32",
            "art_gate":"ART_NO_GO","product_gate":"PRODUCT_NO_GO","owner_accepted":False,
            "note":"Formal baseline #420 gate and independently verified A candidate; neither proves gameplay or visual merit"
          }
          (c/"ART16_ART_CANDIDATE_REPORT.json").write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print("ART16_A_CANDIDATE_69_SOURCE_16_DIFF_ART_NO_GO_NOT_FORMAL",len(p),digest)
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL" || { echo RED_FORMAL_MOVED_BEFORE_EXPORT; exit 1; }
          python3 -B "$SCRIPT" --export-b "$ROOT/candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-ART16-REAL69-966-967-B220-PACKET-NOT-FORMAL
          path: |
            /tmp/gq470-art16/candidate/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-art16/candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-art16/candidate/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-art16/candidate/sources/**
            /tmp/gq470-art16/candidate/B220_ART16_SELECTED_BYTES_ONLY_NOT_FORMAL/**
            /tmp/gq470-art16/candidate/ART16_FORMAL_BASE_ART_SOURCE_REPORT.json
            /tmp/gq470-art16/candidate/ART16_ART_CANDIDATE_REPORT.json
            /tmp/gq470-art16/candidate/ART16_LEGACY48_AUDIT.json
            /tmp/gq470-art16/OFF69_REBUILT.rbxlx
          if-no-files-found: error
          retention-days: 7
