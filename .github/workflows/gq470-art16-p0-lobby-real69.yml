name: GQ470 ART16 + P0 early lobby exact composite (A only)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01, quality/gq470-art16-p0-lobby-composite-20261121-a01]
    paths:
      - 'quality_gameplay/gq470_art16_p0_lobby_composite_20261121/**'
      - '.github/workflows/gq470-art16-p0-lobby-real69.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  a-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      ROOT: /tmp/gq470-art16-p0
      FORMAL: e80973c354f14a0d0088577f3cc1a875454f0f8f
      ART16_HEAD: 180f5067bfe71c59b8c0c59b90aa69f1cd00cb7f
      P0_HEAD: 579cae991c609730291cdb3531c3a4cf916cd79f
      SCRIPT: quality_gameplay/gq470_art16_p0_lobby_composite_20261121/compose_art16_p0.py
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact A head / actual author artifacts / fail-closed negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$SCRIPT" quality_gameplay/gq470_art16_p0_lobby_composite_20261121/neutral_name_visibility_fix.py
          python3 -B quality_gameplay/gq470_art16_p0_lobby_composite_20261121/neutral_name_visibility_fix.py --self-test
          python3 -B "$SCRIPT" --self-test
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")" || { echo RED_PR_SYNTHETIC_HEAD; exit 1; }
            BASE_REF="$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
            [[ "$BASE_REF" == 'rc/p0d-s1-kids-rc01' || "$BASE_REF" == 'quality/gq470-art16-p0-lobby-composite-20261121-a01' ]] || { echo RED_UNTRUSTED_TARGET_BRANCH; exit 1; }
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL" || { echo RED_FORMAL_HEAD_MOVED_REBASE_REQUIRED; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/970" --jq .head.sha)" = "$ART16_HEAD" || { echo RED_ART16_AUTHOR_MOVED; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/980" --jq .head.sha)" = "$P0_HEAD" || { echo RED_P0_AUTHOR_MOVED; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44850475985" --jq '.head_sha+" "+.conclusion')" = "$ART16_HEAD success" || exit 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44862433160" --jq '.head_sha+" "+.conclusion')" = "$P0_HEAD success" || exit 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44695199140" --jq '.head_sha+" "+.conclusion')" = "$FORMAL success" || exit 1
          mkdir -p "$ROOT/formal" "$ROOT/parents/art16" "$ROOT/parents/p0"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir "$ROOT/formal"
          gh run download 44850475985 --repo "$GITHUB_REPOSITORY" --name GQ470-ART16-REAL69-966-967-B220-PACKET-NOT-FORMAL --dir "$ROOT/parents/art16"
          gh run download 44862433160 --repo "$GITHUB_REPOSITORY" --name GQ470-P0-EARLY-LOBBY-REAL69-A-B220-PACKET-NOT-FORMAL --dir "$ROOT/parents/p0"
          python3 -B "$SCRIPT" --formal "$ROOT/formal" --art16 "$ROOT/parents/art16" --p0 "$ROOT/parents/p0" --out "$ROOT/on"
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native actual 69 ON and 69 OFF Luau compilation
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B "$ROOT/luau" -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build "$ROOT/luau" --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import os,sys,subprocess
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq470_art16_p0_lobby_composite_20261121")
          from compose_art16_p0 import selected
          root=Path(os.environ["ROOT"])
          for path in [root/"on",root/"on/OFF69_ART16_P0_ORIGINAL"]:
              scripts=selected(path)
              assert len(scripts)==69
              for p,_ in scripts.values():
                  subprocess.run([str(root/"luau/luau-compile"),"--text",str(p)],check=True,stdout=subprocess.DEVNULL)
          print("GQ470_ART16_P0_NATIVE_LUAU_OFF69_ON69_REAL_138_SOURCES_PASS")
          PY
      - name: Pinned Rojo actual Place / OFF69 rollback / B220 source only packet
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o "$ROOT/rojo.zip"
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $ROOT/rojo.zip" | sha256sum -c
          python3 - <<'PY'
          import os
          from zipfile import ZipFile
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          with ZipFile(root/"rojo.zip") as z:
              members=[x for x in z.namelist() if x.rsplit("/",1)[-1]=="rojo"]
              assert len(members)==1
              exe=root/"rojo"
              exe.write_bytes(z.read(members[0]))
              exe.chmod(0o755)
          PY
          "$ROOT/rojo" build "$ROOT/on/OFF69_ART16_P0_ORIGINAL/EGGRUMBLE_REAL69.project.json" -o "$ROOT/OFF69_REBUILT.rbxlx"
          cmp "$ROOT/OFF69_REBUILT.rbxlx" "$ROOT/formal/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          "$ROOT/rojo" build "$ROOT/on/EGGRUMBLE_REAL69.project.json" -o "$ROOT/on/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$ROOT/on/EGGRUMBLE_REAL69.project.json" --place "$ROOT/on/EGGRUMBLE_REAL69_PRIVATE.rbxlx" --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$ROOT/on/OFF69_ART16_P0_ORIGINAL/EGGRUMBLE_REAL69.project.json" --place "$ROOT/OFF69_REBUILT.rbxlx" --count 69
          python3 -B "$SCRIPT" --seal "$ROOT/on"
          python3 -B "$SCRIPT" --verify "$ROOT/on"
          python3 art_quality/gq470_real69_source_gate.py --root "$ROOT/formal" --head "$FORMAL" --out "$ROOT/on/BASE_FORMAL_ART_SOURCE_REPORT.json"
          python3 -B "$SCRIPT" --export "$ROOT/on"
          python3 -m py_compile quality_gameplay/gq470_art16_p0_lobby_composite_20261121/verify_b220_packet.py
          python3 -B quality_gameplay/gq470_art16_p0_lobby_composite_20261121/verify_b220_packet.py --root "$ROOT/on" --negatives --report "$ROOT/on/GQ470_ART16_P0_B220_TAMPER_GATE.json"
          python3 -m py_compile quality_gameplay/gq470_art16_p0_lobby_composite_20261121/analyze_visual_source_delta.py
          python3 -B quality_gameplay/gq470_art16_p0_lobby_composite_20261121/analyze_visual_source_delta.py --self-test
          python3 -B quality_gameplay/gq470_art16_p0_lobby_composite_20261121/analyze_visual_source_delta.py --root "$ROOT/on" --report "$ROOT/on/GQ470_ART16_P0_VISUAL_SOURCE_BUDGET.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["ROOT"])/"on"
          art=json.loads((root/"BASE_FORMAL_ART_SOURCE_REPORT.json").read_text())
          receipt=json.loads((root/"REAL69_LEGACY_INTAKE_RECEIPT.json").read_text())
          assert art["visual_evidence_gate"]["screenshots_received"]==0
          assert art["art_gate"]=="ART_NO_GO" and not art["owner_accepted"]
          note=receipt["gq470_art16_p0_lobby_composite"]
          assert note["changed_selected_sources"]==17 and note["unchanged_original_sources"]==52
          assert note["studio"]=="NOT_TESTED" and not note["studio_spawn_fix_proven"]
          report={
             "schema":"GQ470_ART16_P0_A_SOURCE_ONLY_TRUTH_V1",
             "formal_rc_head":note["formal_head"],
             "private_candidate_sha256":receipt["private_place_sha256"],
             "private_candidate_bytes":receipt["private_place_bytes"],
             "selected_changed":17,"selected_original_unchanged":52,
             "native_rojo":"PASS_SOURCE_ONLY",
             "official_rc_integrated":False,"studio_solo":"NOT_TESTED",
             "studio_two_client":"NOT_TESTED","spawn_bug_fixed":"NOT_PROVEN",
             "android_15min":"NOT_TESTED","human_art":"NOT_TESTED",
             "screenshots":"0/32","kid_fun":"NOT_TESTED",
             "art_gate":"ART_NO_GO","product_gate":"PRODUCT_NO_GO",
             "owner_accepted":False
          }
          (root/"ART16_P0_CANDIDATE_TRUTH.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("GQ470_ART16_P0_SOURCE_17_CHANGED_52_EXACT_ART_NO_GO")
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL" || { echo RED_FORMAL_MOVED_BEFORE_EXPORT; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-ART16-P0-17-REAL69-B220-PACKET-NOT-FORMAL
          path: |
            /tmp/gq470-art16-p0/on/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-art16-p0/on/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-art16-p0/on/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-art16-p0/on/ART16_P0_CANDIDATE_TRUTH.json
            /tmp/gq470-art16-p0/on/BASE_FORMAL_ART_SOURCE_REPORT.json
            /tmp/gq470-art16-p0/on/B220_ART16_P0_SELECTED17_NOT_FORMAL/**
            /tmp/gq470-art16-p0/on/GQ470_ART16_P0_B220_TAMPER_GATE.json
            /tmp/gq470-art16-p0/on/GQ470_ART16_P0_VISUAL_SOURCE_BUDGET.json
            /tmp/gq470-art16-p0/OFF69_REBUILT.rbxlx
          if-no-files-found: error
          retention-days: 7

  post-upload-proof:
    name: Independently replay actual uploaded B packet (A only, no formal RC write)
    needs: [a-source-only]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    env:
      ROOT: /tmp/gq470-art16-p0-postupload
      FORMAL: e80973c354f14a0d0088577f3cc1a875454f0f8f
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Independent fetch from real GitHub Actions uploaded artifact and formal source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile quality_gameplay/gq470_art16_p0_lobby_composite_20261121/verify_uploaded_packet.py
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL" || { echo RED_FORMAL_MOVED_FOR_UPLOAD_REPLAY; exit 1; }
          mkdir -p "$ROOT/uploaded" "$ROOT/formal"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name GQ470-ART16-P0-17-REAL69-B220-PACKET-NOT-FORMAL \
            --dir "$ROOT/uploaded"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO \
            --dir "$ROOT/formal"
          python3 -B quality_gameplay/gq470_art16_p0_lobby_composite_20261121/verify_uploaded_packet.py \
            --formal "$ROOT/formal" --downloaded "$ROOT/uploaded" --out "$ROOT/replayed"
          echo GQ470_ACTUAL_UPLOADED_ARTIFACT_17_LUAU_REPLAYED_FROM_ORIGINAL_69_SOURCE
      - name: Pinned real Rojo independent uploaded Place rebuild and 24 tamper negatives
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o "$ROOT/rojo.zip"
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $ROOT/rojo.zip" | sha256sum -c
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          root=Path(os.environ["ROOT"])
          with ZipFile(root/"rojo.zip") as z:
              matches=[x for x in z.namelist() if x.rsplit("/",1)[-1]=="rojo"]
              assert len(matches)==1
              exe=root/"rojo"
              exe.write_bytes(z.read(matches[0]))
              exe.chmod(0o755)
          PY
          "$ROOT/rojo" build "$ROOT/replayed/OFF69_ART16_P0_ORIGINAL/EGGRUMBLE_REAL69.project.json" -o "$ROOT/OFF_REBUILT.rbxlx"
          cmp "$ROOT/OFF_REBUILT.rbxlx" "$ROOT/formal/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          "$ROOT/rojo" build "$ROOT/replayed/EGGRUMBLE_REAL69.project.json" -o "$ROOT/replayed/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project "$ROOT/replayed/EGGRUMBLE_REAL69.project.json" \
            --place "$ROOT/replayed/EGGRUMBLE_REAL69_PRIVATE.rbxlx" --count 69
          python3 -B quality_gameplay/gq470_art16_p0_lobby_composite_20261121/verify_uploaded_packet.py \
            --formal "$ROOT/formal" --downloaded "$ROOT/uploaded" --out "$ROOT/replayed" --seal \
            --report "$ROOT/GQ470_ART16_P0_INDEPENDENT_UPLOAD_REPLAY.json"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL" || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-ART16-P0-17-INDEPENDENT-POSTUPLOAD-RECEIPT-NOT-FORMAL
          path: /tmp/gq470-art16-p0-postupload/GQ470_ART16_P0_INDEPENDENT_UPLOAD_REPLAY.json
          if-no-files-found: error
          retention-days: 7
