name: P0D WF13 isolated low-gravity source and real native Luau
on:
  push:
    branches:
      - handoff/p0d-wf13-local-gravity-prototype-20261112-01
    paths:
      - 'handoffs/P0D-WF13-LOCAL-GRAVITY-PROTOTYPE-20261112-01/**'
      - '.github/workflows/p0d-wf13-local-gravity-source-20261112.yml'
permissions:
  contents: read
jobs:
  native-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Strict SHA256 source manifest before test Python creates pycache
        run: python3 handoffs/P0D-WF13-LOCAL-GRAVITY-PROTOTYPE-20261112-01/tools/verify_manifest.py
      - name: Actual Python source and mutation negative controls
        run: python3 -m unittest discover -s handoffs/P0D-WF13-LOCAL-GRAVITY-PROTOTYPE-20261112-01/tests -p 'test_*.py' -v
      - name: Build PINNED native Luau CLI from upstream source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wf13-luau
          git -C /tmp/wf13-luau init -q
          git -C /tmp/wf13-luau remote add origin https://github.com/luau-lang/luau.git
          git -C /tmp/wf13-luau fetch --quiet --depth 1 origin f46d879e28302a430029304f7f6a162aed66f103
          git -C /tmp/wf13-luau checkout --quiet FETCH_HEAD
          test "$(git -C /tmp/wf13-luau rev-parse HEAD)" = "f46d879e28302a430029304f7f6a162aed66f103"
          cmake -S /tmp/wf13-luau -B /tmp/wf13-luau/build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_CLI=ON -DLUAU_BUILD_TESTS=OFF
          cmake --build /tmp/wf13-luau/build --config Release --target Luau.Repl.CLI Luau.Compile.CLI -j 2
      - name: Actual original four Luau files native syntax compilation
        shell: bash
        run: |
          set -euo pipefail
          for file in handoffs/P0D-WF13-LOCAL-GRAVITY-PROTOTYPE-20261112-01/src/*.luau; do
            /tmp/wf13-luau/build/luau-compile "$file" > /dev/null
            echo "WF13_NATIVE_LUAU_COMPILE_PASS $file"
          done
      - name: Actual original WF13Policy numeric function semantic execution
        shell: bash
        run: |
          set -euo pipefail
          python3 handoffs/P0D-WF13-LOCAL-GRAVITY-PROTOTYPE-20261112-01/tools/build_native_policy_runner.py /tmp/wf13_policy_native.luau
          /tmp/wf13-luau/build/luau /tmp/wf13_policy_native.luau | tee /tmp/wf13_native_result.txt
          grep -q 'WF13_NATIVE_ACTUAL_POLICY_PASS cases=18' /tmp/wf13_native_result.txt
      - name: Actual whole original WF13 Controller native lifecycle and malicious mutation tests
        shell: bash
        run: |
          set -euo pipefail
          python3 handoffs/P0D-WF13-LOCAL-GRAVITY-PROTOTYPE-20261112-01/tools/build_native_controller_runner.py --output-dir /tmp/wf13-controller-native
          /tmp/wf13-luau/build/luau /tmp/wf13-controller-native/positive.luau | tee /tmp/wf13-controller-positive.txt
          grep -q 'WF13_NATIVE_ACTUAL_CONTROLLER_PASS cases=' /tmp/wf13-controller-positive.txt
          if /tmp/wf13-luau/build/luau /tmp/wf13-controller-native/BAD_CLIENT_NETWORK_OWNER.luau > /tmp/wf13-controller-bad-owner.txt 2>&1; then
            echo "WF13_INVALID_OWNER_MUTATION_INCORRECTLY_ACCEPTED"; exit 1
          fi
          if /tmp/wf13-luau/build/luau /tmp/wf13-controller-native/BAD_NO_REAL_REGION_CHECK.luau > /tmp/wf13-controller-bad-region.txt 2>&1; then
            echo "WF13_INVALID_REGION_MUTATION_INCORRECTLY_ACCEPTED"; exit 1
          fi
          grep -q 'WF13_NATIVE_CONTROLLER_FAILED' /tmp/wf13-controller-bad-owner.txt
          grep -q 'WF13_NATIVE_CONTROLLER_FAILED' /tmp/wf13-controller-bad-region.txt
          echo "WF13_NATIVE_REAL_CONTROLLER_UNSAFE_MUTATIONS_2_OF_2_REJECTED"
