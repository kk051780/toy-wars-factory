name: GQ8 Real61 HUD59 plus Trade57 cross-candidate source-loss gate
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'rc_fastlane/EGGRUMBLE_V3_REAL61_CANDIDATE.json'
      - 'quality_gameplay/gq8_real61_convergence_20261119/**'
      - '.github/workflows/gq8-real61-hud-trade-convergence.yml'
  push:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'rc_fastlane/EGGRUMBLE_V3_REAL61_CANDIDATE.json'
      - '.github/workflows/gq8-real61-hud-trade-convergence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-55-preserve-add-hud4-trade2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Correct real-source naming and independent negative-mutation tests
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq8_real61_convergence_20261119/test_real61.py
      - name: Same-current-canonical-RC fence and pin true original 55 Place
        run: |
          set -euo pipefail
          RC_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$RC_SHA" = 38d11f0bf311491ba76fe03f818948e5d4b06889 || { echo RED_CANDIDATE_NEEDS_NEWEST_REAL59_BASE; exit 1; }
          else
            test "$GITHUB_REF" = "refs/heads/rc/p0d-s1-kids-rc01" && test "$RC_SHA" = "$GITHUB_SHA" || { echo RED_NOT_NEW_OFFICIAL_HEAD; exit 1; }
          fi
          EVIDENCE="$(gh run view 44393525211 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')"
          test "$EVIDENCE" = "a6020867fac80fa3b2ca47478625873fc6f3678e success" || { echo RED_PARENT55_RUN_NOT_GREEN; exit 1; }
          mkdir -p artifacts/official55
          gh run download 44393525211 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL55-CANONICAL-PRIVATE-STUDIO \
            --dir artifacts/official55
          test -s artifacts/official55/EGGRUMBLE_REAL55.project.json
          test -s artifacts/official55/B_REAL55_RECEIPT.json
          test -s artifacts/official55/EGGRUMBLE_REAL55.rbxlx
          REAL59_EVIDENCE="$(gh run view 44401178585 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')"
          test "$REAL59_EVIDENCE" = "38d11f0bf311491ba76fe03f818948e5d4b06889 success" || { echo RED_CURRENT_OFFICIAL_REAL59_CI_UNVERIFIED; exit 1; }
          mkdir -p artifacts/official59
          gh run download 44401178585 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL59-HUD-MAP-CANONICAL-PRIVATE-STUDIO \
            --dir artifacts/official59
          test -s artifacts/official59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx
          test -s artifacts/official59/GQ828_REAL59_RECEIPT.json
          echo GQ8_ORIGINAL55_AND_CURRENT_REAL59_CANONICAL_CI_PASS
      - name: Fetch immutable true PR829 and PR838 source blobs and compose Real61 without dropping Original55
        run: |
          set -euo pipefail
          R=quality_gameplay/gq8_real61_convergence_20261119
          python3 -B "$R/compose_real61.py" fetch \
            --manifest rc_fastlane/EGGRUMBLE_V3_REAL61_CANDIDATE.json \
            --inputs artifacts/locked_new6 --repository "$GITHUB_REPOSITORY"
          python3 -B "$R/compose_real61.py" compose \
            --manifest rc_fastlane/EGGRUMBLE_V3_REAL61_CANDIDATE.json \
            --inputs artifacts/locked_new6 \
            --parent55 artifacts/official55/EGGRUMBLE_REAL55.project.json \
            --receipt55 artifacts/official55/B_REAL55_RECEIPT.json \
            --out artifacts/real61
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native Luau compile 55 baseline and actual 61 combined scripts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8-real61-luau -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8-real61-luau --target Luau.Compile.CLI --parallel 4
          for dirname in artifacts/official55/sources artifacts/real61/sources; do
            count=0
            while IFS= read -r -d '' src; do
              /tmp/gq8-real61-luau/luau-compile --text "$src" >/dev/null
              count=$((count+1))
            done < <(find "$dirname" -type f -name '*.luau' -print0)
            if [ "$dirname" = artifacts/official55/sources ]; then test "$count" -eq 55; else test "$count" -eq 61; fi
            echo "GQ8_NATIVE_SELECTED_SOURCE_COUNT_PASS $count"
          done
      - name: Pinned Rojo Actual61 and exact OFF55 Place bytes, source classes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq8-real61-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq8-real61-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq8-real61-rojo.zip") as archive:
              files=[n for n in archive.namelist() if n.split("/")[-1]=="rojo"]
              assert len(files)==1
              binary=Path("/tmp/gq8-real61-rojo")
              binary.write_bytes(archive.read(files[0]))
              binary.chmod(0o755)
          PY
          /tmp/gq8-real61-rojo build artifacts/real61/EGGRUMBLE_REAL61_CANDIDATE.project.json \
            -o artifacts/real61/EGGRUMBLE_REAL61_CANDIDATE.rbxlx
          /tmp/gq8-real61-rojo build artifacts/official55/EGGRUMBLE_REAL55.project.json \
            -o artifacts/real61/OFF55.rbxlx
          cmp artifacts/real61/OFF55.rbxlx artifacts/official55/EGGRUMBLE_REAL55.rbxlx || { echo RED_OFFICIAL55_OFF_BYTES_CHANGED; exit 1; }
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/real61/EGGRUMBLE_REAL61_CANDIDATE.project.json \
            --place artifacts/real61/EGGRUMBLE_REAL61_CANDIDATE.rbxlx --count 61
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/official55/EGGRUMBLE_REAL55.project.json \
            --place artifacts/real61/OFF55.rbxlx --count 55
          PYTHONPATH=handoffs/EGGRUMBLE-HUD-INTEL-20261119 python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from compose_real40 import contents
          src59,_=contents(ET.parse(Path("artifacts/official59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx")).getroot())
          combined61,_=contents(ET.parse(Path("artifacts/real61/EGGRUMBLE_REAL61_CANDIDATE.rbxlx")).getroot())
          assert len(src59)==59 and len(combined61)==61,("RED_SELECTED_SOURCE_COUNT",len(src59),len(combined61))
          assert set(src59).issubset(combined61),"RED_REAL59_SOURCES_LOST"
          for route,old in src59.items():
              assert combined61[route]==old,("RED_REAL59_SOURCE_CHANGED",route)
          assert set(combined61)-set(src59)=={
              ("ServerScriptService","GQ8_TradeJournalContract"),
              ("StarterPlayer","StarterPlayerScripts","GQ8_TradeReview")
          },"RED_REAL59_EXTRA_UNREVIEWED_SOURCE"
          print("GQ8_REAL61_CURRENT_REAL59_59OF59_EXACT_PLUS_TRADE2_SOURCE_CLASS_PASS")
          PY
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$CURRENT" = "$GITHUB_SHA" || { echo RED_OFFICIAL_RC_MOVED_DURING_CI; exit 1; }
          else
            test "$CURRENT" = 38d11f0bf311491ba76fe03f818948e5d4b06889 || { echo RED_SOURCE_PARENT_REAL59_MOVED_DURING_CI; exit 1; }
          fi
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          receipt=Path("artifacts/real61/B_REAL61_CANDIDATE_RECEIPT.json")
          x=json.loads(receipt.read_text())
          p=Path("artifacts/real61/EGGRUMBLE_REAL61_CANDIDATE.rbxlx")
          x.update({"native61":"PASS","rojo_source_class61":"PASS",
                    "off55_place_byte_identical":"PASS","current59_exact_preserved":"PASS",
                    "candidate_place_bytes":p.stat().st_size,
                    "candidate_place_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                    "verification_head":os.environ["GITHUB_SHA"],
                    "official_head_at_verification":"38d11f0bf311491ba76fe03f818948e5d4b06889",
                    "source_selected_in_formal_rc":os.environ.get("GITHUB_REF")=="refs/heads/rc/p0d-s1-kids-rc01",
                    "gameplay_fun":"NOT_TESTED","studio_2client":"NOT_TESTED",
                    "android_15min":"NOT_TESTED"})
          receipt.write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          print("GQ8_REAL61_NATIVE_ROJO_OFF55_AND_CANDIDATE_TRUTH_PASS",p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-REAL61-HUD59-TRADE57-CROSSLANE-NOT-OFFICIAL-UNTIL-CAS
          path: |
            artifacts/real61/EGGRUMBLE_REAL61_CANDIDATE.rbxlx
            artifacts/real61/OFF55.rbxlx
            artifacts/real61/B_REAL61_CANDIDATE_RECEIPT.json
            artifacts/real61/EGGRUMBLE_REAL61_CANDIDATE.project.json
          retention-days: 5
          if-no-files-found: error
