name: GQ470 REAL69 item ornament visibility A source prep NOT formal
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_item_visibility_real69_20261122/**'
      - '.github/workflows/gq470-item-ornament-visibility-real69.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-visual-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      WORK: /tmp/gq470-item-ornament-real69
      OFFICIAL: e80973c354f14a0d0088577f3cc1a875454f0f8f
      SCRIPT: quality_gameplay/gq470_item_visibility_real69_20261122
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin real formal branch, run, and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")"
          fi
          LIVE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          test "$LIVE" = "$OFFICIAL" || { echo 'FORMAL_HEAD_MOVED_REBASE_REQUIRED_NO_ACCEPT'; exit 1; }
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44695199140 --jq '.head_sha+" "+.conclusion')" = "$OFFICIAL success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/14610422120 --jq '.name+" "+(.size_in_bytes|tostring)+" "+(.expired|tostring)')" = 'P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO 4331687 false'
          mkdir -p "$WORK"
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir "$WORK/formal"
          (cd "$WORK/formal" && zip -q -r "$WORK/original-actions.zip" .)
          echo 'PINNED_REAL69_FORMAL_ZIP_DOWNLOADED_NOT_OWNER_ACCEPTANCE'
      - name: Run REAL69 source-locked 12 tests and produce exact one-source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$SCRIPT/patch_item_visibility69.py" "$SCRIPT/test_item_visibility69.py"
          GQ470_REAL69_ZIP="$WORK/original-actions.zip" python3 -m unittest discover -s "$SCRIPT" -p test_item_visibility69.py -v
          python3 "$SCRIPT/patch_item_visibility69.py" --artifact "$WORK/original-actions.zip" --output "$WORK/ON69" | tee "$WORK/PATCH_RECEIPT.json"
          mkdir -p "$WORK/OFF69"
          cp -a "$WORK/ON69/sources" "$WORK/OFF69/sources"
          cp "$WORK/ON69/EGGRUMBLE_REAL69.project.json" "$WORK/OFF69/EGGRUMBLE_REAL69.project.json"
          cp "$WORK/ON69/OFF69_original/sources/ServerScriptService/EGGRUMBLE_EncounterReadabilityArt.server.luau" "$WORK/OFF69/sources/ServerScriptService/EGGRUMBLE_EncounterReadabilityArt.server.luau"
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          root=Path(os.environ['WORK']); on=root/'ON69'; off=root/'OFF69'
          receipt=json.loads((on/'REAL69_LEGACY_INTAKE_RECEIPT.json').read_text())
          source='sources/ServerScriptService/EGGRUMBLE_EncounterReadabilityArt.server.luau'
          assert len(receipt['source_hashes'])==69
          assert hashlib.sha256((on/source).read_bytes()).hexdigest()==receipt['source_hashes']['ServerScriptService/EGGRUMBLE_EncounterReadabilityArt']
          a=sorted((on/'sources').rglob('*.luau'))
          b=sorted((off/'sources').rglob('*.luau'))
          assert len(a)==len(b)==69
          changed=[p.relative_to(on) for p in a if p.read_bytes()!=(off/p.relative_to(on)).read_bytes()]
          assert [str(k) for k in changed]==[source],changed
          print('EXACT_69_ROUTES_ONE_ART_SOURCE_CHANGED_OFF68_PRESERVED')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native compile all 69 ON and all 69 OFF original scripts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-item-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-item-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          root=Path(os.environ['WORK'])
          for profile in ('ON69','OFF69'):
            files=sorted((root/profile/'sources').rglob('*.luau'))
            assert len(files)==69
            for f in files:
              subprocess.run(['/tmp/gq470-item-luau/luau-compile','--text',str(f)],check=True,stdout=subprocess.DEVNULL)
            print(profile+'_NATIVE_LUAU_COMPILE_69_OF_69_PASS')
          PY
      - name: Exact ON69/OFF69 Rojo Place and feature-source identity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-item-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-item-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/gq470-item-rojo.zip') as z:
            exe=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
            assert len(exe)==1
            p=Path('/tmp/gq470-item-rojo');p.write_bytes(z.read(exe[0]));p.chmod(0o755)
          PY
          /tmp/gq470-item-rojo build "$WORK/ON69/EGGRUMBLE_REAL69.project.json" -o "$WORK/GQ470_ITEM_VISIBILITY_ON69_PRIVATE.rbxlx"
          /tmp/gq470-item-rojo build "$WORK/OFF69/EGGRUMBLE_REAL69.project.json" -o "$WORK/GQ470_ITEM_VISIBILITY_OFF69_PRIVATE.rbxlx"
          python3 -B quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$WORK/ON69/EGGRUMBLE_REAL69.project.json" --place "$WORK/GQ470_ITEM_VISIBILITY_ON69_PRIVATE.rbxlx" --count 69
          python3 -B quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$WORK/OFF69/EGGRUMBLE_REAL69.project.json" --place "$WORK/GQ470_ITEM_VISIBILITY_OFF69_PRIVATE.rbxlx" --count 69
          cmp "$WORK/GQ470_ITEM_VISIBILITY_OFF69_PRIVATE.rbxlx" "$WORK/ON69/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          w=Path(os.environ['WORK']);data=json.loads((w/'PATCH_RECEIPT.json').read_text())
          for profile in ('ON69','OFF69'):
            p=w/f'GQ470_ITEM_VISIBILITY_{profile}_PRIVATE.rbxlx'
            data[profile+'_place_bytes']=p.stat().st_size
            data[profile+'_place_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          data['native_source_compile']='69/69_ON_PLUS_69/69_OFF_PASS'
          data['rojo_source_class_69']='PASS'
          data['rollback_off_place_byte_identical']='PASS'
          data['formally_integrated']=False
          data['studio_android_human_art']='NOT_TESTED'
          (w/'GQ470_ITEM_VISIBILITY_A_ONLY_EVIDENCE.json').write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          print('ART_REAL69_SOURCE_ONLY_PASS_NOT_FORMAL_STUDIO_ART_NO_GO',data['ON69_place_bytes'])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GQ470-ITEM-ORNAMENT-REAL69-A-ONLY-NOT-FORMAL
          path: |
            ${{ env.WORK }}/GQ470_ITEM_VISIBILITY_ON69_PRIVATE.rbxlx
            ${{ env.WORK }}/GQ470_ITEM_VISIBILITY_OFF69_PRIVATE.rbxlx
            ${{ env.WORK }}/ON69/sources/ServerScriptService/EGGRUMBLE_EncounterReadabilityArt.server.luau
            ${{ env.WORK }}/ON69/EGGRUMBLE_REAL69.project.json
            ${{ env.WORK }}/ON69/REAL69_LEGACY_INTAKE_RECEIPT.json
            ${{ env.WORK }}/GQ470_ITEM_VISIBILITY_A_ONLY_EVIDENCE.json
          retention-days: 7
          if-no-files-found: error
