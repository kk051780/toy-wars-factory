name: GQ470 REAL69 item ornament visibility A source prep NOT formal
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_item_visibility_real69_20261122/**'
      - '.github/workflows/gq470-item-ornament-visibility-real69.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-visual-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      WORK: /tmp/gq470-item-ornament-real69
      OFFICIAL: 273e763c42ee0f405ef854b75c3cf071b078e896
      FORMAL: rc/p0d-s1-kids-rc01
      RUN_ID: '45516606797'
      ARTIFACT_ID: '14977773039'
      ARTIFACT_BYTES: '13407250'
      ARTIFACT_SHA256: f4e8cfb036cfb83e33d95c20e0d9cf9522e5737881e26e61f317fccb230567b0
      SCRIPT: quality_gameplay/gq470_item_visibility_real69_20261122
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin real formal branch, run, and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            jq -e --arg branch "$FORMAL" '.number==1010 and .pull_request.base.ref==$branch' "$GITHUB_EVENT_PATH" >/dev/null
            test "$(git rev-parse HEAD)" = "$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")"
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/quality/gq470-real69-item-ornament-visibility-20261122-a01
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          LIVE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FORMAL" --jq '.object.sha')"
          test "$LIVE" = "$OFFICIAL" || { echo 'FORMAL_HEAD_MOVED_REBASE_REQUIRED_NO_ACCEPT'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
            jq -e --arg head "$OFFICIAL" --arg branch "$FORMAL" \
              '.head_sha==$head and .head_branch==$branch and .event=="push" and .status=="completed" and .conclusion=="success"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" |
            jq -e --arg hash "sha256:$ARTIFACT_SHA256" --arg head "$OFFICIAL" --arg branch "$FORMAL" \
              --argjson size "$ARTIFACT_BYTES" --argjson run "$RUN_ID" \
              '.name=="P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO" and .digest==$hash
               and .size_in_bytes==$size and .expired==false and .workflow_run.id==$run
               and .workflow_run.head_sha==$head and .workflow_run.head_branch==$branch' >/dev/null
          mkdir "$WORK"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$WORK/original-actions.zip"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$WORK/original-actions.zip" | sha256sum --check
      - name: Validate the registered cleanup and exact current 69-source parent
        shell: bash
        run: |
          set -euo pipefail
          export GQ470_REAL69_ZIP="$WORK/original-actions.zip"
          python3 -B -m unittest discover -s "$SCRIPT" -p test_item_visibility69.py -v
          python3 -B -O -m unittest discover -s "$SCRIPT" -p test_item_visibility69.py -v
          python3 -B "$SCRIPT/patch_item_visibility69.py" --artifact "$GQ470_REAL69_ZIP" --output "$WORK"
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile both exact 69-source sets and run both cleanup bodies with fresh Luau
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _pinned_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _pinned_luau -B /tmp/gq470-item-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-item-luau --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          python3 -B "$SCRIPT/test_item_visibility69.py" --native-dir /tmp/gq470-item-luau --work "$WORK"
      - name: Exact ON69 and byte-identical OFF69 Rojo Place
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-item-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-item-rojo.zip' | sha256sum -c
          python3 -B - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/gq470-item-rojo.zip') as source:
              binary, = [name for name in source.namelist() if name.split('/')[-1] == 'rojo']
              target = Path('/tmp/gq470-item-rojo')
              target.write_bytes(source.read(binary))
              target.chmod(0o755)
          PY
          for profile in ON69 OFF69; do
            /tmp/gq470-item-rojo build "$WORK/$profile/EGGRUMBLE_REAL69.project.json" -o "$WORK/$profile/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          done
          python3 -B "$SCRIPT/patch_item_visibility69.py" --verify-places --artifact "$WORK/original-actions.zip" --output "$WORK"
          LIVE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FORMAL" --jq '.object.sha')"
          test "$LIVE" = "$OFFICIAL" || { echo 'FORMAL_HEAD_MOVED_REBASE_REQUIRED_NO_ACCEPT'; exit 1; }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GQ470-ITEM-CLEANUP-REAL69-A-ONLY-NOT-FORMAL
          path: |
            ${{ env.WORK }}/ON69/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            ${{ env.WORK }}/OFF69/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            ${{ env.WORK }}/ON69/EGGRUMBLE_REAL69.project.json
            ${{ env.WORK }}/ON69/sources/ServerScriptService/EGGRUMBLE_EncounterReadabilityArt.server.luau
            ${{ env.WORK }}/GQ470_ITEM_CLEANUP_A_ONLY_EVIDENCE.json
            ${{ env.WORK }}/native/
          retention-days: 7
          if-no-files-found: error
