name: P0D real castle beast solo and seven unique held weapons native83
on:
  push:
    branches: [feature/p0d-product-quality-gate-20261115]
    paths:
      - product_quality/castle_beast_solo_armament_83_composite.py
      - .github/workflows/p0d-quality-castle-beast-solo-weapons-native83.yml
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - product_quality/castle_beast_solo_armament_83_composite.py
      - .github/workflows/p0d-quality-castle-beast-solo-weapons-native83.yml
permissions:
  contents: read
  actions: read
jobs:
  actual-game-native83:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch immutable castle, beast, solo AI and egg Game RC82
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_83_original
          gh run download 43700281615 -R kk051780/toy-wars-factory \
            -n P0D-REAL-CASTLE-GATE-BEAST-SOLO-RC82-SOURCE-NOGO \
            -D /tmp/p0d_83_original
          test -s /tmp/p0d_83_original/P0D_WALKIN_CASTLE_GATE_BEAST_SOLO_PRIVATE.zip
      - name: Construct actual 83-script Place with original game authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -B product_quality/castle_beast_solo_armament_83_composite.py \
            --parent /tmp/p0d_83_original/P0D_WALKIN_CASTLE_GATE_BEAST_SOLO_PRIVATE.zip \
            --out /tmp/P0D_CASTLE_BEAST_SOLO_SEVEN_WEAPONS_PRIVATE83.zip \
            --extract /tmp/p0d_83_actual_sources
          python3 - <<'PY'
          import sys,zipfile,json,hashlib
          from pathlib import Path
          sys.path.insert(0,'product_quality')
          from castle_beast_solo_armament_83_composite import add_module,OUTPUT_PLACE
          from role7_respawn_guard import extract
          with zipfile.ZipFile('/tmp/P0D_CASTLE_BEAST_SOLO_SEVEN_WEAPONS_PRIVATE83.zip') as z:
              r=json.loads(z.read('RECEIPT.json'))
              place=z.read(OUTPUT_PLACE)
          assert r['source_count']==83 and r['existing_81_sources_byte_exact']
          assert r['egg_score_winner_byte_exact'] and r['source_lock_path_and_class_exact']
          assert r['real_siege_gate_preserved'] and r['real_beast_follow_attack_preserved']
          assert r['private_solo_egg_ai_preserved'] and r['seven_distinct_server_m1']
          assert not r['official_rc_write'] and r['product']=='NO_GO'
          assert r['place_sha256']==hashlib.sha256(place).hexdigest()
          root, scripts=extract(place)
          assert len(scripts)==83 and len(list(Path('/tmp/p0d_83_actual_sources').glob('*.luau')))==83
          assert 'P0D_FB_CASTLE_WALKIN_SIEGE_V1' in scripts['MapBuilder'].text
          assert 'summonSevenBeast' in scripts['Game'].text
          assert 'SevenJobs.ArmamentM1.strike(job,stage,root.Position,look' in scripts['Game'].text
          assert 'callbacks.deposit(bot,bot.team,bot.carry)' in scripts['SoloTeamBots'].text
          try: add_module(root,scripts['SevenJobArmamentM1'].text)
          except ValueError: pass
          else: raise AssertionError('DUPLICATE_ARMAMENT_MODULE_ACCEPTED')
          print('REAL_CASTLE_BEAST_SOLO_SEVEN_WEAPONS_FULL83_SOURCE_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_pinned_luau
          persist-credentials: false
      - name: Native compile real 83 source bodies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_pinned_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_pinned_luau -B /tmp/p0d_83_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_83_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' f; do
            /tmp/p0d_83_build/luau-compile "$f" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_83_actual_sources -name '*.luau' -type f -print0 | sort -z)
          test "$n" -eq 83
          echo P0D_REAL_SEVEN_WEAPONS_CASTLE_BEAST_SOLO_NATIVE83_PASS
      - name: Reconstruct 83 original Roblox paths and types from the actual Place
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          import hashlib,json
          target=Path('/tmp/p0d_83_rojo')
          with ZipFile('/tmp/P0D_CASTLE_BEAST_SOLO_SEVEN_WEAPONS_PRIVATE83.zip') as z:
              root=ET.fromstring(z.read('P0D_CASTLE_BEAST_SOLO_SEVEN_WEAPONS_PRIVATE_RC83.rbxlx'))
          types={'Script':'.server.luau','LocalScript':'.client.luau','ModuleScript':'.luau'}
          manifest=[]
          def walk(item,old=()):
              p=item.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=old+((name,) if name else ())
              if src is not None:
                  assert item.get('class') in types and len(here)>=3
                  assert here[0] in ('ReplicatedStorage','ServerScriptService','StarterPlayer')
                  assert all(t.isidentifier() for t in here)
                  f=target/'src'/Path(*here).with_suffix(types[item.get('class')])
                  f.parent.mkdir(parents=True,exist_ok=True)
                  assert not f.exists()
                  f.write_text(src,encoding='utf-8')
                  raw=src.encode('utf-8')
                  d=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  manifest.append({'path':'/'.join(here),'kind':item.get('class'),'blob':d})
              for child in item.findall('Item'):walk(child,here)
          for item in root.findall('Item'):walk(item)
          assert len(manifest)==83
          assert len({x['path'] for x in manifest})==83
          (target/'manifest.json').write_text(json.dumps(manifest,indent=2))
          project={'name':'P0DActualSiegeBeastSolo7Armament83','tree':{'$className':'DataModel',
            'ReplicatedStorage':{'$className':'ReplicatedStorage',
              'TrapRaidersShared':{'$path':'src/ReplicatedStorage/TrapRaidersShared'}},
            'ServerScriptService':{'$className':'ServerScriptService',
              'TrapRaidersS1':{'$path':'src/ServerScriptService/TrapRaidersS1'}},
            'StarterPlayer':{'$className':'StarterPlayer',
              'StarterPlayerScripts':{'$path':'src/StarterPlayer/StarterPlayerScripts'}}}}
          (target/'default.project.json').write_text(json.dumps(project,indent=2))
          print('83_REAL_LUAU_PATH_CLASS_BLOB_MANIFEST_PREPARED')
          PY
      - name: Pinned Rojo 7.7.1 rebuild exact 83 class path and source GitBlob
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_83_rojo_release.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_83_rojo_release.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/p0d_83_rojo_release.zip') as z:
              entries=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='rojo']
              assert len(entries)==1
              file=Path('/tmp/p0d_83_rojo_binary')
              file.write_bytes(z.read(entries[0]))
              file.chmod(0o755)
          PY
          /tmp/p0d_83_rojo_binary build /tmp/p0d_83_rojo/default.project.json -o /tmp/p0d_83_rojo_rebuilt.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import hashlib,json
          want=json.loads(Path('/tmp/p0d_83_rojo/manifest.json').read_text())
          root=ET.fromstring(Path('/tmp/p0d_83_rojo_rebuilt.rbxlx').read_bytes())
          got=[]
          def walk(n,prior=()):
              p=n.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=prior+((name,) if name else ())
              if src is not None:
                  raw=src.encode('utf-8')
                  d=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  got.append({'path':'/'.join(here),'kind':n.get('class'),'blob':d})
              for c in n.findall('Item'):walk(c,here)
          for item in root.findall('Item'):walk(item)
          assert len(got)==len(want)==83
          assert {x['path']:(x['kind'],x['blob']) for x in got}=={
              x['path']:(x['kind'],x['blob']) for x in want}
          print('REAL_SEVEN_WEAPON_SIEGE_BEAST_SOLO_ROJO83_83_SOURCE_EXACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-QUALITY-REAL-CASTLE-BEAST-SOLO-7WEAPONS-PRIVATE83-NOGO
          path: /tmp/P0D_CASTLE_BEAST_SOLO_SEVEN_WEAPONS_PRIVATE83.zip
          retention-days: 7
