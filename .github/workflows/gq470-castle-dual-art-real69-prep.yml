name: GQ470 REAL69 guardian and gateHP selected compatibility PREP (not formal RC)
on:
  push:
    branches: [prep/gq470-castle-guardian-gatehp-compat-20261121]
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_castle_dual_art_20261121/**'
      - '.github/workflows/gq470-castle-dual-art-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-exact-two-source-castle-art:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Same-artifact real69 2-source composition of verified independent authors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile quality_gameplay/gq470_castle_dual_art_20261121/compose_guardian_gatehp69.py
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01 --jq .object.sha)" = "e80973c354f14a0d0088577f3cc1a875454f0f8f" || { echo RED_LIVE_HEAD; exit 1; }
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44695199140 --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44839337215 --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44839640921 --jq .conclusion)" = success
          mkdir -p /tmp/gq470-dual/{guardian,gatehp}
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir /tmp/gq470-dual
          gh run download 44839337215 --repo "$GITHUB_REPOSITORY" --name GQ470-GUARDIAN-SEVEN-SILHOUETTES-B220-NOT-FORMAL --dir /tmp/gq470-dual/guardian
          gh run download 44839640921 --repo "$GITHUB_REPOSITORY" --name GQ470-REAL69-CASTLE-GATEHP-MATTE-SOURCE-PREP-NOT-FORMAL --dir /tmp/gq470-dual/gatehp
          python3 -B quality_gameplay/gq470_castle_dual_art_20261121/compose_guardian_gatehp69.py --base /tmp/gq470-dual --guardian /tmp/gq470-dual/guardian --gatehp /tmp/gq470-dual/gatehp
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/gq470-dual/REAL69_LEGACY_INTAKE_RECEIPT.json").read_text())
          d=x["gq470_dual_candidate_957_958"]
          assert len(d["only_selected_routes_changed"])==2 and d["unchanged_selected_sources"]==67
          assert d["all_selected_routes_and_classes_unchanged"] and d["formal_integrated"] is False
          print("GQ470_DUAL_SELECTED_ONLY_2_CHANGED_67_EXACT_SOURCE_PASS")
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile all 69 selected Luau ON and OFF
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-dual-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-dual-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"quality_gameplay/gq470_castle_dual_art_20261121")
          from compose_guardian_gatehp69 import selected,TARGETS,OFF
          root=Path("/tmp/gq470-dual")
          on=selected(root); off=selected(root/"OFF69_GUARDIAN_GATEHP")
          assert len(on)==len(off)==69 and set(on)==set(off)
          assert {k for k in on if on[k].read_bytes()!=off[k].read_bytes()}==set(TARGETS)
          for sources in (on,off):
              for src in sources.values():
                  subprocess.run(["/tmp/gq470-dual-luau/luau-compile","--text",str(src)],
                                 check=True,stdout=subprocess.DEVNULL)
          print("GQ470_DUAL_NATIVE_ON69_OFF69_PASS")
          PY
      - name: Exact Rojo ON/OFF Place and gate stage meter source nonloss gate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-dual-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-dual-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq470-dual-rojo.zip") as z:
              names=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
              assert len(names)==1
              p=Path("/tmp/gq470-dual-rojo")
              p.write_bytes(z.read(names[0]));p.chmod(0o755)
          PY
          /tmp/gq470-dual-rojo build /tmp/gq470-dual/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-dual/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          /tmp/gq470-dual-rojo build /tmp/gq470-dual/OFF69_GUARDIAN_GATEHP/EGGRUMBLE_REAL69.project.json -o /tmp/gq470-dual/OFF69_GUARDIAN_GATEHP_REBUILT.rbxlx
          cmp /tmp/gq470-dual/OFF69_GUARDIAN_GATEHP_REBUILT.rbxlx /tmp/gq470-dual/OFF69_GUARDIAN_GATEHP/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-dual/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-dual/EGGRUMBLE_REAL69_PRIVATE.rbxlx --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/gq470-dual/OFF69_GUARDIAN_GATEHP/EGGRUMBLE_REAL69.project.json --place /tmp/gq470-dual/OFF69_GUARDIAN_GATEHP_REBUILT.rbxlx --count 69
          python3 quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base /tmp/gq470-dual --report /tmp/gq470-dual/DUAL_CASTLE_LEGACY48_AUDIT.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path("/tmp/gq470-dual")
          f=r/"REAL69_LEGACY_INTAKE_RECEIPT.json"
          x=json.loads(f.read_text())
          x["gq470_dual_candidate_957_958"]["native_rojo_off69"]="PASS_SOURCE_ONLY"
          p=r/"EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          x["private_place_bytes"]=p.stat().st_size
          x["private_place_sha256"]=hashlib.sha256(p.read_bytes()).hexdigest()
          f.write_text(json.dumps(x,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print("GQ470_DUAL_ART_PRIVATE_CANDIDATE_BYTES",p.stat().st_size)
          PY
          python3 art_quality/gq470_real69_source_gate.py --root /tmp/gq470-dual --out /tmp/gq470-dual/DUAL_ART_SOURCE_ONLY.json --head e80973c354f14a0d0088577f3cc1a875454f0f8f
          echo GQ470_DUAL_NATIVE_ROJO_OFF_LEGACY48_PASS_NOT_ART_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-GUARDIAN-GATEHP-TWO-SOURCES-NOT-FORMAL
          path: |
            /tmp/gq470-dual/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-dual/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-dual/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-dual/sources/**
            /tmp/gq470-dual/OFF69_GUARDIAN_GATEHP_REBUILT.rbxlx
            /tmp/gq470-dual/DUAL_CASTLE_LEGACY48_AUDIT.json
            /tmp/gq470-dual/DUAL_ART_SOURCE_ONLY.json
          if-no-files-found: error
          retention-days: 7
