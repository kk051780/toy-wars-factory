name: GQ470 REAL69 ART6 composed A PREP (not formal RC)
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_art4_composite_real69_20261120/**'
      - '.github/workflows/gq470-art4-composite-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  art6-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin original real69 artifact and six existing code-delta authors
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=quality_gameplay/gq470_art4_composite_real69_20261120/compose_art4.py
          python3 -m py_compile "$SCRIPT"
          python3 -B "$SCRIPT" --self-test
          FORMAL=e80973c354f14a0d0088577f3cc1a875454f0f8f
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq .object.sha)" = "$FORMAL" || { echo RED_FORMAL_HEAD_MOVED; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44695199140" --jq '.head_sha+" "+.conclusion')" = "$FORMAL success"
          mkdir -p /tmp/gq470-art6/input /tmp/gq470-art6/patchers
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO \
            --dir /tmp/gq470-art6/input
          test -s /tmp/gq470-art6/input/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          while read -r pr head source_path blob candidate_path candidate_blob; do
            target="/tmp/gq470-art6/patchers/$(basename "$source_path")"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/contents/$source_path?ref=$head" --jq .content \
              | base64 --decode > "$target"
            test "$(git hash-object "$target")" = "$blob" || { echo "RED_PINNED_PATCHER_BLOB_$pr"; exit 1; }
            python3 -m py_compile "$target"
            if [ "$candidate_path" != "-" ]; then
              candidate="/tmp/gq470-art6/patchers/$(basename "$candidate_path")"
              gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/contents/$candidate_path?ref=$head" --jq .content | base64 --decode > "$candidate"
              test "$(git hash-object "$candidate")" = "$candidate_blob" || { echo "RED_PINNED_CANDIDATE_BLOB_$pr"; exit 1; }
              mkdir -p "$(dirname "$candidate_path")"
              cp "$candidate" "$candidate_path"
            fi
            python3 -B "$target" --self-test
            echo "PINNED_A_SOURCE_$pr $head"
          done < <(python3 -B "$SCRIPT" --manifest)
          python3 -B "$SCRIPT" --formal /tmp/gq470-art6/input \
            --patchers /tmp/gq470-art6/patchers --out /tmp/gq470-art6/candidate
          python3 -B "$SCRIPT" --verify /tmp/gq470-art6/candidate
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Native Luau compilation ON69 and original OFF69
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq470-art6-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq470-art6-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq470_art4_composite_real69_20261120')
          from compose_art4 import selected,changed_routes,data_map,SLICES
          root=Path('/tmp/gq470-art6/candidate')
          changed_routes(data_map(root/'OFF69_ART6_ORIGINAL'),data_map(root),
                         {x.target for x in SLICES})
          for base in (root,root/'OFF69_ART6_ORIGINAL'):
              files=selected(base)
              assert len(files)==69
              for path in files.values():
                  subprocess.run(['/tmp/gq470-art6-luau/luau-compile','--text',str(path)],
                                 check=True,stdout=subprocess.DEVNULL)
          print('ART6_NATIVE_ON69_OFF69_6_CHANGED_63_EXACT_PASS')
          PY
      - name: Pinned Rojo 69, exact original OFF Place and legacy17/48
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq470-art6-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq470-art6-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq470-art6-rojo.zip') as z:
              names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(names)==1
              p=Path('/tmp/gq470-art6-rojo');p.write_bytes(z.read(names[0]));p.chmod(0o755)
          PY
          BASE=/tmp/gq470-art6/candidate
          /tmp/gq470-art6-rojo build "$BASE/EGGRUMBLE_REAL69.project.json" -o "$BASE/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          /tmp/gq470-art6-rojo build "$BASE/OFF69_ART6_ORIGINAL/EGGRUMBLE_REAL69.project.json" -o "$BASE/OFF69_ART6_REBUILT.rbxlx"
          cmp "$BASE/OFF69_ART6_REBUILT.rbxlx" "$BASE/OFF69_ART6_ORIGINAL/EGGRUMBLE_REAL69_PRIVATE.rbxlx"
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$BASE/EGGRUMBLE_REAL69.project.json" --place "$BASE/EGGRUMBLE_REAL69_PRIVATE.rbxlx" --count 69
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project "$BASE/OFF69_ART6_ORIGINAL/EGGRUMBLE_REAL69.project.json" --place "$BASE/OFF69_ART6_REBUILT.rbxlx" --count 69
          python3 quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base "$BASE" --report "$BASE/ART6_LEGACY48_AUDIT.json"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path('/tmp/gq470-art6/candidate')
          p=base/'EGGRUMBLE_REAL69_PRIVATE.rbxlx'
          rp=base/'REAL69_LEGACY_INTAKE_RECEIPT.json'
          rec=json.loads(rp.read_text())
          rec['private_place_bytes']=p.stat().st_size
          rec['private_place_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          rec['gq470_art6_composite']['native_rojo_off69']='PASS_SOURCE_ONLY'
          assert rec['canonical_build'] is False
          assert rec['gq470_art6_composite']['other_selected_sources_byte_exact']==63
          rp.write_text(json.dumps(rec,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print('ART6_CANDIDATE_PLACE_BYTES',p.stat().st_size)
          print('ART6_NOT_FORMAL_NOT_HUMAN_PASS')
          PY
          python3 -B quality_gameplay/gq470_art4_composite_real69_20261120/compose_art4.py --verify "$BASE"
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-ART6-COMPOSITE-PREP-NOT-FORMAL
          path: |
            /tmp/gq470-art6/candidate/EGGRUMBLE_REAL69.project.json
            /tmp/gq470-art6/candidate/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/gq470-art6/candidate/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/gq470-art6/candidate/sources/**
            /tmp/gq470-art6/candidate/OFF69_ART6_REBUILT.rbxlx
            /tmp/gq470-art6/candidate/ART6_LEGACY48_AUDIT.json
          if-no-files-found: error
          retention-days: 7
