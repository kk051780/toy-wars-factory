name: P0D H1 dojo plus original Sky V5 grounded ramps isolated private build
on:
  push:
    branches:
      - experiment/p0d-h1-dojo-sky-v5-unified-20261113-01
    paths:
      - 'handoffs/P0D-H1-DOJO-SKY-V5-UNIFIED-20261113-01/**'
      - '.github/workflows/p0d-h1-dojo-sky-v5-unified-20261113.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-original-45-plus-one-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run full original-authored assembly and one-world diff tests
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s handoffs/P0D-H1-DOJO-SKY-V5-UNIFIED-20261113-01/tests -p 'test_*.py' -v
      - name: Checkout pinned upstream Luau compiler and interpreter
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_native_luau
          fetch-depth: 1
          persist-credentials: false
      - name: Compile real native Luau toolchain
        run: |
          set -euo pipefail
          test "$(git -C _p0d_native_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_native_luau -B /tmp/p0d_h1_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_h1_luau --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
      - name: Compile all 45 integrated scripts and execute original solo and dojo policy
        shell: bash
        run: |
          set -euo pipefail
          DIST=handoffs/P0D-H1-DOJO-SKY-V5-UNIFIED-20261113-01/dist/P0D_B42_V7_SOLO_AUDIT_DOJO_SKY_GROUNDDOCK_V5_PRIVATE
          mkdir -p /tmp/p0d_h1_artifacts
          n=0
          while IFS= read -r -d '' src; do
            /tmp/p0d_h1_luau/luau-compile "$src" > /tmp/p0d_compile_log 2>&1 || { cat /tmp/p0d_compile_log; exit 1; }
            n=$((n+1))
          done < <(find "$DIST/src" -name '*.luau' -type f -print0)
          test "$n" -eq 45
          python3 -B handoffs/P0D-RC-B42V7-SKY-SOLO-20261113-01/tools/generate_native_studio_solo.py --write /tmp/p0d_h1_artifacts/solo_native.luau
          /tmp/p0d_h1_luau/luau /tmp/p0d_h1_artifacts/solo_native.luau | tee /tmp/p0d_h1_artifacts/SOLO_NATIVE.txt
          grep -F 'P0D_S1_STUDIO_SOLO_LATCH_NATIVE_40_ASSERTIONS_PASS' /tmp/p0d_h1_artifacts/SOLO_NATIVE.txt
          python3 -B handoffs/P0D-RC-B42V7-SKY-SOLO-DOJO-H1-20261113-01/tools/generate_native_dojo.py --write /tmp/p0d_h1_artifacts/dojo_native.luau
          /tmp/p0d_h1_luau/luau /tmp/p0d_h1_artifacts/dojo_native.luau | tee /tmp/p0d_h1_artifacts/DOJO_NATIVE.txt
          grep -F 'P0D_H1_DOJO_NATIVE_47_ASSERTIONS_PASS' /tmp/p0d_h1_artifacts/DOJO_NATIVE.txt
          echo P0D_H1_DOJO_SKY_V5_ALL_45_NATIVE_COMPILE_PASS
      - name: Download pinned verified Rojo7.7.1
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_h1_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_h1_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          import pathlib,zipfile,stat
          with zipfile.ZipFile('/tmp/p0d_h1_rojo.zip') as z:
              files=[x for x in z.namelist() if x.rsplit('/',1)[-1]=='rojo']
              assert len(files)==1
              p=pathlib.Path('/tmp/p0d_h1_rojo')
              p.write_bytes(z.read(files[0]))
              p.chmod(p.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH)
          PY
          /tmp/p0d_h1_rojo --version | grep -F '7.7.1'
      - name: Build genuine unpublished private Roblox Place and compare every embedded source
        run: |
          set -euo pipefail
          DIST=handoffs/P0D-H1-DOJO-SKY-V5-UNIFIED-20261113-01/dist/P0D_B42_V7_SOLO_AUDIT_DOJO_SKY_GROUNDDOCK_V5_PRIVATE
          PLACE=/tmp/p0d_h1_artifacts/P0D_H1_DOJO_SKY_GROUNDDOCK_V5_PRIVATE.rbxlx
          /tmp/p0d_h1_rojo build "$DIST/default.project.json" -o "$PLACE"
          cp "$DIST/SOURCE_LOCK.json" /tmp/p0d_h1_artifacts/SOURCE_LOCK.json
          python3 - <<'PY'
          import pathlib,hashlib,json,xml.etree.ElementTree as ET
          from collections import Counter
          p=pathlib.Path('/tmp/p0d_h1_artifacts/P0D_H1_DOJO_SKY_GROUNDDOCK_V5_PRIVATE.rbxlx')
          d=pathlib.Path('handoffs/P0D-H1-DOJO-SKY-V5-UNIFIED-20261113-01/dist/P0D_B42_V7_SOLO_AUDIT_DOJO_SKY_GROUNDDOCK_V5_PRIVATE')
          orig=Counter(s.read_text('utf8') for s in (d/'src').rglob('*.luau'))
          embed=Counter()
          kinds=Counter()
          names=Counter()
          for item in ET.fromstring(p.read_bytes()).iter('Item'):
              kind=item.get('class')
              if kind not in ('Script','LocalScript','ModuleScript'): continue
              source=item.find("./Properties/string[@name='Source']")
              if source is None: continue
              kinds[kind]+=1
              embed[source.text or '']+=1
              name=item.find("./Properties/string[@name='Name']")
              if name is not None: names[(kind,name.text)]+=1
          assert embed==orig and sum(embed.values())==45,(len(embed),len(orig))
          assert kinds=={'Script':2,'LocalScript':6,'ModuleScript':37},kinds
          assert names[('Script','Game')]==1
          assert names[('Script','H1FunWorld')]==1
          assert names[('ModuleScript','DojoRules')]==1
          assert names[('LocalScript','P0DStudioTrialAudit')]==1
          lock=json.loads((d/'SOURCE_LOCK.json').read_text('utf8'))
          assert lock['scripts_unchanged']==44 and lock['official_rc_adopted'] is False
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={'actual_unpublished_place_sha256':sha,
            'actual_unpublished_place_bytes':p.stat().st_size,
            'exact_luau_embedded_count':45,'world_only_changed':True,
            'native_compiled':True,'original_dojo_native_assertions':47,
            'original_solo_native_assertions':40,
            'real_roblox_studio':'NOT_TESTED','android':'NOT_TESTED',
            'human_fun':'NOT_TESTED','official_rc_adopted':False,
            'published':False,'paid':False}
          pathlib.Path('/tmp/p0d_h1_artifacts/PLACE_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('P0D_H1_DOJO_SKY_V5_REAL_ROJO_EXACT_45_SOURCE_PASS',sha)
          PY
      - name: Keep private-review place as temporary artifact only
        uses: actions/upload-artifact@v4
        with:
          name: P0D-H1-DOJO-V5-GROUNDDOCK-45-PRIVATE-UNPUBLISHED
          path: |
            /tmp/p0d_h1_artifacts/P0D_H1_DOJO_SKY_GROUNDDOCK_V5_PRIVATE.rbxlx
            /tmp/p0d_h1_artifacts/SOURCE_LOCK.json
            /tmp/p0d_h1_artifacts/PLACE_RECEIPT.json
            /tmp/p0d_h1_artifacts/SOLO_NATIVE.txt
            /tmp/p0d_h1_artifacts/DOJO_NATIVE.txt
          retention-days: 7
          if-no-files-found: error
