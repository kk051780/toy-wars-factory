name: GQ8 successor original weather42 neutral43 item43 full Native Rojo OFF
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - "quality_gameplay/gq8_integrated_item43_20261119/**"
      - ".github/workflows/gq8-successor-weather-neutral8-item43.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-selected-real43:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify formal branch and immutable upstream successor lineages
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')" = f77b4d4393d9e9b19b65566413432a7a9f13962b || { echo RED_FORMAL_RC_MOVED_REBASE; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/796" --jq '.head.sha')" = 34cafed1cb9e92e08bbc8f2afa67d50ae52a083a || { echo RED_WEATHER42_DRI_MOVED; exit 1; }
          echo "GQ8_NEUTRAL_AUTHOR_CURRENT_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/pulls/815" --jq '.head.sha') PINNED_SOURCE_HEAD=712a998aa1ad9491404e6a8fbbaee49f1017b4af"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/812" --jq '.head.sha')" = be1dbb2f9707d53d7f5ecd5e25e0ce5ef31ac2a8 || { echo RED_ITEM_AUTHOR_MOVED; exit 1; }
          mkdir -p artifacts/original artifacts/upstream
          gh run download 44319450066 --repo "$GITHUB_REPOSITORY" \
            --name GQ8-REAL42-GUARDIAN-WEATHER-ON-OFF-NOT-RC --dir artifacts/original
          test -s artifacts/original/portable42/EGGRUMBLE_SOURCE42_WEATHER.project.json
          test -s artifacts/original/portable42/EGGRUMBLE_SOURCE42_WEATHER.rbxlx
          for spec in \
            "3ed0ec0e1299fa8f8f0e78254daa444906a4f63c composer815.py" \
            "0f4774c543d60b91c261cc6e871d77aa937149cb EGGRUMBLE_SwarmCombat815.luau" \
            "42f512c4aaa389e0027be774c327e1f5a106aabf EGGRUMBLE_NeutralFinisherPolicy801.luau" \
            "2c81da640d465d27630840be2f1f5245bc7cd5db patch_item812.py"; do
            blob="$(echo "$spec" | cut -d' ' -f1)"
            file="$(echo "$spec" | cut -d' ' -f2)"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | base64 -d >"artifacts/upstream/$file"
            test "$(git hash-object "artifacts/upstream/$file")" = "$blob" || { echo RED_UPSTREAM_BLOB_DRIFT; exit 1; }
          done
          echo GQ8_FOUR_ORIGINAL_SOURCE_GIT_BLOBS_AND_AUTHOR_HEADS_PINNED
      - name: Compose original weather42 to neutral43 to real item43
        run: |
          set -euo pipefail
          python3 -B quality_gameplay/gq8_integrated_item43_20261119/compose_item43.py \
            --weather42 artifacts/original/portable42/EGGRUMBLE_SOURCE42_WEATHER.project.json \
            --composer815 artifacts/upstream/composer815.py \
            --swarm815 artifacts/upstream/EGGRUMBLE_SwarmCombat815.luau \
            --policy801 artifacts/upstream/EGGRUMBLE_NeutralFinisherPolicy801.luau \
            --patch812 artifacts/upstream/patch_item812.py \
            --neutral43 artifacts/neutral43/REAL43.project.json \
            --selected43 artifacts/item43/ITEM43.project.json \
            --portable43 artifacts/portable43/EGGRUMBLE_SOURCE43_ITEM.project.json
          python3 -B -m unittest discover -v -s quality_gameplay/gq8_integrated_item43_20261119 -p 'test_*.py'
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _gq8_native
          persist-credentials: false
      - name: Native compiler of all selected original and updated live-source routes
        run: |
          set -euo pipefail
          cmake -S _gq8_native -B /tmp/gq8-item43-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8-item43-native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, subprocess
          path=Path('quality_gameplay/gq8_integrated_item43_20261119/compose_item43.py')
          spec=importlib.util.spec_from_file_location('gq8',path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          for proj,expected in (
              ('artifacts/original/portable42/EGGRUMBLE_SOURCE42_WEATHER.project.json',42),
              ('artifacts/neutral43/REAL43.project.json',43),
              ('artifacts/item43/ITEM43.project.json',43),
              ('artifacts/portable43/EGGRUMBLE_SOURCE43_ITEM.project.json',43)):
              _,source=mod.flatten(Path(proj))
              assert len(source)==expected
              for file in source.values():
                  subprocess.run(['/tmp/gq8-item43-native/luau-compile','--text',str(file)],check=True,stdout=subprocess.DEVNULL)
              print('GQ8_REAL_SOURCES_NATIVE_ALL_PASS',expected,proj)
          patch=mod.load_python(Path('artifacts/upstream/patch_item812.py'),'pinned_item_patch')
          _,sources=mod.flatten(Path('artifacts/item43/ITEM43.project.json'))
          Path('/tmp/gq8_item_sculptures_vm.luau').write_text(patch.native_harness(sources[mod.ITEM].read_bytes()),encoding='utf-8')
          try:
              patch.apply(sources[mod.ITEM].read_bytes())
              raise AssertionError('RED_DOUBLE_PATCH_NOT_REJECTED')
          except ValueError as e:
              assert 'DOUBLE_PATCH' in str(e)
          try:
              patch.inverse(sources[mod.ITEM].read_bytes().replace(b'itemArt',b'badArt_'))
              raise AssertionError('RED_MUTATED_INVERSE_NOT_REJECTED')
          except ValueError:
              pass
          print('GQ8_ITEM_NEGATIVE_MUTATION_AND_ROLLBACK_PASS')
          PY
          /tmp/gq8-item43-native/luau /tmp/gq8_item_sculptures_vm.luau | grep -qx GQ802_REAL_ITEM_ART_NATIVE_VM_PASS_3_TYPES_9_PIECES_HIDE_RESPAWN
      - name: Pinned real Rojo Source Class exact, actual Place bytes and OFF43
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq8-item43-rojo.zip
          echo "00feb4fa0829a1dd72b49df2639da519a352fbe13cadcd83969e2ba2bb5693c4  /tmp/gq8-item43-rojo.zip" | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/gq8-item43-rojo.zip') as z:
              names=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(names)==1
              p=Path('/tmp/gq8-item43-rojo')
              p.write_bytes(z.read(names[0]));p.chmod(0o755)
          PY
          /tmp/gq8-item43-rojo build artifacts/original/portable42/EGGRUMBLE_SOURCE42_WEATHER.project.json -o artifacts/neutral43/OFF42.rbxlx
          /tmp/gq8-item43-rojo build artifacts/neutral43/REAL43.project.json -o artifacts/neutral43/NEUTRAL43.rbxlx
          /tmp/gq8-item43-rojo build artifacts/item43/ITEM43.project.json -o artifacts/item43/ITEM43.rbxlx
          /tmp/gq8-item43-rojo build artifacts/portable43/EGGRUMBLE_SOURCE43_ITEM.project.json -o artifacts/portable43/EGGRUMBLE_SOURCE43_ITEM.rbxlx
          cmp artifacts/neutral43/OFF42.rbxlx artifacts/original/portable42/EGGRUMBLE_SOURCE42_WEATHER.rbxlx
          cmp artifacts/item43/ITEM43.rbxlx artifacts/portable43/EGGRUMBLE_SOURCE43_ITEM.rbxlx
          for spec in \
            "artifacts/neutral43/OFF42.rbxlx artifacts/original/portable42/EGGRUMBLE_SOURCE42_WEATHER.project.json 42" \
            "artifacts/neutral43/NEUTRAL43.rbxlx artifacts/neutral43/REAL43.project.json 43" \
            "artifacts/item43/ITEM43.rbxlx artifacts/item43/ITEM43.project.json 43" \
            "artifacts/portable43/EGGRUMBLE_SOURCE43_ITEM.rbxlx artifacts/portable43/EGGRUMBLE_SOURCE43_ITEM.project.json 43"; do
            set -- $spec
            python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --place "$1" --project "$2" --count "$3"
          done
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from quality_gameplay.gq8_lss_real31_20261117.rehydrate_real31 import tree_scripts
          w=tree_scripts(ET.parse('artifacts/neutral43/OFF42.rbxlx').getroot())
          n=tree_scripts(ET.parse('artifacts/neutral43/NEUTRAL43.rbxlx').getroot())
          s=tree_scripts(ET.parse('artifacts/item43/ITEM43.rbxlx').getroot())
          assert set(n)-set(w)=={('ServerScriptService','EGGRUMBLE_NeutralFinisherPolicy')}
          assert {r for r in w if w[r]!=n[r]}=={('ServerScriptService','EGGRUMBLE_SwarmCombat')}
          assert {r for r in n if n[r]!=s[r]}=={('ServerScriptService','EGGRUMBLE_FieldItemPickups')}
          assert len(w)==42 and len(n)==len(s)==43
          print("GQ8_REAL42_TO_NEUTRAL43_TO_ITEM43_EXACT_ROUTE_CLASS_DIFF_PASS")
          PY
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('artifacts/item43/ITEM43.rbxlx')
          receipt=Path('artifacts/item43/INTEGRATED_ITEM43_RECEIPT.json')
          data=json.loads(receipt.read_text())
          data.update({'candidate_git_head':os.environ['GITHUB_SHA'],
            'samehead_native43':True,'rojo_source_class43':True,
            'portable_place_byte_exact':True,'off43_restore':True,
            'place_bytes':p.stat().st_size,'place_sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          receipt.write_text(json.dumps(data,sort_keys=True,indent=2,ensure_ascii=False)+'\n')
          print('GQ8_PRIVATE_ITEM43_BUILT_NOT_OFFICIAL',data['place_bytes'],data['place_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ8-WEATHER-NEUTRAL-ITEM43-B-PRIVATE-NOT-RC
          path: |
            artifacts/item43/ITEM43.project.json
            artifacts/item43/ITEM43.rbxlx
            artifacts/item43/INTEGRATED_ITEM43_RECEIPT.json
            artifacts/portable43/
            artifacts/neutral43/NEUTRAL43.rbxlx
          retention-days: 4
          if-no-files-found: error
