name: P0D S1 FTUE+result whole-game source native QA
on:
  push:
    branches:
      - handoff/p0d-s1-ftue-result-composite-20261112-01
permissions:
  contents: read
jobs:
  verify-real-source-composite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated complete source tree
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run actual original game tests and cross-file result integration QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s handoffs/P0D-S1-FTUE-RESULT-COMPOSITE-20261112-01/candidate/tests -p 'test*.py' -v
      - name: Run own original exact result patch Python tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s handoffs/P0D-S1-RESULT-LOCALIZATION-20261112-01/tests -p 'test*.py' -v
      - name: Checkout official pinned Luau compiler and interpreter
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _third_party_luau
          persist-credentials: false
          fetch-depth: 1
      - name: Build pinned native Luau compiler and REPL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _third_party_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _third_party_luau -B /tmp/p0d-s1-result-composite-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d-s1-result-composite-native --target Luau.Compile.CLI Luau.Repl.CLI --parallel 4
      - name: Compile ALL 20 actual combined Luau sources with positive-negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, tempfile
          root=pathlib.Path("handoffs/P0D-S1-FTUE-RESULT-COMPOSITE-20261112-01/candidate/src")
          sources=sorted(root.rglob("*.luau"))
          assert len(sources)==20, f"Expected exact 20 Luau sources, got {len(sources)}"
          c="/tmp/p0d-s1-result-composite-native/luau-compile"
          with tempfile.TemporaryDirectory() as td:
              good=pathlib.Path(td)/"control_good.luau"
              bad=pathlib.Path(td)/"control_bad.luau"
              good.write_text("local f: number = 3\nreturn f + 1\n")
              bad.write_text("local function bad( end")
              assert subprocess.run([c,"-O0",str(good)],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE).returncode==0
              assert subprocess.run([c,"-O0",str(bad)],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE).returncode!=0
          for i,path in enumerate(sources,1):
              r=subprocess.run([c,"-O0",str(path)],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=30)
              assert r.returncode==0, f"Native Luau fail at {path}: {r.stderr[-1200:]!r}"
              print(f"ACTUAL_COMPOSITE_NATIVE_LUAU_SOURCE_PASS {i}/20 {path.relative_to(root)}",flush=True)
          print("NATIVE_LUAU_FULL_COMPOSITE_20_OF_20_AND_NEGATIVE_CONTROL_PASS",flush=True)
          PY
      - name: Execute actual RESULT_COPY with pinned native Luau
        shell: bash
        run: |
          set -euo pipefail
          python3 handoffs/P0D-S1-RESULT-NATIVE-LUAU-REPLAY-20261112-02/tools/run_native_result_replay.py /tmp/p0d-s1-result-composite-native/luau-compile /tmp/p0d-s1-result-composite-native/luau
      - name: Ensure no source tracked file mutation
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
