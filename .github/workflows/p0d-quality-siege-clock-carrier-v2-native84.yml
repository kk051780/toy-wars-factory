name: P0D real AI egg carrier exits castle + server siege clock sync v2 native84
on:
  push:
    branches: [feature/p0d-product-quality-gate-20261115]
    paths:
      - product_quality/siege_bot_breach/egg_carrier_exit_clock_fix_v2.py
      - .github/workflows/p0d-quality-siege-clock-carrier-v2-native84.yml
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - product_quality/siege_bot_breach/egg_carrier_exit_clock_fix_v2.py
      - .github/workflows/p0d-quality-siege-clock-carrier-v2-native84.yml
permissions:
  contents: read
  actions: read
jobs:
  source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch immutable original source-validated 84 script AI siege Place
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_siege_v2_parent
          gh run download 43704941946 -R kk051780/toy-wars-factory \
            -n P0D-QUALITY-REAL-SOLO-AI-CASTLE-SIEGE-BREACH-RC84-NOGO \
            -D /tmp/p0d_siege_v2_parent
          test -s /tmp/p0d_siege_v2_parent/P0D_RC84_SIEGE_BOTS_PRIVATE.zip
      - name: Real Game source reproduce, all 84 dual locks, clock and carrier regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B product_quality/siege_bot_breach/egg_carrier_exit_clock_fix_v2.py \
            --parent /tmp/p0d_siege_v2_parent/P0D_RC84_SIEGE_BOTS_PRIVATE.zip \
            --out /tmp/P0D_SIEGE_CLOCK_CARRIER_V2.zip \
            --extract /tmp/p0d_siege_v2_84_sources
          python3 - <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          from zipfile import ZipFile
          sys.path.insert(0,'product_quality/siege_bot_breach')
          import egg_carrier_exit_clock_fix_v2 as x
          with ZipFile('/tmp/P0D_SIEGE_CLOCK_CARRIER_V2.zip') as z:
              receipt=json.loads(z.read('RECEIPT.json'))
              place=z.read(x.OUTPUT)
          assert receipt['script_count']==84
          assert receipt['other_82_script_bodies_byte_exact']
          assert receipt['one_server_clock_for_manual_and_bot_breach']
          assert receipt['carrier_breakout_while_egg_held']
          assert receipt['original_egg_score_winner_exact']
          assert receipt['source_dual_lock_exact']
          assert not receipt['official_rc_write'] and receipt['product']=='NO_GO'
          assert receipt['place_sha256']==hashlib.sha256(place).hexdigest()
          _,scripts=x.parent.source_nodes(place)
          assert len(scripts)==84
          assert len(list(Path('/tmp/p0d_siege_v2_84_sources').glob('*.luau')))==84
          mp=scripts['MapBuilder'].text
          bot=scripts['SoloTeamBots'].text
          assert 'local now=workspace:GetServerTimeNow()' in mp
          assert 'local now=os.clock()' not in mp
          assert 'breachLock=now+10' in mp and 'lastCommand=now' in mp
          assert 'lastSiegeAt=now' in mp
          assert 'fromInside' in mp and 'type(fromInside)~="boolean"' in mp
          assert 'enemyGate.breach(bot.team,bot.root.Position,now,' in bot
          assert 'isEscapingWithEgg=bot.carry==enemy' in bot
          assert 'callbacks.deposit(bot,bot.team,bot.carry)' in bot
          assert 'summonSevenBeast' in scripts['Game'].text
          assert 'SevenJobs.ArmamentM1.strike' in scripts['Game'].text
          assert 'SevenJobs.TrapperWarp.place' in scripts['Game'].text
          assert 'P0D_FB_CASTLE_WALKIN_SIEGE_V1' in mp
          for sign in (-1,1):
              gate=sign*85
              for inside in (False,True):
                  approach=gate+(sign*7 if inside else -sign*7)
                  assert abs(approach-gate)==7
                  assert (approach-gate)**2<=13**2
                  assert abs(approach-(gate+(sign*7 if inside else -sign*7)))<=4
                  wrong=gate+(-sign*7 if inside else sign*7)
                  assert abs(wrong-(gate+(sign*7 if inside else -sign*7)))>4
          for damaged in ('',x.parent.MAP_SIEGE_ORIGINAL,
                          x.parent.MAP_RETURN_NEW,x.parent.MAP_SLIDE_OLD):
              try:x.patch_map(damaged)
              except ValueError:pass
              else:raise AssertionError('STALE_GATE_OR_MIXED_CLOCK_ACCEPTED')
          for damaged in ('',x.parent.BOT_HIT_ANCHOR,
                          x.parent.BOT_GOAL_ANCHOR):
              try:x.patch_bots(damaged)
              except ValueError:pass
              else:raise AssertionError('STALE_BOT_EXIT_LOGIC_ACCEPTED')
          print('REAL_CLOCK_SYNC_AND_CARRIED_EGG_INSIDE_OUTSIDE_SIEGE_SAFETY_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_siege_v2_84_luau
          persist-credentials: false
      - name: Native compile ALL 84 actual Luau scripts including genuine Game
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_siege_v2_84_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_siege_v2_84_luau -B /tmp/p0d_siege_v2_84_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_siege_v2_84_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' f; do
            /tmp/p0d_siege_v2_84_build/luau-compile "$f" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_siege_v2_84_sources -name '*.luau' -type f -print0 | sort -z)
          test "$n" -eq 84
          echo 'P0D_CLOCK_SYNC_EGG_CARRIER_GATE_EXIT_NATIVE84_PASS'
      - name: Reconstruct 84 original Roblox paths and types from the actual Place
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          import hashlib,json
          target=Path('/tmp/p0d_siege_v2_84_rojo')
          with ZipFile('/tmp/P0D_SIEGE_CLOCK_CARRIER_V2.zip') as z:
              root=ET.fromstring(z.read('P0D_RC84_SIEGE_EGG_CARRIER_ESCAPE_CLOCK_SAFE_PRIVATE.rbxlx'))
          types={'Script':'.server.luau','LocalScript':'.client.luau','ModuleScript':'.luau'}
          manifest=[]
          def walk(item,old=()):
              p=item.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=old+((name,) if name else ())
              if src is not None:
                  assert item.get('class') in types and len(here)>=3
                  assert here[0] in ('ReplicatedStorage','ServerScriptService','StarterPlayer')
                  assert all(t.isidentifier() for t in here)
                  f=target/'src'/Path(*here).with_suffix(types[item.get('class')])
                  f.parent.mkdir(parents=True,exist_ok=True)
                  assert not f.exists()
                  f.write_text(src,encoding='utf-8')
                  raw=src.encode('utf-8')
                  d=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  manifest.append({'path':'/'.join(here),'kind':item.get('class'),'blob':d})
              for child in item.findall('Item'):walk(child,here)
          for item in root.findall('Item'):walk(item)
          assert len(manifest)==84
          assert len({x['path'] for x in manifest})==84
          (target/'manifest.json').write_text(json.dumps(manifest,indent=2))
          project={'name':'P0DActualSiegeBeastSolo7Armament84','tree':{'$className':'DataModel',
            'ReplicatedStorage':{'$className':'ReplicatedStorage',
              'TrapRaidersShared':{'$path':'src/ReplicatedStorage/TrapRaidersShared'}},
            'ServerScriptService':{'$className':'ServerScriptService',
              'TrapRaidersS1':{'$path':'src/ServerScriptService/TrapRaidersS1'}},
            'StarterPlayer':{'$className':'StarterPlayer',
              'StarterPlayerScripts':{'$path':'src/StarterPlayer/StarterPlayerScripts'}}}}
          (target/'default.project.json').write_text(json.dumps(project,indent=2))
          print('84_REAL_LUAU_PATH_CLASS_BLOB_MANIFEST_PREPARED')
          PY
      - name: Pinned Rojo 7.7.1 rebuild exact 84 class path and source GitBlob
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_siege_v2_84_rojo_release.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_siege_v2_84_rojo_release.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/p0d_siege_v2_84_rojo_release.zip') as z:
              entries=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='rojo']
              assert len(entries)==1
              file=Path('/tmp/p0d_siege_v2_84_rojo_binary')
              file.write_bytes(z.read(entries[0]))
              file.chmod(0o755)
          PY
          /tmp/p0d_siege_v2_84_rojo_binary build /tmp/p0d_siege_v2_84_rojo/default.project.json -o /tmp/p0d_siege_v2_84_rojo_rebuilt.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import hashlib,json
          want=json.loads(Path('/tmp/p0d_siege_v2_84_rojo/manifest.json').read_text())
          root=ET.fromstring(Path('/tmp/p0d_siege_v2_84_rojo_rebuilt.rbxlx').read_bytes())
          got=[]
          def walk(n,prior=()):
              p=n.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=prior+((name,) if name else ())
              if src is not None:
                  raw=src.encode('utf-8')
                  d=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  got.append({'path':'/'.join(here),'kind':n.get('class'),'blob':d})
              for c in n.findall('Item'):walk(c,here)
          for item in root.findall('Item'):walk(item)
          assert len(got)==len(want)==84
          assert {x['path']:(x['kind'],x['blob']) for x in got}=={
              x['path']:(x['kind'],x['blob']) for x in want}
          print('P0D_CLOCK_SYNC_EGG_CARRIER_GATE_EXIT_ROJO84_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-QUALITY-SIEGE-CLOCK-CARRIER-EXIT-PRIVATE-RC84-NOGO
          path: /tmp/P0D_SIEGE_CLOCK_CARRIER_V2.zip
          retention-days: 7
