            "paid":False}
          pathlib.Path("/tmp/p0d_evolution_place/PLACE_EXACT_SOURCE.json").write_text(json.dumps(meta,indent=2)+"\n")
          print("P0D_EVOLUTION_REAL_ROJO_41_OF_41_EXACT_SOURCE_PASS",meta["sha256"])
          PY
      - name: Upload review-only private build, NEVER publish to Roblox
        uses: actions/upload-artifact@v4
        with:
          name: P0D-FIRST90-V5-41-LUAU-PRIVATE-STUDIO-RBXLX
          path: /tmp/p0d_evolution_place/
          retention-days: 7
          if-no-files-found: error
 /tmp/first90_policy.log
      - name: Get pinned Rojo7.7.1 with SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/p0d_evolution_rojo.zip
          printf '%s\n' '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_evolution_rojo.zip' | sha256sum -c
