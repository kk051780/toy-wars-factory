name: P0D V3 Real62 canonical HUD59 Trade3 same-head Native Rojo OFF59
on:
  push:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'rc_fastlane/EGGRUMBLE_V3_REAL62.json'
      - '.github/workflows/p0d-rc-eggrumble-v3-real62.yml'
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'rc_fastlane/EGGRUMBLE_V3_REAL62.json'
      - '.github/workflows/p0d-rc-eggrumble-v3-real62.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  real62-hud-trade-preserved:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lock latest Real59 official and immutable original Real59 + Real55 proof
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$CURRENT" = 5a47e96f6b4766a9c59dd06b111bea53b73bd5ca || { echo RED_PR_MUST_REBASE_TO_NEW_OFFICIAL; exit 1; }
          else
            test "$GITHUB_REF" = refs/heads/rc/p0d-s1-kids-rc01 && test "$CURRENT" = "$GITHUB_SHA" || { echo RED_NOT_SAME_OFFICIAL_HEAD; exit 1; }
          fi
          test "$(gh run view 44400478849 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')" = "116dc8f1d9bfe1b25a01ac2c5283bee966677429 success"
          test "$(gh run view 44393525211 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')" = "a6020867fac80fa3b2ca47478625873fc6f3678e success"
          python3 - <<'PY'
          import json,subprocess
          m=json.load(open("rc_fastlane/EGGRUMBLE_V3_REAL62.json"))
          assert m["prior_official_sha"]=="5a47e96f6b4766a9c59dd06b111bea53b73bd5ca"
          assert m["parent_source_count"]==59 and m["source_count"]==62
          assert m["guarantees"]["no_new_store_owner"]==0
          assert not m["guarantees"]["trade_settlement_enabled"]
          assert m["guarantees"]["no_public_publish"] is True
          for path,sha in m["new_source_locks"].items():
            got=subprocess.check_output(["git","hash-object",path],text=True).strip()
            assert got==sha,("RED_REAL62_TRADE_AUTHOR_SOURCE_DRIFT",path,got,sha)
          print("GQ8_FORMAL_REAL62_NEW3_AUTHOR_SOURCE_LOCK_PASS")
          PY
          python3 - <<'PY'
          import json,subprocess
          p=json.load(open("rc_fastlane/EGGRUMBLE_V3_REAL59.json"))
          assert p["source_count"]==59 and p["parent_source_count"]==55
          assert p["prior_official_sha"]=="a6020867fac80fa3b2ca47478625873fc6f3678e"
          for filename,sha in p["source_locks"].items():
           current=subprocess.check_output(["git","hash-object",filename],text=True).strip()
           assert sha==current,(filename,sha,current)
          print("GQ8_REAL62_PRESERVE_4_HUD_REAL59_OFFICIAL_GIT_BLOB_LOCK_PASS")
          PY
          test "$(gh run view 44403383782 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha+" "+.conclusion')" = "4c6d1ab74144d4790d075ef35feb96a43f7ffa4d success" || { echo RED_REAL59_P0_HOST_NOT_VERIFIED; exit 1; }
          mkdir -p artifacts/real59 artifacts/official55 artifacts/host59
          gh run download 44400478849 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL59-HUD-MAP-CANONICAL-PRIVATE-STUDIO --dir artifacts/real59
          gh run download 44393525211 --repo "$GITHUB_REPOSITORY" \
            --name P0D-EGGRUMBLE-V3-REAL55-CANONICAL-PRIVATE-STUDIO --dir artifacts/official55
          gh run download 44403383782 --repo "$GITHUB_REPOSITORY" \
            --name GQ8-REAL59-HOST-ACTIVE-NOT-OFFICIAL --dir artifacts/host59
          test -s artifacts/real59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx
          test -s artifacts/real59/GQ828_REAL59_RECEIPT.json
          test -s artifacts/official55/EGGRUMBLE_REAL55.rbxlx
          test -s artifacts/official55/B_REAL55_RECEIPT.json
          test -s artifacts/host59/EGGRUMBLE_REAL59_HOST_ACTIVE.rbxlx
          test -s artifacts/host59/HOST_ACTIVE_RECEIPT.json
          echo GQ8_REAL62_IMMUTABLE_SOURCE_ARTIFACTS_DOWNLOAD_PASS
      - name: Compose verified 59 + 3 without overwriting any official source
        shell: bash
        run: |
          set -euo pipefail
          R=quality_gameplay/gq8_trade_ux_journal_20261119
          python3 "$R/compose_real62.py" \
            --real59 artifacts/real59/EGGRUMBLE_REAL59_HUD_MAP_PRIVATE.rbxlx \
            --receipt59 artifacts/real59/GQ828_REAL59_RECEIPT.json \
            --host59 artifacts/host59/EGGRUMBLE_REAL59_HOST_ACTIVE.rbxlx \
            --hostreceipt artifacts/host59/HOST_ACTIVE_RECEIPT.json \
            --official55 artifacts/official55/EGGRUMBLE_REAL55.rbxlx \
            --out artifacts/union62
          python3 - <<'PY'
          from pathlib import Path
          import sys,json
          sys.path.insert(0,"quality_gameplay/gq8_successor_real48_shop_20261119")
          from compose_real48 import flatten,klass
          base=Path("artifacts/union62/off59/GQ8_REAL59_HOST_ACTIVE_CANDIDATE_NOT_OFFICIAL.project.json")
          new=Path("artifacts/union62/on62/GQ8_REAL62_OFFICIAL59_HUD_PLUS_TRADE_NO_GRANT.project.json")
          _,old=flatten(base);_,n=flatten(new)
          assert len(old)==59 and len(n)==62
          assert set(n)-set(old)=={
            ("ServerScriptService","GQ8_TradeJournalContract"),
            ("ServerScriptService","GQ8_TradeEscrowReducer"),
            ("StarterPlayer","StarterPlayerScripts","GQ8_TradeReview")}
          assert all(old[k].read_bytes()==n[k].read_bytes() and klass(old[k])==klass(n[k]) for k in old)
          for route,filename in {
              ("ServerScriptService","GQ8_TradeJournalContract"):"GQ8_TradeJournalContract.luau",
              ("ServerScriptService","GQ8_TradeEscrowReducer"):"GQ8_TradeEscrowReducer.luau",
              ("StarterPlayer","StarterPlayerScripts","GQ8_TradeReview"):"GQ8_TradeReview.client.luau"
          }.items():
              assert n[route].read_bytes()==Path("quality_gameplay/gq8_trade_ux_journal_20261119",filename).read_bytes()
          m=json.loads(Path("artifacts/union62/B_REAL62_RECEIPT.json").read_text())
          assert m["official55_sources_byte_exact"]==55 and m["official59_sources_byte_exact"]==59
          assert not m["live_trade"] and not m["robux"]
          print("GQ8_REAL62_EXACT_REAL59_59_OF59_PRESERVED_PLUS3_SCOPE_ONLY_PASS")
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile real 59 and 62; execute two-account trade VM adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/gq8union62 -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq8union62 --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys
          sys.path.insert(0,"quality_gameplay/gq8_successor_real48_shop_20261119")
          from compose_real48 import flatten
          for name,num in [
            ("artifacts/union62/off59/GQ8_REAL59_HOST_ACTIVE_CANDIDATE_NOT_OFFICIAL.project.json",59),
            ("artifacts/union62/on62/GQ8_REAL62_OFFICIAL59_HUD_PLUS_TRADE_NO_GRANT.project.json",62)]:
            _,src=flatten(Path(name))
            assert len(src)==num
            for f in src.values():
                subprocess.run(["/tmp/gq8union62/luau-compile","--text",str(f)],stdout=subprocess.DEVNULL,check=True)
            print("GQ8_REAL62_NATIVE_SOURCE_COMPILE_PASS",num)
          PY
          R=quality_gameplay/gq8_trade_ux_journal_20261119
          /tmp/gq8union62/luau "$R/test_escrow_native.luau" | tee /tmp/gq8_union_escrow.log
          grep -q GQ8_TRADE58_ESCROW_REDUCER_TWO_ACCOUNT_RESERVE_DEBIT_CREDIT_COMMIT_REPLAY_PAID_FAILCLOSED_PASS /tmp/gq8_union_escrow.log
          /tmp/gq8union62/luau "$R/test_journal_native.luau" | tee /tmp/gq8_union_journal.log
          grep -q GQ8_TRADE_JOURNAL_NATIVE_ORDER_REPLAY_RECOVERY_SESSION_LOCK_CONTRACT_PASS /tmp/gq8_union_journal.log
      - name: Actual pinned Rojo62 and byte-identical OFF59 Place plus exact source/class
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq8union62-rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq8union62-rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq8union62-rojo.zip") as z:
            hits=[n for n in z.namelist() if n.split("/")[-1]=="rojo"]
            assert len(hits)==1
            p=Path("/tmp/gq8union62-rojo")
            p.write_bytes(z.read(hits[0]));p.chmod(0o755)
          PY
          /tmp/gq8union62-rojo build artifacts/union62/on62/GQ8_REAL62_OFFICIAL59_HUD_PLUS_TRADE_NO_GRANT.project.json -o artifacts/union62/EGGRUMBLE_REAL62_TRADE_HUD_UNION_PRIVATE.rbxlx
          /tmp/gq8union62-rojo build artifacts/union62/off59/GQ8_REAL59_HOST_ACTIVE_CANDIDATE_NOT_OFFICIAL.project.json -o artifacts/union62/OFF59.rbxlx
          cmp artifacts/union62/OFF59.rbxlx artifacts/host59/EGGRUMBLE_REAL59_HOST_ACTIVE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/union62/on62/GQ8_REAL62_OFFICIAL59_HUD_PLUS_TRADE_NO_GRANT.project.json \
            --place artifacts/union62/EGGRUMBLE_REAL62_TRADE_HUD_UNION_PRIVATE.rbxlx --count 62
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify \
            --project artifacts/union62/off59/GQ8_REAL59_HOST_ACTIVE_CANDIDATE_NOT_OFFICIAL.project.json \
            --place artifacts/union62/OFF59.rbxlx --count 59
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01" --jq '.object.sha')"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$CURRENT" = 5a47e96f6b4766a9c59dd06b111bea53b73bd5ca || { echo RED_OFFICIAL_MOVED_DURING_PR; exit 1; }
          else
            test "$CURRENT" = "$GITHUB_SHA" || { echo RED_OFFICIAL_HEAD_CHANGED_AFTER_BUILD; exit 1; }
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          base=Path("artifacts/union62")
          pl=base/"EGGRUMBLE_REAL62_TRADE_HUD_UNION_PRIVATE.rbxlx"
          off=base/"OFF59.rbxlx"
          rp=base/"B_REAL62_RECEIPT.json"
          data=json.loads(rp.read_text())
          data.update({"candidate_git_head":os.environ["GITHUB_SHA"],
            "actual_compiler":"PASS","actual_vm":"PASS","rojo_source_class62":"PASS",
            "rollback_off59":"BYTE_IDENTICAL","real62_place_bytes":pl.stat().st_size,
            "real62_place_sha256":hashlib.sha256(pl.read_bytes()).hexdigest(),
            "off59_place_sha256":hashlib.sha256(off.read_bytes()).hexdigest(),
            "official_rc_adopted":os.environ["GITHUB_REF"]=="refs/heads/rc/p0d-s1-kids-rc01"})
          rp.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          print("GQ8_REAL62_HUD_REAL59_TRADE3_NATIVE_ROJO_OFF59_PRIVATE_PASS",pl.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: P0D-EGGRUMBLE-V3-REAL62-CANONICAL-PRIVATE-STUDIO
          path: artifacts/union62/
          retention-days: 4
          if-no-files-found: error
