name: P0D GQ S12 V3 spectator 22-source native Rojo (unpublished)
on:
  push:
    branches:
      - 'quality/eggrumble-v3-spectator-20261116-s12'
    paths:
      - 'handoffs/P0D-GQ-SPECTATE-20261116-S12/**'
      - '.github/workflows/p0d-eggrumble-v3-spectator-s12.yml'
  pull_request:
    paths:
      - 'handoffs/P0D-GQ-SPECTATE-20261116-S12/**'
      - '.github/workflows/p0d-eggrumble-v3-spectator-s12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spectator-source-and-private-place:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout isolated candidate, no persisted credential
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm original-author fixed base (read only)
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9 HEAD
          test -f handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_LobbyCastleModesPreview.server.luau
          echo "ORIGINAL_AUTHOR_BASE_ANCESTOR_PASS"
      - name: Isolated Python source contracts
        run: |
          python3 -B -m unittest discover -v -s handoffs/P0D-GQ-SPECTATE-20261116-S12/tests -p 'test_*.py'
      - name: Checkout exact official open-source Luau CLI source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau_fixed
          persist-credentials: false
      - name: Native parse all 22 manifest-mapped source files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _luau_fixed rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _luau_fixed -B /tmp/gq_s12_luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/gq_s12_luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          path=Path("handoffs/P0D-GQ-SPECTATE-20261116-S12/EGGRUMBLE_SPECTATOR_STUDIO.project.json").resolve()
          tree=json.loads(path.read_text())["tree"]
          names=[]
          def walk(node):
              if isinstance(node,dict):
                  if "$path" in node:
                      yield (path.parent/node["$path"]).resolve(strict=True)
                  else:
                      for key,value in node.items():
                          if not key.startswith("$"):
                              yield from walk(value)
          paths=list(walk(tree))
          assert len(paths)==22,paths
          assert len(set(paths))==22
          for file in paths:
              assert file.suffix==".luau",file
              subprocess.run(["/tmp/gq_s12_luau/luau-compile","--text",str(file)],check=True,stdout=subprocess.DEVNULL)
              names.append(file.name)
          assert len([n for n in names if n.endswith(".client.luau")])==3,names
          assert len([n for n in names if n.endswith(".server.luau")])==1,names
          print("GQ_S12_NATIVE_LUAU_22_OF_22_PASS")
          PY
      - name: Acquire SHA-locked Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq_s12_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq_s12_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/gq_s12_rojo.zip') as z:
              members=[x for x in z.namelist() if x.split('/')[-1]=='rojo']
              assert len(members)==1,members
              out=Path('/tmp/gq_s12_rojo')
              out.write_bytes(z.read(members[0]))
              out.chmod(0o755)
          PY
          /tmp/gq_s12_rojo --version
      - name: Build unpublished 22-source Studio Place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          /tmp/gq_s12_rojo build handoffs/P0D-GQ-SPECTATE-20261116-S12/EGGRUMBLE_SPECTATOR_STUDIO.project.json -o artifacts/EGGRUMBLE_V3_GQ_S12_PRIVATE_NOT_RC.rbxlx
      - name: Verify embedded Place script sources are exactly the manifest sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path("handoffs/P0D-GQ-SPECTATE-20261116-S12/EGGRUMBLE_SPECTATOR_STUDIO.project.json").resolve()
          place=Path("artifacts/EGGRUMBLE_V3_GQ_S12_PRIVATE_NOT_RC.rbxlx")
          data=json.loads(path.read_text(encoding="utf-8"))
          expected={}
          def walk(node):
              for name,entry in node.items():
                  if name.startswith("$") or not isinstance(entry,dict):continue
                  if "$path" in entry:
                      file=(path.parent/entry["$path"]).resolve(strict=True)
                      assert name not in expected,name
                      expected[name]=file.read_text(encoding="utf-8").replace("\r\n","\n")
                  else:walk(entry)
          walk(data["tree"])
          assert len(expected)==22,len(expected)
          actual={}
          for item in ET.fromstring(place.read_bytes()).iter('Item'):
              if item.attrib.get("class") not in ("ModuleScript","Script","LocalScript"):continue
              props=item.find('Properties')
              if props is None:continue
              name=props.findtext("string[@name='Name']")
              source=props.findtext("ProtectedString[@name='Source']")
              if source is None:source=props.findtext("string[@name='Source']")
              if name:
                  assert name not in actual,name
                  actual[name]=(source or "").replace("\r\n","\n")
          assert set(actual)==set(expected),(set(expected)-set(actual),set(actual)-set(expected))
          for name,source in expected.items():
              assert actual[name]==source,('SOURCE_MISMATCH',name)
          (Path('artifacts')/'SOURCE_RECEIPT.json').write_text(
              json.dumps({'kind':'UNPUBLISHED_SOURCE_QA_ONLY','source_count':len(expected),
                          'place_sha256':hashlib.sha256(place.read_bytes()).hexdigest(),
                          'source_sha256':{k:hashlib.sha256(v.encode()).hexdigest() for k,v in expected.items()},
                          'studio_play':'NOT_TESTED','official_rc':'NOT_INTEGRATED',
                          'android':'NOT_TESTED','owner_fun':'NO_GO'},indent=2),encoding='utf-8')
          print('GQ_S12_ROJO_22_OF_22_SOURCE_EXACT_PASS')
          PY
      - name: Archive read-only local candidate (NOT official RC)
        uses: actions/upload-artifact@v4
        with:
          name: GQ-S12-PRIVATE-22SOURCE-NOT-RC
          path: |
            artifacts/EGGRUMBLE_V3_GQ_S12_PRIVATE_NOT_RC.rbxlx
            artifacts/SOURCE_RECEIPT.json
          retention-days: 2
