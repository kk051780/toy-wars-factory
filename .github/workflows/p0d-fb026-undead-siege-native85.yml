name: P0D FB026 3 Stage Loot Weapons + 3 Undead source exact private86 native Luau Rojo
on:
  push:
    branches: [feature/p0d-fb026-undead-siege-native85-20261115]
    paths:
      - quality_repair/FB026_UNDEAD_SIEGE/**
      - .github/workflows/p0d-fb026-undead-siege-native85.yml
  pull_request:
    branches: [feature/p0d-product-quality-gate-20261115]
permissions:
  contents: read
  actions: read
jobs:
  real86:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain immutable native85 stage loot+castle+egg+trapper parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fb026_85_parent
          gh run download 43709500167 -R kk051780/toy-wars-factory \
            -n P0D-QUALITY-REAL-THREE-STAGE-WEAPON-LOOT-RC85-NOGO \
            -D /tmp/fb026_85_parent
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          p=list(Path('/tmp/fb026_85_parent').rglob('*.zip'))
          assert len(p)==1, p
          dest=Path('quality_repair/FB026_UNDEAD_SIEGE/stage_loot_parent85.zip')
          with ZipFile(dest,'w',ZIP_DEFLATED) as z: z.write(p[0],p[0].name)
          PY
      - name: Exact RC86 rebuild and 24-case regression suite
        run: |
          set -euo pipefail
          cd quality_repair/FB026_UNDEAD_SIEGE
          python3 -m unittest -v test_rc86.py
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('P0D_RC86_SIEGE_V3_STAGE_WEAPONS_UNDEAD_PRIVATE.rbxlx')
          data=p.read_bytes()
          assert len(data)==843641, len(data)
          assert hashlib.sha256(data).hexdigest()=='11fa894c4ebfa2303e3f7cef8590d14a6a26f359699b6eda3d2e692bc161c707'
          receipt=json.loads(Path('RECEIPT.json').read_text())
          assert receipt['script_count']==86 and receipt['unchanged_existing_scripts']==84
          assert receipt['official_rc_write'] is False and receipt['product']=='NO_GO'
          PY
      - name: Extract all 86 script class/path/body identities into real Rojo tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,xml.etree.ElementTree as ET
          root=ET.fromstring(Path('quality_repair/FB026_UNDEAD_SIEGE/P0D_RC86_SIEGE_V3_STAGE_WEAPONS_UNDEAD_PRIVATE.rbxlx').read_bytes())
          dst=Path('/tmp/p0d_fb026_rojo86')
          exts={'Script':'.server.luau','LocalScript':'.client.luau','ModuleScript':'.luau'}
          found=[]
          def walk(item,base=()):
              p=item.find('Properties')
              name=p.findtext("string[@name='Name']") if p is not None else None
              src=p.findtext("string[@name='Source']") if p is not None else None
              here=base+((name,) if name else ())
              if src is not None:
                  assert item.attrib['class'] in exts and len(here)>=3
                  assert here[0] in ('ServerScriptService','StarterPlayer','ReplicatedStorage')
                  assert all(x.isidentifier() for x in here)
                  path=dst/'src'/Path(*here).with_suffix(exts[item.attrib['class']])
                  path.parent.mkdir(parents=True,exist_ok=True)
                  assert not path.exists(),path
                  path.write_text(src,encoding='utf-8')
                  b=src.encode('utf-8')
                  sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                  found.append({'path':'/'.join(here),'class':item.attrib['class'],'blob':sha})
              for c in item.findall('Item'):walk(c,here)
          for n in root.findall('Item'):walk(n)
          assert len(found)==86, len(found)
          (dst/'manifest.json').write_text(json.dumps(found,indent=2))
          project={'name':'P0DFB026UndeadStageLootPrivate86','tree':{'$className':'DataModel',
            'ReplicatedStorage':{'$className':'ReplicatedStorage','TrapRaidersShared':{'$path':'src/ReplicatedStorage/TrapRaidersShared'}},
            'ServerScriptService':{'$className':'ServerScriptService','TrapRaidersS1':{'$path':'src/ServerScriptService/TrapRaidersS1'}},
            'StarterPlayer':{'$className':'StarterPlayer','StarterPlayerScripts':{'$className':'StarterPlayerScripts','$path':'src/StarterPlayer/StarterPlayerScripts'}}}}
          (dst/'default.project.json').write_text(json.dumps(project,indent=2))
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _fb026_pinned_luau
          persist-credentials: false
      - name: Real native Luau compile all 86 scripts including Game+Undead+Loot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _fb026_pinned_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _fb026_pinned_luau -B /tmp/fb026_luau_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/fb026_luau_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' src; do
            /tmp/fb026_luau_build/luau-compile "$src" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_fb026_rojo86/src -name '*.luau' -type f -print0 | sort -z)
          test "$n" -eq 86
          echo P0D_FB026_NATIVE_86_86_PASS
      - name: Pin Rojo and verify all 86 real class/path/GitBlob identities
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/fb026_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/fb026_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/fb026_rojo.zip') as z:
              xs=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='rojo']
              assert len(xs)==1
              p=Path('/tmp/fb026_rojo_bin');p.write_bytes(z.read(xs[0]));p.chmod(0o755)
          PY
          /tmp/fb026_rojo_bin build /tmp/p0d_fb026_rojo86/default.project.json -o /tmp/p0d_fb026_rojo86_built.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib,json,xml.etree.ElementTree as ET
          want=json.loads(Path('/tmp/p0d_fb026_rojo86/manifest.json').read_text())
          root=ET.fromstring(Path('/tmp/p0d_fb026_rojo86_built.rbxlx').read_bytes())
          got=[]
          def walk(item,base=()):
              prop=item.find('Properties')
              name=prop.findtext("string[@name='Name']") if prop is not None else None
              source=prop.findtext("string[@name='Source']") if prop is not None else None
              here=base+((name,) if name else ())
              if source is not None:
                  b=source.encode('utf-8')
                  blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                  got.append({'path':'/'.join(here),'class':item.attrib['class'],'blob':blob})
              for child in item.findall('Item'):walk(child,here)
          for item in root.findall('Item'):walk(item)
          assert len(got)==86, len(got)
          assert Counter((x['path'],x['class'],x['blob']) for x in got)==Counter((x['path'],x['class'],x['blob']) for x in want)
          print('P0D_FB026_NATIVE_ROJO_86_86_PATH_CLASS_GITBLOB_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P0D-FB026-UNDEAD-STAGE-LOOT-PRIVATE86-SOURCE-NOGO
          path: |
            quality_repair/FB026_UNDEAD_SIEGE/P0D_RC86_SIEGE_V3_STAGE_WEAPONS_UNDEAD_PRIVATE.rbxlx
            quality_repair/FB026_UNDEAD_SIEGE/SOURCE_LOCK.json
            quality_repair/FB026_UNDEAD_SIEGE/RC_FEATURE_LOCK.json
            quality_repair/FB026_UNDEAD_SIEGE/RECEIPT.json
          if-no-files-found: warn
          retention-days: 7
