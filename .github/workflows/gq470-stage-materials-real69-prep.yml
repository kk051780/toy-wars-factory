name: GQ470 REAL69 Stage Theme Materials A PREP
on:
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - 'quality_gameplay/gq470_stage_materials_real69_20261121/**'
      - '.github/workflows/gq470-stage-materials-real69-prep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-exact-stage-finish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Immutable official REAL69 source patch + local negative tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/rc/p0d-s1-kids-rc01 --jq .object.sha)" = "e80973c354f14a0d0088577f3cc1a875454f0f8f" || { echo RED_STALE_OFFICIAL; exit 1; }
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44695199140 --jq '.head_sha+" "+.conclusion')" = "e80973c354f14a0d0088577f3cc1a875454f0f8f success"
          mkdir -p /tmp/stage-theme
          gh run download 44695199140 --repo "$GITHUB_REPOSITORY" --name P0D-EGGRUMBLE-V3-REAL69-CANONICAL-PRIVATE-STUDIO --dir /tmp/stage-theme
          python3 -m py_compile quality_gameplay/gq470_stage_materials_real69_20261121/patch_stage_materials.py
          python3 -B quality_gameplay/gq470_stage_materials_real69_20261121/patch_stage_materials.py --self-test
          python3 -B quality_gameplay/gq470_stage_materials_real69_20261121/patch_stage_materials.py --base /tmp/stage-theme
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _pinned_luau
          persist-credentials: false
      - name: Compile all selected Luau 69 ON / OFF
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _pinned_luau -B /tmp/stage-theme-luau -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/stage-theme-luau --target Luau.Compile.CLI --parallel 4
          python3 - <<'PY'
          import sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'quality_gameplay/gq470_stage_materials_real69_20261121')
          import patch_stage_materials as m
          r=Path('/tmp/stage-theme')
          a,b=m.selected(r),m.selected(r/m.OFF)
          assert len(a)==len(b)==69 and set(a)==set(b)
          assert [k for k in a if a[k].read_bytes()!=b[k].read_bytes()]==[m.ROUTE]
          for selected in (a,b):
              for f in selected.values():
                  subprocess.run(['/tmp/stage-theme-luau/luau-compile','--text',str(f)],stdout=subprocess.DEVNULL,check=True)
          print('GQ470_STAGE_THEME_REAL69_NATIVE_69ON_69OFF_PASS')
          PY
      - name: Pinned Rojo ON/OFF original Place byte-inverse + source audits
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/rojo-stage.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/rojo-stage.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/rojo-stage.zip') as z:
              xs=[n for n in z.namelist() if n.split('/')[-1]=='rojo']
              assert len(xs)==1
              target=Path('/tmp/stage-rojo')
              target.write_bytes(z.read(xs[0]))
              target.chmod(0o755)
          PY
          /tmp/stage-rojo build /tmp/stage-theme/EGGRUMBLE_REAL69.project.json -o /tmp/stage-theme/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          /tmp/stage-rojo build /tmp/stage-theme/OFF69_STAGE_MATERIALS/EGGRUMBLE_REAL69.project.json -o /tmp/stage-theme/STAGE_ORIGINAL_REBUILT.rbxlx
          cmp /tmp/stage-theme/STAGE_ORIGINAL_REBUILT.rbxlx /tmp/stage-theme/OFF69_STAGE_MATERIALS/EGGRUMBLE_REAL69_PRIVATE.rbxlx
          python3 quality_gameplay/gq8_lss_real31_20261117/rehydrate_real31.py verify --project /tmp/stage-theme/EGGRUMBLE_REAL69.project.json --place /tmp/stage-theme/EGGRUMBLE_REAL69_PRIVATE.rbxlx --count 69
          python3 quality_gameplay/gq8_rc85_rc86_real69_nonloss_20261120/verify_real69.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --self-test
          python3 quality_gameplay/gq8_rc85_rc86_real69_feature_truth_20261120/audit_legacy48.py --base /tmp/stage-theme --report /tmp/stage-theme/STAGE_THEME_LEGACY48_AUDIT.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('/tmp/stage-theme')
          f=r/'EGGRUMBLE_REAL69_PRIVATE.rbxlx'
          p=r/'REAL69_LEGACY_INTAKE_RECEIPT.json'
          receipt=json.loads(p.read_text())
          receipt['private_place_bytes']=f.stat().st_size
          receipt['private_place_sha256']=hashlib.sha256(f.read_bytes()).hexdigest()
          p.write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('GQ470_STAGE_THEME_PRIVATE_CANDIDATE_PLACE_BYTES',f.stat().st_size)
          PY
      - name: Official ART420 source-only gate, never fabricated Studio success
        shell: bash
        run: |
          set -euo pipefail
          python3 art_quality/gq470_real69_source_gate.py --root /tmp/stage-theme --head e80973c354f14a0d0088577f3cc1a875454f0f8f --out /tmp/stage-theme/ART_CHECK_REPORT.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/stage-theme/ART_CHECK_REPORT.json').read_text())
          assert a['source_gate']['status']=='PASS_SOURCE_ONLY'
          assert a['source_gate']['actual_place_scripts']==69
          assert a['visual_evidence_gate']['screenshots_received']==0
          assert a['visual_evidence_gate']['screenshots_required']==32
          assert a['art_gate']=='ART_NO_GO' and a['owner_accepted'] is False
          print('GQ470_STAGE_ART_SOURCE_ONLY_STUDIO_MOBILE_HUMAN_NOT_TESTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GQ470-REAL69-STAGE-THEME-MATERIALS-A-PREP-NOT-FORMAL
          path: |
            /tmp/stage-theme/EGGRUMBLE_REAL69.project.json
            /tmp/stage-theme/EGGRUMBLE_REAL69_PRIVATE.rbxlx
            /tmp/stage-theme/REAL69_LEGACY_INTAKE_RECEIPT.json
            /tmp/stage-theme/sources/**
            /tmp/stage-theme/STAGE_ORIGINAL_REBUILT.rbxlx
            /tmp/stage-theme/STAGE_THEME_LEGACY48_AUDIT.json
            /tmp/stage-theme/ART_CHECK_REPORT.json
            /tmp/stage-theme/B220_STAGE_MATERIALS_ONE_SOURCE_ONLY_NOT_FORMAL/**
          if-no-files-found: error
          retention-days: 7
