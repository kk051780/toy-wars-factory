name: P0D GQ neutral current-owner 28-source identity native and private Place
on:
  push:
    branches:
      - quality/gq-neutral-ko-fence-20261116
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-private-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact owner #482 Game
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          path: _v3_original
          persist-credentials: false
      - name: Existing #484 latest spatial bot author and composition
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 2aeb4fd856657c9298a2763d9204d0c9d9b031cb
          path: _v3_quality
          persist-credentials: false
      - name: Exact #485 ART author
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: e86702c906bdf9c71adcdf769ae48a206b26607b
          path: _v3_art
          persist-credentials: false
      - name: Exact #487 SCORE owner
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: 438a406ccfda5563053d783d7561797ccd364361
          path: _v3_score
          persist-credentials: false
      - name: Existing #494 neutral throughput / KO-end author
        uses: actions/checkout@v4
        with:
          repository: kk051780/toy-wars-factory
          ref: af8cd79f4217d187429270d29e6d44eb01725ff2
          path: _neutral494
          persist-credentials: false
      - name: Pinned Luau compiler and executable VM
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _luau_fixed
          persist-credentials: false
      - name: Inspect exact owner commits and run scope regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _v3_original rev-parse HEAD)" = fe67d31bc8d1b3e481cd22d2be9ea54a1eb031c9
          test "$(git -C _v3_quality rev-parse HEAD)" = 2aeb4fd856657c9298a2763d9204d0c9d9b031cb
          test "$(git -C _v3_art rev-parse HEAD)" = e86702c906bdf9c71adcdf769ae48a206b26607b
          test "$(git -C _v3_score rev-parse HEAD)" = 438a406ccfda5563053d783d7561797ccd364361
          test "$(git -C _neutral494 rev-parse HEAD)" = af8cd79f4217d187429270d29e6d44eb01725ff2
          python3 -m unittest discover -s quality_gameplay/v3_neutral_ko_death_fence_20261116 -p 'test_*.py' -v
      - name: Native Luau exact module behavioral tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _luau_fixed -B /tmp/gq508_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build /tmp/gq508_native --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
          mkdir -p artifacts
          python3 quality_gameplay/v3_neutral_ko_death_fence_20261116/tools/build_native_harness.py --out artifacts/gq508_original_native.luau
          /tmp/gq508_native/luau-compile --text artifacts/gq508_original_native.luau >/dev/null
          /tmp/gq508_native/luau artifacts/gq508_original_native.luau | tee artifacts/GQ508_NATIVE.log
          grep -q 'EGGRUMBLE_KO_DEATH_FENCE_NATIVE_PASS checks=22' artifacts/GQ508_NATIVE.log
      - name: Compose 26 original author Game ART SCORE AI
        shell: bash
        run: |
          set -euo pipefail
          python3 _v3_art/handoffs/EGGRUMBLE-ART-SILHOUETTE-FIELD-20261116/tools/compose_current_v3_art.py \
            --target v3 \
            --author-project _v3_original/handoffs/P0D-PQG-SEVEN-HERO-PLAYABLE-20261116/EGGRUMBLE_V3_STUDIO.project.json \
            --out artifacts/GQ508_ART.project.json
          python3 _v3_quality/quality_repair/EGGRUMBLE_V3_GQ_CURRENT26_20261116/compose.py \
            --author _v3_original --quality _v3_quality --art _v3_art --score _v3_score \
            --art-project artifacts/GQ508_ART.project.json \
            --out artifacts/GQ508_ORIGINAL26.project.json
      - name: Reuse #494 author actual 27 source-neutral patch, then only append unique identity check
        shell: bash
        run: |
          set -euo pipefail
          python3 _neutral494/quality_gameplay/neutral_pacing/tools/compose_latest27.py \
            --base26 artifacts/GQ508_ORIGINAL26.project.json \
            --out artifacts/neutral27
          python3 quality_gameplay/v3_neutral_ko_death_fence_20261116/tools/compose_on_494.py \
            --base27 artifacts/neutral27/EGGRUMBLE_GQ_NEUTRAL27.project.json \
            --out artifacts/neutral28
      - name: Compile all exact 28 source bodies and native 494 pacing source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest=Path("artifacts/neutral28/EGGRUMBLE_GQ_NEUTRAL28.project.json").resolve()
          files=[]
          def walk(node):
              for k,child in node.items():
                  if k.startswith("$"): continue
                  if "$path" in child: files.append((manifest.parent/child["$path"]).resolve(strict=True))
                  else: walk(child)
          walk(json.loads(manifest.read_text(encoding="utf-8"))["tree"])
          assert len(files)==28
          for f in files:
              subprocess.run(["/tmp/gq508_native/luau-compile","--text",str(f)],check=True,stdout=subprocess.DEVNULL)
          print("GQ508_ALL_28_ORIGINAL_AND_COMBINED_LUAU_NATIVE_COMPILE_PASS")
          PY
          python3 _neutral494/quality_gameplay/neutral_pacing/tools/build_native_harness.py --out artifacts/neutral494_native.luau
          /tmp/gq508_native/luau artifacts/neutral494_native.luau | tee artifacts/NEUTRAL494_NATIVE.log
          grep -q 'NEUTRAL_PACING_NATIVE_PASS checks=27 15min_supply=36000' artifacts/NEUTRAL494_NATIVE.log
      - name: Build pinned Rojo private 28-source Place
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/gq508_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/gq508_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("/tmp/gq508_rojo.zip") as z:
              names=[s for s in z.namelist() if s.split("/")[-1]=="rojo"]
              assert len(names)==1
              p=Path("/tmp/gq508_rojo")
              p.write_bytes(z.read(names[0]))
              p.chmod(0o755)
          PY
          /tmp/gq508_rojo build artifacts/neutral28/EGGRUMBLE_GQ_NEUTRAL28.project.json \
            -o artifacts/neutral28/EGGRUMBLE_GQ_NEUTRAL28_PRIVATE.rbxlx
          python3 quality_gameplay/v3_neutral_ko_death_fence_20261116/tools/verify_28.py \
            --project artifacts/neutral28/EGGRUMBLE_GQ_NEUTRAL28.project.json \
            --place artifacts/neutral28/EGGRUMBLE_GQ_NEUTRAL28_PRIVATE.rbxlx
      - name: Archive private source candidate, not official RC
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P0D-GQ508-NEUTRAL-28-SOURCE-ONLY-NOT-RC
          retention-days: 3
          path: |
            artifacts/neutral28/EGGRUMBLE_GQ_NEUTRAL28_PRIVATE.rbxlx
            artifacts/neutral28/EGGRUMBLE_GQ_NEUTRAL28.project.json
            artifacts/neutral28/SOURCE28_RECEIPT.json
            artifacts/neutral28/PLACE28_RECEIPT.json
            artifacts/GQ508_NATIVE.log
            artifacts/NEUTRAL494_NATIVE.log
      - run: echo 'PRIVATE28_SOURCE_ONLY; OFFICIAL_RC_CAS=NOT_DONE; STUDIO_ANDROID_OWNER=NOT_TESTED'
