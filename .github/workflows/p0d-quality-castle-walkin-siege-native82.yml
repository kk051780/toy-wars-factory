name: P0D real walk-in castle gate siege 82 native and source lock
on:
  push:
    branches: [feature/p0d-product-quality-gate-20261115]
    paths:
      - product_quality/castle_siege_gate_cumulative.py
      - .github/workflows/p0d-quality-castle-walkin-siege-native82.yml
  pull_request:
    branches: [rc/p0d-s1-kids-rc01]
    paths:
      - product_quality/castle_siege_gate_cumulative.py
      - .github/workflows/p0d-quality-castle-walkin-siege-native82.yml
permissions:
  contents: read
  actions: read
jobs:
  real-82-source-castle-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch immutable native and Rojo82 Beast plus solo Game actual artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0d_castle_parent
          gh run download 43697714426 -R kk051780/toy-wars-factory \
            -n P0D-REAL-BEAST-SOLO-AI-CUMULATIVE-RC82-SOURCE-NOGO \
            -D /tmp/p0d_castle_parent
          test -s /tmp/p0d_castle_parent/P0D_BEAST_SOLO_NATIVE82_PRIVATE.zip
      - name: Produce real full castle Place; check 82 locks, egg and AI unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 -B product_quality/castle_siege_gate_cumulative.py \
            --parent /tmp/p0d_castle_parent/P0D_BEAST_SOLO_NATIVE82_PRIVATE.zip \
            --out /tmp/P0D_WALKIN_CASTLE_GATE_BEAST_SOLO_PRIVATE.zip \
            --extract /tmp/p0d_castle_all82
          python3 - <<'PY'
          import sys,json,zipfile
          from pathlib import Path
          sys.path.insert(0,'product_quality')
          import castle_siege_gate_cumulative as m
          for bad in ('',m.FUNCTION_ANCHOR,m.FUNCTION_ANCHOR*2,m.GATE_IMPL+m.FUNCTION_ANCHOR):
              try:m.build_source(bad)
              except ValueError:pass
              else:raise AssertionError('STALE_OR_DUPLICATE_MAP_ALLOWED')
          with zipfile.ZipFile('/tmp/P0D_WALKIN_CASTLE_GATE_BEAST_SOLO_PRIVATE.zip') as z:
              r=json.loads(z.read('RECEIPT.json'))
          assert r['scripts']==82 and r['unchanged_parent_scripts']==81
          assert r['source_lock_exact'] and r['other_game_solo_score_sources_exact']
          assert r['gate_default_open_for_bots'] and r['castle_entrance_real_collision']
          assert r['private_default_off'] and not r['official_rc_write']
          assert r['product']=='NO_GO' and r['studio']=='NOT_RUN'
          ms=Path('/tmp/p0d_castle_all82/MapBuilder.luau').read_text()
          assert ms.count('makeDefensibleGate(base,name,sign,accent)')==2
          for mark in ('doorwayClear','SiegeGateAction','P0D_PRIVATE_SIEGE_GATES',
                       't.Name==name','task.delay(9','Game'):
              if mark!='Game':assert mark in ms
          game=Path('/tmp/p0d_castle_all82/Game.luau').read_text()
          bot=Path('/tmp/p0d_castle_all82/SoloTeamBots.luau').read_text()
          assert 'summonSevenBeast' in game and 'privateSoloBotsTrialAllowed()' in game
          assert 'callbacks.deposit(bot,bot.team,bot.carry)' in bot
          assert len(list(Path('/tmp/p0d_castle_all82').glob('*.luau')))==82
          print('REAL_WALKIN_CASTLE_GATE_SOURCE_AND_81_SCRIPT_PRESERVATION_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: f46d879e28302a430029304f7f6a162aed66f103
          path: _p0d_pinned_luau
          persist-credentials: false
      - name: Native compile ALL 82 real source scripts incl castle MapBuilder
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _p0d_pinned_luau rev-parse HEAD)" = f46d879e28302a430029304f7f6a162aed66f103
          cmake -S _p0d_pinned_luau -B /tmp/p0d_castle_luau_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DLUAU_BUILD_CLI=ON
          cmake --build /tmp/p0d_castle_luau_build --target Luau.Compile.CLI --parallel 4
          n=0
          while IFS= read -r -d '' f; do
            /tmp/p0d_castle_luau_build/luau-compile "$f" >/dev/null
            n=$((n+1))
          done < <(find /tmp/p0d_castle_all82 -type f -name '*.luau' -print0 | sort -z)
          test "$n" -eq 82
          echo 'REAL_CASTLE_WALKIN_SIEGE_BEAST_SOLO_NATIVE82_PASS_NOT_STUDIO'
      - name: Reconstruct all 82 actual Roblox source paths and classes for Rojo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          from zipfile import ZipFile
          target=Path('/tmp/p0d_castle_siege_rojo')
          target.mkdir(parents=True,exist_ok=True)
          with ZipFile('/tmp/P0D_WALKIN_CASTLE_GATE_BEAST_SOLO_PRIVATE.zip') as z:
              data=z.read('P0D_CASTLE_WALKIN_SIEGE_GATE_BEAST_SOLO_PRIVATE_RC82.rbxlx')
          root=ET.fromstring(data)
          kinds={'Script':'.server.luau','LocalScript':'.client.luau','ModuleScript':'.luau'}
          manifest=[]
          def visit(node,anc=()):
              props=node.find('Properties')
              name=props.findtext("string[@name='Name']") if props is not None else None
              src=props.findtext("string[@name='Source']") if props is not None else None
              path=anc+((name,) if name else ())
              if src is not None:
                  assert node.get('class') in kinds
                  assert path[0] in ('ReplicatedStorage','ServerScriptService','StarterPlayer')
                  assert all(p.isidentifier() for p in path)
                  f=target/'src'/Path(*path).with_suffix(kinds[node.get('class')])
                  f.parent.mkdir(parents=True,exist_ok=True)
                  assert not f.exists()
                  f.write_text(src,encoding='utf-8')
                  raw=src.encode('utf-8')
                  blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  manifest.append({'path':'/'.join(path),'kind':node.get('class'),'blob':blob})
              for child in node.findall('Item'):
                  visit(child,path)
          for item in root.findall('Item'):
              visit(item)
          assert len(manifest)==82
          (target/'manifest.json').write_text(json.dumps(manifest,indent=2))
          project={'name':'P0DOriginalBeastSoloActual82','tree':{'$className':'DataModel',
            'ReplicatedStorage':{'$className':'ReplicatedStorage',
              'TrapRaidersShared':{'$path':'src/ReplicatedStorage/TrapRaidersShared'}},
            'ServerScriptService':{'$className':'ServerScriptService',
              'TrapRaidersS1':{'$path':'src/ServerScriptService/TrapRaidersS1'}},
            'StarterPlayer':{'$className':'StarterPlayer',
              'StarterPlayerScripts':{'$path':'src/StarterPlayer/StarterPlayerScripts'}}}}
          (target/'default.project.json').write_text(json.dumps(project,indent=2))
          print('EXACT_ACTUAL_BEAST_SOLO_RC82_ROJO_PATHS_PREPARED')
          PY
      - name: Pinned Rojo 7.7.1 script path class and source GitBlob parity 82/82
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            -o /tmp/p0d_castle_siege_rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/p0d_castle_siege_rojo.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/p0d_castle_siege_rojo.zip') as z:
              match=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='rojo']
              assert len(match)==1
              p=Path('/tmp/p0d_castle_siege_rojo_binary')
              p.write_bytes(z.read(match[0]));p.chmod(0o755)
          PY
          /tmp/p0d_castle_siege_rojo_binary build /tmp/p0d_castle_siege_rojo/default.project.json \
            -o /tmp/p0d_castle_siege_rojo_source_only.rbxlx
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,xml.etree.ElementTree as ET
          expected=json.loads(Path('/tmp/p0d_castle_siege_rojo/manifest.json').read_text())
          root=ET.fromstring(Path('/tmp/p0d_castle_siege_rojo_source_only.rbxlx').read_bytes())
          actual=[]
          def visit(node,anc=()):
              props=node.find('Properties')
              name=props.findtext("string[@name='Name']") if props is not None else None
              src=props.findtext("string[@name='Source']") if props is not None else None
              path=anc+((name,) if name else ())
              if src is not None:
                  raw=src.encode('utf-8')
                  blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  actual.append({'path':'/'.join(path),'kind':node.get('class'),'blob':blob})
              for child in node.findall('Item'):
                  visit(child,path)
          for item in root.findall('Item'):
              visit(item)
          assert len(expected)==len(actual)==82
          assert {x['path']:(x['kind'],x['blob']) for x in expected}=={
              x['path']:(x['kind'],x['blob']) for x in actual}
          print('REAL_CASTLE_GATE_BEAST_SOLO_ROJO_82_82_SAME_CLASS_PATH_BLOB_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P0D-REAL-CASTLE-GATE-BEAST-SOLO-RC82-SOURCE-NOGO
          path: /tmp/P0D_WALKIN_CASTLE_GATE_BEAST_SOLO_PRIVATE.zip
          retention-days: 7
